<script id="guide-data" type="application/json">{"pages":[{"id":"index","path":"index.md","title":"当代提示词专家指南","description":"","type":"Index","group":"home","tags":[],"html":"<h1>当代提示词专家指南<\/h1>\n<h2 id=\"index-section-0\">让感受有落点，让生成有方向<\/h2>\n<p>不是把“梦幻、真实、高级”换成更长的句子，而是知道它们该由什么承载、怎样被看见与听见，又该在什么地方停笔。<\/p>\n<p>本书从13组AI影视教程的文字复审材料出发，重组为40篇主体知识与7篇参考，共47个可独立阅读和引用的知识单元。你可以顺着读，也可以按任务进入。案例、图谱和模板是创作设计与工作方法，不冒充已实测的生成配方。<\/p>\n<h2 id=\"index-section-1\">先读哪几篇<\/h2>\n<p><strong>建立方法<\/strong>：<a href=\"#/foundations/02-six-layer-method\">六层转译<\/a> → <a href=\"#/foundations/03-three-drafts\">三种稿子<\/a> → <a href=\"#/language/01-sensory-translation\">通感转译<\/a> → <a href=\"#/cases/01-brand-film\">一个品牌片案例<\/a>。<\/p>\n<p><strong>今天要写一条提示<\/strong>：先用<a href=\"#/language/06-rewrite-clinic\">改写诊所<\/a>，再选<a href=\"#/workflows/02-text-to-image\">文字生图<\/a>、<a href=\"#/workflows/03-image-edit\">改图<\/a>或<a href=\"#/workflows/04-image-to-video\">图生视频<\/a>。<\/p>\n<p><strong>作品很好看但没有表达<\/strong>：读<a href=\"#/language/02-association-workshop\">联想工作坊<\/a>、<a href=\"#/language/04-emotion-atlas\">情绪图谱<\/a>、<a href=\"#/language/05-atmosphere-atlas\">氛围图谱<\/a>，再回到<a href=\"#/practice/03-review-rubric\">评价表<\/a>。<\/p>\n<p><strong>团队或Agent复用<\/strong>：读<a href=\"#/practice/04-agent-use\">使用方式<\/a>与<a href=\"#/workflows/05-assets-multishot\">多镜头资产<\/a>，按任务检索，不把全书一次塞进上下文。<\/p>\n<h2 id=\"index-section-2\">本书的核心主张<\/h2>\n<p>感受可以抽象，承托它的关系要清楚；细节可以丰富，主次不能消失；控制关键事实，也为自然过渡留空间。写实、克制、低机位、手持、道具与音乐都只是选择，不是唯一正确答案。<\/p>\n<h2 id=\"index-section-3\">全部目录<\/h2>\n<h3 id=\"index-section-4\"><a href=\"#/foundations/index\">I · 基础框架<\/a><\/h3>\n<p>先理解这门手艺的对象与边界，掌握六层转译与三稿分工。<\/p>\n<ul>\n<li><a href=\"#/foundations/01-what-this-field-is\">01｜这门手艺，究竟在做什么<\/a><\/li>\n<li><a href=\"#/foundations/02-six-layer-method\">02｜六层转译：从感受到生成<\/a><\/li>\n<li><a href=\"#/foundations/03-three-drafts\">03｜感受稿、创作说明、执行稿<\/a><\/li>\n<li><a href=\"#/foundations/04-freedom-and-constraints\">04｜精确到哪里，留白在哪里<\/a><\/li>\n<li><a href=\"#/foundations/05-how-to-know\">05｜怎样知道一句提示真的有用<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-5\"><a href=\"#/language/index\">II · 通感与表达<\/a><\/h3>\n<p>练习把情绪、氛围和联想变成有主次的自然语言。<\/p>\n<ul>\n<li><a href=\"#/language/01-sensory-translation\">06｜通感不是堆比喻，是转移一种关系<\/a><\/li>\n<li><a href=\"#/language/02-association-workshop\">07｜怎样长出不落俗套的联想<\/a><\/li>\n<li><a href=\"#/language/03-scene-grammar\">08｜用人话组织画面：名词之外还有关系<\/a><\/li>\n<li><a href=\"#/language/04-emotion-atlas\">09｜情绪图谱：同一个词，可以有不同身体<\/a><\/li>\n<li><a href=\"#/language/05-atmosphere-atlas\">10｜氛围图谱：让抽象感觉有不同材料<\/a><\/li>\n<li><a href=\"#/language/06-rewrite-clinic\">11｜改写诊所：从标签、散文和过度控制中间穿过<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-6\"><a href=\"#/craft/index\">III · 视听专业<\/a><\/h3>\n<p>分别调动表演、摄影、美术、声音、剪辑与平面设计。<\/p>\n<ul>\n<li><a href=\"#/craft/01-acting\">12｜表演：让情绪有对象、有代价、有变化<\/a><\/li>\n<li><a href=\"#/craft/02-dialogue-voice\">13｜台词与声音：不是换一副嗓子，是换一种说话关系<\/a><\/li>\n<li><a href=\"#/craft/03-action-blocking\">14｜动作与调度：让物体有来处，让角色有去处<\/a><\/li>\n<li><a href=\"#/craft/04-camera-attention\">15｜镜头：不是更会运动，而是更会选择<\/a><\/li>\n<li><a href=\"#/craft/05-light-material\">16｜光与材质：让空气、表面和重量互相解释<\/a><\/li>\n<li><a href=\"#/craft/06-world-art-costume\">17｜美术与妆造：世界不是背景，身份不只是一张脸<\/a><\/li>\n<li><a href=\"#/craft/07-sound-music\">18｜音乐与声音：让看不见的东西改变画面<\/a><\/li>\n<li><a href=\"#/craft/08-still-graphic-style\">19｜静态图像、平面与风格化：不必把一张图写成电影<\/a><\/li>\n<li><a href=\"#/craft/09-time-montage\">20｜时间与剪辑：提示词里发生了，不代表观众来得及读<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-7\"><a href=\"#/workflows/index\">IV · 生成与迭代<\/a><\/h3>\n<p>把创作说明适配到具体任务，接续资产、输出与修复。<\/p>\n<ul>\n<li><a href=\"#/workflows/01-brief-to-options\">21｜从一句需求，到几个真正不同的方向<\/a><\/li>\n<li><a href=\"#/workflows/02-text-to-image\">22｜文字生图：先造一个可读的画面<\/a><\/li>\n<li><a href=\"#/workflows/03-image-edit\">23｜改图：指出位置，还要说清前后世界<\/a><\/li>\n<li><a href=\"#/workflows/04-image-to-video\">24｜图生视频：让已经存在的画面继续发生<\/a><\/li>\n<li><a href=\"#/workflows/05-assets-multishot\">25｜多镜头与资产：丰富地准备，克制地提交<\/a><\/li>\n<li><a href=\"#/workflows/06-previs\">26｜复杂镜头：什么时候该离开文字，做预演<\/a><\/li>\n<li><a href=\"#/workflows/07-evaluate-repair\">27｜评价与修复：别用“AI味”掩盖问题在哪<\/a><\/li>\n<li><a href=\"#/workflows/08-model-adaptation\">28｜工具适配：同一创意，不必使用同一段提示词<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-8\"><a href=\"#/cases/index\">V · 完整案例<\/a><\/h3>\n<p>八个原创设计案例，从感受到执行，再到验收和替代路线。<\/p>\n<ul>\n<li><a href=\"#/cases/01-brand-film\">29｜完整案例：30秒洗发水品牌片《留一点空隙》<\/a><\/li>\n<li><a href=\"#/cases/02-relationship\">30｜完整案例：餐桌上，一句没有被问完的话<\/a><\/li>\n<li><a href=\"#/cases/03-big-emotion\">31｜完整案例：喜悦真的可以冲出来<\/a><\/li>\n<li><a href=\"#/cases/04-vlog\">32｜完整案例：谁在拍谁——12秒咖啡馆Vlog<\/a><\/li>\n<li><a href=\"#/cases/05-empty-corridor\">33｜完整案例：空走廊为什么会让人等下去<\/a><\/li>\n<li><a href=\"#/cases/06-surreal-perfume\">34｜完整案例：不追求实拍的香水图与短动效<\/a><\/li>\n<li><a href=\"#/cases/07-comedy\">35｜完整案例：安静自习室里的零食袋<\/a><\/li>\n<li><a href=\"#/cases/08-object-exchange\">36｜完整案例：两份文件，谁最后拿着哪一份<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-9\"><a href=\"#/practice/index\">VI · 工具与练习<\/a><\/h3>\n<p>六张模板、十二项练习、评价表与团队调用方式。<\/p>\n<ul>\n<li><a href=\"#/practice/01-templates\">37｜可直接改用的工具箱：六张轻模板<\/a><\/li>\n<li><a href=\"#/practice/02-exercises\">38｜练习册：把会写变成会选、会看、会改<\/a><\/li>\n<li><a href=\"#/practice/03-review-rubric\">39｜评价表：作品表达对了吗，能继续制作吗<\/a><\/li>\n<li><a href=\"#/practice/04-agent-use\">40｜给创作助手与团队的用法<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-10\"><a href=\"#/references/index\">VII · 来源与理论<\/a><\/h3>\n<p>追溯13组教程、第一方技术依据与理论延展边界。<\/p>\n<ul>\n<li><a href=\"#/references/corpus\">资料范围：本书依据什么，不假装依据什么<\/a><\/li>\n<li><a href=\"#/references/official-image\">第一方依据：图像提示与图像编辑<\/a><\/li>\n<li><a href=\"#/references/official-video\">第一方依据：视频提示、运动与任务适配<\/a><\/li>\n<li><a href=\"#/references/official-voice-light\">第一方依据：配音停顿与灯光软硬<\/a><\/li>\n<li><a href=\"#/references/okf\">封装与维护：按上传skill的OKF v0.1交付<\/a><\/li>\n<li><a href=\"#/references/theory\">理论桥梁：借已有知识，不借虚假的权威<\/a><\/li>\n<li><a href=\"#/references/tutorial-map\">来源映射：13组教程进入了哪些知识<\/a><\/li>\n<\/ul>\n<h2 id=\"index-section-11\">阅读与使用边界<\/h2>\n<p>指南的直接输入是已提供的文字复审包，不补称原截图、视频与声音已完整核验。技术事实按有限的第一方资料校准；六层框架、图谱与案例属于本次综合，未运行生成实验。详见<a href=\"#/references/corpus\">资料范围<\/a>与<a href=\"#/references/theory\">理论桥梁<\/a>。<\/p>\n<p>封装按你上传的skill要求采用OKF v0.1；不是对当前公开最新规范的宣称。Markdown为内容源，工作区的离线HTML为派生阅读器。说明见<a href=\"#/references/okf\">封装与维护<\/a>。<\/p>\n","text":"# 当代提示词专家指南\n\n## 让感受有落点，让生成有方向\n\n不是把“梦幻、真实、高级”换成更长的句子，而是知道它们该由什么承载、怎样被看见与听见，又该在什么地方停笔。\n\n本书从13组AI影视教程的文字复审材料出发，重组为40篇主体知识与7篇参考，共47个可独立阅读和引用的知识单元。你可以顺着读，也可以按任务进入。案例、图谱和模板是创作设计与工作方法，不冒充已实测的生成配方。\n\n## 先读哪几篇\n\n**建立方法**：[六层转译](/foundations/02-six-layer-method.md) → [三种稿子](/foundations/03-three-drafts.md) → [通感转译](/language/01-sensory-translation.md) → [一个品牌片案例](/cases/01-brand-film.md)。\n\n**今天要写一条提示**：先用[改写诊所](/language/06-rewrite-clinic.md)，再选[文字生图](/workflows/02-text-to-image.md)、[改图](/workflows/03-image-edit.md)或[图生视频](/workflows/04-image-to-video.md)。\n\n**作品很好看但没有表达**：读[联想工作坊](/language/02-association-workshop.md)、[情绪图谱](/language/04-emotion-atlas.md)、[氛围图谱](/language/05-atmosphere-atlas.md)，再回到[评价表](/practice/03-review-rubric.md)。\n\n**团队或Agent复用**：读[使用方式](/practice/04-agent-use.md)与[多镜头资产](/workflows/05-assets-multishot.md)，按任务检索，不把全书一次塞进上下文。\n\n## 本书的核心主张\n\n感受可以抽象，承托它的关系要清楚；细节可以丰富，主次不能消失；控制关键事实，也为自然过渡留空间。写实、克制、低机位、手持、道具与音乐都只是选择，不是唯一正确答案。\n\n## 全部目录\n\n### [I · 基础框架](/foundations/index.md)\n\n先理解这门手艺的对象与边界，掌握六层转译与三稿分工。\n\n- [01｜这门手艺，究竟在做什么](/foundations/01-what-this-field-is.md)\n- [02｜六层转译：从感受到生成](/foundations/02-six-layer-method.md)\n- [03｜感受稿、创作说明、执行稿](/foundations/03-three-drafts.md)\n- [04｜精确到哪里，留白在哪里](/foundations/04-freedom-and-constraints.md)\n- [05｜怎样知道一句提示真的有用](/foundations/05-how-to-know.md)\n\n### [II · 通感与表达](/language/index.md)\n\n练习把情绪、氛围和联想变成有主次的自然语言。\n\n- [06｜通感不是堆比喻，是转移一种关系](/language/01-sensory-translation.md)\n- [07｜怎样长出不落俗套的联想](/language/02-association-workshop.md)\n- [08｜用人话组织画面：名词之外还有关系](/language/03-scene-grammar.md)\n- [09｜情绪图谱：同一个词，可以有不同身体](/language/04-emotion-atlas.md)\n- [10｜氛围图谱：让抽象感觉有不同材料](/language/05-atmosphere-atlas.md)\n- [11｜改写诊所：从标签、散文和过度控制中间穿过](/language/06-rewrite-clinic.md)\n\n### [III · 视听专业](/craft/index.md)\n\n分别调动表演、摄影、美术、声音、剪辑与平面设计。\n\n- [12｜表演：让情绪有对象、有代价、有变化](/craft/01-acting.md)\n- [13｜台词与声音：不是换一副嗓子，是换一种说话关系](/craft/02-dialogue-voice.md)\n- [14｜动作与调度：让物体有来处，让角色有去处](/craft/03-action-blocking.md)\n- [15｜镜头：不是更会运动，而是更会选择](/craft/04-camera-attention.md)\n- [16｜光与材质：让空气、表面和重量互相解释](/craft/05-light-material.md)\n- [17｜美术与妆造：世界不是背景，身份不只是一张脸](/craft/06-world-art-costume.md)\n- [18｜音乐与声音：让看不见的东西改变画面](/craft/07-sound-music.md)\n- [19｜静态图像、平面与风格化：不必把一张图写成电影](/craft/08-still-graphic-style.md)\n- [20｜时间与剪辑：提示词里发生了，不代表观众来得及读](/craft/09-time-montage.md)\n\n### [IV · 生成与迭代](/workflows/index.md)\n\n把创作说明适配到具体任务，接续资产、输出与修复。\n\n- [21｜从一句需求，到几个真正不同的方向](/workflows/01-brief-to-options.md)\n- [22｜文字生图：先造一个可读的画面](/workflows/02-text-to-image.md)\n- [23｜改图：指出位置，还要说清前后世界](/workflows/03-image-edit.md)\n- [24｜图生视频：让已经存在的画面继续发生](/workflows/04-image-to-video.md)\n- [25｜多镜头与资产：丰富地准备，克制地提交](/workflows/05-assets-multishot.md)\n- [26｜复杂镜头：什么时候该离开文字，做预演](/workflows/06-previs.md)\n- [27｜评价与修复：别用“AI味”掩盖问题在哪](/workflows/07-evaluate-repair.md)\n- [28｜工具适配：同一创意，不必使用同一段提示词](/workflows/08-model-adaptation.md)\n\n### [V · 完整案例](/cases/index.md)\n\n八个原创设计案例，从感受到执行，再到验收和替代路线。\n\n- [29｜完整案例：30秒洗发水品牌片《留一点空隙》](/cases/01-brand-film.md)\n- [30｜完整案例：餐桌上，一句没有被问完的话](/cases/02-relationship.md)\n- [31｜完整案例：喜悦真的可以冲出来](/cases/03-big-emotion.md)\n- [32｜完整案例：谁在拍谁——12秒咖啡馆Vlog](/cases/04-vlog.md)\n- [33｜完整案例：空走廊为什么会让人等下去](/cases/05-empty-corridor.md)\n- [34｜完整案例：不追求实拍的香水图与短动效](/cases/06-surreal-perfume.md)\n- [35｜完整案例：安静自习室里的零食袋](/cases/07-comedy.md)\n- [36｜完整案例：两份文件，谁最后拿着哪一份](/cases/08-object-exchange.md)\n\n### [VI · 工具与练习](/practice/index.md)\n\n六张模板、十二项练习、评价表与团队调用方式。\n\n- [37｜可直接改用的工具箱：六张轻模板](/practice/01-templates.md)\n- [38｜练习册：把会写变成会选、会看、会改](/practice/02-exercises.md)\n- [39｜评价表：作品表达对了吗，能继续制作吗](/practice/03-review-rubric.md)\n- [40｜给创作助手与团队的用法](/practice/04-agent-use.md)\n\n### [VII · 来源与理论](/references/index.md)\n\n追溯13组教程、第一方技术依据与理论延展边界。\n\n- [资料范围：本书依据什么，不假装依据什么](/references/corpus.md)\n- [第一方依据：图像提示与图像编辑](/references/official-image.md)\n- [第一方依据：视频提示、运动与任务适配](/references/official-video.md)\n- [第一方依据：配音停顿与灯光软硬](/references/official-voice-light.md)\n- [封装与维护：按上传skill的OKF v0.1交付](/references/okf.md)\n- [理论桥梁：借已有知识，不借虚假的权威](/references/theory.md)\n- [来源映射：13组教程进入了哪些知识](/references/tutorial-map.md)\n\n## 阅读与使用边界\n\n指南的直接输入是已提供的文字复审包，不补称原截图、视频与声音已完整核验。技术事实按有限的第一方资料校准；六层框架、图谱与案例属于本次综合，未运行生成实验。详见[资料范围](/references/corpus.md)与[理论桥梁](/references/theory.md)。\n\n封装按你上传的skill要求采用OKF v0.1；不是对当前公开最新规范的宣称。Markdown为内容源，工作区的离线HTML为派生阅读器。说明见[封装与维护](/references/okf.md)。","toc":[{"id":"index-section-0","title":"让感受有落点，让生成有方向"},{"id":"index-section-1","title":"先读哪几篇"},{"id":"index-section-2","title":"本书的核心主张"},{"id":"index-section-3","title":"全部目录"},{"id":"index-section-11","title":"阅读与使用边界"}]},{"id":"foundations/index","path":"foundations/index.md","title":"I · 基础框架","description":"","type":"Index","group":"foundations","tags":[],"html":"<h1>I · 基础框架<\/h1>\n<p>先理解这门手艺的对象与边界，掌握六层转译与三稿分工。<\/p>\n<ul>\n<li><p><a href=\"#/foundations/01-what-this-field-is\">01｜这门手艺，究竟在做什么<\/a> — 把当代提示词理解为跨媒介创作说明，而不是神秘语法或独立于创作的捷径。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/02-six-layer-method\">02｜六层转译：从感受到生成<\/a> — 用六个可来回检查的层次，连接观众体验、媒介选择与实际输入。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/03-three-drafts\">03｜感受稿、创作说明、执行稿<\/a> — 把联想的丰富与提交的清楚分开；不让诗意和工程互相挤占。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/04-freedom-and-constraints\">04｜精确到哪里，留白在哪里<\/a> — 锁定身份与关键结果，开放自然过渡；不把控制误写成保证。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/05-how-to-know\">05｜怎样知道一句提示真的有用<\/a> — 区分看见的事实、创作解释、工具承诺与实测结果。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# I · 基础框架\n\n先理解这门手艺的对象与边界，掌握六层转译与三稿分工。\n\n- [01｜这门手艺，究竟在做什么](/foundations/01-what-this-field-is.md) — 把当代提示词理解为跨媒介创作说明，而不是神秘语法或独立于创作的捷径。\n\n- [02｜六层转译：从感受到生成](/foundations/02-six-layer-method.md) — 用六个可来回检查的层次，连接观众体验、媒介选择与实际输入。\n\n- [03｜感受稿、创作说明、执行稿](/foundations/03-three-drafts.md) — 把联想的丰富与提交的清楚分开；不让诗意和工程互相挤占。\n\n- [04｜精确到哪里，留白在哪里](/foundations/04-freedom-and-constraints.md) — 锁定身份与关键结果，开放自然过渡；不把控制误写成保证。\n\n- [05｜怎样知道一句提示真的有用](/foundations/05-how-to-know.md) — 区分看见的事实、创作解释、工具承诺与实测结果。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"foundations/01-what-this-field-is","path":"foundations/01-what-this-field-is.md","title":"01｜这门手艺，究竟在做什么","description":"把当代提示词理解为跨媒介创作说明，而不是神秘语法或独立于创作的捷径。","type":"Framework","group":"foundations","tags":["总论","创作","边界"],"html":"<h1>01｜这门手艺，究竟在做什么<\/h1>\n<blockquote>\n<p>好的提示词，不只是把脑中的图说清楚。它还要替尚未出现的画面，选择一种值得被看见的方式。<\/p>\n<\/blockquote>\n<h2 id=\"foundations-01-what-this-field-is-section-0\">不是从“关键词”进化成“越长越像人话”<\/h2>\n<p>“雨夜、孤独、电影感”可以提供方向。“一个人坐在雨夜的餐厅里，孤独地望着窗外”变成了句子，却不一定增加了表达。变化真正发生在关系里：<\/p>\n<blockquote>\n<p>餐厅快打烊了。服务员已经把旁边的椅子倒扣上桌，他却仍把对面的那杯水留在原处。镜头不急着靠近，只在桌子另一端等着。<\/p>\n<\/blockquote>\n<p>这里没有证明他失恋，也不需要宣布他孤独。关门时间、空出的座位、被保留的杯子和摄影机的等待，共同给出一种读法。另一种同样成立的表达可以很直接：他哭到无法完整说完一句话。高级不等于藏，具体不等于啰嗦。<\/p>\n<p>本指南把这门手艺称作<strong>生成式视听创作说明<\/strong>：把表达意图翻译为可生成、可比较、可继续制作的图像与声音条件。这个名称及后文框架是本次综合提出的工作方法，不是已经被学界统一确认的学科定义。<\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-1\">它有新问题，也有旧根系<\/h2>\n<p>它的新问题是：语言、图片、视频、声音和界面参数一起影响一个有不确定性的生成过程；创作者不再直接移动每盏灯、每根骨骼，却仍要判断结果。它的旧根系是摄影、美术、表演、声音设计、剪辑、叙事、设计研究与试验方法。不是没有理论可借，而是没有一本旧书能替你完成这次跨媒介翻译。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>既有知识<\/th>\n<th>可以借来的能力<\/th>\n<th>不能直接推出的结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>摄影与美术<\/td>\n<td>组织空间、材质、光线和观看位置<\/td>\n<td>写了镜头型号就能精确模拟镜头<\/td>\n<\/tr>\n<tr>\n<td>表演与叙事<\/td>\n<td>目标、障碍、反应、关系变化<\/td>\n<td>每个镜头必须有隐藏秘密<\/td>\n<\/tr>\n<tr>\n<td>声音与剪辑<\/td>\n<td>先听后见、持续、间隙、转折<\/td>\n<td>音乐越多越有情绪<\/td>\n<\/tr>\n<tr>\n<td>感知与跨感官研究<\/td>\n<td>理解联想和注意力的可能路径<\/td>\n<td>某个颜色必然让所有人产生同一种感受<\/td>\n<\/tr>\n<tr>\n<td>试验方法<\/td>\n<td>比较方案、控制变量、积累失败证据<\/td>\n<td>一次好结果证明一句话普遍有效<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>理论连接的具体出处与限制见<a href=\"#/references/theory\">理论桥梁<\/a>。<\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-2\">当代不意味着旧写法全部作废<\/h2>\n<p>当前不同工具仍推荐不同的表达密度。Midjourney 的官方基础指南偏向简洁短句；Runway 的视频指南强调动作和时间组织；编辑任务又需要把“改什么”和“保留什么”说清。[2][3] 因此，关键词、完整句子、分段说明、参考图和结构化参数是不同工具，不是进化阶梯上彼此淘汰的物种。<\/p>\n<p>“电影感”“清爽”“梦幻”也不用一律删除。它们像乐曲的调性，可以先定方向；真正的问题是整段只有调性，没有旋律。保留有用的抽象词，再给它一两处可感知的支撑。<\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-3\">专家的能力边界<\/h2>\n<p>专家的价值是把模糊愿望变成有效选择，知道哪些选择交给参考，哪些交给文字，哪些应由人或后期完成。不是永远写得更长，也不是把导演、美术、摄影和声音的判断收归一个“提示词部门”。多人协作时，提示词作者负责让专业决定准确传递，而不是暗中重新导演。<\/p>\n<p>这本书的默认目标不是“去掉所有AI痕迹”，而是<strong>让作品的表达可信、形式自洽、生产可继续<\/strong>。纪录感、精致广告、二维插画、荒诞动画和梦境，各有自己的真实。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-image\">图像工具：第一方依据与适用边界<\/a>\n[3] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a>\n[4] <a href=\"#/references/theory\">理论桥梁：已有知识支持什么、不支持什么<\/a><\/p>\n<\/details>","text":"# 01｜这门手艺，究竟在做什么\n\n> 好的提示词，不只是把脑中的图说清楚。它还要替尚未出现的画面，选择一种值得被看见的方式。\n\n## 不是从“关键词”进化成“越长越像人话”\n\n“雨夜、孤独、电影感”可以提供方向。“一个人坐在雨夜的餐厅里，孤独地望着窗外”变成了句子，却不一定增加了表达。变化真正发生在关系里：\n\n> 餐厅快打烊了。服务员已经把旁边的椅子倒扣上桌，他却仍把对面的那杯水留在原处。镜头不急着靠近，只在桌子另一端等着。\n\n这里没有证明他失恋，也不需要宣布他孤独。关门时间、空出的座位、被保留的杯子和摄影机的等待，共同给出一种读法。另一种同样成立的表达可以很直接：他哭到无法完整说完一句话。高级不等于藏，具体不等于啰嗦。\n\n本指南把这门手艺称作**生成式视听创作说明**：把表达意图翻译为可生成、可比较、可继续制作的图像与声音条件。这个名称及后文框架是本次综合提出的工作方法，不是已经被学界统一确认的学科定义。\n\n## 它有新问题，也有旧根系\n\n它的新问题是：语言、图片、视频、声音和界面参数一起影响一个有不确定性的生成过程；创作者不再直接移动每盏灯、每根骨骼，却仍要判断结果。它的旧根系是摄影、美术、表演、声音设计、剪辑、叙事、设计研究与试验方法。不是没有理论可借，而是没有一本旧书能替你完成这次跨媒介翻译。\n\n| 既有知识 | 可以借来的能力 | 不能直接推出的结论 |\n| --- | --- | --- |\n| 摄影与美术 | 组织空间、材质、光线和观看位置 | 写了镜头型号就能精确模拟镜头 |\n| 表演与叙事 | 目标、障碍、反应、关系变化 | 每个镜头必须有隐藏秘密 |\n| 声音与剪辑 | 先听后见、持续、间隙、转折 | 音乐越多越有情绪 |\n| 感知与跨感官研究 | 理解联想和注意力的可能路径 | 某个颜色必然让所有人产生同一种感受 |\n| 试验方法 | 比较方案、控制变量、积累失败证据 | 一次好结果证明一句话普遍有效 |\n\n理论连接的具体出处与限制见[理论桥梁](/references/theory.md)。\n\n## 当代不意味着旧写法全部作废\n\n当前不同工具仍推荐不同的表达密度。Midjourney 的官方基础指南偏向简洁短句；Runway 的视频指南强调动作和时间组织；编辑任务又需要把“改什么”和“保留什么”说清。[2][3] 因此，关键词、完整句子、分段说明、参考图和结构化参数是不同工具，不是进化阶梯上彼此淘汰的物种。\n\n“电影感”“清爽”“梦幻”也不用一律删除。它们像乐曲的调性，可以先定方向；真正的问题是整段只有调性，没有旋律。保留有用的抽象词，再给它一两处可感知的支撑。\n\n## 专家的能力边界\n\n专家的价值是把模糊愿望变成有效选择，知道哪些选择交给参考，哪些交给文字，哪些应由人或后期完成。不是永远写得更长，也不是把导演、美术、摄影和声音的判断收归一个“提示词部门”。多人协作时，提示词作者负责让专业决定准确传递，而不是暗中重新导演。\n\n这本书的默认目标不是“去掉所有AI痕迹”，而是**让作品的表达可信、形式自洽、生产可继续**。纪录感、精致广告、二维插画、荒诞动画和梦境，各有自己的真实。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [图像工具：第一方依据与适用边界](/references/official-image.md)\n[3] [视频工具：第一方依据与适用边界](/references/official-video.md)\n[4] [理论桥梁：已有知识支持什么、不支持什么](/references/theory.md)","toc":[{"id":"foundations-01-what-this-field-is-section-0","title":"不是从“关键词”进化成“越长越像人话”"},{"id":"foundations-01-what-this-field-is-section-1","title":"它有新问题，也有旧根系"},{"id":"foundations-01-what-this-field-is-section-2","title":"当代不意味着旧写法全部作废"},{"id":"foundations-01-what-this-field-is-section-3","title":"专家的能力边界"}]},{"id":"foundations/02-six-layer-method","path":"foundations/02-six-layer-method.md","title":"02｜六层转译：从感受到生成","description":"用六个可来回检查的层次，连接观众体验、媒介选择与实际输入。","type":"Framework","group":"foundations","tags":["核心框架","通感","意图"],"html":"<h1>02｜六层转译：从感受到生成<\/h1>\n<blockquote>\n<p>“让观众松一口气”不是让人物必须叹气。那口气，也可以由空间、节奏或声音替他松开。<\/p>\n<\/blockquote>\n<h2 id=\"foundations-02-six-layer-method-section-0\">六层不是六个必填表格<\/h2>\n<p>本指南提出一个便于检查的工作模型。简单任务可以用三句话穿过六层，复杂项目才需要拆开。它不是生成成功率公式，也不要求每层都出一份文件。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>层次<\/th>\n<th>要问的问题<\/th>\n<th>“下班后，终于属于自己”的一种回答<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1．体验<\/td>\n<td>观众此刻要感到、理解或注意什么？<\/td>\n<td>从被催促转为可以慢一点<\/td>\n<\/tr>\n<tr>\n<td>2．关系<\/td>\n<td>什么在发生，什么力量正在改变？<\/td>\n<td>公共时间退后，个人时间回来<\/td>\n<\/tr>\n<tr>\n<td>3．载体<\/td>\n<td>谁或什么承载这件事？<\/td>\n<td>一只脱下的鞋、一扇门、仍紧握的手<\/td>\n<\/tr>\n<tr>\n<td>4．感知<\/td>\n<td>观众具体看见、听见什么？<\/td>\n<td>鞋落地，手松开，走廊噪声被门隔远<\/td>\n<\/tr>\n<tr>\n<td>5．组织<\/td>\n<td>从哪里看，先后怎样，哪些不展示？<\/td>\n<td>不拍夸张笑脸，先留门口半秒空白<\/td>\n<\/tr>\n<tr>\n<td>6．提交<\/td>\n<td>交给哪个任务、哪些参考和参数？<\/td>\n<td>首帧图生视频，保留机位，只生成松手和门声变化<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>体验是目的；关系是结构；载体是材料；感知是证据；组织是表达；提交是执行。<\/strong> 实际制作中可以倒着走：先有一张极好的光影照片，再寻找它适合承载的关系。六层用来查断点，不是限制灵感的入口。<\/p>\n<h2 id=\"foundations-02-six-layer-method-section-1\">同一目标，至少允许三条路<\/h2>\n<p>“清爽”可以是冰凉水流，也可以是热天里终于有风，还可以是一张不再挤满信息的产品海报。先提出不同机制，再选方案。换三种蓝绿色并不等于三个创意。<\/p>\n<p>例如“从束缚到松开”：<\/p>\n<p><strong>身体路线<\/strong>：手指从紧扣杯柄到只轻轻搭着；肩膀慢慢落下来。适合人物体验，不需要大场面。<\/p>\n<p><strong>空间路线<\/strong>：开头视野被门框压窄，后来人物跨入更宽的光面。适合把变化交给构图，但别把房间莫名放大。<\/p>\n<p><strong>声音路线<\/strong>：细碎通知音一直在抢话，门合上之后只剩水与呼吸。适合声音先行，画面可以保持安静。<\/p>\n<p>三条路线可以合作，但不要都做到最大。否则观众会同时收到“松开”的三个感叹号。<\/p>\n<h2 id=\"foundations-02-six-layer-method-section-2\">让重要意图有证据，不让每个细节背任务<\/h2>\n<p>关键情节如“她拿到了真信”要有可辨认的道具和交接；气氛如“有一点不舍”可以保留多义性。杯子不一定是婚姻的隐喻，窗帘也不必每次象征自由。只为需要观众读懂的地方安排证据，其余允许生活的余量。<\/p>\n<p>一条简单判断：<strong>删掉这句说明，观众还会从成片中获得同样的体验吗？<\/strong> 若不会，而画面没有对应细节，就存在表达空缺；若会，这句话可能只是创作者自己的解释。<\/p>\n<h2 id=\"foundations-02-six-layer-method-section-3\">五种常见断点<\/h2>\n<p>“她很后悔”没有外部表现，是体验到感知的断点。“围着人物拍一圈”没有观看理由，是组织与体验的断点。“保持同一瓶身”却没提供瓶身参考，是条件的断点。“固定机位”与运镜菜单的推近冲突，是提交的断点。“画面很美但产品认不出来”，则是评价时把次要美感压过了核心任务。<\/p>\n<p>修哪一层，就先回哪一层。不要所有失败都靠改几个形容词补救。下一步可用<a href=\"#/foundations/03-three-drafts\">三种稿子<\/a>把层次转为自然的工作文本。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 02｜六层转译：从感受到生成\n\n> “让观众松一口气”不是让人物必须叹气。那口气，也可以由空间、节奏或声音替他松开。\n\n## 六层不是六个必填表格\n\n本指南提出一个便于检查的工作模型。简单任务可以用三句话穿过六层，复杂项目才需要拆开。它不是生成成功率公式，也不要求每层都出一份文件。\n\n| 层次 | 要问的问题 | “下班后，终于属于自己”的一种回答 |\n| --- | --- | --- |\n| 1．体验 | 观众此刻要感到、理解或注意什么？ | 从被催促转为可以慢一点 |\n| 2．关系 | 什么在发生，什么力量正在改变？ | 公共时间退后，个人时间回来 |\n| 3．载体 | 谁或什么承载这件事？ | 一只脱下的鞋、一扇门、仍紧握的手 |\n| 4．感知 | 观众具体看见、听见什么？ | 鞋落地，手松开，走廊噪声被门隔远 |\n| 5．组织 | 从哪里看，先后怎样，哪些不展示？ | 不拍夸张笑脸，先留门口半秒空白 |\n| 6．提交 | 交给哪个任务、哪些参考和参数？ | 首帧图生视频，保留机位，只生成松手和门声变化 |\n\n**体验是目的；关系是结构；载体是材料；感知是证据；组织是表达；提交是执行。** 实际制作中可以倒着走：先有一张极好的光影照片，再寻找它适合承载的关系。六层用来查断点，不是限制灵感的入口。\n\n## 同一目标，至少允许三条路\n\n“清爽”可以是冰凉水流，也可以是热天里终于有风，还可以是一张不再挤满信息的产品海报。先提出不同机制，再选方案。换三种蓝绿色并不等于三个创意。\n\n例如“从束缚到松开”：\n\n**身体路线**：手指从紧扣杯柄到只轻轻搭着；肩膀慢慢落下来。适合人物体验，不需要大场面。\n\n**空间路线**：开头视野被门框压窄，后来人物跨入更宽的光面。适合把变化交给构图，但别把房间莫名放大。\n\n**声音路线**：细碎通知音一直在抢话，门合上之后只剩水与呼吸。适合声音先行，画面可以保持安静。\n\n三条路线可以合作，但不要都做到最大。否则观众会同时收到“松开”的三个感叹号。\n\n## 让重要意图有证据，不让每个细节背任务\n\n关键情节如“她拿到了真信”要有可辨认的道具和交接；气氛如“有一点不舍”可以保留多义性。杯子不一定是婚姻的隐喻，窗帘也不必每次象征自由。只为需要观众读懂的地方安排证据，其余允许生活的余量。\n\n一条简单判断：**删掉这句说明，观众还会从成片中获得同样的体验吗？** 若不会，而画面没有对应细节，就存在表达空缺；若会，这句话可能只是创作者自己的解释。\n\n## 五种常见断点\n\n“她很后悔”没有外部表现，是体验到感知的断点。“围着人物拍一圈”没有观看理由，是组织与体验的断点。“保持同一瓶身”却没提供瓶身参考，是条件的断点。“固定机位”与运镜菜单的推近冲突，是提交的断点。“画面很美但产品认不出来”，则是评价时把次要美感压过了核心任务。\n\n修哪一层，就先回哪一层。不要所有失败都靠改几个形容词补救。下一步可用[三种稿子](/foundations/03-three-drafts.md)把层次转为自然的工作文本。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"foundations-02-six-layer-method-section-0","title":"六层不是六个必填表格"},{"id":"foundations-02-six-layer-method-section-1","title":"同一目标，至少允许三条路"},{"id":"foundations-02-six-layer-method-section-2","title":"让重要意图有证据，不让每个细节背任务"},{"id":"foundations-02-six-layer-method-section-3","title":"五种常见断点"}]},{"id":"foundations/03-three-drafts","path":"foundations/03-three-drafts.md","title":"03｜感受稿、创作说明、执行稿","description":"把联想的丰富与提交的清楚分开；不让诗意和工程互相挤占。","type":"Framework","group":"foundations","tags":["写作","执行","隐喻"],"html":"<h1>03｜感受稿、创作说明、执行稿<\/h1>\n<h2 id=\"foundations-03-three-drafts-section-0\">三种稿子，各自解决一个问题<\/h2>\n<p><strong>感受稿<\/strong>写“这应该像什么”。它允许联想、比喻、互相矛盾的感受，还没有义务解释所有执行细节。<\/p>\n<blockquote>\n<p>她的高兴像一封终于拆开的信，纸页已经摊平，手指却还按着那道旧折痕。<\/p>\n<\/blockquote>\n<p><strong>创作说明<\/strong>写“我们准备怎样表现”。从联想中选出真正有用的关系，而不是把信、纸、折痕全部搬进画面。<\/p>\n<blockquote>\n<p>她收到好消息，第一反应不是跳起来，而是再确认一遍。笑先从眼睛里出来，之后才敢抬头看对方。保留一点曾经不敢相信的习惯，但这一刻的喜悦是实在的。<\/p>\n<\/blockquote>\n<p><strong>执行稿<\/strong>只交付当前任务需要的东西。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">保留首帧中的女子、座位和桌边机位。她看完手机上的消息，停一下，又快速看了一眼；随后抬头望向画面右侧的朋友，笑意自然展开。握着手机的手不再那么紧。摄影机留在原地，给她完成这次反应的时间。整体明亮、亲近，没有故意憋回去的笑。\n<\/code><\/pre>\n<p>这里没有真的生成纸。比喻提供了“释放之后仍留一点旧习惯”的关系，执行稿把它放在重复确认与手部力度上。这种转译就是通感的工作，不是修辞装饰。<\/p>\n<h2 id=\"foundations-03-three-drafts-section-1\">创作说明不必全部进入模型<\/h2>\n<p>“她经历过三次失败，所以这次终于愿意信任别人”可以帮助团队理解。若这个镜头只需要看见她把钥匙交出去，执行稿不必复述三次失败的完整故事。模型是否从背景获益，需依任务测试；观众尤其不会因为提示词里写过，就自动知道。<\/p>\n<p>反过来，也不要清除所有情境。有时“她不是忘记回答，而是在等他自己意识到失言”比十条眉眼描述更有方向。优先留下能改变动作选择、节奏或语气的背景。<\/p>\n<h2 id=\"foundations-03-three-drafts-section-2\">第四种东西：实际设置，另放<\/h2>\n<p>画幅、输出时长、分辨率、参考文件绑定、蒙版、音频开关属于真实的执行设置。文字里写“4K、八秒、同一张图”不等于设置已生效。创作说明可写目标；提交前在工具的有效接口中落实。<\/p>\n<p>“50毫米的观看感”也不等于真实相机参数被执行。需要精确几何时，使用可控的三维、合成或摄影；语义描述是方向性条件，不是渲染器。[2][3]<\/p>\n<h2 id=\"foundations-03-three-drafts-section-3\">简短也可以完整<\/h2>\n<p>一个已确定机位和人物的首帧，只需：<\/p>\n<blockquote>\n<p>她听到门锁转动，手里的杯子停在半空。没有立刻回头。<\/p>\n<\/blockquote>\n<p>这里动作、刺激和未完成的反应已经形成小结构。不要为了看起来专业，补上全身、衣服、八种灯光和五种运镜。<\/p>\n<p>一个还没有任何图像的文字生图则需要更多：谁、在哪、主次、材质、光与观看位置。<strong>长度取决于现有上下文缺什么，不取决于专家应该写多少。<\/strong><\/p>\n<h2 id=\"foundations-03-three-drafts-section-4\">改稿时检查三个问题<\/h2>\n<p>先看是否能在脑中形成画面；再看重要关系有没有说反；最后看多余修饰是否挤掉主动作。具体删改方法见<a href=\"#/language/06-rewrite-clinic\">改写诊所<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-image\">图像工具：第一方依据与适用边界<\/a>\n[3] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 03｜感受稿、创作说明、执行稿\n\n## 三种稿子，各自解决一个问题\n\n**感受稿**写“这应该像什么”。它允许联想、比喻、互相矛盾的感受，还没有义务解释所有执行细节。\n\n> 她的高兴像一封终于拆开的信，纸页已经摊平，手指却还按着那道旧折痕。\n\n**创作说明**写“我们准备怎样表现”。从联想中选出真正有用的关系，而不是把信、纸、折痕全部搬进画面。\n\n> 她收到好消息，第一反应不是跳起来，而是再确认一遍。笑先从眼睛里出来，之后才敢抬头看对方。保留一点曾经不敢相信的习惯，但这一刻的喜悦是实在的。\n\n**执行稿**只交付当前任务需要的东西。\n\n```text\n保留首帧中的女子、座位和桌边机位。她看完手机上的消息，停一下，又快速看了一眼；随后抬头望向画面右侧的朋友，笑意自然展开。握着手机的手不再那么紧。摄影机留在原地，给她完成这次反应的时间。整体明亮、亲近，没有故意憋回去的笑。\n```\n\n这里没有真的生成纸。比喻提供了“释放之后仍留一点旧习惯”的关系，执行稿把它放在重复确认与手部力度上。这种转译就是通感的工作，不是修辞装饰。\n\n## 创作说明不必全部进入模型\n\n“她经历过三次失败，所以这次终于愿意信任别人”可以帮助团队理解。若这个镜头只需要看见她把钥匙交出去，执行稿不必复述三次失败的完整故事。模型是否从背景获益，需依任务测试；观众尤其不会因为提示词里写过，就自动知道。\n\n反过来，也不要清除所有情境。有时“她不是忘记回答，而是在等他自己意识到失言”比十条眉眼描述更有方向。优先留下能改变动作选择、节奏或语气的背景。\n\n## 第四种东西：实际设置，另放\n\n画幅、输出时长、分辨率、参考文件绑定、蒙版、音频开关属于真实的执行设置。文字里写“4K、八秒、同一张图”不等于设置已生效。创作说明可写目标；提交前在工具的有效接口中落实。\n\n“50毫米的观看感”也不等于真实相机参数被执行。需要精确几何时，使用可控的三维、合成或摄影；语义描述是方向性条件，不是渲染器。[2][3]\n\n## 简短也可以完整\n\n一个已确定机位和人物的首帧，只需：\n\n> 她听到门锁转动，手里的杯子停在半空。没有立刻回头。\n\n这里动作、刺激和未完成的反应已经形成小结构。不要为了看起来专业，补上全身、衣服、八种灯光和五种运镜。\n\n一个还没有任何图像的文字生图则需要更多：谁、在哪、主次、材质、光与观看位置。**长度取决于现有上下文缺什么，不取决于专家应该写多少。**\n\n## 改稿时检查三个问题\n\n先看是否能在脑中形成画面；再看重要关系有没有说反；最后看多余修饰是否挤掉主动作。具体删改方法见[改写诊所](/language/06-rewrite-clinic.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [图像工具：第一方依据与适用边界](/references/official-image.md)\n[3] [视频工具：第一方依据与适用边界](/references/official-video.md)","toc":[{"id":"foundations-03-three-drafts-section-0","title":"三种稿子，各自解决一个问题"},{"id":"foundations-03-three-drafts-section-1","title":"创作说明不必全部进入模型"},{"id":"foundations-03-three-drafts-section-2","title":"第四种东西：实际设置，另放"},{"id":"foundations-03-three-drafts-section-3","title":"简短也可以完整"},{"id":"foundations-03-three-drafts-section-4","title":"改稿时检查三个问题"}]},{"id":"foundations/04-freedom-and-constraints","path":"foundations/04-freedom-and-constraints.md","title":"04｜精确到哪里，留白在哪里","description":"锁定身份与关键结果，开放自然过渡；不把控制误写成保证。","type":"Framework","group":"foundations","tags":["约束","留白","迭代"],"html":"<h1>04｜精确到哪里，留白在哪里<\/h1>\n<h2 id=\"foundations-04-freedom-and-constraints-section-0\">不确定性不是敌人，错地方的不确定性才是<\/h2>\n<p>发梢怎么摆可以有惊喜，产品名字怎么拼通常不可以；人物可能用不同方式停下来，但不能把“走近”生成成“离开”。提示词的专业性在于分配确定性，而不是把世界塞进一张没有缝隙的清单。<\/p>\n<p>把要求分成三类就够了：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>类别<\/th>\n<th>例子<\/th>\n<th>处理方式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>必须守住<\/td>\n<td>这是谁、哪瓶产品、谁持有道具、结尾发生什么<\/td>\n<td>清楚指认，必要时用专门参考或后期，验收时优先检查<\/td>\n<\/tr>\n<tr>\n<td>值得引导<\/td>\n<td>亲近还是疏离、动作重还是轻、光影方向<\/td>\n<td>给少量明确的感知线索，并允许实现差异<\/td>\n<\/tr>\n<tr>\n<td>可以生长<\/td>\n<td>自然眨眼、细碎衣褶、非关键路人动作<\/td>\n<td>通常不规定逐帧过程<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>这不是正式模型权重，也不是给每句话设置隐藏优先级。它是人做取舍的草图。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-1\">复杂的情绪可以并存，矛盾的物理命令需要拆开<\/h2>\n<p>“她终于自由，却舍不得离开”可以成为表演层次。写成“脚已迈出，手还搭着门框”，就有了不同载体。<\/p>\n<p>“她全程背对摄影机，同时观众清楚看见她嘴角的笑”则需要镜面、转身或换机位；不补条件就是观看上的矛盾。<\/p>\n<p>“镜头绝对固定，同时向前平移绕到背后”是执行冲突。不要期待模型自动知道你更在意哪一个。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-2\">不要把合同比喻当成约束系统<\/h2>\n<p>“严格”“唯一”“必须”“全程一致”可以清楚传达要求，却不构成硬约束。反复写十遍“不要变脸”也没有新增面部证据。真正的控制还包括参考质量、任务模式、参数、选择、剪辑和人工审核。部分官方指南同样明确把提示视作指导，而不是保证；见<a href=\"#/references/official-video\">视频依据<\/a>。<\/p>\n<p>需要更确定的结果时，按成本由轻到重选手段：先消除文本矛盾，再补有效参考，再缩小单次任务，再局部修改，最后转向可控合成或三维。不是一上来就搭大型流程。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-3\">开放度随阶段变化<\/h2>\n<p>探索时可以说“给我三种完全不同的清爽”，允许创作者自己都没想到的画面。选定方案后，可以说“只比较开门前后声音的距离感，不改人物和结局”。交付阶段更窄：字标、产品比例、镜头长度、声音起落都要核对。<\/p>\n<p>过早锁死会把探索变成填色；太晚还在开放，会让每条片子变成不同项目。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-4\">一个反例：太完美的自然<\/h2>\n<blockquote>\n<p>自然、不经意、绝对优雅，始终最美角度，发丝不能乱，皮肤不能有阴影，笑容不能变化。<\/p>\n<\/blockquote>\n<p>这些要求合起来可能更像展示，而不是生活。若项目就是高控制的美妆大片，展示没有错；错的是一边要求可控盛装，一边拿它与手机随手拍的自然标准比较。先确认风格目标，再谈破绽。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 04｜精确到哪里，留白在哪里\n\n## 不确定性不是敌人，错地方的不确定性才是\n\n发梢怎么摆可以有惊喜，产品名字怎么拼通常不可以；人物可能用不同方式停下来，但不能把“走近”生成成“离开”。提示词的专业性在于分配确定性，而不是把世界塞进一张没有缝隙的清单。\n\n把要求分成三类就够了：\n\n| 类别 | 例子 | 处理方式 |\n| --- | --- | --- |\n| 必须守住 | 这是谁、哪瓶产品、谁持有道具、结尾发生什么 | 清楚指认，必要时用专门参考或后期，验收时优先检查 |\n| 值得引导 | 亲近还是疏离、动作重还是轻、光影方向 | 给少量明确的感知线索，并允许实现差异 |\n| 可以生长 | 自然眨眼、细碎衣褶、非关键路人动作 | 通常不规定逐帧过程 |\n\n这不是正式模型权重，也不是给每句话设置隐藏优先级。它是人做取舍的草图。\n\n## 复杂的情绪可以并存，矛盾的物理命令需要拆开\n\n“她终于自由，却舍不得离开”可以成为表演层次。写成“脚已迈出，手还搭着门框”，就有了不同载体。\n\n“她全程背对摄影机，同时观众清楚看见她嘴角的笑”则需要镜面、转身或换机位；不补条件就是观看上的矛盾。\n\n“镜头绝对固定，同时向前平移绕到背后”是执行冲突。不要期待模型自动知道你更在意哪一个。\n\n## 不要把合同比喻当成约束系统\n\n“严格”“唯一”“必须”“全程一致”可以清楚传达要求，却不构成硬约束。反复写十遍“不要变脸”也没有新增面部证据。真正的控制还包括参考质量、任务模式、参数、选择、剪辑和人工审核。部分官方指南同样明确把提示视作指导，而不是保证；见[视频依据](/references/official-video.md)。\n\n需要更确定的结果时，按成本由轻到重选手段：先消除文本矛盾，再补有效参考，再缩小单次任务，再局部修改，最后转向可控合成或三维。不是一上来就搭大型流程。\n\n## 开放度随阶段变化\n\n探索时可以说“给我三种完全不同的清爽”，允许创作者自己都没想到的画面。选定方案后，可以说“只比较开门前后声音的距离感，不改人物和结局”。交付阶段更窄：字标、产品比例、镜头长度、声音起落都要核对。\n\n过早锁死会把探索变成填色；太晚还在开放，会让每条片子变成不同项目。\n\n## 一个反例：太完美的自然\n\n> 自然、不经意、绝对优雅，始终最美角度，发丝不能乱，皮肤不能有阴影，笑容不能变化。\n\n这些要求合起来可能更像展示，而不是生活。若项目就是高控制的美妆大片，展示没有错；错的是一边要求可控盛装，一边拿它与手机随手拍的自然标准比较。先确认风格目标，再谈破绽。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [视频工具：第一方依据与适用边界](/references/official-video.md)","toc":[{"id":"foundations-04-freedom-and-constraints-section-0","title":"不确定性不是敌人，错地方的不确定性才是"},{"id":"foundations-04-freedom-and-constraints-section-1","title":"复杂的情绪可以并存，矛盾的物理命令需要拆开"},{"id":"foundations-04-freedom-and-constraints-section-2","title":"不要把合同比喻当成约束系统"},{"id":"foundations-04-freedom-and-constraints-section-3","title":"开放度随阶段变化"},{"id":"foundations-04-freedom-and-constraints-section-4","title":"一个反例：太完美的自然"}]},{"id":"foundations/05-how-to-know","path":"foundations/05-how-to-know.md","title":"05｜怎样知道一句提示真的有用","description":"区分看见的事实、创作解释、工具承诺与实测结果。","type":"Framework","group":"foundations","tags":["证据","研究","评价"],"html":"<h1>05｜怎样知道一句提示真的有用<\/h1>\n<h2 id=\"foundations-05-how-to-know-section-0\">四句话，证据强度不同<\/h2>\n<p>“截图里写着低角度”，只说明出现了这几个字。“这条视频的机位较低”，需要看视频或相应画面。“低角度让这个段落更有压迫感”，是结合上下文的创作判断。“低角度普遍提高某模型的真实感”，需要一套定义清楚的比较，不能从一个剪过的教程推出。<\/p>\n<p>本书的文字分三类理解：<strong>资料提炼<\/strong>来自所列教程复审稿；<strong>技术事实<\/strong>有第一方或研究原文出处；<strong>创作方法与示例<\/strong>是本次综合设计，供试用，不是已经统计验证的规律。没有运行图片、视频或配音生成实验，也不虚构成功率。<\/p>\n<h2 id=\"foundations-05-how-to-know-section-1\">不把“看图想故事”冒充“读出真实内心”<\/h2>\n<p>照片里一位女子低头扶着杯沿，可以引出紧张、疲惫、专注或只是杯子太烫。画面没有告诉我们她必然失恋、撒谎或患病。做创作时，可以明确说“我们把它设定为她在犹豫”；分析现有素材时，应说“这种细节可能被读成犹豫”。两种工作不要混在一起。<\/p>\n<p>同理，教程称某张图“高级”或某个模型“网红”，属于审美评价与经验背景，不是检测出来的客观属性。<\/p>\n<h2 id=\"foundations-05-how-to-know-section-2\">三种问题不要混判<\/h2>\n<p><strong>内容是否正确<\/strong>：是不是同一人、动作有没有完成、产品标签是否正确。<\/p>\n<p><strong>表达是否成立<\/strong>：本来要轻快，结果是不是像焦躁；本来要不动声色，结果是不是完全没有反应。<\/p>\n<p><strong>制作是否可用<\/strong>：有没有足够可剪时长、接头是否连贯、音频是否能分轨处理。<\/p>\n<p>一条视频可以技术干净但情绪错误，也可以情绪精彩但有一小段需修。审查时分开记录，不用一个“AI味很重”把所有问题抹平。<\/p>\n<h2 id=\"foundations-05-how-to-know-section-3\">本书如何借理论<\/h2>\n<p>借用跨感官研究，是为了提出更好的联想问题；借用观看研究，是为了提醒你注意观众能否接收到线索；借用摄影知识，是为了避免不可能的光与机位。它们都没有直接证明本书的六层法会让某个生成器表现更好。[3]<\/p>\n<p>因此，本书的框架适合当<strong>可反驳、可积累的工作假设<\/strong>：用过之后，记录在哪类内容里有效，在哪类模型里失效。不断删去不起作用的条款，比不断给提示词加一层“高级机制”更重要。<\/p>\n<p>实际比较的办法见<a href=\"#/workflows/07-evaluate-repair\">评价与修复<\/a>，而不是先去找一个万能分数。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a>\n[3] <a href=\"#/references/theory\">理论桥梁：已有知识支持什么、不支持什么<\/a><\/p>\n<\/details>","text":"# 05｜怎样知道一句提示真的有用\n\n## 四句话，证据强度不同\n\n“截图里写着低角度”，只说明出现了这几个字。“这条视频的机位较低”，需要看视频或相应画面。“低角度让这个段落更有压迫感”，是结合上下文的创作判断。“低角度普遍提高某模型的真实感”，需要一套定义清楚的比较，不能从一个剪过的教程推出。\n\n本书的文字分三类理解：**资料提炼**来自所列教程复审稿；**技术事实**有第一方或研究原文出处；**创作方法与示例**是本次综合设计，供试用，不是已经统计验证的规律。没有运行图片、视频或配音生成实验，也不虚构成功率。\n\n## 不把“看图想故事”冒充“读出真实内心”\n\n照片里一位女子低头扶着杯沿，可以引出紧张、疲惫、专注或只是杯子太烫。画面没有告诉我们她必然失恋、撒谎或患病。做创作时，可以明确说“我们把它设定为她在犹豫”；分析现有素材时，应说“这种细节可能被读成犹豫”。两种工作不要混在一起。\n\n同理，教程称某张图“高级”或某个模型“网红”，属于审美评价与经验背景，不是检测出来的客观属性。\n\n## 三种问题不要混判\n\n**内容是否正确**：是不是同一人、动作有没有完成、产品标签是否正确。\n\n**表达是否成立**：本来要轻快，结果是不是像焦躁；本来要不动声色，结果是不是完全没有反应。\n\n**制作是否可用**：有没有足够可剪时长、接头是否连贯、音频是否能分轨处理。\n\n一条视频可以技术干净但情绪错误，也可以情绪精彩但有一小段需修。审查时分开记录，不用一个“AI味很重”把所有问题抹平。\n\n## 本书如何借理论\n\n借用跨感官研究，是为了提出更好的联想问题；借用观看研究，是为了提醒你注意观众能否接收到线索；借用摄影知识，是为了避免不可能的光与机位。它们都没有直接证明本书的六层法会让某个生成器表现更好。[3]\n\n因此，本书的框架适合当**可反驳、可积累的工作假设**：用过之后，记录在哪类内容里有效，在哪类模型里失效。不断删去不起作用的条款，比不断给提示词加一层“高级机制”更重要。\n\n实际比较的办法见[评价与修复](/workflows/07-evaluate-repair.md)，而不是先去找一个万能分数。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)\n[3] [理论桥梁：已有知识支持什么、不支持什么](/references/theory.md)","toc":[{"id":"foundations-05-how-to-know-section-0","title":"四句话，证据强度不同"},{"id":"foundations-05-how-to-know-section-1","title":"不把“看图想故事”冒充“读出真实内心”"},{"id":"foundations-05-how-to-know-section-2","title":"三种问题不要混判"},{"id":"foundations-05-how-to-know-section-3","title":"本书如何借理论"}]},{"id":"language/index","path":"language/index.md","title":"II · 通感与表达","description":"","type":"Index","group":"language","tags":[],"html":"<h1>II · 通感与表达<\/h1>\n<p>练习把情绪、氛围和联想变成有主次的自然语言。<\/p>\n<ul>\n<li><p><a href=\"#/language/01-sensory-translation\">06｜通感不是堆比喻，是转移一种关系<\/a> — 把重量、温度、触感、距离和节奏跨到画面与声音，同时防止比喻被字面化。<\/p>\n<\/li>\n<li><p><a href=\"#/language/02-association-workshop\">07｜怎样长出不落俗套的联想<\/a> — 从身体经验、生活观察、反向选择和残留痕迹中产生真正不同的方案。<\/p>\n<\/li>\n<li><p><a href=\"#/language/03-scene-grammar\">08｜用人话组织画面：名词之外还有关系<\/a> — 借助动词、介词、连词、视点和省略，让提示词有清楚的主次与发生顺序。<\/p>\n<\/li>\n<li><p><a href=\"#/language/04-emotion-atlas\">09｜情绪图谱：同一个词，可以有不同身体<\/a> — 16组原创表演与声音方向，帮助选择动机、强度和泄露方式，而不是套表情包。<\/p>\n<\/li>\n<li><p><a href=\"#/language/05-atmosphere-atlas\">10｜氛围图谱：让抽象感觉有不同材料<\/a> — 16组原创跨感官方向，覆盖广告、生活、悬疑与风格化创作。<\/p>\n<\/li>\n<li><p><a href=\"#/language/06-rewrite-clinic\">11｜改写诊所：从标签、散文和过度控制中间穿过<\/a> — 12组原创对照，示范怎样增加有效信息，而不是只增加字数。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# II · 通感与表达\n\n练习把情绪、氛围和联想变成有主次的自然语言。\n\n- [06｜通感不是堆比喻，是转移一种关系](/language/01-sensory-translation.md) — 把重量、温度、触感、距离和节奏跨到画面与声音，同时防止比喻被字面化。\n\n- [07｜怎样长出不落俗套的联想](/language/02-association-workshop.md) — 从身体经验、生活观察、反向选择和残留痕迹中产生真正不同的方案。\n\n- [08｜用人话组织画面：名词之外还有关系](/language/03-scene-grammar.md) — 借助动词、介词、连词、视点和省略，让提示词有清楚的主次与发生顺序。\n\n- [09｜情绪图谱：同一个词，可以有不同身体](/language/04-emotion-atlas.md) — 16组原创表演与声音方向，帮助选择动机、强度和泄露方式，而不是套表情包。\n\n- [10｜氛围图谱：让抽象感觉有不同材料](/language/05-atmosphere-atlas.md) — 16组原创跨感官方向，覆盖广告、生活、悬疑与风格化创作。\n\n- [11｜改写诊所：从标签、散文和过度控制中间穿过](/language/06-rewrite-clinic.md) — 12组原创对照，示范怎样增加有效信息，而不是只增加字数。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"language/01-sensory-translation","path":"language/01-sensory-translation.md","title":"06｜通感不是堆比喻，是转移一种关系","description":"把重量、温度、触感、距离和节奏跨到画面与声音，同时防止比喻被字面化。","type":"Technique","group":"language","tags":["通感","比喻","声音","材质"],"html":"<h1>06｜通感不是堆比喻，是转移一种关系<\/h1>\n<blockquote>\n<p>“这段配乐像薄荷”很好，但薄荷不是一种乐器。继续问：要的是入口的凉、清透的气，还是吞下去之后留下的一线清醒？<\/p>\n<\/blockquote>\n<h2 id=\"language-01-sensory-translation-section-0\">先找共性，再换载体<\/h2>\n<p>创作中的通感可以借用一种感觉的结构，去组织另一种媒介。这里说的是表达方法，不是在诊断生理性的联觉，也不是说观众必定共享同一套对应表。跨感官与情绪联想有研究基础，但具体文化、材料与上下文都重要。[2]<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>感觉维度<\/th>\n<th>先想象身体经验<\/th>\n<th>可转入的画面或声音关系<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>重量<\/td>\n<td>拎起、下坠、承住、卸下<\/td>\n<td>运动加速度、物体形变、低频重量、收尾长度<\/td>\n<\/tr>\n<tr>\n<td>温度<\/td>\n<td>靠近暖源、冷空气贴住皮肤<\/td>\n<td>局部冷暖关系、呼吸和衣着反应、声音的亲近或锐利<\/td>\n<\/tr>\n<tr>\n<td>触感<\/td>\n<td>细砂、湿绸、硬边、绒面<\/td>\n<td>高频细节、反射边缘、摩擦声、音的起落形状<\/td>\n<\/tr>\n<tr>\n<td>密度<\/td>\n<td>挤满、稀疏、透气、结成团<\/td>\n<td>构图间距、节拍数量、声部重叠、信息出现频率<\/td>\n<\/tr>\n<tr>\n<td>距离<\/td>\n<td>耳边、隔墙、很远、贴身<\/td>\n<td>声音直达与混响、镜头位置、遮挡、人物间隔<\/td>\n<\/tr>\n<tr>\n<td>张力<\/td>\n<td>拉住、悬着、要断未断<\/td>\n<td>未完成动作、持续音、画面偏重、迟迟未到的落点<\/td>\n<\/tr>\n<tr>\n<td>节奏<\/td>\n<td>犹豫、冲出、回弹、停稳<\/td>\n<td>句子断法、动作节拍、剪辑间隔、重复中的变化<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>这些是联想入口，不是“高频必然清爽”“蓝色必然冷漠”的字典。<\/p>\n<h2 id=\"language-01-sensory-translation-section-1\">一条完整转译链<\/h2>\n<p>感受稿：<strong>“她的声音像晒过太阳、又被折起来的棉布。”<\/strong><\/p>\n<p>先拆出我们真正想借的性质：温和，不光滑得像广播；有一点褶皱般的停顿，但不疲惫。<\/p>\n<p>创作说明：这是一位熟悉的人，不急着把话说完。声音柔和、近，句子中偶尔停一下再接上，像她还在一边整理手边的东西。<\/p>\n<p>执行稿：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">用温和、放松的成年女声读这句话。音量适中，距离感亲近，保留一点自然气息，不要主持人口吻。“回来啦”轻轻接住对方，不做戏剧性的升调；后半句稍停再说，像边叠衣服边聊天。台词：“回来啦。饭还热着。”\n<\/code><\/pre>\n<p>这不是必须添加布料摩擦声。需要现实布料时再让画面或声音承担。<strong>比喻里的物体，可以不在作品里出现。<\/strong><\/p>\n<h2 id=\"language-01-sensory-translation-section-2\">同一个比喻，两种相反用法<\/h2>\n<p>“玻璃感”可以是清澈、易碎、冷硬，也可以是折射、轻脆、透明。护肤广告也许要的是薄薄的清透反光；悬疑片也许要的是物件接触桌面时过于清晰的一声。没有选定性质之前，直接写“玻璃感情绪”会让创作者自己也不知道要检查什么。<\/p>\n<p>“像水”可以缓慢包裹，也可以锋利冲刷；“像呼吸”可以平稳舒展，也可以忽紧忽松。问清动作关系，再选择感官材料。<\/p>\n<h2 id=\"language-01-sensory-translation-section-3\">限定一次转译的主轴<\/h2>\n<p>“丝绸般、刀锋般、奶油般、冰块般”同时出现，可能只是四个漂亮的词。先选一个主轴，再保留一项对照：<\/p>\n<blockquote>\n<p>画面大部分像被柔布擦过，只有瓶口留一道清楚的冷亮边。<\/p>\n<\/blockquote>\n<p>这句有主从。柔与锐没有互相否定，而是分配给不同区域。<\/p>\n<h2 id=\"language-01-sensory-translation-section-4\">如何检查是否有效<\/h2>\n<p>把比喻暂时拿掉，只读执行说明，是否仍能明确选择光、动作或音色？再把执行说明拿掉，只看成片，是否还能感到原先要借的性质？前者检查翻译，后者检查表达。二者都不保证时，先换一个更贴近材料的联想，而不是继续加修辞。<\/p>\n<p>更开阔的构思办法见<a href=\"#/language/02-association-workshop\">联想工作坊<\/a>，可以直接练习的表达见<a href=\"#/language/05-atmosphere-atlas\">氛围图谱<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/theory\">理论桥梁：已有知识支持什么、不支持什么<\/a><\/p>\n<\/details>","text":"# 06｜通感不是堆比喻，是转移一种关系\n\n> “这段配乐像薄荷”很好，但薄荷不是一种乐器。继续问：要的是入口的凉、清透的气，还是吞下去之后留下的一线清醒？\n\n## 先找共性，再换载体\n\n创作中的通感可以借用一种感觉的结构，去组织另一种媒介。这里说的是表达方法，不是在诊断生理性的联觉，也不是说观众必定共享同一套对应表。跨感官与情绪联想有研究基础，但具体文化、材料与上下文都重要。[2]\n\n| 感觉维度 | 先想象身体经验 | 可转入的画面或声音关系 |\n| --- | --- | --- |\n| 重量 | 拎起、下坠、承住、卸下 | 运动加速度、物体形变、低频重量、收尾长度 |\n| 温度 | 靠近暖源、冷空气贴住皮肤 | 局部冷暖关系、呼吸和衣着反应、声音的亲近或锐利 |\n| 触感 | 细砂、湿绸、硬边、绒面 | 高频细节、反射边缘、摩擦声、音的起落形状 |\n| 密度 | 挤满、稀疏、透气、结成团 | 构图间距、节拍数量、声部重叠、信息出现频率 |\n| 距离 | 耳边、隔墙、很远、贴身 | 声音直达与混响、镜头位置、遮挡、人物间隔 |\n| 张力 | 拉住、悬着、要断未断 | 未完成动作、持续音、画面偏重、迟迟未到的落点 |\n| 节奏 | 犹豫、冲出、回弹、停稳 | 句子断法、动作节拍、剪辑间隔、重复中的变化 |\n\n这些是联想入口，不是“高频必然清爽”“蓝色必然冷漠”的字典。\n\n## 一条完整转译链\n\n感受稿：**“她的声音像晒过太阳、又被折起来的棉布。”**\n\n先拆出我们真正想借的性质：温和，不光滑得像广播；有一点褶皱般的停顿，但不疲惫。\n\n创作说明：这是一位熟悉的人，不急着把话说完。声音柔和、近，句子中偶尔停一下再接上，像她还在一边整理手边的东西。\n\n执行稿：\n\n```text\n用温和、放松的成年女声读这句话。音量适中，距离感亲近，保留一点自然气息，不要主持人口吻。“回来啦”轻轻接住对方，不做戏剧性的升调；后半句稍停再说，像边叠衣服边聊天。台词：“回来啦。饭还热着。”\n```\n\n这不是必须添加布料摩擦声。需要现实布料时再让画面或声音承担。**比喻里的物体，可以不在作品里出现。**\n\n## 同一个比喻，两种相反用法\n\n“玻璃感”可以是清澈、易碎、冷硬，也可以是折射、轻脆、透明。护肤广告也许要的是薄薄的清透反光；悬疑片也许要的是物件接触桌面时过于清晰的一声。没有选定性质之前，直接写“玻璃感情绪”会让创作者自己也不知道要检查什么。\n\n“像水”可以缓慢包裹，也可以锋利冲刷；“像呼吸”可以平稳舒展，也可以忽紧忽松。问清动作关系，再选择感官材料。\n\n## 限定一次转译的主轴\n\n“丝绸般、刀锋般、奶油般、冰块般”同时出现，可能只是四个漂亮的词。先选一个主轴，再保留一项对照：\n\n> 画面大部分像被柔布擦过，只有瓶口留一道清楚的冷亮边。\n\n这句有主从。柔与锐没有互相否定，而是分配给不同区域。\n\n## 如何检查是否有效\n\n把比喻暂时拿掉，只读执行说明，是否仍能明确选择光、动作或音色？再把执行说明拿掉，只看成片，是否还能感到原先要借的性质？前者检查翻译，后者检查表达。二者都不保证时，先换一个更贴近材料的联想，而不是继续加修辞。\n\n更开阔的构思办法见[联想工作坊](/language/02-association-workshop.md)，可以直接练习的表达见[氛围图谱](/language/05-atmosphere-atlas.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [理论桥梁：已有知识支持什么、不支持什么](/references/theory.md)","toc":[{"id":"language-01-sensory-translation-section-0","title":"先找共性，再换载体"},{"id":"language-01-sensory-translation-section-1","title":"一条完整转译链"},{"id":"language-01-sensory-translation-section-2","title":"同一个比喻，两种相反用法"},{"id":"language-01-sensory-translation-section-3","title":"限定一次转译的主轴"},{"id":"language-01-sensory-translation-section-4","title":"如何检查是否有效"}]},{"id":"language/02-association-workshop","path":"language/02-association-workshop.md","title":"07｜怎样长出不落俗套的联想","description":"从身体经验、生活观察、反向选择和残留痕迹中产生真正不同的方案。","type":"Technique","group":"language","tags":["联想","创意","生活观察"],"html":"<h1>07｜怎样长出不落俗套的联想<\/h1>\n<h2 id=\"language-02-association-workshop-section-0\">别从同义词开始<\/h2>\n<p>把“梦幻”改成“空灵、唯美、仙气”没有改变创意。换一个问题：<strong>现实中的什么经验，让你产生过这种感觉？<\/strong> 可以是泳池底晃动的阳光、深夜电梯突然停止的广播、隔着纱帐看见熟人的身影。材料一具体，风格才开始有自己的脾气。<\/p>\n<p>下面六条是构思路径，不要求每次全部用上。<\/p>\n<h3 id=\"language-02-association-workshop-section-1\">1．从身体动作取结构<\/h3>\n<p>想表现“释放”，不一定找飞鸟。松鞋带、把紧攥的手摊开、终于能把背靠在椅子上，都有释放的结构。<\/p>\n<p>再跨一次媒介：画面先挤后松、音乐从密集短音转为较长尾音，也可以借这条结构。不是每个创意都要出现人。<\/p>\n<h3 id=\"language-02-association-workshop-section-2\">2．从不完整之处取故事<\/h3>\n<p>新鲜水迹、杯子底部的温痕、一条只拆开一端的丝带，会让观众感到世界在镜头开始前已经存在。不要自动把这些痕迹解释成案件线索；它们也可以只是时间的气味。<\/p>\n<p>生成说明可以写：<\/p>\n<blockquote>\n<p>桌面不凌乱，只在杯子刚被拿起的地方留一圈还没干透的水痕，窗边那张椅子比另一张稍微向外。<\/p>\n<\/blockquote>\n<h3 id=\"language-02-association-workshop-section-3\">3．反转惯用载体，不反转所有逻辑<\/h3>\n<p>做清爽，不用冰块而用被风翻过的一页纸；做力量，不用怒吼而用一个动作完成后空间终于安静；做浪漫，不用粉色而用两个人走路时不知不觉一致的节奏。<\/p>\n<p>反转不是比常规路线更高级。它只是当常规方案撞脸时，增加一条可选路。若你的品牌需要直接、易读的清凉，冰块仍可能更适合。<\/p>\n<h3 id=\"language-02-association-workshop-section-4\">4．让两种力量相遇<\/h3>\n<p>柔软与坚定：布料很轻，人物的重心很稳。热闹与孤独：环境一直流动，人物没有加入。精密与有机：产品边线明确，水纹绕过它。<\/p>\n<p>关键是<strong>把不同性质放在不同载体、区域或时段上<\/strong>。不要要求同一块布同时厚重下坠又无风悬浮，除非那正是明确的超现实规则。<\/p>\n<h3 id=\"language-02-association-workshop-section-5\">5．从“反应晚半拍”找生命<\/h3>\n<p>不是所有东西同时开始、同时结束。人停下，包还轻撞一下腿；一句笑话讲完，听者先没懂，再突然笑出来；门已经关上，刚刚的声音还在脑中留着。<\/p>\n<p>这条路径可用于动作、剪辑、音乐和版式。海报里也可以让一条曲线离开主体后仍延伸一点，保留运动余味。这里的“晚半拍”是关系，不是固定秒数。<\/p>\n<h3 id=\"language-02-association-workshop-section-6\">6．从观看限制找独特位置<\/h3>\n<p>不是“我要拍一间漂亮房间”，而是“一个刚醒来的人，还没有完全睁开眼时，看见这间房间的哪一部分”。不是靠软件虚焦自动成立；可以选择低处、有限视野、窗帘的一小块亮面、渐渐分辨出的生活声。<\/p>\n<h2 id=\"language-02-association-workshop-section-7\">真正不同的三方案<\/h2>\n<p>假设任务是“表现一瓶香水的自在”。<\/p>\n<p><strong>空间方案<\/strong>：室内的气流带着窗帘离开画框，产品安静留在原处；自由表现为不被挤满。<\/p>\n<p><strong>动作方案<\/strong>：人物出门前改了主意，把束紧的头发松开，依旧准时离开；自由表现为主动选择。<\/p>\n<p><strong>材质方案<\/strong>：一条丝带接近产品时没有围住它，而是在旁边落成宽松的弧；自由表现为留有余地。<\/p>\n<p>三者的区别是表达机制，不是同一画面换背景色。选定后，再用<a href=\"#/foundations/02-six-layer-method\">六层转译<\/a>补齐执行条件。<\/p>\n<h2 id=\"language-02-association-workshop-section-8\">联想最容易坏在哪里<\/h2>\n<p>刻意到每个物件都解释主题；为了新奇牺牲产品辨识；用“他内心……”替代可见线索；把空镜都写成秘密；没有明确风格就把写实规则当成所有作品的法律。<\/p>\n<p>好的联想会让你发现一个更贴切的选择。坏的联想只让说明更像诗，但画面仍是常见模板。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/theory\">理论桥梁：已有知识支持什么、不支持什么<\/a><\/p>\n<\/details>","text":"# 07｜怎样长出不落俗套的联想\n\n## 别从同义词开始\n\n把“梦幻”改成“空灵、唯美、仙气”没有改变创意。换一个问题：**现实中的什么经验，让你产生过这种感觉？** 可以是泳池底晃动的阳光、深夜电梯突然停止的广播、隔着纱帐看见熟人的身影。材料一具体，风格才开始有自己的脾气。\n\n下面六条是构思路径，不要求每次全部用上。\n\n### 1．从身体动作取结构\n\n想表现“释放”，不一定找飞鸟。松鞋带、把紧攥的手摊开、终于能把背靠在椅子上，都有释放的结构。\n\n再跨一次媒介：画面先挤后松、音乐从密集短音转为较长尾音，也可以借这条结构。不是每个创意都要出现人。\n\n### 2．从不完整之处取故事\n\n新鲜水迹、杯子底部的温痕、一条只拆开一端的丝带，会让观众感到世界在镜头开始前已经存在。不要自动把这些痕迹解释成案件线索；它们也可以只是时间的气味。\n\n生成说明可以写：\n\n> 桌面不凌乱，只在杯子刚被拿起的地方留一圈还没干透的水痕，窗边那张椅子比另一张稍微向外。\n\n### 3．反转惯用载体，不反转所有逻辑\n\n做清爽，不用冰块而用被风翻过的一页纸；做力量，不用怒吼而用一个动作完成后空间终于安静；做浪漫，不用粉色而用两个人走路时不知不觉一致的节奏。\n\n反转不是比常规路线更高级。它只是当常规方案撞脸时，增加一条可选路。若你的品牌需要直接、易读的清凉，冰块仍可能更适合。\n\n### 4．让两种力量相遇\n\n柔软与坚定：布料很轻，人物的重心很稳。热闹与孤独：环境一直流动，人物没有加入。精密与有机：产品边线明确，水纹绕过它。\n\n关键是**把不同性质放在不同载体、区域或时段上**。不要要求同一块布同时厚重下坠又无风悬浮，除非那正是明确的超现实规则。\n\n### 5．从“反应晚半拍”找生命\n\n不是所有东西同时开始、同时结束。人停下，包还轻撞一下腿；一句笑话讲完，听者先没懂，再突然笑出来；门已经关上，刚刚的声音还在脑中留着。\n\n这条路径可用于动作、剪辑、音乐和版式。海报里也可以让一条曲线离开主体后仍延伸一点，保留运动余味。这里的“晚半拍”是关系，不是固定秒数。\n\n### 6．从观看限制找独特位置\n\n不是“我要拍一间漂亮房间”，而是“一个刚醒来的人，还没有完全睁开眼时，看见这间房间的哪一部分”。不是靠软件虚焦自动成立；可以选择低处、有限视野、窗帘的一小块亮面、渐渐分辨出的生活声。\n\n## 真正不同的三方案\n\n假设任务是“表现一瓶香水的自在”。\n\n**空间方案**：室内的气流带着窗帘离开画框，产品安静留在原处；自由表现为不被挤满。\n\n**动作方案**：人物出门前改了主意，把束紧的头发松开，依旧准时离开；自由表现为主动选择。\n\n**材质方案**：一条丝带接近产品时没有围住它，而是在旁边落成宽松的弧；自由表现为留有余地。\n\n三者的区别是表达机制，不是同一画面换背景色。选定后，再用[六层转译](/foundations/02-six-layer-method.md)补齐执行条件。\n\n## 联想最容易坏在哪里\n\n刻意到每个物件都解释主题；为了新奇牺牲产品辨识；用“他内心……”替代可见线索；把空镜都写成秘密；没有明确风格就把写实规则当成所有作品的法律。\n\n好的联想会让你发现一个更贴切的选择。坏的联想只让说明更像诗，但画面仍是常见模板。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [理论桥梁：已有知识支持什么、不支持什么](/references/theory.md)","toc":[{"id":"language-02-association-workshop-section-0","title":"别从同义词开始"},{"id":"language-02-association-workshop-section-7","title":"真正不同的三方案"},{"id":"language-02-association-workshop-section-8","title":"联想最容易坏在哪里"}]},{"id":"language/03-scene-grammar","path":"language/03-scene-grammar.md","title":"08｜用人话组织画面：名词之外还有关系","description":"借助动词、介词、连词、视点和省略，让提示词有清楚的主次与发生顺序。","type":"Technique","group":"language","tags":["自然语言","句法","关系","动作"],"html":"<h1>08｜用人话组织画面：名词之外还有关系<\/h1>\n<h2 id=\"language-03-scene-grammar-section-0\">“人话”不是口语越多越好<\/h2>\n<p>“帮我弄得高级一点，感觉你懂的，就是那种清爽又梦幻”是人话，但信息不足。“建立高维情绪场域并注入真实感权重”看似术语，仍然信息不足。<\/p>\n<p>更有用的是：<\/p>\n<blockquote>\n<p>瓶子留在画面中间偏下。上方大片空间干净，只让一条很淡的水面反光慢慢经过墙上。清爽来自空气和间隔，不来自满屏的水珠。<\/p>\n<\/blockquote>\n<p>它有位置、主次、材料、变化和排除误读的方向。<\/p>\n<h2 id=\"language-03-scene-grammar-section-1\">五种词，五种工作<\/h2>\n<p><strong>名词负责指认<\/strong>：女孩、玻璃瓶、窗帘。必要时用名字或已绑定的参考，避免“她”“它”跨段乱指。<\/p>\n<p><strong>动词负责性质<\/strong>：“拿起”“托起”“掂起”“拎起”不是同一个动作。“托起”把重量交给手掌，“拎起”让物件在下方悬挂。选对动词，常比追加“自然真实”有用。<\/p>\n<p><strong>介词负责空间<\/strong>：从门框后、沿桌边、隔着玻璃、朝画面右侧。分清“画面左侧”与“人物左手”，不要假设镜头转过去后它们仍一致。<\/p>\n<p><strong>连词负责关系<\/strong>：“因为”“但”“直到”“而不是”“同时”“随后”。“她听到名字后才回头”比“她听见名字，并且回头”更明确先后；“手已经松开，身体却没有离开”给了不同部位不同状态。<\/p>\n<p><strong>省略负责开放<\/strong>：不必说明每次自然呼吸、每片叶子的摆法。已经由首帧确定的信息，通常不需要重新写一遍。<\/p>\n<h2 id=\"language-03-scene-grammar-section-2\">“轻轻”为什么常常不够<\/h2>\n<p>轻轻可以指力量小、速度慢、幅度小、接触短、声音弱。先确定要哪一种。<\/p>\n<p>“她轻轻关门”可以改成：<\/p>\n<blockquote>\n<p>她让门缓慢靠上门框，手一直握住把手，直到锁舌几乎无声地落下。<\/p>\n<\/blockquote>\n<p>“他轻轻把杯子放下”也可以完全不同：<\/p>\n<blockquote>\n<p>他动作不慢，但落杯前稍微收住了手，杯底只发出短短一声。<\/p>\n<\/blockquote>\n<p>同是轻，节奏与性格不同。也不需要把两句再拆成十段关节运动。<\/p>\n<h2 id=\"language-03-scene-grammar-section-3\">写起点与终点，不把自然过渡写死<\/h2>\n<p>描述“转过身继续赶路”时，先确认起点：人物正在回望，包在右肩；终点：朝站台深处走，摄影机不跟。中间自然重心变化可以交给模型。<\/p>\n<p>但若是“把戒指从左手摘下交给别人”，摘下、离手、交付就是剧情本身，不能只说“她释怀了”。关键接触与道具状态要写清，细节选择见<a href=\"#/craft/03-action-blocking\">动作与接触<\/a>。<\/p>\n<h2 id=\"language-03-scene-grammar-section-4\">一段话还是分段，不是原理之争<\/h2>\n<p>短任务一段更顺；复杂参考分工用小标题更易检查；对白按角色分开；多个镜头需要镜号或可辨认的段落。格式服务阅读与工具，不要把“文字先出现，所以画面先执行”当成因果原理。<\/p>\n<p>英文也不是自动更专业。确有模型专用名词或参数时保留其语法，情绪和关系用你能准确判断的语言。翻译后重新检查代词、否定、左右、声音归属，不能只求句子漂亮。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-image\">图像工具：第一方依据与适用边界<\/a>\n[3] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 08｜用人话组织画面：名词之外还有关系\n\n## “人话”不是口语越多越好\n\n“帮我弄得高级一点，感觉你懂的，就是那种清爽又梦幻”是人话，但信息不足。“建立高维情绪场域并注入真实感权重”看似术语，仍然信息不足。\n\n更有用的是：\n\n> 瓶子留在画面中间偏下。上方大片空间干净，只让一条很淡的水面反光慢慢经过墙上。清爽来自空气和间隔，不来自满屏的水珠。\n\n它有位置、主次、材料、变化和排除误读的方向。\n\n## 五种词，五种工作\n\n**名词负责指认**：女孩、玻璃瓶、窗帘。必要时用名字或已绑定的参考，避免“她”“它”跨段乱指。\n\n**动词负责性质**：“拿起”“托起”“掂起”“拎起”不是同一个动作。“托起”把重量交给手掌，“拎起”让物件在下方悬挂。选对动词，常比追加“自然真实”有用。\n\n**介词负责空间**：从门框后、沿桌边、隔着玻璃、朝画面右侧。分清“画面左侧”与“人物左手”，不要假设镜头转过去后它们仍一致。\n\n**连词负责关系**：“因为”“但”“直到”“而不是”“同时”“随后”。“她听到名字后才回头”比“她听见名字，并且回头”更明确先后；“手已经松开，身体却没有离开”给了不同部位不同状态。\n\n**省略负责开放**：不必说明每次自然呼吸、每片叶子的摆法。已经由首帧确定的信息，通常不需要重新写一遍。\n\n## “轻轻”为什么常常不够\n\n轻轻可以指力量小、速度慢、幅度小、接触短、声音弱。先确定要哪一种。\n\n“她轻轻关门”可以改成：\n\n> 她让门缓慢靠上门框，手一直握住把手，直到锁舌几乎无声地落下。\n\n“他轻轻把杯子放下”也可以完全不同：\n\n> 他动作不慢，但落杯前稍微收住了手，杯底只发出短短一声。\n\n同是轻，节奏与性格不同。也不需要把两句再拆成十段关节运动。\n\n## 写起点与终点，不把自然过渡写死\n\n描述“转过身继续赶路”时，先确认起点：人物正在回望，包在右肩；终点：朝站台深处走，摄影机不跟。中间自然重心变化可以交给模型。\n\n但若是“把戒指从左手摘下交给别人”，摘下、离手、交付就是剧情本身，不能只说“她释怀了”。关键接触与道具状态要写清，细节选择见[动作与接触](/craft/03-action-blocking.md)。\n\n## 一段话还是分段，不是原理之争\n\n短任务一段更顺；复杂参考分工用小标题更易检查；对白按角色分开；多个镜头需要镜号或可辨认的段落。格式服务阅读与工具，不要把“文字先出现，所以画面先执行”当成因果原理。\n\n英文也不是自动更专业。确有模型专用名词或参数时保留其语法，情绪和关系用你能准确判断的语言。翻译后重新检查代词、否定、左右、声音归属，不能只求句子漂亮。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [图像工具：第一方依据与适用边界](/references/official-image.md)\n[3] [视频工具：第一方依据与适用边界](/references/official-video.md)","toc":[{"id":"language-03-scene-grammar-section-0","title":"“人话”不是口语越多越好"},{"id":"language-03-scene-grammar-section-1","title":"五种词，五种工作"},{"id":"language-03-scene-grammar-section-2","title":"“轻轻”为什么常常不够"},{"id":"language-03-scene-grammar-section-3","title":"写起点与终点，不把自然过渡写死"},{"id":"language-03-scene-grammar-section-4","title":"一段话还是分段，不是原理之争"}]},{"id":"language/04-emotion-atlas","path":"language/04-emotion-atlas.md","title":"09｜情绪图谱：同一个词，可以有不同身体","description":"16组原创表演与声音方向，帮助选择动机、强度和泄露方式，而不是套表情包。","type":"Lexicon","group":"language","tags":["情绪","表演","台词","图谱"],"html":"<h1>09｜情绪图谱：同一个词，可以有不同身体<\/h1>\n<blockquote>\n<p>情绪词不是按钮。同样的“高兴”，有人急着分享，有人怕被看见，有人高兴得暂时什么都做不了。<\/p>\n<\/blockquote>\n<p>下面都是<strong>虚构角色的创作方向<\/strong>，不是根据外貌判断真实人格的规则。每次选一个符合关系的版本；不要把一整条图谱全部塞进镜头。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-0\">01．期待：身体先到了，话还没到<\/h2>\n<p>她听到楼梯上有脚步，手里的书往下落了一点；发现不是要等的人，又把书抬回原来的高度。镜头看得见这次“差一点”。声音可以先轻快地吸气，却没有马上开口。<\/p>\n<p><strong>另一种期待<\/strong>：门一开就冲过去，兴奋不需要藏。不要把所有期待都写成害羞和嘴角微扬。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-1\">02．喜悦：让好消息真正改变动作<\/h2>\n<p>他确认邮件后，把椅子向后一推，站起来又不知道先做什么，最后转身去抱旁边的人。笑声打断了原本要说的话，而不是按时出现一个标准笑脸。<\/p>\n<p>安静的喜悦也成立：她终于敢把那张票放进口袋，不再反复检查。选择外放还是内收，取决于人物与场合，不取决于“哪种更高级”。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-2\">03．兴奋：不是全程更快，而是想法跑在动作前面<\/h2>\n<p>他一边打开盒子一边跟朋友说话，话还没说完就被里面的东西吸引，后半句变成了笑。动作有明确目标，允许短暂打乱语言。避免毫无原因的身体乱晃与连续甩镜。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-3\">04．安心：警戒任务终于可以停下<\/h2>\n<p>她听见熟悉的脚步，原本扶住门边的手落下来，重新坐回椅子里。声音不必宣布安全；一句“是你啊”后，呼吸恢复顺畅即可。<\/p>\n<p>与疲倦不同：安心是防备减少，疲倦可能是维持姿势的力气减少。两者可以同时出现，但应知道主轴是哪一个。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-4\">05．疲惫：动作仍在完成，代价已经看得见<\/h2>\n<p>他把钥匙放进固定的小碟，却没有像平常一样立刻脱外套，在门边多站了一会。眼睛不用故意半闭；一次迟缓的任务转换就可能足够。<\/p>\n<p><strong>别偷换成病态<\/strong>：疲惫不自动需要苍白、黑眼圈和颤抖。妆造状态要有剧情依据。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-5\">06．紧张：要完成的事与不想暴露的事<\/h2>\n<p>她努力把文件递得平稳，指尖却一直压着纸角，等对方真正接住才松手。不要同时安排眨眼、抖腿、咬唇、冒汗和吞咽；挑一处能看清的承载。<\/p>\n<p>另一种紧张会让人异常利落、话少、动作更用力。安静不代表没有强度。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-6\">07．恐惧：注意力变窄<\/h2>\n<p>走廊里一声金属轻响，她没有四处乱看，只停住手中动作，望向刚才声音来的那扇门。环境不必突然变蓝。先让听觉把注意力抓住，再选择要不要给出威胁。<\/p>\n<p>惊恐逃跑也可以直接有力；让逃跑方向、障碍与目的清楚，不靠不间断抖动画面制造混乱。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-7\">08．愤怒：压力的出口不止怒吼<\/h2>\n<p>压着说：他把问题重新问了一遍，字与字之间的间隔更清楚，音量反而低下来。<\/p>\n<p>爆发说：他终于打断对方，第一句冲得很快，第二句却卡住，因为真正伤人的那句话比预想中难说。<\/p>\n<p>愤怒不应永远被翻译成“冷静威压”。直接、粗粝、失控的形式也有其叙事价值。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-8\">09．悲伤：失去的是哪一种能力<\/h2>\n<p>她开始像平常一样摆两副餐具，拿起第二只碗时停下，最后把它放回柜子。观众看的是习惯尚未跟上事实。<\/p>\n<p>也可以毫不绕弯：他哭到必须扶住桌沿才能继续站着。不要为了克制，剥夺人物在重大失去中的强烈反应。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-9\">10．委屈：话想要被接住，却越说越小<\/h2>\n<p>她先认真解释，发现对方没有听，后半句慢下来，最后不再为自己补充。目光不是固定向下，而是从对方面部移到桌上未被碰过的东西。<\/p>\n<p>如果角色会争取，也可以让她重新抬头、把最后一句说清楚。委屈不是默认无力。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-10\">11．尴尬：寻找一个可以做的普通动作<\/h2>\n<p>笑声停得太快。他伸手去拿桌上的杯子，碰到杯柄又改成把杯垫摆正。动作很小，但转换暴露了不自在。<\/p>\n<p>不需要所有人同时僵住、瞪眼。也可以让一人毫无察觉，另一人独自承担那一点空白。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-11\">12．内疚：补救的动作可能过于用力<\/h2>\n<p>她把对方散落的文件重新叠好，明明已经整齐，仍又对了一次边。说“没事吧”时先看物件，过一会才敢看人。<\/p>\n<p>别把某个小动作当识谎信号。这里是创作者给角色安排的线索，不是心理测谎方法。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-12\">13．不舍：离开的动作没有一齐完成<\/h2>\n<p>脚已朝门外，手仍搭在门框；话已经说完，身体还留着等一句回应的姿态。比“回头三次”更容易保持自然。<\/p>\n<p>也可能反过来：她走得很快，只在关门时极轻地放慢。把迟疑放在一个真正重要的接点。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-13\">14．羞怯与亲近：距离正在重新协商<\/h2>\n<p>对方替她把袖口理好，她先看那只手，再看对方，原本往后让的身体没有继续退。不是强行脸红，而是退让停止了。<\/p>\n<p>亲近也可以大方、明确、有幽默感。不要将所有女性角色写成低头咬唇，也不要把突然靠近本身当浪漫。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-14\">15．坚定：决定之后，动作减少岔路<\/h2>\n<p>她把桌上两份方案中的一份合上，只把另一份推到中间，说话不再先试探对方的脸色。摄影机可以不动，让动作本身给出重心。<\/p>\n<p>坚定不需要消灭恐惧。她可以仍在发抖，却把必须说的话说完。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-15\">16．释然：不是问题消失，而是不再重复抵抗<\/h2>\n<p>他把删了又写的消息停在未发送状态，锁上屏幕，转向窗边正在说话的人。没有胜利姿态，注意力终于回到眼前。<\/p>\n<p>也可以是快乐的释然：大笑、击掌、跑进阳光。不要把所有结尾都处理成一声叹息。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-16\">从图谱到一个镜头<\/h2>\n<p>先选“这个人想做什么”，再选情绪；只挑一个主要行为与一个可见变化；依据景别决定变化的尺度；让声音与身体不必逐项重复。更完整的结构见<a href=\"#/craft/01-acting\">表演设计<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 09｜情绪图谱：同一个词，可以有不同身体\n\n> 情绪词不是按钮。同样的“高兴”，有人急着分享，有人怕被看见，有人高兴得暂时什么都做不了。\n\n下面都是**虚构角色的创作方向**，不是根据外貌判断真实人格的规则。每次选一个符合关系的版本；不要把一整条图谱全部塞进镜头。\n\n## 01．期待：身体先到了，话还没到\n\n她听到楼梯上有脚步，手里的书往下落了一点；发现不是要等的人，又把书抬回原来的高度。镜头看得见这次“差一点”。声音可以先轻快地吸气，却没有马上开口。\n\n**另一种期待**：门一开就冲过去，兴奋不需要藏。不要把所有期待都写成害羞和嘴角微扬。\n\n## 02．喜悦：让好消息真正改变动作\n\n他确认邮件后，把椅子向后一推，站起来又不知道先做什么，最后转身去抱旁边的人。笑声打断了原本要说的话，而不是按时出现一个标准笑脸。\n\n安静的喜悦也成立：她终于敢把那张票放进口袋，不再反复检查。选择外放还是内收，取决于人物与场合，不取决于“哪种更高级”。\n\n## 03．兴奋：不是全程更快，而是想法跑在动作前面\n\n他一边打开盒子一边跟朋友说话，话还没说完就被里面的东西吸引，后半句变成了笑。动作有明确目标，允许短暂打乱语言。避免毫无原因的身体乱晃与连续甩镜。\n\n## 04．安心：警戒任务终于可以停下\n\n她听见熟悉的脚步，原本扶住门边的手落下来，重新坐回椅子里。声音不必宣布安全；一句“是你啊”后，呼吸恢复顺畅即可。\n\n与疲倦不同：安心是防备减少，疲倦可能是维持姿势的力气减少。两者可以同时出现，但应知道主轴是哪一个。\n\n## 05．疲惫：动作仍在完成，代价已经看得见\n\n他把钥匙放进固定的小碟，却没有像平常一样立刻脱外套，在门边多站了一会。眼睛不用故意半闭；一次迟缓的任务转换就可能足够。\n\n**别偷换成病态**：疲惫不自动需要苍白、黑眼圈和颤抖。妆造状态要有剧情依据。\n\n## 06．紧张：要完成的事与不想暴露的事\n\n她努力把文件递得平稳，指尖却一直压着纸角，等对方真正接住才松手。不要同时安排眨眼、抖腿、咬唇、冒汗和吞咽；挑一处能看清的承载。\n\n另一种紧张会让人异常利落、话少、动作更用力。安静不代表没有强度。\n\n## 07．恐惧：注意力变窄\n\n走廊里一声金属轻响，她没有四处乱看，只停住手中动作，望向刚才声音来的那扇门。环境不必突然变蓝。先让听觉把注意力抓住，再选择要不要给出威胁。\n\n惊恐逃跑也可以直接有力；让逃跑方向、障碍与目的清楚，不靠不间断抖动画面制造混乱。\n\n## 08．愤怒：压力的出口不止怒吼\n\n压着说：他把问题重新问了一遍，字与字之间的间隔更清楚，音量反而低下来。\n\n爆发说：他终于打断对方，第一句冲得很快，第二句却卡住，因为真正伤人的那句话比预想中难说。\n\n愤怒不应永远被翻译成“冷静威压”。直接、粗粝、失控的形式也有其叙事价值。\n\n## 09．悲伤：失去的是哪一种能力\n\n她开始像平常一样摆两副餐具，拿起第二只碗时停下，最后把它放回柜子。观众看的是习惯尚未跟上事实。\n\n也可以毫不绕弯：他哭到必须扶住桌沿才能继续站着。不要为了克制，剥夺人物在重大失去中的强烈反应。\n\n## 10．委屈：话想要被接住，却越说越小\n\n她先认真解释，发现对方没有听，后半句慢下来，最后不再为自己补充。目光不是固定向下，而是从对方面部移到桌上未被碰过的东西。\n\n如果角色会争取，也可以让她重新抬头、把最后一句说清楚。委屈不是默认无力。\n\n## 11．尴尬：寻找一个可以做的普通动作\n\n笑声停得太快。他伸手去拿桌上的杯子，碰到杯柄又改成把杯垫摆正。动作很小，但转换暴露了不自在。\n\n不需要所有人同时僵住、瞪眼。也可以让一人毫无察觉，另一人独自承担那一点空白。\n\n## 12．内疚：补救的动作可能过于用力\n\n她把对方散落的文件重新叠好，明明已经整齐，仍又对了一次边。说“没事吧”时先看物件，过一会才敢看人。\n\n别把某个小动作当识谎信号。这里是创作者给角色安排的线索，不是心理测谎方法。\n\n## 13．不舍：离开的动作没有一齐完成\n\n脚已朝门外，手仍搭在门框；话已经说完，身体还留着等一句回应的姿态。比“回头三次”更容易保持自然。\n\n也可能反过来：她走得很快，只在关门时极轻地放慢。把迟疑放在一个真正重要的接点。\n\n## 14．羞怯与亲近：距离正在重新协商\n\n对方替她把袖口理好，她先看那只手，再看对方，原本往后让的身体没有继续退。不是强行脸红，而是退让停止了。\n\n亲近也可以大方、明确、有幽默感。不要将所有女性角色写成低头咬唇，也不要把突然靠近本身当浪漫。\n\n## 15．坚定：决定之后，动作减少岔路\n\n她把桌上两份方案中的一份合上，只把另一份推到中间，说话不再先试探对方的脸色。摄影机可以不动，让动作本身给出重心。\n\n坚定不需要消灭恐惧。她可以仍在发抖，却把必须说的话说完。\n\n## 16．释然：不是问题消失，而是不再重复抵抗\n\n他把删了又写的消息停在未发送状态，锁上屏幕，转向窗边正在说话的人。没有胜利姿态，注意力终于回到眼前。\n\n也可以是快乐的释然：大笑、击掌、跑进阳光。不要把所有结尾都处理成一声叹息。\n\n## 从图谱到一个镜头\n\n先选“这个人想做什么”，再选情绪；只挑一个主要行为与一个可见变化；依据景别决定变化的尺度；让声音与身体不必逐项重复。更完整的结构见[表演设计](/craft/01-acting.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"language-04-emotion-atlas-section-0","title":"01．期待：身体先到了，话还没到"},{"id":"language-04-emotion-atlas-section-1","title":"02．喜悦：让好消息真正改变动作"},{"id":"language-04-emotion-atlas-section-2","title":"03．兴奋：不是全程更快，而是想法跑在动作前面"},{"id":"language-04-emotion-atlas-section-3","title":"04．安心：警戒任务终于可以停下"},{"id":"language-04-emotion-atlas-section-4","title":"05．疲惫：动作仍在完成，代价已经看得见"},{"id":"language-04-emotion-atlas-section-5","title":"06．紧张：要完成的事与不想暴露的事"},{"id":"language-04-emotion-atlas-section-6","title":"07．恐惧：注意力变窄"},{"id":"language-04-emotion-atlas-section-7","title":"08．愤怒：压力的出口不止怒吼"},{"id":"language-04-emotion-atlas-section-8","title":"09．悲伤：失去的是哪一种能力"},{"id":"language-04-emotion-atlas-section-9","title":"10．委屈：话想要被接住，却越说越小"},{"id":"language-04-emotion-atlas-section-10","title":"11．尴尬：寻找一个可以做的普通动作"},{"id":"language-04-emotion-atlas-section-11","title":"12．内疚：补救的动作可能过于用力"},{"id":"language-04-emotion-atlas-section-12","title":"13．不舍：离开的动作没有一齐完成"},{"id":"language-04-emotion-atlas-section-13","title":"14．羞怯与亲近：距离正在重新协商"},{"id":"language-04-emotion-atlas-section-14","title":"15．坚定：决定之后，动作减少岔路"},{"id":"language-04-emotion-atlas-section-15","title":"16．释然：不是问题消失，而是不再重复抵抗"},{"id":"language-04-emotion-atlas-section-16","title":"从图谱到一个镜头"}]},{"id":"language/05-atmosphere-atlas","path":"language/05-atmosphere-atlas.md","title":"10｜氛围图谱：让抽象感觉有不同材料","description":"16组原创跨感官方向，覆盖广告、生活、悬疑与风格化创作。","type":"Lexicon","group":"language","tags":["氛围","通感","风格","词汇"],"html":"<h1>10｜氛围图谱：让抽象感觉有不同材料<\/h1>\n<blockquote>\n<p>氛围不是撒在所有物体上的一层粉。它来自这些东西怎样靠近、怎样发声、怎样留下时间。<\/p>\n<\/blockquote>\n<p>本图谱提供选择，不提供颜色和情绪的一一对应。每项都可以替换材料，重点保留关系。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-0\">01．清爽：有空气可以通过<\/h2>\n<p>画面里别塞满“清爽”的证据。浅色墙上留一块空白，刚被碰过的水面很快平下来，人物动作轻而不黏。声音可以有短而干净的起音，尾部留出间隔。<\/p>\n<p><strong>另一条路<\/strong>：暖阳下晒干的衬衫，同样清爽。清爽不必冰蓝、薄荷、水花三件套。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-1\">02．轻盈：重量被温柔地处理<\/h2>\n<p>不是让所有东西飘起来。手托住薄玻璃杯时几乎没有晃动，衣角随转身晚一点落下，剪辑不在每一步都落重音。物体仍有重量，只是不显笨重。<\/p>\n<p><strong>易误写<\/strong>：“完全失重的真实生活”。失重与日常物理要分清，否则应明确设为风格化规则。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-2\">03．柔软：边缘愿意让步<\/h2>\n<p>光从较大的窗面缓缓包到脸侧，布料在接触手臂时留下圆润的褶皱；音乐的开头不是尖锐敲击，而像音已经在空气里，慢慢被听见。<\/p>\n<p><strong>保留一处清楚<\/strong>：眼睛、产品字标或轮廓不能全化掉。柔软不是失焦和无结构。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-3\">04．温暖：不是全画面橙色<\/h2>\n<p>门边仍有冷一点的走廊光，桌面那一小块暖色把两个人留在一起。杯子的温度通过手掌停留、微弱蒸气或说话距离表现，不必每个镜头都夕阳泛黄。<\/p>\n<p><strong>声音方向<\/strong>：近、松弛、不过度修饰；也可用真实室内细声替代抒情弦乐。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-4\">05．清冷：有边界，但不必无情<\/h2>\n<p>白天的窗光干净，反射少，人物之间有空隙，声音稍远。一个人不急着回应，给空间留下完整的静。<\/p>\n<p><strong>替代解释<\/strong>：清冷也可以是清醒、自主、干净，不必等于悲伤和失宠。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-5\">06．梦幻：现实有一处规则轻轻偏了<\/h2>\n<p>房间与人物仍可信，只让窗上的光慢半拍跟随人的动作，或让一片叶影轻得像浮在墙前。选一项偏移，让其余世界承托它。<\/p>\n<p><strong>易误写<\/strong>：雾、漂浮粒子、柔光、慢动作、星空同时叠满。梦可能轻薄，也可能锐利、空旷、令人不安。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-6\">07．神秘：给出局部，延迟解释<\/h2>\n<p>先听见有人把椅子拖开，却不立刻看见房间里面。人物停在门边，光从门缝落在鞋上，门后的声音又恢复安静。<\/p>\n<p>神秘不是“黑、蓝、烟”的色卡，而是信息的不对称。若全部藏住，观众可能只是不知道该关心什么。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-7\">08．压迫：出口存在，却暂时用不上<\/h2>\n<p>门明明在身后，人却被桌边另一人的身体挡住；画面留给他转身的空间很窄。环境声持续，间隙很少，好像没有机会插一句话。<\/p>\n<p><strong>另一条路<\/strong>：巨大空旷、唯一的脚步声也能压迫。不是只有广角贴脸和低频轰鸣。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-8\">09．松弛：不急着证明自己正在松弛<\/h2>\n<p>人把话说到一半去看窗外，朋友等他回来再接。动作有停留，也有目的；摄影机不替每个动作强调，衣服仍可以规整。<\/p>\n<p>松弛不是驼背、凌乱、困倦的同义词。仪式化的茶席也可以松弛，取决于有没有被催促的感觉。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-9\">10．高级：先把这个词拆掉<\/h2>\n<p>它可能指材料可信、比例克制、制作精确、文化辨识度、罕见的想法，或品牌的价格信号。先问需要哪一种。<\/p>\n<p>表现精确：瓶盖与瓶身接缝清晰，反光位置有节制，字标周围留白干净。表现文化气质：选择有依据的比例、纹样与工艺，而不是黑金背景加大理石。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-10\">11．生命力：东西会彼此影响<\/h2>\n<p>人跑起来，花束轻轻颠簸；看见朋友后步伐变了；朋友让开一点给她通过。风、布料、反应不是独立播放的三段循环。<\/p>\n<p>生命力也可以很安静：一次真实地听见、一次有分寸地接话。不是必须跳跃、大笑、加速。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-11\">12．欲望：注意力反复回到某处<\/h2>\n<p>不拍“迷恋的表情”，而让手快要离开物件时再停一下，视线回到一处材质反光。声音可以收近，让触碰的细节比环境更清晰。<\/p>\n<p>用于产品时，要保持产品真实用途；不要靠无关身体特写代替真正的触感设计。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-12\">13．怀旧：过去留下了使用方式<\/h2>\n<p>桌边被长年手臂磨亮，按钮有一点不均匀的反弹，收音机在调台之间有短暂噪声。人物仍在使用这些东西，而不是站在复古陈列室里。<\/p>\n<p>怀旧不等于所有颜色都泛黄。也可以是很明亮的夏天，只在声音、排版与道具年代里留下时间。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-13\">14．荒诞：认真地执行一条不寻常规则<\/h2>\n<p>办公室一切正常，每个人却把云当作文件传递。云有固定体积，落在桌上会压低一点，又慢慢回弹；人物没有对镜头解释笑点。<\/p>\n<p>把世界规则交代清楚，比堆怪异元素更有效。物理可以不现实，规则仍可以稳定。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-14\">15．仪式感：给一件事留出完整的位置<\/h2>\n<p>手先停稳，盒盖才被抬起；旁边的人等待这个动作完成，音乐不抢在前面宣布惊喜。留出准备、发生和结束，不必处处慢动作。<\/p>\n<p>仪式感不自动属于奢华，也可以是一家人认真点亮一根很普通的生日蜡烛。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-15\">16．速度感：世界经过身体，而不是画面忙起来<\/h2>\n<p>近处栏杆迅速掠过，远处建筑变化较慢；人物有明确前进方向，短促接触声跟得上关键动作。停下来时，让衣物与呼吸承接速度余量。<\/p>\n<p>每个镜头都快切、拉焦、甩镜，会让速度失去参照。给一次稳定或停顿，快才有地方被感知。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-16\">配方不是把“对应项”全加上<\/h2>\n<p>选择一个主载体，一个支持项，再留一点余量。例如“清爽”可让空间主导，声音支持，表演保持普通；“压迫”可让人物关系主导，构图支持，色彩反而明亮。完整用法见<a href=\"#/cases/01-brand-film\">品牌广告案例<\/a>和<a href=\"#/cases/05-empty-corridor\">空走廊案例<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/theory\">理论桥梁：已有知识支持什么、不支持什么<\/a>\n[3] <a href=\"#/references/official-voice-light\">声音与光线：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 10｜氛围图谱：让抽象感觉有不同材料\n\n> 氛围不是撒在所有物体上的一层粉。它来自这些东西怎样靠近、怎样发声、怎样留下时间。\n\n本图谱提供选择，不提供颜色和情绪的一一对应。每项都可以替换材料，重点保留关系。\n\n## 01．清爽：有空气可以通过\n\n画面里别塞满“清爽”的证据。浅色墙上留一块空白，刚被碰过的水面很快平下来，人物动作轻而不黏。声音可以有短而干净的起音，尾部留出间隔。\n\n**另一条路**：暖阳下晒干的衬衫，同样清爽。清爽不必冰蓝、薄荷、水花三件套。\n\n## 02．轻盈：重量被温柔地处理\n\n不是让所有东西飘起来。手托住薄玻璃杯时几乎没有晃动，衣角随转身晚一点落下，剪辑不在每一步都落重音。物体仍有重量，只是不显笨重。\n\n**易误写**：“完全失重的真实生活”。失重与日常物理要分清，否则应明确设为风格化规则。\n\n## 03．柔软：边缘愿意让步\n\n光从较大的窗面缓缓包到脸侧，布料在接触手臂时留下圆润的褶皱；音乐的开头不是尖锐敲击，而像音已经在空气里，慢慢被听见。\n\n**保留一处清楚**：眼睛、产品字标或轮廓不能全化掉。柔软不是失焦和无结构。\n\n## 04．温暖：不是全画面橙色\n\n门边仍有冷一点的走廊光，桌面那一小块暖色把两个人留在一起。杯子的温度通过手掌停留、微弱蒸气或说话距离表现，不必每个镜头都夕阳泛黄。\n\n**声音方向**：近、松弛、不过度修饰；也可用真实室内细声替代抒情弦乐。\n\n## 05．清冷：有边界，但不必无情\n\n白天的窗光干净，反射少，人物之间有空隙，声音稍远。一个人不急着回应，给空间留下完整的静。\n\n**替代解释**：清冷也可以是清醒、自主、干净，不必等于悲伤和失宠。\n\n## 06．梦幻：现实有一处规则轻轻偏了\n\n房间与人物仍可信，只让窗上的光慢半拍跟随人的动作，或让一片叶影轻得像浮在墙前。选一项偏移，让其余世界承托它。\n\n**易误写**：雾、漂浮粒子、柔光、慢动作、星空同时叠满。梦可能轻薄，也可能锐利、空旷、令人不安。\n\n## 07．神秘：给出局部，延迟解释\n\n先听见有人把椅子拖开，却不立刻看见房间里面。人物停在门边，光从门缝落在鞋上，门后的声音又恢复安静。\n\n神秘不是“黑、蓝、烟”的色卡，而是信息的不对称。若全部藏住，观众可能只是不知道该关心什么。\n\n## 08．压迫：出口存在，却暂时用不上\n\n门明明在身后，人却被桌边另一人的身体挡住；画面留给他转身的空间很窄。环境声持续，间隙很少，好像没有机会插一句话。\n\n**另一条路**：巨大空旷、唯一的脚步声也能压迫。不是只有广角贴脸和低频轰鸣。\n\n## 09．松弛：不急着证明自己正在松弛\n\n人把话说到一半去看窗外，朋友等他回来再接。动作有停留，也有目的；摄影机不替每个动作强调，衣服仍可以规整。\n\n松弛不是驼背、凌乱、困倦的同义词。仪式化的茶席也可以松弛，取决于有没有被催促的感觉。\n\n## 10．高级：先把这个词拆掉\n\n它可能指材料可信、比例克制、制作精确、文化辨识度、罕见的想法，或品牌的价格信号。先问需要哪一种。\n\n表现精确：瓶盖与瓶身接缝清晰，反光位置有节制，字标周围留白干净。表现文化气质：选择有依据的比例、纹样与工艺，而不是黑金背景加大理石。\n\n## 11．生命力：东西会彼此影响\n\n人跑起来，花束轻轻颠簸；看见朋友后步伐变了；朋友让开一点给她通过。风、布料、反应不是独立播放的三段循环。\n\n生命力也可以很安静：一次真实地听见、一次有分寸地接话。不是必须跳跃、大笑、加速。\n\n## 12．欲望：注意力反复回到某处\n\n不拍“迷恋的表情”，而让手快要离开物件时再停一下，视线回到一处材质反光。声音可以收近，让触碰的细节比环境更清晰。\n\n用于产品时，要保持产品真实用途；不要靠无关身体特写代替真正的触感设计。\n\n## 13．怀旧：过去留下了使用方式\n\n桌边被长年手臂磨亮，按钮有一点不均匀的反弹，收音机在调台之间有短暂噪声。人物仍在使用这些东西，而不是站在复古陈列室里。\n\n怀旧不等于所有颜色都泛黄。也可以是很明亮的夏天，只在声音、排版与道具年代里留下时间。\n\n## 14．荒诞：认真地执行一条不寻常规则\n\n办公室一切正常，每个人却把云当作文件传递。云有固定体积，落在桌上会压低一点，又慢慢回弹；人物没有对镜头解释笑点。\n\n把世界规则交代清楚，比堆怪异元素更有效。物理可以不现实，规则仍可以稳定。\n\n## 15．仪式感：给一件事留出完整的位置\n\n手先停稳，盒盖才被抬起；旁边的人等待这个动作完成，音乐不抢在前面宣布惊喜。留出准备、发生和结束，不必处处慢动作。\n\n仪式感不自动属于奢华，也可以是一家人认真点亮一根很普通的生日蜡烛。\n\n## 16．速度感：世界经过身体，而不是画面忙起来\n\n近处栏杆迅速掠过，远处建筑变化较慢；人物有明确前进方向，短促接触声跟得上关键动作。停下来时，让衣物与呼吸承接速度余量。\n\n每个镜头都快切、拉焦、甩镜，会让速度失去参照。给一次稳定或停顿，快才有地方被感知。\n\n## 配方不是把“对应项”全加上\n\n选择一个主载体，一个支持项，再留一点余量。例如“清爽”可让空间主导，声音支持，表演保持普通；“压迫”可让人物关系主导，构图支持，色彩反而明亮。完整用法见[品牌广告案例](/cases/01-brand-film.md)和[空走廊案例](/cases/05-empty-corridor.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [理论桥梁：已有知识支持什么、不支持什么](/references/theory.md)\n[3] [声音与光线：第一方依据与适用边界](/references/official-voice-light.md)","toc":[{"id":"language-05-atmosphere-atlas-section-0","title":"01．清爽：有空气可以通过"},{"id":"language-05-atmosphere-atlas-section-1","title":"02．轻盈：重量被温柔地处理"},{"id":"language-05-atmosphere-atlas-section-2","title":"03．柔软：边缘愿意让步"},{"id":"language-05-atmosphere-atlas-section-3","title":"04．温暖：不是全画面橙色"},{"id":"language-05-atmosphere-atlas-section-4","title":"05．清冷：有边界，但不必无情"},{"id":"language-05-atmosphere-atlas-section-5","title":"06．梦幻：现实有一处规则轻轻偏了"},{"id":"language-05-atmosphere-atlas-section-6","title":"07．神秘：给出局部，延迟解释"},{"id":"language-05-atmosphere-atlas-section-7","title":"08．压迫：出口存在，却暂时用不上"},{"id":"language-05-atmosphere-atlas-section-8","title":"09．松弛：不急着证明自己正在松弛"},{"id":"language-05-atmosphere-atlas-section-9","title":"10．高级：先把这个词拆掉"},{"id":"language-05-atmosphere-atlas-section-10","title":"11．生命力：东西会彼此影响"},{"id":"language-05-atmosphere-atlas-section-11","title":"12．欲望：注意力反复回到某处"},{"id":"language-05-atmosphere-atlas-section-12","title":"13．怀旧：过去留下了使用方式"},{"id":"language-05-atmosphere-atlas-section-13","title":"14．荒诞：认真地执行一条不寻常规则"},{"id":"language-05-atmosphere-atlas-section-14","title":"15．仪式感：给一件事留出完整的位置"},{"id":"language-05-atmosphere-atlas-section-15","title":"16．速度感：世界经过身体，而不是画面忙起来"},{"id":"language-05-atmosphere-atlas-section-16","title":"配方不是把“对应项”全加上"}]},{"id":"language/06-rewrite-clinic","path":"language/06-rewrite-clinic.md","title":"11｜改写诊所：从标签、散文和过度控制中间穿过","description":"12组原创对照，示范怎样增加有效信息，而不是只增加字数。","type":"Technique","group":"language","tags":["改写","例子","自然语言"],"html":"<h1>11｜改写诊所：从标签、散文和过度控制中间穿过<\/h1>\n<h2 id=\"language-06-rewrite-clinic-section-0\">1．“悲伤”没有错，缺的是这一次的悲伤<\/h2>\n<p>薄：<code>女人悲伤地坐着，电影感。<\/code><\/p>\n<p>堆：<code>眼角、鼻翼、下巴依次颤抖，三秒内落泪。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>她坐在已经收拾好的房间里，手仍搭在椅背上。有人叫她走，她应了一声，却没有马上站起来。悲伤不靠哭来解释，留在这次没有完成的起身里。<\/p>\n<\/blockquote>\n<p>变化：情绪有了时间与阻力。若项目要痛哭，就应直接设计痛哭，不必套此方案。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-1\">2．“快乐”不应被修成不敢快乐<\/h2>\n<p>薄：<code>女孩开心，自然微笑。<\/code><\/p>\n<p>过修：<code>极其克制，不能大笑，不能明显动作。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>她认出人群里的朋友，边挥手边快步跑过去，笑声先到了。最后几步明显收住，怕撞到对方，但拥抱时还是带着一点冲劲。<\/p>\n<\/blockquote>\n<p>变化：喜悦有强度，也有接触前后的动作逻辑。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-2\">3．“愤怒”不仅是音量<\/h2>\n<p>薄：<code>男人愤怒地说：“你早就知道。”<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>“你”字说得很清楚，像是在确认对象；“早就”加重，后面的“知道”落下来。不是喊给全屋听，而是让面前这个人不能再躲开这句话。<\/p>\n<\/blockquote>\n<p>变化：重音与说话对象明确。精确声学执行仍需试听。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-3\">4．“自然”不是必须加瑕疵<\/h2>\n<p>薄：<code>真实自然，皮肤细腻，活人感。<\/code><\/p>\n<p>过修：<code>大量毛孔、颗粒、手持乱晃、曝光失误。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>她顺手把滑到手背的袖口挽回去，继续刚才没说完的话。保留原来干净的光，不加额外颗粒。<\/p>\n<\/blockquote>\n<p>变化：自然来自行为连续性，非瑕疵数量。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-4\">5．“梦幻”不是平均起雾<\/h2>\n<p>薄：<code>梦幻唯美的香水广告。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>瓶身保持清楚。背景的花影像隔着浅水被轻轻推开，只有影子发生变化，花与台面仍安静不动。梦意停在背景，不吞掉产品。<\/p>\n<\/blockquote>\n<p>变化：明确现实与非现实分别落在哪一层。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-5\">6．“高级”不是写满设备名<\/h2>\n<p>薄：<code>ARRI、电影大师、8K、奢华。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>深色瓶身只保留两条窄而连续的高光，标签正面清晰，瓶盖的金属边缘不泛成一大片白。背景有距离，但不抢主体。<\/p>\n<\/blockquote>\n<p>变化：审美被落到比例与材料关系，而不是品牌词。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-6\">7．“轻轻”不是整条慢放<\/h2>\n<p>薄：<code>轻轻把盒子放下。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>他把盒子移到桌上，接近桌面时才收慢。指尖多扶了一下，确认它站稳后离开。<\/p>\n<\/blockquote>\n<p>变化：只在关键接触处控制速度。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-7\">8．“镜头有现场感”不是永远抖<\/h2>\n<p>薄：<code>手持拍摄，真实电影感。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>摄影机在她身后半步跟走，转角时稍晚一点跟上，让门框短暂经过前景。整体稳定，只有走路带来的轻微起伏。<\/p>\n<\/blockquote>\n<p>变化：误差有来源、有幅度，也有观看理由。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-8\">9．“紧张地等待”不一定拍脸<\/h2>\n<p>薄：<code>面部紧张，焦虑，不安。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>电梯数字迟迟不变。她手里的钥匙碰了一声，之后被握住，不再响。镜头只拍手与关闭的电梯门。<\/p>\n<\/blockquote>\n<p>变化：手、道具与声音共同承担；脸不必进入画面。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-9\">10．“同一人物”要先排除参考冲突<\/h2>\n<p>薄：<code>千万别换脸，绝对一致，一模一样。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>人物身份使用参考A；本场服装采用参考B。A中的旧外套不延续到本场。其余姿态以当前首帧为起点。<\/p>\n<\/blockquote>\n<p>变化：先解决谁提供什么。参考绑定真实存在才成立。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-10\">11．“移过去”要区分复制与搬动<\/h2>\n<p>薄：<code>把标1的花瓶移到标2。<\/code><\/p>\n<p>可用方向：<\/p>\n<blockquote>\n<p>将标1所指的这只花瓶移到标2的桌面区域；原位置恢复为空桌面。保持同一瓶身和花枝，按新位置调整接触阴影，去掉辅助标记。<\/p>\n<\/blockquote>\n<p>变化：补齐移动前后状态，避免出现两只花瓶。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-11\">12．删掉一半后，反而更完整<\/h2>\n<p>原句：<code>极度细腻自然真实的年轻女孩，优雅而灵动，慢慢轻轻转过脸，带着五味杂陈的心情，镜头缓缓平稳推近又轻微环绕……<\/code><\/p>\n<p>针对已确定的首帧：<\/p>\n<blockquote>\n<p>她听见自己的名字，转向声音来的方向，认出对方后笑了。摄影机留在原地。<\/p>\n<\/blockquote>\n<p>变化：一个刺激、一个反应、一个镜头选择。不是所有项目都要这一版，而是这条任务已经不需要更多。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-12\">改完以后，别只比较文字<\/h2>\n<p>看<a href=\"#/workflows/07-evaluate-repair\">评价与修复<\/a>。提示词读起来更像文学、像电影教科书，或像工程规范，都不能代替成片是否表达对了。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 11｜改写诊所：从标签、散文和过度控制中间穿过\n\n## 1．“悲伤”没有错，缺的是这一次的悲伤\n\n薄：`女人悲伤地坐着，电影感。`\n\n堆：`眼角、鼻翼、下巴依次颤抖，三秒内落泪。`\n\n可用方向：\n> 她坐在已经收拾好的房间里，手仍搭在椅背上。有人叫她走，她应了一声，却没有马上站起来。悲伤不靠哭来解释，留在这次没有完成的起身里。\n\n变化：情绪有了时间与阻力。若项目要痛哭，就应直接设计痛哭，不必套此方案。\n\n## 2．“快乐”不应被修成不敢快乐\n\n薄：`女孩开心，自然微笑。`\n\n过修：`极其克制，不能大笑，不能明显动作。`\n\n可用方向：\n> 她认出人群里的朋友，边挥手边快步跑过去，笑声先到了。最后几步明显收住，怕撞到对方，但拥抱时还是带着一点冲劲。\n\n变化：喜悦有强度，也有接触前后的动作逻辑。\n\n## 3．“愤怒”不仅是音量\n\n薄：`男人愤怒地说：“你早就知道。”`\n\n可用方向：\n> “你”字说得很清楚，像是在确认对象；“早就”加重，后面的“知道”落下来。不是喊给全屋听，而是让面前这个人不能再躲开这句话。\n\n变化：重音与说话对象明确。精确声学执行仍需试听。\n\n## 4．“自然”不是必须加瑕疵\n\n薄：`真实自然，皮肤细腻，活人感。`\n\n过修：`大量毛孔、颗粒、手持乱晃、曝光失误。`\n\n可用方向：\n> 她顺手把滑到手背的袖口挽回去，继续刚才没说完的话。保留原来干净的光，不加额外颗粒。\n\n变化：自然来自行为连续性，非瑕疵数量。\n\n## 5．“梦幻”不是平均起雾\n\n薄：`梦幻唯美的香水广告。`\n\n可用方向：\n> 瓶身保持清楚。背景的花影像隔着浅水被轻轻推开，只有影子发生变化，花与台面仍安静不动。梦意停在背景，不吞掉产品。\n\n变化：明确现实与非现实分别落在哪一层。\n\n## 6．“高级”不是写满设备名\n\n薄：`ARRI、电影大师、8K、奢华。`\n\n可用方向：\n> 深色瓶身只保留两条窄而连续的高光，标签正面清晰，瓶盖的金属边缘不泛成一大片白。背景有距离，但不抢主体。\n\n变化：审美被落到比例与材料关系，而不是品牌词。\n\n## 7．“轻轻”不是整条慢放\n\n薄：`轻轻把盒子放下。`\n\n可用方向：\n> 他把盒子移到桌上，接近桌面时才收慢。指尖多扶了一下，确认它站稳后离开。\n\n变化：只在关键接触处控制速度。\n\n## 8．“镜头有现场感”不是永远抖\n\n薄：`手持拍摄，真实电影感。`\n\n可用方向：\n> 摄影机在她身后半步跟走，转角时稍晚一点跟上，让门框短暂经过前景。整体稳定，只有走路带来的轻微起伏。\n\n变化：误差有来源、有幅度，也有观看理由。\n\n## 9．“紧张地等待”不一定拍脸\n\n薄：`面部紧张，焦虑，不安。`\n\n可用方向：\n> 电梯数字迟迟不变。她手里的钥匙碰了一声，之后被握住，不再响。镜头只拍手与关闭的电梯门。\n\n变化：手、道具与声音共同承担；脸不必进入画面。\n\n## 10．“同一人物”要先排除参考冲突\n\n薄：`千万别换脸，绝对一致，一模一样。`\n\n可用方向：\n> 人物身份使用参考A；本场服装采用参考B。A中的旧外套不延续到本场。其余姿态以当前首帧为起点。\n\n变化：先解决谁提供什么。参考绑定真实存在才成立。\n\n## 11．“移过去”要区分复制与搬动\n\n薄：`把标1的花瓶移到标2。`\n\n可用方向：\n> 将标1所指的这只花瓶移到标2的桌面区域；原位置恢复为空桌面。保持同一瓶身和花枝，按新位置调整接触阴影，去掉辅助标记。\n\n变化：补齐移动前后状态，避免出现两只花瓶。\n\n## 12．删掉一半后，反而更完整\n\n原句：`极度细腻自然真实的年轻女孩，优雅而灵动，慢慢轻轻转过脸，带着五味杂陈的心情，镜头缓缓平稳推近又轻微环绕……`\n\n针对已确定的首帧：\n> 她听见自己的名字，转向声音来的方向，认出对方后笑了。摄影机留在原地。\n\n变化：一个刺激、一个反应、一个镜头选择。不是所有项目都要这一版，而是这条任务已经不需要更多。\n\n## 改完以后，别只比较文字\n\n看[评价与修复](/workflows/07-evaluate-repair.md)。提示词读起来更像文学、像电影教科书，或像工程规范，都不能代替成片是否表达对了。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"language-06-rewrite-clinic-section-0","title":"1．“悲伤”没有错，缺的是这一次的悲伤"},{"id":"language-06-rewrite-clinic-section-1","title":"2．“快乐”不应被修成不敢快乐"},{"id":"language-06-rewrite-clinic-section-2","title":"3．“愤怒”不仅是音量"},{"id":"language-06-rewrite-clinic-section-3","title":"4．“自然”不是必须加瑕疵"},{"id":"language-06-rewrite-clinic-section-4","title":"5．“梦幻”不是平均起雾"},{"id":"language-06-rewrite-clinic-section-5","title":"6．“高级”不是写满设备名"},{"id":"language-06-rewrite-clinic-section-6","title":"7．“轻轻”不是整条慢放"},{"id":"language-06-rewrite-clinic-section-7","title":"8．“镜头有现场感”不是永远抖"},{"id":"language-06-rewrite-clinic-section-8","title":"9．“紧张地等待”不一定拍脸"},{"id":"language-06-rewrite-clinic-section-9","title":"10．“同一人物”要先排除参考冲突"},{"id":"language-06-rewrite-clinic-section-10","title":"11．“移过去”要区分复制与搬动"},{"id":"language-06-rewrite-clinic-section-11","title":"12．删掉一半后，反而更完整"},{"id":"language-06-rewrite-clinic-section-12","title":"改完以后，别只比较文字"}]},{"id":"craft/index","path":"craft/index.md","title":"III · 视听专业","description":"","type":"Index","group":"craft","tags":[],"html":"<h1>III · 视听专业<\/h1>\n<p>分别调动表演、摄影、美术、声音、剪辑与平面设计。<\/p>\n<ul>\n<li><p><a href=\"#/craft/01-acting\">12｜表演：让情绪有对象、有代价、有变化<\/a> — 从人物在做什么开始，选择动作和反应，而不是替面部肌肉排班。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/02-dialogue-voice\">13｜台词与声音：不是换一副嗓子，是换一种说话关系<\/a> — 把角色声线、当场策略、语言节奏与声学空间分别设计。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/03-action-blocking\">14｜动作与调度：让物体有来处，让角色有去处<\/a> — 拆清空间任务、接触和持有状态；用自然过程连接关键事实。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/04-camera-attention\">15｜镜头：不是更会运动，而是更会选择<\/a> — 把观看位置、信息顺序与摄影机动作分开；让机位服务表达。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/05-light-material\">16｜光与材质：让空气、表面和重量互相解释<\/a> — 分清方向、软硬、明暗、颜色与材质反应，把质感落到具体表面。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/06-world-art-costume\">17｜美术与妆造：世界不是背景，身份不只是一张脸<\/a> — 用空间、使用方式和状态痕迹设计人物与世界，避免性别和风格模板。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/07-sound-music\">18｜音乐与声音：让看不见的东西改变画面<\/a> — 从听觉视点、叙事功能和时间变化设计声音，而不是只填流派与情绪。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/08-still-graphic-style\">19｜静态图像、平面与风格化：不必把一张图写成电影<\/a> — 在没有时间轴时组织主次、关系、材料与阅读顺序，允许非叙事图像成立。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/09-time-montage\">20｜时间与剪辑：提示词里发生了，不代表观众来得及读<\/a> — 把动作时长、信息读取、反应和转场放进同一个观看节奏。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# III · 视听专业\n\n分别调动表演、摄影、美术、声音、剪辑与平面设计。\n\n- [12｜表演：让情绪有对象、有代价、有变化](/craft/01-acting.md) — 从人物在做什么开始，选择动作和反应，而不是替面部肌肉排班。\n\n- [13｜台词与声音：不是换一副嗓子，是换一种说话关系](/craft/02-dialogue-voice.md) — 把角色声线、当场策略、语言节奏与声学空间分别设计。\n\n- [14｜动作与调度：让物体有来处，让角色有去处](/craft/03-action-blocking.md) — 拆清空间任务、接触和持有状态；用自然过程连接关键事实。\n\n- [15｜镜头：不是更会运动，而是更会选择](/craft/04-camera-attention.md) — 把观看位置、信息顺序与摄影机动作分开；让机位服务表达。\n\n- [16｜光与材质：让空气、表面和重量互相解释](/craft/05-light-material.md) — 分清方向、软硬、明暗、颜色与材质反应，把质感落到具体表面。\n\n- [17｜美术与妆造：世界不是背景，身份不只是一张脸](/craft/06-world-art-costume.md) — 用空间、使用方式和状态痕迹设计人物与世界，避免性别和风格模板。\n\n- [18｜音乐与声音：让看不见的东西改变画面](/craft/07-sound-music.md) — 从听觉视点、叙事功能和时间变化设计声音，而不是只填流派与情绪。\n\n- [19｜静态图像、平面与风格化：不必把一张图写成电影](/craft/08-still-graphic-style.md) — 在没有时间轴时组织主次、关系、材料与阅读顺序，允许非叙事图像成立。\n\n- [20｜时间与剪辑：提示词里发生了，不代表观众来得及读](/craft/09-time-montage.md) — 把动作时长、信息读取、反应和转场放进同一个观看节奏。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"craft/01-acting","path":"craft/01-acting.md","title":"12｜表演：让情绪有对象、有代价、有变化","description":"从人物在做什么开始，选择动作和反应，而不是替面部肌肉排班。","type":"Technique","group":"craft","tags":["表演","情绪","角色"],"html":"<h1>12｜表演：让情绪有对象、有代价、有变化<\/h1>\n<h2 id=\"craft-01-acting-section-0\">先问他想影响谁<\/h2>\n<p>“愤怒”是一种状态；“让对方承认自己知道真相”是一项任务。相同愤怒，为了逼问、求助、挽留或结束关系，说话方式和身体选择会不同。给出对象与目标，才能减少角色只对着观众展示表情的感觉。<\/p>\n<p>一个足够用的表演说明是：<strong>当下任务 + 刺激 + 反应变化 + 对外表现<\/strong>。不一定全是隐藏情绪；“听到好消息，迫不及待地告诉全屋人”同样完整。<\/p>\n<h2 id=\"craft-01-acting-section-1\">内外不一致，是选项，不是统一人格<\/h2>\n<p>教程04的反向表演，最有价值的是让人物的内心压力与表面任务发生关系。[1] 例如：<\/p>\n<blockquote>\n<p>她已经听懂拒绝，却不想让第一次来的朋友难堪。她把菜单递给对方，继续问他想喝什么；只在收回手时，视线离开了一下。<\/p>\n<\/blockquote>\n<p>重要的不是“必须隐忍”，而是<strong>她仍在完成照顾对方的任务<\/strong>。别把生气跺脚自动视为掩饰，也别把“没有任何表情”视为内心丰富。<\/p>\n<h2 id=\"craft-01-acting-section-2\">身体动作、跟随动作、细微反应有主从<\/h2>\n<p>主动作是伸手接住盒子；跟随动作是袖口与盒上的丝带随之移动；细微反应是发现盒子里没有重量后再看向对方。<\/p>\n<p>不要写成三条互不相关的循环：“她接盒子；袖子飘；眼睛闪动”。应让关系发生：<strong>接到 → 感到异样 → 重新判断<\/strong>。只有在对应景别能看见时，再写握力、眼神或呼吸的变化。<\/p>\n<h2 id=\"craft-01-acting-section-3\">选择合适的表演尺度<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>镜头给了什么<\/th>\n<th>可以优先写什么<\/th>\n<th>容易失效的要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>远景或小屏人物很小<\/td>\n<td>站位、走停、转身、距离<\/td>\n<td>极细小眼角变化承载全部剧情<\/td>\n<\/tr>\n<tr>\n<td>中景<\/td>\n<td>手部任务、重心、身体朝向、听者反应<\/td>\n<td>面部与手部同时过密指挥<\/td>\n<\/tr>\n<tr>\n<td>近景<\/td>\n<td>看向谁、反应延迟、嘴角或下颌的变化<\/td>\n<td>没有对象的不断“微表情”<\/td>\n<\/tr>\n<tr>\n<td>手部或道具特写<\/td>\n<td>触碰、迟疑、松开、使用痕迹<\/td>\n<td>无缘无故要求全身表演<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>这张表是创作选材建议，不是模型规格。发布端画幅和实际观看尺寸会进一步影响可读性。<\/p>\n<h2 id=\"craft-01-acting-section-4\">一次反应，可以有三个节拍<\/h2>\n<p><strong>先维持原来的事<\/strong>：还在整理桌面。<\/p>\n<p><strong>刺激真的进来了<\/strong>：听到名字，动作停住。<\/p>\n<p><strong>做出新的选择<\/strong>：将杯子放回，转身去开门。<\/p>\n<p>不要为了有时间轴，把它写成0.2秒眉动、0.4秒瞳孔放大。秒数用于剪辑和生成预算，不能替代动作因果。若只有三秒，就减少反应层次；不要要求角色在同一秒里从震惊到悲伤再释然。<\/p>\n<h2 id=\"craft-01-acting-section-5\">对手戏的另一半：听的人<\/h2>\n<p>说话者的台词不是唯一事件。听者是否打断、后退、继续手头任务、把物件接过来，都会改变关系。例如：<\/p>\n<blockquote>\n<p>她说“我没事”，对方没有马上劝她，只把刚要收走的椅子放回原处。<\/p>\n<\/blockquote>\n<p>画面可以不解释安慰，但一个留座动作让关系发生了变化。听者也不必每句话都点头微笑，生活里有不同步与误解。<\/p>\n<h2 id=\"craft-01-acting-section-6\">如何修改表演失败<\/h2>\n<p>太满：先减少同时发生的表情，保留任务与一次关键反应。太空：不要加“更有演技”，补上刺激与动作后果。像摆拍：检查人物是否无理由一直看镜头。动作奇怪：回到首帧的手、姿势与道具位置，而不是只改情绪词。<\/p>\n<p>强烈情绪的完整案例见<a href=\"#/cases/03-big-emotion\">喜悦与释放<\/a>，较小反应见<a href=\"#/cases/02-relationship\">餐桌关系<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 12｜表演：让情绪有对象、有代价、有变化\n\n## 先问他想影响谁\n\n“愤怒”是一种状态；“让对方承认自己知道真相”是一项任务。相同愤怒，为了逼问、求助、挽留或结束关系，说话方式和身体选择会不同。给出对象与目标，才能减少角色只对着观众展示表情的感觉。\n\n一个足够用的表演说明是：**当下任务 + 刺激 + 反应变化 + 对外表现**。不一定全是隐藏情绪；“听到好消息，迫不及待地告诉全屋人”同样完整。\n\n## 内外不一致，是选项，不是统一人格\n\n教程04的反向表演，最有价值的是让人物的内心压力与表面任务发生关系。[1] 例如：\n\n> 她已经听懂拒绝，却不想让第一次来的朋友难堪。她把菜单递给对方，继续问他想喝什么；只在收回手时，视线离开了一下。\n\n重要的不是“必须隐忍”，而是**她仍在完成照顾对方的任务**。别把生气跺脚自动视为掩饰，也别把“没有任何表情”视为内心丰富。\n\n## 身体动作、跟随动作、细微反应有主从\n\n主动作是伸手接住盒子；跟随动作是袖口与盒上的丝带随之移动；细微反应是发现盒子里没有重量后再看向对方。\n\n不要写成三条互不相关的循环：“她接盒子；袖子飘；眼睛闪动”。应让关系发生：**接到 → 感到异样 → 重新判断**。只有在对应景别能看见时，再写握力、眼神或呼吸的变化。\n\n## 选择合适的表演尺度\n\n| 镜头给了什么 | 可以优先写什么 | 容易失效的要求 |\n| --- | --- | --- |\n| 远景或小屏人物很小 | 站位、走停、转身、距离 | 极细小眼角变化承载全部剧情 |\n| 中景 | 手部任务、重心、身体朝向、听者反应 | 面部与手部同时过密指挥 |\n| 近景 | 看向谁、反应延迟、嘴角或下颌的变化 | 没有对象的不断“微表情” |\n| 手部或道具特写 | 触碰、迟疑、松开、使用痕迹 | 无缘无故要求全身表演 |\n\n这张表是创作选材建议，不是模型规格。发布端画幅和实际观看尺寸会进一步影响可读性。\n\n## 一次反应，可以有三个节拍\n\n**先维持原来的事**：还在整理桌面。\n\n**刺激真的进来了**：听到名字，动作停住。\n\n**做出新的选择**：将杯子放回，转身去开门。\n\n不要为了有时间轴，把它写成0.2秒眉动、0.4秒瞳孔放大。秒数用于剪辑和生成预算，不能替代动作因果。若只有三秒，就减少反应层次；不要要求角色在同一秒里从震惊到悲伤再释然。\n\n## 对手戏的另一半：听的人\n\n说话者的台词不是唯一事件。听者是否打断、后退、继续手头任务、把物件接过来，都会改变关系。例如：\n\n> 她说“我没事”，对方没有马上劝她，只把刚要收走的椅子放回原处。\n\n画面可以不解释安慰，但一个留座动作让关系发生了变化。听者也不必每句话都点头微笑，生活里有不同步与误解。\n\n## 如何修改表演失败\n\n太满：先减少同时发生的表情，保留任务与一次关键反应。太空：不要加“更有演技”，补上刺激与动作后果。像摆拍：检查人物是否无理由一直看镜头。动作奇怪：回到首帧的手、姿势与道具位置，而不是只改情绪词。\n\n强烈情绪的完整案例见[喜悦与释放](/cases/03-big-emotion.md)，较小反应见[餐桌关系](/cases/02-relationship.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"craft-01-acting-section-0","title":"先问他想影响谁"},{"id":"craft-01-acting-section-1","title":"内外不一致，是选项，不是统一人格"},{"id":"craft-01-acting-section-2","title":"身体动作、跟随动作、细微反应有主从"},{"id":"craft-01-acting-section-3","title":"选择合适的表演尺度"},{"id":"craft-01-acting-section-4","title":"一次反应，可以有三个节拍"},{"id":"craft-01-acting-section-5","title":"对手戏的另一半：听的人"},{"id":"craft-01-acting-section-6","title":"如何修改表演失败"}]},{"id":"craft/02-dialogue-voice","path":"craft/02-dialogue-voice.md","title":"13｜台词与声音：不是换一副嗓子，是换一种说话关系","description":"把角色声线、当场策略、语言节奏与声学空间分别设计。","type":"Technique","group":"craft","tags":["声音","配音","对白","节奏"],"html":"<h1>13｜台词与声音：不是换一副嗓子，是换一种说话关系<\/h1>\n<blockquote>\n<p>同一句“你终于来了”，可以是松一口气，可以是责怪，也可以是一个等了很久却还想装作无所谓的人，决定先把门打开。<\/p>\n<\/blockquote>\n<h2 id=\"craft-02-dialogue-voice-section-0\">四层要分开<\/h2>\n<p><strong>角色长期声线<\/strong>：大致音区、声音厚薄、气息与沙哑程度、语言或口音。只保留能跨镜头使用的特点。<\/p>\n<p><strong>这一次怎么说<\/strong>：想安抚、催促、试探、掩饰，还是把话说绝；说给谁，距离多近，身体是否正在运动。<\/p>\n<p><strong>句子怎么走<\/strong>：哪一词加重，哪一处停，什么时候压低、加快、拖住或突然结束。<\/p>\n<p><strong>声音处在什么空间<\/strong>：近处干声、隔门、电话、空房间、街道。空间不应与情绪混成一个“电影配音感”。<\/p>\n<p>教程02偏向单句表演，06偏向跨片声线一致；合起来比“深沉男声、悲伤女声”更有用。[1]<\/p>\n<h2 id=\"craft-02-dialogue-voice-section-1\">台词先像这个人会说的话<\/h2>\n<p>“抓住绳子，我数到三，你就往外爬”并非天然坏台词：训练中的教练可能就需要清楚下达指令。它是否机械，取决于现场压力与角色说话习惯。<\/p>\n<p>在紧迫情景下也许是：<\/p>\n<blockquote>\n<p>“手给我。别看下面——抓紧。对，跟着我。”<\/p>\n<\/blockquote>\n<p>在镇定指导下也许是：<\/p>\n<blockquote>\n<p>“先抓稳。我数三下，你再动。”<\/p>\n<\/blockquote>\n<p>不要把每句都改成省略号、口吃和碎句。它们一旦统一出现，就会变成另一种模板腔。<\/p>\n<h2 id=\"craft-02-dialogue-voice-section-2\">同一句话，写三种说法<\/h2>\n<p>台词：<strong>“我知道了。”<\/strong><\/p>\n<p>接受：句子完整落下，呼吸松开，之后继续动作。<\/p>\n<p>敷衍：说得比平常快，不看对方，手头事情没有停。<\/p>\n<p>受伤但收住：先停一下，“知道”说清楚，末尾不向上寻求确认；放下手里的东西再抬眼。<\/p>\n<p>这三种说明不是科学声学参数，而是表演方向。试听时看是否真的实现，别被文字的细腻说服。<\/p>\n<h2 id=\"craft-02-dialogue-voice-section-3\">台词、导演备注与时间表分开<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">台词正文：你终于来了。先坐，我给你倒水。\n说话对象：刚从外面进门的老朋友。\n声音方向：成年女性，温和中音，吐字自然，不用播报腔。\n当场状态：原本有点担心，开口时放松下来；“先坐”像顺手招呼，不是正式邀请。\n空间：安静住宅内，距离近，有少量自然室内反射。\n<\/code><\/pre>\n<p>只有支持指令与台词分离的接口才能直接照此提交；否则把备注放到专用指令栏，避免被念出来。声音标签、SSML和标点在不同模型里的支持不同。ElevenLabs的官方说明就区分了不同模型的停顿控制方式。[2] <strong>省略号不等于固定0.3秒。<\/strong><\/p>\n<h2 id=\"craft-02-dialogue-voice-section-4\">先试听，再对口型<\/h2>\n<p>需要重要对白的片段，优先确定台词是否顺、音色是否像同一个人、实际时长是否装得下。时长不够先删句或延长镜头，不要把演员压成高速朗读。后期加停顿时，也要同步调整口型、动作和环境音。<\/p>\n<p>纯配音、原生音画生成和后期对口型是不同路线。选择哪条取决于声音是否关键、平台实际支持什么、是否需要分轨修订。不要一边锁死已生成的口型，一边任意改台词。<\/p>\n<h2 id=\"craft-02-dialogue-voice-section-5\">“像真人”不是模仿某个真人的默认许可<\/h2>\n<p>使用自有、获准的声音素材。保存角色声线的来源与使用范围；声线辨识不稳定时，不靠无限堆描述补救，也可重新选择样本、改变制作路线。这里只提供创作与制作建议，不作任何具体授权的法律判断。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-voice-light\">声音与光线：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 13｜台词与声音：不是换一副嗓子，是换一种说话关系\n\n> 同一句“你终于来了”，可以是松一口气，可以是责怪，也可以是一个等了很久却还想装作无所谓的人，决定先把门打开。\n\n## 四层要分开\n\n**角色长期声线**：大致音区、声音厚薄、气息与沙哑程度、语言或口音。只保留能跨镜头使用的特点。\n\n**这一次怎么说**：想安抚、催促、试探、掩饰，还是把话说绝；说给谁，距离多近，身体是否正在运动。\n\n**句子怎么走**：哪一词加重，哪一处停，什么时候压低、加快、拖住或突然结束。\n\n**声音处在什么空间**：近处干声、隔门、电话、空房间、街道。空间不应与情绪混成一个“电影配音感”。\n\n教程02偏向单句表演，06偏向跨片声线一致；合起来比“深沉男声、悲伤女声”更有用。[1]\n\n## 台词先像这个人会说的话\n\n“抓住绳子，我数到三，你就往外爬”并非天然坏台词：训练中的教练可能就需要清楚下达指令。它是否机械，取决于现场压力与角色说话习惯。\n\n在紧迫情景下也许是：\n> “手给我。别看下面——抓紧。对，跟着我。”\n\n在镇定指导下也许是：\n> “先抓稳。我数三下，你再动。”\n\n不要把每句都改成省略号、口吃和碎句。它们一旦统一出现，就会变成另一种模板腔。\n\n## 同一句话，写三种说法\n\n台词：**“我知道了。”**\n\n接受：句子完整落下，呼吸松开，之后继续动作。\n\n敷衍：说得比平常快，不看对方，手头事情没有停。\n\n受伤但收住：先停一下，“知道”说清楚，末尾不向上寻求确认；放下手里的东西再抬眼。\n\n这三种说明不是科学声学参数，而是表演方向。试听时看是否真的实现，别被文字的细腻说服。\n\n## 台词、导演备注与时间表分开\n\n```text\n台词正文：你终于来了。先坐，我给你倒水。\n说话对象：刚从外面进门的老朋友。\n声音方向：成年女性，温和中音，吐字自然，不用播报腔。\n当场状态：原本有点担心，开口时放松下来；“先坐”像顺手招呼，不是正式邀请。\n空间：安静住宅内，距离近，有少量自然室内反射。\n```\n\n只有支持指令与台词分离的接口才能直接照此提交；否则把备注放到专用指令栏，避免被念出来。声音标签、SSML和标点在不同模型里的支持不同。ElevenLabs的官方说明就区分了不同模型的停顿控制方式。[2] **省略号不等于固定0.3秒。**\n\n## 先试听，再对口型\n\n需要重要对白的片段，优先确定台词是否顺、音色是否像同一个人、实际时长是否装得下。时长不够先删句或延长镜头，不要把演员压成高速朗读。后期加停顿时，也要同步调整口型、动作和环境音。\n\n纯配音、原生音画生成和后期对口型是不同路线。选择哪条取决于声音是否关键、平台实际支持什么、是否需要分轨修订。不要一边锁死已生成的口型，一边任意改台词。\n\n## “像真人”不是模仿某个真人的默认许可\n\n使用自有、获准的声音素材。保存角色声线的来源与使用范围；声线辨识不稳定时，不靠无限堆描述补救，也可重新选择样本、改变制作路线。这里只提供创作与制作建议，不作任何具体授权的法律判断。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [声音与光线：第一方依据与适用边界](/references/official-voice-light.md)","toc":[{"id":"craft-02-dialogue-voice-section-0","title":"四层要分开"},{"id":"craft-02-dialogue-voice-section-1","title":"台词先像这个人会说的话"},{"id":"craft-02-dialogue-voice-section-2","title":"同一句话，写三种说法"},{"id":"craft-02-dialogue-voice-section-3","title":"台词、导演备注与时间表分开"},{"id":"craft-02-dialogue-voice-section-4","title":"先试听，再对口型"},{"id":"craft-02-dialogue-voice-section-5","title":"“像真人”不是模仿某个真人的默认许可"}]},{"id":"craft/03-action-blocking","path":"craft/03-action-blocking.md","title":"14｜动作与调度：让物体有来处，让角色有去处","description":"拆清空间任务、接触和持有状态；用自然过程连接关键事实。","type":"Technique","group":"craft","tags":["动作","调度","道具","连续性"],"html":"<h1>14｜动作与调度：让物体有来处，让角色有去处<\/h1>\n<h2 id=\"craft-03-action-blocking-section
