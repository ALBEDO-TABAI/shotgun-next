-0\">动作不是动词数量，而是状态真的改变<\/h2>\n<p>“她拿起、打开、查看、放下、起身、走开”不因为有六个动词就更丰富。一段五秒镜头也许只需“她把盒盖抬起，看到里面后没有再往上打开”。动作未完成，信息反而明确。<\/p>\n<p>先画出最小变化：<strong>起点 → 关键接触或决定 → 终点<\/strong>。例如杯子起初在桌上，手接触杯柄，最后杯子离开桌面且仍在同一只手里。要表现举杯敬人，再加目光对象与终点位置。<\/p>\n<h2 id=\"craft-03-action-blocking-section-1\">关键接触要写，身体自然过渡可以留<\/h2>\n<p>走路不必逐只脚安排；碰撞、握手、交接、拿取、开盖则常需要交代对象和前后状态。教程01的调包尤其如此：运镜准确，不代表观众看懂了物件交换。[1]<\/p>\n<p>可用说明：<\/p>\n<blockquote>\n<p>A先伸出右手，B把钥匙落进她掌心；A合上手指后，B才松开。两人的手短暂同框，让钥匙的去向可辨认。<\/p>\n<\/blockquote>\n<p>“短暂同框”是信息条件，不一定要超近手部特写。若模型难以稳定生成接触，拆成接近、遮挡、结果三个镜头也是合法制作选择，前提是观众仍能理解，且不冒充连续实拍。<\/p>\n<h2 id=\"craft-03-action-blocking-section-2\">随身道具要有手位账，不要建庞大系统<\/h2>\n<p>一人拿手机自拍、推门、捧咖啡、举相机，可能已经需要四只手。只写一个简短状态表：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时刻<\/th>\n<th>左手<\/th>\n<th>右手<\/th>\n<th>其他物件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>门口<\/td>\n<td>推门<\/td>\n<td>持手机拍摄<\/td>\n<td>相机挂颈，咖啡未出现<\/td>\n<\/tr>\n<tr>\n<td>桌边<\/td>\n<td>空手<\/td>\n<td>手机放稳后松开<\/td>\n<td>咖啡在桌上<\/td>\n<\/tr>\n<tr>\n<td>拍照<\/td>\n<td>托相机<\/td>\n<td>按快门<\/td>\n<td>手机已固定，不再声称手持自拍<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>这不是要逐帧写账本，而是避免物件无故出现、消失和换手。Vlog完整应用见<a href=\"#/cases/04-vlog\">谁在拍谁<\/a>。<\/p>\n<h2 id=\"craft-03-action-blocking-section-3\">场面调度写关系变化<\/h2>\n<p>从屏风后走到对方面前，是空间移动；从不敢打扰到主动提出要求，是关系移动。二者最好互相解释。<\/p>\n<blockquote>\n<p>她先停在他视线之外，听完一句话后才走出来。不是为绕路而绕路；走近的那一步，意味着她不再等别人允许自己开口。<\/p>\n<\/blockquote>\n<p>另一人是否让出座位、后退、转身或继续手里的事，决定这次走近有没有真正改变场面。<\/p>\n<h2 id=\"craft-03-action-blocking-section-4\">固定世界坐标，慎用连续的左右<\/h2>\n<p>对于简单画面，画面左侧、门旁已经足够。多人或大幅换机位时，先确定门、窗、桌等稳定地标；让角色“从窗边到桌子的门侧”，比跨镜头重复“从左到右”更不易自相矛盾。<\/p>\n<p>动作线或视线连续不是禁止越轴。需要观众看懂朝向时保持清楚，故意改变方向时提供新的定位线索。先问观众该不该迷失，再决定是否制造迷失。<\/p>\n<h2 id=\"craft-03-action-blocking-section-5\">让重量留下结果<\/h2>\n<p>停步后包碰一下腿，水洒到桌面后仍留下湿处，推开椅子后椅子不立刻回到原位。后果比“物理真实”四个字更可检查。但不要强迫所有材质以同样幅度弹跳。<\/p>\n<p>困难动作可用参考视频、动作草图或三维预演。新增参考必须与选定角色状态、空间和时长相容；“参考很多”不代表一致性更强。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 14｜动作与调度：让物体有来处，让角色有去处\n\n## 动作不是动词数量，而是状态真的改变\n\n“她拿起、打开、查看、放下、起身、走开”不因为有六个动词就更丰富。一段五秒镜头也许只需“她把盒盖抬起，看到里面后没有再往上打开”。动作未完成，信息反而明确。\n\n先画出最小变化：**起点 → 关键接触或决定 → 终点**。例如杯子起初在桌上，手接触杯柄，最后杯子离开桌面且仍在同一只手里。要表现举杯敬人，再加目光对象与终点位置。\n\n## 关键接触要写，身体自然过渡可以留\n\n走路不必逐只脚安排；碰撞、握手、交接、拿取、开盖则常需要交代对象和前后状态。教程01的调包尤其如此：运镜准确，不代表观众看懂了物件交换。[1]\n\n可用说明：\n> A先伸出右手，B把钥匙落进她掌心；A合上手指后，B才松开。两人的手短暂同框，让钥匙的去向可辨认。\n\n“短暂同框”是信息条件，不一定要超近手部特写。若模型难以稳定生成接触，拆成接近、遮挡、结果三个镜头也是合法制作选择，前提是观众仍能理解，且不冒充连续实拍。\n\n## 随身道具要有手位账，不要建庞大系统\n\n一人拿手机自拍、推门、捧咖啡、举相机，可能已经需要四只手。只写一个简短状态表：\n\n| 时刻 | 左手 | 右手 | 其他物件 |\n| --- | --- | --- | --- |\n| 门口 | 推门 | 持手机拍摄 | 相机挂颈，咖啡未出现 |\n| 桌边 | 空手 | 手机放稳后松开 | 咖啡在桌上 |\n| 拍照 | 托相机 | 按快门 | 手机已固定，不再声称手持自拍 |\n\n这不是要逐帧写账本，而是避免物件无故出现、消失和换手。Vlog完整应用见[谁在拍谁](/cases/04-vlog.md)。\n\n## 场面调度写关系变化\n\n从屏风后走到对方面前，是空间移动；从不敢打扰到主动提出要求，是关系移动。二者最好互相解释。\n\n> 她先停在他视线之外，听完一句话后才走出来。不是为绕路而绕路；走近的那一步，意味着她不再等别人允许自己开口。\n\n另一人是否让出座位、后退、转身或继续手里的事，决定这次走近有没有真正改变场面。\n\n## 固定世界坐标，慎用连续的左右\n\n对于简单画面，画面左侧、门旁已经足够。多人或大幅换机位时，先确定门、窗、桌等稳定地标；让角色“从窗边到桌子的门侧”，比跨镜头重复“从左到右”更不易自相矛盾。\n\n动作线或视线连续不是禁止越轴。需要观众看懂朝向时保持清楚，故意改变方向时提供新的定位线索。先问观众该不该迷失，再决定是否制造迷失。\n\n## 让重量留下结果\n\n停步后包碰一下腿，水洒到桌面后仍留下湿处，推开椅子后椅子不立刻回到原位。后果比“物理真实”四个字更可检查。但不要强迫所有材质以同样幅度弹跳。\n\n困难动作可用参考视频、动作草图或三维预演。新增参考必须与选定角色状态、空间和时长相容；“参考很多”不代表一致性更强。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"craft-03-action-blocking-section-0","title":"动作不是动词数量，而是状态真的改变"},{"id":"craft-03-action-blocking-section-1","title":"关键接触要写，身体自然过渡可以留"},{"id":"craft-03-action-blocking-section-2","title":"随身道具要有手位账，不要建庞大系统"},{"id":"craft-03-action-blocking-section-3","title":"场面调度写关系变化"},{"id":"craft-03-action-blocking-section-4","title":"固定世界坐标，慎用连续的左右"},{"id":"craft-03-action-blocking-section-5","title":"让重量留下结果"}]},{"id":"craft/04-camera-attention","path":"craft/04-camera-attention.md","title":"15｜镜头：不是更会运动，而是更会选择","description":"把观看位置、信息顺序与摄影机动作分开；让机位服务表达。","type":"Technique","group":"craft","tags":["镜头","机位","注意力","运镜"],"html":"<h1>15｜镜头：不是更会运动，而是更会选择<\/h1>\n<blockquote>\n<p>摄影机可以靠近一个人，也可以拒绝靠近。后一种选择，有时比推到眼泪上更有力量。<\/p>\n<\/blockquote>\n<h2 id=\"craft-04-camera-attention-section-0\">先说观众站在哪里<\/h2>\n<p>眼平、贴地、俯瞰不直接等于自然、压迫或脆弱。它们先改变可见内容与空间关系，具体感受还取决于人物、光、距离、剪辑和声音。教程10提供的是一种有效方向，不是“平视必假”的规律。[1]<\/p>\n<p><strong>贴近桌面<\/strong>可能让一只迟迟没有接过来的手变得重要；<strong>隔着人群<\/strong>可能让错过发生在视线里；<strong>正面平视<\/strong>可以让人像坐在角色对面，直接承受一句话。选机位时，先问这个位置让谁知道什么。<\/p>\n<h2 id=\"craft-04-camera-attention-section-1\">六个要素，不要混叫“运镜”<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>要素<\/th>\n<th>人话问法<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>位置与高度<\/td>\n<td>摄影机在哪里？<\/td>\n<td>门内侧、桌沿高度<\/td>\n<\/tr>\n<tr>\n<td>朝向<\/td>\n<td>看向哪里？<\/td>\n<td>看向窗边的人，而非房间中心<\/td>\n<\/tr>\n<tr>\n<td>取景范围<\/td>\n<td>让多少内容进入？<\/td>\n<td>只见手、杯与对面空椅<\/td>\n<\/tr>\n<tr>\n<td>透视关系<\/td>\n<td>近处与远处怎样相处？<\/td>\n<td>近处栏杆占画面，人物在后方<\/td>\n<\/tr>\n<tr>\n<td>运动<\/td>\n<td>摄影机本身怎么变？<\/td>\n<td>向右平移，让门框退出前景<\/td>\n<\/tr>\n<tr>\n<td>焦点与成像<\/td>\n<td>哪一层清楚，运动怎样留下痕迹？<\/td>\n<td>焦点在握杯的手，不在窗外<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>“推近”有时指摄影机前移，有时指变焦。需要视差和遮挡变化时，应写清前移或横移；单纯放大画面不能自动让你看见遮挡物后面。[2] 类似地，摇摄是改变观看方向，不是摄影机绕主体换位置。<\/p>\n<h2 id=\"craft-04-camera-attention-section-2\">一条镜头，先选一件主要工作<\/h2>\n<p><strong>跟随<\/strong>：与人物保持一段距离，让变化在路途中出现。<\/p>\n<p><strong>揭示<\/strong>：从局部到关系，例如门框后的人进入可见范围。<\/p>\n<p><strong>逼近<\/strong>：减少退路或扩大一个反应的重要性。<\/p>\n<p><strong>撤离<\/strong>：把人物留给环境，或显示事情比原先大。<\/p>\n<p><strong>等待<\/strong>：不替观众挑反应，给事件自行发生的机会。<\/p>\n<p>这些可以组合，但不必在八秒内全做。把“推进、环绕、升高、拉焦、甩镜”串在一起，往往没有说明最重要的观看任务。<\/p>\n<h2 id=\"craft-04-camera-attention-section-3\">镜头与人物可以不同步<\/h2>\n<p>跟得太准像展示，略晚一点可能像发现；但“略晚”也可以掩掉关键动作。举例：<\/p>\n<blockquote>\n<p>她先起身离开画面，摄影机晚一点才转向门口。转过去时她已经停在门边，像还有一句话没说。<\/p>\n<\/blockquote>\n<p>这里延迟本身形成观看关系。若剧情要求看清她把钥匙藏入包里，就不能让摄影机晚到而错过。<\/p>\n<h2 id=\"craft-04-camera-attention-section-4\">现场感来自可解释的观看限制<\/h2>\n<p>轻微走路起伏、前景擦过、自动对焦调整可以提供拍摄状态；但干净稳定的画面也可以很真实。选择手机Vlog时，手臂距离和持机方式重要；选择产品静物时，稳定和反射控制可能更重要。<\/p>\n<p>镜头上水滴、强眩光和剧烈晃动都属于强烈表达，不是默认的真实感修复剂。别让它们遮掉脸、产品标签或情节。<\/p>\n<h2 id=\"craft-04-camera-attention-section-5\">让注意力得到接力<\/h2>\n<p>一个人说话，另一个人的手开始动，摄影机再发现道具，这可以形成自然的信息接力。观看研究与电影分析提供了相关观察，但不能保证所有观众逐点照看。[3] 实际验片可以请不了解提示词的人只说“你先看到了什么”。<\/p>\n<p>物理机位词不足时，补一张构图草图或预演，而不是堆更多“流畅电影感”。对应方法见<a href=\"#/workflows/06-previs\">预演与复杂控制<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a>\n[3] <a href=\"#/references/theory\">理论桥梁：已有知识支持什么、不支持什么<\/a><\/p>\n<\/details>","text":"# 15｜镜头：不是更会运动，而是更会选择\n\n> 摄影机可以靠近一个人，也可以拒绝靠近。后一种选择，有时比推到眼泪上更有力量。\n\n## 先说观众站在哪里\n\n眼平、贴地、俯瞰不直接等于自然、压迫或脆弱。它们先改变可见内容与空间关系，具体感受还取决于人物、光、距离、剪辑和声音。教程10提供的是一种有效方向，不是“平视必假”的规律。[1]\n\n**贴近桌面**可能让一只迟迟没有接过来的手变得重要；**隔着人群**可能让错过发生在视线里；**正面平视**可以让人像坐在角色对面，直接承受一句话。选机位时，先问这个位置让谁知道什么。\n\n## 六个要素，不要混叫“运镜”\n\n| 要素 | 人话问法 | 例子 |\n| --- | --- | --- |\n| 位置与高度 | 摄影机在哪里？ | 门内侧、桌沿高度 |\n| 朝向 | 看向哪里？ | 看向窗边的人，而非房间中心 |\n| 取景范围 | 让多少内容进入？ | 只见手、杯与对面空椅 |\n| 透视关系 | 近处与远处怎样相处？ | 近处栏杆占画面，人物在后方 |\n| 运动 | 摄影机本身怎么变？ | 向右平移，让门框退出前景 |\n| 焦点与成像 | 哪一层清楚，运动怎样留下痕迹？ | 焦点在握杯的手，不在窗外 |\n\n“推近”有时指摄影机前移，有时指变焦。需要视差和遮挡变化时，应写清前移或横移；单纯放大画面不能自动让你看见遮挡物后面。[2] 类似地，摇摄是改变观看方向，不是摄影机绕主体换位置。\n\n## 一条镜头，先选一件主要工作\n\n**跟随**：与人物保持一段距离，让变化在路途中出现。\n\n**揭示**：从局部到关系，例如门框后的人进入可见范围。\n\n**逼近**：减少退路或扩大一个反应的重要性。\n\n**撤离**：把人物留给环境，或显示事情比原先大。\n\n**等待**：不替观众挑反应，给事件自行发生的机会。\n\n这些可以组合，但不必在八秒内全做。把“推进、环绕、升高、拉焦、甩镜”串在一起，往往没有说明最重要的观看任务。\n\n## 镜头与人物可以不同步\n\n跟得太准像展示，略晚一点可能像发现；但“略晚”也可以掩掉关键动作。举例：\n\n> 她先起身离开画面，摄影机晚一点才转向门口。转过去时她已经停在门边，像还有一句话没说。\n\n这里延迟本身形成观看关系。若剧情要求看清她把钥匙藏入包里，就不能让摄影机晚到而错过。\n\n## 现场感来自可解释的观看限制\n\n轻微走路起伏、前景擦过、自动对焦调整可以提供拍摄状态；但干净稳定的画面也可以很真实。选择手机Vlog时，手臂距离和持机方式重要；选择产品静物时，稳定和反射控制可能更重要。\n\n镜头上水滴、强眩光和剧烈晃动都属于强烈表达，不是默认的真实感修复剂。别让它们遮掉脸、产品标签或情节。\n\n## 让注意力得到接力\n\n一个人说话，另一个人的手开始动，摄影机再发现道具，这可以形成自然的信息接力。观看研究与电影分析提供了相关观察，但不能保证所有观众逐点照看。[3] 实际验片可以请不了解提示词的人只说“你先看到了什么”。\n\n物理机位词不足时，补一张构图草图或预演，而不是堆更多“流畅电影感”。对应方法见[预演与复杂控制](/workflows/06-previs.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [视频工具：第一方依据与适用边界](/references/official-video.md)\n[3] [理论桥梁：已有知识支持什么、不支持什么](/references/theory.md)","toc":[{"id":"craft-04-camera-attention-section-0","title":"先说观众站在哪里"},{"id":"craft-04-camera-attention-section-1","title":"六个要素，不要混叫“运镜”"},{"id":"craft-04-camera-attention-section-2","title":"一条镜头，先选一件主要工作"},{"id":"craft-04-camera-attention-section-3","title":"镜头与人物可以不同步"},{"id":"craft-04-camera-attention-section-4","title":"现场感来自可解释的观看限制"},{"id":"craft-04-camera-attention-section-5","title":"让注意力得到接力"}]},{"id":"craft/05-light-material","path":"craft/05-light-material.md","title":"16｜光与材质：让空气、表面和重量互相解释","description":"分清方向、软硬、明暗、颜色与材质反应，把质感落到具体表面。","type":"Technique","group":"craft","tags":["光线","材质","产品","连续性"],"html":"<h1>16｜光与材质：让空气、表面和重量互相解释<\/h1>\n<h2 id=\"craft-05-light-material-section-0\">光不是画面亮度的总开关<\/h2>\n<p>同一个玻璃瓶可以被光照得像厚重的实体，也可以像空气里一道薄边。差别不只在亮不亮，而在光从哪里来、以什么大小进入、落在哪些表面，哪些部分没有被照到。<\/p>\n<p>可用的说明顺序是：<strong>来源 → 方向 → 软硬 → 影响区域 → 亮暗关系 → 色彩关系<\/strong>。选择当前任务有必要的项，不必每次全写。<\/p>\n<blockquote>\n<p>左后方的窗光在瓶肩留下窄亮边，正面标签由较柔的反射光照清。背景稍暗，但不是全黑。玻璃仍能看到厚度，不把瓶身透成空壳。<\/p>\n<\/blockquote>\n<h2 id=\"craft-05-light-material-section-1\">三组常被混淆的词<\/h2>\n<p><strong>方向与效果<\/strong>：侧逆光说的是来源方向；轮廓光说的是主体边缘被强调的效果。它们可以同时出现，不是互相排斥的两个“滤镜”。<\/p>\n<p><strong>亮度与软硬<\/strong>：亮度不决定阴影边缘软硬。光源相对于主体的表观大小是影响软硬的重要因素；Blender第一方手册也区分光强和光源尺寸的作用。[2] “大面积照亮”不一定意味着“大尺寸近距离发光面”，要避免含混。<\/p>\n<p><strong>光源颜色与物体颜色<\/strong>：蓝色瓶子不等于被蓝灯照亮；冷背景也不要求整张脸涂蓝。看物体朝向、受光面与环境反射是否相容。<\/p>\n<h2 id=\"craft-05-light-material-section-2\">硬光不需要百叶窗才能存在<\/h2>\n<p>百叶窗、树叶或格栅用于形成可辨认的光影图案。没有它们，硬光仍然可以在瓶子、手指和桌边投下清楚的影子。反过来，图案边缘是否清楚还受光源和遮挡物的相对关系影响。<\/p>\n<p>产品广告里可写：<\/p>\n<blockquote>\n<p>光从画面左上方斜射，瓶子在桌面投下一道边缘清楚的影子。影子不经过标签，正面文字保持可读。<\/p>\n<\/blockquote>\n<p>不用写“极致硬光、强光、爆亮”来代替具体结果。<\/p>\n<h2 id=\"craft-05-light-material-section-3\">材质要有四种线索<\/h2>\n<p><strong>表面<\/strong>：哑光、细纹、颗粒、抛光；<strong>透光与反射<\/strong>：透、半透、镜面或散开；<strong>变形<\/strong>：硬挺、柔韧、可压缩；<strong>接触后果<\/strong>：水迹、指痕、压痕、滑动阻力。<\/p>\n<p>“高级丝绸”可以转成：<\/p>\n<blockquote>\n<p>布料很薄，却不是没有重量。折面上的亮光沿着褶皱移动，落到肩上时先滑过一点，再停住。<\/p>\n<\/blockquote>\n<p>“真实泡沫”不只是一堆白球：<\/p>\n<blockquote>\n<p>大小不一的薄泡聚在手掌边缘，抹开后中间变薄，边缘留下少量细泡。<\/p>\n<\/blockquote>\n<p>这些是创作设计的可观察条件，不保证生成器执行物理模拟。<\/p>\n<h2 id=\"craft-05-light-material-section-4\">别让好光破坏接续<\/h2>\n<p>镜头换到人物另一侧，窗子在世界里的位置没有变。屏幕上的亮暗关系可以改变，不能为了每个镜头都“左边漂亮”把同一扇窗搬来搬去。<\/p>\n<p>材质状态也要延续：袖口刚被水打湿，下一镜不能无故恢复干燥；瓶盖开了，反射与瓶口形状需要相符。这些问题不是统一套一个色调能修好。<\/p>\n<h2 id=\"craft-05-light-material-section-5\">什么时候让后期接手<\/h2>\n<p>品牌色、字标、精确局部亮度、统一颗粒与锐度，通常需要在可控流程里核对。生成阶段先得到结构与光照相容的素材；别指望加颗粒掩盖错误阴影，也别要求文字色值在复杂透光材质上逐像素恒定。<\/p>\n<p>纯风格化作品可以故意让影子不服从光源，但须明确这是世界规则。艺术偏离不是技术失败，二者要在<a href=\"#/practice/03-review-rubric\">评价标准<\/a>中区分。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-voice-light\">声音与光线：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 16｜光与材质：让空气、表面和重量互相解释\n\n## 光不是画面亮度的总开关\n\n同一个玻璃瓶可以被光照得像厚重的实体，也可以像空气里一道薄边。差别不只在亮不亮，而在光从哪里来、以什么大小进入、落在哪些表面，哪些部分没有被照到。\n\n可用的说明顺序是：**来源 → 方向 → 软硬 → 影响区域 → 亮暗关系 → 色彩关系**。选择当前任务有必要的项，不必每次全写。\n\n> 左后方的窗光在瓶肩留下窄亮边，正面标签由较柔的反射光照清。背景稍暗，但不是全黑。玻璃仍能看到厚度，不把瓶身透成空壳。\n\n## 三组常被混淆的词\n\n**方向与效果**：侧逆光说的是来源方向；轮廓光说的是主体边缘被强调的效果。它们可以同时出现，不是互相排斥的两个“滤镜”。\n\n**亮度与软硬**：亮度不决定阴影边缘软硬。光源相对于主体的表观大小是影响软硬的重要因素；Blender第一方手册也区分光强和光源尺寸的作用。[2] “大面积照亮”不一定意味着“大尺寸近距离发光面”，要避免含混。\n\n**光源颜色与物体颜色**：蓝色瓶子不等于被蓝灯照亮；冷背景也不要求整张脸涂蓝。看物体朝向、受光面与环境反射是否相容。\n\n## 硬光不需要百叶窗才能存在\n\n百叶窗、树叶或格栅用于形成可辨认的光影图案。没有它们，硬光仍然可以在瓶子、手指和桌边投下清楚的影子。反过来，图案边缘是否清楚还受光源和遮挡物的相对关系影响。\n\n产品广告里可写：\n> 光从画面左上方斜射，瓶子在桌面投下一道边缘清楚的影子。影子不经过标签，正面文字保持可读。\n\n不用写“极致硬光、强光、爆亮”来代替具体结果。\n\n## 材质要有四种线索\n\n**表面**：哑光、细纹、颗粒、抛光；**透光与反射**：透、半透、镜面或散开；**变形**：硬挺、柔韧、可压缩；**接触后果**：水迹、指痕、压痕、滑动阻力。\n\n“高级丝绸”可以转成：\n> 布料很薄，却不是没有重量。折面上的亮光沿着褶皱移动，落到肩上时先滑过一点，再停住。\n\n“真实泡沫”不只是一堆白球：\n> 大小不一的薄泡聚在手掌边缘，抹开后中间变薄，边缘留下少量细泡。\n\n这些是创作设计的可观察条件，不保证生成器执行物理模拟。\n\n## 别让好光破坏接续\n\n镜头换到人物另一侧，窗子在世界里的位置没有变。屏幕上的亮暗关系可以改变，不能为了每个镜头都“左边漂亮”把同一扇窗搬来搬去。\n\n材质状态也要延续：袖口刚被水打湿，下一镜不能无故恢复干燥；瓶盖开了，反射与瓶口形状需要相符。这些问题不是统一套一个色调能修好。\n\n## 什么时候让后期接手\n\n品牌色、字标、精确局部亮度、统一颗粒与锐度，通常需要在可控流程里核对。生成阶段先得到结构与光照相容的素材；别指望加颗粒掩盖错误阴影，也别要求文字色值在复杂透光材质上逐像素恒定。\n\n纯风格化作品可以故意让影子不服从光源，但须明确这是世界规则。艺术偏离不是技术失败，二者要在[评价标准](/practice/03-review-rubric.md)中区分。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [声音与光线：第一方依据与适用边界](/references/official-voice-light.md)","toc":[{"id":"craft-05-light-material-section-0","title":"光不是画面亮度的总开关"},{"id":"craft-05-light-material-section-1","title":"三组常被混淆的词"},{"id":"craft-05-light-material-section-2","title":"硬光不需要百叶窗才能存在"},{"id":"craft-05-light-material-section-3","title":"材质要有四种线索"},{"id":"craft-05-light-material-section-4","title":"别让好光破坏接续"},{"id":"craft-05-light-material-section-5","title":"什么时候让后期接手"}]},{"id":"craft/06-world-art-costume","path":"craft/06-world-art-costume.md","title":"17｜美术与妆造：世界不是背景，身份不只是一张脸","description":"用空间、使用方式和状态痕迹设计人物与世界，避免性别和风格模板。","type":"Technique","group":"craft","tags":["美术","妆造","世界观","资产"],"html":"<h1>17｜美术与妆造：世界不是背景，身份不只是一张脸<\/h1>\n<h2 id=\"craft-06-world-art-costume-section-0\">从“什么风格”走向“什么生活方式”<\/h2>\n<p>“复古公寓”可能是被精心修复的公寓，也可能是仍在使用的旧住宅。前者的物件彼此配套，后者也许有一张新椅子和一台旧风扇共存。风格不是年代标签的集合，而是选择、使用和维护留下的关系。<\/p>\n<blockquote>\n<p>房间不脏，桌面却有长期工作留下的磨亮边。两把椅子不成套，常坐的那把靠近窗，另一把偶尔才被拉出来。<\/p>\n<\/blockquote>\n<p>这段不必导向一段复杂身世。它先让空间像有人用过。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-1\">角色分成三件事<\/h2>\n<p><strong>是谁<\/strong>：面部身份、身体比例、辨识特点。<\/p>\n<p><strong>现在以什么造型出现<\/strong>：发型、服装、妆容、配饰，是可变化但需批准的方案。<\/p>\n<p><strong>这一刻处于什么状态<\/strong>：衣物干湿、完整或受损、妆面刚完成还是经历了一段时间、道具如何携带。<\/p>\n<p>“同一张脸”不等于永远同一造型；“刚受打击”也不等于衣服立即变暗、发饰自动消失。状态变化必须有时间和行为上的来由。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-2\">不把性别当作妆造的硬规则<\/h2>\n<p>教程11用将军、公子、贵妃与落魄千金举例，适合说明身份与状态改变造型，但不宜推广为“男性只写服装，女性只写妆面”。[1] 舞台男性角色可以有浓妆，女性武者可以靠轮廓、材质和装备表达身份。<\/p>\n<p>更可靠的问题是：<strong>这个世界如何表达阶层、工作、仪式、偏好与当下处境？<\/strong> 再选择发、妆、衣、饰各承担多少信息。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-3\">用材质与维护状态，不只用身份名<\/h2>\n<p>“年轻将军”太宽。可以选择：衣肩轮廓挺直，绑带收束明确，金属不是满屏发光，而有维护过的表面；活动处允许自然折痕。是否有战损要看他刚经历什么。<\/p>\n<p>“失意贵族”也不必一身破衣：衣服依然昂贵，但领口不再像从前那样整理妥当。故事感可以来自维护习惯的改变，而非叠加伤口和灰尘。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-4\">场景有拓扑，氛围有版本<\/h2>\n<p>同一个房间，门、窗、桌和通路构成稳定布局；清晨与深夜是光线版本；宴会与清场是陈设状态。九宫格图只有彼此是同一空间时才有帮助，不要把九张漂亮房间拼成“场景资产”。<\/p>\n<p>简单项目只需一张主视图与必要反打；复杂调度再补布局或粗模。资产应覆盖实际会用到的角度，不追求无穷视图。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-5\">道具不必都重要，但重要道具必须可用<\/h2>\n<p>承载剧情、被反复拿取、带品牌信息的物件应有稳定参考。只在远处出现一次的无关小物，不必单独建档。需要开盖的瓶子，要知道盖与瓶怎样分开；需要翻页的书，要知道打开后的结构；不是只有正面美图。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-6\">固有美术与拍摄氛围分开<\/h2>\n<p>干净中性的资产板方便看清身份和结构，最终画面可以浓烈、戏剧化、风格化。不是“资产不能美”，而是资产不应把所有下游场景锁进唯一的灯光、构图或表情。<\/p>\n<p>工作流程见<a href=\"#/workflows/05-assets-multishot\">资产与多镜头<\/a>；材质句的表达见<a href=\"#/craft/05-light-material\">光与材质<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 17｜美术与妆造：世界不是背景，身份不只是一张脸\n\n## 从“什么风格”走向“什么生活方式”\n\n“复古公寓”可能是被精心修复的公寓，也可能是仍在使用的旧住宅。前者的物件彼此配套，后者也许有一张新椅子和一台旧风扇共存。风格不是年代标签的集合，而是选择、使用和维护留下的关系。\n\n> 房间不脏，桌面却有长期工作留下的磨亮边。两把椅子不成套，常坐的那把靠近窗，另一把偶尔才被拉出来。\n\n这段不必导向一段复杂身世。它先让空间像有人用过。\n\n## 角色分成三件事\n\n**是谁**：面部身份、身体比例、辨识特点。\n\n**现在以什么造型出现**：发型、服装、妆容、配饰，是可变化但需批准的方案。\n\n**这一刻处于什么状态**：衣物干湿、完整或受损、妆面刚完成还是经历了一段时间、道具如何携带。\n\n“同一张脸”不等于永远同一造型；“刚受打击”也不等于衣服立即变暗、发饰自动消失。状态变化必须有时间和行为上的来由。\n\n## 不把性别当作妆造的硬规则\n\n教程11用将军、公子、贵妃与落魄千金举例，适合说明身份与状态改变造型，但不宜推广为“男性只写服装，女性只写妆面”。[1] 舞台男性角色可以有浓妆，女性武者可以靠轮廓、材质和装备表达身份。\n\n更可靠的问题是：**这个世界如何表达阶层、工作、仪式、偏好与当下处境？** 再选择发、妆、衣、饰各承担多少信息。\n\n## 用材质与维护状态，不只用身份名\n\n“年轻将军”太宽。可以选择：衣肩轮廓挺直，绑带收束明确，金属不是满屏发光，而有维护过的表面；活动处允许自然折痕。是否有战损要看他刚经历什么。\n\n“失意贵族”也不必一身破衣：衣服依然昂贵，但领口不再像从前那样整理妥当。故事感可以来自维护习惯的改变，而非叠加伤口和灰尘。\n\n## 场景有拓扑，氛围有版本\n\n同一个房间，门、窗、桌和通路构成稳定布局；清晨与深夜是光线版本；宴会与清场是陈设状态。九宫格图只有彼此是同一空间时才有帮助，不要把九张漂亮房间拼成“场景资产”。\n\n简单项目只需一张主视图与必要反打；复杂调度再补布局或粗模。资产应覆盖实际会用到的角度，不追求无穷视图。\n\n## 道具不必都重要，但重要道具必须可用\n\n承载剧情、被反复拿取、带品牌信息的物件应有稳定参考。只在远处出现一次的无关小物，不必单独建档。需要开盖的瓶子，要知道盖与瓶怎样分开；需要翻页的书，要知道打开后的结构；不是只有正面美图。\n\n## 固有美术与拍摄氛围分开\n\n干净中性的资产板方便看清身份和结构，最终画面可以浓烈、戏剧化、风格化。不是“资产不能美”，而是资产不应把所有下游场景锁进唯一的灯光、构图或表情。\n\n工作流程见[资产与多镜头](/workflows/05-assets-multishot.md)；材质句的表达见[光与材质](/craft/05-light-material.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"craft-06-world-art-costume-section-0","title":"从“什么风格”走向“什么生活方式”"},{"id":"craft-06-world-art-costume-section-1","title":"角色分成三件事"},{"id":"craft-06-world-art-costume-section-2","title":"不把性别当作妆造的硬规则"},{"id":"craft-06-world-art-costume-section-3","title":"用材质与维护状态，不只用身份名"},{"id":"craft-06-world-art-costume-section-4","title":"场景有拓扑，氛围有版本"},{"id":"craft-06-world-art-costume-section-5","title":"道具不必都重要，但重要道具必须可用"},{"id":"craft-06-world-art-costume-section-6","title":"固有美术与拍摄氛围分开"}]},{"id":"craft/07-sound-music","path":"craft/07-sound-music.md","title":"18｜音乐与声音：让看不见的东西改变画面","description":"从听觉视点、叙事功能和时间变化设计声音，而不是只填流派与情绪。","type":"Technique","group":"craft","tags":["音乐","音效","声音","通感"],"html":"<h1>18｜音乐与声音：让看不见的东西改变画面<\/h1>\n<blockquote>\n<p>同一扇缓缓关闭的门，配温柔音乐，像告别；留下锁舌落下的一声，可能像决定；门外仍有笑声，门内突然安静，又可能像被隔在外面。<\/p>\n<\/blockquote>\n<h2 id=\"craft-07-sound-music-section-0\">先决定声音在做哪件事<\/h2>\n<p>本书建议把声音的工作分成几种可选择的关系：让空间成立、让动作有重量、引导注意、改变观众对人物的理解、组织段落，或提供不必解释的感官愉悦。不是所有声音都必须承担剧情。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>工作<\/th>\n<th>可以怎样做<\/th>\n<th>不必怎样做<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>空间<\/td>\n<td>远处持续交通声，近处瓷杯轻响<\/td>\n<td>把所有声源混到相同距离<\/td>\n<\/tr>\n<tr>\n<td>动作<\/td>\n<td>关门前摩擦、接触一声、之后余振<\/td>\n<td>每个小动作都放大成重击<\/td>\n<\/tr>\n<tr>\n<td>注意<\/td>\n<td>先听见钥匙，再看到门口的人<\/td>\n<td>永远靠镜头推近提示重点<\/td>\n<\/tr>\n<tr>\n<td>情绪<\/td>\n<td>音乐继续温和，人物却越来越不安<\/td>\n<td>画面悲伤就立刻悲伤弦乐<\/td>\n<\/tr>\n<tr>\n<td>结构<\/td>\n<td>一个声音跨过剪辑，让两个场景相连<\/td>\n<td>每次切镜都重开音乐<\/td>\n<\/tr>\n<tr>\n<td>质感<\/td>\n<td>少量细碎、高低疏密形成触觉联想<\/td>\n<td>靠音量大制造“电影级”<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>以上是创作框架，不是已验证的情绪计算模型。<\/p>\n<h2 id=\"craft-07-sound-music-section-1\">三层声音，不要抢同一件事<\/h2>\n<p><strong>环境底<\/strong>让空间持续存在：风、水、室内电器、街道。<strong>动作声与点声<\/strong>让某个时刻具体：布料、脚步、杯子、门。<strong>音乐或声音设计<\/strong>让时间有方向：持续、脉冲、上升、悬住或松开。<\/p>\n<p>安静不等于所有轨道归零。可以留下很小的室内声，拿掉原先占据注意的声音；观众因对比而感到静。完全无声也是一种选择，但应是有意识的选择。<\/p>\n<h2 id=\"craft-07-sound-music-section-2\">音乐提示不只写“梦幻、118BPM、轻快”<\/h2>\n<p>可以再写五件事：<strong>开头怎样进入、声音的材料、节奏如何呼吸、段落哪里变化、结尾怎样留余味<\/strong>。<\/p>\n<p>原创示例：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">为一支30秒的轻盈品牌短片设计无歌词配乐。整体轻快、清透，带一点像清晨空气刚被打开的愉悦，不做宏大的胜利感。以柔和的拨弦短音和少量清亮的键盘音色为主，低音轻而有弹性，打击乐稀疏，留出水声与近处动作声的位置。\n开头先给两三个彼此有间隔的音，之后才形成稳定律动；中段让旋律向上展开一点，不加厚成满铺弦乐；结尾逐渐减少声部，留下一个清楚但不过分煽情的落点和短尾音。\n目标律动约118BPM。时长与剪辑点由后期按实际生成音频确认。\n<\/code><\/pre>\n<p>“像清晨空气刚被打开”给感受；拨弦、稀疏、先后和收尾给方向。精确BPM、乐段秒数、分轨与结尾可控性取决于实际工具，不要把目标值当已执行事实。<\/p>\n<h2 id=\"craft-07-sound-music-section-3\">当音乐不跟着表情走<\/h2>\n<p>画面上人物大笑，音乐却保持平静，可能让快乐显得短暂，也可能让它显得被温柔接住。两种读法都可能成立，取决于前后文。<\/p>\n<p>因此，采用反差时要先说清楚想产生什么：是甜蜜里藏不安，还是以安静承托强烈喜悦。不要仅写“反差配乐”，更不要把反差本身当高级。<\/p>\n<h2 id=\"craft-07-sound-music-section-4\">声音的通感可以具体到起落<\/h2>\n<p>“锋利”可以意味着起音快、尾音短，也可以是高频刺痛；“温润”可以意味着圆一些的起音、持续平滑、不过分靠前；“有颗粒”可以是离散的短音，而不是全轨加噪声。<\/p>\n<p>这些词先作为设计比喻使用，再由试听决定。如果要“像远处玻璃反光”，可以减少音符数量、拉开间隔、让少数清亮音色在远处出现，而不是必须录玻璃。<\/p>\n<h2 id=\"craft-07-sound-music-section-5\">先声后画、声画不同源与主观听觉<\/h2>\n<p>门后的脚步先到，画面还留在人物手上，听觉成为事件入口。画面切到空房间，上一句对白的尾音仍在，声音成为记忆或连接。人物听到坏消息后，环境声暂时被削弱，可以是一种主观处理，不是现场真的失声。<\/p>\n<p>写清哪些声是场内真实来源，哪些是配乐或主观声音；否则模型可能把本来只给观众听的男声，变成画面里新增一个讲话的人。<\/p>\n<h2 id=\"craft-07-sound-music-section-6\">什么时候留白<\/h2>\n<p>当一句话已经足够强，音乐可以暂退；当产品触感是重点，近处细声可以取代情绪铺陈；当观众需要自己判断表情，不要用每个转折都升调的音乐抢答。<\/p>\n<p>最后验三遍：只听音频是否有结构；静音看画面是否能读懂必须的信息；合起来是否互相支持而非重复喊话。具体练习见<a href=\"#/practice/02-exercises\">练习册<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 18｜音乐与声音：让看不见的东西改变画面\n\n> 同一扇缓缓关闭的门，配温柔音乐，像告别；留下锁舌落下的一声，可能像决定；门外仍有笑声，门内突然安静，又可能像被隔在外面。\n\n## 先决定声音在做哪件事\n\n本书建议把声音的工作分成几种可选择的关系：让空间成立、让动作有重量、引导注意、改变观众对人物的理解、组织段落，或提供不必解释的感官愉悦。不是所有声音都必须承担剧情。\n\n| 工作 | 可以怎样做 | 不必怎样做 |\n| --- | --- | --- |\n| 空间 | 远处持续交通声，近处瓷杯轻响 | 把所有声源混到相同距离 |\n| 动作 | 关门前摩擦、接触一声、之后余振 | 每个小动作都放大成重击 |\n| 注意 | 先听见钥匙，再看到门口的人 | 永远靠镜头推近提示重点 |\n| 情绪 | 音乐继续温和，人物却越来越不安 | 画面悲伤就立刻悲伤弦乐 |\n| 结构 | 一个声音跨过剪辑，让两个场景相连 | 每次切镜都重开音乐 |\n| 质感 | 少量细碎、高低疏密形成触觉联想 | 靠音量大制造“电影级” |\n\n以上是创作框架，不是已验证的情绪计算模型。\n\n## 三层声音，不要抢同一件事\n\n**环境底**让空间持续存在：风、水、室内电器、街道。**动作声与点声**让某个时刻具体：布料、脚步、杯子、门。**音乐或声音设计**让时间有方向：持续、脉冲、上升、悬住或松开。\n\n安静不等于所有轨道归零。可以留下很小的室内声，拿掉原先占据注意的声音；观众因对比而感到静。完全无声也是一种选择，但应是有意识的选择。\n\n## 音乐提示不只写“梦幻、118BPM、轻快”\n\n可以再写五件事：**开头怎样进入、声音的材料、节奏如何呼吸、段落哪里变化、结尾怎样留余味**。\n\n原创示例：\n\n```text\n为一支30秒的轻盈品牌短片设计无歌词配乐。整体轻快、清透，带一点像清晨空气刚被打开的愉悦，不做宏大的胜利感。以柔和的拨弦短音和少量清亮的键盘音色为主，低音轻而有弹性，打击乐稀疏，留出水声与近处动作声的位置。\n开头先给两三个彼此有间隔的音，之后才形成稳定律动；中段让旋律向上展开一点，不加厚成满铺弦乐；结尾逐渐减少声部，留下一个清楚但不过分煽情的落点和短尾音。\n目标律动约118BPM。时长与剪辑点由后期按实际生成音频确认。\n```\n\n“像清晨空气刚被打开”给感受；拨弦、稀疏、先后和收尾给方向。精确BPM、乐段秒数、分轨与结尾可控性取决于实际工具，不要把目标值当已执行事实。\n\n## 当音乐不跟着表情走\n\n画面上人物大笑，音乐却保持平静，可能让快乐显得短暂，也可能让它显得被温柔接住。两种读法都可能成立，取决于前后文。\n\n因此，采用反差时要先说清楚想产生什么：是甜蜜里藏不安，还是以安静承托强烈喜悦。不要仅写“反差配乐”，更不要把反差本身当高级。\n\n## 声音的通感可以具体到起落\n\n“锋利”可以意味着起音快、尾音短，也可以是高频刺痛；“温润”可以意味着圆一些的起音、持续平滑、不过分靠前；“有颗粒”可以是离散的短音，而不是全轨加噪声。\n\n这些词先作为设计比喻使用，再由试听决定。如果要“像远处玻璃反光”，可以减少音符数量、拉开间隔、让少数清亮音色在远处出现，而不是必须录玻璃。\n\n## 先声后画、声画不同源与主观听觉\n\n门后的脚步先到，画面还留在人物手上，听觉成为事件入口。画面切到空房间，上一句对白的尾音仍在，声音成为记忆或连接。人物听到坏消息后，环境声暂时被削弱，可以是一种主观处理，不是现场真的失声。\n\n写清哪些声是场内真实来源，哪些是配乐或主观声音；否则模型可能把本来只给观众听的男声，变成画面里新增一个讲话的人。\n\n## 什么时候留白\n\n当一句话已经足够强，音乐可以暂退；当产品触感是重点，近处细声可以取代情绪铺陈；当观众需要自己判断表情，不要用每个转折都升调的音乐抢答。\n\n最后验三遍：只听音频是否有结构；静音看画面是否能读懂必须的信息；合起来是否互相支持而非重复喊话。具体练习见[练习册](/practice/02-exercises.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"craft-07-sound-music-section-0","title":"先决定声音在做哪件事"},{"id":"craft-07-sound-music-section-1","title":"三层声音，不要抢同一件事"},{"id":"craft-07-sound-music-section-2","title":"音乐提示不只写“梦幻、118BPM、轻快”"},{"id":"craft-07-sound-music-section-3","title":"当音乐不跟着表情走"},{"id":"craft-07-sound-music-section-4","title":"声音的通感可以具体到起落"},{"id":"craft-07-sound-music-section-5","title":"先声后画、声画不同源与主观听觉"},{"id":"craft-07-sound-music-section-6","title":"什么时候留白"}]},{"id":"craft/08-still-graphic-style","path":"craft/08-still-graphic-style.md","title":"19｜静态图像、平面与风格化：不必把一张图写成电影","description":"在没有时间轴时组织主次、关系、材料与阅读顺序，允许非叙事图像成立。","type":"Technique","group":"craft","tags":["平面","生图","插画","风格"],"html":"<h1>19｜静态图像、平面与风格化：不必把一张图写成电影<\/h1>\n<h2 id=\"craft-08-still-graphic-style-section-0\">一张图可以没有故事，但不能没有选择<\/h2>\n<p>产品海报可能只需要让材料显得清透、产品容易识别、版面有呼吸。插画可能只想组织一种荒诞关系。别为了套表演方法，给每只瓶子和每块色面都安排动机。<\/p>\n<p>静态图像可从四件事入手：<strong>视觉中心、空间关系、材料语言、阅读路径<\/strong>。故事只是其中一种组织方式。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-1\">同一主题，三种视觉语言<\/h2>\n<p>任务：表现“薄而有保护感”。<\/p>\n<p>写实静物：产品旁一层很薄的半透明材质包住圆润物体，接触处有轻微形变，边缘清晰，背景简洁。<\/p>\n<p>平面设计：一条细线绕过主标题，靠近文字时留下均匀间距，以版式关系表达保护，不画真实薄膜。<\/p>\n<p>插画：一张几乎透明的纸伞罩住很小的雨云，纸边有轻微手绘抖动；违反现实尺度，但画内规则明确。<\/p>\n<p>三者不需要共同追求摄影级皮肤或镜头眩光。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-2\">风格拆成可选择的构成<\/h2>\n<p>“东方美学、复古、高级”太宽。可以分别说明线条是工整还是松动，色块是平涂还是渗染，形体是准确还是夸张，空间是平面叠置还是透视深入，表面保留哪种手工痕迹。<\/p>\n<blockquote>\n<p>两色丝网印刷感，色面平整，人物轮廓略作夸张。边缘允许轻微套印错位，但眼睛和标题仍清楚。不要为了印刷感把画面做成满地污渍。<\/p>\n<\/blockquote>\n<p>这是媒介效果方向，不是在保证真实印刷工艺已被复现。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-3\">风格融合，要决定谁提供骨架<\/h2>\n<p>“水墨 + 科技 + 包豪斯 + 巴洛克”不必禁止，但应分工。例如让几何版式提供秩序，让水墨边缘提供材质，让局部金属反射提供产品属性。不要四种风格同时改造每一处。<\/p>\n<p>用一句话检查主从：<strong>这张图第一眼属于什么，第二眼发现什么不同？<\/strong> 若答不出来，可能只是元素拼盘。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-4\">版式与字标有硬任务<\/h2>\n<p>确定画幅与最终发布尺寸，再决定主体占比、标题区、辅助信息区和安全边界。长文案、小字、多语言字标、精确商标与包装，宜保留可编辑的排版或合成步骤，不靠一次生成后盲目放大交付。<\/p>\n<p>提示词可以说：<\/p>\n<blockquote>\n<p>主体位于右下，左上留出连续、低细节的浅色区域，供后期放置标题。这里不生成任何临时占位文字。<\/p>\n<\/blockquote>\n<p>若工具支持可靠的文字生成，可以用于探索；最终仍逐字核对，不把看起来像字的形状当正确文字。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-5\">静态图的“动作感”是一个状态，不是多个时刻<\/h2>\n<p>“正在转身的一瞬”可以通过衣摆和身体朝向表现；“先转身然后走出房间”放进单张图，可能变成拼贴或重复人物。需要连续动作就用分镜或视频，不要求一张图同时容纳互斥状态。<\/p>\n<p>非叙事构图也可以借用节奏：重复形体的间距、色块大小变化、边缘密度，都是观看的时间。别机械给静态设计加秒数。<\/p>\n<p>更多完整生成步骤见<a href=\"#/workflows/02-text-to-image\">文字生图<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-image\">图像工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 19｜静态图像、平面与风格化：不必把一张图写成电影\n\n## 一张图可以没有故事，但不能没有选择\n\n产品海报可能只需要让材料显得清透、产品容易识别、版面有呼吸。插画可能只想组织一种荒诞关系。别为了套表演方法，给每只瓶子和每块色面都安排动机。\n\n静态图像可从四件事入手：**视觉中心、空间关系、材料语言、阅读路径**。故事只是其中一种组织方式。\n\n## 同一主题，三种视觉语言\n\n任务：表现“薄而有保护感”。\n\n写实静物：产品旁一层很薄的半透明材质包住圆润物体，接触处有轻微形变，边缘清晰，背景简洁。\n\n平面设计：一条细线绕过主标题，靠近文字时留下均匀间距，以版式关系表达保护，不画真实薄膜。\n\n插画：一张几乎透明的纸伞罩住很小的雨云，纸边有轻微手绘抖动；违反现实尺度，但画内规则明确。\n\n三者不需要共同追求摄影级皮肤或镜头眩光。\n\n## 风格拆成可选择的构成\n\n“东方美学、复古、高级”太宽。可以分别说明线条是工整还是松动，色块是平涂还是渗染，形体是准确还是夸张，空间是平面叠置还是透视深入，表面保留哪种手工痕迹。\n\n> 两色丝网印刷感，色面平整，人物轮廓略作夸张。边缘允许轻微套印错位，但眼睛和标题仍清楚。不要为了印刷感把画面做成满地污渍。\n\n这是媒介效果方向，不是在保证真实印刷工艺已被复现。\n\n## 风格融合，要决定谁提供骨架\n\n“水墨 + 科技 + 包豪斯 + 巴洛克”不必禁止，但应分工。例如让几何版式提供秩序，让水墨边缘提供材质，让局部金属反射提供产品属性。不要四种风格同时改造每一处。\n\n用一句话检查主从：**这张图第一眼属于什么，第二眼发现什么不同？** 若答不出来，可能只是元素拼盘。\n\n## 版式与字标有硬任务\n\n确定画幅与最终发布尺寸，再决定主体占比、标题区、辅助信息区和安全边界。长文案、小字、多语言字标、精确商标与包装，宜保留可编辑的排版或合成步骤，不靠一次生成后盲目放大交付。\n\n提示词可以说：\n> 主体位于右下，左上留出连续、低细节的浅色区域，供后期放置标题。这里不生成任何临时占位文字。\n\n若工具支持可靠的文字生成，可以用于探索；最终仍逐字核对，不把看起来像字的形状当正确文字。\n\n## 静态图的“动作感”是一个状态，不是多个时刻\n\n“正在转身的一瞬”可以通过衣摆和身体朝向表现；“先转身然后走出房间”放进单张图，可能变成拼贴或重复人物。需要连续动作就用分镜或视频，不要求一张图同时容纳互斥状态。\n\n非叙事构图也可以借用节奏：重复形体的间距、色块大小变化、边缘密度，都是观看的时间。别机械给静态设计加秒数。\n\n更多完整生成步骤见[文字生图](/workflows/02-text-to-image.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [图像工具：第一方依据与适用边界](/references/official-image.md)","toc":[{"id":"craft-08-still-graphic-style-section-0","title":"一张图可以没有故事，但不能没有选择"},{"id":"craft-08-still-graphic-style-section-1","title":"同一主题，三种视觉语言"},{"id":"craft-08-still-graphic-style-section-2","title":"风格拆成可选择的构成"},{"id":"craft-08-still-graphic-style-section-3","title":"风格融合，要决定谁提供骨架"},{"id":"craft-08-still-graphic-style-section-4","title":"版式与字标有硬任务"},{"id":"craft-08-still-graphic-style-section-5","title":"静态图的“动作感”是一个状态，不是多个时刻"}]},{"id":"craft/09-time-montage","path":"craft/09-time-montage.md","title":"20｜时间与剪辑：提示词里发生了，不代表观众来得及读","description":"把动作时长、信息读取、反应和转场放进同一个观看节奏。","type":"Technique","group":"craft","tags":["剪辑","时间","叙事","节奏"],"html":"<h1>20｜时间与剪辑：提示词里发生了，不代表观众来得及读<\/h1>\n<h2 id=\"craft-09-time-montage-section-0\">有三种时间要一起算<\/h2>\n<p><strong>事情做完的时间<\/strong>：走到门边、拿起物件、说完一句话。<\/p>\n<p><strong>观众识别的时间<\/strong>：看清是谁、认出关键道具、读完重要文字。<\/p>\n<p><strong>感受形成的时间<\/strong>：让一次反应被接住，让一处安静真的留住。<\/p>\n<p>它们有时重叠，有时不能。手部调包能在很短时间完成，不代表观众分得清真假；一句台词读得快，也不代表情绪来得及转折。没有普遍适用的“每个动作固定两秒”。<\/p>\n<h2 id=\"craft-09-time-montage-section-1\">先给段落功能，再给秒数<\/h2>\n<p>一条30秒品牌片可有“进入、触感、展开、留味”四段，而非强行安排危机与反转。关系戏可有“试探、接住、错过、停留”；喜剧可有“建立预期、重复、偏差、反应”。这些都是可选组织方式，不是新三幕模板。<\/p>\n<p>拍摄或生成前，写下每段结束时观众应多获得什么。没有新增信息或感受的段落，可以因节奏或审美保留，但要知道自己为什么愿意花这个时间。<\/p>\n<h2 id=\"craft-09-time-montage-section-2\">一镜到底与蒙太奇解决不同问题<\/h2>\n<p>一镜到底强调空间和过程连续，适合让观众跟随一件事；多镜头允许压缩时间、改变视点、比较材料、制造跳跃。两者没有天然高低。<\/p>\n<p>困难动作不必全靠连续长镜头完成；反过来，安静对话也不需要每句话一个切镜。选形式时先看表达任务与制作代价。<\/p>\n<h2 id=\"craft-09-time-montage-section-3\">切镜理由不只有动作完成<\/h2>\n<p>可以在看见关键物之前切，让声音把人带过去；可以在一个动作尚未结束时切到反应；可以保留动作完成之后的余量，让空白成为内容。<\/p>\n<blockquote>\n<p>杯子已经被拿走，摄影机还留在那圈水迹上。下一镜不解释这圈水，而让一个更开阔的空间接住它。<\/p>\n<\/blockquote>\n<p>这是可选的感官连接，不要求观众把水迹解码成具体象征。<\/p>\n<h2 id=\"craft-09-time-montage-section-4\">声音可以比画面更连续<\/h2>\n<p>音乐的一个长音跨过两个镜头，环境声在切换前先进入，人物的最后半句话留在对方反应上，都能组织时间。不要让每个AI生成片段都带着自己的音乐开头与结尾，拼接时互相打架。<\/p>\n<p>重要声音宜单独规划，具体方法见<a href=\"#/craft/07-sound-music\">声音与音乐<\/a>。<\/p>\n<h2 id=\"craft-09-time-montage-section-5\">交接点，比漂亮中段更容易出问题<\/h2>\n<p>上一镜人物右手拿杯，下一镜突然左手；上一镜在门外，下一镜已经坐下却没有时间跳跃线索；同一场景光源反向；镜头结尾意外变成慢动作。这些都需要在剪辑里判断是否影响理解，不是看到任何差异就返工。<\/p>\n<p>记录每条候选片段的可用区间、起终状态和主要缺陷即可。不要把“生成成功”直接写成“成片通过”。<\/p>\n<h2 id=\"craft-09-time-montage-section-6\">留剪辑余量，但不把空白当统一规定<\/h2>\n<p>重要动作前后留一点可选择的空间有助于剪辑；准确余量取决于节奏与工具时长。需要静止产品收尾，就让末尾真的稳定，不要在最后一帧还在运镜。需要突然中断，就不应强行加平缓收尾。<\/p>\n<p>时间约束冲突时，减少必须发生的事件、改变剪辑形式或重新分配时长，通常比要求模型“更自然地完成全部动作”更清楚。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 20｜时间与剪辑：提示词里发生了，不代表观众来得及读\n\n## 有三种时间要一起算\n\n**事情做完的时间**：走到门边、拿起物件、说完一句话。\n\n**观众识别的时间**：看清是谁、认出关键道具、读完重要文字。\n\n**感受形成的时间**：让一次反应被接住，让一处安静真的留住。\n\n它们有时重叠，有时不能。手部调包能在很短时间完成，不代表观众分得清真假；一句台词读得快，也不代表情绪来得及转折。没有普遍适用的“每个动作固定两秒”。\n\n## 先给段落功能，再给秒数\n\n一条30秒品牌片可有“进入、触感、展开、留味”四段，而非强行安排危机与反转。关系戏可有“试探、接住、错过、停留”；喜剧可有“建立预期、重复、偏差、反应”。这些都是可选组织方式，不是新三幕模板。\n\n拍摄或生成前，写下每段结束时观众应多获得什么。没有新增信息或感受的段落，可以因节奏或审美保留，但要知道自己为什么愿意花这个时间。\n\n## 一镜到底与蒙太奇解决不同问题\n\n一镜到底强调空间和过程连续，适合让观众跟随一件事；多镜头允许压缩时间、改变视点、比较材料、制造跳跃。两者没有天然高低。\n\n困难动作不必全靠连续长镜头完成；反过来，安静对话也不需要每句话一个切镜。选形式时先看表达任务与制作代价。\n\n## 切镜理由不只有动作完成\n\n可以在看见关键物之前切，让声音把人带过去；可以在一个动作尚未结束时切到反应；可以保留动作完成之后的余量，让空白成为内容。\n\n> 杯子已经被拿走，摄影机还留在那圈水迹上。下一镜不解释这圈水，而让一个更开阔的空间接住它。\n\n这是可选的感官连接，不要求观众把水迹解码成具体象征。\n\n## 声音可以比画面更连续\n\n音乐的一个长音跨过两个镜头，环境声在切换前先进入，人物的最后半句话留在对方反应上，都能组织时间。不要让每个AI生成片段都带着自己的音乐开头与结尾，拼接时互相打架。\n\n重要声音宜单独规划，具体方法见[声音与音乐](/craft/07-sound-music.md)。\n\n## 交接点，比漂亮中段更容易出问题\n\n上一镜人物右手拿杯，下一镜突然左手；上一镜在门外，下一镜已经坐下却没有时间跳跃线索；同一场景光源反向；镜头结尾意外变成慢动作。这些都需要在剪辑里判断是否影响理解，不是看到任何差异就返工。\n\n记录每条候选片段的可用区间、起终状态和主要缺陷即可。不要把“生成成功”直接写成“成片通过”。\n\n## 留剪辑余量，但不把空白当统一规定\n\n重要动作前后留一点可选择的空间有助于剪辑；准确余量取决于节奏与工具时长。需要静止产品收尾，就让末尾真的稳定，不要在最后一帧还在运镜。需要突然中断，就不应强行加平缓收尾。\n\n时间约束冲突时，减少必须发生的事件、改变剪辑形式或重新分配时长，通常比要求模型“更自然地完成全部动作”更清楚。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"craft-09-time-montage-section-0","title":"有三种时间要一起算"},{"id":"craft-09-time-montage-section-1","title":"先给段落功能，再给秒数"},{"id":"craft-09-time-montage-section-2","title":"一镜到底与蒙太奇解决不同问题"},{"id":"craft-09-time-montage-section-3","title":"切镜理由不只有动作完成"},{"id":"craft-09-time-montage-section-4","title":"声音可以比画面更连续"},{"id":"craft-09-time-montage-section-5","title":"交接点，比漂亮中段更容易出问题"},{"id":"craft-09-time-montage-section-6","title":"留剪辑余量，但不把空白当统一规定"}]},{"id":"workflows/index","path":"workflows/index.md","title":"IV · 生成与迭代","description":"","type":"Index","group":"workflows","tags":[],"html":"<h1>IV · 生成与迭代<\/h1>\n<p>把创作说明适配到具体任务，接续资产、输出与修复。<\/p>\n<ul>\n<li><p><a href=\"#/workflows/01-brief-to-options\">21｜从一句需求，到几个真正不同的方向<\/a> — 先判断表达任务与已有条件，再展开方案；不把模糊需求直接扩成大提示词。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/02-text-to-image\">22｜文字生图：先造一个可读的画面<\/a> — 从视觉层级到材质细节，按依赖顺序推进，不让细节修补错误结构。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/03-image-edit\">23｜改图：指出位置，还要说清前后世界<\/a> — 区分指认、操作和保留项；把标记视作辅助，别误当精确蒙版。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/04-image-to-video\">24｜图生视频：让已经存在的画面继续发生<\/a> — 分清首帧与身份参考，用当前姿态启动动作，并为结尾留出可继续制作的状态。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/05-assets-multishot\">25｜多镜头与资产：丰富地准备，克制地提交<\/a> — 用少量可靠状态连接镜头，避免参考堆积与版本冲突。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/06-previs\">26｜复杂镜头：什么时候该离开文字，做预演<\/a> — 用草图、计时、运动参考和粗模解决语言不擅长的空间控制。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/07-evaluate-repair\">27｜评价与修复：别用“AI味”掩盖问题在哪<\/a> — 先定观看目标，再按证据诊断，做能解释结果的最小改动。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/08-model-adaptation\">28｜工具适配：同一创意，不必使用同一段提示词<\/a> — 区分创作层与模型接口；附同一镜头的四种提交方式。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# IV · 生成与迭代\n\n把创作说明适配到具体任务，接续资产、输出与修复。\n\n- [21｜从一句需求，到几个真正不同的方向](/workflows/01-brief-to-options.md) — 先判断表达任务与已有条件，再展开方案；不把模糊需求直接扩成大提示词。\n\n- [22｜文字生图：先造一个可读的画面](/workflows/02-text-to-image.md) — 从视觉层级到材质细节，按依赖顺序推进，不让细节修补错误结构。\n\n- [23｜改图：指出位置，还要说清前后世界](/workflows/03-image-edit.md) — 区分指认、操作和保留项；把标记视作辅助，别误当精确蒙版。\n\n- [24｜图生视频：让已经存在的画面继续发生](/workflows/04-image-to-video.md) — 分清首帧与身份参考，用当前姿态启动动作，并为结尾留出可继续制作的状态。\n\n- [25｜多镜头与资产：丰富地准备，克制地提交](/workflows/05-assets-multishot.md) — 用少量可靠状态连接镜头，避免参考堆积与版本冲突。\n\n- [26｜复杂镜头：什么时候该离开文字，做预演](/workflows/06-previs.md) — 用草图、计时、运动参考和粗模解决语言不擅长的空间控制。\n\n- [27｜评价与修复：别用“AI味”掩盖问题在哪](/workflows/07-evaluate-repair.md) — 先定观看目标，再按证据诊断，做能解释结果的最小改动。\n\n- [28｜工具适配：同一创意，不必使用同一段提示词](/workflows/08-model-adaptation.md) — 区分创作层与模型接口；附同一镜头的四种提交方式。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"workflows/01-brief-to-options","path":"workflows/01-brief-to-options.md","title":"21｜从一句需求，到几个真正不同的方向","description":"先判断表达任务与已有条件，再展开方案；不把模糊需求直接扩成大提示词。","type":"Playbook","group":"workflows","tags":["需求","创意","流程"],"html":"<h1>21｜从一句需求，到几个真正不同的方向<\/h1>\n<h2 id=\"workflows-01-brief-to-options-section-0\">第一步：把需求里的形容词翻成问题<\/h2>\n<p>收到“做得梦幻、轻盈、高级一点”，先确认这三个词分别要改善什么。梦幻是世界规则偏移，还是只是柔和？轻盈是产品触感、人物状态还是节奏？高级是材质精确、留白、文化气质，还是更昂贵的视觉信号？<\/p>\n<p>能从已有资料确定的，不重复询问；暂时不能确定但风险小的，标成方案假设继续做。品牌名称、必须保留的内容、授权范围、输出规格等不能随意猜。<\/p>\n<p>一份够用的起点可以只有六行：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">作品用途：30秒情绪品牌片，后续另做竖屏改版。\n核心体验：由被催促转为能慢一点，清爽但不是寒冷。\n必须读懂：产品是什么，何时被使用；不添加未经确认的功效表达。\n已有素材：包装主图、一个人物参考、一张室内场景参考。\n形式空间：允许少量非写实转场，人物与产品保持可辨认。\n待选择：音乐主导还是环境声主导；先比较两种方向。\n<\/code><\/pre>\n<p>这是创作简报，不是必须输入视频模型的整段提示词。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-1\">第二步：用不同载体发展方向<\/h2>\n<p>至少比较表达机制，而不只是颜色和场景。一个方向由身体状态改变推动，另一个由空间开合推动，第三个由声音密度变化推动。每个方向写一段感受稿、一段画面解释，再列一个最大风险。<\/p>\n<p>比如“声音密度变化”方向的风险是静音播放时信息变弱；“身体变化”方向的风险是表演被夸大。风险不是理由去否定创意，而是决定先试哪一点。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-2\">第三步：选方向时看四件事<\/h2>\n<p>是否贴近任务；是否有辨识度；核心信息是否容易被接收；是否能用现有条件完成。不要把“最容易生成”自动当成最好，也不要把“最奇怪”当成最有创意。<\/p>\n<p>有时一个审美冒险值得做，但应说清它让什么变好、让什么变难。成本和媒介限制应影响选择，而不是在最后才出现。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-3\">第四步：先试最可能推翻方案的地方<\/h2>\n<p>若全片靠一处玻璃折射成立，先做它，不要先生成十张漂亮人物图。若全片靠一句听起来不舍但不煽情的台词成立，先试听。若核心是两人交接道具，先试接触与去向。<\/p>\n<p>可以先用文字读稿、简单草图、已有素材剪出节拍，再决定是否值得生成。不是所有验证都要付费调用。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-4\">第五步：把创意冻结到恰当程度<\/h2>\n<p>确定表达方向、关键人物和物件、段落结果。自然小动作和非关键装饰留开放。选定的版本写成当前创作说明，下一步任务引用它，不把探索期的三方案一起带进执行。<\/p>\n<p>“冻结”只是停止无理由变化；真的发现更好方案仍可修改，但要让涉及的镜头、参考和声音同步更新。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-5\">输出什么<\/h2>\n<p>交给生成环节的是：选定方向、实际素材清单、当前镜头任务、重要约束与本次比较点。不必附上所有聊天记录与被否决方案。模板见<a href=\"#/practice/01-templates\">工具箱<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 21｜从一句需求，到几个真正不同的方向\n\n## 第一步：把需求里的形容词翻成问题\n\n收到“做得梦幻、轻盈、高级一点”，先确认这三个词分别要改善什么。梦幻是世界规则偏移，还是只是柔和？轻盈是产品触感、人物状态还是节奏？高级是材质精确、留白、文化气质，还是更昂贵的视觉信号？\n\n能从已有资料确定的，不重复询问；暂时不能确定但风险小的，标成方案假设继续做。品牌名称、必须保留的内容、授权范围、输出规格等不能随意猜。\n\n一份够用的起点可以只有六行：\n\n```text\n作品用途：30秒情绪品牌片，后续另做竖屏改版。\n核心体验：由被催促转为能慢一点，清爽但不是寒冷。\n必须读懂：产品是什么，何时被使用；不添加未经确认的功效表达。\n已有素材：包装主图、一个人物参考、一张室内场景参考。\n形式空间：允许少量非写实转场，人物与产品保持可辨认。\n待选择：音乐主导还是环境声主导；先比较两种方向。\n```\n\n这是创作简报，不是必须输入视频模型的整段提示词。\n\n## 第二步：用不同载体发展方向\n\n至少比较表达机制，而不只是颜色和场景。一个方向由身体状态改变推动，另一个由空间开合推动，第三个由声音密度变化推动。每个方向写一段感受稿、一段画面解释，再列一个最大风险。\n\n比如“声音密度变化”方向的风险是静音播放时信息变弱；“身体变化”方向的风险是表演被夸大。风险不是理由去否定创意，而是决定先试哪一点。\n\n## 第三步：选方向时看四件事\n\n是否贴近任务；是否有辨识度；核心信息是否容易被接收；是否能用现有条件完成。不要把“最容易生成”自动当成最好，也不要把“最奇怪”当成最有创意。\n\n有时一个审美冒险值得做，但应说清它让什么变好、让什么变难。成本和媒介限制应影响选择，而不是在最后才出现。\n\n## 第四步：先试最可能推翻方案的地方\n\n若全片靠一处玻璃折射成立，先做它，不要先生成十张漂亮人物图。若全片靠一句听起来不舍但不煽情的台词成立，先试听。若核心是两人交接道具，先试接触与去向。\n\n可以先用文字读稿、简单草图、已有素材剪出节拍，再决定是否值得生成。不是所有验证都要付费调用。\n\n## 第五步：把创意冻结到恰当程度\n\n确定表达方向、关键人物和物件、段落结果。自然小动作和非关键装饰留开放。选定的版本写成当前创作说明，下一步任务引用它，不把探索期的三方案一起带进执行。\n\n“冻结”只是停止无理由变化；真的发现更好方案仍可修改，但要让涉及的镜头、参考和声音同步更新。\n\n## 输出什么\n\n交给生成环节的是：选定方向、实际素材清单、当前镜头任务、重要约束与本次比较点。不必附上所有聊天记录与被否决方案。模板见[工具箱](/practice/01-templates.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"workflows-01-brief-to-options-section-0","title":"第一步：把需求里的形容词翻成问题"},{"id":"workflows-01-brief-to-options-section-1","title":"第二步：用不同载体发展方向"},{"id":"workflows-01-brief-to-options-section-2","title":"第三步：选方向时看四件事"},{"id":"workflows-01-brief-to-options-section-3","title":"第四步：先试最可能推翻方案的地方"},{"id":"workflows-01-brief-to-options-section-4","title":"第五步：把创意冻结到恰当程度"},{"id":"workflows-01-brief-to-options-section-5","title":"输出什么"}]},{"id":"workflows/02-text-to-image","path":"workflows/02-text-to-image.md","title":"22｜文字生图：先造一个可读的画面","description":"从视觉层级到材质细节，按依赖顺序推进，不让细节修补错误结构。","type":"Playbook","group":"workflows","tags":["生图","构图","首帧"],"html":"<h1>22｜文字生图：先造一个可读的画面<\/h1>\n<h2 id=\"workflows-02-text-to-image-section-0\">先判断你在做哪一种图<\/h2>\n<p>概念探索、角色资产、场景资产、最终静帧、版式海报不是同一个任务。角色资产优先身份与结构清楚，成片静帧可能优先氛围和视点，海报还要给信息排布留空间。<\/p>\n<p>若任务是探索“午后松弛”，可以开放人物与环境；若任务是同一产品的新角度，已经不是纯粹从零想象，应使用可用参考或编辑路线。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-1\">一张静帧的起草顺序<\/h2>\n<p>先一句话定观看任务，再写主要对象与关系；随后给出构图和环境；最后选择少量光、材料与风格。抽象感觉放在开头或收束处即可，不必每句话都重复。<\/p>\n<p>原创示例：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">一张明亮、安静的生活方式产品静帧。浅色洗手台右侧放着一只半透明青绿色按压瓶，左侧留出干净空间；镜头与台面略成俯角，能看清瓶身正面和少量顶部结构。午后的柔光从侧窗进入，在墙上留下很淡的窗影。台面只有一小片尚未干透的水迹，没有铺满装饰叶片。画面轻盈、清爽，但保留生活里的温度。\n<\/code><\/pre>\n<p>这是虚构产品的探索稿。已有真实包装时，应改成“使用包装参考”，不要让本段自造结构代替客户产品。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-2\">按层比较，别一口气选“最好看”<\/h2>\n<p><strong>第一轮看结构<\/strong>：主体是否突出、负空间是否有用、机位是否能看清目标。<\/p>\n<p><strong>第二轮看关系<\/strong>：人物与产品比例、环境距离、道具是否属于同一世界。<\/p>\n<p><strong>第三轮看材料与细节<\/strong>：光、反射、颜色、文字、皮肤与局部形态。<\/p>\n<p>不用机械分三次生成。如果一张图已经同时满足，就直接前进；如果构图错误，不要靠高分辨率和细纹把错误做得更精细。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-3\">修改时只说明需要变化的层<\/h2>\n<p>“让左上更空一些，瓶子位置不变”比重新描述一遍整张图更聚焦。多轮后整体漂移，就回到最后一个可靠版本，不在劣化图上不停叠改。<\/p>\n<p>同时检查参考是用来规定主体、风格还是布局。平台对这些参考的使用方式不同，见<a href=\"#/workflows/08-model-adaptation\">工具适配<\/a>。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-4\">同样是风格化，不必都向摄影靠近<\/h2>\n<p>插画可以用轮廓、色面和纹理；黏土动画静帧可以保留手工压痕；图形海报可以没有实体光源。给材质与媒介写出自己的规则，不加一串不相容的摄影关键词。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-5\">输出准备<\/h2>\n<p>确认画幅、实际像素、颜色与最终信息区，检查产品字标与结构。人物会进入视频时，还要看起始姿势是否可继续动作：双手在哪里，头部朝哪，主要道具有没有被遮住。<\/p>\n<p>如果这张图只漂亮，却让后续开盖、拿取或走动无从开始，它是漂亮静帧，不一定是好首帧。下一步见<a href=\"#/workflows/04-image-to-video\">图生视频<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-image\">图像工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 22｜文字生图：先造一个可读的画面\n\n## 先判断你在做哪一种图\n\n概念探索、角色资产、场景资产、最终静帧、版式海报不是同一个任务。角色资产优先身份与结构清楚，成片静帧可能优先氛围和视点，海报还要给信息排布留空间。\n\n若任务是探索“午后松弛”，可以开放人物与环境；若任务是同一产品的新角度，已经不是纯粹从零想象，应使用可用参考或编辑路线。\n\n## 一张静帧的起草顺序\n\n先一句话定观看任务，再写主要对象与关系；随后给出构图和环境；最后选择少量光、材料与风格。抽象感觉放在开头或收束处即可，不必每句话都重复。\n\n原创示例：\n\n```text\n一张明亮、安静的生活方式产品静帧。浅色洗手台右侧放着一只半透明青绿色按压瓶，左侧留出干净空间；镜头与台面略成俯角，能看清瓶身正面和少量顶部结构。午后的柔光从侧窗进入，在墙上留下很淡的窗影。台面只有一小片尚未干透的水迹，没有铺满装饰叶片。画面轻盈、清爽，但保留生活里的温度。\n```\n\n这是虚构产品的探索稿。已有真实包装时，应改成“使用包装参考”，不要让本段自造结构代替客户产品。\n\n## 按层比较，别一口气选“最好看”\n\n**第一轮看结构**：主体是否突出、负空间是否有用、机位是否能看清目标。\n\n**第二轮看关系**：人物与产品比例、环境距离、道具是否属于同一世界。\n\n**第三轮看材料与细节**：光、反射、颜色、文字、皮肤与局部形态。\n\n不用机械分三次生成。如果一张图已经同时满足，就直接前进；如果构图错误，不要靠高分辨率和细纹把错误做得更精细。\n\n## 修改时只说明需要变化的层\n\n“让左上更空一些，瓶子位置不变”比重新描述一遍整张图更聚焦。多轮后整体漂移，就回到最后一个可靠版本，不在劣化图上不停叠改。\n\n同时检查参考是用来规定主体、风格还是布局。平台对这些参考的使用方式不同，见[工具适配](/workflows/08-model-adaptation.md)。\n\n## 同样是风格化，不必都向摄影靠近\n\n插画可以用轮廓、色面和纹理；黏土动画静帧可以保留手工压痕；图形海报可以没有实体光源。给材质与媒介写出自己的规则，不加一串不相容的摄影关键词。\n\n## 输出准备\n\n确认画幅、实际像素、颜色与最终信息区，检查产品字标与结构。人物会进入视频时，还要看起始姿势是否可继续动作：双手在哪里，头部朝哪，主要道具有没有被遮住。\n\n如果这张图只漂亮，却让后续开盖、拿取或走动无从开始，它是漂亮静帧，不一定是好首帧。下一步见[图生视频](/workflows/04-image-to-video.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [图像工具：第一方依据与适用边界](/references/official-image.md)","toc":[{"id":"workflows-02-text-to-image-section-0","title":"先判断你在做哪一种图"},{"id":"workflows-02-text-to-image-section-1","title":"一张静帧的起草顺序"},{"id":"workflows-02-text-to-image-section-2","title":"按层比较，别一口气选“最好看”"},{"id":"workflows-02-text-to-image-section-3","title":"修改时只说明需要变化的层"},{"id":"workflows-02-text-to-image-section-4","title":"同样是风格化，不必都向摄影靠近"},{"id":"workflows-02-text-to-image-section-5","title":"输出准备"}]},{"id":"workflows/03-image-edit","path":"workflows/03-image-edit.md","title":"23｜改图：指出位置，还要说清前后世界","description":"区分指认、操作和保留项；把标记视作辅助，别误当精确蒙版。","type":"Playbook","group":"workflows","tags":["改图","蒙版","定位","产品"],"html":"<h1>23｜改图：指出位置，还要说清前后世界<\/h1>\n<h2 id=\"workflows-03-image-edit-section-0\">先把编辑范围说清<\/h2>\n<p>“让它好一点”没有定义变化。“让这个房间更温暖”可能改光、改材质、改陈设，也可能全改。先选目标：只改光，还是需要换家具？主体是否必须保持？需要复用哪张可靠原图？<\/p>\n<p>编辑的核心结构是：<strong>原图 + 目标区域 + 操作 + 预期结果 + 重要保留项<\/strong>。<\/p>\n<h2 id=\"workflows-03-image-edit-section-1\">指认方式从简单到复杂<\/h2>\n<p>只有一只杯子时，“桌上的杯子”可能已经足够；物件很多时，用框、箭头、标号、局部裁切或工具支持的蒙版减少歧义。不要不分任务一律画满辅助标记。<\/p>\n<p>图上的红箭头是可见指示；蒙版通常是接口中的编辑范围输入，二者不是同一种机制。即使提供蒙版，也不应假设外部像素绝对不变。OpenAI官方文档明确说明其图像蒙版是指导，不保证精确沿蒙版形状执行。[2]<\/p>\n<h2 id=\"workflows-03-image-edit-section-2\">四种常用操作，各有不同后果<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>操作<\/th>\n<th>要明确的事<\/th>\n<th>要检查的事<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>删除<\/td>\n<td>删对象，还是连影子、倒影与固定件一起删？<\/td>\n<td>背景修复、残影、重复纹理<\/td>\n<\/tr>\n<tr>\n<td>替换<\/td>\n<td>继承原尺寸姿态，还是连结构一起改变？<\/td>\n<td>接触、材质、主体身份<\/td>\n<\/tr>\n<tr>\n<td>移动<\/td>\n<td>原处不留副本，新位置如何落地？<\/td>\n<td>透视、比例、阴影与遮挡<\/td>\n<\/tr>\n<tr>\n<td>重打光<\/td>\n<td>哪个光源与区域变化，造型是否保持？<\/td>\n<td>光影合理、脸与产品是否被重新生成<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"workflows-03-image-edit-section-3\">一个可用的移动说明<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">使用未打标的原图作为画面基础，打标图仅帮助定位。把标1的这只花瓶移动到标2的桌面空位；原位置修复为同一张桌面的连续纹理，不保留第二只花瓶。保持瓶型、花枝数量与主要朝向，按新位置匹配透视和接触阴影。人物、桌子结构与画幅不变，最终画面没有任何定位标记。\n<\/code><\/pre>\n<p>只有工具可同时理解这两张输入且角色分工清楚时才这样提交；否则用一张轻标注图或原生蒙版。不要为了“信息完整”上传互相矛盾的多个底图。<\/p>\n<h2 id=\"workflows-03-image-edit-section-4\">用保留项保护任务，不堆无关禁令<\/h2>\n<p>需要保住包装文字，就把字标列为重点；背景远处无关纹理的变化可以按使用目的决定是否接受。若要求逐像素保留非编辑区，最好在后期把通过的局部合成回可靠原图，而不是依赖一大段“其他地方绝对不动”。<\/p>\n<p>标记不要盖住你希望保留的结构；已经盖住时另给未遮挡原图或清晰局部，不能要求模型从不存在的信息里还原精确设计。<\/p>\n<h2 id=\"workflows-03-image-edit-section-5\">完成后做两次比较<\/h2>\n<p>第一次只看编辑目标是否对；第二次看原本正确的区域是否被连带改变。需要品牌、包装和连续人物时，这两步同样重要。<\/p>\n<p>连续编辑发生漂移，就退回最后通过的版本，按区域分步处理。不要把每一张中间结果都称为新的“最终图”。如何记最少状态，见<a href=\"#/workflows/05-assets-multishot\">资产与多镜头<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-image\">图像工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 23｜改图：指出位置，还要说清前后世界\n\n## 先把编辑范围说清\n\n“让它好一点”没有定义变化。“让这个房间更温暖”可能改光、改材质、改陈设，也可能全改。先选目标：只改光，还是需要换家具？主体是否必须保持？需要复用哪张可靠原图？\n\n编辑的核心结构是：**原图 + 目标区域 + 操作 + 预期结果 + 重要保留项**。\n\n## 指认方式从简单到复杂\n\n只有一只杯子时，“桌上的杯子”可能已经足够；物件很多时，用框、箭头、标号、局部裁切或工具支持的蒙版减少歧义。不要不分任务一律画满辅助标记。\n\n图上的红箭头是可见指示；蒙版通常是接口中的编辑范围输入，二者不是同一种机制。即使提供蒙版，也不应假设外部像素绝对不变。OpenAI官方文档明确说明其图像蒙版是指导，不保证精确沿蒙版形状执行。[2]\n\n## 四种常用操作，各有不同后果\n\n| 操作 | 要明确的事 | 要检查的事 |\n| --- | --- | --- |\n| 删除 | 删对象，还是连影子、倒影与固定件一起删？ | 背景修复、残影、重复纹理 |\n| 替换 | 继承原尺寸姿态，还是连结构一起改变？ | 接触、材质、主体身份 |\n| 移动 | 原处不留副本，新位置如何落地？ | 透视、比例、阴影与遮挡 |\n| 重打光 | 哪个光源与区域变化，造型是否保持？ | 光影合理、脸与产品是否被重新生成 |\n\n## 一个可用的移动说明\n\n```text\n使用未打标的原图作为画面基础，打标图仅帮助定位。把标1的这只花瓶移动到标2的桌面空位；原位置修复为同一张桌面的连续纹理，不保留第二只花瓶。保持瓶型、花枝数量与主要朝向，按新位置匹配透视和接触阴影。人物、桌子结构与画幅不变，最终画面没有任何定位标记。\n```\n\n只有工具可同时理解这两张输入且角色分工清楚时才这样提交；否则用一张轻标注图或原生蒙版。不要为了“信息完整”上传互相矛盾的多个底图。\n\n## 用保留项保护任务，不堆无关禁令\n\n需要保住包装文字，就把字标列为重点；背景远处无关纹理的变化可以按使用目的决定是否接受。若要求逐像素保留非编辑区，最好在后期把通过的局部合成回可靠原图，而不是依赖一大段“其他地方绝对不动”。\n\n标记不要盖住你希望保留的结构；已经盖住时另给未遮挡原图或清晰局部，不能要求模型从不存在的信息里还原精确设计。\n\n## 完成后做两次比较\n\n第一次只看编辑目标是否对；第二次看原本正确的区域是否被连带改变。需要品牌、包装和连续人物时，这两步同样重要。\n\n连续编辑发生漂移，就退回最后通过的版本，按区域分步处理。不要把每一张中间结果都称为新的“最终图”。如何记最少状态，见[资产与多镜头](/workflows/05-assets-multishot.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [图像工具：第一方依据与适用边界](/references/official-image.md)","toc":[{"id":"workflows-03-image-edit-section-0","title":"先把编辑范围说清"},{"id":"workflows-03-image-edit-section-1","title":"指认方式从简单到复杂"},{"id":"workflows-03-image-edit-section-2","title":"四种常用操作，各有不同后果"},{"id":"workflows-03-image-edit-section-3","title":"一个可用的移动说明"},{"id":"workflows-03-image-edit-section-4","title":"用保留项保护任务，不堆无关禁令"},{"id":"workflows-03-image-edit-section-5","title":"完成后做两次比较"}]},{"id":"workflows/04-image-to-video","path":"workflows/04-image-to-video.md","title":"24｜图生视频：让已经存在的画面继续发生","description":"分清首帧与身份参考，用当前姿态启动动作，并为结尾留出可继续制作的状态。","type":"Playbook","group":"workflows","tags":["图生视频","首帧","动作","执行"],"html":"<h1>24｜图生视频：让已经存在的画面继续发生<\/h1>\n<h2 id=\"workflows-04-image-to-video-section-0\">上传图片之前，先知道它扮演什么角色<\/h2>\n<p><strong>首帧<\/strong>通常决定这段运动从什么画面开始。<strong>身份参考<\/strong>说明这个人是谁，不一定要求从图里的姿态开始。<strong>风格参考<\/strong>提供外观方向，不一定规定空间。不同工具的输入能力和名称不一致，必须按实际模式确认。[2]<\/p>\n<p>因此“只参考脸，不参考姿态”不是万能咒语。在强首帧约束的任务里，你不能一边要求严格保留第一帧，一边要求第一秒已经变成完全不同的站姿与机位。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-1\">先写一条自然接续<\/h2>\n<p>首帧：女子倚在窗边，右手拿杯，看向室内。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">她听见窗外有人叫她，视线先移向窗外，随后身体稍稍转过去；右手仍稳稳拿着杯子，没有端起来喝。窗帘在她转身后轻碰一下肩侧。镜头保持原来的中景和位置，安静地等她看清来人。\n<\/code><\/pre>\n<p>这段主要写运动和变化，没有重复定义衣服、鼻梁、窗框颜色。输入图已经提供的内容，不必靠长段文字再建立一遍。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-2\">让本次任务有一个结尾状态<\/h2>\n<p>“她一直走”适合探索动势，但进入多镜头制作时，知道最后停在哪儿更有帮助。“她走到门边停住，仍没有打开门”既限定进度，也给下一镜留了起点。<\/p>\n<p>如果最终要留产品定帧，末尾应安排稳定，不要直到最后都在旋转。如果要突然切断，允许未完成动作，切点由编辑选择。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-3\">用时间表达关系，不迷信精确秒数<\/h2>\n<p>可写“先停一下，再回头”，也可写“前段听见，后段认出”。对特定时长的生成任务，用粗时间段帮助整理，但要与实际设置一致。关键对白或节拍需要用输出音视频确认，不能凭提示词中的小数当完成标准。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-4\">多种运动同时存在时，先确定主动作<\/h2>\n<p>人物转身、摄影机环绕、窗帘大幅飘动、光线闪烁和焦点切换会竞争注意，也增加定位难度。先测试人物或摄影机中的主要一项，再决定是否需要加入其他变化。这是减少诊断歧义的方法，不是所有模型的隐藏机制。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-5\">三个常见失败入口<\/h2>\n<p>动作从奇怪姿态起步：修首帧或调整动作，不是加“自然”。<\/p>\n<p>身份运动中漂移：检查有效人脸信息、转头幅度、遮挡和工具参考能力，再选择缩小动作或分镜，而非无限强调不变脸。<\/p>\n<p>动作完成了，情绪没读出来：检查镜头是否看得到反应，刺激是否明确，剪辑是否给了停留时间。表演句本身未必有错。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-6\">选择与剪辑也是生成流程的一部分<\/h2>\n<p>从候选中选可用区间，不要求每个生成片段头尾都完美。可以剪去破绽，但不能剪掉必需因果再宣称完成任务。评价时看实际片段，不看任务状态写着“成功”。<\/p>\n<p>衔接后续见<a href=\"#/workflows/05-assets-multishot\">多镜头流程<\/a>，高风险动作见<a href=\"#/workflows/06-previs\">预演<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 24｜图生视频：让已经存在的画面继续发生\n\n## 上传图片之前，先知道它扮演什么角色\n\n**首帧**通常决定这段运动从什么画面开始。**身份参考**说明这个人是谁，不一定要求从图里的姿态开始。**风格参考**提供外观方向，不一定规定空间。不同工具的输入能力和名称不一致，必须按实际模式确认。[2]\n\n因此“只参考脸，不参考姿态”不是万能咒语。在强首帧约束的任务里，你不能一边要求严格保留第一帧，一边要求第一秒已经变成完全不同的站姿与机位。\n\n## 先写一条自然接续\n\n首帧：女子倚在窗边，右手拿杯，看向室内。\n\n```text\n她听见窗外有人叫她，视线先移向窗外，随后身体稍稍转过去；右手仍稳稳拿着杯子，没有端起来喝。窗帘在她转身后轻碰一下肩侧。镜头保持原来的中景和位置，安静地等她看清来人。\n```\n\n这段主要写运动和变化，没有重复定义衣服、鼻梁、窗框颜色。输入图已经提供的内容，不必靠长段文字再建立一遍。\n\n## 让本次任务有一个结尾状态\n\n“她一直走”适合探索动势，但进入多镜头制作时，知道最后停在哪儿更有帮助。“她走到门边停住，仍没有打开门”既限定进度，也给下一镜留了起点。\n\n如果最终要留产品定帧，末尾应安排稳定，不要直到最后都在旋转。如果要突然切断，允许未完成动作，切点由编辑选择。\n\n## 用时间表达关系，不迷信精确秒数\n\n可写“先停一下，再回头”，也可写“前段听见，后段认出”。对特定时长的生成任务，用粗时间段帮助整理，但要与实际设置一致。关键对白或节拍需要用输出音视频确认，不能凭提示词中的小数当完成标准。\n\n## 多种运动同时存在时，先确定主动作\n\n人物转身、摄影机环绕、窗帘大幅飘动、光线闪烁和焦点切换会竞争注意，也增加定位难度。先测试人物或摄影机中的主要一项，再决定是否需要加入其他变化。这是减少诊断歧义的方法，不是所有模型的隐藏机制。\n\n## 三个常见失败入口\n\n动作从奇怪姿态起步：修首帧或调整动作，不是加“自然”。\n\n身份运动中漂移：检查有效人脸信息、转头幅度、遮挡和工具参考能力，再选择缩小动作或分镜，而非无限强调不变脸。\n\n动作完成了，情绪没读出来：检查镜头是否看得到反应，刺激是否明确，剪辑是否给了停留时间。表演句本身未必有错。\n\n## 选择与剪辑也是生成流程的一部分\n\n从候选中选可用区间，不要求每个生成片段头尾都完美。可以剪去破绽，但不能剪掉必需因果再宣称完成任务。评价时看实际片段，不看任务状态写着“成功”。\n\n衔接后续见[多镜头流程](/workflows/05-assets-multishot.md)，高风险动作见[预演](/workflows/06-previs.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [视频工具：第一方依据与适用边界](/references/official-video.md)","toc":[{"id":"workflows-04-image-to-video-section-0","title":"上传图片之前，先知道它扮演什么角色"},{"id":"workflows-04-image-to-video-section-1","title":"先写一条自然接续"},{"id":"workflows-04-image-to-video-section-2","title":"让本次任务有一个结尾状态"},{"id":"workflows-04-image-to-video-section-3","title":"用时间表达关系，不迷信精确秒数"},{"id":"workflows-04-image-to-video-section-4","title":"多种运动同时存在时，先确定主动作"},{"id":"workflows-04-image-to-video-section-5","title":"三个常见失败入口"},{"id":"workflows-04-image-to-video-section-6","title":"选择与剪辑也是生成流程的一部分"}]},{"id":"workflows/05-assets-multishot","path":"workflows/05-assets-multishot.md","title":"25｜多镜头与资产：丰富地准备，克制地提交","description":"用少量可靠状态连接镜头，避免参考堆积与版本冲突。","type":"Playbook","group":"workflows","tags":["资产","多镜头","交接","一致性"],"html":"<h1>25｜多镜头与资产：丰富地准备，克制地提交<\/h1>\n<h2 id=\"workflows-05-assets-multishot-section-0\">资产库不是每次要一起上传的文件夹<\/h2>\n<p>库里可以有面部、服装、声音、行为、场景、道具和不同状态。一次镜头只取实际需要的部分。桌边近景可能只需要脸、当前上装和桌面环境；不必把背面鞋底、上一场湿衣与另一版发型全部给进去。<\/p>\n<p>教程06、07、08共同提供的思路，是让重复出现的东西有可靠依据。把它扩展为“参考越多越好”，就会背离原本目的。[1]<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-1\">四类东西，别混成一个角色包<\/h2>\n<p><strong>身份<\/strong>跨造型延续；<strong>造型<\/strong>在场次内保持；<strong>状态<\/strong>随剧情改变；<strong>本镜头姿态<\/strong>是动作起点。衣服能换，脸不必换；角色紧张不意味着每场都用紧张表情参考。<\/p>\n<p>声音也类似：稳定声线与本次台词表演分开，避免“本场压低声音”变成此后所有场次的固定人格。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-2\">给每个镜头一张很薄的任务卡<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">镜头：S04，接S03。\n本镜任务：她从桌上拿起产品，停在能看清标签的位置。\n引用：人物A已批准身份；造型A-室内；产品瓶身V2；桌边首帧S04-V1。\n起点：瓶子在桌上，盖关闭；她双手空着。\n终点：瓶子在右手，盖仍关闭；人物仍坐着。\n本次开放：自然的手指调整与衣袖跟随。\n本次必查：瓶型、字标、持有手、起终状态。\n<\/code><\/pre>\n<p>这份卡是团队说明。给模型时只编入它支持并需要的内容；别指望一个内部文件名就能自动唤起未上传资产。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-3\">镜头交接，要记实际发生了什么<\/h2>\n<p>如果输出中角色最终把瓶子放回桌上，不能仅因为提示词要求拿着，就让下一镜仍按“右手持瓶”生成。先决定接受放回的改动，还是修当前镜头。<strong>已批准的媒体状态才是接续依据。<\/strong><\/p>\n<p>批准记录只需知道哪条片段、哪一段时间可用、与原计划有什么有意差别、下一镜从什么状态开始。不要在多个文件里手工维护相互冲突的“最新状态”。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-4\">场景参考先检查是否真是一间房<\/h2>\n<p>门、窗与大件家具的相对关系要一致；反打不是生成一间风格相近的新房间。少量主视图、反打和布局，常比一张细节很小的九宫格更容易检查。需要哪些角度由镜头计划决定。<\/p>\n<p>四视图也没有固定“横图坏、竖图好”的法则。关键是被需要的面部和服装信息够清楚、各视图是同一身份、输入后没有缩小得失去细节。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-5\">声画与后期也要共享同一决定<\/h2>\n<p>人物在S04做了决定，音乐转折不应还按旧版S05才开始；台词删了一句，字幕和口型也要检查；服装状态更新后，只重做受影响的镜头。<\/p>\n<p>不必把所有创意冻结为大型资产管理系统。一部短片用一个明确当前版的总说明、镜头卡与通过片段索引就可以开始。规模增长后再增加工具。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-6\">交付前看整个序列<\/h2>\n<p>单条片段漂亮不代表拼起来成立。检查角色的观看方向、空间地标、声音连续、产品与道具状态、节奏起落。观看序列时暂时放下提示词，先像普通观众一样看一遍，再做技术检查。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 25｜多镜头与资产：丰富地准备，克制地提交\n\n## 资产库不是每次要一起上传的文件夹\n\n库里可以有面部、服装、声音、行为、场景、道具和不同状态。一次镜头只取实际需要的部分。桌边近景可能只需要脸、当前上装和桌面环境；不必把背面鞋底、上一场湿衣与另一版发型全部给进去。\n\n教程06、07、08共同提供的思路，是让重复出现的东西有可靠依据。把它扩展为“参考越多越好”，就会背离原本目的。[1]\n\n## 四类东西，别混成一个角色包\n\n**身份**跨造型延续；**造型**在场次内保持；**状态**随剧情改变；**本镜头姿态**是动作起点。衣服能换，脸不必换；角色紧张不意味着每场都用紧张表情参考。\n\n声音也类似：稳定声线与本次台词表演分开，避免“本场压低声音”变成此后所有场次的固定人格。\n\n## 给每个镜头一张很薄的任务卡\n\n```text\n镜头：S04，接S03。\n本镜任务：她从桌上拿起产品，停在能看清标签的位置。\n引用：人物A已批准身份；造型A-室内；产品瓶身V2；桌边首帧S04-V1。\n起点：瓶子在桌上，盖关闭；她双手空着。\n终点：瓶子在右手，盖仍关闭；人物仍坐着。\n本次开放：自然的手指调整与衣袖跟随。\n本次必查：瓶型、字标、持有手、起终状态。\n```\n\n这份卡是团队说明。给模型时只编入它支持并需要的内容；别指望一个内部文件名就能自动唤起未上传资产。\n\n## 镜头交接，要记实际发生了什么\n\n如果输出中角色最终把瓶子放回桌上，不能仅因为提示词要求拿着，就让下一镜仍按“右手持瓶”生成。先决定接受放回的改动，还是修当前镜头。**已批准的媒体状态才是接续依据。**\n\n批准记录只需知道哪条片段、哪一段时间可用、与原计划有什么有意差别、下一镜从什么状态开始。不要在多个文件里手工维护相互冲突的“最新状态”。\n\n## 场景参考先检查是否真是一间房\n\n门、窗与大件家具的相对关系要一致；反打不是生成一间风格相近的新房间。少量主视图、反打和布局，常比一张细节很小的九宫格更容易检查。需要哪些角度由镜头计划决定。\n\n四视图也没有固定“横图坏、竖图好”的法则。关键是被需要的面部和服装信息够清楚、各视图是同一身份、输入后没有缩小得失去细节。\n\n## 声画与后期也要共享同一决定\n\n人物在S04做了决定，音乐转折不应还按旧版S05才开始；台词删了一句，字幕和口型也要检查；服装状态更新后，只重做受影响的镜头。\n\n不必把所有创意冻结为大型资产管理系统。一部短片用一个明确当前版的总说明、镜头卡与通过片段索引就可以开始。规模增长后再增加工具。\n\n## 交付前看整个序列\n\n单条片段漂亮不代表拼起来成立。检查角色的观看方向、空间地标、声音连续、产品与道具状态、节奏起落。观看序列时暂时放下提示词，先像普通观众一样看一遍，再做技术检查。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"workflows-05-assets-multishot-section-0","title":"资产库不是每次要一起上传的文件夹"},{"id":"workflows-05-assets-multishot-section-1","title":"四类东西，别混成一个角色包"},{"id":"workflows-05-assets-multishot-section-2","title":"给每个镜头一张很薄的任务卡"},{"id":"workflows-05-assets-multishot-section-3","title":"镜头交接，要记实际发生了什么"},{"id":"workflows-05-assets-multishot-section-4","title":"场景参考先检查是否真是一间房"},{"id":"workflows-05-assets-multishot-section-5","title":"声画与后期也要共享同一决定"},{"id":"workflows-05-assets-multishot-section-6","title":"交付前看整个序列"}]},{"id":"workflows/06-previs","path":"workflows/06-previs.md","title":"26｜复杂镜头：什么时候该离开文字，做预演","description":"用草图、计时、运动参考和粗模解决语言不擅长的空间控制。","type":"Playbook","group":"workflows","tags":["预演","Previs","复杂动作","控制"],"html":"<h1>26｜复杂镜头：什么时候该离开文字，做预演<\/h1>\n<h2 id=\"workflows-06-previs-section-0\">不要让所有镜头都背上三维流程<\/h2>\n<p>一个人抬头、一个产品转台、一个固定对话镜头，未必需要粗模。多人物同步、复杂遮挡、长路线、关键交接或严格运动节拍，才值得先把空间变成可以播放的东西。<\/p>\n<p>教程01最值得保留的不是“以后不要写运镜脚本”，而是<strong>把关键空间和时间关系变成可观看的预演<\/strong>。[1]<\/p>\n<h2 id=\"workflows-06-previs-section-1\">先写观众必须看懂的顺序<\/h2>\n<p>假设一个30秒长镜头要表现文件被调换。先确认：观众看到原件，看到谁接近，看到交换发生或足够明确的证据，看到后来谁拿着哪份文件。摄影机路线围绕这些信息服务，而不是先画一条很漂亮的曲线再塞剧情。<\/p>\n<p>如果想故意隐瞒交换，也应说明观众此刻只需要怀疑，后面再揭示。这与“动作不清楚却希望观众看懂”不同。<\/p>\n<h2 id=\"workflows-06-previs-section-2\">在三维之前，做最便宜的预演<\/h2>\n<p>桌面小物代替人物，手机拍路线，或在平面草图上画两三处关键站位，读一遍台词并计时。确认能否完成，再决定是否用Blender等工具搭粗模。<\/p>\n<p>时间不能只按路径长度推断。接触、停顿、读信息和观众辨认都可能比走路耗时。不要只得到“30秒足够”一句结论，要实际播放节拍。<\/p>\n<h2 id=\"workflows-06-previs-section-3\">粗模要粗在外观，不粗在关键关系<\/h2>\n<p>人物可以是方块与球，场景可以是简化墙体；但关键道具的可见性、人物与相机路线、机位高度、遮挡和时间需要足够准确。若剧情靠细小手部交换，只有躯干方块的预演不能证明交换已清楚，需要额外代理物、示意动作或特写设计。<\/p>\n<p>可交给制作助手的说明：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">按已确认的镜头说明建立简化预演，不重新改写剧情。人物用不同颜色的简单体块区分，关键道具单独建代理物。先输出俯视布局与三个信息关键时刻的机位，再输出连续相机运动。若现有空间不能看清道具交接，提出最小改动方案，而不是偷偷移动门窗或省略动作。外观参考只提供空间辅助，最终采用的调整需写回镜头说明。\n<\/code><\/pre>\n<p>这是制作任务，不是提交视频模型的提示词。<\/p>\n<h2 id=\"workflows-06-previs-section-4\">分清三种预演输出<\/h2>\n<p><strong>给人审查的说明版<\/strong>可以带人物名、时间、箭头与轨迹。<strong>给模型的运动参考<\/strong>尽量去除会被误当成成片的辅助标记。<strong>可编辑工程<\/strong>保留路线与机位，便于修改。<\/p>\n<p>不必每次都制作全部三种；需要谁消费，就提供适合谁的版本。<\/p>\n<h2 id=\"workflows-06-previs-section-5\">交给生成器时声明参考职责<\/h2>\n<p>运动视频用于相机、人物位置和节奏；外观资产用于人物与场景外貌；当前提示描述情绪、材料和必要细节。生成器能否可靠分离这些职责，必须按实际工具与输入限制测试。文字说明“只学运动”不是保证。<\/p>\n<p>模型不支持当前长度或参考模式时，缩短为若干可衔接段落，或改变工具路线。不要把第三方界面曾显示的时长，当成所有接口都支持的规格。<\/p>\n<h2 id=\"workflows-06-previs-section-6\">预演通过后，仍需验最终片<\/h2>\n<p>几何连续不等于演员身份连续，路线正确不等于道具未漂移，动作准时不等于情绪成立。用<a href=\"#/workflows/07-evaluate-repair\">评价与修复<\/a>分别看内容、表达与技术。完整示例见<a href=\"#/cases/08-object-exchange\">文件交接案例<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a>\n[3] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 26｜复杂镜头：什么时候该离开文字，做预演\n\n## 不要让所有镜头都背上三维流程\n\n一个人抬头、一个产品转台、一个固定对话镜头，未必需要粗模。多人物同步、复杂遮挡、长路线、关键交接或严格运动节拍，才值得先把空间变成可以播放的东西。\n\n教程01最值得保留的不是“以后不要写运镜脚本”，而是**把关键空间和时间关系变成可观看的预演**。[1]\n\n## 先写观众必须看懂的顺序\n\n假设一个30秒长镜头要表现文件被调换。先确认：观众看到原件，看到谁接近，看到交换发生或足够明确的证据，看到后来谁拿着哪份文件。摄影机路线围绕这些信息服务，而不是先画一条很漂亮的曲线再塞剧情。\n\n如果想故意隐瞒交换，也应说明观众此刻只需要怀疑，后面再揭示。这与“动作不清楚却希望观众看懂”不同。\n\n## 在三维之前，做最便宜的预演\n\n桌面小物代替人物，手机拍路线，或在平面草图上画两三处关键站位，读一遍台词并计时。确认能否完成，再决定是否用Blender等工具搭粗模。\n\n时间不能只按路径长度推断。接触、停顿、读信息和观众辨认都可能比走路耗时。不要只得到“30秒足够”一句结论，要实际播放节拍。\n\n## 粗模要粗在外观，不粗在关键关系\n\n人物可以是方块与球，场景可以是简化墙体；但关键道具的可见性、人物与相机路线、机位高度、遮挡和时间需要足够准确。若剧情靠细小手部交换，只有躯干方块的预演不能证明交换已清楚，需要额外代理物、示意动作或特写设计。\n\n可交给制作助手的说明：\n\n```text\n按已确认的镜头说明建立简化预演，不重新改写剧情。人物用不同颜色的简单体块区分，关键道具单独建代理物。先输出俯视布局与三个信息关键时刻的机位，再输出连续相机运动。若现有空间不能看清道具交接，提出最小改动方案，而不是偷偷移动门窗或省略动作。外观参考只提供空间辅助，最终采用的调整需写回镜头说明。\n```\n\n这是制作任务，不是提交视频模型的提示词。\n\n## 分清三种预演输出\n\n**给人审查的说明版**可以带人物名、时间、箭头与轨迹。**给模型的运动参考**尽量去除会被误当成成片的辅助标记。**可编辑工程**保留路线与机位，便于修改。\n\n不必每次都制作全部三种；需要谁消费，就提供适合谁的版本。\n\n## 交给生成器时声明参考职责\n\n运动视频用于相机、人物位置和节奏；外观资产用于人物与场景外貌；当前提示描述情绪、材料和必要细节。生成器能否可靠分离这些职责，必须按实际工具与输入限制测试。文字说明“只学运动”不是保证。\n\n模型不支持当前长度或参考模式时，缩短为若干可衔接段落，或改变工具路线。不要把第三方界面曾显示的时长，当成所有接口都支持的规格。\n\n## 预演通过后，仍需验最终片\n\n几何连续不等于演员身份连续，路线正确不等于道具未漂移，动作准时不等于情绪成立。用[评价与修复](/workflows/07-evaluate-repair.md)分别看内容、表达与技术。完整示例见[文件交接案例](/cases/08-object-exchange.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)\n[3] [视频工具：第一方依据与适用边界](/references/official-video.md)","toc":[{"id":"workflows-06-previs-section-0","title":"不要让所有镜头都背上三维流程"},{"id":"workflows-06-previs-section-1","title":"先写观众必须看懂的顺序"},{"id":"workflows-06-previs-section-2","title":"在三维之前，做最便宜的预演"},{"id":"workflows-06-previs-section-3","title":"粗模要粗在外观，不粗在关键关系"},{"id":"workflows-06-previs-section-4","title":"分清三种预演输出"},{"id":"workflows-06-previs-section-5","title":"交给生成器时声明参考职责"},{"id":"workflows-06-previs-section-6","title":"预演通过后，仍需验最终片"}]},{"id":"workflows/07-evaluate-repair","path":"workflows/07-evaluate-repair.md","title":"27｜评价与修复：别用“AI味”掩盖问题在哪","description":"先定观看目标，再按证据诊断，做能解释结果的最小改动。","type":"Playbook","group":"workflows","tags":["评价","修复","试验","停止条件"],"html":"<h1>27｜评价与修复：别用“AI味”掩盖问题在哪<\/h1>\n<h2 id=\"workflows-07-evaluate-repair-section-0\">看成片之前，先写两个判断点<\/h2>\n<p>例如“观众能认出是同一瓶产品”和“结尾感到松开，而不是虚弱”。判断点不必很多，必须对应这个项目。技术上没有问题，却完全不像品牌想要的表达，也不能通过。<\/p>\n<p>第一次看，不读提示词，只写看到了什么、听到了什么；第二次再与任务对照。这样比较不容易被自己投入的文字说服。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-1\">失败分层，再动手<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>表现<\/th>\n<th>先检查<\/th>\n<th>优先修改方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>画面漂亮但没说清什么<\/td>\n<td>体验与信息任务<\/td>\n<td>重选载体或观看组织<\/td>\n<\/tr>\n<tr>\n<td>人物像在示范表情<\/td>\n<td>情境、对象与主动作<\/td>\n<td>减少表情清单，补真实任务<\/td>\n<\/tr>\n<tr>\n<td>手与物件乱<\/td>\n<td>首帧、持有状态、接触复杂度<\/td>\n<td>简化动作或拆镜，补有效参考<\/td>\n<\/tr>\n<tr>\n<td>场景变了<\/td>\n<td>多图布局是否一致<\/td>\n<td>先修场景事实，不先调色<\/td>\n<\/tr>\n<tr>\n<td>底图像贴上去<\/td>\n<td>光、尺度、边缘与透视<\/td>\n<td>回到图像关系，非直接加颗粒<\/td>\n<\/tr>\n<tr>\n<td>配音机械<\/td>\n<td>台词、角色差异、节奏、声音模式<\/td>\n<td>先判断哪层有错，再试听修改<\/td>\n<\/tr>\n<tr>\n<td>切起来突然<\/td>\n<td>起终状态、声桥、节拍<\/td>\n<td>改选片区间或补接头<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"workflows-07-evaluate-repair-section-2\">一次改一件主要事情，不是只允许改一个字<\/h2>\n<p>假设问题是“紧张不明显”。可以做两种候选：加一处手部停顿，或改变景别让原本反应可见。先不要同时换演员、灯光、模型和运镜，否则无法知道是哪个方向解决了问题。<\/p>\n<p>必要时一次修改一个相互依赖的小组：移动花瓶就需要同时修改旧位置背景与新阴影，不应为“单变量”故意让画面不完整。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-3\">保持比较条件尽可能相近<\/h2>\n<p>记录工具与模型版本、输入素材、设置、提示和选取区间。若工具支持种子，可以保留用于同条件比较；不同工具或模型的同一数字种子不意味着相同随机过程。<\/p>\n<p>相同设置也可能得到不同结果。不要只展示最成功样本然后称为普遍规律。积累经验时，至少留下失败类型与适用范围，不必假装样本很少的测试有统计显著性。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-4\">用失败去改变假设<\/h2>\n<p>假设“缺手部动作导致人物僵硬”，加动作后还是僵硬，先检查是否其实是机位看不到反应、声音太规整或首帧姿态不适合。不要把失败解释为提示词还不够长，继续添动作。<\/p>\n<p>如果多次尝试都只能得到不稳定的指尖操作，任务形式可能应改成更可读的大动作或剪辑，而不是继续追求一镜到底。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-5\">停止条件也要写<\/h2>\n<p>当关键任务通过、局部缺陷可以在后期低成本修复，继续生成可能只是在追求不可定义的“更好”。当核心表达仍错，局部精修没有意义；应返回创作方案。当工具不适合所需控制，换路线而不是继续消耗。<\/p>\n<p>“通过”建议分为：<strong>可用<\/strong>、<strong>可用但需指定修补<\/strong>、<strong>需重做<\/strong>。避免把“还可以”变成无人知道下一步做什么的状态。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-6\">复盘留下可迁移知识<\/h2>\n<p>不记录“这条提示很神”，而记录：在何种输入、何类动作、何种画幅中，哪些关系表达有效，哪些控制并不可靠。保留具体成功片段及失败片段的索引；没有真实媒体时只标为创作假设。<\/p>\n<p>配套评审表见<a href=\"#/practice/03-review-rubric\">评价工具<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 27｜评价与修复：别用“AI味”掩盖问题在哪\n\n## 看成片之前，先写两个判断点\n\n例如“观众能认出是同一瓶产品”和“结尾感到松开，而不是虚弱”。判断点不必很多，必须对应这个项目。技术上没有问题，却完全不像品牌想要的表达，也不能通过。\n\n第一次看，不读提示词，只写看到了什么、听到了什么；第二次再与任务对照。这样比较不容易被自己投入的文字说服。\n\n## 失败分层，再动手\n\n| 表现 | 先检查 | 优先修改方向 |\n| --- | --- | --- |\n| 画面漂亮但没说清什么 | 体验与信息任务 | 重选载体或观看组织 |\n| 人物像在示范表情 | 情境、对象与主动作 | 减少表情清单，补真实任务 |\n| 手与物件乱 | 首帧、持有状态、接触复杂度 | 简化动作或拆镜，补有效参考 |\n| 场景变了 | 多图布局是否一致 | 先修场景事实，不先调色 |\n| 底图像贴上去 | 光、尺度、边缘与透视 | 回到图像关系，非直接加颗粒 |\n| 配音机械 | 台词、角色差异、节奏、声音模式 | 先判断哪层有错，再试听修改 |\n| 切起来突然 | 起终状态、声桥、节拍 | 改选片区间或补接头 |\n\n## 一次改一件主要事情，不是只允许改一个字\n\n假设问题是“紧张不明显”。可以做两种候选：加一处手部停顿，或改变景别让原本反应可见。先不要同时换演员、灯光、模型和运镜，否则无法知道是哪个方向解决了问题。\n\n必要时一次修改一个相互依赖的小组：移动花瓶就需要同时修改旧位置背景与新阴影，不应为“单变量”故意让画面不完整。\n\n## 保持比较条件尽可能相近\n\n记录工具与模型版本、输入素材、设置、提示和选取区间。若工具支持种子，可以保留用于同条件比较；不同工具或模型的同一数字种子不意味着相同随机过程。\n\n相同设置也可能得到不同结果。不要只展示最成功样本然后称为普遍规律。积累经验时，至少留下失败类型与适用范围，不必假装样本很少的测试有统计显著性。\n\n## 用失败去改变假设\n\n假设“缺手部动作导致人物僵硬”，加动作后还是僵硬，先检查是否其实是机位看不到反应、声音太规整或首帧姿态不适合。不要把失败解释为提示词还不够长，继续添动作。\n\n如果多次尝试都只能得到不稳定的指尖操作，任务形式可能应改成更可读的大动作或剪辑，而不是继续追求一镜到底。\n\n## 停止条件也要写\n\n当关键任务通过、局部缺陷可以在后期低成本修复，继续生成可能只是在追求不可定义的“更好”。当核心表达仍错，局部精修没有意义；应返回创作方案。当工具不适合所需控制，换路线而不是继续消耗。\n\n“通过”建议分为：**可用**、**可用但需指定修补**、**需重做**。避免把“还可以”变成无人知道下一步做什么的状态。\n\n## 复盘留下可迁移知识\n\n不记录“这条提示很神”，而记录：在何种输入、何类动作、何种画幅中，哪些关系表达有效，哪些控制并不可靠。保留具体成功片段及失败片段的索引；没有真实媒体时只标为创作假设。\n\n配套评审表见[评价工具](/practice/03-review-rubric.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [视频工具：第一方依据与适用边界](/references/official-video.md)","toc":[{"id":"workflows-07-evaluate-repair-section-0","title":"看成片之前，先写两个判断点"},{"id":"workflows-07-evaluate-repair-section-1","title":"失败分层，再动手"},{"id":"workflows-07-evaluate-repair-section-2","title":"一次改一件主要事情，不是只允许改一个字"},{"id":"workflows-07-evaluate-repair-section-3","title":"保持比较条件尽可能相近"},{"id":"workflows-07-evaluate-repair-section-4","title":"用失败去改变假设"},{"id":"workflows-07-evaluate-repair-section-5","title":"停止条件也要写"},{"id":"workflows-07-evaluate-repair-section-6","title":"复盘留下可迁移知识"}]},{"id":"workflows/08-model-adaptation","path":"workflows/08-model-adaptation.md","title":"28｜工具适配：同一创意，不必使用同一段提示词","description":"区分创作层与模型接口；附同一镜头的四种提交方式。","type":"Playbook","group":"workflows","tags":["工具","适配","模型","接口"],"html":"<h1>28｜工具适配：同一创意，不必使用同一段提示词<\/h1>\n<h2 id=\"workflows-08-model-adaptation-section-0\">先保留共同创意，再改变输入方式<\/h2>\n<p>共同创意：一个人听见有人叫自己，回头认出朋友，笑意展开；机位安静不动。<\/p>\n<p><strong>文字生图探索<\/strong>需要先建立一瞬间：<\/p>\n<blockquote>\n<p>午后车站，一个年轻人刚认出镜头外的朋友，身体仍朝站台，脸已转向声音来的方向，笑意刚开始展开。平视中景，环境明亮，人物旁保留少量人流空间。<\/p>\n<\/blockquote>\n<p><strong>有确定首帧的图生视频<\/strong>重点是接续：<\/p>\n<blockquote>\n<p>他听到画面右侧有人叫自己，转头看过去，认出对方后笑了。摄影机保持原位。<\/p>\n<\/blockquote>\n<p><strong>多模态参考生成<\/strong>还要真实绑定素材：<\/p>\n<blockquote>\n<p>人物外观采用已绑定的人物参考，站台布局采用场景参考。本镜从人物侧身站立开始，按上述反应生成；不继承人物参考里的棚拍背景。<\/p>\n<\/blockquote>\n<p><strong>对话式图像编辑<\/strong>只改当前帧需要的事：<\/p>\n<blockquote>\n<p>保留人物身份、衣服和站台，只把表情调整到刚认出熟人的自然笑意，头部朝向不变。<\/p>\n<\/blockquote>\n<p>这四段不是四个互斥审美，而是不同任务。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-1\">查当前接口的六项能力<\/h2>\n<p>输入角色：首尾帧、身份、风格、运动或布局参考是否区分。<\/p>\n<p>参考限制：数量、格式、长度、分辨率与引用方式。<\/p>\n<p>文字偏好：简洁自然句、分段描述、参数词或专用标签。<\/p>\n<p>声音：是否生成、能否关闭、能否独立处理台词与说明。<\/p>\n<p>时长与镜头：实际输出长度、多镜头机制、编辑和续接能力。<\/p>\n<p>负向约束：是否有单独负向栏，普通否定是否推荐，冲突如何表现。<\/p>\n<p>这些必须按本次实际入口确认，不从教程截图、营销标题或另一家转售接口推断。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-2\">官方资料能支持到哪里<\/h2>\n<p>Midjourney当前基础指南仍重视短而清楚的表达；Runway图生视频指南区分图像提供的静态信息与提示提供的运动；Google视频指南允许按主体、动作、环境、机位等维度组织，同时提醒部分高级镜头效果可靠性会变化。[2][3]<\/p>\n<p>这些是工具的指导，不是跨模型统一定律。Runway Gen-4的正向表述建议也不等于所有生成系统都禁止负向提示。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-3\">否定句怎么处理<\/h2>\n<p>创作说明可写“不要夸张惊吓”，以区分目标。在更偏好正向描述的工具里，可以转成“反应小，先停一下，再自然回头”。必要的内容边界与安全要求不能因为“正向提示更好”就被抹掉；应选择工具支持的实际控制方式。<\/p>\n<p>“固定机位”通常比一串“不摇、不推、不绕”更容易读，但也不能保证工具不动。检查结果，必要时改路线。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-4\">防止三个假精确<\/h2>\n<p>设备名是外观和拍摄联想，不是已调用物理相机；提示里的秒数是节奏意图，不是逐帧执行回执；角色编号是指认方式，不是无需上传的永久记忆。<\/p>\n<p>参数真能在界面或API落实时，才把它作为实际配置。没有专用控制时，把效果写成可观察结果，并承认仍需选择。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-5\">维护，而不是追新清单<\/h2>\n<p>本书不提供“哪个模型永远最好”的排名。附录保留核验日期与第一方入口，便于工具变化时更新这一层，而不用重写表演、美术和通感方法。已归档的Sora2指南只用于回顾创作原则，不当作当前产品能力表。[3]<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-image\">图像工具：第一方依据与适用边界<\/a>\n[3] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 28｜工具适配：同一创意，不必使用同一段提示词\n\n## 先保留共同创意，再改变输入方式\n\n共同创意：一个人听见有人叫自己，回头认出朋友，笑意展开；机位安静不动。\n\n**文字生图探索**需要先建立一瞬间：\n> 午后车站，一个年轻人刚认出镜头外的朋友，身体仍朝站台，脸已转向声音来的方向，笑意刚开始展开。平视中景，环境明亮，人物旁保留少量人流空间。\n\n**有确定首帧的图生视频**重点是接续：\n> 他听到画面右侧有人叫自己，转头看过去，认出对方后笑了。摄影机保持原位。\n\n**多模态参考生成**还要真实绑定素材：\n> 人物外观采用已绑定的人物参考，站台布局采用场景参考。本镜从人物侧身站立开始，按上述反应生成；不继承人物参考里的棚拍背景。\n\n**对话式图像编辑**只改当前帧需要的事：\n> 保留人物身份、衣服和站台，只把表情调整到刚认出熟人的自然笑意，头部朝向不变。\n\n这四段不是四个互斥审美，而是不同任务。\n\n## 查当前接口的六项能力\n\n输入角色：首尾帧、身份、风格、运动或布局参考是否区分。\n\n参考限制：数量、格式、长度、分辨率与引用方式。\n\n文字偏好：简洁自然句、分段描述、参数词或专用标签。\n\n声音：是否生成、能否关闭、能否独立处理台词与说明。\n\n时长与镜头：实际输出长度、多镜头机制、编辑和续接能力。\n\n负向约束：是否有单独负向栏，普通否定是否推荐，冲突如何表现。\n\n这些必须按本次实际入口确认，不从教程截图、营销标题或另一家转售接口推断。\n\n## 官方资料能支持到哪里\n\nMidjourney当前基础指南仍重视短而清楚的表达；Runway图生视频指南区分图像提供的静态信息与提示提供的运动；Google视频指南允许按主体、动作、环境、机位等维度组织，同时提醒部分高级镜头效果可靠性会变化。[2][3]\n\n这些是工具的指导，不是跨模型统一定律。Runway Gen-4的正向表述建议也不等于所有生成系统都禁止负向提示。\n\n## 否定句怎么处理\n\n创作说明可写“不要夸张惊吓”，以区分目标。在更偏好正向描述的工具里，可以转成“反应小，先停一下，再自然回头”。必要的内容边界与安全要求不能因为“正向提示更好”就被抹掉；应选择工具支持的实际控制方式。\n\n“固定机位”通常比一串“不摇、不推、不绕”更容易读，但也不能保证工具不动。检查结果，必要时改路线。\n\n## 防止三个假精确\n\n设备名是外观和拍摄联想，不是已调用物理相机；提示里的秒数是节奏意图，不是逐帧执行回执；角色编号是指认方式，不是无需上传的永久记忆。\n\n参数真能在界面或API落实时，才把它作为实际配置。没有专用控制时，把效果写成可观察结果，并承认仍需选择。\n\n## 维护，而不是追新清单\n\n本书不提供“哪个模型永远最好”的排名。附录保留核验日期与第一方入口，便于工具变化时更新这一层，而不用重写表演、美术和通感方法。已归档的Sora2指南只用于回顾创作原则，不当作当前产品能力表。[3]\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [图像工具：第一方依据与适用边界](/references/official-image.md)\n[3] [视频工具：第一方依据与适用边界](/references/official-video.md)","toc":[{"id":"workflows-08-model-adaptation-section-0","title":"先保留共同创意，再改变输入方式"},{"id":"workflows-08-model-adaptation-section-1","title":"查当前接口的六项能力"},{"id":"workflows-08-model-adaptation-section-2","title":"官方资料能支持到哪里"},{"id":"workflows-08-model-adaptation-section-3","title":"否定句怎么处理"},{"id":"workflows-08-model-adaptation-section-4","title":"防止三个假精确"},{"id":"workflows-08-model-adaptation-section-5","title":"维护，而不是追新清单"}]},{"id":"cases/index","path":"cases/index.md","title":"V · 完整案例","description":"","type":"Index","group":"cases","tags":[],"html":"<h1>V · 完整案例<\/h1>\n<p>八个原创设计案例，从感受到执行，再到验收和替代路线。<\/p>\n<ul>\n<li><p><a href=\"#/cases/01-brand-film\">29｜完整案例：30秒洗发水品牌片《留一点空隙》<\/a> — 从感受、联想、镜头与音乐到生成拆分，完成一条原创品牌片的设计样稿。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/02-relationship\">30｜完整案例：餐桌上，一句没有被问完的话<\/a> — 用普通台词、物件与听者反应表现关系；同时提供直接表达的替代方案。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/03-big-emotion\">31｜完整案例：喜悦真的可以冲出来<\/a> — 用强动作与真实接触表现外放情绪，纠正“自然就是克制”的偏见。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/04-vlog\">32｜完整案例：谁在拍谁——12秒咖啡馆Vlog<\/a> — 用拍摄视点、手部占用和转场保持生活感，而非靠统一晃动滤镜。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/05-empty-corridor\">33｜完整案例：空走廊为什么会让人等下去<\/a> — 不用人物脸部与重型音乐，靠听觉、遮挡与延迟组织悬念。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/06-surreal-perfume\">34｜完整案例：不追求实拍的香水图与短动效<\/a> — 把风格化视作自己的世界规则，而不是不够真实的失败品。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/07-comedy\">35｜完整案例：安静自习室里的零食袋<\/a> — 让喜剧来自目标、阻力与反应，而不是给角色加夸张表情。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/08-object-exchange\">36｜完整案例：两份文件，谁最后拿着哪一份<\/a> — 用状态与观看证据规划一镜到底，并提供更经济的多镜头替代。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# V · 完整案例\n\n八个原创设计案例，从感受到执行，再到验收和替代路线。\n\n- [29｜完整案例：30秒洗发水品牌片《留一点空隙》](/cases/01-brand-film.md) — 从感受、联想、镜头与音乐到生成拆分，完成一条原创品牌片的设计样稿。\n\n- [30｜完整案例：餐桌上，一句没有被问完的话](/cases/02-relationship.md) — 用普通台词、物件与听者反应表现关系；同时提供直接表达的替代方案。\n\n- [31｜完整案例：喜悦真的可以冲出来](/cases/03-big-emotion.md) — 用强动作与真实接触表现外放情绪，纠正“自然就是克制”的偏见。\n\n- [32｜完整案例：谁在拍谁——12秒咖啡馆Vlog](/cases/04-vlog.md) — 用拍摄视点、手部占用和转场保持生活感，而非靠统一晃动滤镜。\n\n- [33｜完整案例：空走廊为什么会让人等下去](/cases/05-empty-corridor.md) — 不用人物脸部与重型音乐，靠听觉、遮挡与延迟组织悬念。\n\n- [34｜完整案例：不追求实拍的香水图与短动效](/cases/06-surreal-perfume.md) — 把风格化视作自己的世界规则，而不是不够真实的失败品。\n\n- [35｜完整案例：安静自习室里的零食袋](/cases/07-comedy.md) — 让喜剧来自目标、阻力与反应，而不是给角色加夸张表情。\n\n- [36｜完整案例：两份文件，谁最后拿着哪一份](/cases/08-object-exchange.md) — 用状态与观看证据规划一镜到底，并提供更经济的多镜头替代。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"cases/01-brand-film","path":"cases/01-brand-film.md","title":"29｜完整案例：30秒洗发水品牌片《留一点空隙》","description":"从感受、联想、镜头与音乐到生成拆分，完成一条原创品牌片的设计样稿。","type":"CaseStudy","group":"cases","tags":["完整案例","品牌","音乐","洗护","通感"],"html":"<h1>29｜完整案例：30秒洗发水品牌片《留一点空隙》<\/h1>\n<blockquote>\n<p>原创设计样稿，未进行图片、视频或配乐生成。品牌与产品设定为虚构；参考名称是制作时建立并绑定的代称，不代表附件已含这些媒体。<\/p>\n<\/blockquote>\n<h2 id=\"cases-01-brand-film-section-0\">任务与表达选择<\/h2>\n<p>30秒品牌片，青绿色洗发水，茶叶与泡沫可以出现，但不必三者反复同框。体验是“忙完一天之后，终于可以把注意力还给自己”。清爽、轻快、有温度；不把产品宣传成能解决情绪或人生问题。<\/p>\n<p>感受稿：<\/p>\n<blockquote>\n<p>一整天，声音都挤在她身上。回到家，水先替她把这些声音隔远。等她再走到窗边，风并没有变大，只是她终于给它留了位置。<\/p>\n<\/blockquote>\n<p>这里“水隔远声音”落到声音设计与空间切换，不拍通知图标被水冲走；“给风留位置”落到身体放松与构图开阔，不让墙壁变形。<\/p>\n<h2 id=\"cases-01-brand-film-section-1\">三方案比较后，采用一条主线<\/h2>\n<p>身体方案：从肩颈收紧到动作舒展。最直接，但容易被演成夸张广告笑容。<\/p>\n<p>材质方案：泡沫从密到薄，水纹由乱到稳。精致，但人物体验较弱。<\/p>\n<p>声音方案：从密集近声到水声主导，再到有间隔的音乐。最能表达“空隙”，但必须考虑静音观看。<\/p>\n<p>本案选择<strong>声音作结构、身体作可见支撑、材质作中段愉悦<\/strong>。静音时仍通过紧凑到开阔的取景、动作速度与停留读到变化。<\/p>\n<h2 id=\"cases-01-brand-film-section-2\">美术与连续性<\/h2>\n<p>人物身份保持，分为回家、洗护中、洗护后三个明确状态。通过剪辑表现真实时间经过，不把湿发瞬间变干当产品效果。室内是同一居所，窗向、台面与产品位置有稳定关系。<\/p>\n<p>产品采用按压瓶。包装字标与结构来自已批准参考；探索阶段使用无真实品牌的占位包装，最终字标在可编辑流程中核对。茶叶只作为一处植物或材质联想，不暗示未经确认的成分与功效。<\/p>\n<h2 id=\"cases-01-brand-film-section-3\">30秒剪辑设计，不是单次生成指令<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>画面与主动作<\/th>\n<th>声音与表达任务<\/th>\n<th>生成时优先检查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–4秒<\/td>\n<td>门内侧固定中景，她进门把包放下，手仍短暂搭着包带<\/td>\n<td>外面的车声与零碎室内声，音乐尚稀疏；“人回来了，节奏还没回来”<\/td>\n<td>放包接触、门与包的去向<\/td>\n<\/tr>\n<tr>\n<td>4–7秒<\/td>\n<td>桌面近景，手机屏幕朝下落在台面，手离开<\/td>\n<td>一声短接触后少一点信息噪声，不把手机拟人为反派<\/td>\n<td>手机不分裂，手离开后留半拍<\/td>\n<\/tr>\n<tr>\n<td>7–11秒<\/td>\n<td>水流和湿发局部，明确进入洗护时段<\/td>\n<td>水声占前景，音乐开始有轻律动<\/td>\n<td>水方向、头发湿态、避免不必要人体范围<\/td>\n<\/tr>\n<tr>\n<td>11–15秒<\/td>\n<td>按压瓶与手掌；一次按压，少量产品落到掌心<\/td>\n<td>泵头与液体细声，清楚但不夸大<\/td>\n<td>泵头结构、出液位置、标签和手部<\/td>\n<\/tr>\n<tr>\n<td>15–20秒<\/td>\n<td>洗护中的手与发丝局部，泡沫被缓慢带开<\/td>\n<td>音乐略展开，水声不消失；细节带来触感<\/td>\n<td>手与发丝、泡沫状态一致<\/td>\n<\/tr>\n<tr>\n<td>20–25秒<\/td>\n<td>明确时间跳切至洗护后，她在窗边把头发拨到肩后，停着感受一会儿风<\/td>\n<td>音乐更通透，室内声回来；不要求大笑<\/td>\n<td>干发状态、光源连续、动作不过度展示<\/td>\n<\/tr>\n<tr>\n<td>25–30秒<\/td>\n<td>产品静物，背景留空，一道轻反光经过墙面后停稳<\/td>\n<td>配乐收束，结尾留余味；旁白可为“给今天，留一点空隙。”<\/td>\n<td>包装正确，反光不盖字标，结尾稳定<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>表中秒数是编辑规划。实际按工具限制生成更适合剪取的素材，再在时间线上落实；不要强迫一段模型输出一次完成所有镜头。<\/p>\n<h2 id=\"cases-01-brand-film-section-4\">两段执行样稿<\/h2>\n<h3 id=\"cases-01-brand-film-section-5\">S04：产品按压，是第一风险测试<\/h3>\n<p>先准备结构清楚的瓶身和泵头参考、可继续动作的局部首帧。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">保留首帧的按压瓶、台面和双手位置。右手食指完成一次平稳按压，少量产品从出液口落入下方左手掌心；松开后泵头回到起始高度。镜头固定，能看清泵头、出液口和手掌的关系。光线清楚柔和，玻璃与塑料结构保持真实，不突出夸张飞溅。\n<\/code><\/pre>\n<p>如果接触持续不稳，改成“泵头近景”和“掌心已有产品”两个镜头，用声音连接。承认剪辑省略，不宣称获得了完美连续按压。<\/p>\n<h3 id=\"cases-01-brand-film-section-6\">S06：舒展不是摆出开心<\/h3>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">以洗护后干发首帧开始。她站在窗边，把落在脸侧的一缕头发拨到肩后，手自然落下，之后不再忙着做下一件事。窗边微风只带动少量发梢。摄影机安静留在原处，人物一侧有干净的空间。她的状态轻松、清醒，不需要对镜头微笑，也不刻意闭眼陶醉。\n<\/code><\/pre>\n<p>开篇已经展示她忙碌，结尾不必又用旁白解释“她终于放松了”。<\/p>\n<h2 id=\"cases-01-brand-film-section-7\">音乐说明与实际节拍<\/h2>\n<p>目标律动约118BPM，轻而有弹性的低音、清亮短音与稀疏打击乐；中段更展开，结尾减少声部。开头不直接铺满旋律，给门、包和手机接触留位置。声音稿可以使用<a href=\"#/craft/07-sound-music\">音乐章节<\/a>的结构。<\/p>\n<p>118BPM下，每拍约0.51秒，30秒约59拍。这是按目标速度计算的编辑参考，不意味着生成音频精确符合。不要为了整齐把所有切点放在重拍；按压与手机接触可以落在拍间，让动作不像示范操。<\/p>\n<h2 id=\"cases-01-brand-film-section-8\">最小制作顺序<\/h2>\n<p>先试泵头接触、湿发泡沫这两个高风险细节；再试结尾的轻松状态；选定音乐方向后排粗剪；最后补开篇与产品静帧。声音先行不意味着画面无权改变节奏，二者需要互相调整。<\/p>\n<h2 id=\"cases-01-brand-film-section-9\">验收与替代路线<\/h2>\n<p>去掉音乐后，是否仍能看出忙与松的变化？只听声音，是否有从挤到开阔的方向？产品结构和使用方式是否可信？干湿状态切换是否有时间跳跃？最终收尾是否能清楚承载字标？<\/p>\n<p>如果观众只看到一位“表演放松”的模特，先减少结尾动作，而不是继续加强微表情。如果中段像实验室特效，把材料变化收回正常洗护尺度。若画面已经足够柔和，不再给所有镜头叠梦幻辉光。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 29｜完整案例：30秒洗发水品牌片《留一点空隙》\n\n> 原创设计样稿，未进行图片、视频或配乐生成。品牌与产品设定为虚构；参考名称是制作时建立并绑定的代称，不代表附件已含这些媒体。\n\n## 任务与表达选择\n\n30秒品牌片，青绿色洗发水，茶叶与泡沫可以出现，但不必三者反复同框。体验是“忙完一天之后，终于可以把注意力还给自己”。清爽、轻快、有温度；不把产品宣传成能解决情绪或人生问题。\n\n感受稿：\n> 一整天，声音都挤在她身上。回到家，水先替她把这些声音隔远。等她再走到窗边，风并没有变大，只是她终于给它留了位置。\n\n这里“水隔远声音”落到声音设计与空间切换，不拍通知图标被水冲走；“给风留位置”落到身体放松与构图开阔，不让墙壁变形。\n\n## 三方案比较后，采用一条主线\n\n身体方案：从肩颈收紧到动作舒展。最直接，但容易被演成夸张广告笑容。\n\n材质方案：泡沫从密到薄，水纹由乱到稳。精致，但人物体验较弱。\n\n声音方案：从密集近声到水声主导，再到有间隔的音乐。最能表达“空隙”，但必须考虑静音观看。\n\n本案选择**声音作结构、身体作可见支撑、材质作中段愉悦**。静音时仍通过紧凑到开阔的取景、动作速度与停留读到变化。\n\n## 美术与连续性\n\n人物身份保持，分为回家、洗护中、洗护后三个明确状态。通过剪辑表现真实时间经过，不把湿发瞬间变干当产品效果。室内是同一居所，窗向、台面与产品位置有稳定关系。\n\n产品采用按压瓶。包装字标与结构来自已批准参考；探索阶段使用无真实品牌的占位包装，最终字标在可编辑流程中核对。茶叶只作为一处植物或材质联想，不暗示未经确认的成分与功效。\n\n## 30秒剪辑设计，不是单次生成指令\n\n| 段落 | 画面与主动作 | 声音与表达任务 | 生成时优先检查 |\n| --- | --- | --- | --- |\n| 0–4秒 | 门内侧固定中景，她进门把包放下，手仍短暂搭着包带 | 外面的车声与零碎室内声，音乐尚稀疏；“人回来了，节奏还没回来” | 放包接触、门与包的去向 |\n| 4–7秒 | 桌面近景，手机屏幕朝下落在台面，手离开 | 一声短接触后少一点信息噪声，不把手机拟人为反派 | 手机不分裂，手离开后留半拍 |\n| 7–11秒 | 水流和湿发局部，明确进入洗护时段 | 水声占前景，音乐开始有轻律动 | 水方向、头发湿态、避免不必要人体范围 |\n| 11–15秒 | 按压瓶与手掌；一次按压，少量产品落到掌心 | 泵头与液体细声，清楚但不夸大 | 泵头结构、出液位置、标签和手部 |\n| 15–20秒 | 洗护中的手与发丝局部，泡沫被缓慢带开 | 音乐略展开，水声不消失；细节带来触感 | 手与发丝、泡沫状态一致 |\n| 20–25秒 | 明确时间跳切至洗护后，她在窗边把头发拨到肩后，停着感受一会儿风 | 音乐更通透，室内声回来；不要求大笑 | 干发状态、光源连续、动作不过度展示 |\n| 25–30秒 | 产品静物，背景留空，一道轻反光经过墙面后停稳 | 配乐收束，结尾留余味；旁白可为“给今天，留一点空隙。” | 包装正确，反光不盖字标，结尾稳定 |\n\n表中秒数是编辑规划。实际按工具限制生成更适合剪取的素材，再在时间线上落实；不要强迫一段模型输出一次完成所有镜头。\n\n## 两段执行样稿\n\n### S04：产品按压，是第一风险测试\n\n先准备结构清楚的瓶身和泵头参考、可继续动作的局部首帧。\n\n```text\n保留首帧的按压瓶、台面和双手位置。右手食指完成一次平稳按压，少量产品从出液口落入下方左手掌心；松开后泵头回到起始高度。镜头固定，能看清泵头、出液口和手掌的关系。光线清楚柔和，玻璃与塑料结构保持真实，不突出夸张飞溅。\n```\n\n如果接触持续不稳，改成“泵头近景”和“掌心已有产品”两个镜头，用声音连接。承认剪辑省略，不宣称获得了完美连续按压。\n\n### S06：舒展不是摆出开心\n\n```text\n以洗护后干发首帧开始。她站在窗边，把落在脸侧的一缕头发拨到肩后，手自然落下，之后不再忙着做下一件事。窗边微风只带动少量发梢。摄影机安静留在原处，人物一侧有干净的空间。她的状态轻松、清醒，不需要对镜头微笑，也不刻意闭眼陶醉。\n```\n\n开篇已经展示她忙碌，结尾不必又用旁白解释“她终于放松了”。\n\n## 音乐说明与实际节拍\n\n目标律动约118BPM，轻而有弹性的低音、清亮短音与稀疏打击乐；中段更展开，结尾减少声部。开头不直接铺满旋律，给门、包和手机接触留位置。声音稿可以使用[音乐章节](/craft/07-sound-music.md)的结构。\n\n118BPM下，每拍约0.51秒，30秒约59拍。这是按目标速度计算的编辑参考，不意味着生成音频精确符合。不要为了整齐把所有切点放在重拍；按压与手机接触可以落在拍间，让动作不像示范操。\n\n## 最小制作顺序\n\n先试泵头接触、湿发泡沫这两个高风险细节；再试结尾的轻松状态；选定音乐方向后排粗剪；最后补开篇与产品静帧。声音先行不意味着画面无权改变节奏，二者需要互相调整。\n\n## 验收与替代路线\n\n去掉音乐后，是否仍能看出忙与松的变化？只听声音，是否有从挤到开阔的方向？产品结构和使用方式是否可信？干湿状态切换是否有时间跳跃？最终收尾是否能清楚承载字标？\n\n如果观众只看到一位“表演放松”的模特，先减少结尾动作，而不是继续加强微表情。如果中段像实验室特效，把材料变化收回正常洗护尺度。若画面已经足够柔和，不再给所有镜头叠梦幻辉光。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"cases-01-brand-film-section-0","title":"任务与表达选择"},{"id":"cases-01-brand-film-section-1","title":"三方案比较后，采用一条主线"},{"id":"cases-01-brand-film-section-2","title":"美术与连续性"},{"id":"cases-01-brand-film-section-3","title":"30秒剪辑设计，不是单次生成指令"},{"id":"cases-01-brand-film-section-4","title":"两段执行样稿"},{"id":"cases-01-brand-film-section-7","title":"音乐说明与实际节拍"},{"id":"cases-01-brand-film-section-8","title":"最小制作顺序"},{"id":"cases-01-brand-film-section-9","title":"验收与替代路线"}]},{"id":"cases/02-relationship","path":"cases/02-relationship.md","title":"30｜完整案例：餐桌上，一句没有被问完的话","description":"用普通台词、物件与听者反应表现关系；同时提供直接表达的替代方案。","type":"CaseStudy","group":"cases","tags":["完整案例","关系","对白","表演"],"html":"<h1>30｜完整案例：餐桌上，一句没有被问完的话<\/h1>\n<blockquote>\n<p>原创设计样稿，未生成或试听；A、B为虚构人物，所述参考需在实际制作时建立。<\/p>\n<\/blockquote>\n<h2 id=\"cases-02-relationship-section-0\">任务<\/h2>\n<p>约12秒的关系片段。两人已经吃完饭，A想知道B明天会不会再来，却不想把问题问得像要求。不是悬疑，不需要观众猜出复杂身世。<\/p>\n<p>感受稿：<\/p>\n<blockquote>\n<p>这张桌子已经收拾得差不多了，只有那个问题还没找到地方放。<\/p>\n<\/blockquote>\n<h2 id=\"cases-02-relationship-section-1\">把感受落到动作<\/h2>\n<p>不生成真的“问题物件”。A正在收餐具，收走自己的杯子时，看见B的杯子仍在手边。她没有立即收走它，借一个生活话题继续留住对话。<\/p>\n<p>台词：\nA：“这茶……你喝得惯吗？”\nB：“挺好。明天我再带点别的来。”<\/p>\n<p>这不是通用潜台词技巧。B直接回答了A未说出口的事，使观众不必一直猜。A的反应只需让手从待收杯子的动作里退回。<\/p>\n<h2 id=\"cases-02-relationship-section-2\">镜头方案<\/h2>\n<p>固定双人中景，桌面与双方的手可见，观众不必来回寻找谁在说话。A在桌子近侧，B在远侧偏右，门口不作为重点。灯光温和，但桌面不一片发亮。<\/p>\n<p>前段A收杯，问茶；中段B说下一次来；末段A把刚抬起的杯垫放回B杯子旁，笑意可以明显一点，不必只给眼角0.1秒。<\/p>\n<h2 id=\"cases-02-relationship-section-3\">执行稿<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">同一餐桌、同一人物和造型，固定双人中景，保留桌面与双方手部。A正在收拾餐具，抬起自己的杯子后看向B的茶杯，问：“这茶……你喝得惯吗？”她问得随意一点，不把期待演成紧张。B自然接话：“挺好。明天我再带点别的来。”听到“明天”，A原本要收杯垫的手停一下，把杯垫放回原处，抬头笑了。两人不用持续看摄影机。片段结束时，B的茶杯仍在桌上。\n<\/code><\/pre>\n<p>对白按实际朗读速度先试，12秒是目标，不以省略号保证停顿。原生音画不稳时，先定音频再做画面或适当拆镜。<\/p>\n<h2 id=\"cases-02-relationship-section-4\">直接表达也可以成立<\/h2>\n<p>另一个版本：\nA：“你明天还来吗？”\nB：“来。”<\/p>\n<p>动作保持同一日常任务，只让A问出口时终于看向B。这个版本更直接、更明亮，不比潜台词版低级。用户关系、影片节奏或短视频时长可能更适合它。<\/p>\n<h2 id=\"cases-02-relationship-section-5\">失败诊断<\/h2>\n<p>如果像表演课示范：去掉过多停顿和隐忍，让收拾动作更普通。<\/p>\n<p>如果关系完全没读出来：别继续缩小表情；让B的“明天”清楚，让A的动作改变能被看见，必要时用更直接的台词版。<\/p>\n<p>如果手物接触乱：减少收杯，只保留把杯垫推近一次。关键是留下座位般的关系，不是完成一套家务流程。<\/p>\n<h2 id=\"cases-02-relationship-section-6\">这一案可以迁移什么<\/h2>\n<p>一句话的意义来自对谁说、在什么任务里说、对方怎样接。普通物件可以承托情绪，但不必被解释成象征。方法链接：<a href=\"#/craft/01-acting\">表演<\/a>、<a href=\"#/craft/02-dialogue-voice\">台词与声音<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 30｜完整案例：餐桌上，一句没有被问完的话\n\n> 原创设计样稿，未生成或试听；A、B为虚构人物，所述参考需在实际制作时建立。\n\n## 任务\n\n约12秒的关系片段。两人已经吃完饭，A想知道B明天会不会再来，却不想把问题问得像要求。不是悬疑，不需要观众猜出复杂身世。\n\n感受稿：\n> 这张桌子已经收拾得差不多了，只有那个问题还没找到地方放。\n\n## 把感受落到动作\n\n不生成真的“问题物件”。A正在收餐具，收走自己的杯子时，看见B的杯子仍在手边。她没有立即收走它，借一个生活话题继续留住对话。\n\n台词：\nA：“这茶……你喝得惯吗？”\nB：“挺好。明天我再带点别的来。”\n\n这不是通用潜台词技巧。B直接回答了A未说出口的事，使观众不必一直猜。A的反应只需让手从待收杯子的动作里退回。\n\n## 镜头方案\n\n固定双人中景，桌面与双方的手可见，观众不必来回寻找谁在说话。A在桌子近侧，B在远侧偏右，门口不作为重点。灯光温和，但桌面不一片发亮。\n\n前段A收杯，问茶；中段B说下一次来；末段A把刚抬起的杯垫放回B杯子旁，笑意可以明显一点，不必只给眼角0.1秒。\n\n## 执行稿\n\n```text\n同一餐桌、同一人物和造型，固定双人中景，保留桌面与双方手部。A正在收拾餐具，抬起自己的杯子后看向B的茶杯，问：“这茶……你喝得惯吗？”她问得随意一点，不把期待演成紧张。B自然接话：“挺好。明天我再带点别的来。”听到“明天”，A原本要收杯垫的手停一下，把杯垫放回原处，抬头笑了。两人不用持续看摄影机。片段结束时，B的茶杯仍在桌上。\n```\n\n对白按实际朗读速度先试，12秒是目标，不以省略号保证停顿。原生音画不稳时，先定音频再做画面或适当拆镜。\n\n## 直接表达也可以成立\n\n另一个版本：\nA：“你明天还来吗？”\nB：“来。”\n\n动作保持同一日常任务，只让A问出口时终于看向B。这个版本更直接、更明亮，不比潜台词版低级。用户关系、影片节奏或短视频时长可能更适合它。\n\n## 失败诊断\n\n如果像表演课示范：去掉过多停顿和隐忍，让收拾动作更普通。\n\n如果关系完全没读出来：别继续缩小表情；让B的“明天”清楚，让A的动作改变能被看见，必要时用更直接的台词版。\n\n如果手物接触乱：减少收杯，只保留把杯垫推近一次。关键是留下座位般的关系，不是完成一套家务流程。\n\n## 这一案可以迁移什么\n\n一句话的意义来自对谁说、在什么任务里说、对方怎样接。普通物件可以承托情绪，但不必被解释成象征。方法链接：[表演](/craft/01-acting.md)、[台词与声音](/craft/02-dialogue-voice.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"cases-02-relationship-section-0","title":"任务"},{"id":"cases-02-relationship-section-1","title":"把感受落到动作"},{"id":"cases-02-relationship-section-2","title":"镜头方案"},{"id":"cases-02-relationship-section-3","title":"执行稿"},{"id":"cases-02-relationship-section-4","title":"直接表达也可以成立"},{"id":"cases-02-relationship-section-5","title":"失败诊断"},{"id":"cases-02-relationship-section-6","title":"这一案可以迁移什么"}]},{"id":"cases/03-big-emotion","path":"cases/03-big-emotion.md","title":"31｜完整案例：喜悦真的可以冲出来","description":"用强动作与真实接触表现外放情绪，纠正“自然就是克制”的偏见。","type":"CaseStudy","group":"cases","tags":["完整案例","喜悦","强情绪","动作"],"html":"<h1>31｜完整案例：喜悦真的可以冲出来<\/h1>\n<blockquote>\n<p>原创设计样稿，未生成；用于说明表演设计，不是已验证的模型配方。<\/p>\n<\/blockquote>\n<h2 id=\"cases-03-big-emotion-section-0\">任务与感受<\/h2>\n<p>8–10秒，一位成年演员在排练室看见自己的入选消息。我们要的是毫不掩饰的喜悦，不是“努力显得高级”的小笑。<\/p>\n<p>感受稿：<\/p>\n<blockquote>\n<p>好消息像突然打开的汽水。不是所有东西一起飞起来，而是那一下压力终于有了出口。<\/p>\n<\/blockquote>\n<p>转译时不必出现汽水。借用的是“积压—冲出—回落”，把结构放在起身、笑声与跑向伙伴上。<\/p>\n<h2 id=\"cases-03-big-emotion-section-1\">先设计动作，再补自然收尾<\/h2>\n<p>她原本坐着看手机，确认后迅速站起，第一句“成了！”几乎笑着喊出来。她朝伙伴迈出两步，伙伴已经张开手，二人拥抱。到接触前她收一点速度，抱住后仍轻轻晃了一下，笑声才慢下来。<\/p>\n<p>喜悦不是全程高速。<strong>加速让它冲出来，接触和收尾让它回到身体里。<\/strong><\/p>\n<h2 id=\"cases-03-big-emotion-section-2\">两种机位，表达不同<\/h2>\n<p>固定稍宽中景：观众见证事情发生，身体与拥抱关系最清楚；不追她，可让伙伴进入画面接住动作。<\/p>\n<p>轻跟随中景：摄影机随起身略微抬高，跟上两步后停稳。更加参与，但要避免摄影机速度盖掉动作。<\/p>\n<p>本案先选固定机位，减少同时变化。不是固定机位更高级，而是这次演员已经足够有能量。<\/p>\n<h2 id=\"cases-03-big-emotion-section-3\">执行稿<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">排练室内固定稍宽中景，两位成年角色均在可见范围。A坐在左侧凳上看手机，B在她右前方不远处整理衣物。A确认消息后突然抬头，笑着说“成了！”，迅速站起来朝B走两步。B听见后转身张开双臂，A在靠近时收住速度，二人自然拥抱。手机始终由A握在右手并避开B的背部，不凭空消失。笑声热烈、真实，可以打断一句没说完的话；不要求低头、压住笑或立刻恢复平静。\n<\/code><\/pre>\n<p>若手机让拥抱动作不稳，可以在起身前加“把手机放到身旁凳面”，并确保时长允许。不要同时要求手机在手和双手完整环抱。<\/p>\n<h2 id=\"cases-03-big-emotion-section-4\">声音设计<\/h2>\n<p>“成了”是片中A的对白，不是旁白。环境保留鞋底与衣物声音；音乐可以到拥抱时再进入，也可以不进入，让笑声承担情绪。不要把大笑统一处理成尖叫，不要用胜利铜管替代人物的快乐。<\/p>\n<h2 id=\"cases-03-big-emotion-section-5\">外放愤怒的迁移版本<\/h2>\n<p>不是把快乐换成“愤怒”二字。重新确定目标：人物要打断某个伤人的判断。主动作可以是站起并把椅子推开一点，台词明确，听者被迫停下。不要随意加砸东西与暴力；爆发幅度取决于故事。<\/p>\n<h2 id=\"cases-03-big-emotion-section-6\">验收<\/h2>\n<p>是否读到“终于实现”，而不仅是无缘无故跳跃？两人的接触是否有预备与回应？声音是否像A在说？手机或衣物是否无故变形？摄像机是否把最重要的抱住时刻留在画内？<\/p>\n<p>若成片过于客套，允许表情更大、笑声更开放，不要再追加“克制”。若成片过于混乱，减少同时任务，不必先削弱喜悦本身。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 31｜完整案例：喜悦真的可以冲出来\n\n> 原创设计样稿，未生成；用于说明表演设计，不是已验证的模型配方。\n\n## 任务与感受\n\n8–10秒，一位成年演员在排练室看见自己的入选消息。我们要的是毫不掩饰的喜悦，不是“努力显得高级”的小笑。\n\n感受稿：\n> 好消息像突然打开的汽水。不是所有东西一起飞起来，而是那一下压力终于有了出口。\n\n转译时不必出现汽水。借用的是“积压—冲出—回落”，把结构放在起身、笑声与跑向伙伴上。\n\n## 先设计动作，再补自然收尾\n\n她原本坐着看手机，确认后迅速站起，第一句“成了！”几乎笑着喊出来。她朝伙伴迈出两步，伙伴已经张开手，二人拥抱。到接触前她收一点速度，抱住后仍轻轻晃了一下，笑声才慢下来。\n\n喜悦不是全程高速。**加速让它冲出来，接触和收尾让它回到身体里。**\n\n## 两种机位，
