表达不同\n\n固定稍宽中景：观众见证事情发生，身体与拥抱关系最清楚；不追她，可让伙伴进入画面接住动作。\n\n轻跟随中景：摄影机随起身略微抬高，跟上两步后停稳。更加参与，但要避免摄影机速度盖掉动作。\n\n本案先选固定机位，减少同时变化。不是固定机位更高级，而是这次演员已经足够有能量。\n\n## 执行稿\n\n```text\n排练室内固定稍宽中景，两位成年角色均在可见范围。A坐在左侧凳上看手机，B在她右前方不远处整理衣物。A确认消息后突然抬头，笑着说“成了！”，迅速站起来朝B走两步。B听见后转身张开双臂，A在靠近时收住速度，二人自然拥抱。手机始终由A握在右手并避开B的背部，不凭空消失。笑声热烈、真实，可以打断一句没说完的话；不要求低头、压住笑或立刻恢复平静。\n```\n\n若手机让拥抱动作不稳，可以在起身前加“把手机放到身旁凳面”，并确保时长允许。不要同时要求手机在手和双手完整环抱。\n\n## 声音设计\n\n“成了”是片中A的对白，不是旁白。环境保留鞋底与衣物声音；音乐可以到拥抱时再进入，也可以不进入，让笑声承担情绪。不要把大笑统一处理成尖叫，不要用胜利铜管替代人物的快乐。\n\n## 外放愤怒的迁移版本\n\n不是把快乐换成“愤怒”二字。重新确定目标：人物要打断某个伤人的判断。主动作可以是站起并把椅子推开一点，台词明确，听者被迫停下。不要随意加砸东西与暴力；爆发幅度取决于故事。\n\n## 验收\n\n是否读到“终于实现”，而不仅是无缘无故跳跃？两人的接触是否有预备与回应？声音是否像A在说？手机或衣物是否无故变形？摄像机是否把最重要的抱住时刻留在画内？\n\n若成片过于客套，允许表情更大、笑声更开放，不要再追加“克制”。若成片过于混乱，减少同时任务，不必先削弱喜悦本身。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"cases-03-big-emotion-section-0","title":"任务与感受"},{"id":"cases-03-big-emotion-section-1","title":"先设计动作，再补自然收尾"},{"id":"cases-03-big-emotion-section-2","title":"两种机位，表达不同"},{"id":"cases-03-big-emotion-section-3","title":"执行稿"},{"id":"cases-03-big-emotion-section-4","title":"声音设计"},{"id":"cases-03-big-emotion-section-5","title":"外放愤怒的迁移版本"},{"id":"cases-03-big-emotion-section-6","title":"验收"}]},{"id":"cases/04-vlog","path":"cases/04-vlog.md","title":"32｜完整案例：谁在拍谁——12秒咖啡馆Vlog","description":"用拍摄视点、手部占用和转场保持生活感，而非靠统一晃动滤镜。","type":"CaseStudy","group":"cases","tags":["完整案例","Vlog","视点","道具"],"html":"<h1>32｜完整案例：谁在拍谁——12秒咖啡馆Vlog<\/h1>\n<blockquote>\n<p>原创设计样稿，未生成；手机与角色参考需要真实绑定，镜头表是剪辑规划。<\/p>\n<\/blockquote>\n<h2 id=\"cases-04-vlog-section-0\">任务<\/h2>\n<p>成年女主在咖啡馆门口到坐下的短Vlog。轻快、普通、有生活气，不需要专业广告式完整展示。全片用同一手机拍摄，但允许一次明确放上桌面支架。<\/p>\n<p>感受稿：<\/p>\n<blockquote>\n<p>她不是来给观众介绍一家店，只是把今天觉得好的一小段，顺手留了下来。<\/p>\n<\/blockquote>\n<h2 id=\"cases-04-vlog-section-1\">先承认摄影机是一个物件<\/h2>\n<p>自拍时，手机由女主右手持有，左手可整理头发。切到后摄后，画面可以看到她的左手推门，但不能同时从店内远处看见她全身入场。需要第三人视角就说明第三人；本案不添加。<\/p>\n<h2 id=\"cases-04-vlog-section-2\">四个镜头<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>谁在拍、朝哪拍<\/th>\n<th>人物与道具任务<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–3秒<\/td>\n<td>右手前摄自拍，手臂距离，步行轻微起伏<\/td>\n<td>女主走到门口，左手拨开挡脸发丝<\/td>\n<\/tr>\n<tr>\n<td>3–6秒<\/td>\n<td>切后摄看门与室内，右手仍持机<\/td>\n<td>左手推门；手机不过门就突然飞到屋内<\/td>\n<\/tr>\n<tr>\n<td>6–8秒<\/td>\n<td>后摄看桌面，表现已经找到座位的时间省略<\/td>\n<td>桌上是一杯咖啡与小支架，拍摄者还未喝咖啡<\/td>\n<\/tr>\n<tr>\n<td>8–12秒<\/td>\n<td>手机已放到桌面支架，使用前摄，固定略仰中近景<\/td>\n<td>女主坐在桌边，右手取杯，尝一口后看向窗外<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>第三到第四镜之间用明确切镜省略架机过程，不要求镜头无缝变成第三人拍摄。手机上架后不再添加手持起伏。<\/p>\n<h2 id=\"cases-04-vlog-section-3\">两条执行样稿<\/h2>\n<p>后摄推门：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">手机后置视角，镜头由人物右手持有，朝向面前的木门。她的左手从画面左下进入，压下门把手，推门后摄影机随着她走过门口。室内光线柔和，木门框短暂经过近处；保留小幅走路起伏，画面不跳到店内另一个摄影机位置。\n<\/code><\/pre>\n<p>桌面固定自拍：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">手机已固定在桌面小支架上，前置镜头略向上，画面是女主胸部以上和杯子上缘。她用右手拿起桌上的咖啡杯尝一口，放回原位，然后看向窗外，像发现了街上的一点动静。镜头固定，人物不持续对镜头介绍或摆出标准微笑。\n<\/code><\/pre>\n<h2 id=\"cases-04-vlog-section-4\">身份与场景怎样引用<\/h2>\n<p>人物只采用当前一套发型、服装与包；不要把教程中不同造型示例合并进同一角色。场景参考须是同一家店的相容角度；咖啡杯数量、门向与座位靠窗关系保持。<\/p>\n<p>普通场景可以来自自有实拍或一致的生成场景。生活感不是iPhone品牌独占，也不以未经确认的网上照片作为默认可商用素材。<\/p>\n<h2 id=\"cases-04-vlog-section-5\">声音与剪辑<\/h2>\n<p>门把、门轴、店内人声、杯子接触桌面提供生活线索。配乐可轻，但不要盖住所有近处动作。自拍和后摄的切换不必每次加夸张转场声；相同声音底可以让空间连起来。<\/p>\n<h2 id=\"cases-04-vlog-section-6\">验收与失败修复<\/h2>\n<p>能否解释每个镜头的摄影机在哪里？女主是否有多余的手？手机固定后是否仍像有人拿着晃？室内空间是否偷偷换了店？<\/p>\n<p>若素材很好看却像一支第三人拍摄的广告，不只换成“iPhone质感”四字；先重新约束视点与可见范围。延伸见<a href=\"#/craft/04-camera-attention\">镜头<\/a>和<a href=\"#/craft/03-action-blocking\">动作与手位<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 32｜完整案例：谁在拍谁——12秒咖啡馆Vlog\n\n> 原创设计样稿，未生成；手机与角色参考需要真实绑定，镜头表是剪辑规划。\n\n## 任务\n\n成年女主在咖啡馆门口到坐下的短Vlog。轻快、普通、有生活气，不需要专业广告式完整展示。全片用同一手机拍摄，但允许一次明确放上桌面支架。\n\n感受稿：\n> 她不是来给观众介绍一家店，只是把今天觉得好的一小段，顺手留了下来。\n\n## 先承认摄影机是一个物件\n\n自拍时，手机由女主右手持有，左手可整理头发。切到后摄后，画面可以看到她的左手推门，但不能同时从店内远处看见她全身入场。需要第三人视角就说明第三人；本案不添加。\n\n## 四个镜头\n\n| 时间 | 谁在拍、朝哪拍 | 人物与道具任务 |\n| --- | --- | --- |\n| 0–3秒 | 右手前摄自拍，手臂距离，步行轻微起伏 | 女主走到门口，左手拨开挡脸发丝 |\n| 3–6秒 | 切后摄看门与室内，右手仍持机 | 左手推门；手机不过门就突然飞到屋内 |\n| 6–8秒 | 后摄看桌面，表现已经找到座位的时间省略 | 桌上是一杯咖啡与小支架，拍摄者还未喝咖啡 |\n| 8–12秒 | 手机已放到桌面支架，使用前摄，固定略仰中近景 | 女主坐在桌边，右手取杯，尝一口后看向窗外 |\n\n第三到第四镜之间用明确切镜省略架机过程，不要求镜头无缝变成第三人拍摄。手机上架后不再添加手持起伏。\n\n## 两条执行样稿\n\n后摄推门：\n```text\n手机后置视角，镜头由人物右手持有，朝向面前的木门。她的左手从画面左下进入，压下门把手，推门后摄影机随着她走过门口。室内光线柔和，木门框短暂经过近处；保留小幅走路起伏，画面不跳到店内另一个摄影机位置。\n```\n\n桌面固定自拍：\n```text\n手机已固定在桌面小支架上，前置镜头略向上，画面是女主胸部以上和杯子上缘。她用右手拿起桌上的咖啡杯尝一口，放回原位，然后看向窗外，像发现了街上的一点动静。镜头固定，人物不持续对镜头介绍或摆出标准微笑。\n```\n\n## 身份与场景怎样引用\n\n人物只采用当前一套发型、服装与包；不要把教程中不同造型示例合并进同一角色。场景参考须是同一家店的相容角度；咖啡杯数量、门向与座位靠窗关系保持。\n\n普通场景可以来自自有实拍或一致的生成场景。生活感不是iPhone品牌独占，也不以未经确认的网上照片作为默认可商用素材。\n\n## 声音与剪辑\n\n门把、门轴、店内人声、杯子接触桌面提供生活线索。配乐可轻，但不要盖住所有近处动作。自拍和后摄的切换不必每次加夸张转场声；相同声音底可以让空间连起来。\n\n## 验收与失败修复\n\n能否解释每个镜头的摄影机在哪里？女主是否有多余的手？手机固定后是否仍像有人拿着晃？室内空间是否偷偷换了店？\n\n若素材很好看却像一支第三人拍摄的广告，不只换成“iPhone质感”四字；先重新约束视点与可见范围。延伸见[镜头](/craft/04-camera-attention.md)和[动作与手位](/craft/03-action-blocking.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"cases-04-vlog-section-0","title":"任务"},{"id":"cases-04-vlog-section-1","title":"先承认摄影机是一个物件"},{"id":"cases-04-vlog-section-2","title":"四个镜头"},{"id":"cases-04-vlog-section-3","title":"两条执行样稿"},{"id":"cases-04-vlog-section-4","title":"身份与场景怎样引用"},{"id":"cases-04-vlog-section-5","title":"声音与剪辑"},{"id":"cases-04-vlog-section-6","title":"验收与失败修复"}]},{"id":"cases/05-empty-corridor","path":"cases/05-empty-corridor.md","title":"33｜完整案例：空走廊为什么会让人等下去","description":"不用人物脸部与重型音乐，靠听觉、遮挡与延迟组织悬念。","type":"CaseStudy","group":"cases","tags":["完整案例","悬疑","声音","空镜"],"html":"<h1>33｜完整案例：空走廊为什么会让人等下去<\/h1>\n<blockquote>\n<p>原创设计样稿，未生成。以下是悬疑创作设定，不是对真实地点或事件的判断。<\/p>\n<\/blockquote>\n<h2 id=\"cases-05-empty-corridor-section-0\">任务<\/h2>\n<p>约10秒的空走廊，观众感到“有事将发生”，但此时还不知道是什么。不是尽量吓人，而是让注意力逐渐集中到同一扇门。<\/p>\n<p>感受稿：<\/p>\n<blockquote>\n<p>走廊不是空的，只是我们还没看见它在等谁。<\/p>\n<\/blockquote>\n<p>这句话留给创作说明；执行稿不能只写“诡异气氛”。要选择具体的线索。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-1\">画面与声音分工<\/h2>\n<p>画面：正常住宅走廊，固定平视，一扇半掩的门位于远端偏左，门缝里有一块较亮的室内光。不要把全屋变成恐怖片蓝色，也不需要地面大量水迹。<\/p>\n<p>声音：开始有普通电器底声；远处出现椅脚拖动的一声；接着两下脚步靠近那扇门，然后停住。镜头仍不动，门也没有马上打开。<\/p>\n<p>悬念来自<strong>声音提供行动，画面暂不提供解释<\/strong>。声源属于门后空间，不是旁白，也不在画面里新增人物。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-2\">执行说明<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">固定平视镜头看向住宅走廊深处，保留首帧的门、墙面与光线。远端偏左的门一直半掩，门缝透出稳定室内光。画面大部分保持不动，不出现走动的人。门后先传来一次椅脚轻拖声，随后是两步接近门口的脚步声，然后安静下来。门没有打开，摄影机不推进、不变焦。保持普通生活空间的质感，让等待来自声音发生之后画面没有立刻回应。\n<\/code><\/pre>\n<p>若工具偏好正向运动说明，可把末尾整理为“摄影机固定，门保持半掩”。若它不支持独立可靠的音效时序，先生成画面，再按时间线设计声音，不假称一次完成。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-3\">为什么不同时加闪灯、风、低频与鬼影<\/h2>\n<p>那会把一个清楚的问题变成多个刺激：究竟该注意门、灯还是阴影？本案需要的是单一等待，不是信息轰炸。另一个更外放的恐怖片方案可以使用强刺激，但应重新定义目标。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-4\">一个同画面不同情绪的对照<\/h2>\n<p>门后换成熟人笑声、碗筷碰撞与一句“马上好”，同一条走廊可以变成等待开饭。画面不必变暖橙，情境就已改变。<\/p>\n<p>这个对照适合作为练习：不要只问“哪个更电影感”，而问观众在等待什么、哪一声音改变了理解。它说明声音如何改变读法，不证明某一声音必然产生某种情绪。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-5\">验收<\/h2>\n<p>不了解说明的观众，是否把注意力放在目标门而不是其他背景细节？脚步是否有空间归属？画面不动是否仍有等待，而非单纯乏味？结尾是否停在“尚未回应”，而不是生成器自行把门打开？<\/p>\n<p>不够清楚，先改善声源距离与发生顺序；过于恐怖，先收回声压与强烈配乐；静音渠道则需要另设计可见线索，不宣称声音方案静音也同样成立。<\/p>\n<p>相关方法：<a href=\"#/craft/07-sound-music\">声场<\/a>、<a href=\"#/craft/04-camera-attention\">观看与注意<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 33｜完整案例：空走廊为什么会让人等下去\n\n> 原创设计样稿，未生成。以下是悬疑创作设定，不是对真实地点或事件的判断。\n\n## 任务\n\n约10秒的空走廊，观众感到“有事将发生”，但此时还不知道是什么。不是尽量吓人，而是让注意力逐渐集中到同一扇门。\n\n感受稿：\n> 走廊不是空的，只是我们还没看见它在等谁。\n\n这句话留给创作说明；执行稿不能只写“诡异气氛”。要选择具体的线索。\n\n## 画面与声音分工\n\n画面：正常住宅走廊，固定平视，一扇半掩的门位于远端偏左，门缝里有一块较亮的室内光。不要把全屋变成恐怖片蓝色，也不需要地面大量水迹。\n\n声音：开始有普通电器底声；远处出现椅脚拖动的一声；接着两下脚步靠近那扇门，然后停住。镜头仍不动，门也没有马上打开。\n\n悬念来自**声音提供行动，画面暂不提供解释**。声源属于门后空间，不是旁白，也不在画面里新增人物。\n\n## 执行说明\n\n```text\n固定平视镜头看向住宅走廊深处，保留首帧的门、墙面与光线。远端偏左的门一直半掩，门缝透出稳定室内光。画面大部分保持不动，不出现走动的人。门后先传来一次椅脚轻拖声，随后是两步接近门口的脚步声，然后安静下来。门没有打开，摄影机不推进、不变焦。保持普通生活空间的质感，让等待来自声音发生之后画面没有立刻回应。\n```\n\n若工具偏好正向运动说明，可把末尾整理为“摄影机固定，门保持半掩”。若它不支持独立可靠的音效时序，先生成画面，再按时间线设计声音，不假称一次完成。\n\n## 为什么不同时加闪灯、风、低频与鬼影\n\n那会把一个清楚的问题变成多个刺激：究竟该注意门、灯还是阴影？本案需要的是单一等待，不是信息轰炸。另一个更外放的恐怖片方案可以使用强刺激，但应重新定义目标。\n\n## 一个同画面不同情绪的对照\n\n门后换成熟人笑声、碗筷碰撞与一句“马上好”，同一条走廊可以变成等待开饭。画面不必变暖橙，情境就已改变。\n\n这个对照适合作为练习：不要只问“哪个更电影感”，而问观众在等待什么、哪一声音改变了理解。它说明声音如何改变读法，不证明某一声音必然产生某种情绪。\n\n## 验收\n\n不了解说明的观众，是否把注意力放在目标门而不是其他背景细节？脚步是否有空间归属？画面不动是否仍有等待，而非单纯乏味？结尾是否停在“尚未回应”，而不是生成器自行把门打开？\n\n不够清楚，先改善声源距离与发生顺序；过于恐怖，先收回声压与强烈配乐；静音渠道则需要另设计可见线索，不宣称声音方案静音也同样成立。\n\n相关方法：[声场](/craft/07-sound-music.md)、[观看与注意](/craft/04-camera-attention.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"cases-05-empty-corridor-section-0","title":"任务"},{"id":"cases-05-empty-corridor-section-1","title":"画面与声音分工"},{"id":"cases-05-empty-corridor-section-2","title":"执行说明"},{"id":"cases-05-empty-corridor-section-3","title":"为什么不同时加闪灯、风、低频与鬼影"},{"id":"cases-05-empty-corridor-section-4","title":"一个同画面不同情绪的对照"},{"id":"cases-05-empty-corridor-section-5","title":"验收"}]},{"id":"cases/06-surreal-perfume","path":"cases/06-surreal-perfume.md","title":"34｜完整案例：不追求实拍的香水图与短动效","description":"把风格化视作自己的世界规则，而不是不够真实的失败品。","type":"CaseStudy","group":"cases","tags":["完整案例","香水","超现实","主视觉"],"html":"<h1>34｜完整案例：不追求实拍的香水图与短动效<\/h1>\n<blockquote>\n<p>原创设计样稿，未生成；产品虚构，品牌字标在后期加入，参考代称需实际建立。<\/p>\n<\/blockquote>\n<h2 id=\"cases-06-surreal-perfume-section-0\">任务<\/h2>\n<p>一张主视觉与约6秒动效。香水关键词是“轻盈但不脆弱”。不追求生活实拍，而是平面构成与超现实材质的混合。<\/p>\n<p>感受稿：<\/p>\n<blockquote>\n<p>它像一封没有封口的信，风可以进去，但不会把里面的东西带走。<\/p>\n<\/blockquote>\n<p>不直接画信。提取关系：开放、轻薄、仍有稳定边界。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-1\">世界规则<\/h2>\n<p>背景是浅暖灰的平面空间，产品有清楚体积；一条半透明薄带绕着瓶子形成不闭合的弧，不接触瓶身；薄带可以悬浮，但不变成烟，不穿过产品。瓶子本身始终稳定。<\/p>\n<p>“悬浮”是明确的艺术设定。其余接触、遮挡与轮廓仍保持一致，观众才容易接受这个世界。不是必须像现实，而是不能每秒换规则。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-2\">静态主视觉提示<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">一张留白充足的香水主视觉。虚构的透明方形香水瓶位于画面右下，比例清楚，玻璃边缘干净而不刺眼。浅暖灰背景上，一条很薄的半透明丝带围绕瓶子形成不闭合的弧，留出宽松的入口。丝带轻盈悬浮，但保持可辨认的带状结构，不化成烟雾，也不覆盖瓶身正面。整体由安静的平面构成与少量精确体积组成，轻但不脆弱。左上留出完整标题区，不生成文字。\n<\/code><\/pre>\n<p>具体瓶型若已有批准参考，以参考为准；探索稿里的“方形”不能替换客户真实瓶型。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-3\">动效提示<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">保留主视觉的产品、构图和背景。半透明薄带的自由端轻轻抬起，沿原有弧线移动一点，再缓慢停稳；整个过程仍是同一条薄带，开口不闭合，不缠住瓶子。产品保持静止，摄影机固定。只有薄带的变化与玻璃上的细小反光呼应，节奏轻而有余量。\n<\/code><\/pre>\n<p>声音可选很轻的短音与一段柔和延续，不必使用真实丝带摩擦声。静态海报版也完全成立，不为动而动。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-4\">风格融合的分工<\/h2>\n<p>平面设计提供构图与留白；产品摄影逻辑提供瓶身结构与反光；超现实只提供薄带悬浮这一条偏离。三种来源各管一层，避免“每一处同时融合三种风格”。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-5\">最先试什么<\/h2>\n<p>先测试薄带能否保持拓扑与开口；若不能，退回二维曲线动画或分层合成。图像生成负责主视觉，后期负责可控运动，也是一条完整的当代流程，不是创意失败。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-6\">验收与反例<\/h2>\n<p>瓶子是否仍是唯一产品中心？开口是否被误闭合？薄带是否穿进玻璃？留白能否放字？动效是否比静态带来新增感受？<\/p>\n<p>不要因为它不够像手机实拍就判失败。也不要因为它“梦幻”就接受包装结构错误。形式开放，任务仍清楚。<\/p>\n<p>延伸：<a href=\"#/craft/08-still-graphic-style\">静态与风格化<\/a>、<a href=\"#/language/01-sensory-translation\">通感转译<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 34｜完整案例：不追求实拍的香水图与短动效\n\n> 原创设计样稿，未生成；产品虚构，品牌字标在后期加入，参考代称需实际建立。\n\n## 任务\n\n一张主视觉与约6秒动效。香水关键词是“轻盈但不脆弱”。不追求生活实拍，而是平面构成与超现实材质的混合。\n\n感受稿：\n> 它像一封没有封口的信，风可以进去，但不会把里面的东西带走。\n\n不直接画信。提取关系：开放、轻薄、仍有稳定边界。\n\n## 世界规则\n\n背景是浅暖灰的平面空间，产品有清楚体积；一条半透明薄带绕着瓶子形成不闭合的弧，不接触瓶身；薄带可以悬浮，但不变成烟，不穿过产品。瓶子本身始终稳定。\n\n“悬浮”是明确的艺术设定。其余接触、遮挡与轮廓仍保持一致，观众才容易接受这个世界。不是必须像现实，而是不能每秒换规则。\n\n## 静态主视觉提示\n\n```text\n一张留白充足的香水主视觉。虚构的透明方形香水瓶位于画面右下，比例清楚，玻璃边缘干净而不刺眼。浅暖灰背景上，一条很薄的半透明丝带围绕瓶子形成不闭合的弧，留出宽松的入口。丝带轻盈悬浮，但保持可辨认的带状结构，不化成烟雾，也不覆盖瓶身正面。整体由安静的平面构成与少量精确体积组成，轻但不脆弱。左上留出完整标题区，不生成文字。\n```\n\n具体瓶型若已有批准参考，以参考为准；探索稿里的“方形”不能替换客户真实瓶型。\n\n## 动效提示\n\n```text\n保留主视觉的产品、构图和背景。半透明薄带的自由端轻轻抬起，沿原有弧线移动一点，再缓慢停稳；整个过程仍是同一条薄带，开口不闭合，不缠住瓶子。产品保持静止，摄影机固定。只有薄带的变化与玻璃上的细小反光呼应，节奏轻而有余量。\n```\n\n声音可选很轻的短音与一段柔和延续，不必使用真实丝带摩擦声。静态海报版也完全成立，不为动而动。\n\n## 风格融合的分工\n\n平面设计提供构图与留白；产品摄影逻辑提供瓶身结构与反光；超现实只提供薄带悬浮这一条偏离。三种来源各管一层，避免“每一处同时融合三种风格”。\n\n## 最先试什么\n\n先测试薄带能否保持拓扑与开口；若不能，退回二维曲线动画或分层合成。图像生成负责主视觉，后期负责可控运动，也是一条完整的当代流程，不是创意失败。\n\n## 验收与反例\n\n瓶子是否仍是唯一产品中心？开口是否被误闭合？薄带是否穿进玻璃？留白能否放字？动效是否比静态带来新增感受？\n\n不要因为它不够像手机实拍就判失败。也不要因为它“梦幻”就接受包装结构错误。形式开放，任务仍清楚。\n\n延伸：[静态与风格化](/craft/08-still-graphic-style.md)、[通感转译](/language/01-sensory-translation.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"cases-06-surreal-perfume-section-0","title":"任务"},{"id":"cases-06-surreal-perfume-section-1","title":"世界规则"},{"id":"cases-06-surreal-perfume-section-2","title":"静态主视觉提示"},{"id":"cases-06-surreal-perfume-section-3","title":"动效提示"},{"id":"cases-06-surreal-perfume-section-4","title":"风格融合的分工"},{"id":"cases-06-surreal-perfume-section-5","title":"最先试什么"},{"id":"cases-06-surreal-perfume-section-6","title":"验收与反例"}]},{"id":"cases/07-comedy","path":"cases/07-comedy.md","title":"35｜完整案例：安静自习室里的零食袋","description":"让喜剧来自目标、阻力与反应，而不是给角色加夸张表情。","type":"CaseStudy","group":"cases","tags":["完整案例","喜剧","节奏","音效"],"html":"<h1>35｜完整案例：安静自习室里的零食袋<\/h1>\n<blockquote>\n<p>原创设计样稿，未生成；场景中人物均为成年人，约12秒的剪辑方案。<\/p>\n<\/blockquote>\n<h2 id=\"cases-07-comedy-section-0\">任务与感受<\/h2>\n<p>一个人试图很安静地拆零食袋，袋子却比他预想中响。他努力维持体面，而不是做鬼脸给观众看。<\/p>\n<p>感受稿：<\/p>\n<blockquote>\n<p>他想把一件小事做得毫无存在感，那件小事却偏偏清了清嗓子。<\/p>\n<\/blockquote>\n<p>“清嗓子”不是真的给袋子配人声，而是让一次突出的包装声打断安静。<\/p>\n<h2 id=\"cases-07-comedy-section-1\">喜剧的结构<\/h2>\n<p>先让观众知道目标：他在安静房间里，小心拿出袋子。<\/p>\n<p>再出现偏差：袋子被拉开的一瞬，发出比预想清楚的脆响。<\/p>\n<p>最后让反应接住：旁边的人短暂抬眼，他停住，慢慢把袋子放低，假装继续读书；过一会，袋口自己轻响一下。<\/p>\n<p>最后那一下可由材料松弛的细声完成，不必让袋子自动爆炸、飞走或凭空出现新物件。<\/p>\n<h2 id=\"cases-07-comedy-section-2\">三个镜头的剪辑规划<\/h2>\n<p>0–4秒，固定中景：他确认周围安静，拿出袋子。目光不是不断四下扫描，只瞥一次邻座。<\/p>\n<p>4–7秒，手部近景：两手缓缓拉开包装封口，出现清楚的一声。动作确实完成，不让包装不断闭合重来。<\/p>\n<p>7–12秒，回到中景：邻座看他一下。他停住，轻轻放低袋子，把目光放回书上。结尾给一点等待，听见袋口的小响声。<\/p>\n<h2 id=\"cases-07-comedy-section-3\">执行稿：反应镜头<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">固定中景，接上一镜包装袋已经打开的状态。A双手拿着袋子，邻座B刚刚被声音吸引，抬眼看向他。A不是做鬼脸，而是停住一瞬，把袋子缓慢放到桌面下方，认真看回书页。B随后把注意力收回自己的书。房间仍很安静，动作自然，保留他们试图让这件事过去的尴尬。\n<\/code><\/pre>\n<p>若袋子放到桌下会造成连续性难题，可以放在桌边，用身体局部遮住，但下一镜仍应记住它在那里。<\/p>\n<h2 id=\"cases-07-comedy-section-4\">声音比表情更值得先试<\/h2>\n<p>把包装声调到可辨认而不刺耳，环境底维持一致。没有背景音乐也能成立；若加音乐，可在拆袋前保持稀疏，不在每次眼神变化时加入滑稽音阶。<\/p>\n<p>第二次小响是节奏回声，不一定要更大。声音越夸张越好，会让人物的克制失去对照。<\/p>\n<h2 id=\"cases-07-comedy-section-5\">验收<\/h2>\n<p>不知道提示词的人，能否理解他想安静、却被声音出卖？反应是否发生在声音之后？包装状态是否连续？有没有把A演成蓄意逗笑观众的人？<\/p>\n<p>如果不好笑，先看预期是否建立、停顿是否有用、反应是否太早，不要第一步就把表情加倍。<\/p>\n<p>可迁移结构：<strong>认真完成小任务 → 环境或材料添一点阻力 → 人物试图恢复原来的体面<\/strong>。不是所有喜剧都需要这个结构，但它很适合少人物、少场景的小片段。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 35｜完整案例：安静自习室里的零食袋\n\n> 原创设计样稿，未生成；场景中人物均为成年人，约12秒的剪辑方案。\n\n## 任务与感受\n\n一个人试图很安静地拆零食袋，袋子却比他预想中响。他努力维持体面，而不是做鬼脸给观众看。\n\n感受稿：\n> 他想把一件小事做得毫无存在感，那件小事却偏偏清了清嗓子。\n\n“清嗓子”不是真的给袋子配人声，而是让一次突出的包装声打断安静。\n\n## 喜剧的结构\n\n先让观众知道目标：他在安静房间里，小心拿出袋子。\n\n再出现偏差：袋子被拉开的一瞬，发出比预想清楚的脆响。\n\n最后让反应接住：旁边的人短暂抬眼，他停住，慢慢把袋子放低，假装继续读书；过一会，袋口自己轻响一下。\n\n最后那一下可由材料松弛的细声完成，不必让袋子自动爆炸、飞走或凭空出现新物件。\n\n## 三个镜头的剪辑规划\n\n0–4秒，固定中景：他确认周围安静，拿出袋子。目光不是不断四下扫描，只瞥一次邻座。\n\n4–7秒，手部近景：两手缓缓拉开包装封口，出现清楚的一声。动作确实完成，不让包装不断闭合重来。\n\n7–12秒，回到中景：邻座看他一下。他停住，轻轻放低袋子，把目光放回书上。结尾给一点等待，听见袋口的小响声。\n\n## 执行稿：反应镜头\n\n```text\n固定中景，接上一镜包装袋已经打开的状态。A双手拿着袋子，邻座B刚刚被声音吸引，抬眼看向他。A不是做鬼脸，而是停住一瞬，把袋子缓慢放到桌面下方，认真看回书页。B随后把注意力收回自己的书。房间仍很安静，动作自然，保留他们试图让这件事过去的尴尬。\n```\n\n若袋子放到桌下会造成连续性难题，可以放在桌边，用身体局部遮住，但下一镜仍应记住它在那里。\n\n## 声音比表情更值得先试\n\n把包装声调到可辨认而不刺耳，环境底维持一致。没有背景音乐也能成立；若加音乐，可在拆袋前保持稀疏，不在每次眼神变化时加入滑稽音阶。\n\n第二次小响是节奏回声，不一定要更大。声音越夸张越好，会让人物的克制失去对照。\n\n## 验收\n\n不知道提示词的人，能否理解他想安静、却被声音出卖？反应是否发生在声音之后？包装状态是否连续？有没有把A演成蓄意逗笑观众的人？\n\n如果不好笑，先看预期是否建立、停顿是否有用、反应是否太早，不要第一步就把表情加倍。\n\n可迁移结构：**认真完成小任务 → 环境或材料添一点阻力 → 人物试图恢复原来的体面**。不是所有喜剧都需要这个结构，但它很适合少人物、少场景的小片段。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"cases-07-comedy-section-0","title":"任务与感受"},{"id":"cases-07-comedy-section-1","title":"喜剧的结构"},{"id":"cases-07-comedy-section-2","title":"三个镜头的剪辑规划"},{"id":"cases-07-comedy-section-3","title":"执行稿：反应镜头"},{"id":"cases-07-comedy-section-4","title":"声音比表情更值得先试"},{"id":"cases-07-comedy-section-5","title":"验收"}]},{"id":"cases/08-object-exchange","path":"cases/08-object-exchange.md","title":"36｜完整案例：两份文件，谁最后拿着哪一份","description":"用状态与观看证据规划一镜到底，并提供更经济的多镜头替代。","type":"CaseStudy","group":"cases","tags":["完整案例","预演","道具","一镜到底"],"html":"<h1>36｜完整案例：两份文件，谁最后拿着哪一份<\/h1>\n<blockquote>\n<p>原创影视设计样稿，借鉴教程01的控制问题，不复原其具体剧情。未搭建或生成预演；以下距离与秒数是方案数值，不是实测结论。<\/p>\n<\/blockquote>\n<h2 id=\"cases-08-object-exchange-section-0\">任务<\/h2>\n<p>约24秒片段。A与B在大厅桌边交错，各自拿错了对方的文件。观众应看清交换结果，而人物暂时没有发现。不要让叙事成立完全依靠文件上不可读的小字。<\/p>\n<p>两份道具分别用<strong>蓝色窄边文件夹X<\/strong>与<strong>黄色宽边文件夹Y<\/strong>区分；颜色与形状是观众识别线索，不是逼迫模型理解“真”和“假”的抽象标签。<\/p>\n<h2 id=\"cases-08-object-exchange-section-1\">状态表先于相机路线<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时段<\/th>\n<th>X在哪<\/th>\n<th>Y在哪<\/th>\n<th>观众需要看懂什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>开场<\/td>\n<td>A手中<\/td>\n<td>B手中<\/td>\n<td>各人原本持有的文件不同<\/td>\n<\/tr>\n<tr>\n<td>桌边<\/td>\n<td>A把X放在桌面左侧<\/td>\n<td>B把Y放在桌面右侧<\/td>\n<td>两个物件都能追踪，不凭空生成<\/td>\n<\/tr>\n<tr>\n<td>离开前<\/td>\n<td>B拿起X<\/td>\n<td>A拿起Y<\/td>\n<td>取错的结果清楚<\/td>\n<\/tr>\n<tr>\n<td>结尾<\/td>\n<td>B带X离开<\/td>\n<td>A持Y走向门口<\/td>\n<td>交换成为下一场起点<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>不是要求观众理解复杂手法，只是看见一件意外发生。若要改成悬疑调包，需要重新定义谁故意、谁不知道、观众何时知道，不把两个版本混在一起。<\/p>\n<h2 id=\"cases-08-object-exchange-section-2\">空间草案<\/h2>\n<p>长桌在大厅中部，门在桌后偏右。A从近侧走到桌前，B从远侧靠近。两人的起点到桌边都只需几步；机位初始在桌侧，能看见两人的手。<\/p>\n<p>距离用于预演约束，可先假设人物离桌约2米、机位离桌约2米。不能仅靠这两个数字证明接触可见，还要看遮挡、取景与物件大小。<\/p>\n<h2 id=\"cases-08-object-exchange-section-3\">一镜到底方案<\/h2>\n<p>前段用双人中景建立两份文件；人物把文件先后放到桌上，相机略向桌侧移动，保持两份文件可见；中段人物因另一件普通事情短暂转移注意，随后各自拿起错误文件；末段摄影机不再追脸，让两份文件在不同人物手中分开离去。<\/p>\n<p>不同时要求相机从腿部贴地升起、穿桌、绕背再升到俯视。一次小移动足够，就不增加运动。<\/p>\n<h2 id=\"cases-08-object-exchange-section-4\">给预演助手的任务<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">建立简化大厅、长桌、门、A和B，以及两个不同颜色和边框宽度的文件代理物。按状态表安排放下与拿起，保证文件不复制、不消失。相机主要任务是让观众辨认物件归属，而不是展示大厅。先输出放下之前、两份文件同在桌上、拿起之后的三个机位检查画面。若手部被身体遮挡，提出最小站位或机位调整。通过检查后再输出连续预演。\n<\/code><\/pre>\n<p>预演里需要文件代理物和手部位置关系；只有人物方块移动并不足以检验拿取。<\/p>\n<h2 id=\"cases-08-object-exchange-section-5\">更经济的三镜头方案<\/h2>\n<p>镜1：双人中景，两人放下各自文件。<\/p>\n<p>镜2：桌面稍高角度，两只手分别拿走错误文件，颜色与边框可见。<\/p>\n<p>镜3：两人离开，各自持有错误文件，给下一场使用。<\/p>\n<p>三镜头降低同时控制相机、人物和接触的压力，但要维护手、袖口、桌面与物件方位。不是用了切镜就可以忽略连续性。<\/p>\n<h2 id=\"cases-08-object-exchange-section-6\">最先测试与验收<\/h2>\n<p>先测试镜2的物件区分和拿取，不先生成大厅全景。播放给不知剧情的人，只问“开头各拿什么，结尾各拿什么”。若他们说不清，先改识别特征、机位或停留时间，不直接加旁白解释。<\/p>\n<p>生成后以实际通过片段更新下一镜的持有状态。提示词里写着A持Y，不能代替画面真的如此。相关流程：<a href=\"#/workflows/06-previs\">预演<\/a>、<a href=\"#/workflows/05-assets-multishot\">资产交接<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/tutorial-map\">13组教程的提炼与去向<\/a><\/p>\n<\/details>","text":"# 36｜完整案例：两份文件，谁最后拿着哪一份\n\n> 原创影视设计样稿，借鉴教程01的控制问题，不复原其具体剧情。未搭建或生成预演；以下距离与秒数是方案数值，不是实测结论。\n\n## 任务\n\n约24秒片段。A与B在大厅桌边交错，各自拿错了对方的文件。观众应看清交换结果，而人物暂时没有发现。不要让叙事成立完全依靠文件上不可读的小字。\n\n两份道具分别用**蓝色窄边文件夹X**与**黄色宽边文件夹Y**区分；颜色与形状是观众识别线索，不是逼迫模型理解“真”和“假”的抽象标签。\n\n## 状态表先于相机路线\n\n| 时段 | X在哪 | Y在哪 | 观众需要看懂什么 |\n| --- | --- | --- | --- |\n| 开场 | A手中 | B手中 | 各人原本持有的文件不同 |\n| 桌边 | A把X放在桌面左侧 | B把Y放在桌面右侧 | 两个物件都能追踪，不凭空生成 |\n| 离开前 | B拿起X | A拿起Y | 取错的结果清楚 |\n| 结尾 | B带X离开 | A持Y走向门口 | 交换成为下一场起点 |\n\n不是要求观众理解复杂手法，只是看见一件意外发生。若要改成悬疑调包，需要重新定义谁故意、谁不知道、观众何时知道，不把两个版本混在一起。\n\n## 空间草案\n\n长桌在大厅中部，门在桌后偏右。A从近侧走到桌前，B从远侧靠近。两人的起点到桌边都只需几步；机位初始在桌侧，能看见两人的手。\n\n距离用于预演约束，可先假设人物离桌约2米、机位离桌约2米。不能仅靠这两个数字证明接触可见，还要看遮挡、取景与物件大小。\n\n## 一镜到底方案\n\n前段用双人中景建立两份文件；人物把文件先后放到桌上，相机略向桌侧移动，保持两份文件可见；中段人物因另一件普通事情短暂转移注意，随后各自拿起错误文件；末段摄影机不再追脸，让两份文件在不同人物手中分开离去。\n\n不同时要求相机从腿部贴地升起、穿桌、绕背再升到俯视。一次小移动足够，就不增加运动。\n\n## 给预演助手的任务\n\n```text\n建立简化大厅、长桌、门、A和B，以及两个不同颜色和边框宽度的文件代理物。按状态表安排放下与拿起，保证文件不复制、不消失。相机主要任务是让观众辨认物件归属，而不是展示大厅。先输出放下之前、两份文件同在桌上、拿起之后的三个机位检查画面。若手部被身体遮挡，提出最小站位或机位调整。通过检查后再输出连续预演。\n```\n\n预演里需要文件代理物和手部位置关系；只有人物方块移动并不足以检验拿取。\n\n## 更经济的三镜头方案\n\n镜1：双人中景，两人放下各自文件。\n\n镜2：桌面稍高角度，两只手分别拿走错误文件，颜色与边框可见。\n\n镜3：两人离开，各自持有错误文件，给下一场使用。\n\n三镜头降低同时控制相机、人物和接触的压力，但要维护手、袖口、桌面与物件方位。不是用了切镜就可以忽略连续性。\n\n## 最先测试与验收\n\n先测试镜2的物件区分和拿取，不先生成大厅全景。播放给不知剧情的人，只问“开头各拿什么，结尾各拿什么”。若他们说不清，先改识别特征、机位或停留时间，不直接加旁白解释。\n\n生成后以实际通过片段更新下一镜的持有状态。提示词里写着A持Y，不能代替画面真的如此。相关流程：[预演](/workflows/06-previs.md)、[资产交接](/workflows/05-assets-multishot.md)。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [13组教程的提炼与去向](/references/tutorial-map.md)","toc":[{"id":"cases-08-object-exchange-section-0","title":"任务"},{"id":"cases-08-object-exchange-section-1","title":"状态表先于相机路线"},{"id":"cases-08-object-exchange-section-2","title":"空间草案"},{"id":"cases-08-object-exchange-section-3","title":"一镜到底方案"},{"id":"cases-08-object-exchange-section-4","title":"给预演助手的任务"},{"id":"cases-08-object-exchange-section-5","title":"更经济的三镜头方案"},{"id":"cases-08-object-exchange-section-6","title":"最先测试与验收"}]},{"id":"practice/index","path":"practice/index.md","title":"VI · 工具与练习","description":"","type":"Index","group":"practice","tags":[],"html":"<h1>VI · 工具与练习<\/h1>\n<p>六张模板、十二项练习、评价表与团队调用方式。<\/p>\n<ul>\n<li><p><a href=\"#/practice/01-templates\">37｜可直接改用的工具箱：六张轻模板<\/a> — 提供创作、图像、镜头、声音、参考与修复的入口，不强制把所有字段一起提交。<\/p>\n<\/li>\n<li><p><a href=\"#/practice/02-exercises\">38｜练习册：把会写变成会选、会看、会改<\/a> — 12项可独立训练的练习，含目标、参考方向与完成标准。<\/p>\n<\/li>\n<li><p><a href=\"#/practice/03-review-rubric\">39｜评价表：作品表达对了吗，能继续制作吗<\/a> — 不用统一审美分数掩盖重要差异；按目标评审并形成明确下一步。<\/p>\n<\/li>\n<li><p><a href=\"#/practice/04-agent-use\">40｜给创作助手与团队的用法<\/a> — 按任务检索知识，保持专业分工；不把指南变成每次都要执行的庞大流程。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# VI · 工具与练习\n\n六张模板、十二项练习、评价表与团队调用方式。\n\n- [37｜可直接改用的工具箱：六张轻模板](/practice/01-templates.md) — 提供创作、图像、镜头、声音、参考与修复的入口，不强制把所有字段一起提交。\n\n- [38｜练习册：把会写变成会选、会看、会改](/practice/02-exercises.md) — 12项可独立训练的练习，含目标、参考方向与完成标准。\n\n- [39｜评价表：作品表达对了吗，能继续制作吗](/practice/03-review-rubric.md) — 不用统一审美分数掩盖重要差异；按目标评审并形成明确下一步。\n\n- [40｜给创作助手与团队的用法](/practice/04-agent-use.md) — 按任务检索知识，保持专业分工；不把指南变成每次都要执行的庞大流程。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"practice/01-templates","path":"practice/01-templates.md","title":"37｜可直接改用的工具箱：六张轻模板","description":"提供创作、图像、镜头、声音、参考与修复的入口，不强制把所有字段一起提交。","type":"Playbook","group":"practice","tags":["模板","工具箱","助手"],"html":"<h1>37｜可直接改用的工具箱：六张轻模板<\/h1>\n<p>这些模板是给人或创作助手的工作文本，不是跨模型通用API。方括号是需要替换的槽位；已知信息不重复问，缺少高风险信息时明确指出，低风险假设可以标注后继续。<\/p>\n<h2 id=\"practice-01-templates-section-0\">模板一：先长出方向，不急着写最终提示<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">我要制作[用途与媒介]，希望观众首先感到/理解[主要体验]。现有材料是[实际资料]，必须保留[关键事实]。\n请给出三个在表达机制上不同的方向，而不是同一画面换配色。每个方向写：一段有画面感的感受描述；它如何落到人物/物件/空间/声音；一个最值得保留的细节；一个可能失败的地方。\n允许直接表达，也允许间接表达，不默认克制、写实或三幕结构更好。先保持创作开放，不编造已经存在的参考素材或模型实测结果。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-1\">模板二：把感受稿转成一张图<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">感受稿：[一句感受或一小段联想]\n画面用途：[概念图/角色资产/场景资产/主视觉/最终静帧]\n把感受中真正有用的关系提取出来，再选择两三个可见载体；不要把所有比喻字面画出来。\n生成说明应交代视觉中心、空间关系、材料/光或绘画语言，以及必要留白。没有叙事需求时不强加故事。已有产品或角色必须按实际参考保持，不用重新想象代替。\n最后给我一版自然语言提示词，并用一句话解释本版最重要的视觉选择。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-2\">模板三：让当前首帧继续发生<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">这是[首帧/身份参考/布局参考]，请先按实际任务区分它的作用。\n本镜头要完成：[一项主要事件或感受变化]\n起点：[可见姿势、视线、手与道具位置]\n终点：[需要延续到后面的状态]\n观看方式：[机位/取景/一项主要运动，或保持原图]\n声音：[对白/环境/音乐，注明谁听见、谁发声]\n请写一版适合当前工具的执行稿。只细化关键接触与情绪转折，自然过渡留给模型；不要追加新人物、新剧情、无理由的表情菜单。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-3\">模板四：声音不是情绪标签<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">台词正文：[准确台词，不混入备注]\n角色长期声音：[语言、口音、音区、声音质地]\n当场关系：[对谁说，想怎样影响对方，身体正在做什么]\n变化：[哪几个词需要强调，何处改变节奏或收住]\n空间：[耳边/正常距离/电话/门后等]\n请给出自然的表演说明，保留台词的可读性。不要把标点转换成保证执行的秒数；如需精确时长，列为试听后调整项。\n<\/code><\/pre>\n<p>音乐另从<a href=\"#/craft/07-sound-music\">音乐章节<\/a>选择“进入—展开—收尾”的结构，不把台词模板硬套配乐。<\/p>\n<h2 id=\"practice-01-templates-section-4\">模板五：参考分工与冲突消解<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">下面是本次实际可用的素材及用途：[列表]\n请先检查角色、服装、场景布局、光向和时间状态有没有互相冲突，区分首帧、身份、风格、运动与声音参考。\n冲突能从已批准版本解决时直接采用批准版本；不能确定时指出影响，不默默混合。\n只保留当前镜头需要的输入，输出一份精简的引用分工与执行稿，不把整个素材库全部塞进去。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-5\">模板六：看结果，再修提示<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">本次任务与必须项：[目标]\n实际输出：[可读取的媒体或用户提供的具体观察]\n请区分内容正确性、表达效果、制作可用性。先描述你实际能看见/听见的现象，不从提示词推断结果已经完成。\n找出最影响任务的一处问题，提出一个最小修改和一个备选制作路线。不要一次换掉角色、风格、机位与模型；除非问题本身需要连带修改。\n没有可读取媒体时，只能做文本与条件审查，不宣称验片通过。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-6\">模板不是统一成稿格式<\/h2>\n<p>需要提交纯文本的模型，就从模板里编出一段自然说明；参考引用和参数放进有效接口；过程解释不用一并提交。使用模板后，再做一次<a href=\"#/language/06-rewrite-clinic\">改写诊所<\/a>的删减检查。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/official-image\">图像工具：第一方依据与适用边界<\/a>\n[3] <a href=\"#/references/official-video\">视频工具：第一方依据与适用边界<\/a><\/p>\n<\/details>","text":"# 37｜可直接改用的工具箱：六张轻模板\n\n这些模板是给人或创作助手的工作文本，不是跨模型通用API。方括号是需要替换的槽位；已知信息不重复问，缺少高风险信息时明确指出，低风险假设可以标注后继续。\n\n## 模板一：先长出方向，不急着写最终提示\n\n```text\n我要制作[用途与媒介]，希望观众首先感到/理解[主要体验]。现有材料是[实际资料]，必须保留[关键事实]。\n请给出三个在表达机制上不同的方向，而不是同一画面换配色。每个方向写：一段有画面感的感受描述；它如何落到人物/物件/空间/声音；一个最值得保留的细节；一个可能失败的地方。\n允许直接表达，也允许间接表达，不默认克制、写实或三幕结构更好。先保持创作开放，不编造已经存在的参考素材或模型实测结果。\n```\n\n## 模板二：把感受稿转成一张图\n\n```text\n感受稿：[一句感受或一小段联想]\n画面用途：[概念图/角色资产/场景资产/主视觉/最终静帧]\n把感受中真正有用的关系提取出来，再选择两三个可见载体；不要把所有比喻字面画出来。\n生成说明应交代视觉中心、空间关系、材料/光或绘画语言，以及必要留白。没有叙事需求时不强加故事。已有产品或角色必须按实际参考保持，不用重新想象代替。\n最后给我一版自然语言提示词，并用一句话解释本版最重要的视觉选择。\n```\n\n## 模板三：让当前首帧继续发生\n\n```text\n这是[首帧/身份参考/布局参考]，请先按实际任务区分它的作用。\n本镜头要完成：[一项主要事件或感受变化]\n起点：[可见姿势、视线、手与道具位置]\n终点：[需要延续到后面的状态]\n观看方式：[机位/取景/一项主要运动，或保持原图]\n声音：[对白/环境/音乐，注明谁听见、谁发声]\n请写一版适合当前工具的执行稿。只细化关键接触与情绪转折，自然过渡留给模型；不要追加新人物、新剧情、无理由的表情菜单。\n```\n\n## 模板四：声音不是情绪标签\n\n```text\n台词正文：[准确台词，不混入备注]\n角色长期声音：[语言、口音、音区、声音质地]\n当场关系：[对谁说，想怎样影响对方，身体正在做什么]\n变化：[哪几个词需要强调，何处改变节奏或收住]\n空间：[耳边/正常距离/电话/门后等]\n请给出自然的表演说明，保留台词的可读性。不要把标点转换成保证执行的秒数；如需精确时长，列为试听后调整项。\n```\n\n音乐另从[音乐章节](/craft/07-sound-music.md)选择“进入—展开—收尾”的结构，不把台词模板硬套配乐。\n\n## 模板五：参考分工与冲突消解\n\n```text\n下面是本次实际可用的素材及用途：[列表]\n请先检查角色、服装、场景布局、光向和时间状态有没有互相冲突，区分首帧、身份、风格、运动与声音参考。\n冲突能从已批准版本解决时直接采用批准版本；不能确定时指出影响，不默默混合。\n只保留当前镜头需要的输入，输出一份精简的引用分工与执行稿，不把整个素材库全部塞进去。\n```\n\n## 模板六：看结果，再修提示\n\n```text\n本次任务与必须项：[目标]\n实际输出：[可读取的媒体或用户提供的具体观察]\n请区分内容正确性、表达效果、制作可用性。先描述你实际能看见/听见的现象，不从提示词推断结果已经完成。\n找出最影响任务的一处问题，提出一个最小修改和一个备选制作路线。不要一次换掉角色、风格、机位与模型；除非问题本身需要连带修改。\n没有可读取媒体时，只能做文本与条件审查，不宣称验片通过。\n```\n\n## 模板不是统一成稿格式\n\n需要提交纯文本的模型，就从模板里编出一段自然说明；参考引用和参数放进有效接口；过程解释不用一并提交。使用模板后，再做一次[改写诊所](/language/06-rewrite-clinic.md)的删减检查。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [图像工具：第一方依据与适用边界](/references/official-image.md)\n[3] [视频工具：第一方依据与适用边界](/references/official-video.md)","toc":[{"id":"practice-01-templates-section-0","title":"模板一：先长出方向，不急着写最终提示"},{"id":"practice-01-templates-section-1","title":"模板二：把感受稿转成一张图"},{"id":"practice-01-templates-section-2","title":"模板三：让当前首帧继续发生"},{"id":"practice-01-templates-section-3","title":"模板四：声音不是情绪标签"},{"id":"practice-01-templates-section-4","title":"模板五：参考分工与冲突消解"},{"id":"practice-01-templates-section-5","title":"模板六：看结果，再修提示"},{"id":"practice-01-templates-section-6","title":"模板不是统一成稿格式"}]},{"id":"practice/02-exercises","path":"practice/02-exercises.md","title":"38｜练习册：把会写变成会选、会看、会改","description":"12项可独立训练的练习，含目标、参考方向与完成标准。","type":"Exercise","group":"practice","tags":["练习","学习","通感","评价"],"html":"<h1>38｜练习册：把会写变成会选、会看、会改<\/h1>\n<p>可以先做纸上练习；涉及生成时由你选择实际工具与预算。这里没有虚构练习结果。每次保存起点、改动与观察，不只收藏最后一条提示词。<\/p>\n<h2 id=\"practice-02-exercises-section-0\">练习01：一个词，三种机制<\/h2>\n<p>题目：不用“水、冰块、薄荷”，写三个“清爽”的视觉方向。<\/p>\n<p>参考方向：被风翻过的一页纸；暖阳下干净衬衫的松动；信息密度逐渐降低的版式。完成标准不是三句话都很美，而是它们靠不同关系产生感觉。再选一个转为可生成说明。<\/p>\n<h2 id=\"practice-02-exercises-section-1\">练习02：保留比喻，拿走比喻中的物件<\/h2>\n<p>题目：“声音像折过的纸”，不使用任何纸张画面或纸声，写一段配音方向。<\/p>\n<p>参考方向：选择“有细小转折但不过分脆裂”的性质，放到句中短停和收尾。完成标准：执行说明能被朗读者理解，比喻不是唯一信息。<\/p>\n<h2 id=\"practice-02-exercises-section-2\">练习03：同一句台词，三种关系<\/h2>\n<p>题目：“你终于来了。”分别写成迎接、责怪、试探。<\/p>\n<p>参考方向：说给谁，等待造成了什么，是否希望对方解释。完成标准：不只改变音量与情绪标签，还能改变重音、距离或一句话后的动作。<\/p>\n<h2 id=\"practice-02-exercises-section-3\">练习04：拍不到脸，还能不能表达<\/h2>\n<p>题目：只允许拍手、门与钥匙，表现从警觉到安心。<\/p>\n<p>参考方向：钥匙碰响后被握紧，认出熟悉来人后，手从门边落下。完成标准：没有暗中加入面部特写或解释性旁白。<\/p>\n<h2 id=\"practice-02-exercises-section-4\">练习05：快乐不能被克制模板吞掉<\/h2>\n<p>题目：写一段明显、热烈的喜悦。禁止以低头、咬唇、压住笑作主要表现。<\/p>\n<p>参考方向：分享、起身、拥抱、笑声打断台词。完成标准：强烈但动作目的清楚，有接触准备与收尾，非全身无理由乱动。<\/p>\n<h2 id=\"practice-02-exercises-section-5\">练习06：静止镜头的注意力接力<\/h2>\n<p>题目：摄影机不能移动，在一张餐桌旁把注意力从A交给B，再交给桌上物件。<\/p>\n<p>参考方向：A说话，B的手先开始移动，道具被推到两人之间。完成标准：不偷用推近或拉焦当唯一解决办法；检验同框大小是否足够看清。<\/p>\n<h2 id=\"practice-02-exercises-section-6\">练习07：只改一个主要变量<\/h2>\n<p>题目：为同一首帧写两版提示，只比较“直接情绪词”和“目标＋一次反应”。<\/p>\n<p>完成标准：人物、机位、时长、工具设置尽可能保持；不把一次偶然成功当成普遍结论。没有运行生成时，仅记录待检验假设。<\/p>\n<h2 id=\"practice-02-exercises-section-7\">练习08：改图中的搬动与复制<\/h2>\n<p>题目：把一只花瓶移动到另一侧。写出指认、操作、原位置处理、保留项。<\/p>\n<p>完成标准：不能出现两只花瓶，目标位置有接触关系，标记最终清理。额外检查非编辑区域，不能只盯着花瓶看。<\/p>\n<h2 id=\"practice-02-exercises-section-8\">练习09：不加更多参考，先删矛盾<\/h2>\n<p>题目：素材里有同一角色两种发色、一个反向布局房间和三张鞋子图。当前任务只拍桌边上半身。<\/p>\n<p>参考方向：选定当前批准身份与场景，删除无关鞋子与旧发色输入。完成标准：每个保留素材都有用途，不能用“全部参考、保持一致”逃过冲突。<\/p>\n<h2 id=\"practice-02-exercises-section-9\">练习10：声音让同一画面变成两种故事<\/h2>\n<p>题目：同一空走廊，一版期待，一版不安。<\/p>\n<p>参考方向：熟人活动声与门后的未知脚步分别组织。完成标准：区分场内声音与配乐，不只换一首标记为“恐怖”的音乐。只听与静音分别检查。<\/p>\n<h2 id=\"practice-02-exercises-section-10\">练习11：允许不真实，但只偏离一条规则<\/h2>\n<p>题目：产品稳定，一条材质带悬浮。写一张主视觉与一段短动效。<\/p>\n<p>完成标准：说明哪里超现实、哪里保持稳定；瓶身不可因“梦幻”而变形。若生成拓扑不稳，提出分层合成路线，不算失败逃避。<\/p>\n<h2 id=\"practice-02-exercises-section-11\">练习12：剪出一个可理解的短片<\/h2>\n<p>题目：用任何三个已有、获准使用的片段组成“进入—变化—离开”，或另选一个非叙事的“聚拢—展开—停留”结构。<\/p>\n<p>完成标准：先写每段的作用，再检查实际接头；允许不完全符合原提示的片段被采用，但更新下一步依据。对片中不能读出的重要信息，选择补画面、补声音、改节奏或删去，而非只在说明里解释。<\/p>\n<h2 id=\"practice-02-exercises-section-12\">如何积累个人风格<\/h2>\n<p>每次练习只留三行：我原先以为什么会起作用；实际看见了什么；下次会保留或删去什么。个人风格不是固定词库，而是你反复做出的选择。附<a href=\"#/practice/03-review-rubric\">评价表<\/a>辅助比较。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 38｜练习册：把会写变成会选、会看、会改\n\n可以先做纸上练习；涉及生成时由你选择实际工具与预算。这里没有虚构练习结果。每次保存起点、改动与观察，不只收藏最后一条提示词。\n\n## 练习01：一个词，三种机制\n\n题目：不用“水、冰块、薄荷”，写三个“清爽”的视觉方向。\n\n参考方向：被风翻过的一页纸；暖阳下干净衬衫的松动；信息密度逐渐降低的版式。完成标准不是三句话都很美，而是它们靠不同关系产生感觉。再选一个转为可生成说明。\n\n## 练习02：保留比喻，拿走比喻中的物件\n\n题目：“声音像折过的纸”，不使用任何纸张画面或纸声，写一段配音方向。\n\n参考方向：选择“有细小转折但不过分脆裂”的性质，放到句中短停和收尾。完成标准：执行说明能被朗读者理解，比喻不是唯一信息。\n\n## 练习03：同一句台词，三种关系\n\n题目：“你终于来了。”分别写成迎接、责怪、试探。\n\n参考方向：说给谁，等待造成了什么，是否希望对方解释。完成标准：不只改变音量与情绪标签，还能改变重音、距离或一句话后的动作。\n\n## 练习04：拍不到脸，还能不能表达\n\n题目：只允许拍手、门与钥匙，表现从警觉到安心。\n\n参考方向：钥匙碰响后被握紧，认出熟悉来人后，手从门边落下。完成标准：没有暗中加入面部特写或解释性旁白。\n\n## 练习05：快乐不能被克制模板吞掉\n\n题目：写一段明显、热烈的喜悦。禁止以低头、咬唇、压住笑作主要表现。\n\n参考方向：分享、起身、拥抱、笑声打断台词。完成标准：强烈但动作目的清楚，有接触准备与收尾，非全身无理由乱动。\n\n## 练习06：静止镜头的注意力接力\n\n题目：摄影机不能移动，在一张餐桌旁把注意力从A交给B，再交给桌上物件。\n\n参考方向：A说话，B的手先开始移动，道具被推到两人之间。完成标准：不偷用推近或拉焦当唯一解决办法；检验同框大小是否足够看清。\n\n## 练习07：只改一个主要变量\n\n题目：为同一首帧写两版提示，只比较“直接情绪词”和“目标＋一次反应”。\n\n完成标准：人物、机位、时长、工具设置尽可能保持；不把一次偶然成功当成普遍结论。没有运行生成时，仅记录待检验假设。\n\n## 练习08：改图中的搬动与复制\n\n题目：把一只花瓶移动到另一侧。写出指认、操作、原位置处理、保留项。\n\n完成标准：不能出现两只花瓶，目标位置有接触关系，标记最终清理。额外检查非编辑区域，不能只盯着花瓶看。\n\n## 练习09：不加更多参考，先删矛盾\n\n题目：素材里有同一角色两种发色、一个反向布局房间和三张鞋子图。当前任务只拍桌边上半身。\n\n参考方向：选定当前批准身份与场景，删除无关鞋子与旧发色输入。完成标准：每个保留素材都有用途，不能用“全部参考、保持一致”逃过冲突。\n\n## 练习10：声音让同一画面变成两种故事\n\n题目：同一空走廊，一版期待，一版不安。\n\n参考方向：熟人活动声与门后的未知脚步分别组织。完成标准：区分场内声音与配乐，不只换一首标记为“恐怖”的音乐。只听与静音分别检查。\n\n## 练习11：允许不真实，但只偏离一条规则\n\n题目：产品稳定，一条材质带悬浮。写一张主视觉与一段短动效。\n\n完成标准：说明哪里超现实、哪里保持稳定；瓶身不可因“梦幻”而变形。若生成拓扑不稳，提出分层合成路线，不算失败逃避。\n\n## 练习12：剪出一个可理解的短片\n\n题目：用任何三个已有、获准使用的片段组成“进入—变化—离开”，或另选一个非叙事的“聚拢—展开—停留”结构。\n\n完成标准：先写每段的作用，再检查实际接头；允许不完全符合原提示的片段被采用，但更新下一步依据。对片中不能读出的重要信息，选择补画面、补声音、改节奏或删去，而非只在说明里解释。\n\n## 如何积累个人风格\n\n每次练习只留三行：我原先以为什么会起作用；实际看见了什么；下次会保留或删去什么。个人风格不是固定词库，而是你反复做出的选择。附[评价表](/practice/03-review-rubric.md)辅助比较。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"practice-02-exercises-section-0","title":"练习01：一个词，三种机制"},{"id":"practice-02-exercises-section-1","title":"练习02：保留比喻，拿走比喻中的物件"},{"id":"practice-02-exercises-section-2","title":"练习03：同一句台词，三种关系"},{"id":"practice-02-exercises-section-3","title":"练习04：拍不到脸，还能不能表达"},{"id":"practice-02-exercises-section-4","title":"练习05：快乐不能被克制模板吞掉"},{"id":"practice-02-exercises-section-5","title":"练习06：静止镜头的注意力接力"},{"id":"practice-02-exercises-section-6","title":"练习07：只改一个主要变量"},{"id":"practice-02-exercises-section-7","title":"练习08：改图中的搬动与复制"},{"id":"practice-02-exercises-section-8","title":"练习09：不加更多参考，先删矛盾"},{"id":"practice-02-exercises-section-9","title":"练习10：声音让同一画面变成两种故事"},{"id":"practice-02-exercises-section-10","title":"练习11：允许不真实，但只偏离一条规则"},{"id":"practice-02-exercises-section-11","title":"练习12：剪出一个可理解的短片"},{"id":"practice-02-exercises-section-12","title":"如何积累个人风格"}]},{"id":"practice/03-review-rubric","path":"practice/03-review-rubric.md","title":"39｜评价表：作品表达对了吗，能继续制作吗","description":"不用统一审美分数掩盖重要差异；按目标评审并形成明确下一步。","type":"Playbook","group":"practice","tags":["评价","验收","复盘","交付"],"html":"<h1>39｜评价表：作品表达对了吗，能继续制作吗<\/h1>\n<h2 id=\"practice-03-review-rubric-section-0\">先分硬任务与审美选择<\/h2>\n<p>客户产品必须可识别，是任务；背景偏蓝还是偏暖，是方案选择，除非品牌已限定。不能用漂亮弥补错误字标，也不能拿个人偏好否定项目明确需要的形式。<\/p>\n<p>以下维度按需采用，不必给每项打数字。一个总分很容易让严重问题被其他漂亮部分平均掉。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>看或听什么<\/th>\n<th>典型通过表现<\/th>\n<th>需要修订的表现<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>任务<\/td>\n<td>必须让观众知道或感到什么<\/td>\n<td>重要信息可读，核心体验有承托<\/td>\n<td>只能靠看提示词才理解<\/td>\n<\/tr>\n<tr>\n<td>表达<\/td>\n<td>形式是否服务目标<\/td>\n<td>强弱、主从与风格相容<\/td>\n<td>每个部门都在同一处用力<\/td>\n<\/tr>\n<tr>\n<td>行为<\/td>\n<td>动作、反应与关系<\/td>\n<td>刺激和回应可接续<\/td>\n<td>无对象表演、动作空循环<\/td>\n<\/tr>\n<tr>\n<td>空间<\/td>\n<td>人物、道具、光与机位<\/td>\n<td>关键位置与持有状态清楚<\/td>\n<td>突然换房、穿物、道具无去向<\/td>\n<\/tr>\n<tr>\n<td>质感<\/td>\n<td>表面、重量、声音材料<\/td>\n<td>作品自己的规则稳定<\/td>\n<td>结构错误被柔光或颗粒遮盖<\/td>\n<\/tr>\n<tr>\n<td>声音<\/td>\n<td>台词、空间、情绪与画面<\/td>\n<td>发声归属清楚，有需要的间隔<\/td>\n<td>错人说话、抢信息、时序错位<\/td>\n<\/tr>\n<tr>\n<td>制作<\/td>\n<td>片段长度、接头、可编辑性<\/td>\n<td>可用区间明确，后续可接<\/td>\n<td>无可剪余量或修改影响不可追踪<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>写实作品看写实规则，超现实作品看所设规则，不能用一套“自然”统一裁决。<\/p>\n<h2 id=\"practice-03-review-rubric-section-1\">三轮观看，各自做不同工作<\/h2>\n<p>第一轮像观众：不读提示词，说最先注意到的东西与最直接的感受。<\/p>\n<p>第二轮像专业同事：看动作接触、声画归属、光与材质、信息是否来得及接收。<\/p>\n<p>第三轮像剪辑与交付者：看与前后镜头是否相容，具体哪段可用，剩余问题怎样处理。<\/p>\n<p>时间有限时可以合并，但不要完全只看静帧截图。声音与运动中的问题无法靠一张图可靠判断。<\/p>\n<h2 id=\"practice-03-review-rubric-section-2\">留下明确结论<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">对象：实际候选文件与可用时间范围。\n本镜任务：……\n观察到的表现：……（只写媒体可支持的观察）\n结论：可用 / 可用但需指定修补 / 需重做。\n最重要问题：……\n下一步：保留、局部修、改音、改选区间、重生成，或返回方案。\n交接状态：谁在哪里，关键物件在哪，声音与造型采用哪版。\n<\/code><\/pre>\n<p>“更自然一点”“再高级一点”不能单独作为返工单。要指出哪里让你这样感到，以及优先改哪一层。<\/p>\n<h2 id=\"practice-03-review-rubric-section-3\">纸上诊断示例，不是真实测试结果<\/h2>\n<p>设想一条候选：角色身份正确，拿杯也完成，但原本希望松弛的结尾变成了面向镜头的广告微笑。<\/p>\n<p>不应结论：“整体8.5分，可以。”<\/p>\n<p>更有用的结论：内容任务通过，结尾表达偏展示；保留前半段拿杯，后半段改成看向窗外的停留，或重新选择没有看镜头的区间。若项目正需要广告展示，这个表现反而可能合适。<\/p>\n<p>这个例子说明判断依目标而变，不说明一定要删掉广告笑容。<\/p>\n<h2 id=\"practice-03-review-rubric-section-4\">哪些缺陷可以接受<\/h2>\n<p>远处背景一片非关键叶子的形态变化，未必值得重做；产品标签、关键道具归属、决定性对白的错误通常更重要。比例不是按“错误像素面积”计算，而按它是否伤害任务。<\/p>\n<h2 id=\"practice-03-review-rubric-section-5\">没有媒体时的正确范围<\/h2>\n<p>可以检查语义矛盾、时间预算、引用分工与风险，但只能叫文本预审。不能说“配音自然”“没有变脸”“动作流畅”。本书所有案例停留在设计与文本审查层，没有伪装成媒体验收。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a><\/p>\n<\/details>","text":"# 39｜评价表：作品表达对了吗，能继续制作吗\n\n## 先分硬任务与审美选择\n\n客户产品必须可识别，是任务；背景偏蓝还是偏暖，是方案选择，除非品牌已限定。不能用漂亮弥补错误字标，也不能拿个人偏好否定项目明确需要的形式。\n\n以下维度按需采用，不必给每项打数字。一个总分很容易让严重问题被其他漂亮部分平均掉。\n\n| 维度 | 看或听什么 | 典型通过表现 | 需要修订的表现 |\n| --- | --- | --- | --- |\n| 任务 | 必须让观众知道或感到什么 | 重要信息可读，核心体验有承托 | 只能靠看提示词才理解 |\n| 表达 | 形式是否服务目标 | 强弱、主从与风格相容 | 每个部门都在同一处用力 |\n| 行为 | 动作、反应与关系 | 刺激和回应可接续 | 无对象表演、动作空循环 |\n| 空间 | 人物、道具、光与机位 | 关键位置与持有状态清楚 | 突然换房、穿物、道具无去向 |\n| 质感 | 表面、重量、声音材料 | 作品自己的规则稳定 | 结构错误被柔光或颗粒遮盖 |\n| 声音 | 台词、空间、情绪与画面 | 发声归属清楚，有需要的间隔 | 错人说话、抢信息、时序错位 |\n| 制作 | 片段长度、接头、可编辑性 | 可用区间明确，后续可接 | 无可剪余量或修改影响不可追踪 |\n\n写实作品看写实规则，超现实作品看所设规则，不能用一套“自然”统一裁决。\n\n## 三轮观看，各自做不同工作\n\n第一轮像观众：不读提示词，说最先注意到的东西与最直接的感受。\n\n第二轮像专业同事：看动作接触、声画归属、光与材质、信息是否来得及接收。\n\n第三轮像剪辑与交付者：看与前后镜头是否相容，具体哪段可用，剩余问题怎样处理。\n\n时间有限时可以合并，但不要完全只看静帧截图。声音与运动中的问题无法靠一张图可靠判断。\n\n## 留下明确结论\n\n```text\n对象：实际候选文件与可用时间范围。\n本镜任务：……\n观察到的表现：……（只写媒体可支持的观察）\n结论：可用 / 可用但需指定修补 / 需重做。\n最重要问题：……\n下一步：保留、局部修、改音、改选区间、重生成，或返回方案。\n交接状态：谁在哪里，关键物件在哪，声音与造型采用哪版。\n```\n\n“更自然一点”“再高级一点”不能单独作为返工单。要指出哪里让你这样感到，以及优先改哪一层。\n\n## 纸上诊断示例，不是真实测试结果\n\n设想一条候选：角色身份正确，拿杯也完成，但原本希望松弛的结尾变成了面向镜头的广告微笑。\n\n不应结论：“整体8.5分，可以。”\n\n更有用的结论：内容任务通过，结尾表达偏展示；保留前半段拿杯，后半段改成看向窗外的停留，或重新选择没有看镜头的区间。若项目正需要广告展示，这个表现反而可能合适。\n\n这个例子说明判断依目标而变，不说明一定要删掉广告笑容。\n\n## 哪些缺陷可以接受\n\n远处背景一片非关键叶子的形态变化，未必值得重做；产品标签、关键道具归属、决定性对白的错误通常更重要。比例不是按“错误像素面积”计算，而按它是否伤害任务。\n\n## 没有媒体时的正确范围\n\n可以检查语义矛盾、时间预算、引用分工与风险，但只能叫文本预审。不能说“配音自然”“没有变脸”“动作流畅”。本书所有案例停留在设计与文本审查层，没有伪装成媒体验收。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)","toc":[{"id":"practice-03-review-rubric-section-0","title":"先分硬任务与审美选择"},{"id":"practice-03-review-rubric-section-1","title":"三轮观看，各自做不同工作"},{"id":"practice-03-review-rubric-section-2","title":"留下明确结论"},{"id":"practice-03-review-rubric-section-3","title":"纸上诊断示例，不是真实测试结果"},{"id":"practice-03-review-rubric-section-4","title":"哪些缺陷可以接受"},{"id":"practice-03-review-rubric-section-5","title":"没有媒体时的正确范围"}]},{"id":"practice/04-agent-use","path":"practice/04-agent-use.md","title":"40｜给创作助手与团队的用法","description":"按任务检索知识，保持专业分工；不把指南变成每次都要执行的庞大流程。","type":"Playbook","group":"practice","tags":["Agent","协作","知识维护","使用"],"html":"<h1>40｜给创作助手与团队的用法<\/h1>\n<h2 id=\"practice-04-agent-use-section-0\">先识别现在在做什么<\/h2>\n<p>探索、写稿、准备资产、生成、修图、验片、剪辑，是不同任务。用户只要一句提示词时，不输出整套制片流程；用户要系列制作时，也不能只给一句漂亮描述就结束。<\/p>\n<p>检索时先看包根目录，再取当前任务相关的两三个概念。需要身体表演就读表演、动作和当前案例；不要每次把全部47个概念都拼进模型上下文。这里的数字以当前交付为准，后续增删应随目录更新。<\/p>\n<h2 id=\"practice-04-agent-use-section-1\">角色分工保持简单<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>专业判断<\/th>\n<th>主要决定什么<\/th>\n<th>提示词作者负责什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>导演或创意负责人<\/td>\n<td>观众体验、故事与形式选择<\/td>\n<td>准确表达，不暗中改题<\/td>\n<\/tr>\n<tr>\n<td>美术与摄影<\/td>\n<td>造型、空间、材质、光与观看位置<\/td>\n<td>组织有效参考和清楚描述<\/td>\n<\/tr>\n<tr>\n<td>表演与声音<\/td>\n<td>人物行为、说话关系、听觉结构<\/td>\n<td>保持声线与当场状态分离<\/td>\n<\/tr>\n<tr>\n<td>编辑与生成执行<\/td>\n<td>片段选择、接头、参数与任务模式<\/td>\n<td>把说明编成接口可用输入，记录实际结果<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>一人可以兼任多项，Agent也可以协作。关键不是人头数，而是决定有没有被准确传递。<\/p>\n<h2 id=\"practice-04-agent-use-section-2\">给助手的最小工作顺序<\/h2>\n<p>读已有目标与实际素材；指出影响任务的矛盾；在必要范围内展开或执行；给一份可使用的结果；说明还需验证什么。除非任务复杂，不要求每次把这五步的过程全文输出。<\/p>\n<p>探索阶段可提出多个方向；执行阶段不擅自新增人物、换包装或改结局。若已有方案不成立，提出最小变更与影响，而不是默默执行另一套创意。<\/p>\n<h2 id=\"practice-04-agent-use-section-3\">对参考、参数与工具保持诚实<\/h2>\n<p>文件名不等于文件已上传，编号不等于引用已绑定，文字中的时长不等于真实参数，任务提交成功不等于媒体通过。没有读到的图像和没有听到的音频不得宣布验收。<\/p>\n<p>本指南不会自动调用模型、安装插件或购买服务。付费生成需用户对实际请求与开销作明确决定。把创作样稿当作调用许可，是两种不同事情。<\/p>\n<h2 id=\"practice-04-agent-use-section-4\">生产只有一份当前决定<\/h2>\n<p>当前镜头说明、批准素材与实际通过区间应能相互对应。不把旧提示词、旧状态、旧回执当作最新依据。新改动影响服装、台词或终点时，更新受影响交接；与本镜无关的信息不必传给所有人。<\/p>\n<h2 id=\"practice-04-agent-use-section-5\">知识更新与实验<\/h2>\n<p>某条方法在一个模型里有效，只记录到它的适用条件，不立刻升格为全平台原则。具体模型接口变化优先更新<a href=\"#/workflows/08-model-adaptation\">工具适配<\/a>与第一方来源，艺术方法不用随每次发布重写。<\/p>\n<p>核心六层框架和通感图谱是本次综合提出的创作工具，适合由使用者用实际作品反复检验。把不同结果补充为带媒体依据的案例，不编造“已验证最佳实践”。<\/p>\n<p>本包附有轻量消费入口<code>skills/contemporary-prompt-expert/SKILL.md<\/code>，位于交付工作区而非本知识包目录；它只是导航文件，不代表已在任何应用中安装。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">本次资料范围与证据边界<\/a>\n[2] <a href=\"#/references/okf\">OKF封装与维护说明<\/a><\/p>\n<\/details>","text":"# 40｜给创作助手与团队的用法\n\n## 先识别现在在做什么\n\n探索、写稿、准备资产、生成、修图、验片、剪辑，是不同任务。用户只要一句提示词时，不输出整套制片流程；用户要系列制作时，也不能只给一句漂亮描述就结束。\n\n检索时先看包根目录，再取当前任务相关的两三个概念。需要身体表演就读表演、动作和当前案例；不要每次把全部47个概念都拼进模型上下文。这里的数字以当前交付为准，后续增删应随目录更新。\n\n## 角色分工保持简单\n\n| 专业判断 | 主要决定什么 | 提示词作者负责什么 |\n| --- | --- | --- |\n| 导演或创意负责人 | 观众体验、故事与形式选择 | 准确表达，不暗中改题 |\n| 美术与摄影 | 造型、空间、材质、光与观看位置 | 组织有效参考和清楚描述 |\n| 表演与声音 | 人物行为、说话关系、听觉结构 | 保持声线与当场状态分离 |\n| 编辑与生成执行 | 片段选择、接头、参数与任务模式 | 把说明编成接口可用输入，记录实际结果 |\n\n一人可以兼任多项，Agent也可以协作。关键不是人头数，而是决定有没有被准确传递。\n\n## 给助手的最小工作顺序\n\n读已有目标与实际素材；指出影响任务的矛盾；在必要范围内展开或执行；给一份可使用的结果；说明还需验证什么。除非任务复杂，不要求每次把这五步的过程全文输出。\n\n探索阶段可提出多个方向；执行阶段不擅自新增人物、换包装或改结局。若已有方案不成立，提出最小变更与影响，而不是默默执行另一套创意。\n\n## 对参考、参数与工具保持诚实\n\n文件名不等于文件已上传，编号不等于引用已绑定，文字中的时长不等于真实参数，任务提交成功不等于媒体通过。没有读到的图像和没有听到的音频不得宣布验收。\n\n本指南不会自动调用模型、安装插件或购买服务。付费生成需用户对实际请求与开销作明确决定。把创作样稿当作调用许可，是两种不同事情。\n\n## 生产只有一份当前决定\n\n当前镜头说明、批准素材与实际通过区间应能相互对应。不把旧提示词、旧状态、旧回执当作最新依据。新改动影响服装、台词或终点时，更新受影响交接；与本镜无关的信息不必传给所有人。\n\n## 知识更新与实验\n\n某条方法在一个模型里有效，只记录到它的适用条件，不立刻升格为全平台原则。具体模型接口变化优先更新[工具适配](/workflows/08-model-adaptation.md)与第一方来源，艺术方法不用随每次发布重写。\n\n核心六层框架和通感图谱是本次综合提出的创作工具，适合由使用者用实际作品反复检验。把不同结果补充为带媒体依据的案例，不编造“已验证最佳实践”。\n\n本包附有轻量消费入口`skills/contemporary-prompt-expert/SKILL.md`，位于交付工作区而非本知识包目录；它只是导航文件，不代表已在任何应用中安装。\n\n# Citations\n\n[1] [本次资料范围与证据边界](/references/corpus.md)\n[2] [OKF封装与维护说明](/references/okf.md)","toc":[{"id":"practice-04-agent-use-section-0","title":"先识别现在在做什么"},{"id":"practice-04-agent-use-section-1","title":"角色分工保持简单"},{"id":"practice-04-agent-use-section-2","title":"给助手的最小工作顺序"},{"id":"practice-04-agent-use-section-3","title":"对参考、参数与工具保持诚实"},{"id":"practice-04-agent-use-section-4","title":"生产只有一份当前决定"},{"id":"practice-04-agent-use-section-5","title":"知识更新与实验"}]},{"id":"references/index","path":"references/index.md","title":"VII · 来源与理论","description":"","type":"Index","group":"references","tags":[],"html":"<h1>VII · 来源与理论<\/h1>\n<p>追溯13组教程、第一方技术依据与理论延展边界。<\/p>\n<ul>\n<li><p><a href=\"#/references/corpus\">资料范围：本书依据什么，不假装依据什么<\/a> — 固定来源层级、读取范围与新增内容的身份，避免二手整理被当成原始实验证据。<\/p>\n<\/li>\n<li><p><a href=\"#/references/official-image\">第一方依据：图像提示与图像编辑<\/a> — 核验当前图像工具的写法与编辑边界，不作模型优劣排名。<\/p>\n<\/li>\n<li><p><a href=\"#/references/official-video\">第一方依据：视频提示、运动与任务适配<\/a> — 记录当前指导和历史参考的区别，避免把供应商建议提升为通用机制。<\/p>\n<\/li>\n<li><p><a href=\"#/references/official-voice-light\">第一方依据：配音停顿与灯光软硬<\/a> — 只校准容易误传的技术概念，不用软件文档证明艺术效果。<\/p>\n<\/li>\n<li><p><a href=\"#/references/okf\">封装与维护：按上传skill的OKF v0.1交付<\/a> — 说明知识包、派生阅读器、校验器与索引的各自职责，不混同规范与团队约定。<\/p>\n<\/li>\n<li><p><a href=\"#/references/theory\">理论桥梁：借已有知识，不借虚假的权威<\/a> — 将感知、设计与电影分析接入提示实践，并明确哪些是本书的新推论。<\/p>\n<\/li>\n<li><p><a href=\"#/references/tutorial-map\">来源映射：13组教程进入了哪些知识<\/a> — 保留全组覆盖与上游路径，区分教程主张、复审修正和本次综合。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# VII · 来源与理论\n\n追溯13组教程、第一方技术依据与理论延展边界。\n\n- [资料范围：本书依据什么，不假装依据什么](/references/corpus.md) — 固定来源层级、读取范围与新增内容的身份，避免二手整理被当成原始实验证据。\n\n- [第一方依据：图像提示与图像编辑](/references/official-image.md) — 核验当前图像工具的写法与编辑边界，不作模型优劣排名。\n\n- [第一方依据：视频提示、运动与任务适配](/references/official-video.md) — 记录当前指导和历史参考的区别，避免把供应商建议提升为通用机制。\n\n- [第一方依据：配音停顿与灯光软硬](/references/official-voice-light.md) — 只校准容易误传的技术概念，不用软件文档证明艺术效果。\n\n- [封装与维护：按上传skill的OKF v0.1交付](/references/okf.md) — 说明知识包、派生阅读器、校验器与索引的各自职责，不混同规范与团队约定。\n\n- [理论桥梁：借已有知识，不借虚假的权威](/references/theory.md) — 将感知、设计与电影分析接入提示实践，并明确哪些是本书的新推论。\n\n- [来源映射：13组教程进入了哪些知识](/references/tutorial-map.md) — 保留全组覆盖与上游路径，区分教程主张、复审修正和本次综合。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"references/corpus","path":"references/corpus.md","title":"资料范围：本书依据什么，不假装依据什么","description":"固定来源层级、读取范围与新增内容的身份，避免二手整理被当成原始实验证据。","type":"Reference","group":"references","tags":["来源","范围","证据"],"html":"<h1>资料范围：本书依据什么，不假装依据什么<\/h1>\n<h2 id=\"references-corpus-section-0\">这不是第二次“逐图审查完成”的声明<\/h2>\n<p>本书直接读取的教程材料是上一轮形成并已提供的文字复审包：<code>ciwei-ai-shortfilm-notes-text-review-overlay-20260917.zip<\/code>。共31个文件，其中26份为13组教程的新版方法论与提示词文档，3份为根目录说明与综合方法，另2份为范围与校验元数据。<\/p>\n<p>上一轮复审依据的原仓库版本为<code>5887b2040f642782ce29473bd6cb8b2f8129458b<\/code>。本书不把那个版本与当前仓库主分支混用，也没有重新宣称已经观看原视频、收听原音轨或逐张读到截图像素。原包明确保留了这些限制。<\/p>\n<p>交付工作区的<code>sources/tutorial-text-review-source.zip<\/code>保留这份文字复审输入的原始ZIP字节，便于回看；它仍是文本覆盖包，不是完整原仓库，里面部分原始证据链接需要原仓库环境。文件级读取范围与SHA-256在<code>qa/scope_manifest.json<\/code>中。<\/p>\n<h2 id=\"references-corpus-section-1\">三层来源，不互相冒充<\/h2>\n<p><strong>第一层：用户资料。<\/strong> 教程中的操作经验、旧整理的遗漏与纠正，提供本书的问题样本。相应去向见<a href=\"#/references/tutorial-map\">13组映射<\/a>。<\/p>\n<p><strong>第二层：外部核验。<\/strong> 第一方工具文档用于说明输入角色、适配和执行边界；原作者或原研究用于建立理论桥梁。访问日期为2026-09-17；网页可能后续更新，本包不是网页全文快照。<\/p>\n<p><strong>第三层：本次综合。<\/strong> 六层转译、三稿分工、通感维度、情绪与氛围图谱、六张模板、十二项练习与八个完整案例，均为本次重组或原创设计。它们有可说明的逻辑，不等于已经通过生成实验。<\/p>\n<h2 id=\"references-corpus-section-2\">本次实际做了什么<\/h2>\n<p>读取上述29份Markdown与范围元数据；读取用户提供的<code>okf-bundle-ready.zip<\/code>中的skill、规范、模板与工具脚本；结合第一方资料编写指南；构建离线HTML、知识包、导航skill与校验工具；对实际文件做结构和阅读器检查。<\/p>\n<p>没有调用生图、生视频、语音或音乐生成接口，没有制造成功率、成本降低比例或盲测分数。所有案例中的时长、角色与参考代称都是设计条件，不是已经存在的媒体结果。<\/p>\n<h2 id=\"references-corpus-section-3\">为什么没有照原13个文件夹再排一次<\/h2>\n<p>上一轮按教程整理，适合追溯原例；本次按创作任务整理，适合学习与调用。一条教程可能进入表演、声音、参考分工等多个概念，一种方法也可能融合多条教程。映射保留出处，正文避免原封不动重复13次。<\/p>\n<h2 id=\"references-corpus-section-4\">哪些内容没有被升级成知识<\/h2>\n<p>未确认的原提示词残字、第三方界面型号与限额、口播成功率、未经核实的名人引言，以及“词元按顺序所以画面按顺序执行”等机制解释，都不作为本书的理论依据。源材料保留供复核，不直接清洗成新的确定事实。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b\" rel=\"noopener noreferrer\" target=\"_blank\">原教程仓库固定版本<\/a><\/p>\n<p>[2] 本会话已提供的文字复审ZIP；交付工作区内同字节副本<code>sources/tutorial-text-review-source.zip<\/code>。<\/p>\n<p>[3] 用户提供的<code>okf-bundle-ready.zip<\/code>；只用于封装与校验方法，不作为影视创作理论来源。<\/p>\n<\/details>","text":"# 资料范围：本书依据什么，不假装依据什么\n\n## 这不是第二次“逐图审查完成”的声明\n\n本书直接读取的教程材料是上一轮形成并已提供的文字复审包：`ciwei-ai-shortfilm-notes-text-review-overlay-20260917.zip`。共31个文件，其中26份为13组教程的新版方法论与提示词文档，3份为根目录说明与综合方法，另2份为范围与校验元数据。\n\n上一轮复审依据的原仓库版本为`5887b2040f642782ce29473bd6cb8b2f8129458b`。本书不把那个版本与当前仓库主分支混用，也没有重新宣称已经观看原视频、收听原音轨或逐张读到截图像素。原包明确保留了这些限制。\n\n交付工作区的`sources/tutorial-text-review-source.zip`保留这份文字复审输入的原始ZIP字节，便于回看；它仍是文本覆盖包，不是完整原仓库，里面部分原始证据链接需要原仓库环境。文件级读取范围与SHA-256在`qa/scope_manifest.json`中。\n\n## 三层来源，不互相冒充\n\n**第一层：用户资料。** 教程中的操作经验、旧整理的遗漏与纠正，提供本书的问题样本。相应去向见[13组映射](/references/tutorial-map.md)。\n\n**第二层：外部核验。** 第一方工具文档用于说明输入角色、适配和执行边界；原作者或原研究用于建立理论桥梁。访问日期为2026-09-17；网页可能后续更新，本包不是网页全文快照。\n\n**第三层：本次综合。** 六层转译、三稿分工、通感维度、情绪与氛围图谱、六张模板、十二项练习与八个完整案例，均为本次重组或原创设计。它们有可说明的逻辑，不等于已经通过生成实验。\n\n## 本次实际做了什么\n\n读取上述29份Markdown与范围元数据；读取用户提供的`okf-bundle-ready.zip`中的skill、规范、模板与工具脚本；结合第一方资料编写指南；构建离线HTML、知识包、导航skill与校验工具；对实际文件做结构和阅读器检查。\n\n没有调用生图、生视频、语音或音乐生成接口，没有制造成功率、成本降低比例或盲测分数。所有案例中的时长、角色与参考代称都是设计条件，不是已经存在的媒体结果。\n\n## 为什么没有照原13个文件夹再排一次\n\n上一轮按教程整理，适合追溯原例；本次按创作任务整理，适合学习与调用。一条教程可能进入表演、声音、参考分工等多个概念，一种方法也可能融合多条教程。映射保留出处，正文避免原封不动重复13次。\n\n## 哪些内容没有被升级成知识\n\n未确认的原提示词残字、第三方界面型号与限额、口播成功率、未经核实的名人引言，以及“词元按顺序所以画面按顺序执行”等机制解释，都不作为本书的理论依据。源材料保留供复核，不直接清洗成新的确定事实。\n\n# Citations\n\n[1] [原教程仓库固定版本](https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b)\n\n[2] 本会话已提供的文字复审ZIP；交付工作区内同字节副本`sources/tutorial-text-review-source.zip`。\n\n[3] 用户提供的`okf-bundle-ready.zip`；只用于封装与校验方法，不作为影视创作理论来源。","toc":[{"id":"references-corpus-section-0","title":"这不是第二次“逐图审查完成”的声明"},{"id":"references-corpus-section-1","title":"三层来源，不互相冒充"},{"id":"references-corpus-section-2","title":"本次实际做了什么"},{"id":"references-corpus-section-3","title":"为什么没有照原13个文件夹再排一次"},{"id":"references-corpus-section-4","title":"哪些内容没有被升级成知识"}]},{"id":"references/official-image","path":"references/official-image.md","title":"第一方依据：图像提示与图像编辑","description":"核验当前图像工具的写法与编辑边界，不作模型优劣排名。","type":"Reference","group":"references","tags":["官方","生图","编辑"],"html":"<h1>第一方依据：图像提示与图像编辑<\/h1>\n<p>访问与核验日期：2026-09-17。只摘要与本书有关的有限内容，不复制官方长篇示例。链接是动态页面，未来调用需重新核对。<\/p>\n<h2 id=\"references-official-image-section-0\">I01｜Midjourney：Prompt Basics<\/h2>\n<p>官方基础指南仍强调简洁清楚的表达，短句通常比很长的指令清单更合适。由此可反对“当代提示必须改成长段自然语言，关键词已全部失效”的泛化。[1]<\/p>\n<p><strong>在本书中的用途<\/strong>：提醒创作者把丰富构思与工具输入分开，不把一种写法宣布为所有系统的未来。<\/p>\n<p><strong>不支持<\/strong>：任何特定模型在某任务上的优势；删掉某个词必然改善画面。<\/p>\n<h2 id=\"references-official-image-section-1\">I02｜Google：Gemini图像生成指南<\/h2>\n<p>官方文档包含风格化图像、文字与图像联合编辑等用法，并通过主体、媒介、细节及修改目标组织描述。[2]<\/p>\n<p><strong>用途<\/strong>：图像任务可以用自然说明交代关系与修改，但应按实际任务组织，而非只改变句子长度。<\/p>\n<p><strong>不支持<\/strong>：每个接口都能分离身份、风格、布局；一次编辑能绝对锁住全部非目标像素。<\/p>\n<h2 id=\"references-official-image-section-2\">I03｜OpenAI：Image generation<\/h2>\n<p>官方图像编辑文档说明蒙版可指导编辑，但其形状不一定被精确遵循；多图输入时也有特定蒙版应用规则。[3]<\/p>\n<p><strong>用途<\/strong>：区分视觉打标、原生蒙版与后期精确合成。重要非编辑区域仍需比较。<\/p>\n<p><strong>不支持<\/strong>：所有图像生成系统使用相同蒙版机制；写出“绝对不变”就能获得像素级保证。<\/p>\n<h2 id=\"references-official-image-section-3\">I04｜Runway：Gen-4 Image Prompting Guide<\/h2>\n<p>该版本图像指南同时讨论描述性句子与关键词组织。[4] 它再次说明，工具、模式和任务比“新派/旧派写法”二分更有实际意义。<\/p>\n<p><strong>版本边界<\/strong>：这里明确指Gen-4 Image相关指南，不宣称是该公司的全部最新模型规则。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://docs.midjourney.com/hc/en-us/articles/32023408776205-Prompt-Basics\" rel=\"noopener noreferrer\" target=\"_blank\">Midjourney — Prompt Basics<\/a><\/p>\n<p>[2] <a href=\"https://ai.google.dev/gemini-api/docs/image-generation\" rel=\"noopener noreferrer\" target=\"_blank\">Google — Image generation with Gemini<\/a><\/p>\n<p>[3] <a href=\"https://developers.openai.com/api/docs/guides/image-generation\" rel=\"noopener noreferrer\" target=\"_blank\">OpenAI — Image generation，Edit an image using a mask<\/a><\/p>\n<p>[4] <a href=\"https://help.runwayml.com/hc/en-us/articles/35694045317139-Gen-4-Image-Prompting-Guide\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Gen-4 Image Prompting Guide<\/a><\/p>\n<\/details>","text":"# 第一方依据：图像提示与图像编辑\n\n访问与核验日期：2026-09-17。只摘要与本书有关的有限内容，不复制官方长篇示例。链接是动态页面，未来调用需重新核对。\n\n## I01｜Midjourney：Prompt Basics\n\n官方基础指南仍强调简洁清楚的表达，短句通常比很长的指令清单更合适。由此可反对“当代提示必须改成长段自然语言，关键词已全部失效”的泛化。[1]\n\n**在本书中的用途**：提醒创作者把丰富构思与工具输入分开，不把一种写法宣布为所有系统的未来。\n\n**不支持**：任何特定模型在某任务上的优势；删掉某个词必然改善画面。\n\n## I02｜Google：Gemini图像生成指南\n\n官方文档包含风格化图像、文字与图像联合编辑等用法，并通过主体、媒介、细节及修改目标组织描述。[2]\n\n**用途**：图像任务可以用自然说明交代关系与修改，但应按实际任务组织，而非只改变句子长度。\n\n**不支持**：每个接口都能分离身份、风格、布局；一次编辑能绝对锁住全部非目标像素。\n\n## I03｜OpenAI：Image generation\n\n官方图像编辑文档说明蒙版可指导编辑，但其形状不一定被精确遵循；多图输入时也有特定蒙版应用规则。[3]\n\n**用途**：区分视觉打标、原生蒙版与后期精确合成。重要非编辑区域仍需比较。\n\n**不支持**：所有图像生成系统使用相同蒙版机制；写出“绝对不变”就能获得像素级保证。\n\n## I04｜Runway：Gen-4 Image Prompting Guide\n\n该版本图像指南同时讨论描述性句子与关键词组织。[4] 它再次说明，工具、模式和任务比“新派/旧派写法”二分更有实际意义。\n\n**版本边界**：这里明确指Gen-4 Image相关指南，不宣称是该公司的全部最新模型规则。\n\n# Citations\n\n[1] [Midjourney — Prompt Basics](https://docs.midjourney.com/hc/en-us/articles/32023408776205-Prompt-Basics)\n\n[2] [Google — Image generation with Gemini](https://ai.google.dev/gemini-api/docs/image-generation)\n\n[3] [OpenAI — Image generation，Edit an image using a mask](https://developers.openai.com/api/docs/guides/image-generation)\n\n[4] [Runway — Gen-4 Image Prompting Guide](https://help.runwayml.com/hc/en-us/articles/35694045317139-Gen-4-Image-Prompting-Guide)","toc":[{"id":"references-official-image-section-0","title":"I01｜Midjourney：Prompt Basics"},{"id":"references-official-image-section-1","title":"I02｜Google：Gemini图像生成指南"},{"id":"references-official-image-section-2","title":"I03｜OpenAI：Image generation"},{"id":"references-official-image-section-3","title":"I04｜Runway：Gen-4 Image Prompting Guide"}]},{"id":"references/official-video","path":"references/official-video.md","title":"第一方依据：视频提示、运动与任务适配","description":"记录当前指导和历史参考的区别，避免把供应商建议提升为通用机制。","type":"Reference","group":"references","tags":["官方","视频","版本"],"html":"<h1>第一方依据：视频提示、运动与任务适配<\/h1>\n<p>访问与核验日期：2026-09-17。没有做供应商横向性能测试，不提供当前模型排名、价格、生成限额或保证时长。<\/p>\n<h2 id=\"references-official-video-section-0\">V01｜Runway：Image to Video Prompting Guide<\/h2>\n<p>官方指南把输入图像作为静态视觉条件，提示主要描述运动、相机变化与时间推进。[1]<\/p>\n<p><strong>用途<\/strong>：本书区分首帧接续与从零生视频，提醒不要忽略首帧的姿势和构图。<\/p>\n<p><strong>不支持<\/strong>：所有多模态身份参考都等于首帧；文字总能覆盖参考图；本书所写动作必然执行。<\/p>\n<h2 id=\"references-official-video-section-1\">V02｜Runway：Text to Video与Introduction to Prompting<\/h2>\n<p>官方资料讨论清楚的描述、时间安排与渐进迭代。[2][3] 本书据此保留简洁起步和按任务增加信息，但不将某一提示长度设为唯一规则。<\/p>\n<h2 id=\"references-official-video-section-2\">V03｜Runway：Gen-4 Video Prompting Guide<\/h2>\n<p>这一版本的指南偏向正向表述，并建议从简单动作逐步添加内容。[4]<\/p>\n<p><strong>重要边界<\/strong>：这不是“所有视频模型不支持负向提示”的证据。具体模型与入口应单独核实。<\/p>\n<h2 id=\"references-official-video-section-3\">V04｜Google：视频提示指南<\/h2>\n<p>官方指南按主体、动作、环境和拍摄方式等维度说明输入，也提醒部分高级镜头与光学效果的可靠性可能变化。[5]<\/p>\n<p><strong>用途<\/strong>：把镜头移动、旋转、变焦与观看范围分开描述；专业术语应服务可观察的画面。<\/p>\n<p><strong>不支持<\/strong>：在文本里写焦距就一定获得准确透视；每个模型或聚合平台接口有相同能力。<\/p>\n<h2 id=\"references-official-video-section-4\">V05｜OpenAI：Sora2 Prompting Guide，历史创作参考<\/h2>\n<p>核验时页面已明确标为归档，可能涉及过时模型与API。[6] 本书仅借用其中“详细控制与创作开放均可有效，提示是指导而非保证”的创作层思路。<\/p>\n<p><strong>不作为<\/strong>当前产品是否可用、实际模型规格、生成长度、调用方法或价格的依据。<\/p>\n<h2 id=\"references-official-video-section-5\">本书主动不采用的推论<\/h2>\n<p>未从这些页面推出“模型按提示词顺序逐句执行摄影机与演员动作”，也不声称知道具体模型内部为何偏好某个词。建议、经验与内部机制是不同层级。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Image to Video Prompting Guide<\/a><\/p>\n<p>[2] <a href=\"https://help.runwayml.com/hc/en-us/articles/42460036199443-Text-to-Video-Prompting-Guide\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Text to Video Prompting Guide<\/a><\/p>\n<p>[3] <a href=\"https://help.runwayml.com/hc/en-us/articles/46182941379347-Introduction-to-Prompting\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Introduction to Prompting<\/a><\/p>\n<p>[4] <a href=\"https://help.runwayml.com/hc/en-us/articles/39789879462419-Gen-4-Video-Prompting-Guide\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Gen-4 Video Prompting Guide<\/a><\/p>\n<p>[5] <a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/video/video-gen-prompt-guide\" rel=\"noopener noreferrer\" target=\"_blank\">Google — Video generation prompt guide<\/a><\/p>\n<p>[6] <a href=\"https://developers.openai.com/cookbook/examples/sora/sora2_prompting_guide\" rel=\"noopener noreferrer\" target=\"_blank\">OpenAI — Sora2 Prompting Guide，已归档<\/a><\/p>\n<\/details>","text":"# 第一方依据：视频提示、运动与任务适配\n\n访问与核验日期：2026-09-17。没有做供应商横向性能测试，不提供当前模型排名、价格、生成限额或保证时长。\n\n## V01｜Runway：Image to Video Prompting Guide\n\n官方指南把输入图像作为静态视觉条件，提示主要描述运动、相机变化与时间推进。[1]\n\n**用途**：本书区分首帧接续与从零生视频，提醒不要忽略首帧的姿势和构图。\n\n**不支持**：所有多模态身份参考都等于首帧；文字总能覆盖参考图；本书所写动作必然执行。\n\n## V02｜Runway：Text to Video与Introduction to Prompting\n\n官方资料讨论清楚的描述、时间安排与渐进迭代。[2][3] 本书据此保留简洁起步和按任务增加信息，但不将某一提示长度设为唯一规则。\n\n## V03｜Runway：Gen-4 Video Prompting Guide\n\n这一版本的指南偏向正向表述，并建议从简单动作逐步添加内容。[4]\n\n**重要边界**：这不是“所有视频模型不支持负向提示”的证据。具体模型与入口应单独核实。\n\n## V04｜Google：视频提示指南\n\n官方指南按主体、动作、环境和拍摄方式等维度说明输入，也提醒部分高级镜头与光学效果的可靠性可能变化。[5]\n\n**用途**：把镜头移动、旋转、变焦与观看范围分开描述；专业术语应服务可观察的画面。\n\n**不支持**：在文本里写焦距就一定获得准确透视；每个模型或聚合平台接口有相同能力。\n\n## V05｜OpenAI：Sora2 Prompting Guide，历史创作参考\n\n核验时页面已明确标为归档，可能涉及过时模型与API。[6] 本书仅借用其中“详细控制与创作开放均可有效，提示是指导而非保证”的创作层思路。\n\n**不作为**当前产品是否可用、实际模型规格、生成长度、调用方法或价格的依据。\n\n## 本书主动不采用的推论\n\n未从这些页面推出“模型按提示词顺序逐句执行摄影机与演员动作”，也不声称知道具体模型内部为何偏好某个词。建议、经验与内部机制是不同层级。\n\n# Citations\n\n[1] [Runway — Image to Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide)\n\n[2] [Runway — Text to Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/42460036199443-Text-to-Video-Prompting-Guide)\n\n[3] [Runway — Introduction to Prompting](https://help.runwayml.com/hc/en-us/articles/46182941379347-Introduction-to-Prompting)\n\n[4] [Runway — Gen-4 Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/39789879462419-Gen-4-Video-Prompting-Guide)\n\n[5] [Google — Video generation prompt guide](https://cloud.google.com/vertex-ai/generative-ai/docs/video/video-gen-prompt-guide)\n\n[6] [OpenAI — Sora2 Prompting Guide，已归档](https://developers.openai.com/cookbook/examples/sora/sora2_prompting_guide)","toc":[{"id":"references-official-video-section-0","title":"V01｜Runway：Image to Video Prompting Guide"},{"id":"references-official-video-section-1","title":"V02｜Runway：Text to Video与Introduction to Prompting"},{"id":"references-official-video-section-2","title":"V03｜Runway：Gen-4 Video Prompting Guide"},{"id":"references-official-video-section-3","title":"V04｜Google：视频提示指南"},{"id":"references-official-video-section-4","title":"V05｜OpenAI：Sora2 Prompting Guide，历史创作参考"},{"id":"references-official-video-section-5","title":"本书主动不采用的推论"}]},{"id":"references/official-voice-light","path":"references/official-voice-light.md","title":"第一方依据：配音停顿与灯光软硬","description":"只校准容易误传的技术概念，不用软件文档证明艺术效果。","type":"Reference","group":"references","tags":["官方","配音","光线"],"html":"<h1>第一方依据：配音停顿与灯光软硬<\/h1>\n<p>访问与核验日期：2026-09-17。<\/p>\n<h2 id=\"references-official-voice-light-section-0\">A01｜ElevenLabs：停顿与模型语法<\/h2>\n<p>官方说明区分不同模型的停顿控制方式：Eleven v3使用相关音频标签而非相同的SSML break方法；其他适用模型的支持不同，标点形成的停顿也不如专门控制稳定。[1][2]<\/p>\n<p><strong>本书据此提醒<\/strong>：别把“……”当成跨工具固定0.3秒；台词与说明应按实际接口分离，时长需要试听确认。<\/p>\n<p><strong>并未推出<\/strong>：哪种声线更真实、哪种情绪提示效果最好，也没有提供所有供应商通用的标签表。<\/p>\n<h2 id=\"references-official-voice-light-section-1\">L01｜Blender：Light Objects<\/h2>\n<p>本次成功核验的是Blender 5.2 LTS多语言手册页面，其中相关灯光说明为英文。手册将光源功率与半径/尺寸分开说明：尺寸影响阴影软硬；聚光光束边缘与物体投影边缘也不是一回事。[3]<\/p>\n<p><strong>本书据此校准<\/strong>：硬光不等于亮，光源方向不等于轮廓效果，百叶窗不是硬光成立的前提。<\/p>\n<p><strong>并未推出<\/strong>：AI视频内部按Blender的渲染器计算，或任何提示能获得摄影测量级的精度。涉及材质、拍摄与后期的具体设计，仍是本书的创作建议。<\/p>\n<h2 id=\"references-official-voice-light-section-2\">核验路径说明<\/h2>\n<p>此前复审包保留了旧版Blender英文链接。本次该入口读取未成功，因此没有宣称本次重新读到那个旧页面，改用成功取得的5.2 LTS页面核验稳定概念。不由此推荐特定软件版本。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://elevenlabs.io/docs/help-center/product/core-capabilities/text-to-speech/how-can-i-add-pauses\" rel=\"noopener noreferrer\" target=\"_blank\">ElevenLabs — How can I add pauses?<\/a><\/p>\n<p>[2] <a href=\"https://elevenlabs.io/docs/help-center/technical/do-pauses-and-ssml-phoneme-tags-work-with-the-api\" rel=\"noopener noreferrer\" target=\"_blank\">ElevenLabs — Do pauses and SSML phoneme tags work with the API?<\/a><\/p>\n<p>[3] <a href=\"https://docs.blender.org/manual/nl/5.2/render/lights/light_object.html\" rel=\"noopener noreferrer\" target=\"_blank\">Blender 5.2 LTS Manual — Light Objects<\/a><\/p>\n<\/details>","text":"# 第一方依据：配音停顿与灯光软硬\n\n访问与核验日期：2026-09-17。\n\n## A01｜ElevenLabs：停顿与模型语法\n\n官方说明区分不同模型的停顿控制方式：Eleven v3使用相关音频标签而非相同的SSML break方法；其他适用模型的支持不同，标点形成的停顿也不如专门控制稳定。[1][2]\n\n**本书据此提醒**：别把“……”当成跨工具固定0.3秒；台词与说明应按实际接口分离，时长需要试听确认。\n\n**并未推出**：哪种声线更真实、哪种情绪提示效果最好，也没有提供所有供应商通用的标签表。\n\n## L01｜Blender：Light Objects\n\n本次成功核验的是Blender 5.2 LTS多语言手册页面，其中相关灯光说明为英文。手册将光源功率与半径/尺寸分开说明：尺寸影响阴影软硬；聚光光束边缘与物体投影边缘也不是一回事。[3]\n\n**本书据此校准**：硬光不等于亮，光源方向不等于轮廓效果，百叶窗不是硬光成立的前提。\n\n**并未推出**：AI视频内部按Blender的渲染器计算，或任何提示能获得摄影测量级的精度。涉及材质、拍摄与后期的具体设计，仍是本书的创作建议。\n\n## 核验路径说明\n\n此前复审包保留了旧版Blender英文链接。本次该入口读取未成功，因此没有宣称本次重新读到那个旧页面，改用成功取得的5.2 LTS页面核验稳定概念。不由此推荐特定软件版本。\n\n# Citations\n\n[1] [ElevenLabs — How can I add pauses?](https://elevenlabs.io/docs/help-center/product/core-capabilities/text-to-speech/how-can-i-add-pauses)\n\n[2] [ElevenLabs — Do pauses and SSML phoneme tags work with the API?](https://elevenlabs.io/docs/help-center/technical/do-pauses-and-ssml-phoneme-tags-work-with-the-api)\n\n[3] [Blender 5.2 LTS Manual — Light Objects](https://docs.blender.org/manual/nl/5.2/render/lights/light_object.html)","toc":[{"id":"references-official-voice-light-section-0","title":"A01｜ElevenLabs：停顿与模型语法"},{"id":"references-official-voice-light-section-1","title":"L01｜Blender：Light Objects"},{"id":"references-official-voice-light-section-2","title":"核验路径说明"}]},{"id":"references/okf","path":"references/okf.md","title":"封装与维护：按上传skill的OKF v0.1交付","description":"说明知识包、派生阅读器、校验器与索引的各自职责，不混同规范与团队约定。","type":"Reference","group":"references","tags":["OKF","维护","格式","skill"],"html":"<h1>封装与维护：按上传skill的OKF v0.1交付<\/h1>\n<h2 id=\"references-okf-section-0\">本包采用哪个版本<\/h2>\n<p>用户上传的<code>okf-bundle-ready.zip<\/code>明确要求按OKF v0.1组织并运行随附校验器。本次以此作为兼容目标，不擅自升级。核验到的公开OKF仓库已迁移，当前公开规范包含v0.2；这里不宣称兼容目标就是最新版本。[1][2]<\/p>\n<h2 id=\"references-okf-section-1\">哪些是规范，哪些是本书的选择<\/h2>\n<p>每个概念Markdown有YAML frontmatter与非空<code>type<\/code>。包根<code>index.md<\/code>只声明<code>okf_version: \"0.1\"<\/code>；子目录索引不带frontmatter；<code>log.md<\/code>按日期记录。本书的来源放在<code># Citations<\/code>，并用包根相对Markdown链接关联概念。<\/p>\n<p><code>title<\/code>、<code>description<\/code>、<code>tags<\/code>、<code>timestamp<\/code>为便于阅读与检索的字段；<code>source<\/code>是本地来源扩展，不是规范必填。概念ID由文件路径得到，没有伪造必填ID体系。<\/p>\n<p>本地type词表：<code>Framework<\/code>为框架；<code>Technique<\/code>为技巧；<code>Lexicon<\/code>为图谱；<code>Playbook<\/code>为流程与工具；<code>CaseStudy<\/code>为案例；<code>Exercise<\/code>为练习；<code>Reference<\/code>为来源。它们是本包约定，不是全局标准。<\/p>\n<h2 id=\"references-okf-section-2\">谁是内容源<\/h2>\n<p><code>knowledge/contemporary-prompting/<\/code>中的Markdown是可编辑内容源；<code>开始阅读.html<\/code>由这些文件生成，是离线阅读副本。不要只改HTML后宣称知识库已更新。<\/p>\n<p><code>OKF-INDEX.md<\/code>是本地交付工作区的登记索引，不是知识包内的规范文件，也没有写入用户的GitHub或持久Library。附带消费skill只导航知识，没有自动执行、联网或生成权限。<\/p>\n<h2 id=\"references-okf-section-3\">校验与更新<\/h2>\n<p>在交付根目录中，可运行：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-bash\">python scripts/okf_tools.py validate knowledge/contemporary-prompting --verbose\npython scripts/build_reader.py\npython scripts/verify.py\n<\/code><\/pre>\n<p>需要刷新工作区索引时运行：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-bash\">python scripts/refresh_index.py\n<\/code><\/pre>\n<p>阅读HTML与Markdown不需安装依赖；重建和校验所需Python包列在根目录<code>requirements.txt<\/code>。脚本不调用生成服务，不联网，也不改来源ZIP。<\/p>\n<p>用户提供的原校验器以绝对路径保存索引条目。本包附的<code>refresh_index.py<\/code>会把本包登记迁到解压后的实际位置，避免因目录移动出现旧条目；这属于交付辅助，不是OKF规范。<\/p>\n<h2 id=\"references-okf-section-4\">需要使用者确认的高价值项<\/h2>\n<p>六层框架和图谱是否适合你的项目类型，需要实作；情绪词的具体读法需要目标语境；工具接口与音频标签需要在实际调用前核对。这些不以文件格式检查替代。<\/p>\n<p>v0.2采用不同的来源与生成元数据字段；未来迁移应按公开规范映射，不直接改一个版本号。当前包保留v0.1，使你上传的skill可以继续验证。[2]<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] 用户上传<code>okf-bundle-ready.zip<\/code>内：<code>SKILL.md<\/code>、<code>references/okf-spec.md<\/code>、<code>references/templates.md<\/code>、<code>scripts/okf_tools.py<\/code>。<\/p>\n<p>[2] <a href=\"https://github.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC.md\" rel=\"noopener noreferrer\" target=\"_blank\">Open Knowledge Format — 当前公开SPEC及v0.1迁移说明<\/a><\/p>\n<p>[3] <a href=\"https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/README.md\" rel=\"noopener noreferrer\" target=\"_blank\">原knowledge-catalog/okf仓库的迁移说明<\/a><\/p>\n<\/details>","text":"# 封装与维护：按上传skill的OKF v0.1交付\n\n## 本包采用哪个版本\n\n用户上传的`okf-bundle-ready.zip`明确要求按OKF v0.1组织并运行随附校验器。本次以此作为兼容目标，不擅自升级。核验到的公开OKF仓库已迁移，当前公开规范包含v0.2；这里不宣称兼容目标就是最新版本。[1][2]\n\n## 哪些是规范，哪些是本书的选择\n\n每个概念Markdown有YAML frontmatter与非空`type`。包根`index.md`只声明`okf_version: \"0.1\"`；子目录索引不带frontmatter；`log.md`按日期记录。本书的来源放在`# Citations`，并用包根相对Markdown链接关联概念。\n\n`title`、`description`、`tags`、`timestamp`为便于阅读与检索的字段；`source`是本地来源扩展，不是规范必填。概念ID由文件路径得到，没有伪造必填ID体系。\n\n本地type词表：`Framework`为框架；`Technique`为技巧；`Lexicon`为图谱；`Playbook`为流程与工具；`CaseStudy`为案例；`Exercise`为练习；`Reference`为来源。它们是本包约定，不是全局标准。\n\n## 谁是内容源\n\n`knowledge/contemporary-prompting/`中的Markdown是可编辑内容源；`开始阅读.html`由这些文件生成，是离线阅读副本。不要只改HTML后宣称知识库已更新。\n\n`OKF-INDEX.md`是本地交付工作区的登记索引，不是知识包内的规范文件，也没有写入用户的GitHub或持久Library。附带消费skill只导航知识，没有自动执行、联网或生成权限。\n\n## 校验与更新\n\n在交付根目录中，可运行：\n\n```bash\npython scripts/okf_tools.py validate knowledge/contemporary-prompting --verbose\npython scripts/build_reader.py\npython scripts/verify.py\n```\n\n需要刷新工作区索引时运行：\n\n```bash\npython scripts/refresh_index.py\n```\n\n阅读HTML与Markdown不需安装依赖；重建和校验所需Python包列在根目录`requirements.txt`。脚本不调用生成服务，不联网，也不改来源ZIP。\n\n用户提供的原校验器以绝对路径保存索引条目。本包附的`refresh_index.py`会把本包登记迁到解压后的实际位置，避免因目录移动出现旧条目；这属于交付辅助，不是OKF规范。\n\n## 需要使用者确认的高价值项\n\n六层框架和图谱是否适合你的项目类型，需要实作；情绪词的具体读法需要目标语境；工具接口与音频标签需要在实际调用前核对。这些不以文件格式检查替代。\n\nv0.2采用不同的来源与生成元数据字段；未来迁移应按公开规范映射，不直接改一个版本号。当前包保留v0.1，使你上传的skill可以继续验证。[2]\n\n# Citations\n\n[1] 用户上传`okf-bundle-ready.zip`内：`SKILL.md`、`references/okf-spec.md`、`references/templates.md`、`scripts/okf_tools.py`。\n\n[2] [Open Knowledge Format — 当前公开SPEC及v0.1迁移说明](https://github.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC.md)\n\n[3] [原knowledge-catalog/okf仓库的迁移说明](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/README.md)","toc":[{"id":"references-okf-section-0","title":"本包采用哪个版本"},{"id":"references-okf-section-1","title":"哪些是规范，哪些是本书的选择"},{"id":"references-okf-section-2","title":"谁是内容源"},{"id":"references-okf-section-3","title":"校验与更新"},{"id":"references-okf-section-4","title":"需要使用者确认的高价值项"}]},{"id":"references/theory","path":"references/theory.md","title":"理论桥梁：借已有知识，不借虚假的权威","description":"将感知、设计与电影分析接入提示实践，并明确哪些是本书的新推论。","type":"Reference","group":"references","tags":["理论","研究","假设","通感"],"html":"<h1>理论桥梁：借已有知识，不借虚假的权威<\/h1>\n<h2 id=\"references-theory-section-0\">不必先宣布新学科，才有系统方法<\/h2>\n<p>当代提示实践确有新的跨媒介与工具适配问题。但我们可以先把问题组织清楚：体验如何变成材料，材料如何让人接收到信息，输入如何被不确定的工具实现，结果怎样反过来修正选择。<\/p>\n<p>下面四项是直接查阅的原研究或作者原文。它们各支持一座小桥，不提供对所有AI提示的总证明。<\/p>\n<h2 id=\"references-theory-section-1\">T01｜跨感官对应与情绪联想<\/h2>\n<p>Palmer等人在2013年的PNAS研究中，让美国与墨西哥参与者将西方古典管弦乐片段与颜色相匹配，结果支持这些匹配与共有情绪维度有关。[1] 这不是“蓝色等于悲伤”的普世规则，更不是一项生成模型提示词实验。<\/p>\n<p><strong>本书的延展<\/strong>：构思音乐、颜色与材料时，可以先找它们共享的重量、明暗、活跃度或张力关系，再设计组合。但具体作品仍需观看与试听；同一颜色和声音在不同情境中可以改变意义。<\/p>\n<p><strong>应用<\/strong>：<a href=\"#/language/01-sensory-translation\">通感转译<\/a>。<\/p>\n<h2 id=\"references-theory-section-2\">T02｜可供性与指示线索<\/h2>\n<p>Don Norman在作者文章《Signifiers, not affordances》中区分“能做什么”的行动可能与“如何感知到可做什么”的线索，强调线索不一定都是设计者故意提供的。[2]<\/p>\n<p><strong>本书的延展<\/strong>：门把、空椅、包带、使用痕迹不仅是装饰，它们可以给角色提供行动任务，也给观众提供解释入口。由此提出“给人物一个可做的事”，不意味着所有镜头必须拿道具，更不意味着能从一张图准确读出角色心理。<\/p>\n<p><strong>应用<\/strong>：<a href=\"#/craft/06-world-art-costume\">美术与世界<\/a>、<a href=\"#/craft/03-action-blocking\">动作与调度<\/a>。<\/p>\n<h2 id=\"references-theory-section-3\">T03｜注意力如何在镜头内部移动<\/h2>\n<p>Tim J. Smith在2011年发表于David Bordwell博客的原分析中，展示了11名观众观看《血色将至》特定片段的眼动观察，并讨论调度、动作与对白怎样参与注意力组织。[3] 这是特定材料上的探索性观察，不是把每个因素独立控制后的普遍因果结论。<\/p>\n<p><strong>本书的延展<\/strong>：关键动作不仅要发生，还要有机会被看到。通过同框大小、遮挡、主次与时间安排，把“提示里写了”转为“观众能接收”。这里提出的是检查方法，不保证所有人都按同一顺序看。<\/p>\n<p><strong>应用<\/strong>：<a href=\"#/craft/04-camera-attention\">摄影机与注意<\/a>。<\/p>\n<h2 id=\"references-theory-section-4\">T04｜固定机位也能组织戏剧<\/h2>\n<p>David Bordwell在《Hands (and faces) across the table》中通过电影分析讨论桌边调度与手、脸的关系，说明镜头内组织本身有表达能力。[4] 这是专业电影分析，不是模型性能证据。<\/p>\n<p><strong>本书的延展<\/strong>：反对把“运动更多”当“表达更多”；固定镜头可以通过人物、物件与声音来组织注意。具体使用仍要看作品目的，而不是以固定镜头取代新的万能运镜。<\/p>\n<p><strong>应用<\/strong>：<a href=\"#/cases/02-relationship\">餐桌案例<\/a>。<\/p>\n<h2 id=\"references-theory-section-5\">五个便于工作的推论：本书提出，尚待实作检验<\/h2>\n<h3 id=\"references-theory-section-6\">推论一：表达是一对多的设计，不是寻找唯一咒语<\/h3>\n<p>同一种体验可以由不同载体实现；同一个素材也可能有多种读法。因此“最优提示”必须相对于任务、工具、素材和评价方式讨论。清爽可以是水，也可以是空间与节奏，不应被锁进一组固定词。<\/p>\n<h3 id=\"references-theory-section-7\">推论二：具体不是越多越好，而是减少关键歧义<\/h3>\n<p>“右手把唯一的杯子放到桌面”比“真实自然动作”更能限定事件；但脚趾、呼吸和每根头发全写出来，不一定增加关键清晰度。提示密度应围绕容易误解的关系分配，而不是均匀加细节。<\/p>\n<h3 id=\"references-theory-section-8\">推论三：一致性是关系持续，不只是长相不变<\/h3>\n<p>身份、物件归属、空间地标、湿干状态、声音习惯与镜头起终点，共同决定一个片段能否接下去。由此强调实际通过的媒体状态，不把文字要求当执行回执。<\/p>\n<h3 id=\"references-theory-section-9\">推论四：通感要允许差异，不要求各部门齐声解释<\/h3>\n<p>画面可以安静，声音可以拥挤；人物可以快乐，音乐可以留余地。不同媒介之间有支持、对照、延迟和独立愉悦，不必每一层都喊同一个情绪词。<\/p>\n<h3 id=\"references-theory-section-10\">推论五：提示实践是反馈循环，不是一次性写作<\/h3>\n<p>创作者提出条件，观察结果，再更新判断。工具的不确定性要求保留失败条件与适用范围，不应把偶然好结果写成固定原理。六层框架提供的是查断点的语言，不是被实验验证的算法。<\/p>\n<h2 id=\"references-theory-section-11\">如何继续发展而不伪装成熟<\/h2>\n<p>为不同任务建立小规模、条件明确的实例集；比较提示改动而非只挑最美样本；区分创意价值、执行稳定性与成本；把不支持的主张撤下。是否形成一个独立的学科，需要持续的研究、作品与共同方法，而不是一个听起来新颖的名称。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://doi.org/10.1073/pnas.1212562110\" rel=\"noopener noreferrer\" target=\"_blank\">Palmer et al., 2013 — Music–color associations are mediated by emotion, PNAS<\/a><\/p>\n<p>[2] <a href=\"https://jnd.org/signifiers-not-affordances/\" rel=\"noopener noreferrer\" target=\"_blank\">Don Norman — Signifiers, not affordances<\/a><\/p>\n<p>[3] <a href=\"https://www.davidbordwell.net/blog/2011/02/14/watching-you-watch-there-will-be-blood/\" rel=\"noopener noreferrer\" target=\"_blank\">Tim J. Smith — Watching you watch THERE WILL BE BLOOD<\/a><\/p>\n<p>[4] <a href=\"https://www.davidbordwell.net/blog/2008/02/13/hands-and-faces-across-the-table/\" rel=\"noopener noreferrer\" target=\"_blank\">David Bordwell — Hands (and faces) across the table<\/a><\/p>\n<\/details>","text":"# 理论桥梁：借已有知识，不借虚假的权威\n\n## 不必先宣布新学科，才有系统方法\n\n当代提示实践确有新的跨媒介与工具适配问题。但我们可以先把问题组织清楚：体验如何变成材料，材料如何让人接收到信息，输入如何被不确定的工具实现，结果怎样反过来修正选择。\n\n下面四项是直接查阅的原研究或作者原文。它们各支持一座小桥，不提供对所有AI提示的总证明。\n\n## T01｜跨感官对应与情绪联想\n\nPalmer等人在2013年的PNAS研究中，让美国与墨西哥参与者将西方古典管弦乐片段与颜色相匹配，结果支持这些匹配与共有情绪维度有关。[1] 这不是“蓝色等于悲伤”的普世规则，更不是一项生成模型提示词实验。\n\n**本书的延展**：构思音乐、颜色与材料时，可以先找它们共享的重量、明暗、活跃度或张力关系，再设计组合。但具体作品仍需观看与试听；同一颜色和声音在不同情境中可以改变意义。\n\n**应用**：[通感转译](/language/01-sensory-translation.md)。\n\n## T02｜可供性与指示线索\n\nDon Norman在作者文章《Signifiers, not affordances》中区分“能做什么”的行动可能与“如何感知到可做什么”的线索，强调线索不一定都是设计者故意提供的。[2]\n\n**本书的延展**：门把、空椅、包带、使用痕迹不仅是装饰，它们可以给角色提供行动任务，也给观众提供解释入口。由此提出“给人物一个可做的事”，不意味着所有镜头必须拿道具，更不意味着能从一张图准确读出角色心理。\n\n**应用**：[美术与世界](/craft/06-world-art-costume.md)、[动作与调度](/craft/03-action-blocking.md)。\n\n## T03｜注意力如何在镜头内部移动\n\nTim J. Smith在2011年发表于David Bordwell博客的原分析中，展示了11名观众观看《血色将至》特定片段的眼动观察，并讨论调度、动作与对白怎样参与注意力组织。[3] 这是特定材料上的探索性观察，不是把每个因素独立控制后的普遍因果结论。\n\n**本书的延展**：关键动作不仅要发生，还要有机会被看到。通过同框大小、遮挡、主次与时间安排，把“提示里写了”转为“观众能接收”。这里提出的是检查方法，不保证所有人都按同一顺序看。\n\n**应用**：[摄影机与注意](/craft/04-camera-attention.md)。\n\n## T04｜固定机位也能组织戏剧\n\nDavid Bordwell在《Hands (and faces) across the table》中通过电影分析讨论桌边调度与手、脸的关系，说明镜头内组织本身有表达能力。[4] 这是专业电影分析，不是模型性能证据。\n\n**本书的延展**：反对把“运动更多”当“表达更多”；固定镜头可以通过人物、物件与声音来组织注意。具体使用仍要看作品目的，而不是以固定镜头取代新的万能运镜。\n\n**应用**：[餐桌案例](/cases/02-relationship.md)。\n\n## 五个便于工作的推论：本书提出，尚待实作检验\n\n### 推论一：表达是一对多的设计，不是寻找唯一咒语\n\n同一种体验可以由不同载体实现；同一个素材也可能有多种读法。因此“最优提示”必须相对于任务、工具、素材和评价方式讨论。清爽可以是水，也可以是空间与节奏，不应被锁进一组固定词。\n\n### 推论二：具体不是越多越好，而是减少关键歧义\n\n“右手把唯一的杯子放到桌面”比“真实自然动作”更能限定事件；但脚趾、呼吸和每根头发全写出来，不一定增加关键清晰度。提示密度应围绕容易误解的关系分配，而不是均匀加细节。\n\n### 推论三：一致性是关系持续，不只是长相不变\n\n身份、物件归属、空间地标、湿干状态、声音习惯与镜头起终点，共同决定一个片段能否接下去。由此强调实际通过的媒体状态，不把文字要求当执行回执。\n\n### 推论四：通感要允许差异，不要求各部门齐声解释\n\n画面可以安静，声音可以拥挤；人物可以快乐，音乐可以留余地。不同媒介之间有支持、对照、延迟和独立愉悦，不必每一层都喊同一个情绪词。\n\n### 推论五：提示实践是反馈循环，不是一次性写作\n\n创作者提出条件，观察结果，再更新判断。工具的不确定性要求保留失败条件与适用范围，不应把偶然好结果写成固定原理。六层框架提供的是查断点的语言，不是被实验验证的算法。\n\n## 如何继续发展而不伪装成熟\n\n为不同任务建立小规模、条件明确的实例集；比较提示改动而非只挑最美样本；区分创意价值、执行稳定性与成本；把不支持的主张撤下。是否形成一个独立的学科，需要持续的研究、作品与共同方法，而不是一个听起来新颖的名称。\n\n# Citations\n\n[1] [Palmer et al., 2013 — Music–color associations are mediated by emotion, PNAS](https://doi.org/10.1073/pnas.1212562110)\n\n[2] [Don Norman — Signifiers, not affordances](https://jnd.org/signifiers-not-affordances/)\n\n[3] [Tim J. Smith — Watching you watch THERE WILL BE BLOOD](https://www.davidbordwell.net/blog/2011/02/14/watching-you-watch-there-will-be-blood/)\n\n[4] [David Bordwell — Hands (and faces) across the table](https://www.davidbordwell.net/blog/2008/02/13/hands-and-faces-across-the-table/)","toc":[{"id":"references-theory-section-0","title":"不必先宣布新学科，才有系统方法"},{"id":"references-theory-section-1","title":"T01｜跨感官对应与情绪联想"},{"id":"references-theory-section-2","title":"T02｜可供性与指示线索"},{"id":"references-theory-section-3","title":"T03｜注意力如何在镜头内部移动"},{"id":"references-theory-section-4","title":"T04｜固定机位也能组织戏剧"},{"id":"references-theory-section-5","title":"五个便于工作的推论：本书提出，尚待实作检验"},{"id":"references-theory-section-11","title":"如何继续发展而不伪装成熟"}]},{"id":"references/tutorial-map","path":"references/tutorial-map.md","title":"来源映射：13组教程进入了哪些知识","description":"保留全组覆盖与上游路径，区分教程主张、复审修正和本次综合。","type":"Reference","group":"references","tags":["13组","追溯","映射"],"html":"<h1>来源映射：13组教程进入了哪些知识<\/h1>\n<h2 id=\"references-tutorial-map-section-0\">怎么用这张映射<\/h2>\n<p>本表说明每组教程的问题怎样进入指南。它是主题覆盖，不是逐字复原或本次新增的视觉核验。各组直接输入均为文字复审包中的<code>方法论与技术要点.md<\/code>和<code>提示词提取.md<\/code>，没有跳过任何组。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>组<\/th>\n<th>原主题<\/th>\n<th>本书保留并校准的核心<\/th>\n<th>主要去向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>复杂运镜与Previs<\/td>\n<td>把信息可读性、人物路线、道具状态与机位分开；不把粗模等同最终准确。<\/td>\n<td><a href=\"#/workflows/06-previs\">预演<\/a>、<a href=\"#/cases/08-object-exchange\">文件交接<\/a><\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>配音去机器味<\/td>\n<td>稳定声线与当场说话策略分离，台词先顺，再控制语气与节奏。<\/td>\n<td><a href=\"#/craft/02-dialogue-voice\">台词与声音<\/a>、<a href=\"#/language/04-emotion-atlas\">情绪图谱<\/a><\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td>减少AI味<\/td>\n<td>拆开底图、运动、光照与剪辑问题，不建立永久模型排名。<\/td>\n<td><a href=\"#/workflows/07-evaluate-repair\">评价修复<\/a>、<a href=\"#/craft/05-light-material\">光与材质<\/a><\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td>反向表演<\/td>\n<td>从任务、对象与反应出发；隐藏情绪是一种选择，不是优越范式。<\/td>\n<td><a href=\"#/craft/01-acting\">表演<\/a>、<a href=\"#/cases/02-relationship\">餐桌关系<\/a><\/td>\n<\/tr>\n<tr>\n<td>05<\/td>\n<td>新的提示组织<\/td>\n<td>内容、素材分工、基调与节拍；区分创作语言和真实接口设置。<\/td>\n<td><a href=\"#/foundations/03-three-drafts\">三种稿子<\/a>、<a href=\"#/workflows/08-model-adaptation\">工具适配<\/a><\/td>\n<\/tr>\n<tr>\n<td>06<\/td>\n<td>长片方法拆解<\/td>\n<td>身份、造型、状态、声音、行为与场景拓扑共同复用；规模来自交接。<\/td>\n<td><a href=\"#/workflows/05-assets-multishot\">多镜头资产<\/a>、<a href=\"#/craft/03-action-blocking\">动作与状态<\/a><\/td>\n<\/tr>\n<tr>\n<td>07<\/td>\n<td>活人感与Vlog<\/td>\n<td>编号必须对应真实素材；视点、手位、转场和道具状态不能混写。<\/td>\n<td><a href=\"#/cases/04-vlog\">Vlog<\/a>、<a href=\"#/craft/04-camera-attention\">镜头选择<\/a><\/td>\n<\/tr>\n<tr>\n<td>08<\/td>\n<td>资产库<\/td>\n<td>库可丰富，输入需精选；视图可读性比固定横竖版更重要。<\/td>\n<td><a href=\"#/workflows/05-assets-multishot\">资产<\/a>、<a href=\"#/craft/06-world-art-costume\">美术与妆造<\/a><\/td>\n<\/tr>\n<tr>\n<td>09<\/td>\n<td>指定修改图像<\/td>\n<td>指认、操作、保留项与前后状态分离；标记不等于精确蒙版。<\/td>\n<td><a href=\"#/workflows/03-image-edit\">改图<\/a>、<a href=\"#/practice/01-templates\">工具箱<\/a><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>低角度与现场感<\/td>\n<td>把高度、俯仰、移动和取景分清；低机位不是唯一真实路线。<\/td>\n<td><a href=\"#/craft/04-camera-attention\">摄影机<\/a>、<a href=\"#/cases/05-empty-corridor\">固定空镜<\/a><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>身份与妆造<\/td>\n<td>身份、场合、物理经历和主动选择决定造型，而非性别硬分工。<\/td>\n<td><a href=\"#/craft/06-world-art-costume\">妆造<\/a>、<a href=\"#/workflows/05-assets-multishot\">状态延续<\/a><\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>动作生命力<\/td>\n<td>主动作、跟随动态、细微反应有主从；声音与后期接续同一意图。<\/td>\n<td><a href=\"#/craft/01-acting\">表演<\/a>、<a href=\"#/cases/03-big-emotion\">外放喜悦<\/a><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>光线质感<\/td>\n<td>分清方向、光质和边缘效果，跟踪光源与材质状态，不把硬光等同百叶窗。<\/td>\n<td><a href=\"#/craft/05-light-material\">照明<\/a>、<a href=\"#/cases/06-surreal-perfume\">风格化主视觉<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"references-tutorial-map-section-1\">跨组后才看见的四个关键关系<\/h2>\n<p><strong>“写细”与“别写太细”不矛盾<\/strong>：关键因果、接触和观看条件要细，自然过渡不必逐帧指定。<\/p>\n<p><strong>“资产丰富”与“提示简洁”不矛盾<\/strong>：丰富发生在准备库，简洁发生在当前镜头所选输入。<\/p>\n<p><strong>“真实感”与“精致风格”不矛盾<\/strong>：先判断目标是生活、广告还是超现实，再定义自洽的标准。<\/p>\n<p><strong>“让AI构思”与“守住批准方案”不矛盾<\/strong>：探索时开放，执行时不擅自换题，发现问题再明确提出变更。<\/p>\n<p>这四点是本次跨教程综合，不是原作者逐字提出的共同理论。<\/p>\n<h2 id=\"references-tutorial-map-section-2\">原文件夹追溯<\/h2>\n<p>下列链接指向原仓库固定版本，用于回到上游；本次直接读取的新版文字则保存在工作区<code>sources/tutorial-text-review-source.zip<\/code>的相同目录下。二者内容层级不同，不能把新版观点倒推为原作者已说过。<\/p>\n<ul>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/01-6aabb8c8000000002a0265bf-%E6%8B%92%E7%BB%9D%E6%8A%BD%E5%8D%A1%EF%BC%81%E4%B8%80%E6%8B%9B%E6%95%99%E4%BD%A0%E7%94%A8Codex%E7%B2%BE%E5%87%86%E6%8E%A7%E5%88%B6AI%E8%BF%90%E9%95%9C\" rel=\"noopener noreferrer\" target=\"_blank\">01-6aabb8c8000000002a0265bf-拒绝抽卡！一招教你用Codex精准控制AI运镜<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/02-6aaa15ec00000000290187a9-%E4%B8%80%E5%BC%80%E5%8F%A3%E5%B0%B1%E9%9C%B2%E9%A6%85%EF%BC%9F3%E6%8B%9B%E5%8E%BB%E6%8E%89AI%E9%85%8D%E9%9F%B3%E7%9A%84%E2%80%9C%E6%9C%BA%E5%99%A8%E5%91%B3%E2%80%9D\" rel=\"noopener noreferrer\" target=\"_blank\">02-6aaa15ec00000000290187a9-一开口就露馅？3招去掉AI配音的“机器味”<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/03-6aa13956000000002b01fe4c-%E9%82%AA%E4%BF%AE%EF%BC%813%E6%AD%A5%E8%AE%A9%E4%BD%A0%E7%9A%84AI%E8%A7%86%E9%A2%91%E5%BD%BB%E5%BA%95%E6%91%86%E8%84%B1AI%E5%91%B3\" rel=\"noopener noreferrer\" target=\"_blank\">03-6aa13956000000002b01fe4c-邪修！3步让你的AI视频彻底摆脱AI味<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/04-6a9aa3ca000000002a02fef4-AI%E4%BA%BA%E7%89%A9%E6%BC%94%E6%8A%80%E5%A4%AA%E7%94%A8%E5%8A%9B%EF%BC%9F%E6%95%99%E4%BD%A0%E5%86%99%E2%80%9C%E5%8F%8D%E5%90%91%E8%A1%A8%E6%BC%94%E2%80%9D\" rel=\"noopener noreferrer\" target=\"_blank\">04-6a9aa3ca000000002a02fef4-AI人物演技太用力？教你写“反向表演”<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/05-6a96a9b90000000026033e1d-AI%E7%94%9F%E5%9B%BE%E5%81%87%EF%BC%9F%E9%82%A3%E6%98%AF%E5%9B%A0%E4%B8%BA%E4%BD%A0%E7%9A%84%E6%8F%90%E7%A4%BA%E8%AF%8D%E8%BF%87%E6%9C%9F%E4%BA%86\" rel=\"noopener noreferrer\" target=\"_blank\">05-6a96a9b90000000026033e1d-AI生图假？那是因为你的提示词过期了<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/06-6a9169a3000000002502577e-AI%E7%94%B5%E5%BD%B1%E5%A4%A7%E6%8B%86%E8%A7%A3%EF%BC%818%E5%A4%A7AI%E6%8A%80%E5%B7%A7%E4%B8%80%E6%AC%A1%E6%80%A7%E8%AE%B2%E5%AE%8C%EF%BC%81\" rel=\"noopener noreferrer\" target=\"_blank\">06-6a9169a3000000002502577e-AI电影大拆解！8大AI技巧一次性讲完！<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/07-6a82f4180000000033031ffb-%E5%B0%8F%E7%99%BD%E5%BF%85%E7%9C%8B%EF%BC%81seedance2_%E6%B4%BB%E4%BA%BA%E6%84%9F%E6%8F%90%E7%A4%BA%E8%AF%8D%E6%80%8E%E4%B9%88%E5%86%99%EF%BC%9F\" rel=\"noopener noreferrer\" target=\"_blank\">07-6a82f4180000000033031ffb-小白必看！seedance2_活人感提示词怎么写？<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/08-6a44fd700000000007020a39-0%E5%9F%BA%E7%A1%80%E6%95%99%E5%AD%A6%21AI%E7%9F%AD%E5%89%A7%E7%9A%84%E2%80%9C%E8%B5%84%E4%BA%A7%E5%BA%93%E2%80%9D%E5%88%B0%E5%BA%95%E6%80%8E%E4%B9%88%E5%81%9A%EF%BC%9F\" rel=\"noopener noreferrer\" target=\"_blank\">08-6a44fd700000000007020a39-0基础教学!AI短剧的“资产库”到底怎么做？<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/09-69d62fa80000000021006bc4-%E7%A7%98%E7%B1%8D%EF%BC%81%E4%B8%80%E6%8B%9B%E6%95%99%E4%BD%A0%E6%8C%87%E5%AE%9A%E6%8F%8F%E8%BF%B0AI%E5%9B%BE%E9%87%8C%E7%9A%84%E5%85%83%E7%B4%A0\" rel=\"noopener noreferrer\" target=\"_blank\">09-69d62fa80000000021006bc4-秘籍！一招教你指定描述AI图里的元素<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/10-69ca589d0000000023010bdf-%E4%B8%80%E4%B8%AA%E6%8F%90%E7%A4%BA%E8%AF%8D%E6%8A%80%E5%B7%A7%EF%BC%8C%E8%AE%A9AI%E8%A7%86%E9%A2%91%E7%9E%AC%E9%97%B4%E6%9C%89%E5%AE%9E%E6%8B%8D%E6%84%9F%EF%BC%81\" rel=\"noopener noreferrer\" target=\"_blank\">10-69ca589d0000000023010bdf-一个提示词技巧，让AI视频瞬间有实拍感！<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b20
