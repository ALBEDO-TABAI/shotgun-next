40f642782ce29473bd6cb8b2f8129458b/11-6a1435c4000000003601d24b-%E5%85%A8%E7%BD%91%E7%8B%AC%E5%AE%B6%EF%BC%81%E5%A6%82%E4%BD%95%E7%94%A8%E5%A6%86%E9%80%A0%E8%AE%A9%E4%BD%A0%E7%9A%84ai%E8%A7%92%E8%89%B2%E6%9B%B4%E9%AB%98%E7%BA%A7%EF%BC%9F\" rel=\"noopener noreferrer\" target=\"_blank\">11-6a1435c4000000003601d24b-全网独家！如何用妆造让你的ai角色更高级？<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/12-6a26b978000000001702fb5c-%E8%BF%9B%E9%98%B6%E6%95%99%E7%A8%8B%EF%BC%81%E5%A6%82%E4%BD%95%E8%AE%A9AI%E5%A5%B3%E9%A2%91%E7%9F%AD%E5%89%A7%E6%9B%B4%E6%9C%89%E7%94%9F%E5%91%BD%E5%8A%9B%EF%BC%9F\" rel=\"noopener noreferrer\" target=\"_blank\">12-6a26b978000000001702fb5c-进阶教程！如何让AI女频短剧更有生命力？<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/13-6a3a6ca9000000000f006cc9-%E5%B0%8F%E7%99%BD%E5%BF%85%E7%9C%8B%EF%BC%81%E5%A6%82%E4%BD%95%E7%94%A8%E5%85%89%E7%BA%BF%E6%8F%90%E5%8D%87AI%E8%A7%86%E9%A2%91%E8%B4%A8%E6%84%9F%EF%BC%9F\" rel=\"noopener noreferrer\" target=\"_blank\">13-6a3a6ca9000000000f006cc9-小白必看！如何用光线提升AI视频质感？<\/a><\/li>\n<\/ul>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">资料范围与证据分层<\/a><\/p>\n<\/details>","text":"# 来源映射：13组教程进入了哪些知识\n\n## 怎么用这张映射\n\n本表说明每组教程的问题怎样进入指南。它是主题覆盖，不是逐字复原或本次新增的视觉核验。各组直接输入均为文字复审包中的`方法论与技术要点.md`和`提示词提取.md`，没有跳过任何组。\n\n| 组 | 原主题 | 本书保留并校准的核心 | 主要去向 |\n| --- | --- | --- | --- |\n| 01 | 复杂运镜与Previs | 把信息可读性、人物路线、道具状态与机位分开；不把粗模等同最终准确。 | [预演](/workflows/06-previs.md)、[文件交接](/cases/08-object-exchange.md) |\n| 02 | 配音去机器味 | 稳定声线与当场说话策略分离，台词先顺，再控制语气与节奏。 | [台词与声音](/craft/02-dialogue-voice.md)、[情绪图谱](/language/04-emotion-atlas.md) |\n| 03 | 减少AI味 | 拆开底图、运动、光照与剪辑问题，不建立永久模型排名。 | [评价修复](/workflows/07-evaluate-repair.md)、[光与材质](/craft/05-light-material.md) |\n| 04 | 反向表演 | 从任务、对象与反应出发；隐藏情绪是一种选择，不是优越范式。 | [表演](/craft/01-acting.md)、[餐桌关系](/cases/02-relationship.md) |\n| 05 | 新的提示组织 | 内容、素材分工、基调与节拍；区分创作语言和真实接口设置。 | [三种稿子](/foundations/03-three-drafts.md)、[工具适配](/workflows/08-model-adaptation.md) |\n| 06 | 长片方法拆解 | 身份、造型、状态、声音、行为与场景拓扑共同复用；规模来自交接。 | [多镜头资产](/workflows/05-assets-multishot.md)、[动作与状态](/craft/03-action-blocking.md) |\n| 07 | 活人感与Vlog | 编号必须对应真实素材；视点、手位、转场和道具状态不能混写。 | [Vlog](/cases/04-vlog.md)、[镜头选择](/craft/04-camera-attention.md) |\n| 08 | 资产库 | 库可丰富，输入需精选；视图可读性比固定横竖版更重要。 | [资产](/workflows/05-assets-multishot.md)、[美术与妆造](/craft/06-world-art-costume.md) |\n| 09 | 指定修改图像 | 指认、操作、保留项与前后状态分离；标记不等于精确蒙版。 | [改图](/workflows/03-image-edit.md)、[工具箱](/practice/01-templates.md) |\n| 10 | 低角度与现场感 | 把高度、俯仰、移动和取景分清；低机位不是唯一真实路线。 | [摄影机](/craft/04-camera-attention.md)、[固定空镜](/cases/05-empty-corridor.md) |\n| 11 | 身份与妆造 | 身份、场合、物理经历和主动选择决定造型，而非性别硬分工。 | [妆造](/craft/06-world-art-costume.md)、[状态延续](/workflows/05-assets-multishot.md) |\n| 12 | 动作生命力 | 主动作、跟随动态、细微反应有主从；声音与后期接续同一意图。 | [表演](/craft/01-acting.md)、[外放喜悦](/cases/03-big-emotion.md) |\n| 13 | 光线质感 | 分清方向、光质和边缘效果，跟踪光源与材质状态，不把硬光等同百叶窗。 | [照明](/craft/05-light-material.md)、[风格化主视觉](/cases/06-surreal-perfume.md) |\n\n## 跨组后才看见的四个关键关系\n\n**“写细”与“别写太细”不矛盾**：关键因果、接触和观看条件要细，自然过渡不必逐帧指定。\n\n**“资产丰富”与“提示简洁”不矛盾**：丰富发生在准备库，简洁发生在当前镜头所选输入。\n\n**“真实感”与“精致风格”不矛盾**：先判断目标是生活、广告还是超现实，再定义自洽的标准。\n\n**“让AI构思”与“守住批准方案”不矛盾**：探索时开放，执行时不擅自换题，发现问题再明确提出变更。\n\n这四点是本次跨教程综合，不是原作者逐字提出的共同理论。\n\n## 原文件夹追溯\n\n下列链接指向原仓库固定版本，用于回到上游；本次直接读取的新版文字则保存在工作区`sources/tutorial-text-review-source.zip`的相同目录下。二者内容层级不同，不能把新版观点倒推为原作者已说过。\n\n- [01-6aabb8c8000000002a0265bf-拒绝抽卡！一招教你用Codex精准控制AI运镜](https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/01-6aabb8c8000000002a0265bf-%E6%8B%92%E7%BB%9D%E6%8A%BD%E5%8D%A1%EF%BC%81%E4%B8%80%E6%8B%9B%E6%95%99%E4%BD%A0%E7%94%A8Codex%E7%B2%BE%E5%87%86%E6%8E%A7%E5%88%B6AI%E8%BF%90%E9%95%9C)\n- [02-6aaa15ec00000000290187a9-一开口就露馅？3招去掉AI配音的“机器味”](https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/02-6aaa15ec000  if(all){renderAll();document.title='全书 · 当代提示词专家指南'}
 else if(id==='index'&&!query.includes('full=1')){renderHome();document.title='当代提示词专家指南'}
 else{const p=pages.get(id);if(p){renderArticle(p);document.title=p.title+' · 当代提示词专家指南'}else{main.innerHTML='<div class="error"><h1>未找到这一节</h1><p>请从目录选择，或<a href="#/index">回到总览</a>。</p></div>'}}
 document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===id));
 closeNav();window.scrollTo(0,0);
 try{localStorage.setItem('prompt-guide-last',id)}catch(e){}
}
let searchTimer;
function runSearch(){
 const q=search.value.trim().toLowerCase();const results=document.getElementById('search-results');const nav=document.getElementById('nav');
 results.hidden=!q;nav.hidden=!!q;if(!q)return;
 const terms=q.split(/\s+/).filter(Boolean);
 const scored=concepts.map(p=>{const title=p.title.toLowerCase(),body=p.text.toLowerCase(),tags=p.tags.join(' ').toLowerCase();const valid=terms.every(t=>(title+' '+body+' '+tags).includes(t));return{p,score:valid?terms.reduce((s,t)=>s+(title.includes(t)?12:0)+(tags.includes(t)?8:0)+(p.description.includes(t)?5:0)+1,0):0}}).filter(x=>x.score).sort((a,b)=>b.score-a.score);
 results.innerHTML='<div class="results-label">找到 '+scored.length+' 个相关单元</div>'+scored.map(({p})=>{let i=p.text.toLowerCase().indexOf(terms[0]);let excerpt=i>=0?p.text.slice(Math.max(0,i-24),i+94).replace(/[\n#*`|]/g,' '):p.description;return '<a class="result" href="'+href(p.id)+'"><strong>'+escapeHTML(p.title)+'</strong><small>'+escapeHTML(excerpt)+'…</small></a>'}).join('');
 if(!scored.length)results.innerHTML+='<p class="results-label">试试更短的词，例如“手”“声音”“梦幻”。</p>';
}
search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,100)});
document.getElementById('clear-search').onclick=()=>{search.value='';runSearch();search.focus()};
document.getElementById('view-toggle').onclick=()=>{location.hash=location.hash==='#/all'?'#/index':'#/all'};
document.getElementById('menu-toggle').onclick=()=>{const open=!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);document.getElementById('overlay').classList.toggle('show',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))};
document.getElementById('overlay').onclick=closeNav;
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('theme-toggle').textContent=dark?'浅色':'深色';try{localStorage.setItem('prompt-guide-theme',dark?'dark':'light')}catch(e){}}
document.getElementById('theme-toggle').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
try{setTheme(localStorage.getItem('prompt-guide-theme')==='dark')}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(window.innerWidth<761&&!sidebar.classList.contains('open'))document.getElementById('menu-toggle').click();search.focus()}if(e.key==='Escape'){closeNav();search.blur()}});
main.addEventListener('click',async e=>{
 const anchor=e.target.closest('[data-anchor]');if(anchor){e.preventDefault();document.getElementById(anchor.dataset.anchor)?.scrollIntoView({behavior:'smooth'});return}
 const b=e.target.closest('.copy-btn');if(!b)return;
 const text=b.parentElement.querySelector('code')?.textContent||'';
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();let ok=false;try{ok=document.execCommand('copy')}finally{area.remove()}if(!ok)throw new Error('copy')}b.textContent='已复制';setTimeout(()=>b.textContent='复制',1500)}catch(err){b.textContent='请选中文字复制';setTimeout(()=>b.textContent='复制',2500)}
});
window.addEventListener('beforeprint',()=>document.querySelectorAll('.citations').forEach(x=>{x.dataset.wasOpen=x.open?'1':'0';x.open=true}));
window.addEventListener('afterprint',()=>document.querySelectorAll('.citations').forEach(x=>x.open=x.dataset.wasOpen==='1'));
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/'))route()});
buildNav();route();
</script>
</body>
