<script id="guide-data" type="application/json">__DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('guide-data').textContent);
const pages=new Map(DATA.pages.map(p=>[p.id,p]));
const concepts=DATA.pages.filter(p=>!['Index','Log'].includes(p.type));
const main=document.getElementById('main');
const search=document.getElementById('search');
const sidebar=document.getElementById('sidebar');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function href(id){return '#/'+id}
function shortTitle(t){return t.replace(/^\d+｜/,'')}
function buildNav(){
 let out='<a class="home-link" data-page="index" href="#/index">总览与阅读路径</a>';
 for(const [group,[label,range]] of Object.entries(DATA.groups)){
  out+='<section class="group"><a class="group-title" href="'+href(group+'/index')+'">'+escapeHTML(label)+'<span>'+range+'</span></a>';
  out+=concepts.filter(p=>p.group===group).map(p=>'<a class="navitem" data-page="'+p.id+'" href="'+href(p.id)+'">'+escapeHTML(p.title)+'</a>').join('');
  out+='</section>';
 }
 out+='<div class="nav-count">'+DATA.conceptCount+' 个知识单元<br>41 篇主体 · 8 篇参考<br><a href="#/log">更新记录</a> · <a href="#/references/glossary">术语表</a> · <a href="#/references/corpus">依据</a></div>';
 document.getElementById('nav').innerHTML=out;
}
function card(num,title,desc,id){return '<a class="card" href="'+href(id)+'"><div class="number">'+num+'</div><h3>'+title+'</h3><p>'+desc+'</p></a>'}
function renderHome(){
 main.innerHTML='<section class="hero"><div class="eyebrow">CREATIVE DIRECTION · NATURAL LANGUAGE · GENERATIVE MEDIA</div><h1>当代提示词<br>专家指南</h1><h2 class="subtitle">让感觉有落点，让 AI 有方向。</h2><p class="lead">几年前写提示词是堆关键词。现在你要像跟一个很会画画、但完全不认识你的画师说话：她本来在做什么，发生了什么，观众从哪里能看出来。这本书教的就是这件事——把你脑子里模糊的感觉，变成 AI 能用的人话。</p><div class="chips"><span class="chip">49 个知识单元</span><span class="chip">32 种情绪与氛围</span><span class="chip">8 个完整案例</span><span class="chip">6 张模板 · 12 道练习</span></div></section><div class="quote">“形容词是结论，动作是证据。AI 需要的是证据。”<br><small class="muted">“她很开心”只能得到一张通用笑脸。“她看到消息后停了一下，又快速看了一遍，才敢抬头笑出来”——AI 有了具体的东西可以画。</small></div><h2 class="section-heading">从你的任务进入</h2><div class="cards">'+
 card('00 / 只有十分钟','先读这一篇','只用一个例子把核心方法走一遍。剩下四十多篇都是它的展开。','foundations/00-ten-minute-start')+
 card('01 / 建立方法','六个问题','从“我想要的感觉”到“AI 能用的话”，一步步往下走，出了问题知道回到哪一步修。','foundations/02-six-layer-method')+
 card('02 / 感觉很抽象','情绪图谱与氛围图谱','同一个“高兴”不止一种身体；同一个“清爽”不止一种材料。查表，只选一个版本。','language/04-emotion-atlas')+
 card('03 / 今天就要写','改写诊所 · 六张模板','12 组“写成这样 → 改成这样”，加六张可以直接抄的模板。','language/06-rewrite-clinic')+
 card('04 / 看完整示范','30 秒品牌片','《留一点空隙》：从“清爽治愈”到镜头表、执行稿、验收清单。','cases/01-brand-film')+
 card('05 / 不认识的词','术语表','书里反复出现的词，一句话解释，附在哪一章讲得最细。','references/glossary')+
 '</div><h2 class="section-heading">七个部分，一张知识地图</h2><div class="category-grid">'+Object.entries(DATA.groups).map(([g,[label,range]])=>'<a class="category-tile" href="'+href(g+'/index')+'">'+label+'<span>'+range+' →</span></a>').join('')+'</div><p class="small-note">读的是 13 组 AI 影视教程的文字复审稿，查了官方工具文档和四篇原研究。六个问题、两张图谱、八个案例是这次综合设计的，没有跑过生成实验。<a href="#/references/corpus">这本书依据什么写成</a> · <a href="#/index?full=1">查看完整目录</a></p>';
}
function header(p){return '<div class="article-head"><div><span class="type">'+escapeHTML(p.type)+'</span> · '+escapeHTML((DATA.groups[p.group]||['总览'])[0])+'<div class="tagrow">'+p.tags.map(t=>'<span>'+escapeHTML(t)+'</span>').join('')+'</div><div class="reading">设计与方法 · 阅读后按任务试用</div></div></div>'}
function renderArticle(p){
 let toc=p.toc.length?'<details class="toc"><summary>本节导航 · '+p.toc.length+' 个部分</summary><nav>'+p.toc.map(t=>'<a href="#'+t.id+'" data-anchor="'+t.id+'">'+escapeHTML(t.title)+'</a>').join('')+'</nav></details>':'';
 let i=concepts.findIndex(x=>x.id===p.id),pager='';
 if(i>=0){pager='<nav class="pager">'+(i>0?'<a href="'+href(concepts[i-1].id)+'"><small>上一节</small>'+escapeHTML(shortTitle(concepts[i-1].title))+'</a>':'<a href="#/index"><small>返回</small>总览</a>')+(i<concepts.length-1?'<a href="'+href(concepts[i+1].id)+'"><small>下一节</small>'+escapeHTML(shortTitle(concepts[i+1].title))+'</a>':'<a href="#/index"><small>返回</small>总览</a>')+'</nav>'}
 main.innerHTML=header(p)+toc+'<article class="article">'+p.html+'</article>'+pager;
}
function renderAll(){main.innerHTML='<section class="hero"><div class="eyebrow">COMPLETE EDITION</div><h1>当代提示词专家指南</h1><p class="lead">41 篇主体与 8 篇参考，按阅读顺序连续展示。</p></section><div class="all-banner">当前为全书模式，可使用浏览器查找全文，或打印全书。所有提示案例均为设计样稿，未运行生成实验。<a href="#/index">返回分章阅读</a></div>'+concepts.map(p=>'<section class="all-article" id="book-'+p.id.replaceAll('/','-')+'">'+header(p)+'<article class="article">'+p.html+'</article></section>').join('');}
function closeNav(){sidebar.classList.remove('open');document.getElementById('overlay').classList.remove('show');document.getElementById('menu-toggle').setAttribute('aria-expanded','false')}
function route(){
 const raw=location.hash.startsWith('#/')?location.hash.slice(2):'index';
 const [id,query='']=raw.split('?');
 const all=id==='all';
 document.getElementById('view-toggle').textContent=all?'分章模式':'全书模式';
 if(all){renderAll();document.title='全书 · 当代提示词专家指南'}
 else if(id==='index'&&!query.includes('full=1')){renderHome();document.title='当代提示词专家指南'}
 else{const p=pages.get(id);if(p){renderArticle(p);document.title=p.title+' · 当代提示词专家指南'}else{main.innerHTML='<div class="error"><h1>未找到这一节</h1><p>请从目录选择，或<a href="#/index">回到总览</a>。</p></div>'}}
 document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===id));
 closeNav();window.scrollTo(0,0);
 try{localStorage.setItem('prompt-guide-last',id)}catch(e){}
}
let searchTimer;
function runSearch(){
 const q=search.value.trim().toLowerCase();const results=document.getElementById('search-results');const nav=document.getElementById('nav');
 results.hidden=!q;nav.hidden=!!q;if(!q)return;
 const terms=q.split(/\s+/).filter(Boolean);
 const scored=concepts.map(p=>{const title=p.title.toLowerCase(),body=p.text.toLowerCase(),tags=p.tags.join(' ').toLowerCase();const valid=terms.every(t=>(title+' '+body+' '+tags).includes(t));return{p,score:valid?terms.reduce((s,t)=>s+(title.includes(t)?12:0)+(tags.includes(t)?8:0)+(p.description.includes(t)?5:0)+1,0):0}}).filter(x=>x.score).sort((a,b)=>b.score-a.score);
 results.innerHTML='<div class="results-label">找到 '+scored.length+' 个相关单元</div>'+scored.map(({p})=>{let i=p.text.toLowerCase().indexOf(terms[0]);let excerpt=i>=0?p.text.slice(Math.max(0,i-24),i+94).replace(/[\n#*`|]/g,' '):p.description;return '<a class="result" href="'+href(p.id)+'"><strong>'+escapeHTML(p.title)+'</strong><small>'+escapeHTML(excerpt)+'…</small></a>'}).join('');
 if(!scored.length)results.innerHTML+='<p class="results-label">试试更短的词，例如“手”“声音”“梦幻”。</p>';
}
search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,100)});
document.getElementById('clear-search').onclick=()=>{search.value='';runSearch();search.focus()};
document.getElementById('view-toggle').onclick=()=>{location.hash=location.hash==='#/all'?'#/index':'#/all'};
document.getElementById('menu-toggle').onclick=()=>{const open=!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);document.getElementById('overlay').classList.toggle('show',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))};
document.getElementById('overlay').onclick=closeNav;
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('theme-toggle').textContent=dark?'浅色':'深色';try{localStorage.setItem('prompt-guide-theme',dark?'dark':'light')}catch(e){}}
document.getElementById('theme-toggle').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
try{setTheme(localStorage.getItem('prompt-guide-theme')==='dark')}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(window.innerWidth<761&&!sidebar.classList.contains('open'))document.getElementById('menu-toggle').click();search.focus()}if(e.key==='Escape'){closeNav();search.blur()}});
main.addEventListener('click',async e=>{
 const anchor=e.target.closest('[data-anchor]');if(anchor){e.preventDefault();document.getElementById(anchor.dataset.anchor)?.scrollIntoView({behavior:'smooth'});return}
 const b=e.target.closest('.copy-btn');if(!b)return;
 const text=b.parentElement.querySelector('code')?.textContent||'';
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();let ok=false;try{ok=document.execCommand('copy')}finally{area.remove()}if(!ok)throw new Error('copy')}b.textContent='已复制';setTimeout(()=>b.textContent='复制',1500)}catch(err){b.textContent='请选中文字复制';setTimeout(()=>b.textContent='复制',2500)}
});
window.addEventListener('beforeprint',()=>document.querySelectorAll('.citations').forEach(x=>{x.dataset.wasOpen=x.open?'1':'0';x.open=true}));
window.addEventListener('afterprint',()=>document.querySelectorAll('.citations').forEach(x=>x.open=x.dataset.wasOpen==='1'));
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/'))route()});
buildNav();route();
</script>
</body>
</html>
