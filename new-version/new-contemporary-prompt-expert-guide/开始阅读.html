3 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"cases-08-object-exchange-section-0","title":"任务"},{"id":"cases-08-object-exchange-section-1","title":"大多数人的第一稿"},{"id":"cases-08-object-exchange-section-2","title":"先让道具能被认出来"},{"id":"cases-08-object-exchange-section-3","title":"状态表先于相机路线"},{"id":"cases-08-object-exchange-section-4","title":"空间草案"},{"id":"cases-08-object-exchange-section-5","title":"一镜到底方案"},{"id":"cases-08-object-exchange-section-6","title":"给预演助手的任务"},{"id":"cases-08-object-exchange-section-7","title":"更省力的三镜头方案"},{"id":"cases-08-object-exchange-section-8","title":"最先测试什么"},{"id":"cases-08-object-exchange-section-9","title":"生成之后"}]},{"id":"practice/index","path":"practice/index.md","title":"VI · 工具与练习","description":"","type":"Index","group":"practice","tags":[],"html":"<h1>VI · 工具与练习<\/h1>\n<p>拿来就用的部分。模板可以直接抄，练习可以在纸上做，评价表用在生成之后。<\/p>\n<ul>\n<li><p><a href=\"#/practice/01-templates\">37｜六张可以直接抄的模板<\/a> — 方向 / 出图 / 首帧续拍 / 配音 / 参考分工 / 看结果修提示。<\/p>\n<\/li>\n<li><p><a href=\"#/practice/02-exercises\">38｜练习册：12 道题，从会写到会选、会看、会改<\/a> — 每题有\"算过的标准\"。<\/p>\n<\/li>\n<li><p><a href=\"#/practice/03-review-rubric\">39｜评价表：做对了吗，还能往下做吗<\/a> — 不打总分。先分任务和审美，再分三轮看。<\/p>\n<\/li>\n<li><p><a href=\"#/practice/04-agent-use\">40｜给 AI 助手和团队的用法<\/a> — 按任务取用，不要每次塞整本书。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# VI · 工具与练习\n\n拿来就用的部分。模板可以直接抄，练习可以在纸上做，评价表用在生成之后。\n\n- [37｜六张可以直接抄的模板](/practice/01-templates.md) — 方向 / 出图 / 首帧续拍 / 配音 / 参考分工 / 看结果修提示。\n\n- [38｜练习册：12 道题，从会写到会选、会看、会改](/practice/02-exercises.md) — 每题有\"算过的标准\"。\n\n- [39｜评价表：做对了吗，还能往下做吗](/practice/03-review-rubric.md) — 不打总分。先分任务和审美，再分三轮看。\n\n- [40｜给 AI 助手和团队的用法](/practice/04-agent-use.md) — 按任务取用，不要每次塞整本书。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"practice/01-templates","path":"practice/01-templates.md","title":"37｜六张可以直接抄的模板","description":"拿去改就能用。方括号是要替换的地方。用完记得删掉没用的字段。","type":"Playbook","group":"practice","tags":["模板","工具箱","助手"],"html":"<h1>37｜六张可以直接抄的模板<\/h1>\n<p>这六张模板是给<strong>人<\/strong>或<strong>AI 助手<\/strong>看的工作文本，不是某个模型的固定接口。方括号里是要你填的内容。<\/p>\n<p>三个用法提醒：<\/p>\n<ul>\n<li>已经知道的信息别重复问。<\/li>\n<li>缺关键信息（比如产品长什么样）时，明确说\"缺这个\"，不要瞎猜。<\/li>\n<li>低风险的假设可以先做，但标注出来。<\/li>\n<\/ul>\n<h2 id=\"practice-01-templates-section-0\">模板一：先长出几个方向，不急着写最终稿<\/h2>\n<p>用在项目最开始，还不知道要拍什么的时候。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">我要做[用途和媒介，比如\"一条 30 秒的洗发水品牌片\"]，希望观众首先感到/理解[主要体验]。\n现有材料：[实际手头有的东西]。必须保留：[关键事实，比如产品外观、字标]。\n\n请给出三个在\"怎么让人感到\"这件事上真正不同的方向，不是同一个画面换配色。每个方向写：\n- 一段有画面感的感受描述\n- 它怎么落到人物 / 物件 / 空间 / 声音\n- 一个最值得保留的细节\n- 一个可能失败的地方\n\n直接表达和间接表达都可以，不默认\"含蓄\"\"写实\"\"三幕结构\"更高级。\n先保持开放，不编造已经存在的参考素材或模型测试结果。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-1\">模板二：把感受稿变成一张图<\/h2>\n<p>用在已经有感受，要出静态图的时候。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">感受稿：[一句感受或一小段联想]\n用途：[概念图 / 角色资产 / 场景资产 / 主视觉 / 最终静帧]\n\n请把感受里真正有用的\"关系\"提取出来（比如\"有边界但不封闭\"），再选两三个可见的东西来承载它。不要把所有比喻字面画出来。\n\n生成说明要交代：视觉中心、空间关系、材料或光或绘画语言、必要的留白。\n没有叙事需求就不强加故事。已有的产品或角色必须按实际参考保持，不重新想象。\n\n最后给我一版自然语言提示词，再用一句话说明本版最重要的视觉选择。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-2\">模板三：让首帧继续发生<\/h2>\n<p>用在图生视频的时候。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">这是[首帧 / 身份参考 / 布局参考]，请先按实际任务区分它的作用。\n\n本镜头要完成：[一件事，或一次感受变化]\n起点：[看得见的姿势、视线、手和道具位置]\n终点：[要延续到后面镜头的状态]\n观看方式：[机位 / 取景 / 一项主要运动，或\"保持原图\"]\n声音：[对白 / 环境 / 音乐，注明谁听见、谁发声]\n\n请写一版适合当前工具的执行稿。只细化关键接触和情绪转折，自然过渡留给模型。\n不要追加新人物、新剧情，也不要给一串表情词。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-3\">模板四：声音不是情绪标签<\/h2>\n<p>用在配音、对白的时候。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">台词正文：[准确台词，不混入备注]\n角色长期声音：[语言、口音、音区、声音质地]\n当场关系：[对谁说，想怎样影响对方，身体正在做什么]\n变化：[哪几个词要强调，哪里改变节奏或收住]\n空间：[耳边 / 正常距离 / 电话 / 门后]\n\n请给出自然的表演说明，保留台词的可读性。\n不要把标点换算成\"保证执行的秒数\"。需要精确时长的地方，列为试听后再调。\n<\/code><\/pre>\n<p>音乐另从<a href=\"#/craft/07-sound-music\">音乐与声音<\/a>选\"进入—展开—收尾\"的结构，不硬套台词模板。<\/p>\n<h2 id=\"practice-01-templates-section-4\">模板五：参考素材分工<\/h2>\n<p>用在素材很多、怕冲突的时候。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">本次实际可用的素材和用途：\n[列表，比如：A_身份.png（角色身份）；厨房_布局.png（场景布局）；首帧.png（起点）]\n\n请先检查角色、服装、场景布局、光向、时间状态有没有互相冲突。\n区分：首帧 / 身份 / 风格 / 运动 / 声音参考。\n\n冲突能用\"已批准版本\"解决的就直接用批准版；不能确定的指出影响，不默默混合。\n只保留当前镜头需要的输入，输出一份精简的引用分工和执行稿。不把整个素材库塞进去。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-5\">模板六：看结果，再修提示<\/h2>\n<p>用在生成之后。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">本次任务和必须项：[目标]\n实际输出：[可读取的媒体，或我看到的具体现象]\n\n请区分三类问题：内容对不对、表达好不好、后面能不能用。\n先描述你实际能看见 / 听见的，不从提示词推断\"应该已经完成了\"。\n\n找出最影响任务的一处问题，提出一个最小修改和一个备选路线。\n不要一次换掉角色、风格、机位和模型，除非问题本身需要连带改。\n没有可读取媒体时，只做文本和条件审查，不宣称\"验片通过\"。\n<\/code><\/pre>\n<h2 id=\"practice-01-templates-section-6\">模板不是最终格式<\/h2>\n<p>要交纯文本给模型的时候，从模板里编出一段自然说明；参考引用和参数放进有效的接口；过程解释不用一起提交。<\/p>\n<p>用完模板，再走一遍<a href=\"#/language/06-rewrite-clinic\">改写诊所<\/a>的删减检查。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-image\">图像工具的官方说法<\/a>\n[3] <a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/p>\n<\/details>","text":"# 37｜六张可以直接抄的模板\n\n这六张模板是给**人**或**AI 助手**看的工作文本，不是某个模型的固定接口。方括号里是要你填的内容。\n\n三个用法提醒：\n\n- 已经知道的信息别重复问。\n- 缺关键信息（比如产品长什么样）时，明确说\"缺这个\"，不要瞎猜。\n- 低风险的假设可以先做，但标注出来。\n\n## 模板一：先长出几个方向，不急着写最终稿\n\n用在项目最开始，还不知道要拍什么的时候。\n\n```text\n我要做[用途和媒介，比如\"一条 30 秒的洗发水品牌片\"]，希望观众首先感到/理解[主要体验]。\n现有材料：[实际手头有的东西]。必须保留：[关键事实，比如产品外观、字标]。\n\n请给出三个在\"怎么让人感到\"这件事上真正不同的方向，不是同一个画面换配色。每个方向写：\n- 一段有画面感的感受描述\n- 它怎么落到人物 / 物件 / 空间 / 声音\n- 一个最值得保留的细节\n- 一个可能失败的地方\n\n直接表达和间接表达都可以，不默认\"含蓄\"\"写实\"\"三幕结构\"更高级。\n先保持开放，不编造已经存在的参考素材或模型测试结果。\n```\n\n## 模板二：把感受稿变成一张图\n\n用在已经有感受，要出静态图的时候。\n\n```text\n感受稿：[一句感受或一小段联想]\n用途：[概念图 / 角色资产 / 场景资产 / 主视觉 / 最终静帧]\n\n请把感受里真正有用的\"关系\"提取出来（比如\"有边界但不封闭\"），再选两三个可见的东西来承载它。不要把所有比喻字面画出来。\n\n生成说明要交代：视觉中心、空间关系、材料或光或绘画语言、必要的留白。\n没有叙事需求就不强加故事。已有的产品或角色必须按实际参考保持，不重新想象。\n\n最后给我一版自然语言提示词，再用一句话说明本版最重要的视觉选择。\n```\n\n## 模板三：让首帧继续发生\n\n用在图生视频的时候。\n\n```text\n这是[首帧 / 身份参考 / 布局参考]，请先按实际任务区分它的作用。\n\n本镜头要完成：[一件事，或一次感受变化]\n起点：[看得见的姿势、视线、手和道具位置]\n终点：[要延续到后面镜头的状态]\n观看方式：[机位 / 取景 / 一项主要运动，或\"保持原图\"]\n声音：[对白 / 环境 / 音乐，注明谁听见、谁发声]\n\n请写一版适合当前工具的执行稿。只细化关键接触和情绪转折，自然过渡留给模型。\n不要追加新人物、新剧情，也不要给一串表情词。\n```\n\n## 模板四：声音不是情绪标签\n\n用在配音、对白的时候。\n\n```text\n台词正文：[准确台词，不混入备注]\n角色长期声音：[语言、口音、音区、声音质地]\n当场关系：[对谁说，想怎样影响对方，身体正在做什么]\n变化：[哪几个词要强调，哪里改变节奏或收住]\n空间：[耳边 / 正常距离 / 电话 / 门后]\n\n请给出自然的表演说明，保留台词的可读性。\n不要把标点换算成\"保证执行的秒数\"。需要精确时长的地方，列为试听后再调。\n```\n\n音乐另从[音乐与声音](/craft/07-sound-music.md)选\"进入—展开—收尾\"的结构，不硬套台词模板。\n\n## 模板五：参考素材分工\n\n用在素材很多、怕冲突的时候。\n\n```text\n本次实际可用的素材和用途：\n[列表，比如：A_身份.png（角色身份）；厨房_布局.png（场景布局）；首帧.png（起点）]\n\n请先检查角色、服装、场景布局、光向、时间状态有没有互相冲突。\n区分：首帧 / 身份 / 风格 / 运动 / 声音参考。\n\n冲突能用\"已批准版本\"解决的就直接用批准版；不能确定的指出影响，不默默混合。\n只保留当前镜头需要的输入，输出一份精简的引用分工和执行稿。不把整个素材库塞进去。\n```\n\n## 模板六：看结果，再修提示\n\n用在生成之后。\n\n```text\n本次任务和必须项：[目标]\n实际输出：[可读取的媒体，或我看到的具体现象]\n\n请区分三类问题：内容对不对、表达好不好、后面能不能用。\n先描述你实际能看见 / 听见的，不从提示词推断\"应该已经完成了\"。\n\n找出最影响任务的一处问题，提出一个最小修改和一个备选路线。\n不要一次换掉角色、风格、机位和模型，除非问题本身需要连带改。\n没有可读取媒体时，只做文本和条件审查，不宣称\"验片通过\"。\n```\n\n## 模板不是最终格式\n\n要交纯文本给模型的时候，从模板里编出一段自然说明；参考引用和参数放进有效的接口；过程解释不用一起提交。\n\n用完模板，再走一遍[改写诊所](/language/06-rewrite-clinic.md)的删减检查。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [图像工具的官方说法](/references/official-image.md)\n[3] [视频工具的官方说法](/references/official-video.md)","toc":[{"id":"practice-01-templates-section-0","title":"模板一：先长出几个方向，不急着写最终稿"},{"id":"practice-01-templates-section-1","title":"模板二：把感受稿变成一张图"},{"id":"practice-01-templates-section-2","title":"模板三：让首帧继续发生"},{"id":"practice-01-templates-section-3","title":"模板四：声音不是情绪标签"},{"id":"practice-01-templates-section-4","title":"模板五：参考素材分工"},{"id":"practice-01-templates-section-5","title":"模板六：看结果，再修提示"},{"id":"practice-01-templates-section-6","title":"模板不是最终格式"}]},{"id":"practice/02-exercises","path":"practice/02-exercises.md","title":"38｜练习册：12 道题，从会写到会选、会看、会改","description":"每道题有题目、提示和\"做到什么算过\"。先在纸上做，要生成的时候自己选工具。","type":"Exercise","group":"practice","tags":["练习","学习","通感","评价"],"html":"<h1>38｜练习册：12 道题，从会写到会选、会看、会改<\/h1>\n<p>先在纸上做。要真的生成时，自己选工具和预算。这里没有编造的练习结果。<\/p>\n<p>每次练习留三行笔记：<strong>我原来以为什么会起效；实际看到了什么；下次保留什么、删什么。<\/strong> 别只收藏最后那条提示词。<\/p>\n<hr/>\n<h2 id=\"practice-02-exercises-section-0\">练习 01：一个词，三种机制<\/h2>\n<p><strong>题目<\/strong>：不用\"水、冰块、薄荷\"，写出三个\"清爽\"的视觉方向。<\/p>\n<p><strong>提示<\/strong>：被风翻过的一页纸；暖阳下一件干净衬衫的松动；信息越来越少的排版。<\/p>\n<p><strong>算过的标准<\/strong>：三个方向靠<strong>不同的关系<\/strong>产生清爽感，而不是三句都很美。再选一个改成可生成的说明。<\/p>\n<h2 id=\"practice-02-exercises-section-1\">练习 02：留下比喻，拿走比喻里的物件<\/h2>\n<p><strong>题目<\/strong>：\"声音像折过的纸。\"不用任何纸的画面或纸声，写一段配音方向。<\/p>\n<p><strong>提示<\/strong>：提取\"有细小转折但不过分脆裂\"这个性质，放到句中的短停和收尾里。<\/p>\n<p><strong>算过的标准<\/strong>：朗读者能理解执行说明，比喻不是唯一的信息。<\/p>\n<h2 id=\"practice-02-exercises-section-2\">练习 03：同一句台词，三种关系<\/h2>\n<p><strong>题目<\/strong>：\"你终于来了。\"分别写成迎接、责怪、试探。<\/p>\n<p><strong>提示<\/strong>：说给谁，等待造成了什么，是不是希望对方解释。<\/p>\n<p><strong>算过的标准<\/strong>：不只改音量和情绪标签，还改了重音、距离，或说完之后的动作。<\/p>\n<h2 id=\"practice-02-exercises-section-3\">练习 04：拍不到脸，还能不能表达<\/h2>\n<p><strong>题目<\/strong>：只能拍手、门和钥匙，表现从警觉到安心。<\/p>\n<p><strong>提示<\/strong>：钥匙碰响后被握紧；认出熟人后，手从门边落下。<\/p>\n<p><strong>算过的标准<\/strong>：没有偷偷加面部特写或解释性旁白。<\/p>\n<h2 id=\"practice-02-exercises-section-4\">练习 05：快乐不能被\"克制\"吞掉<\/h2>\n<p><strong>题目<\/strong>：写一段明显、热烈的喜悦。禁止用低头、咬唇、压住笑当主要表现。<\/p>\n<p><strong>提示<\/strong>：分享、起身、拥抱、笑声打断台词。<\/p>\n<p><strong>算过的标准<\/strong>：强烈但目的清楚，有接触的准备和收尾，不是全身无理由乱动。<\/p>\n<h2 id=\"practice-02-exercises-section-5\">练习 06：镜头不动，注意力接力<\/h2>\n<p><strong>题目<\/strong>：摄影机不能动，在餐桌旁把注意力从 A 交给 B，再交给桌上的物件。<\/p>\n<p><strong>提示<\/strong>：A 说话，B 的手先动，道具被推到两人之间。<\/p>\n<p><strong>算过的标准<\/strong>：不偷用推近或变焦当唯一办法。检查同框时物件够不够大能看清。<\/p>\n<h2 id=\"practice-02-exercises-section-6\">练习 07：只改一个变量<\/h2>\n<p><strong>题目<\/strong>：为同一张首帧写两版提示，只比较\"直接写情绪词\"和\"写目标 + 一次反应\"。<\/p>\n<p><strong>算过的标准<\/strong>：人物、机位、时长、工具设置尽量不变。不把一次偶然成功当成普遍结论。没生成的话，只记\"待验证\"。<\/p>\n<h2 id=\"practice-02-exercises-section-7\">练习 08：改图里的搬动<\/h2>\n<p><strong>题目<\/strong>：把一只花瓶从桌子左边移到右边。写出：指认、操作、原位置怎么处理、什么不能变。<\/p>\n<p><strong>算过的标准<\/strong>：不出现两只花瓶；目标位置有接触关系；说明了最后的清理。额外检查非编辑区域有没有被动过。<\/p>\n<h2 id=\"practice-02-exercises-section-8\">练习 09：不加参考，先删矛盾<\/h2>\n<p><strong>题目<\/strong>：素材里有同一角色两种发色、一个左右相反的房间、三张鞋子图。当前只拍桌边上半身。<\/p>\n<p><strong>提示<\/strong>：选定当前批准的身份和场景，删掉无关的鞋和旧发色。<\/p>\n<p><strong>算过的标准<\/strong>：每个保留的素材都有明确用途。不能用\"全部参考、保持一致\"混过去。<\/p>\n<h2 id=\"practice-02-exercises-section-9\">练习 10：声音让同一画面变成两种故事<\/h2>\n<p><strong>题目<\/strong>：同一条空走廊，一版期待，一版不安。<\/p>\n<p><strong>提示<\/strong>：熟人活动声 vs 门后未知的脚步，分别组织。<\/p>\n<p><strong>算过的标准<\/strong>：区分场内声音和配乐，不只是换一首\"恐怖\"标签的音乐。只听声音和静音各检查一次。<\/p>\n<h2 id=\"practice-02-exercises-section-10\">练习 11：允许不真实，但只偏离一条规则<\/h2>\n<p><strong>题目<\/strong>：产品稳定，一条材质带悬浮。写一张主视觉和一段短动效。<\/p>\n<p><strong>算过的标准<\/strong>：说清哪里超现实、哪里保持稳定。瓶身不能因为\"梦幻\"就变形。如果生成不稳，提出分层合成路线——这不算失败逃避。<\/p>\n<h2 id=\"practice-02-exercises-section-11\">练习 12：剪出一个能看懂的短片<\/h2>\n<p><strong>题目<\/strong>：用三个已有、获准使用的片段组成\"进入—变化—离开\"，或\"聚拢—展开—停留\"。<\/p>\n<p><strong>算过的标准<\/strong>：先写每段的作用，再检查实际接头。可以采用不完全符合原提示的片段，但要更新下一步的依据。片中读不出来的重要信息，选补画面、补声音、改节奏或删掉，不只在说明里解释。<\/p>\n<hr/>\n<h2 id=\"practice-02-exercises-section-12\">怎么积累个人风格<\/h2>\n<p>个人风格不是固定词库，是你<strong>反复做出的选择<\/strong>。<\/p>\n<p>三行笔记攒多了，回头看：哪些选择你一直在做？那就是你的风格。用<a href=\"#/practice/03-review-rubric\">评价表<\/a>帮自己比较。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 38｜练习册：12 道题，从会写到会选、会看、会改\n\n先在纸上做。要真的生成时，自己选工具和预算。这里没有编造的练习结果。\n\n每次练习留三行笔记：**我原来以为什么会起效；实际看到了什么；下次保留什么、删什么。** 别只收藏最后那条提示词。\n\n---\n\n## 练习 01：一个词，三种机制\n\n**题目**：不用\"水、冰块、薄荷\"，写出三个\"清爽\"的视觉方向。\n\n**提示**：被风翻过的一页纸；暖阳下一件干净衬衫的松动；信息越来越少的排版。\n\n**算过的标准**：三个方向靠**不同的关系**产生清爽感，而不是三句都很美。再选一个改成可生成的说明。\n\n## 练习 02：留下比喻，拿走比喻里的物件\n\n**题目**：\"声音像折过的纸。\"不用任何纸的画面或纸声，写一段配音方向。\n\n**提示**：提取\"有细小转折但不过分脆裂\"这个性质，放到句中的短停和收尾里。\n\n**算过的标准**：朗读者能理解执行说明，比喻不是唯一的信息。\n\n## 练习 03：同一句台词，三种关系\n\n**题目**：\"你终于来了。\"分别写成迎接、责怪、试探。\n\n**提示**：说给谁，等待造成了什么，是不是希望对方解释。\n\n**算过的标准**：不只改音量和情绪标签，还改了重音、距离，或说完之后的动作。\n\n## 练习 04：拍不到脸，还能不能表达\n\n**题目**：只能拍手、门和钥匙，表现从警觉到安心。\n\n**提示**：钥匙碰响后被握紧；认出熟人后，手从门边落下。\n\n**算过的标准**：没有偷偷加面部特写或解释性旁白。\n\n## 练习 05：快乐不能被\"克制\"吞掉\n\n**题目**：写一段明显、热烈的喜悦。禁止用低头、咬唇、压住笑当主要表现。\n\n**提示**：分享、起身、拥抱、笑声打断台词。\n\n**算过的标准**：强烈但目的清楚，有接触的准备和收尾，不是全身无理由乱动。\n\n## 练习 06：镜头不动，注意力接力\n\n**题目**：摄影机不能动，在餐桌旁把注意力从 A 交给 B，再交给桌上的物件。\n\n**提示**：A 说话，B 的手先动，道具被推到两人之间。\n\n**算过的标准**：不偷用推近或变焦当唯一办法。检查同框时物件够不够大能看清。\n\n## 练习 07：只改一个变量\n\n**题目**：为同一张首帧写两版提示，只比较\"直接写情绪词\"和\"写目标 + 一次反应\"。\n\n**算过的标准**：人物、机位、时长、工具设置尽量不变。不把一次偶然成功当成普遍结论。没生成的话，只记\"待验证\"。\n\n## 练习 08：改图里的搬动\n\n**题目**：把一只花瓶从桌子左边移到右边。写出：指认、操作、原位置怎么处理、什么不能变。\n\n**算过的标准**：不出现两只花瓶；目标位置有接触关系；说明了最后的清理。额外检查非编辑区域有没有被动过。\n\n## 练习 09：不加参考，先删矛盾\n\n**题目**：素材里有同一角色两种发色、一个左右相反的房间、三张鞋子图。当前只拍桌边上半身。\n\n**提示**：选定当前批准的身份和场景，删掉无关的鞋和旧发色。\n\n**算过的标准**：每个保留的素材都有明确用途。不能用\"全部参考、保持一致\"混过去。\n\n## 练习 10：声音让同一画面变成两种故事\n\n**题目**：同一条空走廊，一版期待，一版不安。\n\n**提示**：熟人活动声 vs 门后未知的脚步，分别组织。\n\n**算过的标准**：区分场内声音和配乐，不只是换一首\"恐怖\"标签的音乐。只听声音和静音各检查一次。\n\n## 练习 11：允许不真实，但只偏离一条规则\n\n**题目**：产品稳定，一条材质带悬浮。写一张主视觉和一段短动效。\n\n**算过的标准**：说清哪里超现实、哪里保持稳定。瓶身不能因为\"梦幻\"就变形。如果生成不稳，提出分层合成路线——这不算失败逃避。\n\n## 练习 12：剪出一个能看懂的短片\n\n**题目**：用三个已有、获准使用的片段组成\"进入—变化—离开\"，或\"聚拢—展开—停留\"。\n\n**算过的标准**：先写每段的作用，再检查实际接头。可以采用不完全符合原提示的片段，但要更新下一步的依据。片中读不出来的重要信息，选补画面、补声音、改节奏或删掉，不只在说明里解释。\n\n---\n\n## 怎么积累个人风格\n\n个人风格不是固定词库，是你**反复做出的选择**。\n\n三行笔记攒多了，回头看：哪些选择你一直在做？那就是你的风格。用[评价表](/practice/03-review-rubric.md)帮自己比较。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"practice-02-exercises-section-0","title":"练习 01：一个词，三种机制"},{"id":"practice-02-exercises-section-1","title":"练习 02：留下比喻，拿走比喻里的物件"},{"id":"practice-02-exercises-section-2","title":"练习 03：同一句台词，三种关系"},{"id":"practice-02-exercises-section-3","title":"练习 04：拍不到脸，还能不能表达"},{"id":"practice-02-exercises-section-4","title":"练习 05：快乐不能被\"克制\"吞掉"},{"id":"practice-02-exercises-section-5","title":"练习 06：镜头不动，注意力接力"},{"id":"practice-02-exercises-section-6","title":"练习 07：只改一个变量"},{"id":"practice-02-exercises-section-7","title":"练习 08：改图里的搬动"},{"id":"practice-02-exercises-section-8","title":"练习 09：不加参考，先删矛盾"},{"id":"practice-02-exercises-section-9","title":"练习 10：声音让同一画面变成两种故事"},{"id":"practice-02-exercises-section-10","title":"练习 11：允许不真实，但只偏离一条规则"},{"id":"practice-02-exercises-section-11","title":"练习 12：剪出一个能看懂的短片"},{"id":"practice-02-exercises-section-12","title":"怎么积累个人风格"}]},{"id":"practice/03-review-rubric","path":"practice/03-review-rubric.md","title":"39｜评价表：做对了吗，还能往下做吗","description":"不用一个总分。先分\"任务\"和\"审美\"，再分三轮看，最后留一份明确的结论。","type":"Playbook","group":"practice","tags":["评价","验收","复盘","交付"],"html":"<h1>39｜评价表：做对了吗，还能往下做吗<\/h1>\n<h2 id=\"practice-03-review-rubric-section-0\">为什么不打总分<\/h2>\n<p>\"整体 8.5 分\"会把一个严重问题（字标错了）被其他漂亮部分平均掉。<\/p>\n<p>先分两类：<\/p>\n<ul>\n<li><strong>硬任务<\/strong>：客户的产品必须能认出来；角色不能换人；关键台词不能错。做不到就是不合格，多漂亮都不行。<\/li>\n<li><strong>审美选择<\/strong>：背景偏蓝还是偏暖；镜头静止还是慢推。这是方案，不是对错，除非品牌已经限定。<\/li>\n<\/ul>\n<p>不能用漂亮弥补错误字标，也不能拿个人偏好否定项目明确需要的形式。<\/p>\n<h2 id=\"practice-03-review-rubric-section-1\">七个维度，按需用<\/h2>\n<p>不必每项打分。用的时候看这一栏。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>看或听什么<\/th>\n<th>过了的样子<\/th>\n<th>要改的样子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>任务<\/td>\n<td>必须让观众知道或感到什么<\/td>\n<td>重要信息看得见，核心体验有东西托着<\/td>\n<td>只有看提示词才懂<\/td>\n<\/tr>\n<tr>\n<td>表达<\/td>\n<td>形式有没有服务目标<\/td>\n<td>有主有次，风格相容<\/td>\n<td>每个部门都在同一处用力<\/td>\n<\/tr>\n<tr>\n<td>行为<\/td>\n<td>动作、反应和关系<\/td>\n<td>刺激和回应能接上<\/td>\n<td>对着空气演，动作空转<\/td>\n<\/tr>\n<tr>\n<td>空间<\/td>\n<td>人物、道具、光和机位<\/td>\n<td>关键位置和持有状态清楚<\/td>\n<td>突然换房、穿物、道具消失<\/td>\n<\/tr>\n<tr>\n<td>质感<\/td>\n<td>表面、重量、声音材料<\/td>\n<td>作品自己的规则稳定<\/td>\n<td>结构错误被柔光或颗粒遮住<\/td>\n<\/tr>\n<tr>\n<td>声音<\/td>\n<td>台词、空间、情绪和画面<\/td>\n<td>谁发声清楚，有需要的间隔<\/td>\n<td>错人说话、抢信息、时序错<\/td>\n<\/tr>\n<tr>\n<td>制作<\/td>\n<td>片段长度、接头、能不能剪<\/td>\n<td>可用区间明确，后面能接<\/td>\n<td>没有剪辑余量，改动无法追踪<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>写实作品看写实规则，超现实作品看它自己设的规则。不能用一套\"自然\"统一判所有作品。<\/p>\n<h2 id=\"practice-03-review-rubric-section-2\">三轮观看<\/h2>\n<p><strong>第一轮像观众<\/strong>：不读提示词。说最先注意到的东西和最直接的感受。<\/p>\n<p><strong>第二轮像专业同事<\/strong>：看动作接触、声画归属、光和材质、信息来得及接收吗。<\/p>\n<p><strong>第三轮像剪辑师<\/strong>：看和前后镜头接不接得上，具体哪一段能用，剩余问题怎么处理。<\/p>\n<p>时间紧可以合并，但<strong>不要只看静帧截图<\/strong>。声音和运动中的问题，一张图看不出来。<\/p>\n<h2 id=\"practice-03-review-rubric-section-3\">留一份明确的结论<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">对象：实际候选文件 + 可用时间范围\n本镜任务：……\n观察到的：……（只写媒体能支持的观察）\n结论：可用 / 可用但需修补 / 需重做\n最重要的问题：……\n下一步：保留 / 局部修 / 改音 / 换区间 / 重生成 / 回方案\n交接状态：谁在哪里，关键物件在哪，声音和造型用哪版\n<\/code><\/pre>\n<p>\"更自然一点\"\"再高级一点\"不能单独当返工单。要说出<strong>哪里<\/strong>让你这样感觉，<strong>先改哪一层<\/strong>。<\/p>\n<h2 id=\"practice-03-review-rubric-section-4\">一个纸上例子<\/h2>\n<p>假设一条候选：角色身份对，拿杯子也完成了，但原本希望松弛的结尾变成了对着镜头的广告微笑。<\/p>\n<p><strong>没用的结论<\/strong>：\"整体 8.5 分，可以。\"<\/p>\n<p><strong>有用的结论<\/strong>：内容任务通过；结尾表达偏展示。保留前半段拿杯，后半段改成看向窗外的停留，或重新选一段没看镜头的区间。<\/p>\n<p>如果项目本来就需要广告展示，这个表现反而合适。<strong>判断跟着目标变。<\/strong><\/p>\n<h2 id=\"practice-03-review-rubric-section-5\">哪些缺陷可以放过<\/h2>\n<p>远处背景一片非关键叶子的形状变了，未必值得重做。产品标签、关键道具归属、决定性台词的错误通常更重要。<\/p>\n<p>比例不按\"错误像素面积\"算，按<strong>它伤不伤任务<\/strong>。<\/p>\n<h2 id=\"practice-03-review-rubric-section-6\">没有媒体时能做什么<\/h2>\n<p>可以检查：语义矛盾、时间预算、引用分工、风险。这叫<strong>文本预审<\/strong>。<\/p>\n<p>不能说：\"配音自然\"\"没有变脸\"\"动作流畅\"。<\/p>\n<p>这本书所有案例都停在设计和文本审查层，没有装成媒体验收。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 39｜评价表：做对了吗，还能往下做吗\n\n## 为什么不打总分\n\n\"整体 8.5 分\"会把一个严重问题（字标错了）被其他漂亮部分平均掉。\n\n先分两类：\n\n- **硬任务**：客户的产品必须能认出来；角色不能换人；关键台词不能错。做不到就是不合格，多漂亮都不行。\n- **审美选择**：背景偏蓝还是偏暖；镜头静止还是慢推。这是方案，不是对错，除非品牌已经限定。\n\n不能用漂亮弥补错误字标，也不能拿个人偏好否定项目明确需要的形式。\n\n## 七个维度，按需用\n\n不必每项打分。用的时候看这一栏。\n\n| 维度 | 看或听什么 | 过了的样子 | 要改的样子 |\n| --- | --- | --- | --- |\n| 任务 | 必须让观众知道或感到什么 | 重要信息看得见，核心体验有东西托着 | 只有看提示词才懂 |\n| 表达 | 形式有没有服务目标 | 有主有次，风格相容 | 每个部门都在同一处用力 |\n| 行为 | 动作、反应和关系 | 刺激和回应能接上 | 对着空气演，动作空转 |\n| 空间 | 人物、道具、光和机位 | 关键位置和持有状态清楚 | 突然换房、穿物、道具消失 |\n| 质感 | 表面、重量、声音材料 | 作品自己的规则稳定 | 结构错误被柔光或颗粒遮住 |\n| 声音 | 台词、空间、情绪和画面 | 谁发声清楚，有需要的间隔 | 错人说话、抢信息、时序错 |\n| 制作 | 片段长度、接头、能不能剪 | 可用区间明确，后面能接 | 没有剪辑余量，改动无法追踪 |\n\n写实作品看写实规则，超现实作品看它自己设的规则。不能用一套\"自然\"统一判所有作品。\n\n## 三轮观看\n\n**第一轮像观众**：不读提示词。说最先注意到的东西和最直接的感受。\n\n**第二轮像专业同事**：看动作接触、声画归属、光和材质、信息来得及接收吗。\n\n**第三轮像剪辑师**：看和前后镜头接不接得上，具体哪一段能用，剩余问题怎么处理。\n\n时间紧可以合并，但**不要只看静帧截图**。声音和运动中的问题，一张图看不出来。\n\n## 留一份明确的结论\n\n```text\n对象：实际候选文件 + 可用时间范围\n本镜任务：……\n观察到的：……（只写媒体能支持的观察）\n结论：可用 / 可用但需修补 / 需重做\n最重要的问题：……\n下一步：保留 / 局部修 / 改音 / 换区间 / 重生成 / 回方案\n交接状态：谁在哪里，关键物件在哪，声音和造型用哪版\n```\n\n\"更自然一点\"\"再高级一点\"不能单独当返工单。要说出**哪里**让你这样感觉，**先改哪一层**。\n\n## 一个纸上例子\n\n假设一条候选：角色身份对，拿杯子也完成了，但原本希望松弛的结尾变成了对着镜头的广告微笑。\n\n**没用的结论**：\"整体 8.5 分，可以。\"\n\n**有用的结论**：内容任务通过；结尾表达偏展示。保留前半段拿杯，后半段改成看向窗外的停留，或重新选一段没看镜头的区间。\n\n如果项目本来就需要广告展示，这个表现反而合适。**判断跟着目标变。**\n\n## 哪些缺陷可以放过\n\n远处背景一片非关键叶子的形状变了，未必值得重做。产品标签、关键道具归属、决定性台词的错误通常更重要。\n\n比例不按\"错误像素面积\"算，按**它伤不伤任务**。\n\n## 没有媒体时能做什么\n\n可以检查：语义矛盾、时间预算、引用分工、风险。这叫**文本预审**。\n\n不能说：\"配音自然\"\"没有变脸\"\"动作流畅\"。\n\n这本书所有案例都停在设计和文本审查层，没有装成媒体验收。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"practice-03-review-rubric-section-0","title":"为什么不打总分"},{"id":"practice-03-review-rubric-section-1","title":"七个维度，按需用"},{"id":"practice-03-review-rubric-section-2","title":"三轮观看"},{"id":"practice-03-review-rubric-section-3","title":"留一份明确的结论"},{"id":"practice-03-review-rubric-section-4","title":"一个纸上例子"},{"id":"practice-03-review-rubric-section-5","title":"哪些缺陷可以放过"},{"id":"practice-03-review-rubric-section-6","title":"没有媒体时能做什么"}]},{"id":"practice/04-agent-use","path":"practice/04-agent-use.md","title":"40｜给 AI 助手和团队的用法","description":"按任务取用，不要每次把整本书塞进去。角色分工、最小工作顺序、对参考和参数保持诚实。","type":"Playbook","group":"practice","tags":["Agent","协作","知识维护","使用"],"html":"<h1>40｜给 AI 助手和团队的用法<\/h1>\n<h2 id=\"practice-04-agent-use-section-0\">先认清现在在做什么<\/h2>\n<p>探索、写稿、准备资产、生成、修图、验片、剪辑——这是不同任务。<\/p>\n<p>用户只要一句提示词，不要输出整套制片流程。用户要做一个系列，也不能只给一句漂亮描述就结束。<\/p>\n<p><strong>按任务取用<\/strong>：检索时先看总目录，再拿当前任务相关的两三篇。需要身体表演，就读表演、动作和一个案例。不要每次把 47 篇全塞进上下文。<\/p>\n<h2 id=\"practice-04-agent-use-section-1\">角色分工<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>谁判断<\/th>\n<th>主要决定什么<\/th>\n<th>提示词作者负责什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>导演 / 创意负责人<\/td>\n<td>观众体验、故事、形式选择<\/td>\n<td>准确表达，不暗中改题<\/td>\n<\/tr>\n<tr>\n<td>美术 / 摄影<\/td>\n<td>造型、空间、材质、光、观看位置<\/td>\n<td>组织有效参考，写清楚描述<\/td>\n<\/tr>\n<tr>\n<td>表演 / 声音<\/td>\n<td>人物行为、说话关系、听觉结构<\/td>\n<td>声线和当场状态分开写<\/td>\n<\/tr>\n<tr>\n<td>编辑 / 生成执行<\/td>\n<td>片段选择、接头、参数、任务模式<\/td>\n<td>把说明编成接口能用的输入，记录实际结果<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>一个人可以兼多项，AI 助手也能协作。关键不是人头数，是<strong>决定有没有被准确传递<\/strong>。<\/p>\n<h2 id=\"practice-04-agent-use-section-2\">给助手的最小工作顺序<\/h2>\n<ol>\n<li>读已有目标和实际素材<\/li>\n<li>指出影响任务的矛盾<\/li>\n<li>在必要范围内展开或执行<\/li>\n<li>给一份能用的结果<\/li>\n<li>说明还需要验证什么<\/li>\n<\/ol>\n<p>除非任务复杂，不要求每次把这五步的过程全写出来。<\/p>\n<p>探索阶段可以提多个方向。<strong>执行阶段不擅自新增人物、换包装、改结局。<\/strong> 如果已有方案不成立，提最小变更和影响，不默默换一套创意。<\/p>\n<h2 id=\"practice-04-agent-use-section-3\">对参考、参数和工具保持诚实<\/h2>\n<ul>\n<li>文件名 ≠ 文件已上传<\/li>\n<li>编号 ≠ 引用已绑定<\/li>\n<li>文字里的时长 ≠ 真实参数<\/li>\n<li>任务提交成功 ≠ 媒体通过<\/li>\n<\/ul>\n<p><strong>没有读到的图像、没有听到的音频，不得宣布验收。<\/strong><\/p>\n<p>本指南不会自动调用模型、安装插件或购买服务。付费生成要用户对实际请求和开销做明确决定。把创作样稿当成调用许可，是两件不同的事。<\/p>\n<h2 id=\"practice-04-agent-use-section-4\">生产只有一份\"当前决定\"<\/h2>\n<p>当前镜头说明、批准的素材、实际通过的区间，三者应该对得上。<\/p>\n<p>不把旧提示词、旧状态、旧回执当最新依据。新改动影响服装、台词或终点时，更新受影响的交接。与本镜无关的信息不用传给所有人。<\/p>\n<h2 id=\"practice-04-agent-use-section-5\">知识怎么更新<\/h2>\n<p>某条方法在一个模型里有效，只记录到它的适用条件，不立刻升格为全平台原则。<\/p>\n<p>模型接口变了，优先更新<a href=\"#/workflows/08-model-adaptation\">工具适配<\/a>和官方来源。艺术方法不用随每次发布重写。<\/p>\n<p>六层方法和两张图谱是这次综合提出的创作工具，适合用实际作品反复检验。把不同结果补充为带媒体依据的案例，不编造\"已验证最佳实践\"。<\/p>\n<h2 id=\"practice-04-agent-use-section-6\">关于附带的 skill<\/h2>\n<p>这个包附带一个自包含的 skill：<code>skills/contemporary-prompt-expert/<\/code>。它是给 AI 助手的<strong>导航入口<\/strong>，内部所有链接都指向 skill 文件夹自己的 <code>references/<\/code> 和 <code>examples/<\/code>，装到哪里都能用。<\/p>\n<p>它不代表已经在任何应用里安装。安装方式见根目录的 <code>使用说明.md<\/code>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/okf\">OKF 封装说明<\/a><\/p>\n<\/details>","text":"# 40｜给 AI 助手和团队的用法\n\n## 先认清现在在做什么\n\n探索、写稿、准备资产、生成、修图、验片、剪辑——这是不同任务。\n\n用户只要一句提示词，不要输出整套制片流程。用户要做一个系列，也不能只给一句漂亮描述就结束。\n\n**按任务取用**：检索时先看总目录，再拿当前任务相关的两三篇。需要身体表演，就读表演、动作和一个案例。不要每次把 47 篇全塞进上下文。\n\n## 角色分工\n\n| 谁判断 | 主要决定什么 | 提示词作者负责什么 |\n| --- | --- | --- |\n| 导演 / 创意负责人 | 观众体验、故事、形式选择 | 准确表达，不暗中改题 |\n| 美术 / 摄影 | 造型、空间、材质、光、观看位置 | 组织有效参考，写清楚描述 |\n| 表演 / 声音 | 人物行为、说话关系、听觉结构 | 声线和当场状态分开写 |\n| 编辑 / 生成执行 | 片段选择、接头、参数、任务模式 | 把说明编成接口能用的输入，记录实际结果 |\n\n一个人可以兼多项，AI 助手也能协作。关键不是人头数，是**决定有没有被准确传递**。\n\n## 给助手的最小工作顺序\n\n1. 读已有目标和实际素材\n2. 指出影响任务的矛盾\n3. 在必要范围内展开或执行\n4. 给一份能用的结果\n5. 说明还需要验证什么\n\n除非任务复杂，不要求每次把这五步的过程全写出来。\n\n探索阶段可以提多个方向。**执行阶段不擅自新增人物、换包装、改结局。** 如果已有方案不成立，提最小变更和影响，不默默换一套创意。\n\n## 对参考、参数和工具保持诚实\n\n- 文件名 ≠ 文件已上传\n- 编号 ≠ 引用已绑定\n- 文字里的时长 ≠ 真实参数\n- 任务提交成功 ≠ 媒体通过\n\n**没有读到的图像、没有听到的音频，不得宣布验收。**\n\n本指南不会自动调用模型、安装插件或购买服务。付费生成要用户对实际请求和开销做明确决定。把创作样稿当成调用许可，是两件不同的事。\n\n## 生产只有一份\"当前决定\"\n\n当前镜头说明、批准的素材、实际通过的区间，三者应该对得上。\n\n不把旧提示词、旧状态、旧回执当最新依据。新改动影响服装、台词或终点时，更新受影响的交接。与本镜无关的信息不用传给所有人。\n\n## 知识怎么更新\n\n某条方法在一个模型里有效，只记录到它的适用条件，不立刻升格为全平台原则。\n\n模型接口变了，优先更新[工具适配](/workflows/08-model-adaptation.md)和官方来源。艺术方法不用随每次发布重写。\n\n六层方法和两张图谱是这次综合提出的创作工具，适合用实际作品反复检验。把不同结果补充为带媒体依据的案例，不编造\"已验证最佳实践\"。\n\n## 关于附带的 skill\n\n这个包附带一个自包含的 skill：`skills/contemporary-prompt-expert/`。它是给 AI 助手的**导航入口**，内部所有链接都指向 skill 文件夹自己的 `references/` 和 `examples/`，装到哪里都能用。\n\n它不代表已经在任何应用里安装。安装方式见根目录的 `使用说明.md`。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [OKF 封装说明](/references/okf.md)","toc":[{"id":"practice-04-agent-use-section-0","title":"先认清现在在做什么"},{"id":"practice-04-agent-use-section-1","title":"角色分工"},{"id":"practice-04-agent-use-section-2","title":"给助手的最小工作顺序"},{"id":"practice-04-agent-use-section-3","title":"对参考、参数和工具保持诚实"},{"id":"practice-04-agent-use-section-4","title":"生产只有一份\"当前决定\""},{"id":"practice-04-agent-use-section-5","title":"知识怎么更新"},{"id":"practice-04-agent-use-section-6","title":"关于附带的 skill"}]},{"id":"references/index","path":"references/index.md","title":"VII · 来源与理论","description":"","type":"Index","group":"references","tags":[],"html":"<h1>VII · 来源与理论<\/h1>\n<p>这本书依据什么写成、借了哪些理论、每组教程去了哪一章。不认识的词来术语表查。<\/p>\n<ul>\n<li><p><a href=\"#/references/glossary\">术语表：书里反复出现的词，一句话解释<\/a> — 读到不认识的词来这里查。<\/p>\n<\/li>\n<li><p><a href=\"#/references/corpus\">这本书依据什么写成<\/a> — 三层来源：用户资料、官方文档、这次新写的方法。<\/p>\n<\/li>\n<li><p><a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a> — 每组原本讲什么、这本书保留了什么、去了哪几章。<\/p>\n<\/li>\n<li><p><a href=\"#/references/theory\">借用了哪些理论，借到什么程度<\/a> — 四篇原研究，各支持一座小桥。再加五条待检验的推论。<\/p>\n<\/li>\n<li><p><a href=\"#/references/official-image\">图像工具的官方说法<\/a> — 四家图像工具的官方文档各说了什么。<\/p>\n<\/li>\n<li><p><a href=\"#/references/official-video\">视频工具的官方说法<\/a> — 视频工具的官方指南，哪些是当前建议、哪些已归档。<\/p>\n<\/li>\n<li><p><a href=\"#/references/official-voice-light\">配音和灯光的官方说法<\/a> — 省略号不等于固定停顿；硬光不等于亮。<\/p>\n<\/li>\n<li><p><a href=\"#/references/okf\">OKF 封装说明<\/a> — 知识包怎么组织、怎么校验、怎么更新。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# VII · 来源与理论\n\n这本书依据什么写成、借了哪些理论、每组教程去了哪一章。不认识的词来术语表查。\n\n- [术语表：书里反复出现的词，一句话解释](/references/glossary.md) — 读到不认识的词来这里查。\n\n- [这本书依据什么写成](/references/corpus.md) — 三层来源：用户资料、官方文档、这次新写的方法。\n\n- [13 组教程进入了哪些章节](/references/tutorial-map.md) — 每组原本讲什么、这本书保留了什么、去了哪几章。\n\n- [借用了哪些理论，借到什么程度](/references/theory.md) — 四篇原研究，各支持一座小桥。再加五条待检验的推论。\n\n- [图像工具的官方说法](/references/official-image.md) — 四家图像工具的官方文档各说了什么。\n\n- [视频工具的官方说法](/references/official-video.md) — 视频工具的官方指南，哪些是当前建议、哪些已归档。\n\n- [配音和灯光的官方说法](/references/official-voice-light.md) — 省略号不等于固定停顿；硬光不等于亮。\n\n- [OKF 封装说明](/references/okf.md) — 知识包怎么组织、怎么校验、怎么更新。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"references/corpus","path":"references/corpus.md","title":"这本书依据什么写成","description":"说清楚三层来源：用户的教程资料、外部官方文档、这次新写的方法。哪些是证据，哪些是设计，不混着说。","type":"Reference","group":"references","tags":["来源","范围","证据"],"html":"<h1>这本书依据什么写成<\/h1>\n<h2 id=\"references-corpus-section-0\">一句话版本<\/h2>\n<p>这本书读的是 13 组 AI 影视教程的<strong>文字复审稿<\/strong>，查了几份<strong>官方工具文档<\/strong>和<strong>四篇原研究/原作者文章<\/strong>，然后<strong>自己设计<\/strong>了六个问题、三种稿子、两张图谱、八个案例、六张模板和十二道练习。<\/p>\n<p>设计的部分有道理可讲，但<strong>没有跑过生成实验<\/strong>。<\/p>\n<h2 id=\"references-corpus-section-1\">直接读了什么<\/h2>\n<p>教程材料来自上一轮整理好的文字复审包：<code>ciwei-ai-shortfilm-notes-text-review-overlay-20260917.zip<\/code>。共 31 个文件：26 份是 13 组教程的方法论与提示词文档，3 份是根目录说明与综合方法，2 份是范围与校验元数据。<\/p>\n<p>那一轮复审依据的原仓库版本是 <code>5887b2040f642782ce29473bd6cb8b2f8129458b<\/code>。这本书不把那个版本和现在的主分支混用，也<strong>没有<\/strong>重新看原视频、听原音轨或逐张读截图。<\/p>\n<p>交付工作区里的 <code>sources/tutorial-text-review-source.zip<\/code> 保留了这份输入的原始字节，方便回看。它是文字覆盖包，不是完整原仓库。文件级范围和 SHA-256 在 <code>qa/scope_manifest.json<\/code>。<\/p>\n<h2 id=\"references-corpus-section-2\">三层来源，各是各的<\/h2>\n<p><strong>第一层：用户资料。<\/strong> 教程里的操作经验、旧整理的遗漏和纠正。它们提供问题样本。每组去了哪一章，见<a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a>。<\/p>\n<p><strong>第二层：外部核验。<\/strong> 官方工具文档用来说明输入角色、适配和边界；原研究和原作者文章用来搭理论桥。访问日期 2026-09-17。网页会更新，这里不是网页快照。<\/p>\n<p><strong>第三层：本次综合。<\/strong> 六个问题、三种稿子、通感维度、情绪与氛围图谱、六张模板、十二道练习、八个案例——全部是这次重组或原创设计。<strong>它们有可说明的逻辑，不等于通过了生成实验。<\/strong><\/p>\n<h2 id=\"references-corpus-section-3\">这次实际做了什么<\/h2>\n<p>读了上述 29 份 Markdown 和范围元数据；读了用户提供的 <code>okf-bundle-ready.zip<\/code> 里的 skill、规范、模板和工具脚本；结合官方资料写了这本书；构建了离线 HTML、知识包、自包含 skill 和校验工具；对实际文件做了结构和阅读器检查。<\/p>\n<p><strong>没有做的<\/strong>：没有调用生图、生视频、语音或音乐接口；没有编造成功率、成本降低比例或盲测分数。所有案例里的时长、角色和参考代称都是设计条件，不是已经存在的媒体结果。<\/p>\n<h2 id=\"references-corpus-section-4\">为什么不照 13 个文件夹排<\/h2>\n<p>上一轮按教程排，适合追溯原例。这次按创作任务排，适合学习和调用。一条教程可能进入表演、声音、参考分工好几章；一种方法也可能融合好几条教程。映射表保留出处，正文不重复 13 次。<\/p>\n<h2 id=\"references-corpus-section-5\">哪些内容没有升级成知识<\/h2>\n<ul>\n<li>没确认的原提示词残字<\/li>\n<li>第三方界面的型号和限额<\/li>\n<li>口播里说的成功率<\/li>\n<li>未核实的名人引言<\/li>\n<li>\"词元按顺序所以画面按顺序执行\"这类机制解释<\/li>\n<\/ul>\n<p>这些都不作为理论依据。源材料保留供复核，不直接洗成新的确定事实。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b\" rel=\"noopener noreferrer\" target=\"_blank\">原教程仓库固定版本<\/a><\/p>\n<p>[2] 本会话已提供的文字复审 ZIP；交付工作区内同字节副本 <code>sources/tutorial-text-review-source.zip<\/code>。<\/p>\n<p>[3] 用户提供的 <code>okf-bundle-ready.zip<\/code>；只用于封装与校验方法，不作为影视创作理论来源。<\/p>\n<\/details>","text":"# 这本书依据什么写成\n\n## 一句话版本\n\n这本书读的是 13 组 AI 影视教程的**文字复审稿**，查了几份**官方工具文档**和**四篇原研究/原作者文章**，然后**自己设计**了六个问题、三种稿子、两张图谱、八个案例、六张模板和十二道练习。\n\n设计的部分有道理可讲，但**没有跑过生成实验**。\n\n## 直接读了什么\n\n教程材料来自上一轮整理好的文字复审包：`ciwei-ai-shortfilm-notes-text-review-overlay-20260917.zip`。共 31 个文件：26 份是 13 组教程的方法论与提示词文档，3 份是根目录说明与综合方法，2 份是范围与校验元数据。\n\n那一轮复审依据的原仓库版本是 `5887b2040f642782ce29473bd6cb8b2f8129458b`。这本书不把那个版本和现在的主分支混用，也**没有**重新看原视频、听原音轨或逐张读截图。\n\n交付工作区里的 `sources/tutorial-text-review-source.zip` 保留了这份输入的原始字节，方便回看。它是文字覆盖包，不是完整原仓库。文件级范围和 SHA-256 在 `qa/scope_manifest.json`。\n\n## 三层来源，各是各的\n\n**第一层：用户资料。** 教程里的操作经验、旧整理的遗漏和纠正。它们提供问题样本。每组去了哪一章，见[13 组教程进入了哪些章节](/references/tutorial-map.md)。\n\n**第二层：外部核验。** 官方工具文档用来说明输入角色、适配和边界；原研究和原作者文章用来搭理论桥。访问日期 2026-09-17。网页会更新，这里不是网页快照。\n\n**第三层：本次综合。** 六个问题、三种稿子、通感维度、情绪与氛围图谱、六张模板、十二道练习、八个案例——全部是这次重组或原创设计。**它们有可说明的逻辑，不等于通过了生成实验。**\n\n## 这次实际做了什么\n\n读了上述 29 份 Markdown 和范围元数据；读了用户提供的 `okf-bundle-ready.zip` 里的 skill、规范、模板和工具脚本；结合官方资料写了这本书；构建了离线 HTML、知识包、自包含 skill 和校验工具；对实际文件做了结构和阅读器检查。\n\n**没有做的**：没有调用生图、生视频、语音或音乐接口；没有编造成功率、成本降低比例或盲测分数。所有案例里的时长、角色和参考代称都是设计条件，不是已经存在的媒体结果。\n\n## 为什么不照 13 个文件夹排\n\n上一轮按教程排，适合追溯原例。这次按创作任务排，适合学习和调用。一条教程可能进入表演、声音、参考分工好几章；一种方法也可能融合好几条教程。映射表保留出处，正文不重复 13 次。\n\n## 哪些内容没有升级成知识\n\n- 没确认的原提示词残字\n- 第三方界面的型号和限额\n- 口播里说的成功率\n- 未核实的名人引言\n- \"词元按顺序所以画面按顺序执行\"这类机制解释\n\n这些都不作为理论依据。源材料保留供复核，不直接洗成新的确定事实。\n\n# Citations\n\n[1] [原教程仓库固定版本](https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b)\n\n[2] 本会话已提供的文字复审 ZIP；交付工作区内同字节副本 `sources/tutorial-text-review-source.zip`。\n\n[3] 用户提供的 `okf-bundle-ready.zip`；只用于封装与校验方法，不作为影视创作理论来源。","toc":[{"id":"references-corpus-section-0","title":"一句话版本"},{"id":"references-corpus-section-1","title":"直接读了什么"},{"id":"references-corpus-section-2","title":"三层来源，各是各的"},{"id":"references-corpus-section-3","title":"这次实际做了什么"},{"id":"references-corpus-section-4","title":"为什么不照 13 个文件夹排"},{"id":"references-corpus-section-5","title":"哪些内容没有升级成知识"}]},{"id":"references/glossary","path":"references/glossary.md","title":"术语表：书里反复出现的词，一句话解释","description":"读到不认识的词来这里查。按\"写提示词的词\"\"影视的词\"\"工具的词\"\"这本书自创的词\"分四组。","type":"Reference","group":"references","tags":["术语","查阅","入门"],"html":"<h1>术语表：书里反复出现的词，一句话解释<\/h1>\n<p>按四组排。每个词一句话，后面标注在哪一章讲得最细。<\/p>\n<h2 id=\"references-glossary-section-0\">一、这本书自创的词<\/h2>\n<p><strong>六个问题<\/strong>：写提示词前问自己的六件事——想让人感到什么、靠什么承载、谁在做什么、观众从哪看、给哪个工具、怎么判断成不成。→ <a href=\"#/foundations/02-six-layer-method\">02<\/a><\/p>\n<p><strong>感受稿<\/strong>：给自己看的那一稿。可以很抽象，\"像一封没封口的信\"也行。→ <a href=\"#/foundations/03-three-drafts\">03<\/a><\/p>\n<p><strong>创作说明<\/strong>：给团队看的那一稿。说清楚要什么、不要什么、为什么。→ <a href=\"#/foundations/03-three-drafts\">03<\/a><\/p>\n<p><strong>执行稿<\/strong>：给 AI 看的那一稿。具体、可见、按工具的习惯写。→ <a href=\"#/foundations/03-three-drafts\">03<\/a><\/p>\n<p><strong>通感<\/strong>：借一种感觉的形状去描述另一种感觉。关键是转移\"关系\"，不是搬\"物件\"。→ <a href=\"#/language/01-sensory-translation\">06<\/a><\/p>\n<p><strong>情绪图谱 / 氛围图谱<\/strong>：两张查表。同一个情绪词，列出它可以落在哪些不同的身体动作或材料上。→ <a href=\"#/language/04-emotion-atlas\">09<\/a>、<a href=\"#/language/05-atmosphere-atlas\">10<\/a><\/p>\n<p><strong>改写诊所<\/strong>：12 组\"写成这样 → 改成这样\"的对照。→ <a href=\"#/language/06-rewrite-clinic\">11<\/a><\/p>\n<p><strong>状态表<\/strong>：一张表，记录每个时段里每个关键物件在谁手上、在哪。用于多镜头和复杂调度。→ <a href=\"#/cases/08-object-exchange\">36<\/a><\/p>\n<p><strong>交接状态<\/strong>：一个镜头结束时，谁在哪、拿着什么、光和声音是什么样。下一个镜头从这里接。→ <a href=\"#/workflows/05-assets-multishot\">25<\/a><\/p>\n<p><strong>文本预审 vs 媒体验收<\/strong>：没看到生成结果时只能检查文字有没有矛盾，叫文本预审。看到了实际画面和声音才叫验收。这本书全部停在前者。→ <a href=\"#/practice/03-review-rubric\">39<\/a><\/p>\n<h2 id=\"references-glossary-section-1\">二、写提示词会碰到的词<\/h2>\n<p><strong>提示词<\/strong>：你交给 AI 的那段话。当代写法更像说明书 + 短剧本，不是关键词清单。→ <a href=\"#/foundations/01-what-this-field-is\">01<\/a><\/p>\n<p><strong>首帧<\/strong>：图生视频时给的那张图。它定下了姿势、构图、光。视频从它开始发生。→ <a href=\"#/workflows/04-image-to-video\">24<\/a><\/p>\n<p><strong>身份参考<\/strong>：用来告诉 AI \"这个人长这样\"的图。它不是首帧，不决定动作起点。→ <a href=\"#/workflows/04-image-to-video\">24<\/a><\/p>\n<p><strong>布局参考 / 风格参考<\/strong>：分别告诉 AI \"空间怎么摆\"和\"画面什么味道\"的图。角色分开，不要混。→ <a href=\"#/workflows/05-assets-multishot\">25<\/a><\/p>\n<p><strong>蒙版<\/strong>：改图时画出来的\"只改这里\"的区域。官方文档说它的形状不一定被精确遵循。→ <a href=\"#/workflows/03-image-edit\">23<\/a><\/p>\n<p><strong>负向提示<\/strong>：告诉 AI \"不要什么\"的字段。有的工具支持，有的不支持，有的只接受正向表述。→ <a href=\"#/workflows/08-model-adaptation\">28<\/a><\/p>\n<p><strong>底图<\/strong>：生成时作为基础的那张图。改图、图生视频都从底图出发。→ <a href=\"#/workflows/03-image-edit\">23<\/a><\/p>\n<p><strong>资产 / 资产库<\/strong>：角色、场景、道具的参考图和说明，做多镜头时反复用。库可以丰富，每次提交要精选。→ <a href=\"#/workflows/05-assets-multishot\">25<\/a><\/p>\n<p><strong>AI 味<\/strong>：一个模糊的抱怨词，通常指底图、运动、光照、剪辑里的某一个具体问题。要拆开找。→ <a href=\"#/workflows/07-evaluate-repair\">27<\/a><\/p>\n<p><strong>留白<\/strong>：画面里故意空着的地方。给字、给呼吸、给注意力。→ <a href=\"#/craft/08-still-graphic-style\">19<\/a><\/p>\n<p><strong>视觉中心<\/strong>：观众第一眼看的地方。一张图通常只能有一个。→ <a href=\"#/workflows/02-text-to-image\">22<\/a><\/p>\n<h2 id=\"references-glossary-section-2\">三、影视的词<\/h2>\n<p><strong>机位<\/strong>：摄影机放在哪。高度、距离、朝向。→ <a href=\"#/craft/04-camera-attention\">15<\/a><\/p>\n<p><strong>取景<\/strong>：画面里框进来多大范围。全景（看到整个空间）、中景（腰以上）、近景（胸以上）、特写（脸或手）。→ <a href=\"#/craft/04-camera-attention\">15<\/a><\/p>\n<p><strong>运镜<\/strong>：摄影机怎么动。推、拉、摇、移、跟。不动也是一种选择。→ <a href=\"#/craft/04-camera-attention\">15<\/a><\/p>\n<p><strong>平视 / 俯视 / 低角度<\/strong>：摄影机和被拍对象等高 / 从上往下 / 从下往上。→ <a href=\"#/craft/04-camera-attention\">15<\/a><\/p>\n<p><strong>调度<\/strong>：安排人和东西在空间里怎么走、怎么站、什么时候动。→ <a href=\"#/craft/03-action-blocking\">14<\/a><\/p>\n<p><strong>一镜到底<\/strong>：不剪，一个镜头拍完整段。对 AI 生成来说难度很高。→ <a href=\"#/workflows/06-previs\">26<\/a><\/p>\n<p><strong>空镜<\/strong>：画面里没有人的镜头。走廊、桌面、窗外。→ <a href=\"#/cases/05-empty-corridor\">33<\/a><\/p>\n<p><strong>遮挡<\/strong>：一个东西挡住另一个东西。会影响观众能不能看到关键动作。→ <a href=\"#/craft/04-camera-attention\">15<\/a><\/p>\n<p><strong>同框<\/strong>：两个东西在同一画面里。同框时物件够不够大能看清，是常见问题。→ <a href=\"#/craft/04-camera-attention\">15<\/a><\/p>\n<p><strong>连续性<\/strong>：镜头之间接得上——同一个人、同一件衣服、杯子还在同一边。→ <a href=\"#/workflows/05-assets-multishot\">25<\/a><\/p>\n<p><strong>硬光 / 软光<\/strong>：影子边缘清晰 = 硬光（小光源、直射太阳）；影子边缘模糊 = 软光（大光源、阴天、柔光箱）。硬光不等于亮。→ <a href=\"#/craft/05-light-material\">16<\/a><\/p>\n<p><strong>逆光 / 侧光 / 顺光<\/strong>：光从对象后面来 / 从侧面来 / 从摄影机方向来。→ <a href=\"#/craft/05-light-material\">16<\/a><\/p>\n<p><strong>场内声 / 配乐<\/strong>：场内声是画面里那个世界有的声音（脚步、碗筷）；配乐是加上去的音乐，角色听不到。→ <a href=\"#/craft/07-sound-music\">18<\/a><\/p>\n<p><strong>环境音 / 底噪<\/strong>：一个空间本身就有的持续声音。冰箱嗡嗡、远处车流。→ <a href=\"#/craft/07-sound-music\">18<\/a><\/p>\n<p><strong>跟随动态<\/strong>：主动作带起来的次级运动。人转身，头发和衣角跟着甩。→ <a href=\"#/craft/03-action-blocking\">14<\/a><\/p>\n<p><strong>节拍<\/strong>：一段内容里的时间划分。哪几秒干什么。→ <a href=\"#/craft/09-time-montage\">20<\/a><\/p>\n<p><strong>主视觉<\/strong>：一个项目最核心的那张图。海报、封面、广告主图。→ <a href=\"#/cases/06-surreal-perfume\">34<\/a><\/p>\n<h2 id=\"references-glossary-section-3\">四、工具和流程的词<\/h2>\n<p><strong>文生图 / 图生视频 / 改图<\/strong>：三种基本任务——从文字造一张图、从一张图生成视频、改一张已有的图。→ <a href=\"#/workflows/02-text-to-image\">22<\/a>、<a href=\"#/workflows/04-image-to-video\">24<\/a>、<a href=\"#/workflows/03-image-edit\">23<\/a><\/p>\n<p><strong>预演<\/strong>：正式生成之前，先用简化模型或草图检查空间、路线、遮挡。→ <a href=\"#/workflows/06-previs\">26<\/a><\/p>\n<p><strong>分层合成<\/strong>：把画面拆成几层分别生成，最后在后期软件里叠起来。→ <a href=\"#/cases/06-surreal-perfume\">34<\/a><\/p>\n<p><strong>工具适配<\/strong>：同一个创意，给不同工具写不同的执行稿。→ <a href=\"#/workflows/08-model-adaptation\">28<\/a><\/p>\n<p><strong>OKF<\/strong>：Open Knowledge Format，这个知识包用的文件组织格式。→ <a href=\"#/references/okf\">OKF 封装说明<\/a><\/p>\n<p><strong>skill<\/strong>：给 AI 助手用的一个文件夹，告诉它什么时候用这本书、怎么用。→ <a href=\"#/practice/04-agent-use\">40<\/a><\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 术语表：书里反复出现的词，一句话解释\n\n按四组排。每个词一句话，后面标注在哪一章讲得最细。\n\n## 一、这本书自创的词\n\n**六个问题**：写提示词前问自己的六件事——想让人感到什么、靠什么承载、谁在做什么、观众从哪看、给哪个工具、怎么判断成不成。→ [02](/foundations/02-six-layer-method.md)\n\n**感受稿**：给自己看的那一稿。可以很抽象，\"像一封没封口的信\"也行。→ [03](/foundations/03-three-drafts.md)\n\n**创作说明**：给团队看的那一稿。说清楚要什么、不要什么、为什么。→ [03](/foundations/03-three-drafts.md)\n\n**执行稿**：给 AI 看的那一稿。具体、可见、按工具的习惯写。→ [03](/foundations/03-three-drafts.md)\n\n**通感**：借一种感觉的形状去描述另一种感觉。关键是转移\"关系\"，不是搬\"物件\"。→ [06](/language/01-sensory-translation.md)\n\n**情绪图谱 / 氛围图谱**：两张查表。同一个情绪词，列出它可以落在哪些不同的身体动作或材料上。→ [09](/language/04-emotion-atlas.md)、[10](/language/05-atmosphere-atlas.md)\n\n**改写诊所**：12 组\"写成这样 → 改成这样\"的对照。→ [11](/language/06-rewrite-clinic.md)\n\n**状态表**：一张表，记录每个时段里每个关键物件在谁手上、在哪。用于多镜头和复杂调度。→ [36](/cases/08-object-exchange.md)\n\n**交接状态**：一个镜头结束时，谁在哪、拿着什么、光和声音是什么样。下一个镜头从这里接。→ [25](/workflows/05-assets-multishot.md)\n\n**文本预审 vs 媒体验收**：没看到生成结果时只能检查文字有没有矛盾，叫文本预审。看到了实际画面和声音才叫验收。这本书全部停在前者。→ [39](/practice/03-review-rubric.md)\n\n## 二、写提示词会碰到的词\n\n**提示词**：你交给 AI 的那段话。当代写法更像说明书 + 短剧本，不是关键词清单。→ [01](/foundations/01-what-this-field-is.md)\n\n**首帧**：图生视频时给的那张图。它定下了姿势、构图、光。视频从它开始发生。→ [24](/workflows/04-image-to-video.md)\n\n**身份参考**：用来告诉 AI \"这个人长这样\"的图。它不是首帧，不决定动作起点。→ [24](/workflows/04-image-to-video.md)\n\n**布局参考 / 风格参考**：分别告诉 AI \"空间怎么摆\"和\"画面什么味道\"的图。角色分开，不要混。→ [25](/workflows/05-assets-multishot.md)\n\n**蒙版**：改图时画出来的\"只改这里\"的区域。官方文档说它的形状不一定被精确遵循。→ [23](/workflows/03-image-edit.md)\n\n**负向提示**：告诉 AI \"不要什么\"的字段。有的工具支持，有的不支持，有的只接受正向表述。→ [28](/workflows/08-model-adaptation.md)\n\n**底图**：生成时作为基础的那张图。改图、图生视频都从底图出发。→ [23](/workflows/03-image-edit.md)\n\n**资产 / 资产库**：角色、场景、道具的参考图和说明，做多镜头时反复用。库可以丰富，每次提交要精选。→ [25](/workflows/05-assets-multishot.md)\n\n**AI 味**：一个模糊的抱怨词，通常指底图、运动、光照、剪辑里的某一个具体问题。要拆开找。→ [27](/workflows/07-evaluate-repair.md)\n\n**留白**：画面里故意空着的地方。给字、给呼吸、给注意力。→ [19](/craft/08-still-graphic-style.md)\n\n**视觉中心**：观众第一眼看的地方。一张图通常只能有一个。→ [22](/workflows/02-text-to-image.md)\n\n## 三、影视的词\n\n**机位**：摄影机放在哪。高度、距离、朝向。→ [15](/craft/04-camera-attention.md)\n\n**取景**：画面里框进来多大范围。全景（看到整个空间）、中景（腰以上）、近景（胸以上）、特写（脸或手）。→ [15](/craft/04-camera-attention.md)\n\n**运镜**：摄影机怎么动。推、拉、摇、移、跟。不动也是一种选择。→ [15](/craft/04-camera-attention.md)\n\n**平视 / 俯视 / 低角度**：摄影机和被拍对象等高 / 从上往下 / 从下往上。→ [15](/craft/04-camera-attention.md)\n\n**调度**：安排人和东西在空间里怎么走、怎么站、什么时候动。→ [14](/craft/03-action-blocking.md)\n\n**一镜到底**：不剪，一个镜头拍完整段。对 AI 生成来说难度很高。→ [26](/workflows/06-previs.md)\n\n**空镜**：画面里没有人的镜头。走廊、桌面、窗外。→ [33](/cases/05-empty-corridor.md)\n\n**遮挡**：一个东西挡住另一个东西。会影响观众能不能看到关键动作。→ [15](/craft/04-camera-attention.md)\n\n**同框**：两个东西在同一画面里。同框时物件够不够大能看清，是常见问题。→ [15](/craft/04-camera-attention.md)\n\n**连续性**：镜头之间接得上——同一个人、同一件衣服、杯子还在同一边。→ [25](/workflows/05-assets-multishot.md)\n\n**硬光 / 软光**：影子边缘清晰 = 硬光（小光源、直射太阳）；影子边缘模糊 = 软光（大光源、阴天、柔光箱）。硬光不等于亮。→ [16](/craft/05-light-material.md)\n\n**逆光 / 侧光 / 顺光**：光从对象后面来 / 从侧面来 / 从摄影机方向来。→ [16](/craft/05-light-material.md)\n\n**场内声 / 配乐**：场内声是画面里那个世界有的声音（脚步、碗筷）；配乐是加上去的音乐，角色听不到。→ [18](/craft/07-sound-music.md)\n\n**环境音 / 底噪**：一个空间本身就有的持续声音。冰箱嗡嗡、远处车流。→ [18](/craft/07-sound-music.md)\n\n**跟随动态**：主动作带起来的次级运动。人转身，头发和衣角跟着甩。→ [14](/craft/03-action-blocking.md)\n\n**节拍**：一段内容里的时间划分。哪几秒干什么。→ [20](/craft/09-time-montage.md)\n\n**主视觉**：一个项目最核心的那张图。海报、封面、广告主图。→ [34](/cases/06-surreal-perfume.md)\n\n## 四、工具和流程的词\n\n**文生图 / 图生视频 / 改图**：三种基本任务——从文字造一张图、从一张图生成视频、改一张已有的图。→ [22](/workflows/02-text-to-image.md)、[24](/workflows/04-image-to-video.md)、[23](/workflows/03-image-edit.md)\n\n**预演**：正式生成之前，先用简化模型或草图检查空间、路线、遮挡。→ [26](/workflows/06-previs.md)\n\n**分层合成**：把画面拆成几层分别生成，最后在后期软件里叠起来。→ [34](/cases/06-surreal-perfume.md)\n\n**工具适配**：同一个创意，给不同工具写不同的执行稿。→ [28](/workflows/08-model-adaptation.md)\n\n**OKF**：Open Knowledge Format，这个知识包用的文件组织格式。→ [OKF 封装说明](/references/okf.md)\n\n**skill**：给 AI 助手用的一个文件夹，告诉它什么时候用这本书、怎么用。→ [40](/practice/04-agent-use.md)\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"references-glossary-section-0","title":"一、这本书自创的词"},{"id":"references-glossary-section-1","title":"二、写提示词会碰到的词"},{"id":"references-glossary-section-2","title":"三、影视的词"},{"id":"references-glossary-section-3","title":"四、工具和流程的词"}]},{"id":"references/official-image","path":"references/official-image.md","title":"图像工具的官方说法","description":"四家图像工具的官方文档各说了什么，这本书用了哪一句，没有推出哪些结论。","type":"Reference","group":"references","tags":["官方","生图","编辑"],"html":"<h1>图像工具的官方说法<\/h1>\n<p>访问和核验日期：2026-09-17。只摘和这本书有关的内容，不复制官方长篇示例。链接是动态页面，以后用需要重新核对。<\/p>\n<p><strong>这不是模型排名。<\/strong> 只说每家文档写了什么，以及这本书据此提醒了什么。<\/p>\n<h2 id=\"references-official-image-section-0\">Midjourney：Prompt Basics<\/h2>\n<p>官方基础指南仍然强调简洁清楚，短句往往比长指令清单更合适。[1]<\/p>\n<p><strong>这本书用它来反对一种说法<\/strong>：\"当代提示词必须全部改成长段自然语言，关键词已经完全失效。\" 不是这样。丰富的构思和给工具的输入是两回事。<\/p>\n<p><strong>不能推出<\/strong>：某个模型在某任务上更强；删掉某个词一定会改善画面。<\/p>\n<h2 id=\"references-official-image-section-1\">Google：Gemini 图像生成指南<\/h2>\n<p>官方文档包含风格化图像、文字与图像联合编辑等用法，用主体、媒介、细节和修改目标来组织描述。[2]<\/p>\n<p><strong>这本书用它来说明<\/strong>：图像任务可以用自然说明交代关系和修改，但要按实际任务组织，不是只把句子变长。<\/p>\n<p><strong>不能推出<\/strong>：每个接口都能分离身份、风格、布局；一次编辑能绝对锁住全部非目标像素。<\/p>\n<h2 id=\"references-official-image-section-2\">OpenAI：Image generation<\/h2>\n<p>官方图像编辑文档说明蒙版可以指导编辑，但其形状<strong>不一定被精确遵循<\/strong>；多图输入时也有特定的蒙版应用规则。[3]<\/p>\n<p><strong>这本书用它来区分<\/strong>：视觉打标、原生蒙版、后期精确合成是三种不同的东西。重要的非编辑区域仍需要对比检查。<\/p>\n<p><strong>不能推出<\/strong>：所有图像系统用相同的蒙版机制；写\"绝对不变\"就能得到像素级保证。<\/p>\n<h2 id=\"references-official-image-section-3\">Runway：Gen-4 Image Prompting Guide<\/h2>\n<p>这版图像指南同时讨论描述性句子和关键词组织。[4] 再次说明：工具、模式和任务比\"新派 / 旧派写法\"的二分更有实际意义。<\/p>\n<p><strong>版本边界<\/strong>：这里明确指 Gen-4 Image 相关指南，不代表该公司全部最新模型的规则。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://docs.midjourney.com/hc/en-us/articles/32023408776205-Prompt-Basics\" rel=\"noopener noreferrer\" target=\"_blank\">Midjourney — Prompt Basics<\/a><\/p>\n<p>[2] <a href=\"https://ai.google.dev/gemini-api/docs/image-generation\" rel=\"noopener noreferrer\" target=\"_blank\">Google — Image generation with Gemini<\/a><\/p>\n<p>[3] <a href=\"https://developers.openai.com/api/docs/guides/image-generation\" rel=\"noopener noreferrer\" target=\"_blank\">OpenAI — Image generation，Edit an image using a mask<\/a><\/p>\n<p>[4] <a href=\"https://help.runwayml.com/hc/en-us/articles/35694045317139-Gen-4-Image-Prompting-Guide\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Gen-4 Image Prompting Guide<\/a><\/p>\n<\/details>","text":"# 图像工具的官方说法\n\n访问和核验日期：2026-09-17。只摘和这本书有关的内容，不复制官方长篇示例。链接是动态页面，以后用需要重新核对。\n\n**这不是模型排名。** 只说每家文档写了什么，以及这本书据此提醒了什么。\n\n## Midjourney：Prompt Basics\n\n官方基础指南仍然强调简洁清楚，短句往往比长指令清单更合适。[1]\n\n**这本书用它来反对一种说法**：\"当代提示词必须全部改成长段自然语言，关键词已经完全失效。\" 不是这样。丰富的构思和给工具的输入是两回事。\n\n**不能推出**：某个模型在某任务上更强；删掉某个词一定会改善画面。\n\n## Google：Gemini 图像生成指南\n\n官方文档包含风格化图像、文字与图像联合编辑等用法，用主体、媒介、细节和修改目标来组织描述。[2]\n\n**这本书用它来说明**：图像任务可以用自然说明交代关系和修改，但要按实际任务组织，不是只把句子变长。\n\n**不能推出**：每个接口都能分离身份、风格、布局；一次编辑能绝对锁住全部非目标像素。\n\n## OpenAI：Image generation\n\n官方图像编辑文档说明蒙版可以指导编辑，但其形状**不一定被精确遵循**；多图输入时也有特定的蒙版应用规则。[3]\n\n**这本书用它来区分**：视觉打标、原生蒙版、后期精确合成是三种不同的东西。重要的非编辑区域仍需要对比检查。\n\n**不能推出**：所有图像系统用相同的蒙版机制；写\"绝对不变\"就能得到像素级保证。\n\n## Runway：Gen-4 Image Prompting Guide\n\n这版图像指南同时讨论描述性句子和关键词组织。[4] 再次说明：工具、模式和任务比\"新派 / 旧派写法\"的二分更有实际意义。\n\n**版本边界**：这里明确指 Gen-4 Image 相关指南，不代表该公司全部最新模型的规则。\n\n# Citations\n\n[1] [Midjourney — Prompt Basics](https://docs.midjourney.com/hc/en-us/articles/32023408776205-Prompt-Basics)\n\n[2] [Google — Image generation with Gemini](https://ai.google.dev/gemini-api/docs/image-generation)\n\n[3] [OpenAI — Image generation，Edit an image using a mask](https://developers.openai.com/api/docs/guides/image-generation)\n\n[4] [Runway — Gen-4 Image Prompting Guide](https://help.runwayml.com/hc/en-us/articles/35694045317139-Gen-4-Image-Prompting-Guide)","toc":[{"id":"references-official-image-section-0","title":"Midjourney：Prompt Basics"},{"id":"references-official-image-section-1","title":"Google：Gemini 图像生成指南"},{"id":"references-official-image-section-2","title":"OpenAI：Image generation"},{"id":"references-official-image-section-3","title":"Runway：Gen-4 Image Prompting Guide"}]},{"id":"references/official-video","path":"references/official-video.md","title":"视频工具的官方说法","description":"视频工具的官方指南各说了什么，哪些是当前建议、哪些已经归档，这本书主动不推出哪些结论。","type":"Reference","group":"references","tags":["官方","视频","版本"],"html":"<h1>视频工具的官方说法<\/h1>\n<p>访问和核验日期：2026-09-17。没有做供应商横向测试，不提供模型排名、价格、生成限额或保证时长。<\/p>\n<h2 id=\"references-official-video-section-0\">Runway：Image to Video Prompting Guide<\/h2>\n<p>官方指南把输入图像当作静态视觉条件，提示词主要描述运动、相机变化和时间推进。[1]<\/p>\n<p><strong>这本书据此区分<\/strong>：首帧接续 vs 从零生视频。写图生视频时别忽略首帧已经定下的姿势和构图。<\/p>\n<p><strong>不能推出<\/strong>：所有多模态身份参考都等于首帧；文字总能覆盖参考图；这本书写的动作一定会执行。<\/p>\n<h2 id=\"references-official-video-section-1\">Runway：Text to Video 与 Introduction to Prompting<\/h2>\n<p>官方资料讨论清楚的描述、时间安排和渐进迭代。[2][3]<\/p>\n<p><strong>这本书据此保留<\/strong>：简洁起步，按任务加信息。但不把某个提示词长度定为唯一规则。<\/p>\n<h2 id=\"references-official-video-section-2\">Runway：Gen-4 Video Prompting Guide<\/h2>\n<p>这版指南偏向<strong>正向表述<\/strong>，建议从简单动作逐步添加内容。[4]<\/p>\n<p><strong>重要边界<\/strong>：这不是\"所有视频模型都不支持负向提示\"的证据。具体模型和入口要单独核实。<\/p>\n<h2 id=\"references-official-video-section-3\">Google：视频提示指南<\/h2>\n<p>官方指南按主体、动作、环境、拍摄方式等维度说明输入，也提醒部分高级镜头和光学效果的可靠性可能变化。[5]<\/p>\n<p><strong>这本书据此建议<\/strong>：把镜头移动、旋转、变焦和观看范围分开写；专业术语要服务于看得见的画面。<\/p>\n<p><strong>不能推出<\/strong>：在文本里写焦距就一定得到准确透视；每个模型或聚合平台的接口能力相同。<\/p>\n<h2 id=\"references-official-video-section-4\">OpenAI：Sora2 Prompting Guide（已归档）<\/h2>\n<p>核验时页面已明确标为归档，可能涉及过时的模型和 API。[6] 这本书只借用其中一个创作层思路：\"详细控制和创作开放都可以有效，提示是指导不是保证。\"<\/p>\n<p><strong>不作为<\/strong>：当前产品是否可用、实际模型规格、生成长度、调用方法或价格的依据。<\/p>\n<h2 id=\"references-official-video-section-5\">这本书主动不推出的结论<\/h2>\n<p>没有从这些页面推出\"模型按提示词顺序逐句执行摄影机和演员动作\"，也不声称知道具体模型内部为什么偏好某个词。<strong>建议、经验和内部机制是三个不同层级。<\/strong><\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Image to Video Prompting Guide<\/a><\/p>\n<p>[2] <a href=\"https://help.runwayml.com/hc/en-us/articles/42460036199443-Text-to-Video-Prompting-Guide\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Text to Video Prompting Guide<\/a><\/p>\n<p>[3] <a href=\"https://help.runwayml.com/hc/en-us/articles/46182941379347-Introduction-to-Prompting\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Introduction to Prompting<\/a><\/p>\n<p>[4] <a href=\"https://help.runwayml.com/hc/en-us/articles/39789879462419-Gen-4-Video-Prompting-Guide\" rel=\"noopener noreferrer\" target=\"_blank\">Runway — Gen-4 Video Prompting Guide<\/a><\/p>\n<p>[5] <a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/video/video-gen-prompt-guide\" rel=\"noopener noreferrer\" target=\"_blank\">Google — Video generation prompt guide<\/a><\/p>\n<p>[6] <a href=\"https://developers.openai.com/cookbook/examples/sora/sora2_prompting_guide\" rel=\"noopener noreferrer\" target=\"_blank\">OpenAI — Sora2 Prompting Guide，已归档<\/a><\/p>\n<\/details>","text":"# 视频工具的官方说法\n\n访问和核验日期：2026-09-17。没有做供应商横向测试，不提供模型排名、价格、生成限额或保证时长。\n\n## Runway：Image to Video Prompting Guide\n\n官方指南把输入图像当作静态视觉条件，提示词主要描述运动、相机变化和时间推进。[1]\n\n**这本书据此区分**：首帧接续 vs 从零生视频。写图生视频时别忽略首帧已经定下的姿势和构图。\n\n**不能推出**：所有多模态身份参考都等于首帧；文字总能覆盖参考图；这本书写的动作一定会执行。\n\n## Runway：Text to Video 与 Introduction to Prompting\n\n官方资料讨论清楚的描述、时间安排和渐进迭代。[2][3]\n\n**这本书据此保留**：简洁起步，按任务加信息。但不把某个提示词长度定为唯一规则。\n\n## Runway：Gen-4 Video Prompting Guide\n\n这版指南偏向**正向表述**，建议从简单动作逐步添加内容。[4]\n\n**重要边界**：这不是\"所有视频模型都不支持负向提示\"的证据。具体模型和入口要单独核实。\n\n## Google：视频提示指南\n\n官方指南按主体、动作、环境、拍摄方式等维度说明输入，也提醒部分高级镜头和光学效果的可靠性可能变化。[5]\n\n**这本书据此建议**：把镜头移动、旋转、变焦和观看范围分开写；专业术语要服务于看得见的画面。\n\n**不能推出**：在文本里写焦距就一定得到准确透视；每个模型或聚合平台的接口能力相同。\n\n## OpenAI：Sora2 Prompting Guide（已归档）\n\n核验时页面已明确标为归档，可能涉及过时的模型和 API。[6] 这本书只借用其中一个创作层思路：\"详细控制和创作开放都可以有效，提示是指导不是保证。\"\n\n**不作为**：当前产品是否可用、实际模型规格、生成长度、调用方法或价格的依据。\n\n## 这本书主动不推出的结论\n\n没有从这些页面推出\"模型按提示词顺序逐句执行摄影机和演员动作\"，也不声称知道具体模型内部为什么偏好某个词。**建议、经验和内部机制是三个不同层级。**\n\n# Citations\n\n[1] [Runway — Image to Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide)\n\n[2] [Runway — Text to Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/42460036199443-Text-to-Video-Prompting-Guide)\n\n[3] [Runway — Introduction to Prompting](https://help.runwayml.com/hc/en-us/articles/46182941379347-Introduction-to-Prompting)\n\n[4] [Runway — Gen-4 Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/39789879462419-Gen-4-Video-Prompting-Guide)\n\n[5] [Google — Video generation prompt guide](https://cloud.google.com/vertex-ai/generative-ai/docs/video/video-gen-prompt-guide)\n\n[6] [OpenAI — Sora2 Prompting Guide，已归档](https://developers.openai.com/cookbook/examples/sora/sora2_prompting_guide)","toc":[{"id":"references-official-video-section-0","title":"Runway：Image to Video Prompting Guide"},{"id":"references-official-video-section-1","title":"Runway：Text to Video 与 Introduction to Prompting"},{"id":"references-official-video-section-2","title":"Runway：Gen-4 Video Prompting Guide"},{"id":"references-official-video-section-3","title":"Google：视频提示指南"},{"id":"references-official-video-section-4","title":"OpenAI：Sora2 Prompting Guide（已归档）"},{"id":"references-official-video-section-5","title":"这本书主动不推出的结论"}]},{"id":"references/official-voice-light","path":"references/official-voice-light.md","title":"配音和灯光的官方说法","description":"两个容易被误传的技术点：省略号不等于固定停顿秒数；硬光不等于亮。只校准概念，不用软件文档证明艺术效果。","type":"Reference","group":"references","tags":["官方","配音","光线"],"html":"<h1>配音和灯光的官方说法<\/h1>\n<p>访问和核验日期：2026-09-17。<\/p>\n<h2 id=\"references-official-voice-light-section-0\">ElevenLabs：停顿和模型语法<\/h2>\n<p>官方说明区分了不同模型的停顿控制方式：Eleven v3 用相关音频标签，而不是相同的 SSML break 方法；其他模型的支持各不相同；<strong>标点形成的停顿也不如专门的控制稳定。<\/strong>[1][2]<\/p>\n<p><strong>这本书据此提醒<\/strong>：别把\"……\"当成跨工具固定的 0.3 秒。台词和说明要按实际接口分开，时长要试听确认。<\/p>\n<p><strong>没有推出<\/strong>：哪种声线更真实、哪种情绪提示效果最好。也没有一张所有供应商通用的标签表。<\/p>\n<h2 id=\"references-official-voice-light-section-1\">Blender：Light Objects<\/h2>\n<p>这次成功核验的是 Blender 5.2 LTS 多语言手册页面，相关灯光说明为英文。手册把光源的<strong>功率<\/strong>和<strong>半径 / 尺寸<\/strong>分开说明：尺寸影响阴影软硬；聚光光束的边缘和物体投影的边缘也不是一回事。[3]<\/p>\n<p><strong>这本书据此校准<\/strong>：硬光不等于亮；光源方向不等于轮廓效果；百叶窗不是硬光成立的前提。<\/p>\n<p><strong>没有推出<\/strong>：AI 视频内部按 Blender 的渲染器计算；任何提示词能获得摄影测量级的精度。材质、拍摄和后期的具体设计仍然是这本书的创作建议。<\/p>\n<h2 id=\"references-official-voice-light-section-2\">核验路径说明<\/h2>\n<p>之前的复审包保留了旧版 Blender 英文链接。这次那个入口读取不成功，所以不宣称重新读到了那个旧页面，改用成功取得的 5.2 LTS 页面核验稳定概念。不由此推荐特定软件版本。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://elevenlabs.io/docs/help-center/product/core-capabilities/text-to-speech/how-can-i-add-pauses\" rel=\"noopener noreferrer\" target=\"_blank\">ElevenLabs — How can I add pauses?<\/a><\/p>\n<p>[2] <a href=\"https://elevenlabs.io/docs/help-center/technical/do-pauses-and-ssml-phoneme-tags-work-with-the-api\" rel=\"noopener noreferrer\" target=\"_blank\">ElevenLabs — Do pauses and SSML phoneme tags work with the API?<\/a><\/p>\n<p>[3] <a href=\"https://docs.blender.org/manual/nl/5.2/render/lights/light_object.html\" rel=\"noopener noreferrer\" target=\"_blank\">Blender 5.2 LTS Manual — Light Objects<\/a><\/p>\n<\/details>","text":"# 配音和灯光的官方说法\n\n访问和核验日期：2026-09-17。\n\n## ElevenLabs：停顿和模型语法\n\n官方说明区分了不同模型的停顿控制方式：Eleven v3 用相关音频标签，而不是相同的 SSML break 方法；其他模型的支持各不相同；**标点形成的停顿也不如专门的控制稳定。**[1][2]\n\n**这本书据此提醒**：别把\"……\"当成跨工具固定的 0.3 秒。台词和说明要按实际接口分开，时长要试听确认。\n\n**没有推出**：哪种声线更真实、哪种情绪提示效果最好。也没有一张所有供应商通用的标签表。\n\n## Blender：Light Objects\n\n这次成功核验的是 Blender 5.2 LTS 多语言手册页面，相关灯光说明为英文。手册把光源的**功率**和**半径 / 尺寸**分开说明：尺寸影响阴影软硬；聚光光束的边缘和物体投影的边缘也不是一回事。[3]\n\n**这本书据此校准**：硬光不等于亮；光源方向不等于轮廓效果；百叶窗不是硬光成立的前提。\n\n**没有推出**：AI 视频内部按 Blender 的渲染器计算；任何提示词能获得摄影测量级的精度。材质、拍摄和后期的具体设计仍然是这本书的创作建议。\n\n## 核验路径说明\n\n之前的复审包保留了旧版 Blender 英文链接。这次那个入口读取不成功，所以不宣称重新读到了那个旧页面，改用成功取得的 5.2 LTS 页面核验稳定概念。不由此推荐特定软件版本。\n\n# Citations\n\n[1] [ElevenLabs — How can I add pauses?](https://elevenlabs.io/docs/help-center/product/core-capabilities/text-to-speech/how-can-i-add-pauses)\n\n[2] [ElevenLabs — Do pauses and SSML phoneme tags work with the API?](https://elevenlabs.io/docs/help-center/technical/do-pauses-and-ssml-phoneme-tags-work-with-the-api)\n\n[3] [Blender 5.2 LTS Manual — Light Objects](https://docs.blender.org/manual/nl/5.2/render/lights/light_object.html)","toc":[{"id":"references-official-voice-light-section-0","title":"ElevenLabs：停顿和模型语法"},{"id":"references-official-voice-light-section-1","title":"Blender：Light Objects"},{"id":"references-official-voice-light-section-2","title":"核验路径说明"}]},{"id":"references/okf","path":"references/okf.md","title":"OKF 封装说明","description":"这个知识包按 OKF v0.1 组织。哪些是规范要求、哪些是这本书自己的约定、怎么校验和更新。","type":"Reference","group":"references","tags":["OKF","维护","格式","skill"],"html":"<h1>OKF 封装说明<\/h1>\n<h2 id=\"references-okf-section-0\">用的哪个版本<\/h2>\n<p>用户上传的 <code>okf-bundle-ready.zip<\/code> 明确要求按 OKF v0.1 组织，并运行随附的校验器。这次以此为兼容目标，不擅自升级。<\/p>\n<p>核验到的公开 OKF 仓库已迁移，当前公开规范包含 v0.2。这里不宣称兼容目标是最新版本。[1][2]<\/p>\n<h2 id=\"references-okf-section-1\">哪些是规范，哪些是这本书的选择<\/h2>\n<p><strong>规范要求<\/strong>：每个概念 Markdown 有 YAML frontmatter 和非空 <code>type<\/code>；包根 <code>index.md<\/code> 只声明 <code>okf_version: \"0.1\"<\/code>；子目录索引不带 frontmatter；<code>log.md<\/code> 按日期记录。<\/p>\n<p><strong>这本书的选择<\/strong>：来源放在 <code># Citations<\/code>，用包根相对 Markdown 链接关联概念。<code>title<\/code>、<code>description<\/code>、<code>tags<\/code>、<code>timestamp<\/code> 是为了方便阅读和检索；<code>source<\/code> 是本地扩展，不是规范必填。概念 ID 由文件路径得到，没有伪造 ID 体系。<\/p>\n<p><strong>本地 type 词表<\/strong>：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>type<\/th>\n<th>意思<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Framework<\/code><\/td>\n<td>框架<\/td>\n<\/tr>\n<tr>\n<td><code>Technique<\/code><\/td>\n<td>技巧<\/td>\n<\/tr>\n<tr>\n<td><code>Lexicon<\/code><\/td>\n<td>图谱<\/td>\n<\/tr>\n<tr>\n<td><code>Playbook<\/code><\/td>\n<td>流程与工具<\/td>\n<\/tr>\n<tr>\n<td><code>CaseStudy<\/code><\/td>\n<td>案例<\/td>\n<\/tr>\n<tr>\n<td><code>Exercise<\/code><\/td>\n<td>练习<\/td>\n<\/tr>\n<tr>\n<td><code>Reference<\/code><\/td>\n<td>来源<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>这是本包约定，不是全局标准。<\/p>\n<h2 id=\"references-okf-section-2\">谁是内容源<\/h2>\n<p><code>knowledge/contemporary-prompting/<\/code> 里的 Markdown 是<strong>可编辑的内容源<\/strong>。<code>开始阅读.html<\/code> 由这些文件生成，是离线阅读副本。<strong>不要只改 HTML 就说知识库已更新。<\/strong><\/p>\n<p><code>OKF-INDEX.md<\/code> 是本地交付工作区的登记索引，不是知识包内的规范文件。<\/p>\n<p>附带的 skill 在 <code>skills/contemporary-prompt-expert/<\/code>，是自包含的：<code>SKILL.md<\/code> + <code>references/<\/code> + <code>examples/<\/code>，内部全部用相对链接。它只导航知识，没有自动执行、联网或生成权限。<\/p>\n<h2 id=\"references-okf-section-3\">校验与更新<\/h2>\n<p>在交付根目录运行：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-bash\">python scripts/okf_tools.py validate knowledge/contemporary-prompting --verbose\npython scripts/build_reader.py\npython scripts/verify.py\n<\/code><\/pre>\n<p>刷新工作区索引：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-bash\">python scripts/refresh_index.py\n<\/code><\/pre>\n<p>读 HTML 和 Markdown 不需要装依赖。重建和校验需要的 Python 包列在根目录 <code>requirements.txt<\/code>。脚本不调用生成服务、不联网、不改来源 ZIP。<\/p>\n<p>用户提供的原校验器以绝对路径保存索引条目。本包附的 <code>refresh_index.py<\/code> 会把本包登记迁到解压后的实际位置，避免因目录移动出现旧条目。这是交付辅助，不是 OKF 规范。<\/p>\n<h2 id=\"references-okf-section-4\">需要使用者自己确认的<\/h2>\n<p>六个问题和图谱适不适合你的项目类型，需要实作；情绪词的具体读法需要目标语境；工具接口和音频标签需要在实际调用前核对。<strong>文件格式检查不能替代这些。<\/strong><\/p>\n<p>v0.2 用了不同的来源和生成元数据字段。将来迁移应按公开规范映射，不直接改版本号。当前包保留 v0.1，让你上传的 skill 可以继续验证。[2]<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] 用户上传 <code>okf-bundle-ready.zip<\/code> 内：<code>SKILL.md<\/code>、<code>references/okf-spec.md<\/code>、<code>references/templates.md<\/code>、<code>scripts/okf_tools.py<\/code>。<\/p>\n<p>[2] <a href=\"https://github.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC.md\" rel=\"noopener noreferrer\" target=\"_blank\">Open Knowledge Format — 当前公开 SPEC 及 v0.1 迁移说明<\/a><\/p>\n<p>[3] <a href=\"https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/README.md\" rel=\"noopener noreferrer\" target=\"_blank\">原 knowledge-catalog/okf 仓库的迁移说明<\/a><\/p>\n<\/details>","text":"# OKF 封装说明\n\n## 用的哪个版本\n\n用户上传的 `okf-bundle-ready.zip` 明确要求按 OKF v0.1 组织，并运行随附的校验器。这次以此为兼容目标，不擅自升级。\n\n核验到的公开 OKF 仓库已迁移，当前公开规范包含 v0.2。这里不宣称兼容目标是最新版本。[1][2]\n\n## 哪些是规范，哪些是这本书的选择\n\n**规范要求**：每个概念 Markdown 有 YAML frontmatter 和非空 `type`；包根 `index.md` 只声明 `okf_version: \"0.1\"`；子目录索引不带 frontmatter；`log.md` 按日期记录。\n\n**这本书的选择**：来源放在 `# Citations`，用包根相对 Markdown 链接关联概念。`title`、`description`、`tags`、`timestamp` 是为了方便阅读和检索；`source` 是本地扩展，不是规范必填。概念 ID 由文件路径得到，没有伪造 ID 体系。\n\n**本地 type 词表**：\n\n| type | 意思 |\n| --- | --- |\n| `Framework` | 框架 |\n| `Technique` | 技巧 |\n| `Lexicon` | 图谱 |\n| `Playbook` | 流程与工具 |\n| `CaseStudy` | 案例 |\n| `Exercise` | 练习 |\n| `Reference` | 来源 |\n\n这是本包约定，不是全局标准。\n\n## 谁是内容源\n\n`knowledge/contemporary-prompting/` 里的 Markdown 是**可编辑的内容源**。`开始阅读.html` 由这些文件生成，是离线阅读副本。**不要只改 HTML 就说知识库已更新。**\n\n`OKF-INDEX.md` 是本地交付工作区的登记索引，不是知识包内的规范文件。\n\n附带的 skill 在 `skills/contemporary-prompt-expert/`，是自包含的：`SKILL.md` + `references/` + `examples/`，内部全部用相对链接。它只导航知识，没有自动执行、联网或生成权限。\n\n## 校验与更新\n\n在交付根目录运行：\n\n```bash\npython scripts/okf_tools.py validate knowledge/contemporary-prompting --verbose\npython scripts/build_reader.py\npython scripts/verify.py\n```\n\n刷新工作区索引：\n\n```bash\npython scripts/refresh_index.py\n```\n\n读 HTML 和 Markdown 不需要装依赖。重建和校验需要的 Python 包列在根目录 `requirements.txt`。脚本不调用生成服务、不联网、不改来源 ZIP。\n\n用户提供的原校验器以绝对路径保存索引条目。本包附的 `refresh_index.py` 会把本包登记迁到解压后的实际位置，避免因目录移动出现旧条目。这是交付辅助，不是 OKF 规范。\n\n## 需要使用者自己确认的\n\n六个问题和图谱适不适合你的项目类型，需要实作；情绪词的具体读法需要目标语境；工具接口和音频标签需要在实际调用前核对。**文件格式检查不能替代这些。**\n\nv0.2 用了不同的来源和生成元数据字段。将来迁移应按公开规范映射，不直接改版本号。当前包保留 v0.1，让你上传的 skill 可以继续验证。[2]\n\n# Citations\n\n[1] 用户上传 `okf-bundle-ready.zip` 内：`SKILL.md`、`references/okf-spec.md`、`references/templates.md`、`scripts/okf_tools.py`。\n\n[2] [Open Knowledge Format — 当前公开 SPEC 及 v0.1 迁移说明](https://github.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC.md)\n\n[3] [原 knowledge-catalog/okf 仓库的迁移说明](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/README.md)","toc":[{"id":"references-okf-section-0","title":"用的哪个版本"},{"id":"references-okf-section-1","title":"哪些是规范，哪些是这本书的选择"},{"id":"references-okf-section-2","title":"谁是内容源"},{"id":"references-okf-section-3","title":"校验与更新"},{"id":"references-okf-section-4","title":"需要使用者自己确认的"}]},{"id":"references/theory","path":"references/theory.md","title":"借用了哪些理论，借到什么程度","description":"四篇原研究或原作者文章，各支持一座小桥。再加五条这本书自己的推论，标明\"待检验\"。","type":"Reference","group":"references","tags":["理论","研究","假设","通感"],"html":"<h1>借用了哪些理论，借到什么程度<\/h1>\n<h2 id=\"references-theory-section-0\">不必先宣布\"新学科\"，才能有系统方法<\/h2>\n<p>当代提示词实践确实有新问题：跨媒介、工具适配。但可以先把问题组织清楚：感受怎么变成材料，材料怎么让人接收到信息，输入怎么被不确定的工具实现，结果怎么反过来修正选择。<\/p>\n<p>下面四项是直接查阅的原研究或作者原文。<strong>它们各支持一座小桥，不提供对所有 AI 提示词的总证明。<\/strong><\/p>\n<h2 id=\"references-theory-section-1\">T01｜音乐和颜色为什么会\"配\"<\/h2>\n<p>Palmer 等人 2013 年发表在 PNAS 的研究，让美国和墨西哥的参与者把西方古典管弦乐片段和颜色配对。结果支持：这些配对和共有的<strong>情绪维度<\/strong>有关。[1]<\/p>\n<p>这不是\"蓝色 = 悲伤\"的普世规则，更不是一项生成模型的提示词实验。<\/p>\n<p><strong>这本书的延展<\/strong>：构思音乐、颜色和材料时，可以先找它们共享的重量、明暗、活跃度或张力，再设计组合。但具体作品仍要看和听；同一颜色和声音在不同情境里可以变意思。<\/p>\n<p><strong>用在<\/strong>：<a href=\"#/language/01-sensory-translation\">通感怎么用<\/a>。<\/p>\n<h2 id=\"references-theory-section-2\">T02｜\"能做什么\"和\"看出来能做什么\"<\/h2>\n<p>Don Norman 在《Signifiers, not affordances》里区分了两件事：物体\"能做什么\"（affordance），和人\"怎么感知到它能做什么\"（signifier）。他强调线索不一定都是设计者故意提供的。[2]<\/p>\n<p><strong>这本书的延展<\/strong>：门把、空椅子、包带、使用痕迹不只是装饰。它们给角色一件可做的事，也给观众一个解释入口。由此提出\"给人物一个可做的事\"——不意味着所有镜头都要拿道具，也不意味着能从一张图准确读出角色心理。<\/p>\n<p><strong>用在<\/strong>：<a href=\"#/craft/06-world-art-costume\">美术与妆造<\/a>、<a href=\"#/craft/03-action-blocking\">动作与调度<\/a>。<\/p>\n<h2 id=\"references-theory-section-3\">T03｜观众的眼睛在镜头里怎么动<\/h2>\n<p>Tim J. Smith 2011 年发表在 David Bordwell 博客的分析，展示了 11 名观众看《血色将至》特定片段时的眼动观察，并讨论调度、动作和对白怎样参与注意力的组织。[3]<\/p>\n<p>这是特定材料上的探索性观察，不是把每个因素独立控制后的普遍因果结论。<\/p>\n<p><strong>这本书的延展<\/strong>：关键动作不只要发生，还要有机会被看到。通过同框大小、遮挡、主次和时间安排，把\"提示词里写了\"变成\"观众能接收\"。这是一种检查方法，不保证所有人按同一顺序看。<\/p>\n<p><strong>用在<\/strong>：<a href=\"#/craft/04-camera-attention\">镜头<\/a>。<\/p>\n<h2 id=\"references-theory-section-4\">T04｜镜头不动，也能组织戏<\/h2>\n<p>David Bordwell 在《Hands (and faces) across the table》里通过电影分析讨论了桌边调度与手、脸的关系，说明镜头内部的组织本身有表达能力。[4]<\/p>\n<p>这是专业电影分析，不是模型性能证据。<\/p>\n<p><strong>这本书的延展<\/strong>：反对把\"运动更多\"当\"表达更多\"。固定镜头可以靠人物、物件和声音来组织注意力。具体怎么用还是看作品目的，不是让固定镜头取代运镜成为新的万能解。<\/p>\n<p><strong>用在<\/strong>：<a href=\"#/cases/02-relationship\">餐桌案例<\/a>。<\/p>\n<h2 id=\"references-theory-section-5\">五条推论：这本书提出，等待实作检验<\/h2>\n<h3 id=\"references-theory-section-6\">推论一：表达是一对多，不是找唯一咒语<\/h3>\n<p>同一种感受可以由不同载体实现；同一个素材也可能有多种读法。所以\"最优提示词\"只能相对于任务、工具、素材和评价方式来说。清爽可以是水，也可以是空间和节奏，不该被锁进一组固定词。<\/p>\n<h3 id=\"references-theory-section-7\">推论二：具体不是越多越好，而是减少关键歧义<\/h3>\n<p>\"右手把唯一的杯子放到桌面\"比\"真实自然的动作\"更能限定事件。但脚趾、呼吸、每根头发都写出来，不一定增加关键清晰度。<strong>提示词的密度应该围绕容易误解的关系分配<\/strong>，不是均匀加细节。<\/p>\n<h3 id=\"references-theory-section-8\">推论三：一致性是关系持续，不只是长相不变<\/h3>\n<p>身份、物件归属、空间地标、湿干状态、声音习惯、镜头起终点，共同决定一个片段能不能接下去。所以要强调实际通过的媒体状态，不把文字要求当执行回执。<\/p>\n<h3 id=\"references-theory-section-9\">推论四：通感要允许差异，不要求各部门齐声<\/h3>\n<p>画面可以安静，声音可以拥挤；人物可以快乐，音乐可以留余地。不同媒介之间有支持、对照、延迟和各自的愉悦，<strong>不必每一层都喊同一个情绪词。<\/strong><\/p>\n<h3 id=\"references-theory-section-10\">推论五：提示词实践是反馈循环，不是一次性写作<\/h3>\n<p>创作者提条件，观察结果，再更新判断。工具的不确定性要求保留失败条件和适用范围，不该把偶然好结果写成固定原理。六个问题提供的是查断点的语言，不是被实验验证的算法。<\/p>\n<h2 id=\"references-theory-section-11\">怎么继续发展，不装成熟<\/h2>\n<p>为不同任务建立小规模、条件明确的实例集；比较提示词改动，不只挑最美的样本；区分创意价值、执行稳定性和成本；撤下不支持的主张。<\/p>\n<p>是不是形成一个独立学科，需要持续的研究、作品和共同方法，不是一个听起来新颖的名称。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"https://doi.org/10.1073/pnas.1212562110\" rel=\"noopener noreferrer\" target=\"_blank\">Palmer et al., 2013 — Music–color associations are mediated by emotion, PNAS<\/a><\/p>\n<p>[2] <a href=\"https://jnd.org/signifiers-not-affordances/\" rel=\"noopener noreferrer\" target=\"_blank\">Don Norman — Signifiers, not affordances<\/a><\/p>\n<p>[3] <a href=\"https://www.davidbordwell.net/blog/2011/02/14/watching-you-watch-there-will-be-blood/\" rel=\"noopener noreferrer\" target=\"_blank\">Tim J. Smith — Watching you watch THERE WILL BE BLOOD<\/a><\/p>\n<p>[4] <a href=\"https://www.davidbordwell.net/blog/2008/02/13/hands-and-faces-across-the-table/\" rel=\"noopener noreferrer\" target=\"_blank\">David Bordwell — Hands (and faces) across the table<\/a><\/p>\n<\/details>","text":"# 借用了哪些理论，借到什么程度\n\n## 不必先宣布\"新学科\"，才能有系统方法\n\n当代提示词实践确实有新问题：跨媒介、工具适配。但可以先把问题组织清楚：感受怎么变成材料，材料怎么让人接收到信息，输入怎么被不确定的工具实现，结果怎么反过来修正选择。\n\n下面四项是直接查阅的原研究或作者原文。**它们各支持一座小桥，不提供对所有 AI 提示词的总证明。**\n\n## T01｜音乐和颜色为什么会\"配\"\n\nPalmer 等人 2013 年发表在 PNAS 的研究，让美国和墨西哥的参与者把西方古典管弦乐片段和颜色配对。结果支持：这些配对和共有的**情绪维度**有关。[1]\n\n这不是\"蓝色 = 悲伤\"的普世规则，更不是一项生成模型的提示词实验。\n\n**这本书的延展**：构思音乐、颜色和材料时，可以先找它们共享的重量、明暗、活跃度或张力，再设计组合。但具体作品仍要看和听；同一颜色和声音在不同情境里可以变意思。\n\n**用在**：[通感怎么用](/language/01-sensory-translation.md)。\n\n## T02｜\"能做什么\"和\"看出来能做什么\"\n\nDon Norman 在《Signifiers, not affordances》里区分了两件事：物体\"能做什么\"（affordance），和人\"怎么感知到它能做什么\"（signifier）。他强调线索不一定都是设计者故意提供的。[2]\n\n**这本书的延展**：门把、空椅子、包带、使用痕迹不只是装饰。它们给角色一件可做的事，也给观众一个解释入口。由此提出\"给人物一个可做的事\"——不意味着所有镜头都要拿道具，也不意味着能从一张图准确读出角色心理。\n\n**用在**：[美术与妆造](/craft/06-world-art-costume.md)、[动作与调度](/craft/03-action-blocking.md)。\n\n## T03｜观众的眼睛在镜头里怎么动\n\nTim J. Smith 2011 年发表在 David Bordwell 博客的分析，展示了 11 名观众看《血色将至》特定片段时的眼动观察，并讨论调度、动作和对白怎样参与注意力的组织。[3]\n\n这是特定材料上的探索性观察，不是把每个因素独立控制后的普遍因果结论。\n\n**这本书的延展**：关键动作不只要发生，还要有机会被看到。通过同框大小、遮挡、主次和时间安排，把\"提示词里写了\"变成\"观众能接收\"。这是一种检查方法，不保证所有人按同一顺序看。\n\n**用在**：[镜头](/craft/04-camera-attention.md)。\n\n## T04｜镜头不动，也能组织戏\n\nDavid Bordwell 在《Hands (and faces) across the table》里通过电影分析讨论了桌边调度与手、脸的关系，说明镜头内部的组织本身有表达能力。[4]\n\n这是专业电影分析，不是模型性能证据。\n\n**这本书的延展**：反对把\"运动更多\"当\"表达更多\"。固定镜头可以靠人物、物件和声音来组织注意力。具体怎么用还是看作品目的，不是让固定镜头取代运镜成为新的万能解。\n\n**用在**：[餐桌案例](/cases/02-relationship.md)。\n\n## 五条推论：这本书提出，等待实作检验\n\n### 推论一：表达是一对多，不是找唯一咒语\n\n同一种感受可以由不同载体实现；同一个素材也可能有多种读法。所以\"最优提示词\"只能相对于任务、工具、素材和评价方式来说。清爽可以是水，也可以是空间和节奏，不该被锁进一组固定词。\n\n### 推论二：具体不是越多越好，而是减少关键歧义\n\n\"右手把唯一的杯子放到桌面\"比\"真实自然的动作\"更能限定事件。但脚趾、呼吸、每根头发都写出来，不一定增加关键清晰度。**提示词的密度应该围绕容易误解的关系分配**，不是均匀加细节。\n\n### 推论三：一致性是关系持续，不只是长相不变\n\n身份、物件归属、空间地标、湿干状态、声音习惯、镜头起终点，共同决定一个片段能不能接下去。所以要强调实际通过的媒体状态，不把文字要求当执行回执。\n\n### 推论四：通感要允许差异，不要求各部门齐声\n\n画面可以安静，声音可以拥挤；人物可以快乐，音乐可以留余地。不同媒介之间有支持、对照、延迟和各自的愉悦，**不必每一层都喊同一个情绪词。**\n\n### 推论五：提示词实践是反馈循环，不是一次性写作\n\n创作者提条件，观察结果，再更新判断。工具的不确定性要求保留失败条件和适用范围，不该把偶然好结果写成固定原理。六个问题提供的是查断点的语言，不是被实验验证的算法。\n\n## 怎么继续发展，不装成熟\n\n为不同任务建立小规模、条件明确的实例集；比较提示词改动，不只挑最美的样本；区分创意价值、执行稳定性和成本；撤下不支持的主张。\n\n是不是形成一个独立学科，需要持续的研究、作品和共同方法，不是一个听起来新颖的名称。\n\n# Citations\n\n[1] [Palmer et al., 2013 — Music–color associations are mediated by emotion, PNAS](https://doi.org/10.1073/pnas.1212562110)\n\n[2] [Don Norman — Signifiers, not affordances](https://jnd.org/signifiers-not-affordances/)\n\n[3] [Tim J. Smith — Watching you watch THERE WILL BE BLOOD](https://www.davidbordwell.net/blog/2011/02/14/watching-you-watch-there-will-be-blood/)\n\n[4] [David Bordwell — Hands (and faces) across the table](https://www.davidbordwell.net/blog/2008/02/13/hands-and-faces-across-the-table/)","toc":[{"id":"references-theory-section-0","title":"不必先宣布\"新学科\"，才能有系统方法"},{"id":"references-theory-section-1","title":"T01｜音乐和颜色为什么会\"配\""},{"id":"references-theory-section-2","title":"T02｜\"能做什么\"和\"看出来能做什么\""},{"id":"references-theory-section-3","title":"T03｜观众的眼睛在镜头里怎么动"},{"id":"references-theory-section-4","title":"T04｜镜头不动，也能组织戏"},{"id":"references-theory-section-5","title":"五条推论：这本书提出，等待实作检验"},{"id":"references-theory-section-11","title":"怎么继续发展，不装成熟"}]},{"id":"references/tutorial-map","path":"references/tutorial-map.md","title":"13 组教程进入了哪些章节","description":"每组教程原本讲什么、这本书保留并校准了什么、去了哪几章。全组覆盖，附原仓库链接。","type":"Reference","group":"references","tags":["13组","追溯","映射"],"html":"<h1>13 组教程进入了哪些章节<\/h1>\n<h2 id=\"references-tutorial-map-section-0\">这张表怎么用<\/h2>\n<p>想知道某个教程的观点在这本书里去了哪儿，查这张表。<\/p>\n<p>它是<strong>主题覆盖<\/strong>，不是逐字复原，也不是这次新做的视觉核验。每组的直接输入都是文字复审包里的《方法论与技术要点.md》和《提示词提取.md》，没有跳过任何一组。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>组<\/th>\n<th>原主题<\/th>\n<th>这本书保留并校准的核心<\/th>\n<th>主要去向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>复杂运镜与 Previs<\/td>\n<td>把信息可读性、人物路线、道具状态和机位分开；粗模不等于最终准确。<\/td>\n<td><a href=\"#/workflows/06-previs\">预演<\/a>、<a href=\"#/cases/08-object-exchange\">文件交接案例<\/a><\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>配音去机器味<\/td>\n<td>稳定声线和当场说话策略分开；台词先顺，再控语气和节奏。<\/td>\n<td><a href=\"#/craft/02-dialogue-voice\">台词与配音<\/a>、<a href=\"#/language/04-emotion-atlas\">情绪图谱<\/a><\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td>减少 AI 味<\/td>\n<td>拆开底图、运动、光照和剪辑问题，不建立永久模型排名。<\/td>\n<td><a href=\"#/workflows/07-evaluate-repair\">评价与修复<\/a>、<a href=\"#/craft/05-light-material\">光与材质<\/a><\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td>反向表演<\/td>\n<td>从任务、对象、反应出发；隐藏情绪是一种选择，不是更高级的范式。<\/td>\n<td><a href=\"#/craft/01-acting\">表演<\/a>、<a href=\"#/cases/02-relationship\">餐桌案例<\/a><\/td>\n<\/tr>\n<tr>\n<td>05<\/td>\n<td>新的提示词组织<\/td>\n<td>内容、素材分工、基调和节拍；区分创作语言和真实接口设置。<\/td>\n<td><a href=\"#/foundations/03-three-drafts\">三种稿子<\/a>、<a href=\"#/workflows/08-model-adaptation\">工具适配<\/a><\/td>\n<\/tr>\n<tr>\n<td>06<\/td>\n<td>长片方法拆解<\/td>\n<td>身份、造型、状态、声音、行为和场景拓扑一起复用；规模来自交接。<\/td>\n<td><a href=\"#/workflows/05-assets-multishot\">多镜头与资产<\/a>、<a href=\"#/craft/03-action-blocking\">动作与调度<\/a><\/td>\n<\/tr>\n<tr>\n<td>07<\/td>\n<td>活人感与 Vlog<\/td>\n<td>编号必须对应真实素材；视点、手位、转场和道具状态不能混写。<\/td>\n<td><a href=\"#/cases/04-vlog\">Vlog 案例<\/a>、<a href=\"#/craft/04-camera-attention\">镜头<\/a><\/td>\n<\/tr>\n<tr>\n<td>08<\/td>\n<td>资产库<\/td>\n<td>库可以丰富，输入要精选；视图可读性比固定横竖版更重要。<\/td>\n<td><a href=\"#/workflows/05-assets-multishot\">多镜头与资产<\/a>、<a href=\"#/craft/06-world-art-costume\">美术与妆造<\/a><\/td>\n<\/tr>\n<tr>\n<td>09<\/td>\n<td>指定修改图像<\/td>\n<td>指认、操作、保留项和前后状态分开；标记不等于精确蒙版。<\/td>\n<td><a href=\"#/workflows/03-image-edit\">改图<\/a>、<a href=\"#/practice/01-templates\">模板<\/a><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>低角度与现场感<\/td>\n<td>把高度、俯仰、移动和取景分清；低机位不是唯一的真实路线。<\/td>\n<td><a href=\"#/craft/04-camera-attention\">镜头<\/a>、<a href=\"#/cases/05-empty-corridor\">空走廊案例<\/a><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>身份与妆造<\/td>\n<td>身份、场合、物理经历和主动选择决定造型，不按性别硬分工。<\/td>\n<td><a href=\"#/craft/06-world-art-costume\">美术与妆造<\/a>、<a href=\"#/workflows/05-assets-multishot\">状态延续<\/a><\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>动作生命力<\/td>\n<td>主动作、跟随动态、细微反应有主从；声音和后期接续同一意图。<\/td>\n<td><a href=\"#/craft/01-acting\">表演<\/a>、<a href=\"#/cases/03-big-emotion\">外放喜悦案例<\/a><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>光线质感<\/td>\n<td>分清方向、光质和边缘效果，跟踪光源和材质状态；硬光不等于百叶窗。<\/td>\n<td><a href=\"#/craft/05-light-material\">光与材质<\/a>、<a href=\"#/cases/06-surreal-perfume\">风格化主视觉案例<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"references-tutorial-map-section-1\">看完 13 组才看出来的四对\"不矛盾\"<\/h2>\n<p><strong>\"写细\"和\"别写太细\"不矛盾<\/strong>：关键因果、接触和观看条件要细；自然过渡不必逐帧指定。<\/p>\n<p><strong>\"资产丰富\"和\"提示词简洁\"不矛盾<\/strong>：丰富发生在准备库；简洁发生在当前镜头选的输入。<\/p>\n<p><strong>\"真实感\"和\"精致风格\"不矛盾<\/strong>：先判断目标是生活、广告还是超现实，再定义自洽的标准。<\/p>\n<p><strong>\"让 AI 构思\"和\"守住批准方案\"不矛盾<\/strong>：探索时开放；执行时不擅自换题，发现问题再明确提变更。<\/p>\n<p>这四点是这次跨教程综合出来的，不是原作者逐字提出的共同理论。<\/p>\n<h2 id=\"references-tutorial-map-section-2\">原文件夹追溯<\/h2>\n<p>下面的链接指向原仓库固定版本，用来回到上游。这次直接读的新版文字保存在工作区 <code>sources/tutorial-text-review-source.zip<\/code> 的相同目录下。两者层级不同，不能把新版观点倒推为原作者已经说过。<\/p>\n<ul>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/01-6aabb8c8000000002a0265bf-%E6%8B%92%E7%BB%9D%E6%8A%BD%E5%8D%A1%EF%BC%81%E4%B8%80%E6%8B%9B%E6%95%99%E4%BD%A0%E7%94%A8Codex%E7%B2%BE%E5%87%86%E6%8E%A7%E5%88%B6AI%E8%BF%90%E9%95%9C\" rel=\"noopener noreferrer\" target=\"_blank\">01-6aabb8c8000000002a0265bf-拒绝抽卡！一招教你用Codex精准控制AI运镜<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/02-6aaa15ec00000000290187a9-%E4%B8%80%E5%BC%80%E5%8F%A3%E5%B0%B1%E9%9C%B2%E9%A6%85%EF%BC%9F3%E6%8B%9B%E5%8E%BB%E6%8E%89AI%E9%85%8D%E9%9F%B3%E7%9A%84%E2%80%9C%E6%9C%BA%E5%99%A8%E5%91%B3%E2%80%9D\" rel=\"noopener noreferrer\" target=\"_blank\">02-6aaa15ec00000000290187a9-一开口就露馅？3招去掉AI配音的“机器味”<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/03-6aa13956000000002b01fe4c-%E9%82%AA%E4%BF%AE%EF%BC%813%E6%AD%A5%E8%AE%A9%E4%BD%A0%E7%9A%84AI%E8%A7%86%E9%A2%91%E5%BD%BB%E5%BA%95%E6%91%86%E8%84%B1AI%E5%91%B3\" rel=\"noopener noreferrer\" target=\"_blank\">03-6aa13956000000002b01fe4c-邪修！3步让你的AI视频彻底摆脱AI味<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/04-6a9aa3ca000000002a02fef4-AI%E4%BA%BA%E7%89%A9%E6%BC%94%E6%8A%80%E5%A4%AA%E7%94%A8%E5%8A%9B%EF%BC%9F%E6%95%99%E4%BD%A0%E5%86%99%E2%80%9C%E5%8F%8D%E5%90%91%E8%A1%A8%E6%BC%94%E2%80%9D\" rel=\"noopener noreferrer\" target=\"_blank\">04-6a9aa3ca000000002a02fef4-AI人物演技太用力？教你写“反向表演”<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/05-6a96a9b90000000026033e1d-AI%E7%94%9F%E5%9B%BE%E5%81%87%EF%BC%9F%E9%82%A3%E6%98%AF%E5%9B%A0%E4%B8%BA%E4%BD%A0%E7%9A%84%E6%8F%90%E7%A4%BA%E8%AF%8D%E8%BF%87%E6%9C%9F%E4%BA%86\" rel=\"noopener noreferrer\ %9F%EF%BC%81\" rel=\"noopener noreferrer\" target=\"_blank\">10-69ca589d0000000023010bdf-一个提示词技巧，让AI视频瞬间有实拍感！<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/11-6a1435c4000000003601d24b-%E5%85%A8%E7%BD%91%E7%8B%AC%E5%AE%B6%EF%BC%81%E5%A6%82%E4%BD%95%E7%94%A8%E5%A6%86%E9%80%A0%E8%AE%A9%E4%BD%A0%E7%9A%84ai%E8%A7%92%E8%89%B2%E6%9B%B4%E9%AB%98%E7%BA%A7%EF%BC%9F\" rel=\"noopener noreferrer\" target=\"_blank\">11-6a1435c4000000003601d24b-全网独家！如何用妆造让你的ai角色更高级？<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/12-6a26b978000000001702fb5c-%E8%BF%9B%E9%98%B6%E6%95%99%E7%A8%8B%EF%BC%81%E5%A6%82%E4%BD%95%E8%AE%A9AI%E5%A5%B3%E9%A2%91%E7%9F%AD%E5%89%A7%E6%9B%B4%E6%9C%89%E7%94%9F%E5%91%BD%E5%8A%9B%EF%BC%9F\" rel=\"noopener noreferrer\" target=\"_blank\">12-6a26b978000000001702fb5c-进阶教程！如何让AI女频短剧更有生命力？<\/a><\/li>\n<li><a href=\"https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/13-6a3a6ca9000000000f006cc9-%E5%B0%8F%E7%99%BD%E5%BF%85%E7%9C%8B%EF%BC%81%E5%A6%82%E4%BD%95%E7%94%A8%E5%85%89%E7%BA%BF%E6%8F%90%E5%8D%87AI%E8%A7%86%E9%A2%91%E8%B4%A8%E6%84%9F%EF%BC%9F\" rel=\"noopener noreferrer\" target=\"_blank\">13-6a3a6ca9000000000f006cc9-小白必看！如何用光线提升AI视频质感？<\/a><\/li>\n<\/ul>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 13 组教程进入了哪些章节\n\n## 这张表怎么用\n\n想知道某个教程的观点在这本书里去了哪儿，查这张表。\n\n它是**主题覆盖**，不是逐字复原，也不是这次新做的视觉核验。每组的直接输入都是文字复审包里的《方法论与技术要点.md》和《提示词提取.md》，没有跳过任何一组。\n\n| 组 | 原主题 | 这本书保留并校准的核心 | 主要去向 |\n| --- | --- | --- | --- |\n| 01 | 复杂运镜与 Previs | 把信息可读性、人物路线、道具状态和机位分开；粗模不等于最终准确。 | [预演](/workflows/06-previs.md)、[文件交接案例](/cases/08-object-exchange.md) |\n| 02 | 配音去机器味 | 稳定声线和当场说话策略分开；台词先顺，再控语气和节奏。 | [台词与配音](/craft/02-dialogue-voice.md)、[情绪图谱](/language/04-emotion-atlas.md) |\n| 03 | 减少 AI 味 | 拆开底图、运动、光照和剪辑问题，不建立永久模型排名。 | [评价与修复](/workflows/07-evaluate-repair.md)、[光与材质](/craft/05-light-material.md) |\n| 04 | 反向表演 | 从任务、对象、反应出发；隐藏情绪是一种选择，不是更高级的范式。 | [表演](/craft/01-acting.md)、[餐桌案例](/cases/02-relationship.md) |\n| 05 | 新的提示词组织 | 内容、素材分工、基调和节拍；区分创作语言和真实接口设置。 | [三种稿子](/foundations/03-three-drafts.md)、[工具适配](/workflows/08-model-adaptation.md) |\n| 06 | 长片方法拆解 | 身份、造型、状态、声音、行为和场景拓扑一起复用；规模来自交接。 | [多镜头与资产](/workflows/05-assets-multishot.md)、[动作与调度](/craft/03-action-blocking.md) |\n| 07 | 活人感与 Vlog | 编号必须对应真实素材；视点、手位、转场和道具状态不能混写。 | [Vlog 案例](/cases/04-vlog.md)、[镜头](/craft/04-camera-attention.md) |\n| 08 | 资产库 | 库可以丰富，输入要精选；视图可读性比固定横竖版更重要。 | [多镜头与资产](/workflows/05-assets-multishot.md)、[美术与妆造](/craft/06-world-art-costume.md) |\n| 09 | 指定修改图像 | 指认、操作、保留项和前后状态分开；标记不等于精确蒙版。 | [改图](/workflows/03-image-edit.md)、[模板](/practice/01-templates.md) |\n| 10 | 低角度与现场感 | 把高度、俯仰、移动和取景分清；低机位不是唯一的真实路线。 | [镜头](/craft/04-camera-attention.md)、[空走廊案例](/cases/05-empty-corridor.md) |\n| 11 | 身份与妆造 | 身份、场合、物理经历和主动选择决定造型，不按性别硬分工。 | [美术与妆造](/craft/06-world-art-costume.md)、[状态延续](/workflows/05-assets-multishot.md) |\n| 12 | 动作生命力 | 主动作、跟随动态、细微反应有主从；声音和后期接续同一意图。 | [表演](/craft/01-acting.md)、[外放喜悦案例](/cases/03-big-emotion.md) |\n| 13 | 光线质感 | 分清方向、光质和边缘效果，跟踪光源和材质状态；硬光不等于百叶窗。 | [光与材质](/craft/05-light-material.md)、[风格化主视觉案例](/cases/06-surreal-perfume.md) |\n\n## 看完 13 组才看出来的四对\"不矛盾\"\n\n**\"写细\"和\"别写太细\"不矛盾**：关键因果、接触和观看条件要细；自然过渡不必逐帧指定。\n\n**\"资产丰富\"和\"提示词简洁\"不矛盾**：丰富发生在准备库；简洁发生在当前镜头选的输入。\n\n**\"真实感\"和\"精致风格\"不矛盾**：先判断目标是生活、广告还是超现实，再定义自洽的标准。\n\n**\"让 AI 构思\"和\"守住批准方案\"不矛盾**：探索时开放；执行时不擅自换题，发现问题再明确提变更。\n\n这四点是这次跨教程综合出来的，不是原作者逐字提出的共同理论。\n\n## 原文件夹追溯\n\n下面的链接指向原仓库固定版本，用来回到上游。这次直接读的新版文字保存在工作区 `sources/tutorial-text-review-source.zip` 的相同目录下。两者层级不同，不能把新版观点倒推为原作者已经说过。\n\n- [01-6aabb8c8000000002a0265bf-拒绝抽卡！一招教你用Codex精准控制AI运镜](https://github.com/ALBEDO-TABAI/ciwei-ai-shortfilm-notes/tree/5887b2040f642782ce29473bd6cb8b2f8129458b/01-6aabb8c8000000002a0265bf-%E6%8B%92%E7%BB%9D%E6%8A%BD%E5%8D%A1%EF%BC%81%E4%B8%
