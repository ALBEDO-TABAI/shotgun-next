<script id="guide-data" type="application/json">{"pages":[{"id":"index","path":"index.md","title":"当代提示词专家指南","description":"","type":"Index","group":"home","tags":[],"html":"<h1>当代提示词专家指南<\/h1>\n<h2 id=\"index-section-0\">让感觉有落点，让 AI 有方向<\/h2>\n<p>几年前写提示词是堆关键词：\"美女，8K，电影感，杰作\"。现在不是了。现在你要像跟一个很会画画、但完全不认识你的画师说话：她本来在做什么，发生了什么，观众从哪里能看出来。<\/p>\n<p>这本书教的就是这件事：<strong>把你脑子里模糊的感觉，变成 AI 能用的人话。<\/strong><\/p>\n<h2 id=\"index-section-1\">只有十分钟<\/h2>\n<p>读<a href=\"#/foundations/00-ten-minute-start\">00｜十分钟上手<\/a>。剩下四十多篇都是它的展开。<\/p>\n<h2 id=\"index-section-2\">只有一小时<\/h2>\n<p><a href=\"#/foundations/00-ten-minute-start\">00 十分钟上手<\/a> → <a href=\"#/foundations/02-six-layer-method\">02 六个问题<\/a> → <a href=\"#/language/01-sensory-translation\">06 通感怎么用<\/a> → <a href=\"#/language/06-rewrite-clinic\">11 改写诊所<\/a> → <a href=\"#/cases/01-brand-film\">29 品牌片案例<\/a>。<\/p>\n<h2 id=\"index-section-3\">按你现在的问题进<\/h2>\n<p><strong>\"我写的提示词出来总是一张广告脸\"<\/strong> → <a href=\"#/craft/01-acting\">12 表演<\/a>、<a href=\"#/language/04-emotion-atlas\">09 情绪图谱<\/a><\/p>\n<p><strong>\"我想要的感觉很抽象，不知道怎么写\"<\/strong> → <a href=\"#/language/01-sensory-translation\">06 通感怎么用<\/a>、<a href=\"#/language/05-atmosphere-atlas\">10 氛围图谱<\/a>、<a href=\"#/language/02-association-workshop\">07 联想工作坊<\/a><\/p>\n<p><strong>\"今天就要写一条，先给我个能抄的\"<\/strong> → <a href=\"#/language/06-rewrite-clinic\">11 改写诊所<\/a>、<a href=\"#/practice/01-templates\">37 六张模板<\/a><\/p>\n<p><strong>\"生成出来了，但不知道哪里不对\"<\/strong> → <a href=\"#/workflows/07-evaluate-repair\">27 评价与修复<\/a>、<a href=\"#/practice/03-review-rubric\">39 评价表<\/a><\/p>\n<p><strong>\"做多个镜头，人物老是变\"<\/strong> → <a href=\"#/workflows/05-assets-multishot\">25 多镜头与资产<\/a>、<a href=\"#/cases/08-object-exchange\">36 文件交接案例<\/a><\/p>\n<p><strong>\"给 AI 助手或团队用\"<\/strong> → <a href=\"#/practice/04-agent-use\">40 给 AI 助手和团队的用法<\/a>，以及 <code>skills/contemporary-prompt-expert/<\/code><\/p>\n<p><strong>\"读到不认识的词\"<\/strong> → <a href=\"#/references/glossary\">术语表<\/a><\/p>\n<h2 id=\"index-section-4\">这本书的核心主张<\/h2>\n<p>感受可以抽象，但承托它的东西要具体。细节可以丰富，但主次不能消失。锁住关键事实，给自然过渡留空间。<\/p>\n<p>写实、克制、低机位、手持、道具、音乐——都只是选择，不是唯一正确答案。<\/p>\n<h2 id=\"index-section-5\">全部目录<\/h2>\n<h3 id=\"index-section-6\"><a href=\"#/foundations/index\">I · 基础方法<\/a><\/h3>\n<p>先搞清楚这门手艺在做什么，再掌握从\"感觉\"到\"提示词\"的方法。<\/p>\n<ul>\n<li><a href=\"#/foundations/00-ten-minute-start\">00｜十分钟上手：写提示词之前，先想清楚三件事<\/a><\/li>\n<li><a href=\"#/foundations/01-what-this-field-is\">01｜这门手艺到底在做什么：从\"堆关键词\"到\"说人话\"<\/a><\/li>\n<li><a href=\"#/foundations/02-six-layer-method\">02｜六个问题：从\"我想要的感觉\"到\"AI 能用的话\"<\/a><\/li>\n<li><a href=\"#/foundations/03-three-drafts\">03｜三种稿子：给自己看的、给团队看的、给 AI 看的<\/a><\/li>\n<li><a href=\"#/foundations/04-freedom-and-constraints\">04｜哪些必须说死，哪些可以放手：分配确定性<\/a><\/li>\n<li><a href=\"#/foundations/05-how-to-know\">05｜别被自己的提示词骗了：怎么判断一句话真的有用<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-7\"><a href=\"#/language/index\">II · 通感与表达<\/a><\/h3>\n<p>把情绪、氛围和联想变成有主次的人话。<\/p>\n<ul>\n<li><a href=\"#/language/01-sensory-translation\">06｜通感怎么用：借一种感觉的形状，去描述另一种感觉<\/a><\/li>\n<li><a href=\"#/language/02-association-workshop\">07｜联想工作坊：怎么想出不落俗套的点子<\/a><\/li>\n<li><a href=\"#/language/03-scene-grammar\">08｜用人话组织画面：名词之外，还有动词、介词和连词<\/a><\/li>\n<li><a href=\"#/language/04-emotion-atlas\">09｜情绪图谱：16 种情绪，每种都不止一种身体<\/a><\/li>\n<li><a href=\"#/language/05-atmosphere-atlas\">10｜氛围图谱：16 种抽象感觉，各自可以落在什么材料上<\/a><\/li>\n<li><a href=\"#/language/06-rewrite-clinic\">11｜改写诊所：12 组\"写成这样 → 改成这样\"<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-8\"><a href=\"#/craft/index\">III · 视听专业<\/a><\/h3>\n<p>表演、摄影、美术、声音、剪辑、平面——每个部门分别怎么写。<\/p>\n<ul>\n<li><a href=\"#/craft/01-acting\">12｜表演：先问\"他想让谁怎么样\"，再写表情<\/a><\/li>\n<li><a href=\"#/craft/02-dialogue-voice\">13｜台词与配音：不是换一副嗓子，是换一种说话的关系<\/a><\/li>\n<li><a href=\"#/craft/03-action-blocking\">14｜动作与调度：东西从哪来、到哪去，手上拿着什么<\/a><\/li>\n<li><a href=\"#/craft/04-camera-attention\">15｜镜头：先决定观众站在哪里，再决定镜头怎么动<\/a><\/li>\n<li><a href=\"#/craft/05-light-material\">16｜光与材质：光从哪来、落在哪、什么东西怎么反应<\/a><\/li>\n<li><a href=\"#/craft/06-world-art-costume\">17｜美术与妆造：世界不是背景板，身份不只是一张脸<\/a><\/li>\n<li><a href=\"#/craft/07-sound-music\">18｜音乐与声音：先决定声音在干哪件事<\/a><\/li>\n<li><a href=\"#/craft/08-still-graphic-style\">19｜静态图、平面设计与风格化：一张图不必写成电影<\/a><\/li>\n<li><a href=\"#/craft/09-time-montage\">20｜时间与剪辑：提示词里发生了，不代表观众来得及看懂<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-9\"><a href=\"#/workflows/index\">IV · 生成与迭代<\/a><\/h3>\n<p>把创作说明适配到具体任务：出图、改图、生视频、多镜头、预演、修复。<\/p>\n<ul>\n<li><a href=\"#/workflows/01-brief-to-options\">21｜从一句需求到几个真正不同的方向<\/a><\/li>\n<li><a href=\"#/workflows/02-text-to-image\">22｜文字生图：先造一个能看懂的画面，再谈细节<\/a><\/li>\n<li><a href=\"#/workflows/03-image-edit\">23｜改图：说清改哪里，也要说清改完之后是什么样<\/a><\/li>\n<li><a href=\"#/workflows/04-image-to-video\">24｜图生视频：让已经存在的画面继续发生<\/a><\/li>\n<li><a href=\"#/workflows/05-assets-multishot\">25｜多镜头与资产：准备时可以丰富，提交时要克制<\/a><\/li>\n<li><a href=\"#/workflows/06-previs\">26｜复杂镜头：什么时候该放下文字，先做预演<\/a><\/li>\n<li><a href=\"#/workflows/07-evaluate-repair\">27｜评价与修复：别用\"AI 味\"三个字掩盖问题在哪<\/a><\/li>\n<li><a href=\"#/workflows/08-model-adaptation\">28｜工具适配：同一个创意，不必用同一段提示词<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-10\"><a href=\"#/cases/index\">V · 完整案例<\/a><\/h3>\n<p>八个从头走到尾的例子：大多数人的第一稿 → 问题在哪 → 怎么想 → 执行稿 → 验收 → 失败了怎么办。<\/p>\n<ul>\n<li><a href=\"#/cases/01-brand-film\">29｜完整案例：30 秒洗发水品牌片《留一点空隙》<\/a><\/li>\n<li><a href=\"#/cases/02-relationship\">30｜完整案例：餐桌上，一句没问出口的话<\/a><\/li>\n<li><a href=\"#/cases/03-big-emotion\">31｜完整案例：喜悦真的可以冲出来<\/a><\/li>\n<li><a href=\"#/cases/04-vlog\">32｜完整案例：谁在拍谁——12 秒咖啡馆 Vlog<\/a><\/li>\n<li><a href=\"#/cases/05-empty-corridor\">33｜完整案例：空走廊为什么会让人等下去<\/a><\/li>\n<li><a href=\"#/cases/06-surreal-perfume\">34｜完整案例：不追求实拍的香水图与短动效<\/a><\/li>\n<li><a href=\"#/cases/07-comedy\">35｜完整案例：安静自习室里的零食袋<\/a><\/li>\n<li><a href=\"#/cases/08-object-exchange\">36｜完整案例：两份文件，谁最后拿着哪一份<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-11\"><a href=\"#/practice/index\">VI · 工具与练习<\/a><\/h3>\n<p>拿来就用：模板、练习、评价表、给 AI 助手的用法。<\/p>\n<ul>\n<li><a href=\"#/practice/01-templates\">37｜六张可以直接抄的模板<\/a><\/li>\n<li><a href=\"#/practice/02-exercises\">38｜练习册：12 道题，从会写到会选、会看、会改<\/a><\/li>\n<li><a href=\"#/practice/03-review-rubric\">39｜评价表：做对了吗，还能往下做吗<\/a><\/li>\n<li><a href=\"#/practice/04-agent-use\">40｜给 AI 助手和团队的用法<\/a><\/li>\n<\/ul>\n<h3 id=\"index-section-12\"><a href=\"#/references/index\">VII · 来源与理论<\/a><\/h3>\n<p>这本书依据什么写成、借了哪些理论、每组教程去了哪一章。<\/p>\n<ul>\n<li><a href=\"#/references/glossary\">术语表：书里反复出现的词，一句话解释<\/a><\/li>\n<li><a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/li>\n<li><a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/li>\n<li><a href=\"#/references/theory\">借用了哪些理论，借到什么程度<\/a><\/li>\n<li><a href=\"#/references/official-image\">图像工具的官方说法<\/a><\/li>\n<li><a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/li>\n<li><a href=\"#/references/official-voice-light\">配音和灯光的官方说法<\/a><\/li>\n<li><a href=\"#/references/okf\">OKF 封装说明<\/a><\/li>\n<\/ul>\n<h2 id=\"index-section-13\">老实说<\/h2>\n<p>这本书读的是 13 组 AI 影视教程的<strong>文字<\/strong>复审稿，没有重新看原视频。技术事实按有限的官方文档校准。六个问题、两张图谱、八个案例是这次综合设计的，<strong>没有跑过生成实验<\/strong>。<\/p>\n<p>所有案例里的时长、角色、参考代称都是设计条件，不是已经存在的媒体结果。详见<a href=\"#/references/corpus\">这本书依据什么写成<\/a>和<a href=\"#/references/theory\">借用了哪些理论<\/a>。<\/p>\n<p>封装按 OKF v0.1。Markdown 是内容源，<code>开始阅读.html<\/code> 是派生的离线阅读器。说明见<a href=\"#/references/okf\">OKF 封装说明<\/a>。<\/p>\n","text":"# 当代提示词专家指南\n\n## 让感觉有落点，让 AI 有方向\n\n几年前写提示词是堆关键词：\"美女，8K，电影感，杰作\"。现在不是了。现在你要像跟一个很会画画、但完全不认识你的画师说话：她本来在做什么，发生了什么，观众从哪里能看出来。\n\n这本书教的就是这件事：**把你脑子里模糊的感觉，变成 AI 能用的人话。**\n\n## 只有十分钟\n\n读[00｜十分钟上手](/foundations/00-ten-minute-start.md)。剩下四十多篇都是它的展开。\n\n## 只有一小时\n\n[00 十分钟上手](/foundations/00-ten-minute-start.md) → [02 六个问题](/foundations/02-six-layer-method.md) → [06 通感怎么用](/language/01-sensory-translation.md) → [11 改写诊所](/language/06-rewrite-clinic.md) → [29 品牌片案例](/cases/01-brand-film.md)。\n\n## 按你现在的问题进\n\n**\"我写的提示词出来总是一张广告脸\"** → [12 表演](/craft/01-acting.md)、[09 情绪图谱](/language/04-emotion-atlas.md)\n\n**\"我想要的感觉很抽象，不知道怎么写\"** → [06 通感怎么用](/language/01-sensory-translation.md)、[10 氛围图谱](/language/05-atmosphere-atlas.md)、[07 联想工作坊](/language/02-association-workshop.md)\n\n**\"今天就要写一条，先给我个能抄的\"** → [11 改写诊所](/language/06-rewrite-clinic.md)、[37 六张模板](/practice/01-templates.md)\n\n**\"生成出来了，但不知道哪里不对\"** → [27 评价与修复](/workflows/07-evaluate-repair.md)、[39 评价表](/practice/03-review-rubric.md)\n\n**\"做多个镜头，人物老是变\"** → [25 多镜头与资产](/workflows/05-assets-multishot.md)、[36 文件交接案例](/cases/08-object-exchange.md)\n\n**\"给 AI 助手或团队用\"** → [40 给 AI 助手和团队的用法](/practice/04-agent-use.md)，以及 `skills/contemporary-prompt-expert/`\n\n**\"读到不认识的词\"** → [术语表](/references/glossary.md)\n\n## 这本书的核心主张\n\n感受可以抽象，但承托它的东西要具体。细节可以丰富，但主次不能消失。锁住关键事实，给自然过渡留空间。\n\n写实、克制、低机位、手持、道具、音乐——都只是选择，不是唯一正确答案。\n\n## 全部目录\n\n### [I · 基础方法](/foundations/index.md)\n\n先搞清楚这门手艺在做什么，再掌握从\"感觉\"到\"提示词\"的方法。\n\n- [00｜十分钟上手：写提示词之前，先想清楚三件事](/foundations/00-ten-minute-start.md)\n- [01｜这门手艺到底在做什么：从\"堆关键词\"到\"说人话\"](/foundations/01-what-this-field-is.md)\n- [02｜六个问题：从\"我想要的感觉\"到\"AI 能用的话\"](/foundations/02-six-layer-method.md)\n- [03｜三种稿子：给自己看的、给团队看的、给 AI 看的](/foundations/03-three-drafts.md)\n- [04｜哪些必须说死，哪些可以放手：分配确定性](/foundations/04-freedom-and-constraints.md)\n- [05｜别被自己的提示词骗了：怎么判断一句话真的有用](/foundations/05-how-to-know.md)\n\n### [II · 通感与表达](/language/index.md)\n\n把情绪、氛围和联想变成有主次的人话。\n\n- [06｜通感怎么用：借一种感觉的形状，去描述另一种感觉](/language/01-sensory-translation.md)\n- [07｜联想工作坊：怎么想出不落俗套的点子](/language/02-association-workshop.md)\n- [08｜用人话组织画面：名词之外，还有动词、介词和连词](/language/03-scene-grammar.md)\n- [09｜情绪图谱：16 种情绪，每种都不止一种身体](/language/04-emotion-atlas.md)\n- [10｜氛围图谱：16 种抽象感觉，各自可以落在什么材料上](/language/05-atmosphere-atlas.md)\n- [11｜改写诊所：12 组\"写成这样 → 改成这样\"](/language/06-rewrite-clinic.md)\n\n### [III · 视听专业](/craft/index.md)\n\n表演、摄影、美术、声音、剪辑、平面——每个部门分别怎么写。\n\n- [12｜表演：先问\"他想让谁怎么样\"，再写表情](/craft/01-acting.md)\n- [13｜台词与配音：不是换一副嗓子，是换一种说话的关系](/craft/02-dialogue-voice.md)\n- [14｜动作与调度：东西从哪来、到哪去，手上拿着什么](/craft/03-action-blocking.md)\n- [15｜镜头：先决定观众站在哪里，再决定镜头怎么动](/craft/04-camera-attention.md)\n- [16｜光与材质：光从哪来、落在哪、什么东西怎么反应](/craft/05-light-material.md)\n- [17｜美术与妆造：世界不是背景板，身份不只是一张脸](/craft/06-world-art-costume.md)\n- [18｜音乐与声音：先决定声音在干哪件事](/craft/07-sound-music.md)\n- [19｜静态图、平面设计与风格化：一张图不必写成电影](/craft/08-still-graphic-style.md)\n- [20｜时间与剪辑：提示词里发生了，不代表观众来得及看懂](/craft/09-time-montage.md)\n\n### [IV · 生成与迭代](/workflows/index.md)\n\n把创作说明适配到具体任务：出图、改图、生视频、多镜头、预演、修复。\n\n- [21｜从一句需求到几个真正不同的方向](/workflows/01-brief-to-options.md)\n- [22｜文字生图：先造一个能看懂的画面，再谈细节](/workflows/02-text-to-image.md)\n- [23｜改图：说清改哪里，也要说清改完之后是什么样](/workflows/03-image-edit.md)\n- [24｜图生视频：让已经存在的画面继续发生](/workflows/04-image-to-video.md)\n- [25｜多镜头与资产：准备时可以丰富，提交时要克制](/workflows/05-assets-multishot.md)\n- [26｜复杂镜头：什么时候该放下文字，先做预演](/workflows/06-previs.md)\n- [27｜评价与修复：别用\"AI 味\"三个字掩盖问题在哪](/workflows/07-evaluate-repair.md)\n- [28｜工具适配：同一个创意，不必用同一段提示词](/workflows/08-model-adaptation.md)\n\n### [V · 完整案例](/cases/index.md)\n\n八个从头走到尾的例子：大多数人的第一稿 → 问题在哪 → 怎么想 → 执行稿 → 验收 → 失败了怎么办。\n\n- [29｜完整案例：30 秒洗发水品牌片《留一点空隙》](/cases/01-brand-film.md)\n- [30｜完整案例：餐桌上，一句没问出口的话](/cases/02-relationship.md)\n- [31｜完整案例：喜悦真的可以冲出来](/cases/03-big-emotion.md)\n- [32｜完整案例：谁在拍谁——12 秒咖啡馆 Vlog](/cases/04-vlog.md)\n- [33｜完整案例：空走廊为什么会让人等下去](/cases/05-empty-corridor.md)\n- [34｜完整案例：不追求实拍的香水图与短动效](/cases/06-surreal-perfume.md)\n- [35｜完整案例：安静自习室里的零食袋](/cases/07-comedy.md)\n- [36｜完整案例：两份文件，谁最后拿着哪一份](/cases/08-object-exchange.md)\n\n### [VI · 工具与练习](/practice/index.md)\n\n拿来就用：模板、练习、评价表、给 AI 助手的用法。\n\n- [37｜六张可以直接抄的模板](/practice/01-templates.md)\n- [38｜练习册：12 道题，从会写到会选、会看、会改](/practice/02-exercises.md)\n- [39｜评价表：做对了吗，还能往下做吗](/practice/03-review-rubric.md)\n- [40｜给 AI 助手和团队的用法](/practice/04-agent-use.md)\n\n### [VII · 来源与理论](/references/index.md)\n\n这本书依据什么写成、借了哪些理论、每组教程去了哪一章。\n\n- [术语表：书里反复出现的词，一句话解释](/references/glossary.md)\n- [这本书依据什么写成](/references/corpus.md)\n- [13 组教程进入了哪些章节](/references/tutorial-map.md)\n- [借用了哪些理论，借到什么程度](/references/theory.md)\n- [图像工具的官方说法](/references/official-image.md)\n- [视频工具的官方说法](/references/official-video.md)\n- [配音和灯光的官方说法](/references/official-voice-light.md)\n- [OKF 封装说明](/references/okf.md)\n\n## 老实说\n\n这本书读的是 13 组 AI 影视教程的**文字**复审稿，没有重新看原视频。技术事实按有限的官方文档校准。六个问题、两张图谱、八个案例是这次综合设计的，**没有跑过生成实验**。\n\n所有案例里的时长、角色、参考代称都是设计条件，不是已经存在的媒体结果。详见[这本书依据什么写成](/references/corpus.md)和[借用了哪些理论](/references/theory.md)。\n\n封装按 OKF v0.1。Markdown 是内容源，`开始阅读.html` 是派生的离线阅读器。说明见[OKF 封装说明](/references/okf.md)。","toc":[{"id":"index-section-0","title":"让感觉有落点，让 AI 有方向"},{"id":"index-section-1","title":"只有十分钟"},{"id":"index-section-2","title":"只有一小时"},{"id":"index-section-3","title":"按你现在的问题进"},{"id":"index-section-4","title":"这本书的核心主张"},{"id":"index-section-5","title":"全部目录"},{"id":"index-section-13","title":"老实说"}]},{"id":"foundations/index","path":"foundations/index.md","title":"I · 基础方法","description":"","type":"Index","group":"foundations","tags":[],"html":"<h1>I · 基础方法<\/h1>\n<p>先搞清楚这门手艺在做什么，然后掌握一套从\"感觉\"走到\"提示词\"的方法。<\/p>\n<ul>\n<li><p><a href=\"#/foundations/00-ten-minute-start\">00｜十分钟上手：写提示词之前，先想清楚三件事<\/a> — 只用一个例子把核心方法走一遍。时间紧就先读这篇。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/01-what-this-field-is\">01｜这门手艺到底在做什么：从\"堆关键词\"到\"说人话\"<\/a> — 为什么现在的提示词和几年前完全不同，\"人话\"到底指什么。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/02-six-layer-method\">02｜六个问题：从\"我想要的感觉\"到\"AI 能用的话\"<\/a> — 全书的核心方法。六个问题，一步步从感受走到提交。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/03-three-drafts\">03｜三种稿子：给自己看的、给团队看的、给 AI 看的<\/a> — 诗意和工程分开写，别挤在一段话里。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/04-freedom-and-constraints\">04｜哪些必须说死，哪些可以放手：分配确定性<\/a> — 专业不是把一切锁住，而是知道锁什么、放什么。<\/p>\n<\/li>\n<li><p><a href=\"#/foundations/05-how-to-know\">05｜别被自己的提示词骗了：怎么判断一句话真的有用<\/a> — 写得漂亮不等于有效。几个简单的检查。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# I · 基础方法\n\n先搞清楚这门手艺在做什么，然后掌握一套从\"感觉\"走到\"提示词\"的方法。\n\n- [00｜十分钟上手：写提示词之前，先想清楚三件事](/foundations/00-ten-minute-start.md) — 只用一个例子把核心方法走一遍。时间紧就先读这篇。\n\n- [01｜这门手艺到底在做什么：从\"堆关键词\"到\"说人话\"](/foundations/01-what-this-field-is.md) — 为什么现在的提示词和几年前完全不同，\"人话\"到底指什么。\n\n- [02｜六个问题：从\"我想要的感觉\"到\"AI 能用的话\"](/foundations/02-six-layer-method.md) — 全书的核心方法。六个问题，一步步从感受走到提交。\n\n- [03｜三种稿子：给自己看的、给团队看的、给 AI 看的](/foundations/03-three-drafts.md) — 诗意和工程分开写，别挤在一段话里。\n\n- [04｜哪些必须说死，哪些可以放手：分配确定性](/foundations/04-freedom-and-constraints.md) — 专业不是把一切锁住，而是知道锁什么、放什么。\n\n- [05｜别被自己的提示词骗了：怎么判断一句话真的有用](/foundations/05-how-to-know.md) — 写得漂亮不等于有效。几个简单的检查。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"foundations/00-ten-minute-start","path":"foundations/00-ten-minute-start.md","title":"00｜十分钟上手：写提示词之前，先想清楚三件事","description":"只用一个例子，把全书最核心的方法走一遍。读完这一篇，你已经能写出比大多数人更好的提示词。","type":"Framework","group":"foundations","tags":["入门","核心方法","快速上手"],"html":"<h1>00｜十分钟上手：写提示词之前，先想清楚三件事<\/h1>\n<blockquote>\n<p>如果你只有十分钟，读这一篇就够了。剩下的四十多篇，都是这一篇的展开。<\/p>\n<\/blockquote>\n<h2 id=\"foundations-00-ten-minute-start-section-0\">先看一个大家都会犯的错<\/h2>\n<p>假设你想让 AI 生成一段视频：一个女孩收到好消息，很开心。<\/p>\n<p>大多数人会这样写：<\/p>\n<blockquote>\n<p>一个漂亮的女孩，非常开心，灿烂地笑着，电影感，8K，高清，真实自然。<\/p>\n<\/blockquote>\n<p>这样写出来的结果，往往是一个对着镜头露出标准笑容的模特。为什么？因为你告诉 AI 的只有<strong>结论<\/strong>（她开心），没有告诉 AI <strong>开心是怎么发生的<\/strong>。AI 只能拿它最常见的\"开心\"来填空——那就是广告式的笑脸。<\/p>\n<h2 id=\"foundations-00-ten-minute-start-section-1\">三件事：她想做什么、发生了什么、哪里能看出来<\/h2>\n<p>好的提示词，其实就是回答三个问题：<\/p>\n<p><strong>第一，她本来在做什么？<\/strong> 情绪不会凭空出现，人总是在做着某件事的时候被打断。比如：她正低头看手机。<\/p>\n<p><strong>第二，发生了什么让她变了？<\/strong> 一个刺激。比如：屏幕上出现了她等了很久的消息。<\/p>\n<p><strong>第三，观众从哪里能看出她变了？<\/strong> 一个看得见的动作或变化。比如：她盯着屏幕停了一下，又快速看了一遍，然后才敢抬头，笑出来。<\/p>\n<p>把这三件事写下来：<\/p>\n<blockquote>\n<p>她坐在桌边低头看手机。看到消息后，先停住，又快速看了一遍，好像不敢相信。然后她抬起头，看向画面右边的朋友，笑容慢慢展开。握着手机的手不再那么紧。镜头不动，等她把这个反应做完。<\/p>\n<\/blockquote>\n<p>这一段没有一个\"开心\"，但每个人都能看出她很开心。而且是<strong>她这个人、在这一刻的<\/strong>开心，不是一张通用笑脸。<\/p>\n<h2 id=\"foundations-00-ten-minute-start-section-2\">为什么这样写会好很多<\/h2>\n<p>你可以把 AI 想成一个很会画画、但完全不认识你的画师。你说\"画一个开心的人\"，它只能画它见过最多的开心。你说\"她看到消息后不敢相信，确认了两遍才敢笑\"，它就有了具体的东西可以画。<\/p>\n<p><strong>形容词是结论，动作是证据。<\/strong> AI 需要的是证据。<\/p>\n<h2 id=\"foundations-00-ten-minute-start-section-3\">再往前一步：感觉可以很抽象，落点必须很具体<\/h2>\n<p>有时候你脑子里的感觉本来就是模糊的，比如\"我想要一种清爽的感觉\"。这没问题，先把感觉写下来，甚至可以用比喻：<\/p>\n<blockquote>\n<p>像刚洗完脸，风吹过来的那一下。<\/p>\n<\/blockquote>\n<p>然后问自己：<strong>这个感觉，落在画面里的什么东西上？<\/strong> 可以是空间（画面留出大片干净的空白）、可以是动作（她把头发拨到肩后，然后不再动）、可以是声音（嘈杂声退远，只剩下水声和呼吸）。<\/p>\n<p>选一个主要的落点，最多再加一个配角。三个一起上，观众反而什么都感觉不到。<\/p>\n<h2 id=\"foundations-00-ten-minute-start-section-4\">最后：写完别急着交，先删<\/h2>\n<p>写完之后，读一遍，问三个问题：<\/p>\n<ol>\n<li>我能在脑子里看见这个画面吗？如果不能，说明写得太抽象。<\/li>\n<li>有没有互相矛盾的地方？比如\"镜头固定不动\"和\"镜头缓缓推近\"同时出现。<\/li>\n<li>哪些词是我为了显得专业加上去的？\"电影感、8K、大师级\"——删掉，它们几乎不提供信息。<\/li>\n<\/ol>\n<h2 id=\"foundations-00-ten-minute-start-section-5\">一句话记住<\/h2>\n<p><strong>不要告诉 AI 结论，告诉它事情是怎么发生的。感觉可以抽象，落点必须具体。<\/strong><\/p>\n<h2 id=\"foundations-00-ten-minute-start-section-6\">接下来读什么<\/h2>\n<ul>\n<li>想搞懂为什么\"人话\"比\"关键词\"有用：<a href=\"#/foundations/01-what-this-field-is\">这门手艺到底在做什么<\/a><\/li>\n<li>想把\"三件事\"扩展成完整方法：<a href=\"#/foundations/02-six-layer-method\">六个问题：从感受到提示词<\/a><\/li>\n<li>今天就要写一条提示词：直接去<a href=\"#/language/06-rewrite-clinic\">改写诊所<\/a>看对照例子<\/li>\n<\/ul>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 00｜十分钟上手：写提示词之前，先想清楚三件事\n\n> 如果你只有十分钟，读这一篇就够了。剩下的四十多篇，都是这一篇的展开。\n\n## 先看一个大家都会犯的错\n\n假设你想让 AI 生成一段视频：一个女孩收到好消息，很开心。\n\n大多数人会这样写：\n\n> 一个漂亮的女孩，非常开心，灿烂地笑着，电影感，8K，高清，真实自然。\n\n这样写出来的结果，往往是一个对着镜头露出标准笑容的模特。为什么？因为你告诉 AI 的只有**结论**（她开心），没有告诉 AI **开心是怎么发生的**。AI 只能拿它最常见的\"开心\"来填空——那就是广告式的笑脸。\n\n## 三件事：她想做什么、发生了什么、哪里能看出来\n\n好的提示词，其实就是回答三个问题：\n\n**第一，她本来在做什么？** 情绪不会凭空出现，人总是在做着某件事的时候被打断。比如：她正低头看手机。\n\n**第二，发生了什么让她变了？** 一个刺激。比如：屏幕上出现了她等了很久的消息。\n\n**第三，观众从哪里能看出她变了？** 一个看得见的动作或变化。比如：她盯着屏幕停了一下，又快速看了一遍，然后才敢抬头，笑出来。\n\n把这三件事写下来：\n\n> 她坐在桌边低头看手机。看到消息后，先停住，又快速看了一遍，好像不敢相信。然后她抬起头，看向画面右边的朋友，笑容慢慢展开。握着手机的手不再那么紧。镜头不动，等她把这个反应做完。\n\n这一段没有一个\"开心\"，但每个人都能看出她很开心。而且是**她这个人、在这一刻的**开心，不是一张通用笑脸。\n\n## 为什么这样写会好很多\n\n你可以把 AI 想成一个很会画画、但完全不认识你的画师。你说\"画一个开心的人\"，它只能画它见过最多的开心。你说\"她看到消息后不敢相信，确认了两遍才敢笑\"，它就有了具体的东西可以画。\n\n**形容词是结论，动作是证据。** AI 需要的是证据。\n\n## 再往前一步：感觉可以很抽象，落点必须很具体\n\n有时候你脑子里的感觉本来就是模糊的，比如\"我想要一种清爽的感觉\"。这没问题，先把感觉写下来，甚至可以用比喻：\n\n> 像刚洗完脸，风吹过来的那一下。\n\n然后问自己：**这个感觉，落在画面里的什么东西上？** 可以是空间（画面留出大片干净的空白）、可以是动作（她把头发拨到肩后，然后不再动）、可以是声音（嘈杂声退远，只剩下水声和呼吸）。\n\n选一个主要的落点，最多再加一个配角。三个一起上，观众反而什么都感觉不到。\n\n## 最后：写完别急着交，先删\n\n写完之后，读一遍，问三个问题：\n\n1. 我能在脑子里看见这个画面吗？如果不能，说明写得太抽象。\n2. 有没有互相矛盾的地方？比如\"镜头固定不动\"和\"镜头缓缓推近\"同时出现。\n3. 哪些词是我为了显得专业加上去的？\"电影感、8K、大师级\"——删掉，它们几乎不提供信息。\n\n## 一句话记住\n\n**不要告诉 AI 结论，告诉它事情是怎么发生的。感觉可以抽象，落点必须具体。**\n\n## 接下来读什么\n\n- 想搞懂为什么\"人话\"比\"关键词\"有用：[这门手艺到底在做什么](/foundations/01-what-this-field-is.md)\n- 想把\"三件事\"扩展成完整方法：[六个问题：从感受到提示词](/foundations/02-six-layer-method.md)\n- 今天就要写一条提示词：直接去[改写诊所](/language/06-rewrite-clinic.md)看对照例子\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"foundations-00-ten-minute-start-section-0","title":"先看一个大家都会犯的错"},{"id":"foundations-00-ten-minute-start-section-1","title":"三件事：她想做什么、发生了什么、哪里能看出来"},{"id":"foundations-00-ten-minute-start-section-2","title":"为什么这样写会好很多"},{"id":"foundations-00-ten-minute-start-section-3","title":"再往前一步：感觉可以很抽象，落点必须很具体"},{"id":"foundations-00-ten-minute-start-section-4","title":"最后：写完别急着交，先删"},{"id":"foundations-00-ten-minute-start-section-5","title":"一句话记住"},{"id":"foundations-00-ten-minute-start-section-6","title":"接下来读什么"}]},{"id":"foundations/01-what-this-field-is","path":"foundations/01-what-this-field-is.md","title":"01｜这门手艺到底在做什么：从\"堆关键词\"到\"说人话\"","description":"解释为什么现在的提示词和几年前完全不同，以及\"人话\"到底指什么、不指什么。","type":"Framework","group":"foundations","tags":["总论","人话","边界"],"html":"<h1>01｜这门手艺到底在做什么：从\"堆关键词\"到\"说人话\"<\/h1>\n<h2 id=\"foundations-01-what-this-field-is-section-0\">几年前是这样写的<\/h2>\n<p>如果你用过早期的 Midjourney 或 Stable Diffusion，你大概记得那种写法：<\/p>\n<blockquote>\n<p>girl, rainy night, lonely, cinematic lighting, masterpiece, 8k, ultra detailed, trending on artstation<\/p>\n<\/blockquote>\n<p>一串词，用逗号隔开，像在超市货架上挑东西。那时候的模型确实吃这一套——它们更像一个\"标签搜索引擎\"，你给的标签越多越准，它找到的图就越像你想的。<\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-1\">现在为什么不一样了<\/h2>\n<p>现在的图像和视频模型，理解的是<strong>整句话之间的关系<\/strong>，而不只是一个个孤立的词。你说\"她把杯子放下\"和\"她把杯子拿起\"，它能分得清；你说\"她听到名字之后才回头\"，它知道有个先后顺序。<\/p>\n<p>这带来一个很大的变化：<strong>以前你在挑标签，现在你在描述一件正在发生的事。<\/strong><\/p>\n<p>但这不是说\"越长越好\"\"越像作文越好\"。看这三种写法：<\/p>\n<p><strong>只有标签<\/strong>：<\/p>\n<blockquote>\n<p>雨夜、孤独、电影感。<\/p>\n<\/blockquote>\n<p><strong>变成了句子，但没有增加信息<\/strong>：<\/p>\n<blockquote>\n<p>一个人孤独地坐在雨夜的餐厅里，望着窗外，很有电影感。<\/p>\n<\/blockquote>\n<p><strong>真正有用的描述<\/strong>：<\/p>\n<blockquote>\n<p>餐厅快关门了。服务员已经把旁边的椅子倒扣在桌上，他却还把对面那杯水留在原处。镜头不靠近，就在桌子另一头等着。<\/p>\n<\/blockquote>\n<p>第三种没有说\"孤独\"，也没有说\"电影感\"，但你读完就知道是什么感觉。因为它写的是<strong>关系<\/strong>：快关门了（时间压力）、椅子倒扣了（别人都走了）、水还留着（他还在等）、镜头不靠近（我们只是旁观）。<\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-2\">\"人话\"是什么意思<\/h2>\n<p>这本书说的\"人话\"，不是\"口语化\"，也不是\"写得像散文\"。它指的是：<\/p>\n<p><strong>像你跟一个很会画画、但完全不了解这件事的朋友描述一个场景那样去写。<\/strong><\/p>\n<p>你不会跟朋友说\"高维情绪场域、真实感权重\"，也不会只说\"雨夜、孤独\"。你会说：谁、在哪、正在做什么、发生了什么、然后呢。<\/p>\n<p>所以\"人话\"的核心是<strong>说清楚关系和变化<\/strong>，而不是句子长短。<\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-3\">那些抽象的形容词，还能用吗<\/h2>\n<p>\"清爽\"\"梦幻\"\"高级\"\"电影感\"——这些词不是不能用，而是<strong>不能只有它们<\/strong>。<\/p>\n<p>你可以把它们当成音乐的调性：先定个大方向。但如果整段只有调性没有旋律，AI 就只能拿它最常见的理解来填，结果就是千篇一律。<\/p>\n<p>正确的用法是：留一个抽象词定方向，再给它一两个具体的支撑。<\/p>\n<blockquote>\n<p>整体清爽。浅色的墙留出大片空白，台面上只有一小圈还没干的水迹。<\/p>\n<\/blockquote>\n<p>\"清爽\"是方向，\"空白\"和\"水迹\"是支撑。<\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-4\">这门手艺借了哪些老本事<\/h2>\n<p>写提示词不是一门凭空出现的新学问。它借了很多现成的知识：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>借自哪里<\/th>\n<th>借来什么<\/th>\n<th>但不能直接照搬什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>摄影和美术<\/td>\n<td>怎么安排空间、材质、光线，从哪里看<\/td>\n<td>写了镜头型号，AI 就能精确模拟那个镜头<\/td>\n<\/tr>\n<tr>\n<td>表演和编剧<\/td>\n<td>人物想要什么、遇到什么阻碍、怎么反应<\/td>\n<td>每个镜头都必须藏着秘密<\/td>\n<\/tr>\n<tr>\n<td>声音和剪辑<\/td>\n<td>先听到再看到、停顿、转折<\/td>\n<td>音乐越多越有情绪<\/td>\n<\/tr>\n<tr>\n<td>心理学里的感知研究<\/td>\n<td>人怎么把颜色、声音和情绪联系起来<\/td>\n<td>某个颜色一定让所有人有同一种感受<\/td>\n<\/tr>\n<tr>\n<td>做实验的方法<\/td>\n<td>比较方案、一次只改一个变量、记录失败<\/td>\n<td>一次好结果就证明这句话永远有效<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>这些老本事帮你<strong>想清楚要什么<\/strong>。但把它翻译成 AI 能用的话，是新的活儿，没有哪本旧书能替你做。<\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-5\">专家和新手的区别<\/h2>\n<p>不是专家写得更长。恰恰相反，专家常常写得更短，因为他知道：<\/p>\n<ul>\n<li>哪些东西必须说清楚（这是谁、拿的是什么、结尾发生了什么）<\/li>\n<li>哪些东西可以交给 AI 自己发挥（头发怎么飘、自然的眨眼）<\/li>\n<li>哪些东西根本不该靠文字解决，应该用参考图、分镜或后期<\/li>\n<\/ul>\n<p>这本书的目标不是教你\"去掉所有 AI 味\"。写实的纪录片、精致的广告、二维插画、荒诞的动画，各有各的\"真\"。目标是：<strong>你想表达的东西，观众能接收到；画面自己不打架；做出来的东西能继续往下做。<\/strong><\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-6\">一句话记住<\/h2>\n<p><strong>关键词是挑标签，人话是描述一件正在发生的事。关键不是长短，是有没有说清\"谁、在哪、做什么、然后呢\"。<\/strong><\/p>\n<h2 id=\"foundations-01-what-this-field-is-section-7\">动手试试<\/h2>\n<p>拿一条你以前写过的提示词，把里面所有的形容词圈出来。然后问：每个形容词背后，观众具体能看见或听见什么？把答案写下来，替换掉那些形容词。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-image\">图像工具的官方说法<\/a>\n[3] <a href=\"#/references/official-video\">视频工具的官方说法<\/a>\n[4] <a href=\"#/references/theory\">借用了哪些理论，借到什么程度<\/a><\/p>\n<\/details>","text":"# 01｜这门手艺到底在做什么：从\"堆关键词\"到\"说人话\"\n\n## 几年前是这样写的\n\n如果你用过早期的 Midjourney 或 Stable Diffusion，你大概记得那种写法：\n\n> girl, rainy night, lonely, cinematic lighting, masterpiece, 8k, ultra detailed, trending on artstation\n\n一串词，用逗号隔开，像在超市货架上挑东西。那时候的模型确实吃这一套——它们更像一个\"标签搜索引擎\"，你给的标签越多越准，它找到的图就越像你想的。\n\n## 现在为什么不一样了\n\n现在的图像和视频模型，理解的是**整句话之间的关系**，而不只是一个个孤立的词。你说\"她把杯子放下\"和\"她把杯子拿起\"，它能分得清；你说\"她听到名字之后才回头\"，它知道有个先后顺序。\n\n这带来一个很大的变化：**以前你在挑标签，现在你在描述一件正在发生的事。**\n\n但这不是说\"越长越好\"\"越像作文越好\"。看这三种写法：\n\n**只有标签**：\n> 雨夜、孤独、电影感。\n\n**变成了句子，但没有增加信息**：\n> 一个人孤独地坐在雨夜的餐厅里，望着窗外，很有电影感。\n\n**真正有用的描述**：\n> 餐厅快关门了。服务员已经把旁边的椅子倒扣在桌上，他却还把对面那杯水留在原处。镜头不靠近，就在桌子另一头等着。\n\n第三种没有说\"孤独\"，也没有说\"电影感\"，但你读完就知道是什么感觉。因为它写的是**关系**：快关门了（时间压力）、椅子倒扣了（别人都走了）、水还留着（他还在等）、镜头不靠近（我们只是旁观）。\n\n## \"人话\"是什么意思\n\n这本书说的\"人话\"，不是\"口语化\"，也不是\"写得像散文\"。它指的是：\n\n**像你跟一个很会画画、但完全不了解这件事的朋友描述一个场景那样去写。**\n\n你不会跟朋友说\"高维情绪场域、真实感权重\"，也不会只说\"雨夜、孤独\"。你会说：谁、在哪、正在做什么、发生了什么、然后呢。\n\n所以\"人话\"的核心是**说清楚关系和变化**，而不是句子长短。\n\n## 那些抽象的形容词，还能用吗\n\n\"清爽\"\"梦幻\"\"高级\"\"电影感\"——这些词不是不能用，而是**不能只有它们**。\n\n你可以把它们当成音乐的调性：先定个大方向。但如果整段只有调性没有旋律，AI 就只能拿它最常见的理解来填，结果就是千篇一律。\n\n正确的用法是：留一个抽象词定方向，再给它一两个具体的支撑。\n\n> 整体清爽。浅色的墙留出大片空白，台面上只有一小圈还没干的水迹。\n\n\"清爽\"是方向，\"空白\"和\"水迹\"是支撑。\n\n## 这门手艺借了哪些老本事\n\n写提示词不是一门凭空出现的新学问。它借了很多现成的知识：\n\n| 借自哪里 | 借来什么 | 但不能直接照搬什么 |\n| --- | --- | --- |\n| 摄影和美术 | 怎么安排空间、材质、光线，从哪里看 | 写了镜头型号，AI 就能精确模拟那个镜头 |\n| 表演和编剧 | 人物想要什么、遇到什么阻碍、怎么反应 | 每个镜头都必须藏着秘密 |\n| 声音和剪辑 | 先听到再看到、停顿、转折 | 音乐越多越有情绪 |\n| 心理学里的感知研究 | 人怎么把颜色、声音和情绪联系起来 | 某个颜色一定让所有人有同一种感受 |\n| 做实验的方法 | 比较方案、一次只改一个变量、记录失败 | 一次好结果就证明这句话永远有效 |\n\n这些老本事帮你**想清楚要什么**。但把它翻译成 AI 能用的话，是新的活儿，没有哪本旧书能替你做。\n\n## 专家和新手的区别\n\n不是专家写得更长。恰恰相反，专家常常写得更短，因为他知道：\n\n- 哪些东西必须说清楚（这是谁、拿的是什么、结尾发生了什么）\n- 哪些东西可以交给 AI 自己发挥（头发怎么飘、自然的眨眼）\n- 哪些东西根本不该靠文字解决，应该用参考图、分镜或后期\n\n这本书的目标不是教你\"去掉所有 AI 味\"。写实的纪录片、精致的广告、二维插画、荒诞的动画，各有各的\"真\"。目标是：**你想表达的东西，观众能接收到；画面自己不打架；做出来的东西能继续往下做。**\n\n## 一句话记住\n\n**关键词是挑标签，人话是描述一件正在发生的事。关键不是长短，是有没有说清\"谁、在哪、做什么、然后呢\"。**\n\n## 动手试试\n\n拿一条你以前写过的提示词，把里面所有的形容词圈出来。然后问：每个形容词背后，观众具体能看见或听见什么？把答案写下来，替换掉那些形容词。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [图像工具的官方说法](/references/official-image.md)\n[3] [视频工具的官方说法](/references/official-video.md)\n[4] [借用了哪些理论，借到什么程度](/references/theory.md)","toc":[{"id":"foundations-01-what-this-field-is-section-0","title":"几年前是这样写的"},{"id":"foundations-01-what-this-field-is-section-1","title":"现在为什么不一样了"},{"id":"foundations-01-what-this-field-is-section-2","title":"\"人话\"是什么意思"},{"id":"foundations-01-what-this-field-is-section-3","title":"那些抽象的形容词，还能用吗"},{"id":"foundations-01-what-this-field-is-section-4","title":"这门手艺借了哪些老本事"},{"id":"foundations-01-what-this-field-is-section-5","title":"专家和新手的区别"},{"id":"foundations-01-what-this-field-is-section-6","title":"一句话记住"},{"id":"foundations-01-what-this-field-is-section-7","title":"动手试试"}]},{"id":"foundations/02-six-layer-method","path":"foundations/02-six-layer-method.md","title":"02｜六个问题：从\"我想要的感觉\"到\"AI 能用的话\"","description":"全书的核心方法。从观众的感受出发，一路问到具体提交什么，中间的每一步都可以单独检查。","type":"Framework","group":"foundations","tags":["核心方法","六个问题","感受落点"],"html":"<h1>02｜六个问题：从\"我想要的感觉\"到\"AI 能用的话\"<\/h1>\n<blockquote>\n<p>\"让观众松一口气\"，不等于让画面里的人叹气。那口气，也可以由空间、节奏或声音替他松开。<\/p>\n<\/blockquote>\n<h2 id=\"foundations-02-six-layer-method-section-0\">问题在哪里<\/h2>\n<p>你脑子里有一个感觉，比如\"下班回家，终于属于自己了\"。你要把这个感觉变成一段 AI 能生成的视频。中间隔着很远的距离。<\/p>\n<p>大多数人的做法是直接跳过去：<\/p>\n<blockquote>\n<p>一个女孩下班回家，很放松，很治愈，温暖的灯光，电影感。<\/p>\n<\/blockquote>\n<p>结果 AI 给你一个在沙发上摆姿势微笑的模特。感觉没有传达出来，你也不知道是哪一步出了问题。<\/p>\n<p>这一章给你一个梯子：<strong>六个问题，一步一步往下走<\/strong>。每一步都能单独检查，出了问题知道回到哪一步修。<\/p>\n<h2 id=\"foundations-02-six-layer-method-section-1\">六个问题<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>第几步<\/th>\n<th>问自己<\/th>\n<th>用\"下班后终于属于自己\"来回答<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1．感受<\/td>\n<td>我想让观众感到什么、注意到什么？<\/td>\n<td>从被催促，变成可以慢一点<\/td>\n<\/tr>\n<tr>\n<td>2．变化<\/td>\n<td>什么东西在发生变化？什么力量在此消彼长？<\/td>\n<td>外面的时间退后，自己的时间回来<\/td>\n<\/tr>\n<tr>\n<td>3．落点<\/td>\n<td>这个变化落在什么人、什么东西上？<\/td>\n<td>一只脱下的鞋、一扇门、一只还握着的手<\/td>\n<\/tr>\n<tr>\n<td>4．看见听见<\/td>\n<td>观众具体看到、听到什么？<\/td>\n<td>鞋落地，手松开，走廊的声音被门隔远<\/td>\n<\/tr>\n<tr>\n<td>5．怎么看<\/td>\n<td>从哪里看？先看什么后看什么？不拍什么？<\/td>\n<td>不拍夸张的笑脸，门口先留半秒空白<\/td>\n<\/tr>\n<tr>\n<td>6．交给谁<\/td>\n<td>交给哪个工具？用哪些参考图？哪些参数？<\/td>\n<td>用首帧图生视频，镜头不动，只生成松手和门声的变化<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>第 1 步是目的，第 2 步是骨架，第 3 步是材料，第 4 步是证据，第 5 步是表达方式，第 6 步是执行。<\/strong><\/p>\n<h2 id=\"foundations-02-six-layer-method-section-2\">不是六份表格，是六次检查<\/h2>\n<p>简单的任务，三句话就能走完六步。复杂的项目才需要把它们拆开写。<strong>这六个问题不是让你每次都填六张表，而是出了问题时，帮你找到是哪一步掉链子了。<\/strong><\/p>\n<p>也可以倒着走。有时候你先有了一张特别好的照片（第 4 步），再去想它适合表达什么感受（第 1 步）。六个问题是检查用的，不是限制灵感从哪里进来。<\/p>\n<h2 id=\"foundations-02-six-layer-method-section-3\">同一个感觉，至少想三条路<\/h2>\n<p>\"清爽\"可以是冰凉的水流，也可以是大热天终于有一阵风，还可以是一张不再挤满字的海报。<strong>先想出几种不同的机制，再挑一个。<\/strong> 把蓝色换成青色、再换成薄荷绿，那不是三个创意，是一个创意换了三次颜色。<\/p>\n<p>比如\"从紧绷到松开\"：<\/p>\n<p><strong>用身体来表现<\/strong>：手指从紧扣杯柄，到只是轻轻搭着；肩膀慢慢落下来。适合有人物的场景，不需要大场面。<\/p>\n<p><strong>用空间来表现<\/strong>：开头视野被门框挤得很窄，后来人物走进更宽、更亮的地方。适合把变化交给构图。但别让房间莫名其妙变大。<\/p>\n<p><strong>用声音来表现<\/strong>：细碎的通知音一直在抢，门关上之后只剩下水声和呼吸。适合声音先行，画面可以很安静。<\/p>\n<p>三条路可以合作，但不要都开到最大。否则观众会同时收到三个\"松开\"的感叹号，反而什么都感觉不到。<\/p>\n<h2 id=\"foundations-02-six-layer-method-section-4\">哪些地方要给证据，哪些地方可以放着<\/h2>\n<p><strong>关键的情节要有证据。<\/strong> \"她拿到了真的那封信\"——观众必须能看清是哪封信、怎么交到她手上的。<\/p>\n<p><strong>气氛可以留有余地。<\/strong> \"有一点不舍\"——不需要每个细节都在解释不舍。杯子不一定是婚姻的隐喻，窗帘也不必每次都象征自由。<\/p>\n<p>有一个简单的判断方法：<strong>把这句说明删掉，观众看成片时还会有同样的感受吗？<\/strong> 如果不会、而画面里也没有对应的细节，说明表达有空缺，要补。如果会，那这句话可能只是你自己的解释，观众不需要。<\/p>\n<h2 id=\"foundations-02-six-layer-method-section-5\">五种常见的掉链子<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>写成这样<\/th>\n<th>掉在哪一步<\/th>\n<th>为什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"她很后悔\"<\/td>\n<td>第 1 步到第 4 步之间<\/td>\n<td>只有感受，没有任何看得见的表现<\/td>\n<\/tr>\n<tr>\n<td>\"镜头围着人物转一圈\"<\/td>\n<td>第 5 步和第 1 步之间<\/td>\n<td>有动作，但不知道为什么要这么看<\/td>\n<\/tr>\n<tr>\n<td>\"保持同一个瓶身\"，但没上传瓶子的参考图<\/td>\n<td>第 6 步<\/td>\n<td>条件没有真正给到 AI<\/td>\n<\/tr>\n<tr>\n<td>\"固定机位\"，同时又选了\"推近\"运镜<\/td>\n<td>第 6 步<\/td>\n<td>文字和设置互相打架<\/td>\n<\/tr>\n<tr>\n<td>\"画面很美，但认不出产品\"<\/td>\n<td>评价时<\/td>\n<td>把配角的好看，压过了主角的任务<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>哪一步出问题，就回到哪一步修。<\/strong> 不要所有失败都靠改几个形容词补救。<\/p>\n<h2 id=\"foundations-02-six-layer-method-section-6\">一句话记住<\/h2>\n<p><strong>先问观众要感到什么，再问这个感觉落在什么东西上，最后才问怎么写给 AI。出了问题，找到是哪一步掉链子，别乱改。<\/strong><\/p>\n<h2 id=\"foundations-02-six-layer-method-section-7\">动手试试<\/h2>\n<p>选一个你想表达的感觉（比如\"期待\"\"尴尬\"\"刚睡醒\"），用上面的表格填一遍六个问题。然后为第 3 步\"落点\"想出三种不同的机制——一种用身体，一种用空间，一种用声音。<\/p>\n<p>下一步，看<a href=\"#/foundations/03-three-drafts\">三种稿子<\/a>，学习怎么把这六步变成自然的文字。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 02｜六个问题：从\"我想要的感觉\"到\"AI 能用的话\"\n\n> \"让观众松一口气\"，不等于让画面里的人叹气。那口气，也可以由空间、节奏或声音替他松开。\n\n## 问题在哪里\n\n你脑子里有一个感觉，比如\"下班回家，终于属于自己了\"。你要把这个感觉变成一段 AI 能生成的视频。中间隔着很远的距离。\n\n大多数人的做法是直接跳过去：\n\n> 一个女孩下班回家，很放松，很治愈，温暖的灯光，电影感。\n\n结果 AI 给你一个在沙发上摆姿势微笑的模特。感觉没有传达出来，你也不知道是哪一步出了问题。\n\n这一章给你一个梯子：**六个问题，一步一步往下走**。每一步都能单独检查，出了问题知道回到哪一步修。\n\n## 六个问题\n\n| 第几步 | 问自己 | 用\"下班后终于属于自己\"来回答 |\n| --- | --- | --- |\n| 1．感受 | 我想让观众感到什么、注意到什么？ | 从被催促，变成可以慢一点 |\n| 2．变化 | 什么东西在发生变化？什么力量在此消彼长？ | 外面的时间退后，自己的时间回来 |\n| 3．落点 | 这个变化落在什么人、什么东西上？ | 一只脱下的鞋、一扇门、一只还握着的手 |\n| 4．看见听见 | 观众具体看到、听到什么？ | 鞋落地，手松开，走廊的声音被门隔远 |\n| 5．怎么看 | 从哪里看？先看什么后看什么？不拍什么？ | 不拍夸张的笑脸，门口先留半秒空白 |\n| 6．交给谁 | 交给哪个工具？用哪些参考图？哪些参数？ | 用首帧图生视频，镜头不动，只生成松手和门声的变化 |\n\n**第 1 步是目的，第 2 步是骨架，第 3 步是材料，第 4 步是证据，第 5 步是表达方式，第 6 步是执行。**\n\n## 不是六份表格，是六次检查\n\n简单的任务，三句话就能走完六步。复杂的项目才需要把它们拆开写。**这六个问题不是让你每次都填六张表，而是出了问题时，帮你找到是哪一步掉链子了。**\n\n也可以倒着走。有时候你先有了一张特别好的照片（第 4 步），再去想它适合表达什么感受（第 1 步）。六个问题是检查用的，不是限制灵感从哪里进来。\n\n## 同一个感觉，至少想三条路\n\n\"清爽\"可以是冰凉的水流，也可以是大热天终于有一阵风，还可以是一张不再挤满字的海报。**先想出几种不同的机制，再挑一个。** 把蓝色换成青色、再换成薄荷绿，那不是三个创意，是一个创意换了三次颜色。\n\n比如\"从紧绷到松开\"：\n\n**用身体来表现**：手指从紧扣杯柄，到只是轻轻搭着；肩膀慢慢落下来。适合有人物的场景，不需要大场面。\n\n**用空间来表现**：开头视野被门框挤得很窄，后来人物走进更宽、更亮的地方。适合把变化交给构图。但别让房间莫名其妙变大。\n\n**用声音来表现**：细碎的通知音一直在抢，门关上之后只剩下水声和呼吸。适合声音先行，画面可以很安静。\n\n三条路可以合作，但不要都开到最大。否则观众会同时收到三个\"松开\"的感叹号，反而什么都感觉不到。\n\n## 哪些地方要给证据，哪些地方可以放着\n\n**关键的情节要有证据。** \"她拿到了真的那封信\"——观众必须能看清是哪封信、怎么交到她手上的。\n\n**气氛可以留有余地。** \"有一点不舍\"——不需要每个细节都在解释不舍。杯子不一定是婚姻的隐喻，窗帘也不必每次都象征自由。\n\n有一个简单的判断方法：**把这句说明删掉，观众看成片时还会有同样的感受吗？** 如果不会、而画面里也没有对应的细节，说明表达有空缺，要补。如果会，那这句话可能只是你自己的解释，观众不需要。\n\n## 五种常见的掉链子\n\n| 写成这样 | 掉在哪一步 | 为什么 |\n| --- | --- | --- |\n| \"她很后悔\" | 第 1 步到第 4 步之间 | 只有感受，没有任何看得见的表现 |\n| \"镜头围着人物转一圈\" | 第 5 步和第 1 步之间 | 有动作，但不知道为什么要这么看 |\n| \"保持同一个瓶身\"，但没上传瓶子的参考图 | 第 6 步 | 条件没有真正给到 AI |\n| \"固定机位\"，同时又选了\"推近\"运镜 | 第 6 步 | 文字和设置互相打架 |\n| \"画面很美，但认不出产品\" | 评价时 | 把配角的好看，压过了主角的任务 |\n\n**哪一步出问题，就回到哪一步修。** 不要所有失败都靠改几个形容词补救。\n\n## 一句话记住\n\n**先问观众要感到什么，再问这个感觉落在什么东西上，最后才问怎么写给 AI。出了问题，找到是哪一步掉链子，别乱改。**\n\n## 动手试试\n\n选一个你想表达的感觉（比如\"期待\"\"尴尬\"\"刚睡醒\"），用上面的表格填一遍六个问题。然后为第 3 步\"落点\"想出三种不同的机制——一种用身体，一种用空间，一种用声音。\n\n下一步，看[三种稿子](/foundations/03-three-drafts.md)，学习怎么把这六步变成自然的文字。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"foundations-02-six-layer-method-section-0","title":"问题在哪里"},{"id":"foundations-02-six-layer-method-section-1","title":"六个问题"},{"id":"foundations-02-six-layer-method-section-2","title":"不是六份表格，是六次检查"},{"id":"foundations-02-six-layer-method-section-3","title":"同一个感觉，至少想三条路"},{"id":"foundations-02-six-layer-method-section-4","title":"哪些地方要给证据，哪些地方可以放着"},{"id":"foundations-02-six-layer-method-section-5","title":"五种常见的掉链子"},{"id":"foundations-02-six-layer-method-section-6","title":"一句话记住"},{"id":"foundations-02-six-layer-method-section-7","title":"动手试试"}]},{"id":"foundations/03-three-drafts","path":"foundations/03-three-drafts.md","title":"03｜三种稿子：给自己看的、给团队看的、给 AI 看的","description":"诗意和工程别挤在一段话里。分成三种稿子，各干各的活。","type":"Framework","group":"foundations","tags":["写作方法","感受稿","执行稿"],"html":"<h1>03｜三种稿子：给自己看的、给团队看的、给 AI 看的<\/h1>\n<h2 id=\"foundations-03-three-drafts-section-0\">问题在哪里<\/h2>\n<p>很多人写提示词时，会把所有东西塞进一段话：<\/p>\n<blockquote>\n<p>她的高兴像一封终于拆开的信，纸页已经摊平，手指却还按着那道旧折痕。她坐在窗边，午后暖光，中景，35mm，8 秒，她看完手机后笑了，摄影机不动，保持首帧的人物和场景，高清，真实。<\/p>\n<\/blockquote>\n<p>这段话里有比喻、有情绪分析、有镜头参数、有对 AI 的指令。它们互相干扰。AI 可能真的去生成一封信；你自己也不知道哪句是重点。<\/p>\n<p>解决办法很简单：<strong>分成三种稿子，各写各的。<\/strong><\/p>\n<h2 id=\"foundations-03-three-drafts-section-1\">第一种：感受稿——给自己看的<\/h2>\n<p>写\"这应该像什么\"。可以用比喻，可以有矛盾的感受，不用解释怎么执行。<\/p>\n<blockquote>\n<p>她的高兴像一封终于拆开的信，纸页已经摊平，手指却还按着那道旧折痕。<\/p>\n<\/blockquote>\n<p>这句话不会交给 AI。它的作用是帮你抓住感觉：<strong>释放了，但还留着一点旧习惯。<\/strong><\/p>\n<h2 id=\"foundations-03-three-drafts-section-2\">第二种：创作说明——给团队看的<\/h2>\n<p>写\"我们准备怎么表现\"。从比喻里挑出真正有用的关系，而不是把信、纸、折痕全搬进画面。<\/p>\n<blockquote>\n<p>她收到好消息，第一反应不是跳起来，而是再确认一遍。笑先从眼睛里出来，然后才敢抬头看对方。保留一点\"以前不敢相信\"的习惯，但这一刻的高兴是实在的。<\/p>\n<\/blockquote>\n<p>这段话给导演、给美术、给配音看，大家知道要往哪个方向做。它也不一定全部交给 AI。<\/p>\n<h2 id=\"foundations-03-three-drafts-section-3\">第三种：执行稿——给 AI 看的<\/h2>\n<p>只写这次任务需要的东西。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">保留首帧里的女子、座位和桌边机位。她看完手机上的消息，停一下，又快速看了一眼；随后抬头望向画面右侧的朋友，笑容自然展开。握着手机的手不再那么紧。摄影机留在原地，给她完成这次反应的时间。整体明亮、亲近，没有故意憋着的笑。\n<\/code><\/pre>\n<p>这里没有信，没有折痕。比喻提供的\"释放之后还留一点旧习惯\"，变成了\"重复确认\"和\"手部力度变化\"。<strong>这个翻译过程，就是这本书说的通感。<\/strong><\/p>\n<h2 id=\"foundations-03-three-drafts-section-4\">创作说明不必全部塞给 AI<\/h2>\n<p>\"她经历过三次失败，所以这次终于愿意相信别人\"——这句话帮团队理解人物。但如果这个镜头只需要看到她把钥匙交出去，执行稿就不用复述三次失败。<\/p>\n<p>AI 会不会从背景故事里受益？要看具体任务，得试。但有一点是确定的：<strong>观众不会因为你在提示词里写过，就自动知道她经历过什么。<\/strong><\/p>\n<p>反过来，也别把所有情境都删光。有时\"她不是忘了回答，而是在等他自己意识到说错话了\"，比十条眉眼描述更有方向。<strong>优先留下那些能改变动作、节奏或语气的背景。<\/strong><\/p>\n<h2 id=\"foundations-03-three-drafts-section-5\">第四种东西：真实的设置，另放<\/h2>\n<p>画幅比例、输出时长、分辨率、参考图绑定到哪个位置、蒙版、要不要生成音频——这些是<strong>真实的执行设置<\/strong>。<\/p>\n<p>在文字里写\"4K、八秒、用同一张图\"，不等于设置已经生效。要在工具的界面或接口里真正设好。创作说明可以写目标，提交前在真实的地方落实。<\/p>\n<p>同理，\"50mm 镜头的观看感\"不等于 AI 真的模拟了一个 50mm 镜头。需要精确几何时，去用三维软件或实拍；文字描述只能给方向，它不是渲染器。<\/p>\n<h2 id=\"foundations-03-three-drafts-section-6\">短，也可以完整<\/h2>\n<p>一个已经确定了机位和人物的首帧，执行稿只需要：<\/p>\n<blockquote>\n<p>她听到门锁转动，手里的杯子停在半空。没有马上回头。<\/p>\n<\/blockquote>\n<p>刺激（门锁声）、动作（杯子停住）、未完成的反应（没回头）——一个小结构已经成立。不要为了显得专业，再补上全身描述、衣服、八种灯光和五种运镜。<\/p>\n<p>一个还没有任何图的文字生图任务，则需要写更多：谁、在哪、谁是主角、什么材质、光从哪来、从哪里看。<\/p>\n<p><strong>长度取决于现有信息缺什么，不取决于专家\"应该\"写多少。<\/strong><\/p>\n<h2 id=\"foundations-03-three-drafts-section-7\">改稿时问三个问题<\/h2>\n<ol>\n<li>我能在脑子里看到这个画面吗？<\/li>\n<li>重要的关系有没有写反？（比如把\"走近\"写成了\"走开\"）<\/li>\n<li>多余的修饰有没有挤掉主要动作？<\/li>\n<\/ol>\n<p>具体怎么删、怎么改，看<a href=\"#/language/06-rewrite-clinic\">改写诊所<\/a>。<\/p>\n<h2 id=\"foundations-03-three-drafts-section-8\">一句话记住<\/h2>\n<p><strong>感受稿可以是诗，执行稿必须是说明书。别让它们挤在同一段话里。<\/strong><\/p>\n<h2 id=\"foundations-03-three-drafts-section-9\">动手试试<\/h2>\n<p>拿一个你想表达的情绪，先写一句感受稿（允许用比喻），再写三行创作说明（不用比喻，说清楚怎么表现），最后写一段执行稿（只写这个镜头需要的）。对比三段，看看比喻里的东西是怎么一步步变成动作的。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-image\">图像工具的官方说法<\/a>\n[3] <a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/p>\n<\/details>","text":"# 03｜三种稿子：给自己看的、给团队看的、给 AI 看的\n\n## 问题在哪里\n\n很多人写提示词时，会把所有东西塞进一段话：\n\n> 她的高兴像一封终于拆开的信，纸页已经摊平，手指却还按着那道旧折痕。她坐在窗边，午后暖光，中景，35mm，8 秒，她看完手机后笑了，摄影机不动，保持首帧的人物和场景，高清，真实。\n\n这段话里有比喻、有情绪分析、有镜头参数、有对 AI 的指令。它们互相干扰。AI 可能真的去生成一封信；你自己也不知道哪句是重点。\n\n解决办法很简单：**分成三种稿子，各写各的。**\n\n## 第一种：感受稿——给自己看的\n\n写\"这应该像什么\"。可以用比喻，可以有矛盾的感受，不用解释怎么执行。\n\n> 她的高兴像一封终于拆开的信，纸页已经摊平，手指却还按着那道旧折痕。\n\n这句话不会交给 AI。它的作用是帮你抓住感觉：**释放了，但还留着一点旧习惯。**\n\n## 第二种：创作说明——给团队看的\n\n写\"我们准备怎么表现\"。从比喻里挑出真正有用的关系，而不是把信、纸、折痕全搬进画面。\n\n> 她收到好消息，第一反应不是跳起来，而是再确认一遍。笑先从眼睛里出来，然后才敢抬头看对方。保留一点\"以前不敢相信\"的习惯，但这一刻的高兴是实在的。\n\n这段话给导演、给美术、给配音看，大家知道要往哪个方向做。它也不一定全部交给 AI。\n\n## 第三种：执行稿——给 AI 看的\n\n只写这次任务需要的东西。\n\n```text\n保留首帧里的女子、座位和桌边机位。她看完手机上的消息，停一下，又快速看了一眼；随后抬头望向画面右侧的朋友，笑容自然展开。握着手机的手不再那么紧。摄影机留在原地，给她完成这次反应的时间。整体明亮、亲近，没有故意憋着的笑。\n```\n\n这里没有信，没有折痕。比喻提供的\"释放之后还留一点旧习惯\"，变成了\"重复确认\"和\"手部力度变化\"。**这个翻译过程，就是这本书说的通感。**\n\n## 创作说明不必全部塞给 AI\n\n\"她经历过三次失败，所以这次终于愿意相信别人\"——这句话帮团队理解人物。但如果这个镜头只需要看到她把钥匙交出去，执行稿就不用复述三次失败。\n\nAI 会不会从背景故事里受益？要看具体任务，得试。但有一点是确定的：**观众不会因为你在提示词里写过，就自动知道她经历过什么。**\n\n反过来，也别把所有情境都删光。有时\"她不是忘了回答，而是在等他自己意识到说错话了\"，比十条眉眼描述更有方向。**优先留下那些能改变动作、节奏或语气的背景。**\n\n## 第四种东西：真实的设置，另放\n\n画幅比例、输出时长、分辨率、参考图绑定到哪个位置、蒙版、要不要生成音频——这些是**真实的执行设置**。\n\n在文字里写\"4K、八秒、用同一张图\"，不等于设置已经生效。要在工具的界面或接口里真正设好。创作说明可以写目标，提交前在真实的地方落实。\n\n同理，\"50mm 镜头的观看感\"不等于 AI 真的模拟了一个 50mm 镜头。需要精确几何时，去用三维软件或实拍；文字描述只能给方向，它不是渲染器。\n\n## 短，也可以完整\n\n一个已经确定了机位和人物的首帧，执行稿只需要：\n\n> 她听到门锁转动，手里的杯子停在半空。没有马上回头。\n\n刺激（门锁声）、动作（杯子停住）、未完成的反应（没回头）——一个小结构已经成立。不要为了显得专业，再补上全身描述、衣服、八种灯光和五种运镜。\n\n一个还没有任何图的文字生图任务，则需要写更多：谁、在哪、谁是主角、什么材质、光从哪来、从哪里看。\n\n**长度取决于现有信息缺什么，不取决于专家\"应该\"写多少。**\n\n## 改稿时问三个问题\n\n1. 我能在脑子里看到这个画面吗？\n2. 重要的关系有没有写反？（比如把\"走近\"写成了\"走开\"）\n3. 多余的修饰有没有挤掉主要动作？\n\n具体怎么删、怎么改，看[改写诊所](/language/06-rewrite-clinic.md)。\n\n## 一句话记住\n\n**感受稿可以是诗，执行稿必须是说明书。别让它们挤在同一段话里。**\n\n## 动手试试\n\n拿一个你想表达的情绪，先写一句感受稿（允许用比喻），再写三行创作说明（不用比喻，说清楚怎么表现），最后写一段执行稿（只写这个镜头需要的）。对比三段，看看比喻里的东西是怎么一步步变成动作的。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [图像工具的官方说法](/references/official-image.md)\n[3] [视频工具的官方说法](/references/official-video.md)","toc":[{"id":"foundations-03-three-drafts-section-0","title":"问题在哪里"},{"id":"foundations-03-three-drafts-section-1","title":"第一种：感受稿——给自己看的"},{"id":"foundations-03-three-drafts-section-2","title":"第二种：创作说明——给团队看的"},{"id":"foundations-03-three-drafts-section-3","title":"第三种：执行稿——给 AI 看的"},{"id":"foundations-03-three-drafts-section-4","title":"创作说明不必全部塞给 AI"},{"id":"foundations-03-three-drafts-section-5","title":"第四种东西：真实的设置，另放"},{"id":"foundations-03-three-drafts-section-6","title":"短，也可以完整"},{"id":"foundations-03-three-drafts-section-7","title":"改稿时问三个问题"},{"id":"foundations-03-three-drafts-section-8","title":"一句话记住"},{"id":"foundations-03-three-drafts-section-9","title":"动手试试"}]},{"id":"foundations/04-freedom-and-constraints","path":"foundations/04-freedom-and-constraints.md","title":"04｜哪些必须说死，哪些可以放手：分配确定性","description":"写提示词的专业性，不在于把每个细节都锁住，而在于知道锁什么、放什么。","type":"Framework","group":"foundations","tags":["约束","留白","迭代"],"html":"<h1>04｜哪些必须说死，哪些可以放手：分配确定性<\/h1>\n<h2 id=\"foundations-04-freedom-and-constraints-section-0\">问题在哪里<\/h2>\n<p>AI 生成有随机性。很多人的反应是：<strong>把所有东西都写死<\/strong>。<\/p>\n<blockquote>\n<p>她的头发必须是这样，她的手必须放在这里，她的嘴角必须上扬 15 度，衣服不能有一丝褶皱，光线必须……<\/p>\n<\/blockquote>\n<p>结果呢？要么 AI 根本做不到，要么做出来像塑料模特。而真正重要的东西——比如\"她把哪份文件拿走了\"——反而因为被埋在一堆细节里，没被照顾到。<\/p>\n<p><strong>随机性不是敌人。放错地方的随机性才是。<\/strong> 头发怎么飘可以有惊喜，产品名字怎么拼通常不可以；人物可以用不同方式停下来，但不能把\"走近\"生成成\"走开\"。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-1\">把要求分成三堆<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>哪一堆<\/th>\n<th>例子<\/th>\n<th>怎么处理<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>必须守住<\/strong><\/td>\n<td>这是谁、哪瓶产品、谁拿着道具、结尾发生了什么<\/td>\n<td>说清楚，必要时用专门的参考图或后期保证，验收时第一个查<\/td>\n<\/tr>\n<tr>\n<td><strong>值得引导<\/strong><\/td>\n<td>亲近还是疏离、动作重还是轻、光从哪边来<\/td>\n<td>给少量明确的线索，允许 AI 有一点差异<\/td>\n<\/tr>\n<tr>\n<td><strong>可以放手<\/strong><\/td>\n<td>自然的眨眼、衣服的细碎褶皱、路人的小动作<\/td>\n<td>一般不用规定，让它自己长<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>这三堆不是 AI 内部的什么权重系统，也不是给每句话打隐藏优先级。它只是你做取舍时的草图。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-2\">复杂的情绪可以并存，矛盾的物理命令要拆开<\/h2>\n<p><strong>情绪上的矛盾是好东西。<\/strong> \"她终于自由了，却舍不得离开\"——这是表演的层次。写成\"脚已经迈出门，手还搭在门框上\"，就有了两个不同的落点，一个身体承担一半。<\/p>\n<p><strong>观看上的矛盾要补条件。<\/strong> \"她全程背对镜头，同时观众清楚看见她嘴角的笑\"——这需要一面镜子、一次转身，或者换机位。不补条件，AI 只能二选一，或者两个都做不好。<\/p>\n<p><strong>执行上的矛盾必须删掉一个。<\/strong> \"镜头绝对固定，同时向前平移绕到背后\"——这是自相矛盾。别指望 AI 猜你更在意哪个。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-3\">\"严格\"\"必须\"\"绝对一致\"不是锁<\/h2>\n<p>写\"严格保持人物一致\"\"绝对不要变脸\"\"必须完全相同\"——这些词可以清楚地传达你的要求，但它们<strong>不是硬约束<\/strong>。你写十遍\"不要变脸\"，也没有给 AI 增加任何关于这张脸的新信息。<\/p>\n<p>真正的控制手段还包括：参考图的质量、选对任务模式、参数设置、从多个结果里挑选、剪辑、人工审核。有些工具的官方文档也明确说，提示词是\"指导\"，不是\"保证\"（见<a href=\"#/references/official-video\">视频工具的官方说法<\/a>）。<\/p>\n<p>需要更确定的结果时，<strong>按成本从低到高来<\/strong>：<\/p>\n<ol>\n<li>先删掉文字里的矛盾<\/li>\n<li>再补一张有效的参考图<\/li>\n<li>再把一次任务缩小（比如只生成三秒，只做一个动作）<\/li>\n<li>再用局部修改<\/li>\n<li>最后才考虑用三维软件或合成<\/li>\n<\/ol>\n<p>不要一上来就搭一套大流程。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-4\">开放度随阶段变化<\/h2>\n<p><strong>探索阶段<\/strong>，可以说\"给我三种完全不同的清爽\"，允许出现你自己都没想到的画面。<\/p>\n<p><strong>选定方案后<\/strong>，可以说\"只比较开门前后声音的远近变化，不改人物和结局\"。<\/p>\n<p><strong>交付阶段<\/strong>更窄：字标、产品比例、镜头长度、声音起落都要一一核对。<\/p>\n<p>太早锁死，探索就变成了填色游戏。太晚还在开放，每条片子都会变成不同的项目。<\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-5\">一个反例：太完美的\"自然\"<\/h2>\n<blockquote>\n<p>自然、不经意、绝对优雅，始终最美角度，发丝不能乱，皮肤不能有阴影，笑容不能变化。<\/p>\n<\/blockquote>\n<p>这些要求合在一起，出来的是<strong>展示<\/strong>，不是<strong>生活<\/strong>。<\/p>\n<p>如果项目本来就是高控制的美妆大片，展示没有错。错的是：一边要求可控的盛装，一边拿它跟手机随手拍的自然标准去比。<strong>先确认风格目标，再谈破绽。<\/strong><\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-6\">一句话记住<\/h2>\n<p><strong>专业不是把一切写死，而是知道哪三样必须守住、哪些值得引导、哪些放手让它长。<\/strong><\/p>\n<h2 id=\"foundations-04-freedom-and-constraints-section-7\">动手试试<\/h2>\n<p>拿一条你写过的提示词，把每个要求分到\"必须守住\"\"值得引导\"\"可以放手\"三堆里。你大概会发现，一半以上的字都花在了\"可以放手\"那一堆——把它们删掉，看看剩下的是不是更清楚了。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/p>\n<\/details>","text":"# 04｜哪些必须说死，哪些可以放手：分配确定性\n\n## 问题在哪里\n\nAI 生成有随机性。很多人的反应是：**把所有东西都写死**。\n\n> 她的头发必须是这样，她的手必须放在这里，她的嘴角必须上扬 15 度，衣服不能有一丝褶皱，光线必须……\n\n结果呢？要么 AI 根本做不到，要么做出来像塑料模特。而真正重要的东西——比如\"她把哪份文件拿走了\"——反而因为被埋在一堆细节里，没被照顾到。\n\n**随机性不是敌人。放错地方的随机性才是。** 头发怎么飘可以有惊喜，产品名字怎么拼通常不可以；人物可以用不同方式停下来，但不能把\"走近\"生成成\"走开\"。\n\n## 把要求分成三堆\n\n| 哪一堆 | 例子 | 怎么处理 |\n| --- | --- | --- |\n| **必须守住** | 这是谁、哪瓶产品、谁拿着道具、结尾发生了什么 | 说清楚，必要时用专门的参考图或后期保证，验收时第一个查 |\n| **值得引导** | 亲近还是疏离、动作重还是轻、光从哪边来 | 给少量明确的线索，允许 AI 有一点差异 |\n| **可以放手** | 自然的眨眼、衣服的细碎褶皱、路人的小动作 | 一般不用规定，让它自己长 |\n\n这三堆不是 AI 内部的什么权重系统，也不是给每句话打隐藏优先级。它只是你做取舍时的草图。\n\n## 复杂的情绪可以并存，矛盾的物理命令要拆开\n\n**情绪上的矛盾是好东西。** \"她终于自由了，却舍不得离开\"——这是表演的层次。写成\"脚已经迈出门，手还搭在门框上\"，就有了两个不同的落点，一个身体承担一半。\n\n**观看上的矛盾要补条件。** \"她全程背对镜头，同时观众清楚看见她嘴角的笑\"——这需要一面镜子、一次转身，或者换机位。不补条件，AI 只能二选一，或者两个都做不好。\n\n**执行上的矛盾必须删掉一个。** \"镜头绝对固定，同时向前平移绕到背后\"——这是自相矛盾。别指望 AI 猜你更在意哪个。\n\n## \"严格\"\"必须\"\"绝对一致\"不是锁\n\n写\"严格保持人物一致\"\"绝对不要变脸\"\"必须完全相同\"——这些词可以清楚地传达你的要求，但它们**不是硬约束**。你写十遍\"不要变脸\"，也没有给 AI 增加任何关于这张脸的新信息。\n\n真正的控制手段还包括：参考图的质量、选对任务模式、参数设置、从多个结果里挑选、剪辑、人工审核。有些工具的官方文档也明确说，提示词是\"指导\"，不是\"保证\"（见[视频工具的官方说法](/references/official-video.md)）。\n\n需要更确定的结果时，**按成本从低到高来**：\n\n1. 先删掉文字里的矛盾\n2. 再补一张有效的参考图\n3. 再把一次任务缩小（比如只生成三秒，只做一个动作）\n4. 再用局部修改\n5. 最后才考虑用三维软件或合成\n\n不要一上来就搭一套大流程。\n\n## 开放度随阶段变化\n\n**探索阶段**，可以说\"给我三种完全不同的清爽\"，允许出现你自己都没想到的画面。\n\n**选定方案后**，可以说\"只比较开门前后声音的远近变化，不改人物和结局\"。\n\n**交付阶段**更窄：字标、产品比例、镜头长度、声音起落都要一一核对。\n\n太早锁死，探索就变成了填色游戏。太晚还在开放，每条片子都会变成不同的项目。\n\n## 一个反例：太完美的\"自然\"\n\n> 自然、不经意、绝对优雅，始终最美角度，发丝不能乱，皮肤不能有阴影，笑容不能变化。\n\n这些要求合在一起，出来的是**展示**，不是**生活**。\n\n如果项目本来就是高控制的美妆大片，展示没有错。错的是：一边要求可控的盛装，一边拿它跟手机随手拍的自然标准去比。**先确认风格目标，再谈破绽。**\n\n## 一句话记住\n\n**专业不是把一切写死，而是知道哪三样必须守住、哪些值得引导、哪些放手让它长。**\n\n## 动手试试\n\n拿一条你写过的提示词，把每个要求分到\"必须守住\"\"值得引导\"\"可以放手\"三堆里。你大概会发现，一半以上的字都花在了\"可以放手\"那一堆——把它们删掉，看看剩下的是不是更清楚了。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [视频工具的官方说法](/references/official-video.md)","toc":[{"id":"foundations-04-freedom-and-constraints-section-0","title":"问题在哪里"},{"id":"foundations-04-freedom-and-constraints-section-1","title":"把要求分成三堆"},{"id":"foundations-04-freedom-and-constraints-section-2","title":"复杂的情绪可以并存，矛盾的物理命令要拆开"},{"id":"foundations-04-freedom-and-constraints-section-3","title":"\"严格\"\"必须\"\"绝对一致\"不是锁"},{"id":"foundations-04-freedom-and-constraints-section-4","title":"开放度随阶段变化"},{"id":"foundations-04-freedom-and-constraints-section-5","title":"一个反例：太完美的\"自然\""},{"id":"foundations-04-freedom-and-constraints-section-6","title":"一句话记住"},{"id":"foundations-04-freedom-and-constraints-section-7","title":"动手试试"}]},{"id":"foundations/05-how-to-know","path":"foundations/05-how-to-know.md","title":"05｜别被自己的提示词骗了：怎么判断一句话真的有用","description":"写得漂亮不等于有效。区分\"我看见了什么\"\"我以为什么\"\"工具承诺了什么\"\"实际测出了什么\"。","type":"Framework","group":"foundations","tags":["判断","证据","评价"],"html":"<h1>05｜别被自己的提示词骗了：怎么判断一句话真的有用<\/h1>\n<h2 id=\"foundations-05-how-to-know-section-0\">问题在哪里<\/h2>\n<p>你花了半小时写了一段很讲究的提示词，生成出来的东西也还不错。于是你觉得：这段提示词很有效，以后都这么写。<\/p>\n<p>但你其实不知道：是哪句话起了作用？还是碰巧这次运气好？换个模型还管用吗？<\/p>\n<p>这一章教你几个简单的检查，避免被自己的努力骗了。<\/p>\n<h2 id=\"foundations-05-how-to-know-section-1\">四句话，可信程度完全不同<\/h2>\n<p>看这四句话：<\/p>\n<ol>\n<li>\"教程截图里写着'低角度'。\" —— 这只说明截图里有这三个字。<\/li>\n<li>\"这条视频的机位比较低。\" —— 这需要你真的看过视频。<\/li>\n<li>\"低角度让这段更有压迫感。\" —— 这是结合上下文的创作判断，可以讨论。<\/li>\n<li>\"低角度普遍能提高某模型的真实感。\" —— 这需要一套控制变量的对比实验，不能从一个剪辑过的教程推出来。<\/li>\n<\/ol>\n<p>很多网上流传的\"提示词技巧\"，是把第 1 句或第 3 句，说成了第 4 句。<\/p>\n<p><strong>这本书自己的话也分三种<\/strong>：从教程里提炼的经验；有官方文档或研究原文出处的技术事实；本书自己综合设计的方法和例子。第三种是给你试用的，不是已经验证过的定律。这本书没有运行过生成实验，也不会给你编成功率。<\/p>\n<h2 id=\"foundations-05-how-to-know-section-2\">别把\"看图编故事\"当成\"读出真实内心\"<\/h2>\n<p>照片里一位女子低头扶着杯沿。你可以读成紧张、疲惫、专注，或者只是杯子太烫。<strong>画面没有告诉你她一定失恋了。<\/strong><\/p>\n<p>创作时，你可以明确说：\"我们把它设定为她在犹豫。\"分析已有素材时，应该说：\"这个细节可能被读成犹豫。\"这是两种不同的工作，别混在一起。<\/p>\n<p>同理，教程说某张图\"高级\"、某个模型\"很火\"，那是审美评价和经验背景，不是客观属性。<\/p>\n<h2 id=\"foundations-05-how-to-know-section-3\">三种问题，分开判<\/h2>\n<p>看一条生成结果时，把问题分成三类记录：<\/p>\n<p><strong>内容对不对<\/strong>：是不是同一个人？动作完成了没有？产品标签对不对？<\/p>\n<p><strong>表达成立吗<\/strong>：本来要轻快，出来是不是像焦躁？本来要不动声色，是不是变成了完全没反应？<\/p>\n<p><strong>能不能用<\/strong>：时长够剪吗？和前后镜头接得上吗？声音能单独处理吗？<\/p>\n<p>一条视频可以技术上很干净，但情绪完全错了；也可以情绪很精彩，但有一小段需要修。<strong>分开记，别用一句\"AI 味很重\"把所有问题抹平。<\/strong><\/p>\n<h2 id=\"foundations-05-how-to-know-section-4\">这本书怎么借理论<\/h2>\n<p>这本书借了一些现成的研究：跨感官研究（人怎么把声音和颜色联系起来）、观看研究（观众的眼睛怎么在画面里移动）、摄影知识（什么样的光是不可能的）。<\/p>\n<p>但要说清楚：<strong>这些研究没有一个直接证明\"六个问题\"会让某个 AI 模型表现更好。<\/strong> 它们帮你提出更好的问题，帮你避免不可能的要求，仅此而已。<\/p>\n<p>所以，把这本书的方法当成<strong>可以反驳、可以积累的工作假设<\/strong>。用过之后，记录：在哪类内容里有效，在哪类模型里失效。不断删掉不起作用的条款，比不断给提示词加\"高级机制\"更重要。<\/p>\n<h2 id=\"foundations-05-how-to-know-section-5\">一句话记住<\/h2>\n<p><strong>\"我这样写了\"不等于\"这样写有用\"。分清看见的、以为的、工具承诺的、实测的。记录失败比收藏成功更值钱。<\/strong><\/p>\n<h2 id=\"foundations-05-how-to-know-section-6\">动手试试<\/h2>\n<p>找一条你觉得\"很有效\"的提示词。把它拆成几个部分，然后问：如果我删掉这一部分，结果会变差吗？我怎么知道？如果答案是\"不知道\"，那这部分就还没被验证过。<\/p>\n<p>具体怎么做对比、怎么修，看<a href=\"#/workflows/07-evaluate-repair\">评价与修复<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a>\n[3] <a href=\"#/references/theory\">借用了哪些理论，借到什么程度<\/a><\/p>\n<\/details>","text":"# 05｜别被自己的提示词骗了：怎么判断一句话真的有用\n\n## 问题在哪里\n\n你花了半小时写了一段很讲究的提示词，生成出来的东西也还不错。于是你觉得：这段提示词很有效，以后都这么写。\n\n但你其实不知道：是哪句话起了作用？还是碰巧这次运气好？换个模型还管用吗？\n\n这一章教你几个简单的检查，避免被自己的努力骗了。\n\n## 四句话，可信程度完全不同\n\n看这四句话：\n\n1. \"教程截图里写着'低角度'。\" —— 这只说明截图里有这三个字。\n2. \"这条视频的机位比较低。\" —— 这需要你真的看过视频。\n3. \"低角度让这段更有压迫感。\" —— 这是结合上下文的创作判断，可以讨论。\n4. \"低角度普遍能提高某模型的真实感。\" —— 这需要一套控制变量的对比实验，不能从一个剪辑过的教程推出来。\n\n很多网上流传的\"提示词技巧\"，是把第 1 句或第 3 句，说成了第 4 句。\n\n**这本书自己的话也分三种**：从教程里提炼的经验；有官方文档或研究原文出处的技术事实；本书自己综合设计的方法和例子。第三种是给你试用的，不是已经验证过的定律。这本书没有运行过生成实验，也不会给你编成功率。\n\n## 别把\"看图编故事\"当成\"读出真实内心\"\n\n照片里一位女子低头扶着杯沿。你可以读成紧张、疲惫、专注，或者只是杯子太烫。**画面没有告诉你她一定失恋了。**\n\n创作时，你可以明确说：\"我们把它设定为她在犹豫。\"分析已有素材时，应该说：\"这个细节可能被读成犹豫。\"这是两种不同的工作，别混在一起。\n\n同理，教程说某张图\"高级\"、某个模型\"很火\"，那是审美评价和经验背景，不是客观属性。\n\n## 三种问题，分开判\n\n看一条生成结果时，把问题分成三类记录：\n\n**内容对不对**：是不是同一个人？动作完成了没有？产品标签对不对？\n\n**表达成立吗**：本来要轻快，出来是不是像焦躁？本来要不动声色，是不是变成了完全没反应？\n\n**能不能用**：时长够剪吗？和前后镜头接得上吗？声音能单独处理吗？\n\n一条视频可以技术上很干净，但情绪完全错了；也可以情绪很精彩，但有一小段需要修。**分开记，别用一句\"AI 味很重\"把所有问题抹平。**\n\n## 这本书怎么借理论\n\n这本书借了一些现成的研究：跨感官研究（人怎么把声音和颜色联系起来）、观看研究（观众的眼睛怎么在画面里移动）、摄影知识（什么样的光是不可能的）。\n\n但要说清楚：**这些研究没有一个直接证明\"六个问题\"会让某个 AI 模型表现更好。** 它们帮你提出更好的问题，帮你避免不可能的要求，仅此而已。\n\n所以，把这本书的方法当成**可以反驳、可以积累的工作假设**。用过之后，记录：在哪类内容里有效，在哪类模型里失效。不断删掉不起作用的条款，比不断给提示词加\"高级机制\"更重要。\n\n## 一句话记住\n\n**\"我这样写了\"不等于\"这样写有用\"。分清看见的、以为的、工具承诺的、实测的。记录失败比收藏成功更值钱。**\n\n## 动手试试\n\n找一条你觉得\"很有效\"的提示词。把它拆成几个部分，然后问：如果我删掉这一部分，结果会变差吗？我怎么知道？如果答案是\"不知道\"，那这部分就还没被验证过。\n\n具体怎么做对比、怎么修，看[评价与修复](/workflows/07-evaluate-repair.md)。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)\n[3] [借用了哪些理论，借到什么程度](/references/theory.md)","toc":[{"id":"foundations-05-how-to-know-section-0","title":"问题在哪里"},{"id":"foundations-05-how-to-know-section-1","title":"四句话，可信程度完全不同"},{"id":"foundations-05-how-to-know-section-2","title":"别把\"看图编故事\"当成\"读出真实内心\""},{"id":"foundations-05-how-to-know-section-3","title":"三种问题，分开判"},{"id":"foundations-05-how-to-know-section-4","title":"这本书怎么借理论"},{"id":"foundations-05-how-to-know-section-5","title":"一句话记住"},{"id":"foundations-05-how-to-know-section-6","title":"动手试试"}]},{"id":"language/index","path":"language/index.md","title":"II · 通感与表达","description":"","type":"Index","group":"language","tags":[],"html":"<h1>II · 通感与表达<\/h1>\n<p>这一部分教你把情绪、氛围和联想，变成有主次的、AI 能用的人话。是全书最核心的技巧部分。<\/p>\n<ul>\n<li><p><a href=\"#/language/01-sensory-translation\">06｜通感怎么用：借一种感觉的形状，去描述另一种感觉<\/a> — 通感是搬关系，不是搬东西。<\/p>\n<\/li>\n<li><p><a href=\"#/language/02-association-workshop\">07｜联想工作坊：怎么想出不落俗套的点子<\/a> — 别换同义词，换问题。六条路径。<\/p>\n<\/li>\n<li><p><a href=\"#/language/03-scene-grammar\">08｜用人话组织画面：名词之外，还有动词、介词和连词<\/a> — 每种词各干各的活。选对动词胜过三个形容词。<\/p>\n<\/li>\n<li><p><a href=\"#/language/04-emotion-atlas\">09｜情绪图谱：16 种情绪，每种都不止一种身体<\/a> — 情绪是身体在做什么，不是脸在摆什么。<\/p>\n<\/li>\n<li><p><a href=\"#/language/05-atmosphere-atlas\">10｜氛围图谱：16 种抽象感觉，各自可以落在什么材料上<\/a> — 氛围是关系，不是颜色。<\/p>\n<\/li>\n<li><p><a href=\"#/language/06-rewrite-clinic\">11｜改写诊所：12 组\"写成这样 → 改成这样\"<\/a> — 三种常见病和对照改法。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# II · 通感与表达\n\n这一部分教你把情绪、氛围和联想，变成有主次的、AI 能用的人话。是全书最核心的技巧部分。\n\n- [06｜通感怎么用：借一种感觉的形状，去描述另一种感觉](/language/01-sensory-translation.md) — 通感是搬关系，不是搬东西。\n\n- [07｜联想工作坊：怎么想出不落俗套的点子](/language/02-association-workshop.md) — 别换同义词，换问题。六条路径。\n\n- [08｜用人话组织画面：名词之外，还有动词、介词和连词](/language/03-scene-grammar.md) — 每种词各干各的活。选对动词胜过三个形容词。\n\n- [09｜情绪图谱：16 种情绪，每种都不止一种身体](/language/04-emotion-atlas.md) — 情绪是身体在做什么，不是脸在摆什么。\n\n- [10｜氛围图谱：16 种抽象感觉，各自可以落在什么材料上](/language/05-atmosphere-atlas.md) — 氛围是关系，不是颜色。\n\n- [11｜改写诊所：12 组\"写成这样 → 改成这样\"](/language/06-rewrite-clinic.md) — 三种常见病和对照改法。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"language/01-sensory-translation","path":"language/01-sensory-translation.md","title":"06｜通感怎么用：借一种感觉的形状，去描述另一种感觉","description":"通感不是堆比喻。它是把重量、温度、触感、距离、节奏这些身体经验，搬到画面和声音里，同时防止比喻被 AI 当真。","type":"Technique","group":"language","tags":["通感","比喻","声音","材质"],"html":"<h1>06｜通感怎么用：借一种感觉的形状，去描述另一种感觉<\/h1>\n<blockquote>\n<p>\"这段配乐像薄荷\"——很好，但薄荷不是一种乐器。你得继续问：你要的是入口那一下凉、清透的气味，还是吞下去之后留下的一线清醒？<\/p>\n<\/blockquote>\n<h2 id=\"language-01-sensory-translation-section-0\">什么是通感<\/h2>\n<p>语文课上学过：通感是把一种感官的感受，用另一种感官的词来描述。\"声音很甜\"\"颜色很吵\"\"这个味道很尖\"。<\/p>\n<p>在写提示词的时候，通感特别有用，因为<strong>你脑子里的感觉往往是身体的<\/strong>（凉、重、软、紧），<strong>但 AI 能生成的是画面和声音<\/strong>。你需要一座桥。<\/p>\n<p>这座桥的关键是：<strong>不要搬东西，搬关系。<\/strong> \"像薄荷\"这个比喻里，真正有用的不是薄荷这个植物，而是\"入口凉、然后清醒\"这个变化过程。你要搬的是这个过程，不是薄荷。<\/p>\n<h2 id=\"language-01-sensory-translation-section-1\">七种身体感觉，各自能变成什么<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>身体感觉<\/th>\n<th>先想象你身体的经验<\/th>\n<th>可以变成画面或声音里的什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>重量<\/td>\n<td>拎起、下坠、托住、卸下<\/td>\n<td>动作的加速度、物体的形变、低音的厚度、一个动作结束时拖多久<\/td>\n<\/tr>\n<tr>\n<td>温度<\/td>\n<td>靠近暖的东西、冷空气贴着皮肤<\/td>\n<td>局部的冷暖对比、呼吸和衣服的反应、声音是亲近的还是尖的<\/td>\n<\/tr>\n<tr>\n<td>触感<\/td>\n<td>细砂、湿绸、硬边、绒面<\/td>\n<td>画面里细节的密度、反光的边缘、摩擦声、一个音怎么起怎么落<\/td>\n<\/tr>\n<tr>\n<td>密度<\/td>\n<td>挤满、稀疏、透气、结成一团<\/td>\n<td>构图里东西之间的距离、节拍多少、几个声音叠在一起、信息出现的频率<\/td>\n<\/tr>\n<tr>\n<td>距离<\/td>\n<td>耳边、隔着墙、很远、贴着身<\/td>\n<td>声音是直接的还是有回响的、镜头位置、有没有遮挡、人和人隔多远<\/td>\n<\/tr>\n<tr>\n<td>张力<\/td>\n<td>拉住、悬着、要断没断<\/td>\n<td>没做完的动作、一直持续的音、画面重心偏一边、迟迟不落的结尾<\/td>\n<\/tr>\n<tr>\n<td>节奏<\/td>\n<td>犹豫、冲出去、弹回来、停稳<\/td>\n<td>句子怎么断、动作的节拍、剪辑的间隔、重复里的变化<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>这张表是帮你想的入口，不是字典。<\/strong> 不是\"高频音一定清爽\"\"蓝色一定冷漠\"。<\/p>\n<h2 id=\"language-01-sensory-translation-section-2\">一条完整的翻译过程<\/h2>\n<p><strong>感受稿<\/strong>：她的声音像晒过太阳、又被折起来的棉布。<\/p>\n<p>先拆：我们真正想借的是什么？——温和，不是广播那种光滑；有一点像褶皱的小停顿，但不疲惫。<\/p>\n<p><strong>创作说明<\/strong>：这是一个熟人，不急着把话说完。声音柔和、近，句子中间偶尔停一下再接上，像她还在一边整理手边的东西。<\/p>\n<p><strong>执行稿<\/strong>：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">用温和、放松的成年女声读这句话。音量适中，距离近，保留一点自然的气息，不要主持人口吻。\"回来啦\"轻轻接住对方，不做戏剧性的升调；后半句稍停一下再说，像边叠衣服边聊天。台词：\"回来啦。饭还热着。\"\n<\/code><\/pre>\n<p>注意：执行稿里<strong>没有棉布<\/strong>。不需要加布料摩擦声。比喻里的东西，可以不在作品里出现。<\/p>\n<h2 id=\"language-01-sensory-translation-section-3\">同一个比喻，两种相反的用法<\/h2>\n<p>\"玻璃感\"可以是清澈、易碎、冷硬，也可以是折射、轻脆、透明。护肤广告要的也许是薄薄的清透反光；悬疑片要的也许是杯子碰到桌面时那一声太清楚的响。<\/p>\n<p>没选定要哪一面之前，直接写\"玻璃感的情绪\"，AI 不知道，你自己也不知道该检查什么。<\/p>\n<p>\"像水\"可以是缓慢包裹，也可以是锋利地冲刷。\"像呼吸\"可以平稳舒展，也可以忽紧忽松。<strong>先问清楚是哪种动作关系，再选感官材料。<\/strong><\/p>\n<h2 id=\"language-01-sensory-translation-section-4\">一次只用一根主轴<\/h2>\n<blockquote>\n<p>丝绸般、刀锋般、奶油般、冰块般。<\/p>\n<\/blockquote>\n<p>四个比喻堆在一起，很可能只是四个漂亮的词。先选一个主轴，再留一个对照：<\/p>\n<blockquote>\n<p>画面大部分像被柔布擦过，只有瓶口留一道清楚的冷亮边。<\/p>\n<\/blockquote>\n<p>这句话有主有次。柔和锐没有互相打架，而是分给了不同的区域。<\/p>\n<h2 id=\"language-01-sensory-translation-section-5\">怎么检查翻译成功了没有<\/h2>\n<p>两步：<\/p>\n<ol>\n<li><strong>把比喻拿掉，只读执行稿。<\/strong> 还能明确知道要选什么光、什么动作、什么音色吗？能，说明翻译到位了。<\/li>\n<li><strong>把执行稿拿掉，只看成片。<\/strong> 还能感到原来想借的那个性质吗？能，说明表达成立了。<\/li>\n<\/ol>\n<p>两个都不行的时候，<strong>换一个更贴近材料的比喻<\/strong>，而不是继续加形容词。<\/p>\n<h2 id=\"language-01-sensory-translation-section-6\">一句话记住<\/h2>\n<p><strong>通感是搬关系，不是搬东西。\"像薄荷\"要搬的是\"凉然后清醒\"，不是薄荷叶。<\/strong><\/p>\n<h2 id=\"language-01-sensory-translation-section-7\">动手试试<\/h2>\n<p>写一句带比喻的感受稿（比如\"他的笑像刚开的汽水\"）。然后只用动作、声音、光线写一段执行稿，里面不许出现汽水、气泡、瓶子。检查：读执行稿的人能感到\"压力突然有了出口\"吗？<\/p>\n<p>想更开阔地构思，看<a href=\"#/language/02-association-workshop\">联想工作坊<\/a>；想直接看各种氛围怎么写，看<a href=\"#/language/05-atmosphere-atlas\">氛围图谱<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/theory\">借用了哪些理论，借到什么程度<\/a><\/p>\n<\/details>","text":"# 06｜通感怎么用：借一种感觉的形状，去描述另一种感觉\n\n> \"这段配乐像薄荷\"——很好，但薄荷不是一种乐器。你得继续问：你要的是入口那一下凉、清透的气味，还是吞下去之后留下的一线清醒？\n\n## 什么是通感\n\n语文课上学过：通感是把一种感官的感受，用另一种感官的词来描述。\"声音很甜\"\"颜色很吵\"\"这个味道很尖\"。\n\n在写提示词的时候，通感特别有用，因为**你脑子里的感觉往往是身体的**（凉、重、软、紧），**但 AI 能生成的是画面和声音**。你需要一座桥。\n\n这座桥的关键是：**不要搬东西，搬关系。** \"像薄荷\"这个比喻里，真正有用的不是薄荷这个植物，而是\"入口凉、然后清醒\"这个变化过程。你要搬的是这个过程，不是薄荷。\n\n## 七种身体感觉，各自能变成什么\n\n| 身体感觉 | 先想象你身体的经验 | 可以变成画面或声音里的什么 |\n| --- | --- | --- |\n| 重量 | 拎起、下坠、托住、卸下 | 动作的加速度、物体的形变、低音的厚度、一个动作结束时拖多久 |\n| 温度 | 靠近暖的东西、冷空气贴着皮肤 | 局部的冷暖对比、呼吸和衣服的反应、声音是亲近的还是尖的 |\n| 触感 | 细砂、湿绸、硬边、绒面 | 画面里细节的密度、反光的边缘、摩擦声、一个音怎么起怎么落 |\n| 密度 | 挤满、稀疏、透气、结成一团 | 构图里东西之间的距离、节拍多少、几个声音叠在一起、信息出现的频率 |\n| 距离 | 耳边、隔着墙、很远、贴着身 | 声音是直接的还是有回响的、镜头位置、有没有遮挡、人和人隔多远 |\n| 张力 | 拉住、悬着、要断没断 | 没做完的动作、一直持续的音、画面重心偏一边、迟迟不落的结尾 |\n| 节奏 | 犹豫、冲出去、弹回来、停稳 | 句子怎么断、动作的节拍、剪辑的间隔、重复里的变化 |\n\n**这张表是帮你想的入口，不是字典。** 不是\"高频音一定清爽\"\"蓝色一定冷漠\"。\n\n## 一条完整的翻译过程\n\n**感受稿**：她的声音像晒过太阳、又被折起来的棉布。\n\n先拆：我们真正想借的是什么？——温和，不是广播那种光滑；有一点像褶皱的小停顿，但不疲惫。\n\n**创作说明**：这是一个熟人，不急着把话说完。声音柔和、近，句子中间偶尔停一下再接上，像她还在一边整理手边的东西。\n\n**执行稿**：\n\n```text\n用温和、放松的成年女声读这句话。音量适中，距离近，保留一点自然的气息，不要主持人口吻。\"回来啦\"轻轻接住对方，不做戏剧性的升调；后半句稍停一下再说，像边叠衣服边聊天。台词：\"回来啦。饭还热着。\"\n```\n\n注意：执行稿里**没有棉布**。不需要加布料摩擦声。比喻里的东西，可以不在作品里出现。\n\n## 同一个比喻，两种相反的用法\n\n\"玻璃感\"可以是清澈、易碎、冷硬，也可以是折射、轻脆、透明。护肤广告要的也许是薄薄的清透反光；悬疑片要的也许是杯子碰到桌面时那一声太清楚的响。\n\n没选定要哪一面之前，直接写\"玻璃感的情绪\"，AI 不知道，你自己也不知道该检查什么。\n\n\"像水\"可以是缓慢包裹，也可以是锋利地冲刷。\"像呼吸\"可以平稳舒展，也可以忽紧忽松。**先问清楚是哪种动作关系，再选感官材料。**\n\n## 一次只用一根主轴\n\n> 丝绸般、刀锋般、奶油般、冰块般。\n\n四个比喻堆在一起，很可能只是四个漂亮的词。先选一个主轴，再留一个对照：\n\n> 画面大部分像被柔布擦过，只有瓶口留一道清楚的冷亮边。\n\n这句话有主有次。柔和锐没有互相打架，而是分给了不同的区域。\n\n## 怎么检查翻译成功了没有\n\n两步：\n\n1. **把比喻拿掉，只读执行稿。** 还能明确知道要选什么光、什么动作、什么音色吗？能，说明翻译到位了。\n2. **把执行稿拿掉，只看成片。** 还能感到原来想借的那个性质吗？能，说明表达成立了。\n\n两个都不行的时候，**换一个更贴近材料的比喻**，而不是继续加形容词。\n\n## 一句话记住\n\n**通感是搬关系，不是搬东西。\"像薄荷\"要搬的是\"凉然后清醒\"，不是薄荷叶。**\n\n## 动手试试\n\n写一句带比喻的感受稿（比如\"他的笑像刚开的汽水\"）。然后只用动作、声音、光线写一段执行稿，里面不许出现汽水、气泡、瓶子。检查：读执行稿的人能感到\"压力突然有了出口\"吗？\n\n想更开阔地构思，看[联想工作坊](/language/02-association-workshop.md)；想直接看各种氛围怎么写，看[氛围图谱](/language/05-atmosphere-atlas.md)。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [借用了哪些理论，借到什么程度](/references/theory.md)","toc":[{"id":"language-01-sensory-translation-section-0","title":"什么是通感"},{"id":"language-01-sensory-translation-section-1","title":"七种身体感觉，各自能变成什么"},{"id":"language-01-sensory-translation-section-2","title":"一条完整的翻译过程"},{"id":"language-01-sensory-translation-section-3","title":"同一个比喻，两种相反的用法"},{"id":"language-01-sensory-translation-section-4","title":"一次只用一根主轴"},{"id":"language-01-sensory-translation-section-5","title":"怎么检查翻译成功了没有"},{"id":"language-01-sensory-translation-section-6","title":"一句话记住"},{"id":"language-01-sensory-translation-section-7","title":"动手试试"}]},{"id":"language/02-association-workshop","path":"language/02-association-workshop.md","title":"07｜联想工作坊：怎么想出不落俗套的点子","description":"六条从生活经验里长出联想的路径。不是换同义词，是换问法。","type":"Technique","group":"language","tags":["联想","创意","生活观察"],"html":"<h1>07｜联想工作坊：怎么想出不落俗套的点子<\/h1>\n<h2 id=\"language-02-association-workshop-section-0\">问题在哪里<\/h2>\n<p>你要表现\"梦幻\"。第一反应：雾、漂浮的粒子、柔光、慢动作、星空。你要表现\"清爽\"。第一反应：冰块、水花、薄荷、蓝色。<\/p>\n<p>这些不是错的，但<strong>所有人的第一反应都一样<\/strong>，所以出来的东西也一样。<\/p>\n<p>换同义词没用。把\"梦幻\"改成\"空灵、唯美、仙气\"，创意一点没变。真正有用的是<strong>换一个问题<\/strong>：<\/p>\n<p><strong>现实里的什么经验，让你产生过这种感觉？<\/strong><\/p>\n<p>可以是泳池底晃动的阳光、深夜电梯突然停下时的广播声、隔着纱帐看见熟人的身影。材料一具体，风格才开始有自己的脾气。<\/p>\n<p>下面六条路径，不需要每次都用，挑一两条试试就好。<\/p>\n<h2 id=\"language-02-association-workshop-section-1\">路径一：从身体动作找结构<\/h2>\n<p>想表现\"释放\"，不一定要找飞鸟。松开鞋带、把紧攥的手摊开、终于能把背靠到椅子上——这些动作都有\"释放\"的结构：先紧，然后松。<\/p>\n<p>再往前一步，跨到别的媒介：画面先挤后松、音乐从密集的短音变成拉长的尾音，也是这个结构。<strong>不是每个创意都要出现人。<\/strong><\/p>\n<h2 id=\"language-02-association-workshop-section-2\">路径二：从\"没做完的事\"找故事<\/h2>\n<p>新鲜的水迹、杯子底部留下的温痕、一条只拆开一头的丝带——这些痕迹让观众感到：<strong>镜头开始之前，这个世界就已经存在了。<\/strong><\/p>\n<p>别自动把它们当成案件线索。它们也可以只是时间的气味。写出来可以是：<\/p>\n<blockquote>\n<p>桌面不乱，只在杯子刚被拿起的地方留一圈还没干的水痕。窗边那张椅子比另一张稍微往外一点。<\/p>\n<\/blockquote>\n<h2 id=\"language-02-association-workshop-section-3\">路径三：反转惯用的载体，但不反转逻辑<\/h2>\n<p>做清爽，不用冰块，用被风翻过的一页纸。做力量，不用怒吼，用一个动作完成之后，房间终于安静下来。做浪漫，不用粉色，用两个人走路时不知不觉步子一致了。<\/p>\n<p><strong>反转不比常规更高级。<\/strong> 它只是当常规方案撞脸时，多一条路。如果你的品牌需要直接、一眼看懂的清凉，冰块可能仍然是最好的。<\/p>\n<h2 id=\"language-02-association-workshop-section-4\">路径四：让两种力量碰面<\/h2>\n<p>柔软和坚定：布料很轻，但人物的重心很稳。热闹和孤独：周围一直在流动，人物没有加入。精密和有机：产品的边线很明确，水纹绕过它。<\/p>\n<p>关键是<strong>把不同的性质放在不同的东西上<\/strong>。别要求同一块布\"又厚重下坠、又无风悬浮\"——除非那正是你故意设计的超现实规则。<\/p>\n<h2 id=\"language-02-association-workshop-section-5\">路径五：从\"慢半拍\"找生命感<\/h2>\n<p>生活里的东西不是同时开始、同时结束的。人停下了，包还轻撞了一下腿。笑话讲完了，听的人先没懂，过一秒才突然笑出来。门已经关上，刚才的声音还留在脑子里。<\/p>\n<p>这条路可以用在动作、剪辑、音乐，甚至海报版式上：让一条曲线离开主体后还多延伸一点，保留运动的余味。<strong>\"慢半拍\"是一种关系，不是固定的 0.3 秒。<\/strong><\/p>\n<h2 id=\"language-02-association-workshop-section-6\">路径六：从\"看不全\"找独特的位置<\/h2>\n<p>不是\"我要拍一间漂亮的房间\"，而是\"一个刚醒的人，眼睛还没完全睁开的时候，看到这间房的哪一部分\"。<\/p>\n<p>这不是靠软件加个虚焦就能成立的。你可以选择：低的位置、有限的视野、窗帘上的一小块亮面、慢慢分辨出来的生活声音。<\/p>\n<h2 id=\"language-02-association-workshop-section-7\">一个练习：真正不同的三个方案<\/h2>\n<p>任务：表现一瓶香水的\"自在\"。<\/p>\n<p><strong>空间方案<\/strong>：室内的气流带着窗帘飘出画框，产品安静地留在原处。自在表现为：不被挤满。<\/p>\n<p><strong>动作方案<\/strong>：人物出门前改了主意，把扎紧的头发松开，但依然准时出门。自在表现为：主动选择。<\/p>\n<p><strong>材质方案<\/strong>：一条丝带接近产品时没有围住它，而是在旁边落成一道宽松的弧。自在表现为：留有余地。<\/p>\n<p>这三个方案的区别是<strong>表达机制<\/strong>，不是同一个画面换了三次背景色。选定一个之后，再用<a href=\"#/foundations/02-six-layer-method\">六个问题<\/a>补齐执行条件。<\/p>\n<h2 id=\"language-02-association-workshop-section-8\">联想最容易坏在哪<\/h2>\n<ul>\n<li>太刻意：每个物件都在解释主题，观众觉得被说教<\/li>\n<li>为新奇牺牲了辨识：产品认不出来了<\/li>\n<li>用\"他内心……\"代替看得见的线索<\/li>\n<li>把每个空镜都写成秘密<\/li>\n<li>没有明确风格，就拿写实的规则去审所有作品<\/li>\n<\/ul>\n<p>好的联想让你<strong>发现一个更贴切的选择<\/strong>。坏的联想只让说明更像诗，画面还是老样子。<\/p>\n<h2 id=\"language-02-association-workshop-section-9\">一句话记住<\/h2>\n<p><strong>别换同义词，换问题：现实里什么经验让你有过这种感觉？<\/strong><\/p>\n<h2 id=\"language-02-association-workshop-section-10\">动手试试<\/h2>\n<p>选一个被用滥的词（\"治愈\"\"高级\"\"温暖\"），禁止使用它最常见的三个画面。然后用上面六条路径中的任意两条，各想一个方案。写下每个方案的\"表达机制\"是什么。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/theory\">借用了哪些理论，借到什么程度<\/a><\/p>\n<\/details>","text":"# 07｜联想工作坊：怎么想出不落俗套的点子\n\n## 问题在哪里\n\n你要表现\"梦幻\"。第一反应：雾、漂浮的粒子、柔光、慢动作、星空。你要表现\"清爽\"。第一反应：冰块、水花、薄荷、蓝色。\n\n这些不是错的，但**所有人的第一反应都一样**，所以出来的东西也一样。\n\n换同义词没用。把\"梦幻\"改成\"空灵、唯美、仙气\"，创意一点没变。真正有用的是**换一个问题**：\n\n**现实里的什么经验，让你产生过这种感觉？**\n\n可以是泳池底晃动的阳光、深夜电梯突然停下时的广播声、隔着纱帐看见熟人的身影。材料一具体，风格才开始有自己的脾气。\n\n下面六条路径，不需要每次都用，挑一两条试试就好。\n\n## 路径一：从身体动作找结构\n\n想表现\"释放\"，不一定要找飞鸟。松开鞋带、把紧攥的手摊开、终于能把背靠到椅子上——这些动作都有\"释放\"的结构：先紧，然后松。\n\n再往前一步，跨到别的媒介：画面先挤后松、音乐从密集的短音变成拉长的尾音，也是这个结构。**不是每个创意都要出现人。**\n\n## 路径二：从\"没做完的事\"找故事\n\n新鲜的水迹、杯子底部留下的温痕、一条只拆开一头的丝带——这些痕迹让观众感到：**镜头开始之前，这个世界就已经存在了。**\n\n别自动把它们当成案件线索。它们也可以只是时间的气味。写出来可以是：\n\n> 桌面不乱，只在杯子刚被拿起的地方留一圈还没干的水痕。窗边那张椅子比另一张稍微往外一点。\n\n## 路径三：反转惯用的载体，但不反转逻辑\n\n做清爽，不用冰块，用被风翻过的一页纸。做力量，不用怒吼，用一个动作完成之后，房间终于安静下来。做浪漫，不用粉色，用两个人走路时不知不觉步子一致了。\n\n**反转不比常规更高级。** 它只是当常规方案撞脸时，多一条路。如果你的品牌需要直接、一眼看懂的清凉，冰块可能仍然是最好的。\n\n## 路径四：让两种力量碰面\n\n柔软和坚定：布料很轻，但人物的重心很稳。热闹和孤独：周围一直在流动，人物没有加入。精密和有机：产品的边线很明确，水纹绕过它。\n\n关键是**把不同的性质放在不同的东西上**。别要求同一块布\"又厚重下坠、又无风悬浮\"——除非那正是你故意设计的超现实规则。\n\n## 路径五：从\"慢半拍\"找生命感\n\n生活里的东西不是同时开始、同时结束的。人停下了，包还轻撞了一下腿。笑话讲完了，听的人先没懂，过一秒才突然笑出来。门已经关上，刚才的声音还留在脑子里。\n\n这条路可以用在动作、剪辑、音乐，甚至海报版式上：让一条曲线离开主体后还多延伸一点，保留运动的余味。**\"慢半拍\"是一种关系，不是固定的 0.3 秒。**\n\n## 路径六：从\"看不全\"找独特的位置\n\n不是\"我要拍一间漂亮的房间\"，而是\"一个刚醒的人，眼睛还没完全睁开的时候，看到这间房的哪一部分\"。\n\n这不是靠软件加个虚焦就能成立的。你可以选择：低的位置、有限的视野、窗帘上的一小块亮面、慢慢分辨出来的生活声音。\n\n## 一个练习：真正不同的三个方案\n\n任务：表现一瓶香水的\"自在\"。\n\n**空间方案**：室内的气流带着窗帘飘出画框，产品安静地留在原处。自在表现为：不被挤满。\n\n**动作方案**：人物出门前改了主意，把扎紧的头发松开，但依然准时出门。自在表现为：主动选择。\n\n**材质方案**：一条丝带接近产品时没有围住它，而是在旁边落成一道宽松的弧。自在表现为：留有余地。\n\n这三个方案的区别是**表达机制**，不是同一个画面换了三次背景色。选定一个之后，再用[六个问题](/foundations/02-six-layer-method.md)补齐执行条件。\n\n## 联想最容易坏在哪\n\n- 太刻意：每个物件都在解释主题，观众觉得被说教\n- 为新奇牺牲了辨识：产品认不出来了\n- 用\"他内心……\"代替看得见的线索\n- 把每个空镜都写成秘密\n- 没有明确风格，就拿写实的规则去审所有作品\n\n好的联想让你**发现一个更贴切的选择**。坏的联想只让说明更像诗，画面还是老样子。\n\n## 一句话记住\n\n**别换同义词，换问题：现实里什么经验让你有过这种感觉？**\n\n## 动手试试\n\n选一个被用滥的词（\"治愈\"\"高级\"\"温暖\"），禁止使用它最常见的三个画面。然后用上面六条路径中的任意两条，各想一个方案。写下每个方案的\"表达机制\"是什么。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [借用了哪些理论，借到什么程度](/references/theory.md)","toc":[{"id":"language-02-association-workshop-section-0","title":"问题在哪里"},{"id":"language-02-association-workshop-section-1","title":"路径一：从身体动作找结构"},{"id":"language-02-association-workshop-section-2","title":"路径二：从\"没做完的事\"找故事"},{"id":"language-02-association-workshop-section-3","title":"路径三：反转惯用的载体，但不反转逻辑"},{"id":"language-02-association-workshop-section-4","title":"路径四：让两种力量碰面"},{"id":"language-02-association-workshop-section-5","title":"路径五：从\"慢半拍\"找生命感"},{"id":"language-02-association-workshop-section-6","title":"路径六：从\"看不全\"找独特的位置"},{"id":"language-02-association-workshop-section-7","title":"一个练习：真正不同的三个方案"},{"id":"language-02-association-workshop-section-8","title":"联想最容易坏在哪"},{"id":"language-02-association-workshop-section-9","title":"一句话记住"},{"id":"language-02-association-workshop-section-10","title":"动手试试"}]},{"id":"language/03-scene-grammar","path":"language/03-scene-grammar.md","title":"08｜用人话组织画面：名词之外，还有动词、介词和连词","description":"一句话里的每种词都有自己的活。选对动词，常比追加\"自然真实\"有用。","type":"Technique","group":"language","tags":["自然语言","句法","关系","动作"],"html":"<h1>08｜用人话组织画面：名词之外，还有动词、介词和连词<\/h1>\n<h2 id=\"language-03-scene-grammar-section-0\">\"人话\"不是口语越多越好<\/h2>\n<blockquote>\n<p>帮我弄得高级一点，感觉你懂的，就是那种清爽又梦幻。<\/p>\n<\/blockquote>\n<p>这是人话，但信息不足。<\/p>\n<blockquote>\n<p>建立高维情绪场域并注入真实感权重。<\/p>\n<\/blockquote>\n<p>这看起来像术语，信息同样不足。<\/p>\n<p>真正有用的是：<\/p>\n<blockquote>\n<p>瓶子留在画面中间偏下。上方大片空间干净，只让一条很淡的水面反光慢慢经过墙上。清爽来自空气和间隔，不来自满屏的水珠。<\/p>\n<\/blockquote>\n<p>它有位置、有主次、有材料、有变化，还排除了一种常见的误读。<\/p>\n<h2 id=\"language-03-scene-grammar-section-1\">五种词，五种活<\/h2>\n<p><strong>名词负责\"是哪个\"<\/strong>：女孩、玻璃瓶、窗帘。必要时用名字或已经上传的参考图，避免\"她\"\"它\"在不同段落里指的不是同一个。<\/p>\n<p><strong>动词负责\"怎么样\"<\/strong>：\"拿起\"\"托起\"\"掂起\"\"拎起\"不是同一个动作。\"托起\"把重量交给手掌，\"拎起\"让东西在手下面悬着。<strong>选对动词，常常比追加\"自然真实\"四个字有用得多。<\/strong><\/p>\n<p><strong>介词负责\"在哪里\"<\/strong>：从门框后面、沿着桌边、隔着玻璃、朝画面右侧。注意分清\"画面左侧\"和\"人物的左手\"——镜头一转，它们就不一致了。<\/p>\n<p><strong>连词负责\"关系\"<\/strong>：\"因为\"\"但是\"\"直到\"\"而不是\"\"同时\"\"然后\"。\"她听到名字后才回头\"比\"她听见名字，并且回头\"更明确先后。\"手已经松开，身体却没有离开\"给了两个部位不同的状态。<\/p>\n<p><strong>省略负责\"放手\"<\/strong>：不必说明每一次呼吸、每片叶子的方向。首帧图已经确定的信息，通常不用再写一遍。<\/p>\n<h2 id=\"language-03-scene-grammar-section-2\">\"轻轻\"为什么常常不够<\/h2>\n<p>\"轻轻\"可以指：力量小、速度慢、幅度小、接触时间短、声音弱。先确定你要的是哪一种。<\/p>\n<p>\"她轻轻关门\"可以改成：<\/p>\n<blockquote>\n<p>她让门慢慢靠上门框，手一直握着把手，直到锁舌几乎无声地落下。<\/p>\n<\/blockquote>\n<p>\"他轻轻把杯子放下\"也可以完全不同：<\/p>\n<blockquote>\n<p>他动作不慢，但落杯前稍微收住了手，杯底只发出短短一声。<\/p>\n<\/blockquote>\n<p>同样是\"轻\"，节奏和性格完全不同。也不需要再拆成十段关节运动。<\/p>\n<h2 id=\"language-03-scene-grammar-section-3\">写起点和终点，中间交给 AI<\/h2>\n<p>描述\"转过身继续赶路\"：先确认起点——人物正在回望，包在右肩；再确认终点——朝站台深处走，镜头不跟。中间重心怎么转移，可以交给 AI。<\/p>\n<p>但如果是\"把戒指从左手摘下来交给别人\"，摘下、离手、交付本身就是剧情，不能只写\"她释怀了\"。<strong>关键的接触和道具状态要写清<\/strong>，具体方法见<a href=\"#/craft/03-action-blocking\">动作与调度<\/a>。<\/p>\n<h2 id=\"language-03-scene-grammar-section-4\">一段话还是分段，看任务<\/h2>\n<p>短任务，一段话更顺。参考图分工复杂，用小标题更好检查。对白按角色分开。多个镜头需要镜号或能辨认的段落。<\/p>\n<p>格式是为了阅读和工具方便，不要相信\"文字先出现所以画面先执行\"这种说法。<\/p>\n<p>英文也不会自动更专业。确实有模型专用的名词或参数时，保留它的写法；情绪和关系用你能准确判断的语言。翻译之后要重新检查：代词指对了没有、否定有没有翻反、左右对不对、声音是谁发出的。别只求句子漂亮。<\/p>\n<h2 id=\"language-03-scene-grammar-section-5\">一句话记住<\/h2>\n<p><strong>名词说是哪个，动词说怎么样，介词说在哪，连词说关系。选对一个动词，胜过三个形容词。<\/strong><\/p>\n<h2 id=\"language-03-scene-grammar-section-6\">动手试试<\/h2>\n<p>写一句\"她把东西放到桌上\"。然后换五个不同的动词（搁、扣、摆、撂、搭……），感受每个动词带来的重量、速度和情绪有什么不同。选一个最符合你想要的场景的。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-image\">图像工具的官方说法<\/a>\n[3] <a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/p>\n<\/details>","text":"# 08｜用人话组织画面：名词之外，还有动词、介词和连词\n\n## \"人话\"不是口语越多越好\n\n> 帮我弄得高级一点，感觉你懂的，就是那种清爽又梦幻。\n\n这是人话，但信息不足。\n\n> 建立高维情绪场域并注入真实感权重。\n\n这看起来像术语，信息同样不足。\n\n真正有用的是：\n\n> 瓶子留在画面中间偏下。上方大片空间干净，只让一条很淡的水面反光慢慢经过墙上。清爽来自空气和间隔，不来自满屏的水珠。\n\n它有位置、有主次、有材料、有变化，还排除了一种常见的误读。\n\n## 五种词，五种活\n\n**名词负责\"是哪个\"**：女孩、玻璃瓶、窗帘。必要时用名字或已经上传的参考图，避免\"她\"\"它\"在不同段落里指的不是同一个。\n\n**动词负责\"怎么样\"**：\"拿起\"\"托起\"\"掂起\"\"拎起\"不是同一个动作。\"托起\"把重量交给手掌，\"拎起\"让东西在手下面悬着。**选对动词，常常比追加\"自然真实\"四个字有用得多。**\n\n**介词负责\"在哪里\"**：从门框后面、沿着桌边、隔着玻璃、朝画面右侧。注意分清\"画面左侧\"和\"人物的左手\"——镜头一转，它们就不一致了。\n\n**连词负责\"关系\"**：\"因为\"\"但是\"\"直到\"\"而不是\"\"同时\"\"然后\"。\"她听到名字后才回头\"比\"她听见名字，并且回头\"更明确先后。\"手已经松开，身体却没有离开\"给了两个部位不同的状态。\n\n**省略负责\"放手\"**：不必说明每一次呼吸、每片叶子的方向。首帧图已经确定的信息，通常不用再写一遍。\n\n## \"轻轻\"为什么常常不够\n\n\"轻轻\"可以指：力量小、速度慢、幅度小、接触时间短、声音弱。先确定你要的是哪一种。\n\n\"她轻轻关门\"可以改成：\n\n> 她让门慢慢靠上门框，手一直握着把手，直到锁舌几乎无声地落下。\n\n\"他轻轻把杯子放下\"也可以完全不同：\n\n> 他动作不慢，但落杯前稍微收住了手，杯底只发出短短一声。\n\n同样是\"轻\"，节奏和性格完全不同。也不需要再拆成十段关节运动。\n\n## 写起点和终点，中间交给 AI\n\n描述\"转过身继续赶路\"：先确认起点——人物正在回望，包在右肩；再确认终点——朝站台深处走，镜头不跟。中间重心怎么转移，可以交给 AI。\n\n但如果是\"把戒指从左手摘下来交给别人\"，摘下、离手、交付本身就是剧情，不能只写\"她释怀了\"。**关键的接触和道具状态要写清**，具体方法见[动作与调度](/craft/03-action-blocking.md)。\n\n## 一段话还是分段，看任务\n\n短任务，一段话更顺。参考图分工复杂，用小标题更好检查。对白按角色分开。多个镜头需要镜号或能辨认的段落。\n\n格式是为了阅读和工具方便，不要相信\"文字先出现所以画面先执行\"这种说法。\n\n英文也不会自动更专业。确实有模型专用的名词或参数时，保留它的写法；情绪和关系用你能准确判断的语言。翻译之后要重新检查：代词指对了没有、否定有没有翻反、左右对不对、声音是谁发出的。别只求句子漂亮。\n\n## 一句话记住\n\n**名词说是哪个，动词说怎么样，介词说在哪，连词说关系。选对一个动词，胜过三个形容词。**\n\n## 动手试试\n\n写一句\"她把东西放到桌上\"。然后换五个不同的动词（搁、扣、摆、撂、搭……），感受每个动词带来的重量、速度和情绪有什么不同。选一个最符合你想要的场景的。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [图像工具的官方说法](/references/official-image.md)\n[3] [视频工具的官方说法](/references/official-video.md)","toc":[{"id":"language-03-scene-grammar-section-0","title":"\"人话\"不是口语越多越好"},{"id":"language-03-scene-grammar-section-1","title":"五种词，五种活"},{"id":"language-03-scene-grammar-section-2","title":"\"轻轻\"为什么常常不够"},{"id":"language-03-scene-grammar-section-3","title":"写起点和终点，中间交给 AI"},{"id":"language-03-scene-grammar-section-4","title":"一段话还是分段，看任务"},{"id":"language-03-scene-grammar-section-5","title":"一句话记住"},{"id":"language-03-scene-grammar-section-6","title":"动手试试"}]},{"id":"language/04-emotion-atlas","path":"language/04-emotion-atlas.md","title":"09｜情绪图谱：16 种情绪，每种都不止一种身体","description":"同一个\"高兴\"，有人急着分享，有人怕被看见。这张图谱帮你选：这个人、这一刻，情绪从哪里露出来。","type":"Lexicon","group":"language","tags":["情绪","表演","台词","图谱"],"html":"<h1>09｜情绪图谱：16 种情绪，每种都不止一种身体<\/h1>\n<blockquote>\n<p>情绪词不是按钮。按下\"高兴\"，不会弹出同一张脸。<\/p>\n<\/blockquote>\n<h2 id=\"language-04-emotion-atlas-section-0\">怎么用这张图谱<\/h2>\n<p>每种情绪给你三样东西：<strong>核心是什么<\/strong>（这种情绪本质上是身体在干什么）、<strong>可以这样写<\/strong>（一个具体例子）、<strong>也可以完全不同<\/strong>（另一种同样成立的版本）、<strong>别这样<\/strong>（最常见的套路化错误）。<\/p>\n<p><strong>每次只选一个版本。<\/strong> 别把一整条图谱都塞进一个镜头。这些都是给虚构角色设计的方向，不是从外貌判断真人性格的规则。<\/p>\n<hr/>\n<h2 id=\"language-04-emotion-atlas-section-1\">01．期待：身体先到了，话还没到<\/h2>\n<p><strong>核心<\/strong>：注意力已经投向还没发生的事，身体跟着动了一点，又收回来。<\/p>\n<p><strong>可以这样写<\/strong>：她听到楼梯上有脚步声，手里的书往下落了一点。发现不是要等的人，又把书抬回原来的高度。镜头看得见这次\"差一点\"。<\/p>\n<p><strong>也可以完全不同<\/strong>：门一开就冲过去。兴奋不需要藏。<\/p>\n<p><strong>别这样<\/strong>：把所有期待都写成害羞和嘴角微微上扬。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-2\">02．喜悦：好消息真的改变了动作<\/h2>\n<p><strong>核心<\/strong>：原来在做的事被打断，身体不知道先干什么好。<\/p>\n<p><strong>可以这样写<\/strong>：他确认邮件后，把椅子往后一推，站起来又不知道先做什么，最后转身去抱旁边的人。笑声打断了他原本要说的话。<\/p>\n<p><strong>也可以完全不同<\/strong>：她终于敢把那张票放进口袋，不再反复检查。安静的喜悦也成立。<\/p>\n<p><strong>别这样<\/strong>：按时出现一个标准笑脸。也别以为\"内收\"就比\"外放\"高级——选哪种取决于人物和场合。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-3\">03．兴奋：想法跑在动作前面<\/h2>\n<p><strong>核心<\/strong>：不是全程更快，而是注意力不断被新东西抢走。<\/p>\n<p><strong>可以这样写<\/strong>：他一边打开盒子一边跟朋友说话，话还没说完就被里面的东西吸引，后半句变成了笑。<\/p>\n<p><strong>别这样<\/strong>：毫无原因的身体乱晃、连续甩镜头。兴奋有目标，只是允许语言被短暂打乱。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-4\">04．安心：警戒任务终于可以停下<\/h2>\n<p><strong>核心<\/strong>：一直绷着的某个部位，松了。<\/p>\n<p><strong>可以这样写<\/strong>：她听见熟悉的脚步，原本扶着门边的手落下来，重新坐回椅子里。不用说\"安全了\"，一句\"是你啊\"之后，呼吸恢复顺畅就够了。<\/p>\n<p><strong>和疲倦的区别<\/strong>：安心是防备减少，疲倦是维持姿势的力气减少。两者可以同时出现，但你要知道主轴是哪个。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-5\">05．疲惫：动作还在完成，代价已经看得见<\/h2>\n<p><strong>核心<\/strong>：任务之间的转换变慢了。<\/p>\n<p><strong>可以这样写<\/strong>：他把钥匙放进固定的小碟，却没有像平常一样马上脱外套，在门边多站了一会。<\/p>\n<p><strong>别这样<\/strong>：眼睛半闭、苍白、黑眼圈、颤抖。疲惫不自动等于病态，妆造的状态要有剧情理由。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-6\">06．紧张：要完成的事，和不想暴露的事<\/h2>\n<p><strong>核心<\/strong>：手上的任务在进行，某一处的力度露了馅。<\/p>\n<p><strong>可以这样写<\/strong>：她努力把文件递得平稳，指尖却一直压着纸角，等对方真正接住才松手。<\/p>\n<p><strong>也可以完全不同<\/strong>：另一种紧张让人异常利落、话很少、动作更用力。安静不代表没有强度。<\/p>\n<p><strong>别这样<\/strong>：同时安排眨眼、抖腿、咬唇、冒汗和吞咽。挑一处能看清的。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-7\">07．恐惧：注意力变窄<\/h2>\n<p><strong>核心<\/strong>：世界缩小到一个方向。<\/p>\n<p><strong>可以这样写<\/strong>：走廊里一声金属轻响。她没有四处乱看，只停住手里的动作，望向刚才声音来的那扇门。<\/p>\n<p><strong>也可以完全不同<\/strong>：惊恐地跑也可以直接有力——让逃跑的方向、障碍和目的清楚，不靠不停抖动的画面制造混乱。<\/p>\n<p><strong>别这样<\/strong>：环境突然变蓝。先让听觉抓住注意力，再决定要不要给出威胁。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-8\">08．愤怒：压力的出口不止怒吼<\/h2>\n<p><strong>核心<\/strong>：想让对方接住一句话，用力的方式不同。<\/p>\n<p><strong>压着说<\/strong>：他把问题重新问了一遍，字和字之间的间隔更清楚，音量反而低了。<\/p>\n<p><strong>爆发说<\/strong>：他终于打断对方，第一句冲得很快，第二句却卡住了，因为真正伤人的那句话比想象中难说出口。<\/p>\n<p><strong>别这样<\/strong>：把愤怒永远翻译成\"冷静的威压\"。直接、粗粝、失控的形式也有它的价值。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-9\">09．悲伤：失去的是哪一种能力<\/h2>\n<p><strong>核心<\/strong>：习惯还没跟上事实。<\/p>\n<p><strong>可以这样写<\/strong>：她开始像平常一样摆两副餐具，拿起第二只碗时停下，最后把它放回柜子。<\/p>\n<p><strong>也可以完全不同<\/strong>：他哭到必须扶住桌沿才能站着。别为了\"克制\"，剥夺人物在重大失去面前的强烈反应。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-10\">10．委屈：话想被接住，却越说越小<\/h2>\n<p><strong>核心<\/strong>：解释的力气在流失。<\/p>\n<p><strong>可以这样写<\/strong>：她先认真解释，发现对方没在听，后半句慢下来，最后不再为自己补充。目光不是一直往下，而是从对方的脸移到桌上没被碰过的东西。<\/p>\n<p><strong>也可以完全不同<\/strong>：如果这个角色会争取，让她重新抬头，把最后一句说清楚。委屈不是默认无力。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-11\">11．尴尬：找一个可以做的普通动作<\/h2>\n<p><strong>核心<\/strong>：需要一个动作来填补空白，但什么都不太对。<\/p>\n<p><strong>可以这样写<\/strong>：笑声停得太快。他伸手去拿桌上的杯子，碰到杯柄又改成把杯垫摆正。<\/p>\n<p><strong>也可以完全不同<\/strong>：让一个人毫无察觉，另一个人独自承受那一点空白。<\/p>\n<p><strong>别这样<\/strong>：所有人同时僵住、瞪眼。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-12\">12．内疚：补救的动作可能太用力<\/h2>\n<p><strong>核心<\/strong>：想做点什么弥补，做过了头。<\/p>\n<p><strong>可以这样写<\/strong>：她把对方散落的文件重新叠好，明明已经整齐，还是又对了一次边。说\"没事吧\"时先看物件，过了一会才敢看人。<\/p>\n<p><strong>注意<\/strong>：这是给角色安排的线索，不是心理测谎方法。别把某个小动作当成\"识破谎言\"的信号。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-13\">13．不舍：离开的动作没有一齐完成<\/h2>\n<p><strong>核心<\/strong>：身体的不同部位，走到了不同的进度。<\/p>\n<p><strong>可以这样写<\/strong>：脚已经朝门外，手还搭在门框上。话已经说完，身体还留着等一句回应的姿态。<\/p>\n<p><strong>也可以完全不同<\/strong>：她走得很快，只在关门的时候极轻地放慢了一下。把迟疑放在一个真正重要的接点上。<\/p>\n<p><strong>别这样<\/strong>：\"回头三次\"。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-14\">14．羞怯与亲近：距离正在重新谈判<\/h2>\n<p><strong>核心<\/strong>：往后让的身体，停止了后退。<\/p>\n<p><strong>可以这样写<\/strong>：对方替她把袖口理好，她先看那只手，再看对方，原本往后让的身体没有继续退。<\/p>\n<p><strong>也可以完全不同<\/strong>：亲近可以大方、明确、有幽默感。<\/p>\n<p><strong>别这样<\/strong>：把所有女性角色写成低头咬唇；把\"突然靠近\"本身当成浪漫。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-15\">15．坚定：决定之后，动作不再有岔路<\/h2>\n<p><strong>核心<\/strong>：不再试探，直接做。<\/p>\n<p><strong>可以这样写<\/strong>：她把桌上两份方案中的一份合上，只把另一份推到中间，说话不再先看对方的脸色。镜头可以不动，让动作自己给出重心。<\/p>\n<p><strong>注意<\/strong>：坚定不需要消灭恐惧。她可以还在发抖，但把必须说的话说完。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-16\">16．释然：不是问题消失，而是不再重复抵抗<\/h2>\n<p><strong>核心<\/strong>：注意力终于回到眼前。<\/p>\n<p><strong>可以这样写<\/strong>：他把删了又写的消息停在未发送状态，锁上屏幕，转向窗边正在说话的人。没有胜利姿态。<\/p>\n<p><strong>也可以完全不同<\/strong>：快乐的释然——大笑、击掌、跑进阳光。<\/p>\n<p><strong>别这样<\/strong>：把所有结尾都处理成一声叹息。<\/p>\n<hr/>\n<h2 id=\"language-04-emotion-atlas-section-17\">从图谱到一个镜头<\/h2>\n<ol>\n<li>先选\"这个人想做什么\"，再选情绪<\/li>\n<li>只挑一个主要行为和一个看得见的变化<\/li>\n<li>根据景别决定变化的尺度——远景看不见嘴角<\/li>\n<li>让声音和身体不必重复说同一件事<\/li>\n<\/ol>\n<p>更完整的表演设计方法，见<a href=\"#/craft/01-acting\">表演<\/a>。<\/p>\n<h2 id=\"language-04-emotion-atlas-section-18\">一句话记住<\/h2>\n<p><strong>情绪是身体在做什么，不是脸在摆什么。选一个版本，选一处露出来。<\/strong><\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 09｜情绪图谱：16 种情绪，每种都不止一种身体\n\n> 情绪词不是按钮。按下\"高兴\"，不会弹出同一张脸。\n\n## 怎么用这张图谱\n\n每种情绪给你三样东西：**核心是什么**（这种情绪本质上是身体在干什么）、**可以这样写**（一个具体例子）、**也可以完全不同**（另一种同样成立的版本）、**别这样**（最常见的套路化错误）。\n\n**每次只选一个版本。** 别把一整条图谱都塞进一个镜头。这些都是给虚构角色设计的方向，不是从外貌判断真人性格的规则。\n\n---\n\n## 01．期待：身体先到了，话还没到\n\n**核心**：注意力已经投向还没发生的事，身体跟着动了一点，又收回来。\n\n**可以这样写**：她听到楼梯上有脚步声，手里的书往下落了一点。发现不是要等的人，又把书抬回原来的高度。镜头看得见这次\"差一点\"。\n\n**也可以完全不同**：门一开就冲过去。兴奋不需要藏。\n\n**别这样**：把所有期待都写成害羞和嘴角微微上扬。\n\n## 02．喜悦：好消息真的改变了动作\n\n**核心**：原来在做的事被打断，身体不知道先干什么好。\n\n**可以这样写**：他确认邮件后，把椅子往后一推，站起来又不知道先做什么，最后转身去抱旁边的人。笑声打断了他原本要说的话。\n\n**也可以完全不同**：她终于敢把那张票放进口袋，不再反复检查。安静的喜悦也成立。\n\n**别这样**：按时出现一个标准笑脸。也别以为\"内收\"就比\"外放\"高级——选哪种取决于人物和场合。\n\n## 03．兴奋：想法跑在动作前面\n\n**核心**：不是全程更快，而是注意力不断被新东西抢走。\n\n**可以这样写**：他一边打开盒子一边跟朋友说话，话还没说完就被里面的东西吸引，后半句变成了笑。\n\n**别这样**：毫无原因的身体乱晃、连续甩镜头。兴奋有目标，只是允许语言被短暂打乱。\n\n## 04．安心：警戒任务终于可以停下\n\n**核心**：一直绷着的某个部位，松了。\n\n**可以这样写**：她听见熟悉的脚步，原本扶着门边的手落下来，重新坐回椅子里。不用说\"安全了\"，一句\"是你啊\"之后，呼吸恢复顺畅就够了。\n\n**和疲倦的区别**：安心是防备减少，疲倦是维持姿势的力气减少。两者可以同时出现，但你要知道主轴是哪个。\n\n## 05．疲惫：动作还在完成，代价已经看得见\n\n**核心**：任务之间的转换变慢了。\n\n**可以这样写**：他把钥匙放进固定的小碟，却没有像平常一样马上脱外套，在门边多站了一会。\n\n**别这样**：眼睛半闭、苍白、黑眼圈、颤抖。疲惫不自动等于病态，妆造的状态要有剧情理由。\n\n## 06．紧张：要完成的事，和不想暴露的事\n\n**核心**：手上的任务在进行，某一处的力度露了馅。\n\n**可以这样写**：她努力把文件递得平稳，指尖却一直压着纸角，等对方真正接住才松手。\n\n**也可以完全不同**：另一种紧张让人异常利落、话很少、动作更用力。安静不代表没有强度。\n\n**别这样**：同时安排眨眼、抖腿、咬唇、冒汗和吞咽。挑一处能看清的。\n\n## 07．恐惧：注意力变窄\n\n**核心**：世界缩小到一个方向。\n\n**可以这样写**：走廊里一声金属轻响。她没有四处乱看，只停住手里的动作，望向刚才声音来的那扇门。\n\n**也可以完全不同**：惊恐地跑也可以直接有力——让逃跑的方向、障碍和目的清楚，不靠不停抖动的画面制造混乱。\n\n**别这样**：环境突然变蓝。先让听觉抓住注意力，再决定要不要给出威胁。\n\n## 08．愤怒：压力的出口不止怒吼\n\n**核心**：想让对方接住一句话，用力的方式不同。\n\n**压着说**：他把问题重新问了一遍，字和字之间的间隔更清楚，音量反而低了。\n\n**爆发说**：他终于打断对方，第一句冲得很快，第二句却卡住了，因为真正伤人的那句话比想象中难说出口。\n\n**别这样**：把愤怒永远翻译成\"冷静的威压\"。直接、粗粝、失控的形式也有它的价值。\n\n## 09．悲伤：失去的是哪一种能力\n\n**核心**：习惯还没跟上事实。\n\n**可以这样写**：她开始像平常一样摆两副餐具，拿起第二只碗时停下，最后把它放回柜子。\n\n**也可以完全不同**：他哭到必须扶住桌沿才能站着。别为了\"克制\"，剥夺人物在重大失去面前的强烈反应。\n\n## 10．委屈：话想被接住，却越说越小\n\n**核心**：解释的力气在流失。\n\n**可以这样写**：她先认真解释，发现对方没在听，后半句慢下来，最后不再为自己补充。目光不是一直往下，而是从对方的脸移到桌上没被碰过的东西。\n\n**也可以完全不同**：如果这个角色会争取，让她重新抬头，把最后一句说清楚。委屈不是默认无力。\n\n## 11．尴尬：找一个可以做的普通动作\n\n**核心**：需要一个动作来填补空白，但什么都不太对。\n\n**可以这样写**：笑声停得太快。他伸手去拿桌上的杯子，碰到杯柄又改成把杯垫摆正。\n\n**也可以完全不同**：让一个人毫无察觉，另一个人独自承受那一点空白。\n\n**别这样**：所有人同时僵住、瞪眼。\n\n## 12．内疚：补救的动作可能太用力\n\n**核心**：想做点什么弥补，做过了头。\n\n**可以这样写**：她把对方散落的文件重新叠好，明明已经整齐，还是又对了一次边。说\"没事吧\"时先看物件，过了一会才敢看人。\n\n**注意**：这是给角色安排的线索，不是心理测谎方法。别把某个小动作当成\"识破谎言\"的信号。\n\n## 13．不舍：离开的动作没有一齐完成\n\n**核心**：身体的不同部位，走到了不同的进度。\n\n**可以这样写**：脚已经朝门外，手还搭在门框上。话已经说完，身体还留着等一句回应的姿态。\n\n**也可以完全不同**：她走得很快，只在关门的时候极轻地放慢了一下。把迟疑放在一个真正重要的接点上。\n\n**别这样**：\"回头三次\"。\n\n## 14．羞怯与亲近：距离正在重新谈判\n\n**核心**：往后让的身体，停止了后退。\n\n**可以这样写**：对方替她把袖口理好，她先看那只手，再看对方，原本往后让的身体没有继续退。\n\n**也可以完全不同**：亲近可以大方、明确、有幽默感。\n\n**别这样**：把所有女性角色写成低头咬唇；把\"突然靠近\"本身当成浪漫。\n\n## 15．坚定：决定之后，动作不再有岔路\n\n**核心**：不再试探，直接做。\n\n**可以这样写**：她把桌上两份方案中的一份合上，只把另一份推到中间，说话不再先看对方的脸色。镜头可以不动，让动作自己给出重心。\n\n**注意**：坚定不需要消灭恐惧。她可以还在发抖，但把必须说的话说完。\n\n## 16．释然：不是问题消失，而是不再重复抵抗\n\n**核心**：注意力终于回到眼前。\n\n**可以这样写**：他把删了又写的消息停在未发送状态，锁上屏幕，转向窗边正在说话的人。没有胜利姿态。\n\n**也可以完全不同**：快乐的释然——大笑、击掌、跑进阳光。\n\n**别这样**：把所有结尾都处理成一声叹息。\n\n---\n\n## 从图谱到一个镜头\n\n1. 先选\"这个人想做什么\"，再选情绪\n2. 只挑一个主要行为和一个看得见的变化\n3. 根据景别决定变化的尺度——远景看不见嘴角\n4. 让声音和身体不必重复说同一件事\n\n更完整的表演设计方法，见[表演](/craft/01-acting.md)。\n\n## 一句话记住\n\n**情绪是身体在做什么，不是脸在摆什么。选一个版本，选一处露出来。**\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"language-04-emotion-atlas-section-0","title":"怎么用这张图谱"},{"id":"language-04-emotion-atlas-section-1","title":"01．期待：身体先到了，话还没到"},{"id":"language-04-emotion-atlas-section-2","title":"02．喜悦：好消息真的改变了动作"},{"id":"language-04-emotion-atlas-section-3","title":"03．兴奋：想法跑在动作前面"},{"id":"language-04-emotion-atlas-section-4","title":"04．安心：警戒任务终于可以停下"},{"id":"language-04-emotion-atlas-section-5","title":"05．疲惫：动作还在完成，代价已经看得见"},{"id":"language-04-emotion-atlas-section-6","title":"06．紧张：要完成的事，和不想暴露的事"},{"id":"language-04-emotion-atlas-section-7","title":"07．恐惧：注意力变窄"},{"id":"language-04-emotion-atlas-section-8","title":"08．愤怒：压力的出口不止怒吼"},{"id":"language-04-emotion-atlas-section-9","title":"09．悲伤：失去的是哪一种能力"},{"id":"language-04-emotion-atlas-section-10","title":"10．委屈：话想被接住，却越说越小"},{"id":"language-04-emotion-atlas-section-11","title":"11．尴尬：找一个可以做的普通动作"},{"id":"language-04-emotion-atlas-section-12","title":"12．内疚：补救的动作可能太用力"},{"id":"language-04-emotion-atlas-section-13","title":"13．不舍：离开的动作没有一齐完成"},{"id":"language-04-emotion-atlas-section-14","title":"14．羞怯与亲近：距离正在重新谈判"},{"id":"language-04-emotion-atlas-section-15","title":"15．坚定：决定之后，动作不再有岔路"},{"id":"language-04-emotion-atlas-section-16","title":"16．释然：不是问题消失，而是不再重复抵抗"},{"id":"language-04-emotion-atlas-section-17","title":"从图谱到一个镜头"},{"id":"language-04-emotion-atlas-section-18","title":"一句话记住"}]},{"id":"language/05-atmosphere-atlas","path":"language/05-atmosphere-atlas.md","title":"10｜氛围图谱：16 种抽象感觉，各自可以落在什么材料上","description":"清爽、高级、梦幻这些词不是撒在画面上的粉。它们来自东西怎么靠近、怎么发声、怎么留下时间。","type":"Lexicon","group":"language","tags":["氛围","通感","风格","词汇"],"html":"<h1>10｜氛围图谱：16 种抽象感觉，各自可以落在什么材料上<\/h1>\n<blockquote>\n<p>氛围不是撒在所有东西上的一层粉。它来自这些东西怎么靠近、怎么发声、怎么留下时间。<\/p>\n<\/blockquote>\n<h2 id=\"language-05-atmosphere-atlas-section-0\">怎么用这张图谱<\/h2>\n<p>每种氛围给你：<strong>核心是什么<\/strong>（这种感觉本质上是什么关系）、<strong>可以这样写<\/strong>（一个例子）、<strong>另一条路<\/strong>（不同材料的同一种感觉）、<strong>别这样<\/strong>（最常见的套路）。<\/p>\n<p><strong>重点是关系，材料随便换。<\/strong> 这张图谱不提供\"颜色对应情绪\"的字典。<\/p>\n<hr/>\n<h2 id=\"language-05-atmosphere-atlas-section-1\">01．清爽：有空气可以通过<\/h2>\n<p><strong>核心<\/strong>：不挤。<\/p>\n<p><strong>可
