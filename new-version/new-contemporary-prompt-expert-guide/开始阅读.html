如果结构部分只有一句、细节部分有五句，说明比例反了。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-image\">图像工具的官方说法<\/a><\/p>\n<\/details>","text":"# 22｜文字生图：先造一个能看懂的画面，再谈细节\n\n## 先判断你在做哪一种图\n\n概念探索、角色资产、场景资产、最终静帧、版式海报——这五种不是同一个任务。\n\n角色资产要身份和结构清楚。成片静帧可能更重气氛和视点。海报还要给信息排布留空间。\n\n如果任务是探索\"午后的松弛\"，可以放开人物和环境。如果任务是同一产品的新角度，那已经不是从零想象，应该用参考图或改图路线。\n\n## 一张静帧的起草顺序\n\n1. 一句话定观看任务\n2. 写主要对象和它们的关系\n3. 给出构图和环境\n4. 最后选少量的光、材料、风格\n\n抽象的感觉放在开头或结尾就够了，不必每句话都重复。\n\n```text\n一张明亮、安静的生活方式产品静帧。浅色洗手台右侧放着一只半透明青绿色按压瓶，左侧留出干净空间。镜头与台面略成俯角，能看清瓶身正面和少量顶部结构。午后的柔光从侧窗进入，在墙上留下很淡的窗影。台面只有一小片尚未干透的水迹，没有铺满装饰叶片。画面轻盈、清爽，但保留生活里的温度。\n```\n\n这是虚构产品的探索稿。**已经有真实包装时，要改成\"使用包装参考\"**，别让这段自造的结构代替客户的产品。\n\n## 按层比较，别一口气选\"最好看的\"\n\n**第一轮看结构**：主体突出吗？空白有用吗？机位能看清目标吗？\n**第二轮看关系**：人和产品的比例、环境的距离、道具是不是同一个世界的。\n**第三轮看材料和细节**：光、反射、颜色、文字、皮肤、局部形态。\n\n不用机械地生成三次。一张图同时满足就直接前进。**但如果构图错了，别靠高分辨率和细纹把错误做得更精细。**\n\n## 修改时只说需要变的那一层\n\n\"让左上更空一些，瓶子位置不变\"比重新描述整张图更聚焦。\n\n多轮之后整体漂移了，就回到最后一个可靠的版本，别在越来越差的图上不停叠改。\n\n同时检查：参考图是用来规定主体、风格，还是布局？不同平台对参考的用法不同，见[工具适配](/workflows/08-model-adaptation.md)。\n\n## 风格化不必都向摄影靠\n\n插画可以用轮廓、色面和纹理。黏土动画的静帧可以保留手工压痕。图形海报可以没有实体光源。\n\n**给材质和媒介写出它自己的规则**，别加一串不相容的摄影关键词。\n\n## 输出前的检查\n\n确认画幅、实际像素、颜色、最终的信息区。检查产品字标和结构。\n\n**如果这张图之后要变成视频**，还要看起始姿势能不能接着动：双手在哪？头朝哪？主要道具有没有被挡住？\n\n一张图只是漂亮，却让后续的开盖、拿取、走动无从开始——那它是漂亮的静帧，不一定是好的首帧。下一步见[图生视频](/workflows/04-image-to-video.md)。\n\n## 一句话记住\n\n**先看结构，再看关系，最后看细节。构图错了，别用高清把错误做得更精致。**\n\n## 动手试试\n\n写一张静帧的提示词，然后把它拆成三部分：哪些句子在说结构？哪些在说关系？哪些在说细节？如果结构部分只有一句、细节部分有五句，说明比例反了。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [图像工具的官方说法](/references/official-image.md)","toc":[{"id":"workflows-02-text-to-image-section-0","title":"先判断你在做哪一种图"},{"id":"workflows-02-text-to-image-section-1","title":"一张静帧的起草顺序"},{"id":"workflows-02-text-to-image-section-2","title":"按层比较，别一口气选\"最好看的\""},{"id":"workflows-02-text-to-image-section-3","title":"修改时只说需要变的那一层"},{"id":"workflows-02-text-to-image-section-4","title":"风格化不必都向摄影靠"},{"id":"workflows-02-text-to-image-section-5","title":"输出前的检查"},{"id":"workflows-02-text-to-image-section-6","title":"一句话记住"},{"id":"workflows-02-text-to-image-section-7","title":"动手试试"}]},{"id":"workflows/03-image-edit","path":"workflows/03-image-edit.md","title":"23｜改图：说清改哪里，也要说清改完之后是什么样","description":"改图的核心结构是：原图 + 目标区域 + 操作 + 预期结果 + 重要保留项。红箭头是提示，不是精确蒙版。","type":"Playbook","group":"workflows","tags":["改图","蒙版","定位","产品"],"html":"<h1>23｜改图：说清改哪里，也要说清改完之后是什么样<\/h1>\n<h2 id=\"workflows-03-image-edit-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>把这个房间弄得温暖一点。<\/p>\n<\/blockquote>\n<p>这句话可能意味着：改光、改材质、改家具、还是全改？主体要保持吗？AI 不知道，你也没说。<\/p>\n<h2 id=\"workflows-03-image-edit-section-1\">先说清编辑范围<\/h2>\n<p>改图的核心结构：<strong>原图 + 目标区域 + 操作 + 预期结果 + 重要保留项。<\/strong><\/p>\n<p>先选目标：只改光，还是要换家具？主体必须保持吗？要复用哪张可靠的原图？<\/p>\n<h2 id=\"workflows-03-image-edit-section-2\">怎么指出\"是哪一个\"：从简单到复杂<\/h2>\n<p>只有一只杯子时，\"桌上的杯子\"就够了。东西很多时，用框、箭头、编号、局部裁切，或者工具支持的蒙版来减少歧义。<\/p>\n<p><strong>别不分任务一律画满辅助标记。<\/strong><\/p>\n<p>还有一个重要区别：图上的红箭头是<strong>看得见的提示<\/strong>，蒙版是<strong>工具接口里的编辑范围<\/strong>。它们不是同一种机制。即使给了蒙版，也不要假设外面的像素绝对不变——OpenAI 的官方文档明确说过，它的图像蒙版是\"指导\"，不保证精确沿着蒙版形状执行（见<a href=\"#/references/official-image\">图像工具的官方说法<\/a>）。<\/p>\n<h2 id=\"workflows-03-image-edit-section-3\">四种常用操作，各有不同的后果<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>操作<\/th>\n<th>要说清的事<\/th>\n<th>要检查的事<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>删除<\/td>\n<td>只删对象，还是连影子、倒影一起删？<\/td>\n<td>背景修复得怎样、有没有残影、纹理是否重复<\/td>\n<\/tr>\n<tr>\n<td>替换<\/td>\n<td>继承原来的尺寸和姿态，还是连结构一起改？<\/td>\n<td>接触点、材质、主体身份<\/td>\n<\/tr>\n<tr>\n<td>移动<\/td>\n<td>原位置不留副本，新位置怎么落地？<\/td>\n<td>透视、比例、阴影和遮挡<\/td>\n<\/tr>\n<tr>\n<td>重打光<\/td>\n<td>哪个光源、哪个区域变？造型要保持吗？<\/td>\n<td>光影合理性、脸和产品有没有被重新生成<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"workflows-03-image-edit-section-4\">一条可用的\"移动\"说明<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">用没打标的原图作为画面基础，打标图只帮助定位。把标 1 的这只花瓶移到标 2 的桌面空位，原位置修复成同一张桌面的连续纹理，不保留第二只花瓶。保持瓶型、花枝数量和主要朝向，按新位置匹配透视和接触阴影。人物、桌子结构和画幅不变，最终画面没有任何定位标记。\n<\/code><\/pre>\n<p>只有工具能同时理解这两张输入、并且分工清楚时，才这样提交。否则用一张轻标注的图，或者用原生蒙版。<strong>别为了\"信息完整\"上传互相矛盾的多张底图。<\/strong><\/p>\n<h2 id=\"workflows-03-image-edit-section-5\">用保留项保护任务，别堆无关禁令<\/h2>\n<p>需要保住包装文字，就把字标列为重点。背景远处无关纹理的变化，按用途决定接不接受。<\/p>\n<p>如果要求逐像素保留非编辑区域，最好在后期把通过的局部合成回可靠的原图，<strong>而不是依赖一大段\"其他地方绝对不动\"。<\/strong><\/p>\n<p>标记别盖住你想保留的结构。已经盖住了，另给一张没遮挡的原图或清晰的局部。AI 不能从不存在的信息里还原精确的设计。<\/p>\n<h2 id=\"workflows-03-image-edit-section-6\">完成后做两次比较<\/h2>\n<p><strong>第一次<\/strong>：只看编辑目标对不对。\n<strong>第二次<\/strong>：看原本正确的区域有没有被连带改了。<\/p>\n<p>品牌、包装、连续人物，这两步同样重要。<\/p>\n<p>连续编辑发生漂移，就退回最后通过的版本，分区域分步处理。<strong>别把每张中间结果都叫\"最终图\"。<\/strong> 怎么记最少的状态，见<a href=\"#/workflows/05-assets-multishot\">资产与多镜头<\/a>。<\/p>\n<h2 id=\"workflows-03-image-edit-section-7\">一句话记住<\/h2>\n<p><strong>改图说五件事：原图、改哪、怎么改、改完什么样、什么不能动。红箭头是提示，不是锁。<\/strong><\/p>\n<h2 id=\"workflows-03-image-edit-section-8\">动手试试<\/h2>\n<p>想一个改图任务（比如\"把左边的椅子挪到窗边\"）。按\"原图 + 目标区域 + 操作 + 预期结果 + 保留项\"的结构写一遍。然后检查：你有没有说清原位置怎么处理？有没有说清新位置的阴影？<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-image\">图像工具的官方说法<\/a><\/p>\n<\/details>","text":"# 23｜改图：说清改哪里，也要说清改完之后是什么样\n\n## 问题在哪里\n\n> 把这个房间弄得温暖一点。\n\n这句话可能意味着：改光、改材质、改家具、还是全改？主体要保持吗？AI 不知道，你也没说。\n\n## 先说清编辑范围\n\n改图的核心结构：**原图 + 目标区域 + 操作 + 预期结果 + 重要保留项。**\n\n先选目标：只改光，还是要换家具？主体必须保持吗？要复用哪张可靠的原图？\n\n## 怎么指出\"是哪一个\"：从简单到复杂\n\n只有一只杯子时，\"桌上的杯子\"就够了。东西很多时，用框、箭头、编号、局部裁切，或者工具支持的蒙版来减少歧义。\n\n**别不分任务一律画满辅助标记。**\n\n还有一个重要区别：图上的红箭头是**看得见的提示**，蒙版是**工具接口里的编辑范围**。它们不是同一种机制。即使给了蒙版，也不要假设外面的像素绝对不变——OpenAI 的官方文档明确说过，它的图像蒙版是\"指导\"，不保证精确沿着蒙版形状执行（见[图像工具的官方说法](/references/official-image.md)）。\n\n## 四种常用操作，各有不同的后果\n\n| 操作 | 要说清的事 | 要检查的事 |\n| --- | --- | --- |\n| 删除 | 只删对象，还是连影子、倒影一起删？ | 背景修复得怎样、有没有残影、纹理是否重复 |\n| 替换 | 继承原来的尺寸和姿态，还是连结构一起改？ | 接触点、材质、主体身份 |\n| 移动 | 原位置不留副本，新位置怎么落地？ | 透视、比例、阴影和遮挡 |\n| 重打光 | 哪个光源、哪个区域变？造型要保持吗？ | 光影合理性、脸和产品有没有被重新生成 |\n\n## 一条可用的\"移动\"说明\n\n```text\n用没打标的原图作为画面基础，打标图只帮助定位。把标 1 的这只花瓶移到标 2 的桌面空位，原位置修复成同一张桌面的连续纹理，不保留第二只花瓶。保持瓶型、花枝数量和主要朝向，按新位置匹配透视和接触阴影。人物、桌子结构和画幅不变，最终画面没有任何定位标记。\n```\n\n只有工具能同时理解这两张输入、并且分工清楚时，才这样提交。否则用一张轻标注的图，或者用原生蒙版。**别为了\"信息完整\"上传互相矛盾的多张底图。**\n\n## 用保留项保护任务，别堆无关禁令\n\n需要保住包装文字，就把字标列为重点。背景远处无关纹理的变化，按用途决定接不接受。\n\n如果要求逐像素保留非编辑区域，最好在后期把通过的局部合成回可靠的原图，**而不是依赖一大段\"其他地方绝对不动\"。**\n\n标记别盖住你想保留的结构。已经盖住了，另给一张没遮挡的原图或清晰的局部。AI 不能从不存在的信息里还原精确的设计。\n\n## 完成后做两次比较\n\n**第一次**：只看编辑目标对不对。\n**第二次**：看原本正确的区域有没有被连带改了。\n\n品牌、包装、连续人物，这两步同样重要。\n\n连续编辑发生漂移，就退回最后通过的版本，分区域分步处理。**别把每张中间结果都叫\"最终图\"。** 怎么记最少的状态，见[资产与多镜头](/workflows/05-assets-multishot.md)。\n\n## 一句话记住\n\n**改图说五件事：原图、改哪、怎么改、改完什么样、什么不能动。红箭头是提示，不是锁。**\n\n## 动手试试\n\n想一个改图任务（比如\"把左边的椅子挪到窗边\"）。按\"原图 + 目标区域 + 操作 + 预期结果 + 保留项\"的结构写一遍。然后检查：你有没有说清原位置怎么处理？有没有说清新位置的阴影？\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [图像工具的官方说法](/references/official-image.md)","toc":[{"id":"workflows-03-image-edit-section-0","title":"问题在哪里"},{"id":"workflows-03-image-edit-section-1","title":"先说清编辑范围"},{"id":"workflows-03-image-edit-section-2","title":"怎么指出\"是哪一个\"：从简单到复杂"},{"id":"workflows-03-image-edit-section-3","title":"四种常用操作，各有不同的后果"},{"id":"workflows-03-image-edit-section-4","title":"一条可用的\"移动\"说明"},{"id":"workflows-03-image-edit-section-5","title":"用保留项保护任务，别堆无关禁令"},{"id":"workflows-03-image-edit-section-6","title":"完成后做两次比较"},{"id":"workflows-03-image-edit-section-7","title":"一句话记住"},{"id":"workflows-03-image-edit-section-8","title":"动手试试"}]},{"id":"workflows/04-image-to-video","path":"workflows/04-image-to-video.md","title":"24｜图生视频：让已经存在的画面继续发生","description":"上传图片之前先想清楚它是\"第一帧\"还是\"这个人长什么样\"。写接续，不重复；写结尾状态，给下一镜留起点。","type":"Playbook","group":"workflows","tags":["图生视频","首帧","动作","执行"],"html":"<h1>24｜图生视频：让已经存在的画面继续发生<\/h1>\n<h2 id=\"workflows-04-image-to-video-section-0\">上传图片之前，先想清楚它扮演什么角色<\/h2>\n<p><strong>首帧<\/strong>：视频从这张画面开始。姿势、构图、光线都是起点。\n<strong>身份参考<\/strong>：告诉 AI\"这个人长这样\"，不一定要从图里的姿态开始。\n<strong>风格参考<\/strong>：提供外观方向，不规定空间。<\/p>\n<p>不同工具对这些输入的叫法和能力不一样，<strong>必须按你实际用的模式确认<\/strong>。<\/p>\n<p>所以\"只参考脸，不参考姿态\"不是万能咒语。在强首帧约束的任务里，你不能一边要求严格保留第一帧，一边要求第一秒就变成完全不同的站姿和机位。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-1\">先写一条自然的接续<\/h2>\n<p>首帧：女子倚在窗边，右手拿杯，看向室内。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">她听见窗外有人叫她，视线先移向窗外，随后身体稍稍转过去。右手仍稳稳拿着杯子，没有端起来喝。窗帘在她转身后轻碰一下肩侧。镜头保持原来的中景和位置，安静地等她看清来人。\n<\/code><\/pre>\n<p>这段主要写<strong>运动和变化<\/strong>。没有重复定义衣服、鼻梁、窗框颜色。<strong>输入图已经提供的内容，不必靠长段文字再建立一遍。<\/strong><\/p>\n<h2 id=\"workflows-04-image-to-video-section-2\">让这次任务有一个结尾状态<\/h2>\n<p>\"她一直走\"适合探索动势。但进入多镜头制作时，知道最后停在哪儿更有帮助。<\/p>\n<p>\"她走到门边停住，仍没有打开门\"——既限定了进度，也给下一镜留了起点。<\/p>\n<p>如果最终要产品定帧，末尾要安排稳定，别直到最后都在转。如果要突然切断，允许动作未完成，切点由剪辑选。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-3\">用时间表达关系，别迷信精确秒数<\/h2>\n<p>可以写\"先停一下，再回头\"，也可以写\"前半段听见，后半段认出\"。对特定时长的任务，用粗时间段帮助整理，但要和实际设置一致。<\/p>\n<p><strong>关键对白或节拍，要用输出的音视频确认，不能凭提示词里的小数当完成标准。<\/strong><\/p>\n<h2 id=\"workflows-04-image-to-video-section-4\">多种运动同时存在时，先确定主动作<\/h2>\n<p>人物转身、镜头环绕、窗帘大幅飘动、光线闪烁、焦点切换——它们会竞争注意力，也让你找不到是哪个出了问题。<\/p>\n<p>先测试人物或镜头中的<strong>主要一项<\/strong>，再决定要不要加其他变化。这是减少诊断歧义的方法，不是所有模型的隐藏机制。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-5\">三个常见的失败入口<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>症状<\/th>\n<th>该修什么<\/th>\n<th>别做什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>动作从奇怪的姿态起步<\/td>\n<td>修首帧，或调整动作<\/td>\n<td>加\"自然\"两个字<\/td>\n<\/tr>\n<tr>\n<td>身份在运动中漂移<\/td>\n<td>检查人脸信息够不够、转头幅度、遮挡、工具的参考能力；再选择缩小动作或分镜<\/td>\n<td>无限强调\"不变脸\"<\/td>\n<\/tr>\n<tr>\n<td>动作完成了，情绪没读出来<\/td>\n<td>检查镜头能不能看到反应、刺激明不明确、剪辑有没有给停留时间<\/td>\n<td>改表演句——它本身可能没错<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"workflows-04-image-to-video-section-6\">选择和剪辑也是生成流程的一部分<\/h2>\n<p>从候选里选可用区间，不要求每个片段头尾都完美。可以剪掉破绽，<strong>但不能剪掉必需的因果再宣称完成了任务<\/strong>。<\/p>\n<p>评价时看实际片段，不看任务状态写着\"成功\"。<\/p>\n<p>后续衔接见<a href=\"#/workflows/05-assets-multishot\">多镜头流程<\/a>，高风险动作见<a href=\"#/workflows/06-previs\">预演<\/a>。<\/p>\n<h2 id=\"workflows-04-image-to-video-section-7\">一句话记住<\/h2>\n<p><strong>先想清图片是第一帧还是身份参考。只写变化，不重复图里已有的。给一个结尾状态。<\/strong><\/p>\n<h2 id=\"workflows-04-image-to-video-section-8\">动手试试<\/h2>\n<p>找一张有人物的照片（或者想象一张）。写一段图生视频提示词，要求：不重复描述照片里已经有的任何东西，只写接下来 5 秒发生了什么、最后停在什么状态。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/p>\n<\/details>","text":"# 24｜图生视频：让已经存在的画面继续发生\n\n## 上传图片之前，先想清楚它扮演什么角色\n\n**首帧**：视频从这张画面开始。姿势、构图、光线都是起点。\n**身份参考**：告诉 AI\"这个人长这样\"，不一定要从图里的姿态开始。\n**风格参考**：提供外观方向，不规定空间。\n\n不同工具对这些输入的叫法和能力不一样，**必须按你实际用的模式确认**。\n\n所以\"只参考脸，不参考姿态\"不是万能咒语。在强首帧约束的任务里，你不能一边要求严格保留第一帧，一边要求第一秒就变成完全不同的站姿和机位。\n\n## 先写一条自然的接续\n\n首帧：女子倚在窗边，右手拿杯，看向室内。\n\n```text\n她听见窗外有人叫她，视线先移向窗外，随后身体稍稍转过去。右手仍稳稳拿着杯子，没有端起来喝。窗帘在她转身后轻碰一下肩侧。镜头保持原来的中景和位置，安静地等她看清来人。\n```\n\n这段主要写**运动和变化**。没有重复定义衣服、鼻梁、窗框颜色。**输入图已经提供的内容，不必靠长段文字再建立一遍。**\n\n## 让这次任务有一个结尾状态\n\n\"她一直走\"适合探索动势。但进入多镜头制作时，知道最后停在哪儿更有帮助。\n\n\"她走到门边停住，仍没有打开门\"——既限定了进度，也给下一镜留了起点。\n\n如果最终要产品定帧，末尾要安排稳定，别直到最后都在转。如果要突然切断，允许动作未完成，切点由剪辑选。\n\n## 用时间表达关系，别迷信精确秒数\n\n可以写\"先停一下，再回头\"，也可以写\"前半段听见，后半段认出\"。对特定时长的任务，用粗时间段帮助整理，但要和实际设置一致。\n\n**关键对白或节拍，要用输出的音视频确认，不能凭提示词里的小数当完成标准。**\n\n## 多种运动同时存在时，先确定主动作\n\n人物转身、镜头环绕、窗帘大幅飘动、光线闪烁、焦点切换——它们会竞争注意力，也让你找不到是哪个出了问题。\n\n先测试人物或镜头中的**主要一项**，再决定要不要加其他变化。这是减少诊断歧义的方法，不是所有模型的隐藏机制。\n\n## 三个常见的失败入口\n\n| 症状 | 该修什么 | 别做什么 |\n| --- | --- | --- |\n| 动作从奇怪的姿态起步 | 修首帧，或调整动作 | 加\"自然\"两个字 |\n| 身份在运动中漂移 | 检查人脸信息够不够、转头幅度、遮挡、工具的参考能力；再选择缩小动作或分镜 | 无限强调\"不变脸\" |\n| 动作完成了，情绪没读出来 | 检查镜头能不能看到反应、刺激明不明确、剪辑有没有给停留时间 | 改表演句——它本身可能没错 |\n\n## 选择和剪辑也是生成流程的一部分\n\n从候选里选可用区间，不要求每个片段头尾都完美。可以剪掉破绽，**但不能剪掉必需的因果再宣称完成了任务**。\n\n评价时看实际片段，不看任务状态写着\"成功\"。\n\n后续衔接见[多镜头流程](/workflows/05-assets-multishot.md)，高风险动作见[预演](/workflows/06-previs.md)。\n\n## 一句话记住\n\n**先想清图片是第一帧还是身份参考。只写变化，不重复图里已有的。给一个结尾状态。**\n\n## 动手试试\n\n找一张有人物的照片（或者想象一张）。写一段图生视频提示词，要求：不重复描述照片里已经有的任何东西，只写接下来 5 秒发生了什么、最后停在什么状态。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [视频工具的官方说法](/references/official-video.md)","toc":[{"id":"workflows-04-image-to-video-section-0","title":"上传图片之前，先想清楚它扮演什么角色"},{"id":"workflows-04-image-to-video-section-1","title":"先写一条自然的接续"},{"id":"workflows-04-image-to-video-section-2","title":"让这次任务有一个结尾状态"},{"id":"workflows-04-image-to-video-section-3","title":"用时间表达关系，别迷信精确秒数"},{"id":"workflows-04-image-to-video-section-4","title":"多种运动同时存在时，先确定主动作"},{"id":"workflows-04-image-to-video-section-5","title":"三个常见的失败入口"},{"id":"workflows-04-image-to-video-section-6","title":"选择和剪辑也是生成流程的一部分"},{"id":"workflows-04-image-to-video-section-7","title":"一句话记住"},{"id":"workflows-04-image-to-video-section-8","title":"动手试试"}]},{"id":"workflows/05-assets-multishot","path":"workflows/05-assets-multishot.md","title":"25｜多镜头与资产：准备时可以丰富，提交时要克制","description":"资产库不是每次都要一起上传的文件夹。身份、造型、状态、本镜姿态四样分开管。已通过的画面才是接续的依据。","type":"Playbook","group":"workflows","tags":["资产","多镜头","交接","一致性"],"html":"<h1>25｜多镜头与资产：准备时可以丰富，提交时要克制<\/h1>\n<h2 id=\"workflows-05-assets-multishot-section-0\">问题在哪里<\/h2>\n<p>你准备了一个很全的角色资产库：正面、侧面、背面、三套衣服、五种表情、鞋底特写。然后每次生成都全部上传，再加一句\"保持一致\"。<\/p>\n<p>结果 AI 收到了一堆互相矛盾的信息：这一场穿的是哪套？表情该参考哪张？<\/p>\n<p><strong>资产库不是每次都要一起上传的文件夹。<\/strong><\/p>\n<h2 id=\"workflows-05-assets-multishot-section-1\">库里可以很全，一次只拿需要的<\/h2>\n<p>库里可以有：脸、服装、声音、行为习惯、场景、道具、不同状态。<\/p>\n<p>一个桌边近景可能只需要：脸、当前的上装、桌面环境。不必把背面鞋底、上一场的湿衣服、另一版发型全给进去。<\/p>\n<p>有些教程说\"资产库要做全\"，这个思路对。但<strong>把它扩展成\"参考越多越好\"，就背离了原本的目的<\/strong>。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-2\">四类东西，别混成一个\"角色包\"<\/h2>\n<p><strong>身份<\/strong>：跨越所有造型都不变的东西——脸、体型。\n<strong>造型<\/strong>：一场戏里保持——发型、服装、妆。\n<strong>状态<\/strong>：随剧情改变——湿了、破了、拿着什么。\n<strong>本镜姿态<\/strong>：这一个镜头的起点——从哪个姿势开始动。<\/p>\n<p>衣服可以换，脸不换。角色这一场紧张，不意味着每场都用紧张的表情参考。<\/p>\n<p>声音也一样：稳定的声线和这次的台词表演分开，别让\"这场压低声音\"变成之后所有场次的固定人格。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-3\">给每个镜头一张很薄的任务卡<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">镜头：S04，接 S03。\n本镜任务：她从桌上拿起产品，停在能看清标签的位置。\n引用：人物 A 已批准的身份；造型 A-室内；产品瓶身 V2；桌边首帧 S04-V1。\n起点：瓶子在桌上，盖子关着；她双手空着。\n终点：瓶子在右手，盖子仍关着；人物仍坐着。\n本次开放：自然的手指调整和衣袖跟随。\n本次必查：瓶型、字标、拿瓶的手、起终状态。\n<\/code><\/pre>\n<p>这张卡是<strong>给团队看的说明<\/strong>。给 AI 的时候，只编入它支持并需要的内容。<strong>别指望一个内部文件名就能自动唤起没上传的资产。<\/strong><\/p>\n<h2 id=\"workflows-05-assets-multishot-section-4\">镜头交接，记\"实际发生了什么\"<\/h2>\n<p>如果生成出来，角色最后把瓶子放回了桌上——不能因为提示词要求\"拿着\"，就让下一镜按\"右手持瓶\"生成。<\/p>\n<p>要么接受\"放回\"的改动，要么修当前镜头。<strong>已经批准的画面状态，才是接续的依据。<\/strong><\/p>\n<p>批准记录只需要知道：哪条片段、哪一段时间可用、和原计划有什么有意的差别、下一镜从什么状态开始。别在多个文件里手工维护互相冲突的\"最新状态\"。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-5\">场景参考先检查：是不是同一间房<\/h2>\n<p>门、窗、大件家具的相对位置要一致。反打镜头不是生成一间风格相近的新房间。<\/p>\n<p>少量的主视图、反打、平面图，常比一张细节很小的九宫格更容易检查。需要哪些角度，由镜头计划决定。<\/p>\n<p>四视图也没有\"横图坏、竖图好\"的固定规则。关键是：需要的脸和服装信息够不够清楚、各视图是不是同一个人、输入后有没有缩小到看不清细节。<\/p>\n<h2 id=\"workflows-05-assets-multishot-section-6\">声画和后期共享同一个决定<\/h2>\n<p>人物在 S04 做了决定，音乐的转折不应该还按旧版的 S05 才开始。台词删了一句，字幕和口型也要检查。服装状态更新了，只重做受影响的镜头。<\/p>\n<p>不必把所有创意冻结成一套大型资产管理系统。一部短片，用一个明确当前版本的总说明、镜头卡、通过片段的索引就可以开始。<strong>规模大了再加工具。<\/strong><\/p>\n<h2 id=\"workflows-05-assets-multishot-section-7\">交付前看整个序列<\/h2>\n<p>单条片段漂亮，不代表拼起来成立。检查：角色的视线方向、空间地标、声音连续、产品和道具状态、节奏起落。<\/p>\n<p><strong>看序列时先放下提示词，像普通观众一样看一遍，再做技术检查。<\/strong><\/p>\n<h2 id=\"workflows-05-assets-multishot-section-8\">一句话记住<\/h2>\n<p><strong>库可以全，每次只拿需要的。身份、造型、状态、本镜姿态四样分开。接下一镜的依据是通过的画面，不是提示词。<\/strong><\/p>\n<h2 id=\"workflows-05-assets-multishot-section-9\">动手试试<\/h2>\n<p>为一个三镜头的小片段（比如\"进门、放包、坐下\"）写三张薄任务卡。每张只写：本镜任务、起点、终点、必查。然后检查：镜头 2 的起点是不是镜头 1 的终点？<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 25｜多镜头与资产：准备时可以丰富，提交时要克制\n\n## 问题在哪里\n\n你准备了一个很全的角色资产库：正面、侧面、背面、三套衣服、五种表情、鞋底特写。然后每次生成都全部上传，再加一句\"保持一致\"。\n\n结果 AI 收到了一堆互相矛盾的信息：这一场穿的是哪套？表情该参考哪张？\n\n**资产库不是每次都要一起上传的文件夹。**\n\n## 库里可以很全，一次只拿需要的\n\n库里可以有：脸、服装、声音、行为习惯、场景、道具、不同状态。\n\n一个桌边近景可能只需要：脸、当前的上装、桌面环境。不必把背面鞋底、上一场的湿衣服、另一版发型全给进去。\n\n有些教程说\"资产库要做全\"，这个思路对。但**把它扩展成\"参考越多越好\"，就背离了原本的目的**。\n\n## 四类东西，别混成一个\"角色包\"\n\n**身份**：跨越所有造型都不变的东西——脸、体型。\n**造型**：一场戏里保持——发型、服装、妆。\n**状态**：随剧情改变——湿了、破了、拿着什么。\n**本镜姿态**：这一个镜头的起点——从哪个姿势开始动。\n\n衣服可以换，脸不换。角色这一场紧张，不意味着每场都用紧张的表情参考。\n\n声音也一样：稳定的声线和这次的台词表演分开，别让\"这场压低声音\"变成之后所有场次的固定人格。\n\n## 给每个镜头一张很薄的任务卡\n\n```text\n镜头：S04，接 S03。\n本镜任务：她从桌上拿起产品，停在能看清标签的位置。\n引用：人物 A 已批准的身份；造型 A-室内；产品瓶身 V2；桌边首帧 S04-V1。\n起点：瓶子在桌上，盖子关着；她双手空着。\n终点：瓶子在右手，盖子仍关着；人物仍坐着。\n本次开放：自然的手指调整和衣袖跟随。\n本次必查：瓶型、字标、拿瓶的手、起终状态。\n```\n\n这张卡是**给团队看的说明**。给 AI 的时候，只编入它支持并需要的内容。**别指望一个内部文件名就能自动唤起没上传的资产。**\n\n## 镜头交接，记\"实际发生了什么\"\n\n如果生成出来，角色最后把瓶子放回了桌上——不能因为提示词要求\"拿着\"，就让下一镜按\"右手持瓶\"生成。\n\n要么接受\"放回\"的改动，要么修当前镜头。**已经批准的画面状态，才是接续的依据。**\n\n批准记录只需要知道：哪条片段、哪一段时间可用、和原计划有什么有意的差别、下一镜从什么状态开始。别在多个文件里手工维护互相冲突的\"最新状态\"。\n\n## 场景参考先检查：是不是同一间房\n\n门、窗、大件家具的相对位置要一致。反打镜头不是生成一间风格相近的新房间。\n\n少量的主视图、反打、平面图，常比一张细节很小的九宫格更容易检查。需要哪些角度，由镜头计划决定。\n\n四视图也没有\"横图坏、竖图好\"的固定规则。关键是：需要的脸和服装信息够不够清楚、各视图是不是同一个人、输入后有没有缩小到看不清细节。\n\n## 声画和后期共享同一个决定\n\n人物在 S04 做了决定，音乐的转折不应该还按旧版的 S05 才开始。台词删了一句，字幕和口型也要检查。服装状态更新了，只重做受影响的镜头。\n\n不必把所有创意冻结成一套大型资产管理系统。一部短片，用一个明确当前版本的总说明、镜头卡、通过片段的索引就可以开始。**规模大了再加工具。**\n\n## 交付前看整个序列\n\n单条片段漂亮，不代表拼起来成立。检查：角色的视线方向、空间地标、声音连续、产品和道具状态、节奏起落。\n\n**看序列时先放下提示词，像普通观众一样看一遍，再做技术检查。**\n\n## 一句话记住\n\n**库可以全，每次只拿需要的。身份、造型、状态、本镜姿态四样分开。接下一镜的依据是通过的画面，不是提示词。**\n\n## 动手试试\n\n为一个三镜头的小片段（比如\"进门、放包、坐下\"）写三张薄任务卡。每张只写：本镜任务、起点、终点、必查。然后检查：镜头 2 的起点是不是镜头 1 的终点？\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"workflows-05-assets-multishot-section-0","title":"问题在哪里"},{"id":"workflows-05-assets-multishot-section-1","title":"库里可以很全，一次只拿需要的"},{"id":"workflows-05-assets-multishot-section-2","title":"四类东西，别混成一个\"角色包\""},{"id":"workflows-05-assets-multishot-section-3","title":"给每个镜头一张很薄的任务卡"},{"id":"workflows-05-assets-multishot-section-4","title":"镜头交接，记\"实际发生了什么\""},{"id":"workflows-05-assets-multishot-section-5","title":"场景参考先检查：是不是同一间房"},{"id":"workflows-05-assets-multishot-section-6","title":"声画和后期共享同一个决定"},{"id":"workflows-05-assets-multishot-section-7","title":"交付前看整个序列"},{"id":"workflows-05-assets-multishot-section-8","title":"一句话记住"},{"id":"workflows-05-assets-multishot-section-9","title":"动手试试"}]},{"id":"workflows/06-previs","path":"workflows/06-previs.md","title":"26｜复杂镜头：什么时候该放下文字，先做预演","description":"文字不擅长精确的空间控制。多人同步、复杂遮挡、长路线、关键交接——这些先用草图、计时、粗模把空间变成能播放的东西。","type":"Playbook","group":"workflows","tags":["预演","Previs","复杂动作","控制"],"html":"<h1>26｜复杂镜头：什么时候该放下文字，先做预演<\/h1>\n<h2 id=\"workflows-06-previs-section-0\">什么是预演<\/h2>\n<p>预演（Previs）就是<strong>在正式制作之前，先用便宜的方式把镜头\"演\"一遍<\/strong>。可以是桌上摆几个小物件用手机拍、可以是纸上画几个站位、也可以是三维软件里搭个粗糙的模型。<\/p>\n<p>目的只有一个：<strong>确认空间和时间关系能不能成立<\/strong>，再决定花钱生成。<\/p>\n<h2 id=\"workflows-06-previs-section-1\">别让所有镜头都背上三维流程<\/h2>\n<p>一个人抬头、一个产品转台、一个固定的对话镜头——这些不需要粗模。<\/p>\n<p><strong>多人同步、复杂遮挡、长路线、关键交接、严格的运动节拍<\/strong>——这些才值得先把空间变成可以播放的东西。<\/p>\n<p>有个教程讲用编程工具控制运镜。它最值得保留的不是\"以后不要写运镜脚本\"，而是<strong>把关键的空间和时间关系变成可以观看的预演<\/strong>。<\/p>\n<h2 id=\"workflows-06-previs-section-2\">先写观众必须看懂的顺序<\/h2>\n<p>假设一个 30 秒长镜头要表现文件被调换。先确认观众要依次看到：原件 → 谁接近了 → 交换发生（或足够明确的证据）→ 后来谁拿着哪份。<\/p>\n<p>镜头路线围绕这些信息服务，<strong>而不是先画一条漂亮的曲线，再往里塞剧情。<\/strong><\/p>\n<p>如果想故意隐瞒交换，也要说明：观众此刻只需要怀疑，后面再揭示。这和\"动作不清楚却希望观众看懂\"是两回事。<\/p>\n<h2 id=\"workflows-06-previs-section-3\">在三维之前，先做最便宜的预演<\/h2>\n<p>桌面小物代替人物，手机拍路线。或者在平面草图上画两三处关键站位，读一遍台词并计时。<\/p>\n<p>确认能完成，再决定要不要用 Blender 之类的工具搭粗模。<\/p>\n<p><strong>时间不能只按路径长度推算。<\/strong> 接触、停顿、读信息、观众辨认，都可能比走路耗时。不要只得到\"30 秒足够\"一句结论，要实际播放节拍。<\/p>\n<h2 id=\"workflows-06-previs-section-4\">粗模要粗在外观，不粗在关键关系<\/h2>\n<p>人物可以是方块和球，场景可以是简化的墙。但<strong>关键道具能不能看见、人物和相机的路线、机位高度、遮挡、时间<\/strong>，要足够准确。<\/p>\n<p>如果剧情靠细小的手部交换，只有躯干方块的预演不能证明交换清楚。需要额外的代理物、示意动作，或者特写设计。<\/p>\n<p>可以交给制作助手的说明：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">按已确认的镜头说明建立简化预演，不重新改剧情。人物用不同颜色的简单体块区分，关键道具单独建代理物。先输出俯视布局和三个信息关键时刻的机位，再输出连续的相机运动。如果现有空间看不清道具交接，提出最小改动方案，而不是偷偷移动门窗或省略动作。外观参考只提供空间辅助，最终采用的调整要写回镜头说明。\n<\/code><\/pre>\n<p>这是制作任务的说明，不是提交给视频模型的提示词。<\/p>\n<h2 id=\"workflows-06-previs-section-5\">分清三种预演输出<\/h2>\n<p><strong>给人审查的说明版<\/strong>：可以带人物名、时间、箭头、轨迹。\n<strong>给模型的运动参考<\/strong>：尽量去掉会被误当成成片的辅助标记。\n<strong>可编辑的工程文件<\/strong>：保留路线和机位，方便修改。<\/p>\n<p>不必每次都做全部三种。谁要用，就给适合谁的版本。<\/p>\n<h2 id=\"workflows-06-previs-section-6\">交给生成器时，说清每个参考的职责<\/h2>\n<p>运动视频用于相机、人物位置、节奏。外观资产用于人物和场景外貌。当前提示词描述情绪、材料、必要细节。<\/p>\n<p><strong>生成器能不能可靠地分离这些职责，必须按实际工具测试。<\/strong> 文字说\"只学运动\"不是保证。<\/p>\n<p>模型不支持当前长度或参考模式时，缩短为几个可衔接的段落，或者换工具。别把某个第三方界面显示过的时长，当成所有接口都支持的规格。<\/p>\n<h2 id=\"workflows-06-previs-section-7\">预演通过了，最终片仍要验<\/h2>\n<p>几何连续不等于人物身份连续。路线正确不等于道具没漂移。动作准时不等于情绪成立。<\/p>\n<p>用<a href=\"#/workflows/07-evaluate-repair\">评价与修复<\/a>分别看内容、表达和技术。完整例子见<a href=\"#/cases/08-object-exchange\">两份文件案例<\/a>。<\/p>\n<h2 id=\"workflows-06-previs-section-8\">一句话记住<\/h2>\n<p><strong>空间和时间关系复杂时，先用最便宜的方式演一遍。粗模粗在外观，不粗在关键关系。<\/strong><\/p>\n<h2 id=\"workflows-06-previs-section-9\">动手试试<\/h2>\n<p>想一个两人交换物品的镜头。用桌上的两个杯子和一支笔当道具，用手机拍一遍你想要的机位和路线。看看：交换那一瞬间，两只手都在画面里吗？<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a>\n[3] <a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/p>\n<\/details>","text":"# 26｜复杂镜头：什么时候该放下文字，先做预演\n\n## 什么是预演\n\n预演（Previs）就是**在正式制作之前，先用便宜的方式把镜头\"演\"一遍**。可以是桌上摆几个小物件用手机拍、可以是纸上画几个站位、也可以是三维软件里搭个粗糙的模型。\n\n目的只有一个：**确认空间和时间关系能不能成立**，再决定花钱生成。\n\n## 别让所有镜头都背上三维流程\n\n一个人抬头、一个产品转台、一个固定的对话镜头——这些不需要粗模。\n\n**多人同步、复杂遮挡、长路线、关键交接、严格的运动节拍**——这些才值得先把空间变成可以播放的东西。\n\n有个教程讲用编程工具控制运镜。它最值得保留的不是\"以后不要写运镜脚本\"，而是**把关键的空间和时间关系变成可以观看的预演**。\n\n## 先写观众必须看懂的顺序\n\n假设一个 30 秒长镜头要表现文件被调换。先确认观众要依次看到：原件 → 谁接近了 → 交换发生（或足够明确的证据）→ 后来谁拿着哪份。\n\n镜头路线围绕这些信息服务，**而不是先画一条漂亮的曲线，再往里塞剧情。**\n\n如果想故意隐瞒交换，也要说明：观众此刻只需要怀疑，后面再揭示。这和\"动作不清楚却希望观众看懂\"是两回事。\n\n## 在三维之前，先做最便宜的预演\n\n桌面小物代替人物，手机拍路线。或者在平面草图上画两三处关键站位，读一遍台词并计时。\n\n确认能完成，再决定要不要用 Blender 之类的工具搭粗模。\n\n**时间不能只按路径长度推算。** 接触、停顿、读信息、观众辨认，都可能比走路耗时。不要只得到\"30 秒足够\"一句结论，要实际播放节拍。\n\n## 粗模要粗在外观，不粗在关键关系\n\n人物可以是方块和球，场景可以是简化的墙。但**关键道具能不能看见、人物和相机的路线、机位高度、遮挡、时间**，要足够准确。\n\n如果剧情靠细小的手部交换，只有躯干方块的预演不能证明交换清楚。需要额外的代理物、示意动作，或者特写设计。\n\n可以交给制作助手的说明：\n\n```text\n按已确认的镜头说明建立简化预演，不重新改剧情。人物用不同颜色的简单体块区分，关键道具单独建代理物。先输出俯视布局和三个信息关键时刻的机位，再输出连续的相机运动。如果现有空间看不清道具交接，提出最小改动方案，而不是偷偷移动门窗或省略动作。外观参考只提供空间辅助，最终采用的调整要写回镜头说明。\n```\n\n这是制作任务的说明，不是提交给视频模型的提示词。\n\n## 分清三种预演输出\n\n**给人审查的说明版**：可以带人物名、时间、箭头、轨迹。\n**给模型的运动参考**：尽量去掉会被误当成成片的辅助标记。\n**可编辑的工程文件**：保留路线和机位，方便修改。\n\n不必每次都做全部三种。谁要用，就给适合谁的版本。\n\n## 交给生成器时，说清每个参考的职责\n\n运动视频用于相机、人物位置、节奏。外观资产用于人物和场景外貌。当前提示词描述情绪、材料、必要细节。\n\n**生成器能不能可靠地分离这些职责，必须按实际工具测试。** 文字说\"只学运动\"不是保证。\n\n模型不支持当前长度或参考模式时，缩短为几个可衔接的段落，或者换工具。别把某个第三方界面显示过的时长，当成所有接口都支持的规格。\n\n## 预演通过了，最终片仍要验\n\n几何连续不等于人物身份连续。路线正确不等于道具没漂移。动作准时不等于情绪成立。\n\n用[评价与修复](/workflows/07-evaluate-repair.md)分别看内容、表达和技术。完整例子见[两份文件案例](/cases/08-object-exchange.md)。\n\n## 一句话记住\n\n**空间和时间关系复杂时，先用最便宜的方式演一遍。粗模粗在外观，不粗在关键关系。**\n\n## 动手试试\n\n想一个两人交换物品的镜头。用桌上的两个杯子和一支笔当道具，用手机拍一遍你想要的机位和路线。看看：交换那一瞬间，两只手都在画面里吗？\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)\n[3] [视频工具的官方说法](/references/official-video.md)","toc":[{"id":"workflows-06-previs-section-0","title":"什么是预演"},{"id":"workflows-06-previs-section-1","title":"别让所有镜头都背上三维流程"},{"id":"workflows-06-previs-section-2","title":"先写观众必须看懂的顺序"},{"id":"workflows-06-previs-section-3","title":"在三维之前，先做最便宜的预演"},{"id":"workflows-06-previs-section-4","title":"粗模要粗在外观，不粗在关键关系"},{"id":"workflows-06-previs-section-5","title":"分清三种预演输出"},{"id":"workflows-06-previs-section-6","title":"交给生成器时，说清每个参考的职责"},{"id":"workflows-06-previs-section-7","title":"预演通过了，最终片仍要验"},{"id":"workflows-06-previs-section-8","title":"一句话记住"},{"id":"workflows-06-previs-section-9","title":"动手试试"}]},{"id":"workflows/07-evaluate-repair","path":"workflows/07-evaluate-repair.md","title":"27｜评价与修复：别用\"AI 味\"三个字掩盖问题在哪","description":"看成片之前先写两个判断点。失败分层，一次改一件主要的事。停止条件也要写。","type":"Playbook","group":"workflows","tags":["评价","修复","试验","停止条件"],"html":"<h1>27｜评价与修复：别用\"AI 味\"三个字掩盖问题在哪<\/h1>\n<h2 id=\"workflows-07-evaluate-repair-section-0\">问题在哪里<\/h2>\n<p>生成出来了，看了一眼，\"有点 AI 味\"。然后呢？改提示词？换模型？加\"真实自然\"？<\/p>\n<p>\"AI 味\"是一个感觉，不是一个诊断。<strong>你得知道具体是哪里出了问题，才知道该修哪一层。<\/strong><\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-1\">看成片之前，先写两个判断点<\/h2>\n<p>比如：\"观众能认出是同一瓶产品\"和\"结尾感到松开，而不是虚弱\"。<\/p>\n<p>判断点不用多，但必须对应这个项目。技术上没问题、却完全不像品牌想要的表达，也不能通过。<\/p>\n<p><strong>第一次看，不读提示词<\/strong>，只写看到了什么、听到了什么。<strong>第二次再对照任务。<\/strong> 这样不容易被自己投入的文字说服。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-2\">失败分层，再动手<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>看起来是这样<\/th>\n<th>先检查什么<\/th>\n<th>优先往哪个方向改<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>画面漂亮但没说清什么<\/td>\n<td>感受和信息任务<\/td>\n<td>重选落点或观看方式<\/td>\n<\/tr>\n<tr>\n<td>人物像在示范表情<\/td>\n<td>情境、对象、主动作<\/td>\n<td>减少表情清单，补真实任务<\/td>\n<\/tr>\n<tr>\n<td>手和东西乱<\/td>\n<td>首帧、拿着什么、接触复杂度<\/td>\n<td>简化动作或拆镜，补有效参考<\/td>\n<\/tr>\n<tr>\n<td>场景变了<\/td>\n<td>多张图的布局是否一致<\/td>\n<td>先修场景事实，不先调色<\/td>\n<\/tr>\n<tr>\n<td>底图像贴上去的<\/td>\n<td>光、尺度、边缘、透视<\/td>\n<td>回到图像关系，不是直接加颗粒<\/td>\n<\/tr>\n<tr>\n<td>配音机械<\/td>\n<td>台词、角色差异、节奏、声音模式<\/td>\n<td>先判断哪层错了，再试听修改<\/td>\n<\/tr>\n<tr>\n<td>切起来很突然<\/td>\n<td>起终状态、声音桥、节拍<\/td>\n<td>改选片区间或补接头<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"workflows-07-evaluate-repair-section-3\">一次改一件主要的事，不是只许改一个字<\/h2>\n<p>假设问题是\"紧张不明显\"。可以做两个候选：加一处手部停顿，或者改变景别让原本的反应能被看见。<\/p>\n<p><strong>先不要同时换演员、灯光、模型和运镜<\/strong>，否则你不知道是哪个解决了问题。<\/p>\n<p>必要时可以一次改一组互相依赖的小东西：移动花瓶就需要同时改旧位置的背景和新阴影。别为了\"单变量\"故意让画面不完整。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-4\">保持比较条件尽可能相近<\/h2>\n<p>记录：工具和模型版本、输入素材、设置、提示词、选取的区间。<\/p>\n<p>如果工具支持种子（seed），可以保留用于同条件比较。但不同工具或模型的同一个种子数字，不意味着相同的随机过程。<\/p>\n<p><strong>相同设置也可能得到不同结果。<\/strong> 不要只展示最成功的样本，然后说这是普遍规律。积累经验时，至少留下失败的类型和适用范围。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-5\">用失败去改变假设<\/h2>\n<p>假设\"缺手部动作导致人物僵硬\"。加了动作还是僵硬——先检查是不是其实机位看不到反应、声音太规整、或者首帧姿态不合适。<\/p>\n<p><strong>不要把失败解释为\"提示词还不够长\"，然后继续添动作。<\/strong><\/p>\n<p>如果多次尝试都只能得到不稳定的指尖操作，任务形式可能应该改成更容易看清的大动作，或者用剪辑解决，而不是继续追求一镜到底。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-6\">停止条件也要写<\/h2>\n<p><strong>什么时候停<\/strong>：关键任务通过了，局部缺陷可以在后期低成本修复。继续生成可能只是在追求说不清的\"更好\"。<\/p>\n<p><strong>什么时候回头<\/strong>：核心表达仍然错，局部精修没有意义。应该返回创作方案。<\/p>\n<p><strong>什么时候换路<\/strong>：工具不适合所需的控制。换路线，别继续消耗。<\/p>\n<p>\"通过\"建议分三档：<strong>可用 / 可用但需指定修补 / 需重做<\/strong>。别让\"还可以\"变成没人知道下一步做什么的状态。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-7\">复盘时留下能迁移的知识<\/h2>\n<p>不记\"这条提示很神\"，记：<strong>在什么输入、什么动作、什么画幅下，哪些关系表达有效，哪些控制不可靠。<\/strong><\/p>\n<p>保留成功和失败片段的索引。没有真实媒体时，只标为\"创作假设\"。<\/p>\n<p>配套评审表见<a href=\"#/practice/03-review-rubric\">评价表<\/a>。<\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-8\">一句话记住<\/h2>\n<p><strong>先写判断点，再看片。失败分层，一次改一件主要的事。写清什么时候停、什么时候回头、什么时候换路。<\/strong><\/p>\n<h2 id=\"workflows-07-evaluate-repair-section-9\">动手试试<\/h2>\n<p>下次生成之后，先不读提示词，写下你看到和听到的三件事。然后对照提示词，看哪些是你写了但没出现的，哪些是你没写但出现了的。第二类往往更值得研究。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/p>\n<\/details>","text":"# 27｜评价与修复：别用\"AI 味\"三个字掩盖问题在哪\n\n## 问题在哪里\n\n生成出来了，看了一眼，\"有点 AI 味\"。然后呢？改提示词？换模型？加\"真实自然\"？\n\n\"AI 味\"是一个感觉，不是一个诊断。**你得知道具体是哪里出了问题，才知道该修哪一层。**\n\n## 看成片之前，先写两个判断点\n\n比如：\"观众能认出是同一瓶产品\"和\"结尾感到松开，而不是虚弱\"。\n\n判断点不用多，但必须对应这个项目。技术上没问题、却完全不像品牌想要的表达，也不能通过。\n\n**第一次看，不读提示词**，只写看到了什么、听到了什么。**第二次再对照任务。** 这样不容易被自己投入的文字说服。\n\n## 失败分层，再动手\n\n| 看起来是这样 | 先检查什么 | 优先往哪个方向改 |\n| --- | --- | --- |\n| 画面漂亮但没说清什么 | 感受和信息任务 | 重选落点或观看方式 |\n| 人物像在示范表情 | 情境、对象、主动作 | 减少表情清单，补真实任务 |\n| 手和东西乱 | 首帧、拿着什么、接触复杂度 | 简化动作或拆镜，补有效参考 |\n| 场景变了 | 多张图的布局是否一致 | 先修场景事实，不先调色 |\n| 底图像贴上去的 | 光、尺度、边缘、透视 | 回到图像关系，不是直接加颗粒 |\n| 配音机械 | 台词、角色差异、节奏、声音模式 | 先判断哪层错了，再试听修改 |\n| 切起来很突然 | 起终状态、声音桥、节拍 | 改选片区间或补接头 |\n\n## 一次改一件主要的事，不是只许改一个字\n\n假设问题是\"紧张不明显\"。可以做两个候选：加一处手部停顿，或者改变景别让原本的反应能被看见。\n\n**先不要同时换演员、灯光、模型和运镜**，否则你不知道是哪个解决了问题。\n\n必要时可以一次改一组互相依赖的小东西：移动花瓶就需要同时改旧位置的背景和新阴影。别为了\"单变量\"故意让画面不完整。\n\n## 保持比较条件尽可能相近\n\n记录：工具和模型版本、输入素材、设置、提示词、选取的区间。\n\n如果工具支持种子（seed），可以保留用于同条件比较。但不同工具或模型的同一个种子数字，不意味着相同的随机过程。\n\n**相同设置也可能得到不同结果。** 不要只展示最成功的样本，然后说这是普遍规律。积累经验时，至少留下失败的类型和适用范围。\n\n## 用失败去改变假设\n\n假设\"缺手部动作导致人物僵硬\"。加了动作还是僵硬——先检查是不是其实机位看不到反应、声音太规整、或者首帧姿态不合适。\n\n**不要把失败解释为\"提示词还不够长\"，然后继续添动作。**\n\n如果多次尝试都只能得到不稳定的指尖操作，任务形式可能应该改成更容易看清的大动作，或者用剪辑解决，而不是继续追求一镜到底。\n\n## 停止条件也要写\n\n**什么时候停**：关键任务通过了，局部缺陷可以在后期低成本修复。继续生成可能只是在追求说不清的\"更好\"。\n\n**什么时候回头**：核心表达仍然错，局部精修没有意义。应该返回创作方案。\n\n**什么时候换路**：工具不适合所需的控制。换路线，别继续消耗。\n\n\"通过\"建议分三档：**可用 / 可用但需指定修补 / 需重做**。别让\"还可以\"变成没人知道下一步做什么的状态。\n\n## 复盘时留下能迁移的知识\n\n不记\"这条提示很神\"，记：**在什么输入、什么动作、什么画幅下，哪些关系表达有效，哪些控制不可靠。**\n\n保留成功和失败片段的索引。没有真实媒体时，只标为\"创作假设\"。\n\n配套评审表见[评价表](/practice/03-review-rubric.md)。\n\n## 一句话记住\n\n**先写判断点，再看片。失败分层，一次改一件主要的事。写清什么时候停、什么时候回头、什么时候换路。**\n\n## 动手试试\n\n下次生成之后，先不读提示词，写下你看到和听到的三件事。然后对照提示词，看哪些是你写了但没出现的，哪些是你没写但出现了的。第二类往往更值得研究。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [视频工具的官方说法](/references/official-video.md)","toc":[{"id":"workflows-07-evaluate-repair-section-0","title":"问题在哪里"},{"id":"workflows-07-evaluate-repair-section-1","title":"看成片之前，先写两个判断点"},{"id":"workflows-07-evaluate-repair-section-2","title":"失败分层，再动手"},{"id":"workflows-07-evaluate-repair-section-3","title":"一次改一件主要的事，不是只许改一个字"},{"id":"workflows-07-evaluate-repair-section-4","title":"保持比较条件尽可能相近"},{"id":"workflows-07-evaluate-repair-section-5","title":"用失败去改变假设"},{"id":"workflows-07-evaluate-repair-section-6","title":"停止条件也要写"},{"id":"workflows-07-evaluate-repair-section-7","title":"复盘时留下能迁移的知识"},{"id":"workflows-07-evaluate-repair-section-8","title":"一句话记住"},{"id":"workflows-07-evaluate-repair-section-9","title":"动手试试"}]},{"id":"workflows/08-model-adaptation","path":"workflows/08-model-adaptation.md","title":"28｜工具适配：同一个创意，不必用同一段提示词","description":"创意层不变，输入方式随工具变。查六项能力，防三个假精确。附同一镜头的四种提交方式。","type":"Playbook","group":"workflows","tags":["工具","适配","模型","接口"],"html":"<h1>28｜工具适配：同一个创意，不必用同一段提示词<\/h1>\n<h2 id=\"workflows-08-model-adaptation-section-0\">先保留共同的创意，再改变输入方式<\/h2>\n<p><strong>共同创意<\/strong>：一个人听见有人叫自己，回头认出朋友，笑容展开。镜头安静不动。<\/p>\n<p><strong>文字生图探索<\/strong>——需要先建立一个瞬间：<\/p>\n<blockquote>\n<p>午后车站，一个年轻人刚认出镜头外的朋友。身体仍朝着站台，脸已经转向声音来的方向，笑意刚开始展开。平视中景，环境明亮，人物旁保留少量人流空间。<\/p>\n<\/blockquote>\n<p><strong>有确定首帧的图生视频<\/strong>——重点是接续：<\/p>\n<blockquote>\n<p>他听到画面右侧有人叫自己，转头看过去，认出对方后笑了。镜头保持原位。<\/p>\n<\/blockquote>\n<p><strong>多模态参考生成<\/strong>——还要说清哪张图管什么：<\/p>\n<blockquote>\n<p>人物外观采用已绑定的人物参考，站台布局采用场景参考。本镜从人物侧身站立开始，按上述反应生成。不继承人物参考里的棚拍背景。<\/p>\n<\/blockquote>\n<p><strong>对话式图像编辑<\/strong>——只改当前帧需要的事：<\/p>\n<blockquote>\n<p>保留人物身份、衣服和站台。只把表情调整到刚认出熟人的自然笑意，头部朝向不变。<\/p>\n<\/blockquote>\n<p>这四段不是四种审美，而是<strong>四种任务<\/strong>。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-1\">换工具时，查六项能力<\/h2>\n<ol>\n<li><strong>输入角色<\/strong>：首帧、尾帧、身份、风格、运动、布局参考——它分得清吗？<\/li>\n<li><strong>参考限制<\/strong>：数量、格式、长度、分辨率、怎么引用。<\/li>\n<li><strong>文字偏好<\/strong>：简洁自然句、分段描述、参数词，还是专用标签？<\/li>\n<li><strong>声音<\/strong>：能生成吗？能关闭吗？台词和说明能分开输入吗？<\/li>\n<li><strong>时长和镜头<\/strong>：实际输出多长？多镜头怎么处理？能编辑和续接吗？<\/li>\n<li><strong>负向约束<\/strong>：有单独的负向栏吗？普通否定推荐吗？冲突时怎么表现？<\/li>\n<\/ol>\n<p><strong>这些必须按你实际用的入口确认<\/strong>，不从教程截图、营销标题、或另一家转售接口推断。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-2\">官方资料能支持到哪里<\/h2>\n<p>Midjourney 的基础指南仍然重视短而清楚的表达。Runway 的图生视频指南区分\"图像提供的静态信息\"和\"提示词提供的运动\"。Google 的视频指南允许按主体、动作、环境、机位等维度组织，同时提醒部分高级镜头效果的可靠性会变化。<\/p>\n<p><strong>这些是工具自己的指导，不是跨模型的统一定律。<\/strong> Runway Gen-4 建议正向表述，不等于所有生成系统都禁止负向提示。详见<a href=\"#/references/official-image\">图像工具的官方说法<\/a>和<a href=\"#/references/official-video\">视频工具的官方说法<\/a>。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-3\">否定句怎么处理<\/h2>\n<p>创作说明里可以写\"不要夸张惊吓\"，用来区分目标。<\/p>\n<p>在更偏好正向描述的工具里，可以转成\"反应小，先停一下，再自然回头\"。<\/p>\n<p>必要的内容边界和安全要求，不能因为\"正向提示更好\"就被抹掉。用工具支持的实际控制方式。<\/p>\n<p>\"固定机位\"通常比一串\"不摇、不推、不绕\"更容易读，但也不能保证工具真的不动。检查结果，必要时改路线。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-4\">防三个假精确<\/h2>\n<p><strong>设备名<\/strong>：写\"ARRI Alexa\"是外观和拍摄的联想，不是已经调用了物理相机。\n<strong>秒数<\/strong>：提示里的秒数是节奏意图，不是逐帧执行的回执。\n<strong>角色编号<\/strong>：编号是指认方式，不是无需上传的永久记忆。<\/p>\n<p>参数真的能在界面或 API 里落实时，才把它当实际配置。没有专用控制时，把效果写成<strong>观众能看到的结果<\/strong>，并承认仍需要挑选。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-5\">维护，不追新清单<\/h2>\n<p>这本书不提供\"哪个模型永远最好\"的排名。工具会变，但表演、美术、通感的方法不用随每次发布重写。<\/p>\n<p>只更新这一层：工具接口和第一方来源。已归档的旧指南（比如 Sora2 的提示指南）只用于回顾创作原则，不当作当前产品的能力表。<\/p>\n<h2 id=\"workflows-08-model-adaptation-section-6\">一句话记住<\/h2>\n<p><strong>创意不变，输入随工具变。换工具先查六项能力。设备名、秒数、编号都不是锁。<\/strong><\/p>\n<h2 id=\"workflows-08-model-adaptation-section-7\">动手试试<\/h2>\n<p>拿一个你熟悉的工具，用上面六项能力逐一回答。哪几项你其实不确定？去官方文档查一下，而不是凭印象。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-image\">图像工具的官方说法<\/a>\n[3] <a href=\"#/references/official-video\">视频工具的官方说法<\/a><\/p>\n<\/details>","text":"# 28｜工具适配：同一个创意，不必用同一段提示词\n\n## 先保留共同的创意，再改变输入方式\n\n**共同创意**：一个人听见有人叫自己，回头认出朋友，笑容展开。镜头安静不动。\n\n**文字生图探索**——需要先建立一个瞬间：\n> 午后车站，一个年轻人刚认出镜头外的朋友。身体仍朝着站台，脸已经转向声音来的方向，笑意刚开始展开。平视中景，环境明亮，人物旁保留少量人流空间。\n\n**有确定首帧的图生视频**——重点是接续：\n> 他听到画面右侧有人叫自己，转头看过去，认出对方后笑了。镜头保持原位。\n\n**多模态参考生成**——还要说清哪张图管什么：\n> 人物外观采用已绑定的人物参考，站台布局采用场景参考。本镜从人物侧身站立开始，按上述反应生成。不继承人物参考里的棚拍背景。\n\n**对话式图像编辑**——只改当前帧需要的事：\n> 保留人物身份、衣服和站台。只把表情调整到刚认出熟人的自然笑意，头部朝向不变。\n\n这四段不是四种审美，而是**四种任务**。\n\n## 换工具时，查六项能力\n\n1. **输入角色**：首帧、尾帧、身份、风格、运动、布局参考——它分得清吗？\n2. **参考限制**：数量、格式、长度、分辨率、怎么引用。\n3. **文字偏好**：简洁自然句、分段描述、参数词，还是专用标签？\n4. **声音**：能生成吗？能关闭吗？台词和说明能分开输入吗？\n5. **时长和镜头**：实际输出多长？多镜头怎么处理？能编辑和续接吗？\n6. **负向约束**：有单独的负向栏吗？普通否定推荐吗？冲突时怎么表现？\n\n**这些必须按你实际用的入口确认**，不从教程截图、营销标题、或另一家转售接口推断。\n\n## 官方资料能支持到哪里\n\nMidjourney 的基础指南仍然重视短而清楚的表达。Runway 的图生视频指南区分\"图像提供的静态信息\"和\"提示词提供的运动\"。Google 的视频指南允许按主体、动作、环境、机位等维度组织，同时提醒部分高级镜头效果的可靠性会变化。\n\n**这些是工具自己的指导，不是跨模型的统一定律。** Runway Gen-4 建议正向表述，不等于所有生成系统都禁止负向提示。详见[图像工具的官方说法](/references/official-image.md)和[视频工具的官方说法](/references/official-video.md)。\n\n## 否定句怎么处理\n\n创作说明里可以写\"不要夸张惊吓\"，用来区分目标。\n\n在更偏好正向描述的工具里，可以转成\"反应小，先停一下，再自然回头\"。\n\n必要的内容边界和安全要求，不能因为\"正向提示更好\"就被抹掉。用工具支持的实际控制方式。\n\n\"固定机位\"通常比一串\"不摇、不推、不绕\"更容易读，但也不能保证工具真的不动。检查结果，必要时改路线。\n\n## 防三个假精确\n\n**设备名**：写\"ARRI Alexa\"是外观和拍摄的联想，不是已经调用了物理相机。\n**秒数**：提示里的秒数是节奏意图，不是逐帧执行的回执。\n**角色编号**：编号是指认方式，不是无需上传的永久记忆。\n\n参数真的能在界面或 API 里落实时，才把它当实际配置。没有专用控制时，把效果写成**观众能看到的结果**，并承认仍需要挑选。\n\n## 维护，不追新清单\n\n这本书不提供\"哪个模型永远最好\"的排名。工具会变，但表演、美术、通感的方法不用随每次发布重写。\n\n只更新这一层：工具接口和第一方来源。已归档的旧指南（比如 Sora2 的提示指南）只用于回顾创作原则，不当作当前产品的能力表。\n\n## 一句话记住\n\n**创意不变，输入随工具变。换工具先查六项能力。设备名、秒数、编号都不是锁。**\n\n## 动手试试\n\n拿一个你熟悉的工具，用上面六项能力逐一回答。哪几项你其实不确定？去官方文档查一下，而不是凭印象。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [图像工具的官方说法](/references/official-image.md)\n[3] [视频工具的官方说法](/references/official-video.md)","toc":[{"id":"workflows-08-model-adaptation-section-0","title":"先保留共同的创意，再改变输入方式"},{"id":"workflows-08-model-adaptation-section-1","title":"换工具时，查六项能力"},{"id":"workflows-08-model-adaptation-section-2","title":"官方资料能支持到哪里"},{"id":"workflows-08-model-adaptation-section-3","title":"否定句怎么处理"},{"id":"workflows-08-model-adaptation-section-4","title":"防三个假精确"},{"id":"workflows-08-model-adaptation-section-5","title":"维护，不追新清单"},{"id":"workflows-08-model-adaptation-section-6","title":"一句话记住"},{"id":"workflows-08-model-adaptation-section-7","title":"动手试试"}]},{"id":"cases/index","path":"cases/index.md","title":"V · 完整案例","description":"","type":"Index","group":"cases","tags":[],"html":"<h1>V · 完整案例<\/h1>\n<p>八个从头走到尾的例子。每个都先给\"大多数人的第一稿\"，再说问题在哪、怎么想、最后写成什么样。全是设计样稿，没有实际生成过。<\/p>\n<ul>\n<li><p><a href=\"#/cases/01-brand-film\">29｜完整案例：30 秒洗发水品牌片《留一点空隙》<\/a> — 最完整的一个。从一句\"清爽治愈\"到 30 秒镜头表。先读这个。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/02-relationship\">30｜完整案例：餐桌上，一句没问出口的话<\/a> — 一只杯子和听者的反应。直接问的版本也不低级。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/03-big-emotion\">31｜完整案例：喜悦真的可以冲出来<\/a> — 大笑、奔跑、拥抱同样可以写得好。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/04-vlog\">32｜完整案例：谁在拍谁——12 秒咖啡馆 Vlog<\/a> — 镜头是一个物件：谁拿着、朝哪拍、什么时候放下。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/05-empty-corridor\">33｜完整案例：空走廊为什么会让人等下去<\/a> — 不用人脸、不用重型音乐的悬念。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/06-surreal-perfume\">34｜完整案例：不追求实拍的香水图与短动效<\/a> — 只偏离一条规则，其余保持稳定。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/07-comedy\">35｜完整案例：安静自习室里的零食袋<\/a> — 喜剧来自目标、阻力和反应。<\/p>\n<\/li>\n<li><p><a href=\"#/cases/08-object-exchange\">36｜完整案例：两份文件，谁最后拿着哪一份<\/a> — 状态表先于相机路线。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# V · 完整案例\n\n八个从头走到尾的例子。每个都先给\"大多数人的第一稿\"，再说问题在哪、怎么想、最后写成什么样。全是设计样稿，没有实际生成过。\n\n- [29｜完整案例：30 秒洗发水品牌片《留一点空隙》](/cases/01-brand-film.md) — 最完整的一个。从一句\"清爽治愈\"到 30 秒镜头表。先读这个。\n\n- [30｜完整案例：餐桌上，一句没问出口的话](/cases/02-relationship.md) — 一只杯子和听者的反应。直接问的版本也不低级。\n\n- [31｜完整案例：喜悦真的可以冲出来](/cases/03-big-emotion.md) — 大笑、奔跑、拥抱同样可以写得好。\n\n- [32｜完整案例：谁在拍谁——12 秒咖啡馆 Vlog](/cases/04-vlog.md) — 镜头是一个物件：谁拿着、朝哪拍、什么时候放下。\n\n- [33｜完整案例：空走廊为什么会让人等下去](/cases/05-empty-corridor.md) — 不用人脸、不用重型音乐的悬念。\n\n- [34｜完整案例：不追求实拍的香水图与短动效](/cases/06-surreal-perfume.md) — 只偏离一条规则，其余保持稳定。\n\n- [35｜完整案例：安静自习室里的零食袋](/cases/07-comedy.md) — 喜剧来自目标、阻力和反应。\n\n- [36｜完整案例：两份文件，谁最后拿着哪一份](/cases/08-object-exchange.md) — 状态表先于相机路线。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"cases/01-brand-film","path":"cases/01-brand-film.md","title":"29｜完整案例：30 秒洗发水品牌片《留一点空隙》","description":"从一句\"清爽治愈\"到 30 秒的镜头表。感受稿、三方案比较、声音结构、两段执行稿、验收清单，全程走一遍。","type":"CaseStudy","group":"cases","tags":["完整案例","品牌","音乐","洗护","通感"],"html":"<h1>29｜完整案例：30 秒洗发水品牌片《留一点空隙》<\/h1>\n<blockquote>\n<p>这是设计样稿。品牌和产品是虚构的，没有实际生成过图片、视频或配乐。\"参考 A\"\"瓶身 V2\"这些名字是制作时要建立的代称，不代表附件里真的有这些媒体。<\/p>\n<\/blockquote>\n<h2 id=\"cases-01-brand-film-section-0\">任务<\/h2>\n<p>30 秒品牌片。青绿色洗发水，茶叶和泡沫可以出现，但不必三样反复同框。<\/p>\n<p>客户的原话：\"清爽、治愈、有温度、轻快。\"<\/p>\n<h2 id=\"cases-01-brand-film-section-1\">大多数人的第一稿<\/h2>\n<blockquote>\n<p>一个美女在浴室洗头，泡沫丰富，水花飞溅，阳光透过窗户，清爽治愈，产品特写，电影感。<\/p>\n<\/blockquote>\n<p>问题：这是一个洗发水广告的<strong>模板<\/strong>，不是<strong>这个<\/strong>洗发水广告。\"清爽治愈\"是结论，没有过程。观众看完只记得\"又一个洗发水广告\"。<\/p>\n<h2 id=\"cases-01-brand-film-section-2\">第一步：把客户的形容词翻译成体验<\/h2>\n<p>\"清爽治愈有温度\"——观众看完到底要有什么感觉？<\/p>\n<p>我们定为：<strong>忙完一天之后，终于可以把注意力还给自己。<\/strong> 清爽是\"不挤\"，治愈是\"从被催促到可以慢一点\"，温度是\"不冷\"。<\/p>\n<p>同时划一条线：<strong>不把产品宣传成能解决情绪或人生问题。<\/strong> 它只是这一段时间里的一个东西。<\/p>\n<h2 id=\"cases-01-brand-film-section-3\">第二步：感受稿<\/h2>\n<blockquote>\n<p>一整天，声音都挤在她身上。回到家，水先替她把这些声音隔远。等她再走到窗边，风并没有变大，只是她终于给它留了位置。<\/p>\n<\/blockquote>\n<p>这段话里有两个通感：<strong>\"水隔远声音\"<strong>和<\/strong>\"给风留位置\"<\/strong>。它们不会被直接拍出来。<\/p>\n<p>\"水隔远声音\"落到：声音设计（嘈杂退远，水声占前景）和空间切换。不拍通知图标被水冲走。<\/p>\n<p>\"给风留位置\"落到：身体放松和构图开阔。不让墙壁变形。<\/p>\n<h2 id=\"cases-01-brand-film-section-4\">第三步：三个方案比较<\/h2>\n<p><strong>身体方案<\/strong>：从肩颈收紧到动作舒展。最直接，但容易被演成夸张的广告笑容。<\/p>\n<p><strong>材质方案<\/strong>：泡沫从密到薄，水纹由乱到稳。精致，但人的体验弱。<\/p>\n<p><strong>声音方案<\/strong>：从密集的近处声音，到水声主导，再到有间隔的音乐。最能表达\"空隙\"，但要考虑静音观看。<\/p>\n<p><strong>决定<\/strong>：声音当结构，身体当看得见的支撑，材质当中段的愉悦。静音时，也能通过取景从紧凑到开阔、动作速度、停留时间读到变化。<\/p>\n<h2 id=\"cases-01-brand-film-section-5\">第四步：美术和连续性<\/h2>\n<p>人物身份保持不变，分三个状态：回家、洗护中、洗护后。通过剪辑表现时间真的过去了，不把湿头发瞬间变干当产品效果。<\/p>\n<p>室内是同一个家，窗的方向、台面、产品位置有稳定关系。<\/p>\n<p>产品是按压瓶。包装字标和结构来自批准的参考。探索阶段用没有真实品牌的占位包装，最终字标在可编辑的流程里核对。茶叶只作为一处植物或材质联想，不暗示没确认过的成分和功效。<\/p>\n<h2 id=\"cases-01-brand-film-section-6\">第五步：30 秒剪辑设计<\/h2>\n<p><strong>注意：这是剪辑规划，不是一次生成的指令。<\/strong> 实际要按工具限制生成适合剪取的素材，再在时间线上落实。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>画面和主动作<\/th>\n<th>声音和表达任务<\/th>\n<th>生成时优先检查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–4 秒<\/td>\n<td>门内侧固定中景。她进门把包放下，手还短暂搭着包带<\/td>\n<td>外面的车声、零碎的室内声，音乐还很稀疏。\"人回来了，节奏还没回来\"<\/td>\n<td>放包的接触、门和包的去向<\/td>\n<\/tr>\n<tr>\n<td>4–7 秒<\/td>\n<td>桌面近景。手机屏幕朝下落在台面，手离开<\/td>\n<td>一声短接触，之后少一点信息噪声。不把手机拟人成反派<\/td>\n<td>手机不分裂，手离开后留半拍<\/td>\n<\/tr>\n<tr>\n<td>7–11 秒<\/td>\n<td>水流和湿发局部，明确进入洗护时段<\/td>\n<td>水声占前景，音乐开始有轻律动<\/td>\n<td>水的方向、头发湿态、避免不必要的身体范围<\/td>\n<\/tr>\n<tr>\n<td>11–15 秒<\/td>\n<td>按压瓶和手掌。一次按压，少量产品落到掌心<\/td>\n<td>泵头和液体的细声，清楚但不夸大<\/td>\n<td>泵头结构、出液位置、标签、手部<\/td>\n<\/tr>\n<tr>\n<td>15–20 秒<\/td>\n<td>洗护中的手和发丝局部，泡沫被慢慢带开<\/td>\n<td>音乐略展开，水声不消失。细节带来触感<\/td>\n<td>手和发丝、泡沫状态一致<\/td>\n<\/tr>\n<tr>\n<td>20–25 秒<\/td>\n<td>明确的时间跳切到洗护后。她在窗边把头发拨到肩后，停着感受一会儿风<\/td>\n<td>音乐更通透，室内声回来。不要求大笑<\/td>\n<td>干发状态、光源连续、动作不过度展示<\/td>\n<\/tr>\n<tr>\n<td>25–30 秒<\/td>\n<td>产品静物，背景留空。一道轻反光经过墙面后停稳<\/td>\n<td>配乐收束，结尾留余味。旁白可以是\"给今天，留一点空隙。\"<\/td>\n<td>包装正确，反光不盖字标，结尾稳定<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"cases-01-brand-film-section-7\">第六步：两段执行稿<\/h2>\n<h3 id=\"cases-01-brand-film-section-8\">S04 产品按压——第一个风险测试<\/h3>\n<p>先准备结构清楚的瓶身和泵头参考、可以继续动作的局部首帧。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">保留首帧的按压瓶、台面和双手位置。右手食指完成一次平稳按压，少量产品从出液口落入下方的左手掌心。松开后泵头回到起始高度。镜头固定，能看清泵头、出液口和手掌的关系。光线清楚柔和，玻璃和塑料结构保持真实，不突出夸张的飞溅。\n<\/code><\/pre>\n<p>如果接触一直不稳，改成\"泵头近景\"和\"掌心已有产品\"两个镜头，用声音连接。承认剪辑省略，不宣称获得了完美的连续按压。<\/p>\n<h3 id=\"cases-01-brand-film-section-9\">S06 舒展——不是摆出开心<\/h3>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">以洗护后的干发首帧开始。她站在窗边，把落在脸侧的一缕头发拨到肩后，手自然落下，之后不再忙着做下一件事。窗边微风只带动少量发梢。镜头安静留在原处，人物一侧有干净的空间。她的状态轻松、清醒，不需要对镜头微笑，也不刻意闭眼陶醉。\n<\/code><\/pre>\n<p>开篇已经展示了她忙碌，结尾不必再用旁白解释\"她终于放松了\"。<\/p>\n<h2 id=\"cases-01-brand-film-section-10\">第七步：音乐说明<\/h2>\n<p>目标律动约 118BPM，轻而有弹性的低音、清亮的短音、稀疏的打击乐。中段更展开，结尾减少声部。开头不直接铺满旋律，给门、包、手机的接触留位置。<\/p>\n<p>118BPM 下每拍约 0.51 秒，30 秒约 59 拍。这是按目标速度算的剪辑参考，不意味着生成的音频精确符合。<strong>别为了整齐把所有切点放在重拍上<\/strong>，按压和手机接触可以落在拍间，让动作不像示范操。<\/p>\n<h2 id=\"cases-01-brand-film-section-11\">第八步：制作顺序<\/h2>\n<ol>\n<li>先试泵头接触、湿发泡沫这两个高风险细节<\/li>\n<li>再试结尾的轻松状态<\/li>\n<li>选定音乐方向后排粗剪<\/li>\n<li>最后补开篇和产品静帧<\/li>\n<\/ol>\n<p>声音先行，不意味着画面无权改变节奏。两者互相调整。<\/p>\n<h2 id=\"cases-01-brand-film-section-12\">验收清单<\/h2>\n<ul>\n<li>去掉音乐，还能看出忙和松的变化吗？<\/li>\n<li>只听声音，有从挤到开阔的方向吗？<\/li>\n<li>产品的结构和使用方式可信吗？<\/li>\n<li>干湿状态的切换有时间跳跃的线索吗？<\/li>\n<li>最终收尾能清楚承载字标吗？<\/li>\n<\/ul>\n<h2 id=\"cases-01-brand-film-section-13\">如果失败了<\/h2>\n<p>观众只看到一个\"表演放松\"的模特 → 先减少结尾动作，不是继续加强微表情。\n中段像实验室特效 → 把材料变化收回正常洗护的尺度。\n画面已经足够柔和 → 别再给所有镜头叠梦幻辉光。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 29｜完整案例：30 秒洗发水品牌片《留一点空隙》\n\n> 这是设计样稿。品牌和产品是虚构的，没有实际生成过图片、视频或配乐。\"参考 A\"\"瓶身 V2\"这些名字是制作时要建立的代称，不代表附件里真的有这些媒体。\n\n## 任务\n\n30 秒品牌片。青绿色洗发水，茶叶和泡沫可以出现，但不必三样反复同框。\n\n客户的原话：\"清爽、治愈、有温度、轻快。\"\n\n## 大多数人的第一稿\n\n> 一个美女在浴室洗头，泡沫丰富，水花飞溅，阳光透过窗户，清爽治愈，产品特写，电影感。\n\n问题：这是一个洗发水广告的**模板**，不是**这个**洗发水广告。\"清爽治愈\"是结论，没有过程。观众看完只记得\"又一个洗发水广告\"。\n\n## 第一步：把客户的形容词翻译成体验\n\n\"清爽治愈有温度\"——观众看完到底要有什么感觉？\n\n我们定为：**忙完一天之后，终于可以把注意力还给自己。** 清爽是\"不挤\"，治愈是\"从被催促到可以慢一点\"，温度是\"不冷\"。\n\n同时划一条线：**不把产品宣传成能解决情绪或人生问题。** 它只是这一段时间里的一个东西。\n\n## 第二步：感受稿\n\n> 一整天，声音都挤在她身上。回到家，水先替她把这些声音隔远。等她再走到窗边，风并没有变大，只是她终于给它留了位置。\n\n这段话里有两个通感：**\"水隔远声音\"**和**\"给风留位置\"**。它们不会被直接拍出来。\n\n\"水隔远声音\"落到：声音设计（嘈杂退远，水声占前景）和空间切换。不拍通知图标被水冲走。\n\n\"给风留位置\"落到：身体放松和构图开阔。不让墙壁变形。\n\n## 第三步：三个方案比较\n\n**身体方案**：从肩颈收紧到动作舒展。最直接，但容易被演成夸张的广告笑容。\n\n**材质方案**：泡沫从密到薄，水纹由乱到稳。精致，但人的体验弱。\n\n**声音方案**：从密集的近处声音，到水声主导，再到有间隔的音乐。最能表达\"空隙\"，但要考虑静音观看。\n\n**决定**：声音当结构，身体当看得见的支撑，材质当中段的愉悦。静音时，也能通过取景从紧凑到开阔、动作速度、停留时间读到变化。\n\n## 第四步：美术和连续性\n\n人物身份保持不变，分三个状态：回家、洗护中、洗护后。通过剪辑表现时间真的过去了，不把湿头发瞬间变干当产品效果。\n\n室内是同一个家，窗的方向、台面、产品位置有稳定关系。\n\n产品是按压瓶。包装字标和结构来自批准的参考。探索阶段用没有真实品牌的占位包装，最终字标在可编辑的流程里核对。茶叶只作为一处植物或材质联想，不暗示没确认过的成分和功效。\n\n## 第五步：30 秒剪辑设计\n\n**注意：这是剪辑规划，不是一次生成的指令。** 实际要按工具限制生成适合剪取的素材，再在时间线上落实。\n\n| 时间 | 画面和主动作 | 声音和表达任务 | 生成时优先检查 |\n| --- | --- | --- | --- |\n| 0–4 秒 | 门内侧固定中景。她进门把包放下，手还短暂搭着包带 | 外面的车声、零碎的室内声，音乐还很稀疏。\"人回来了，节奏还没回来\" | 放包的接触、门和包的去向 |\n| 4–7 秒 | 桌面近景。手机屏幕朝下落在台面，手离开 | 一声短接触，之后少一点信息噪声。不把手机拟人成反派 | 手机不分裂，手离开后留半拍 |\n| 7–11 秒 | 水流和湿发局部，明确进入洗护时段 | 水声占前景，音乐开始有轻律动 | 水的方向、头发湿态、避免不必要的身体范围 |\n| 11–15 秒 | 按压瓶和手掌。一次按压，少量产品落到掌心 | 泵头和液体的细声，清楚但不夸大 | 泵头结构、出液位置、标签、手部 |\n| 15–20 秒 | 洗护中的手和发丝局部，泡沫被慢慢带开 | 音乐略展开，水声不消失。细节带来触感 | 手和发丝、泡沫状态一致 |\n| 20–25 秒 | 明确的时间跳切到洗护后。她在窗边把头发拨到肩后，停着感受一会儿风 | 音乐更通透，室内声回来。不要求大笑 | 干发状态、光源连续、动作不过度展示 |\n| 25–30 秒 | 产品静物，背景留空。一道轻反光经过墙面后停稳 | 配乐收束，结尾留余味。旁白可以是\"给今天，留一点空隙。\" | 包装正确，反光不盖字标，结尾稳定 |\n\n## 第六步：两段执行稿\n\n### S04 产品按压——第一个风险测试\n\n先准备结构清楚的瓶身和泵头参考、可以继续动作的局部首帧。\n\n```text\n保留首帧的按压瓶、台面和双手位置。右手食指完成一次平稳按压，少量产品从出液口落入下方的左手掌心。松开后泵头回到起始高度。镜头固定，能看清泵头、出液口和手掌的关系。光线清楚柔和，玻璃和塑料结构保持真实，不突出夸张的飞溅。\n```\n\n如果接触一直不稳，改成\"泵头近景\"和\"掌心已有产品\"两个镜头，用声音连接。承认剪辑省略，不宣称获得了完美的连续按压。\n\n### S06 舒展——不是摆出开心\n\n```text\n以洗护后的干发首帧开始。她站在窗边，把落在脸侧的一缕头发拨到肩后，手自然落下，之后不再忙着做下一件事。窗边微风只带动少量发梢。镜头安静留在原处，人物一侧有干净的空间。她的状态轻松、清醒，不需要对镜头微笑，也不刻意闭眼陶醉。\n```\n\n开篇已经展示了她忙碌，结尾不必再用旁白解释\"她终于放松了\"。\n\n## 第七步：音乐说明\n\n目标律动约 118BPM，轻而有弹性的低音、清亮的短音、稀疏的打击乐。中段更展开，结尾减少声部。开头不直接铺满旋律，给门、包、手机的接触留位置。\n\n118BPM 下每拍约 0.51 秒，30 秒约 59 拍。这是按目标速度算的剪辑参考，不意味着生成的音频精确符合。**别为了整齐把所有切点放在重拍上**，按压和手机接触可以落在拍间，让动作不像示范操。\n\n## 第八步：制作顺序\n\n1. 先试泵头接触、湿发泡沫这两个高风险细节\n2. 再试结尾的轻松状态\n3. 选定音乐方向后排粗剪\n4. 最后补开篇和产品静帧\n\n声音先行，不意味着画面无权改变节奏。两者互相调整。\n\n## 验收清单\n\n- 去掉音乐，还能看出忙和松的变化吗？\n- 只听声音，有从挤到开阔的方向吗？\n- 产品的结构和使用方式可信吗？\n- 干湿状态的切换有时间跳跃的线索吗？\n- 最终收尾能清楚承载字标吗？\n\n## 如果失败了\n\n观众只看到一个\"表演放松\"的模特 → 先减少结尾动作，不是继续加强微表情。\n中段像实验室特效 → 把材料变化收回正常洗护的尺度。\n画面已经足够柔和 → 别再给所有镜头叠梦幻辉光。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"cases-01-brand-film-section-0","title":"任务"},{"id":"cases-01-brand-film-section-1","title":"大多数人的第一稿"},{"id":"cases-01-brand-film-section-2","title":"第一步：把客户的形容词翻译成体验"},{"id":"cases-01-brand-film-section-3","title":"第二步：感受稿"},{"id":"cases-01-brand-film-section-4","title":"第三步：三个方案比较"},{"id":"cases-01-brand-film-section-5","title":"第四步：美术和连续性"},{"id":"cases-01-brand-film-section-6","title":"第五步：30 秒剪辑设计"},{"id":"cases-01-brand-film-section-7","title":"第六步：两段执行稿"},{"id":"cases-01-brand-film-section-10","title":"第七步：音乐说明"},{"id":"cases-01-brand-film-section-11","title":"第八步：制作顺序"},{"id":"cases-01-brand-film-section-12","title":"验收清单"},{"id":"cases-01-brand-film-section-13","title":"如果失败了"}]},{"id":"cases/02-relationship","path":"cases/02-relationship.md","title":"30｜完整案例：餐桌上，一句没问出口的话","description":"用普通台词、一只杯子和听者的反应表现关系。同时给出\"直接问\"的版本——它不比潜台词版低级。","type":"CaseStudy","group":"cases","tags":["完整案例","关系","对白","表演"],"html":"<h1>30｜完整案例：餐桌上，一句没问出口的话<\/h1>\n<blockquote>\n<p>设计样稿，没有生成或试听。A、B 是虚构人物。<\/p>\n<\/blockquote>\n<h2 id=\"cases-02-relationship-section-0\">任务<\/h2>\n<p>约 12 秒的关系片段。两人吃完饭了。A 想知道 B 明天会不会再来，但不想把问题问得像要求。<\/p>\n<p>不是悬疑，不需要观众猜出复杂的身世。<\/p>\n<h2 id=\"cases-02-relationship-section-1\">大多数人的第一稿<\/h2>\n<blockquote>\n<p>两人吃完饭，女生欲言又止，眼神里有期待和不安，男生察觉到了，温柔地回应。温馨的灯光，电影感。<\/p>\n<\/blockquote>\n<p>问题：\"欲言又止\"\"眼神里有期待\"——这些是结论。AI 会给你一个对着镜头做\"欲言又止\"表情的人。而且\"察觉到了\"是怎么察觉的？观众看不到。<\/p>\n<h2 id=\"cases-02-relationship-section-2\">感受稿<\/h2>\n<blockquote>\n<p>这张桌子已经收拾得差不多了，只有那个问题还没找到地方放。<\/p>\n<\/blockquote>\n<h2 id=\"cases-02-relationship-section-3\">把感受落到动作<\/h2>\n<p>不生成一个真的\"问题物件\"。A 正在收餐具。收走自己的杯子时，看到 B 的杯子还在手边。她没有马上收走它，借一个生活话题继续留住对话。<\/p>\n<p>台词：\nA：\"这茶……你喝得惯吗？\"\nB：\"挺好。明天我再带点别的来。\"<\/p>\n<p><strong>注意 B 的回答<\/strong>：他直接回答了 A 没说出口的事。观众不必一直猜。A 的反应只需要让手从\"要收杯子\"的动作里退回来。<\/p>\n<h2 id=\"cases-02-relationship-section-4\">镜头方案<\/h2>\n<p>固定的双人中景。桌面和双方的手都能看到，观众不用来回找谁在说话。A 在桌子近侧，B 在远侧偏右。门口不作为重点。灯光温和，但桌面不一片发亮。<\/p>\n<p>前段：A 收杯，问茶。\n中段：B 说明天再来。\n末段：A 把刚抬起的杯垫放回 B 杯子旁边，笑意可以明显一点。不必只给眼角 0.1 秒。<\/p>\n<h2 id=\"cases-02-relationship-section-5\">执行稿<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">同一餐桌、同一人物和造型，固定双人中景，保留桌面和双方手部。A 正在收拾餐具，抬起自己的杯子后看向 B 的茶杯，问：\"这茶……你喝得惯吗？\"她问得随意一点，不把期待演成紧张。B 自然接话：\"挺好。明天我再带点别的来。\"听到\"明天\"，A 原本要收杯垫的手停一下，把杯垫放回原处，抬头笑了。两人不用一直看镜头。片段结束时，B 的茶杯仍在桌上。\n<\/code><\/pre>\n<p>对白按实际朗读速度先试。12 秒是目标，不用省略号保证停顿。原生音画不稳时，先定音频再做画面，或者拆镜。<\/p>\n<h2 id=\"cases-02-relationship-section-6\">直接说，也完全成立<\/h2>\n<p>另一个版本：\nA：\"你明天还来吗？\"\nB：\"来。\"<\/p>\n<p>动作保持同样的收拾任务，只让 A 问出口时终于看向 B。<\/p>\n<p><strong>这个版本更直接、更明亮，不比潜台词版低级。<\/strong> 根据两人的关系、影片节奏、短视频时长，它可能更合适。<\/p>\n<h2 id=\"cases-02-relationship-section-7\">如果失败了<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>症状<\/th>\n<th>怎么修<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>像表演课示范<\/td>\n<td>去掉过多的停顿和隐忍，让收拾动作更普通<\/td>\n<\/tr>\n<tr>\n<td>关系完全没读出来<\/td>\n<td>别继续缩小表情。让 B 的\"明天\"清楚，让 A 的动作改变能被看见。必要时用直接台词版<\/td>\n<\/tr>\n<tr>\n<td>手和物件接触乱<\/td>\n<td>减少收杯的动作，只保留\"把杯垫推近\"一次<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>关键是留下一个\"座位\"般的关系，不是完成一套家务流程。<\/p>\n<h2 id=\"cases-02-relationship-section-8\">这一案可以迁移什么<\/h2>\n<p>一句话的意义来自：对谁说、在什么任务里说、对方怎么接。普通物件可以撑住情绪，但不必被解释成象征。<\/p>\n<p>方法链接：<a href=\"#/craft/01-acting\">表演<\/a>、<a href=\"#/craft/02-dialogue-voice\">台词与配音<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 30｜完整案例：餐桌上，一句没问出口的话\n\n> 设计样稿，没有生成或试听。A、B 是虚构人物。\n\n## 任务\n\n约 12 秒的关系片段。两人吃完饭了。A 想知道 B 明天会不会再来，但不想把问题问得像要求。\n\n不是悬疑，不需要观众猜出复杂的身世。\n\n## 大多数人的第一稿\n\n> 两人吃完饭，女生欲言又止，眼神里有期待和不安，男生察觉到了，温柔地回应。温馨的灯光，电影感。\n\n问题：\"欲言又止\"\"眼神里有期待\"——这些是结论。AI 会给你一个对着镜头做\"欲言又止\"表情的人。而且\"察觉到了\"是怎么察觉的？观众看不到。\n\n## 感受稿\n\n> 这张桌子已经收拾得差不多了，只有那个问题还没找到地方放。\n\n## 把感受落到动作\n\n不生成一个真的\"问题物件\"。A 正在收餐具。收走自己的杯子时，看到 B 的杯子还在手边。她没有马上收走它，借一个生活话题继续留住对话。\n\n台词：\nA：\"这茶……你喝得惯吗？\"\nB：\"挺好。明天我再带点别的来。\"\n\n**注意 B 的回答**：他直接回答了 A 没说出口的事。观众不必一直猜。A 的反应只需要让手从\"要收杯子\"的动作里退回来。\n\n## 镜头方案\n\n固定的双人中景。桌面和双方的手都能看到，观众不用来回找谁在说话。A 在桌子近侧，B 在远侧偏右。门口不作为重点。灯光温和，但桌面不一片发亮。\n\n前段：A 收杯，问茶。\n中段：B 说明天再来。\n末段：A 把刚抬起的杯垫放回 B 杯子旁边，笑意可以明显一点。不必只给眼角 0.1 秒。\n\n## 执行稿\n\n```text\n同一餐桌、同一人物和造型，固定双人中景，保留桌面和双方手部。A 正在收拾餐具，抬起自己的杯子后看向 B 的茶杯，问：\"这茶……你喝得惯吗？\"她问得随意一点，不把期待演成紧张。B 自然接话：\"挺好。明天我再带点别的来。\"听到\"明天\"，A 原本要收杯垫的手停一下，把杯垫放回原处，抬头笑了。两人不用一直看镜头。片段结束时，B 的茶杯仍在桌上。\n```\n\n对白按实际朗读速度先试。12 秒是目标，不用省略号保证停顿。原生音画不稳时，先定音频再做画面，或者拆镜。\n\n## 直接说，也完全成立\n\n另一个版本：\nA：\"你明天还来吗？\"\nB：\"来。\"\n\n动作保持同样的收拾任务，只让 A 问出口时终于看向 B。\n\n**这个版本更直接、更明亮，不比潜台词版低级。** 根据两人的关系、影片节奏、短视频时长，它可能更合适。\n\n## 如果失败了\n\n| 症状 | 怎么修 |\n| --- | --- |\n| 像表演课示范 | 去掉过多的停顿和隐忍，让收拾动作更普通 |\n| 关系完全没读出来 | 别继续缩小表情。让 B 的\"明天\"清楚，让 A 的动作改变能被看见。必要时用直接台词版 |\n| 手和物件接触乱 | 减少收杯的动作，只保留\"把杯垫推近\"一次 |\n\n关键是留下一个\"座位\"般的关系，不是完成一套家务流程。\n\n## 这一案可以迁移什么\n\n一句话的意义来自：对谁说、在什么任务里说、对方怎么接。普通物件可以撑住情绪，但不必被解释成象征。\n\n方法链接：[表演](/craft/01-acting.md)、[台词与配音](/craft/02-dialogue-voice.md)。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"cases-02-relationship-section-0","title":"任务"},{"id":"cases-02-relationship-section-1","title":"大多数人的第一稿"},{"id":"cases-02-relationship-section-2","title":"感受稿"},{"id":"cases-02-relationship-section-3","title":"把感受落到动作"},{"id":"cases-02-relationship-section-4","title":"镜头方案"},{"id":"cases-02-relationship-section-5","title":"执行稿"},{"id":"cases-02-relationship-section-6","title":"直接说，也完全成立"},{"id":"cases-02-relationship-section-7","title":"如果失败了"},{"id":"cases-02-relationship-section-8","title":"这一案可以迁移什么"}]},{"id":"cases/03-big-emotion","path":"cases/03-big-emotion.md","title":"31｜完整案例：喜悦真的可以冲出来","description":"用强动作和真实接触表现外放情绪。纠正\"自然就是克制\"的偏见——大笑、奔跑、拥抱同样可以写得好。","type":"CaseStudy","group":"cases","tags":["完整案例","喜悦","强情绪","动作"],"html":"<h1>31｜完整案例：喜悦真的可以冲出来<\/h1>\n<blockquote>\n<p>设计样稿，没有生成。用于说明表演设计，不是验证过的配方。<\/p>\n<\/blockquote>\n<h2 id=\"cases-03-big-emotion-section-0\">任务<\/h2>\n<p>8–10 秒。一位成年演员在排练室看到自己入选的消息。<\/p>\n<p>我们要的是<strong>毫不掩饰的喜悦<\/strong>，不是\"努力显得高级\"的小笑。<\/p>\n<h2 id=\"cases-03-big-emotion-section-1\">两种常见的错误写法<\/h2>\n<p><strong>第一种（标签）<\/strong>：<\/p>\n<blockquote>\n<p>女孩非常开心，激动，兴奋地欢呼。<\/p>\n<\/blockquote>\n<p><strong>第二种（过度克制）<\/strong>：<\/p>\n<blockquote>\n<p>她看到消息，嘴角微微上扬，眼中闪过一丝喜悦，深吸一口气，平静地放下手机。<\/p>\n<\/blockquote>\n<p>第二种在很多教程里被当成\"高级\"。但如果人物就是会跳起来的那种人，这样写就是在压抑她。<strong>克制不是默认更好。<\/strong><\/p>\n<h2 id=\"cases-03-big-emotion-section-2\">感受稿<\/h2>\n<blockquote>\n<p>好消息像突然打开的汽水。不是所有东西一起飞起来，而是那一下压力终于有了出口。<\/p>\n<\/blockquote>\n<p>翻译时不需要出现汽水。借的是\"积压 → 冲出 → 回落\"这个结构，把它放到起身、笑声、跑向伙伴上。<\/p>\n<h2 id=\"cases-03-big-emotion-section-3\">先设计动作，再补自然的收尾<\/h2>\n<p>她原本坐着看手机。确认后迅速站起，第一句\"成了！\"几乎是笑着喊出来的。她朝伙伴迈出两步，伙伴已经张开手，两人拥抱。到接触前她收一点速度，抱住后还轻轻晃了一下，笑声才慢下来。<\/p>\n<p><strong>喜悦不是全程高速。加速让它冲出来，接触和收尾让它回到身体里。<\/strong><\/p>\n<h2 id=\"cases-03-big-emotion-section-4\">两种机位，表达不同<\/h2>\n<p><strong>固定稍宽的中景<\/strong>：观众见证事情发生。身体和拥抱的关系最清楚。不追她，让伙伴进入画面接住动作。<\/p>\n<p><strong>轻跟随的中景<\/strong>：镜头随她起身略微抬高，跟上两步后停稳。更有参与感，但要避免镜头速度盖掉动作。<\/p>\n<p>这次选<strong>固定机位<\/strong>，减少同时变化的东西。不是固定机位更高级，而是这次演员已经足够有能量。<\/p>\n<h2 id=\"cases-03-big-emotion-section-5\">执行稿<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">排练室内固定稍宽中景，两位成年角色都在可见范围。A 坐在左侧凳上看手机，B 在她右前方不远处整理衣物。A 确认消息后突然抬头，笑着说\"成了！\"，迅速站起来朝 B 走两步。B 听见后转身张开双臂，A 在靠近时收住速度，两人自然拥抱。手机始终由 A 握在右手并避开 B 的背部，不凭空消失。笑声热烈、真实，可以打断一句没说完的话。不要求低头、压住笑或立刻恢复平静。\n<\/code><\/pre>\n<p>如果手机让拥抱不稳，可以在起身前加\"把手机放到身旁凳面\"，并确保时长允许。<strong>别同时要求手机在手和双手完整环抱。<\/strong><\/p>\n<h2 id=\"cases-03-big-emotion-section-6\">声音设计<\/h2>\n<p>\"成了\"是片中 A 的对白，不是旁白。环境保留鞋底和衣物的声音。音乐可以到拥抱时再进，也可以不进，让笑声承担情绪。<\/p>\n<p>不要把大笑统一处理成尖叫，不要用胜利铜管代替人物的快乐。<\/p>\n<h2 id=\"cases-03-big-emotion-section-7\">迁移到外放的愤怒<\/h2>\n<p>不是把\"快乐\"换成\"愤怒\"两个字。重新确定目标：人物要打断某个伤人的判断。主动作可以是站起并把椅子推开一点，台词明确，听者被迫停下。<\/p>\n<p>不要随便加砸东西和暴力。爆发的幅度取决于故事。<\/p>\n<h2 id=\"cases-03-big-emotion-section-8\">验收清单<\/h2>\n<ul>\n<li>读到的是\"终于实现\"，还是无缘无故的跳跃？<\/li>\n<li>两人的接触有预备和回应吗？<\/li>\n<li>声音像 A 在说吗？<\/li>\n<li>手机或衣物有没有无故变形？<\/li>\n<li>最重要的抱住时刻，在画面里吗？<\/li>\n<\/ul>\n<h2 id=\"cases-03-big-emotion-section-9\">如果失败了<\/h2>\n<p>成片过于客套 → 允许表情更大、笑声更开放。<strong>不要再追加\"克制\"。<\/strong>\n成片过于混乱 → 减少同时进行的任务。不必先削弱喜悦本身。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 31｜完整案例：喜悦真的可以冲出来\n\n> 设计样稿，没有生成。用于说明表演设计，不是验证过的配方。\n\n## 任务\n\n8–10 秒。一位成年演员在排练室看到自己入选的消息。\n\n我们要的是**毫不掩饰的喜悦**，不是\"努力显得高级\"的小笑。\n\n## 两种常见的错误写法\n\n**第一种（标签）**：\n> 女孩非常开心，激动，兴奋地欢呼。\n\n**第二种（过度克制）**：\n> 她看到消息，嘴角微微上扬，眼中闪过一丝喜悦，深吸一口气，平静地放下手机。\n\n第二种在很多教程里被当成\"高级\"。但如果人物就是会跳起来的那种人，这样写就是在压抑她。**克制不是默认更好。**\n\n## 感受稿\n\n> 好消息像突然打开的汽水。不是所有东西一起飞起来，而是那一下压力终于有了出口。\n\n翻译时不需要出现汽水。借的是\"积压 → 冲出 → 回落\"这个结构，把它放到起身、笑声、跑向伙伴上。\n\n## 先设计动作，再补自然的收尾\n\n她原本坐着看手机。确认后迅速站起，第一句\"成了！\"几乎是笑着喊出来的。她朝伙伴迈出两步，伙伴已经张开手，两人拥抱。到接触前她收一点速度，抱住后还轻轻晃了一下，笑声才慢下来。\n\n**喜悦不是全程高速。加速让它冲出来，接触和收尾让它回到身体里。**\n\n## 两种机位，表达不同\n\n**固定稍宽的中景**：观众见证事情发生。身体和拥抱的关系最清楚。不追她，让伙伴进入画面接住动作。\n\n**轻跟随的中景**：镜头随她起身略微抬高，跟上两步后停稳。更有参与感，但要避免镜头速度盖掉动作。\n\n这次选**固定机位**，减少同时变化的东西。不是固定机位更高级，而是这次演员已经足够有能量。\n\n## 执行稿\n\n```text\n排练室内固定稍宽中景，两位成年角色都在可见范围。A 坐在左侧凳上看手机，B 在她右前方不远处整理衣物。A 确认消息后突然抬头，笑着说\"成了！\"，迅速站起来朝 B 走两步。B 听见后转身张开双臂，A 在靠近时收住速度，两人自然拥抱。手机始终由 A 握在右手并避开 B 的背部，不凭空消失。笑声热烈、真实，可以打断一句没说完的话。不要求低头、压住笑或立刻恢复平静。\n```\n\n如果手机让拥抱不稳，可以在起身前加\"把手机放到身旁凳面\"，并确保时长允许。**别同时要求手机在手和双手完整环抱。**\n\n## 声音设计\n\n\"成了\"是片中 A 的对白，不是旁白。环境保留鞋底和衣物的声音。音乐可以到拥抱时再进，也可以不进，让笑声承担情绪。\n\n不要把大笑统一处理成尖叫，不要用胜利铜管代替人物的快乐。\n\n## 迁移到外放的愤怒\n\n不是把\"快乐\"换成\"愤怒\"两个字。重新确定目标：人物要打断某个伤人的判断。主动作可以是站起并把椅子推开一点，台词明确，听者被迫停下。\n\n不要随便加砸东西和暴力。爆发的幅度取决于故事。\n\n## 验收清单\n\n- 读到的是\"终于实现\"，还是无缘无故的跳跃？\n- 两人的接触有预备和回应吗？\n- 声音像 A 在说吗？\n- 手机或衣物有没有无故变形？\n- 最重要的抱住时刻，在画面里吗？\n\n## 如果失败了\n\n成片过于客套 → 允许表情更大、笑声更开放。**不要再追加\"克制\"。**\n成片过于混乱 → 减少同时进行的任务。不必先削弱喜悦本身。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"cases-03-big-emotion-section-0","title":"任务"},{"id":"cases-03-big-emotion-section-1","title":"两种常见的错误写法"},{"id":"cases-03-big-emotion-section-2","title":"感受稿"},{"id":"cases-03-big-emotion-section-3","title":"先设计动作，再补自然的收尾"},{"id":"cases-03-big-emotion-section-4","title":"两种机位，表达不同"},{"id":"cases-03-big-emotion-section-5","title":"执行稿"},{"id":"cases-03-big-emotion-section-6","title":"声音设计"},{"id":"cases-03-big-emotion-section-7","title":"迁移到外放的愤怒"},{"id":"cases-03-big-emotion-section-8","title":"验收清单"},{"id":"cases-03-big-emotion-section-9","title":"如果失败了"}]},{"id":"cases/04-vlog","path":"cases/04-vlog.md","title":"32｜完整案例：谁在拍谁——12 秒咖啡馆 Vlog","description":"Vlog 的生活感来自\"镜头是一个物件\"：谁拿着它、朝哪拍、什么时候放下。不是靠统一的晃动滤镜。","type":"CaseStudy","group":"cases","tags":["完整案例","Vlog","视点","道具"],"html":"<h1>32｜完整案例：谁在拍谁——12 秒咖啡馆 Vlog<\/h1>\n<blockquote>\n<p>设计样稿，没有生成。手机和角色的参考需要真实上传，镜头表是剪辑规划。<\/p>\n<\/blockquote>\n<h2 id=\"cases-04-vlog-section-0\">任务<\/h2>\n<p>成年女主从咖啡馆门口到坐下的短 Vlog。轻快、普通、有生活气。不需要广告式的完整展示。<\/p>\n<p>全片用同一部手机拍摄，允许一次明确地放上桌面支架。<\/p>\n<h2 id=\"cases-04-vlog-section-1\">大多数人的第一稿<\/h2>\n<blockquote>\n<p>女孩走进咖啡馆的 Vlog，手持拍摄，晃动的镜头，真实的生活感，iPhone 质感，自然光。<\/p>\n<\/blockquote>\n<p>问题：这个 Vlog 里，<strong>手机在谁手里？<\/strong> 自拍还是后摄？如果她在推门，哪只手拿手机？如果画面里能看到她全身走进店，那是谁在拍？<\/p>\n<p>\"手持晃动\"不能回答这些问题。Vlog 的真实感，首先来自<strong>镜头是一个真实存在的物件<\/strong>。<\/p>\n<h2 id=\"cases-04-vlog-section-2\">感受稿<\/h2>\n<blockquote>\n<p>她不是来给观众介绍一家店，只是把今天觉得好的一小段，顺手留了下来。<\/p>\n<\/blockquote>\n<h2 id=\"cases-04-vlog-section-3\">先承认镜头是一个东西<\/h2>\n<p>自拍时，手机在女主右手，左手可以整理头发。切到后摄后，画面里可以看到她的左手推门，<strong>但不能同时从店内远处看到她全身入场<\/strong>。<\/p>\n<p>需要第三人视角，就说明有第三人。本案不加。<\/p>\n<h2 id=\"cases-04-vlog-section-4\">四个镜头<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>谁在拍、朝哪拍<\/th>\n<th>人物和道具任务<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–3 秒<\/td>\n<td>右手前摄自拍，手臂距离，走路的轻微起伏<\/td>\n<td>女主走到门口，左手拨开挡脸的头发<\/td>\n<\/tr>\n<tr>\n<td>3–6 秒<\/td>\n<td>切后摄看门和室内，右手仍拿着手机<\/td>\n<td>左手推门。手机不能过了门就突然飞到屋里<\/td>\n<\/tr>\n<tr>\n<td>6–8 秒<\/td>\n<td>后摄看桌面，表现\"已经找到座位\"的时间省略<\/td>\n<td>桌上是一杯咖啡和小支架，拍摄者还没喝<\/td>\n<\/tr>\n<tr>\n<td>8–12 秒<\/td>\n<td>手机已放到桌面支架，前摄，固定略仰的中近景<\/td>\n<td>女主坐在桌边，右手取杯，尝一口后看向窗外<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>第三到第四镜之间用明确的切镜省略架机的过程。<strong>手机上架后，不再有手持起伏。<\/strong><\/p>\n<h2 id=\"cases-04-vlog-section-5\">两段执行稿<\/h2>\n<p><strong>后摄推门<\/strong>：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">手机后置视角，镜头由人物右手持有，朝向面前的木门。她的左手从画面左下进入，压下门把手，推门后镜头随着她走过门口。室内光线柔和，木门框短暂经过近处。保留小幅走路起伏，画面不跳到店内另一个位置。\n<\/code><\/pre>\n<p><strong>桌面固定自拍<\/strong>：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">手机已固定在桌面小支架上，前置镜头略向上，画面是女主胸部以上和杯子上缘。她用右手拿起桌上的咖啡杯尝一口，放回原位，然后看向窗外，像发现了街上的一点动静。镜头固定，人物不持续对镜头介绍或摆出标准微笑。\n<\/code><\/pre>\n<h2 id=\"cases-04-vlog-section-6\">身份和场景怎么引用<\/h2>\n<p>人物只用<strong>当前一套<\/strong>发型、服装和包。不要把不同造型的示例合并进同一个角色。<\/p>\n<p>场景参考必须是同一家店的相容角度。咖啡杯的数量、门的方向、座位靠窗的关系保持一致。<\/p>\n<p>普通场景可以来自自己拍的照片或一致的生成场景。<strong>生活感不是某个手机品牌独占的<\/strong>，也不以没经过确认的网上照片作为默认可用素材。<\/p>\n<h2 id=\"cases-04-vlog-section-7\">声音和剪辑<\/h2>\n<p>门把、门轴、店内人声、杯子碰桌——这些提供生活线索。配乐可以轻，但别盖住所有近处的动作声。<\/p>\n<p>自拍和后摄切换时，不必每次加夸张的转场声。<strong>相同的声音底可以让空间连起来。<\/strong><\/p>\n<h2 id=\"cases-04-vlog-section-8\">验收清单<\/h2>\n<ul>\n<li>每个镜头的手机在哪里，能解释吗？<\/li>\n<li>女主有没有多出来的手？<\/li>\n<li>手机固定后，还像有人拿着晃吗？<\/li>\n<li>室内空间有没有偷偷换了店？<\/li>\n<\/ul>\n<h2 id=\"cases-04-vlog-section-9\">如果失败了<\/h2>\n<p>素材好看，但像一支第三人拍的广告 → 不是加\"iPhone 质感\"四个字。<strong>先重新约束视点和可见范围。<\/strong><\/p>\n<p>延伸：<a href=\"#/craft/04-camera-attention\">镜头<\/a>、<a href=\"#/craft/03-action-blocking\">动作与手位<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 32｜完整案例：谁在拍谁——12 秒咖啡馆 Vlog\n\n> 设计样稿，没有生成。手机和角色的参考需要真实上传，镜头表是剪辑规划。\n\n## 任务\n\n成年女主从咖啡馆门口到坐下的短 Vlog。轻快、普通、有生活气。不需要广告式的完整展示。\n\n全片用同一部手机拍摄，允许一次明确地放上桌面支架。\n\n## 大多数人的第一稿\n\n> 女孩走进咖啡馆的 Vlog，手持拍摄，晃动的镜头，真实的生活感，iPhone 质感，自然光。\n\n问题：这个 Vlog 里，**手机在谁手里？** 自拍还是后摄？如果她在推门，哪只手拿手机？如果画面里能看到她全身走进店，那是谁在拍？\n\n\"手持晃动\"不能回答这些问题。Vlog 的真实感，首先来自**镜头是一个真实存在的物件**。\n\n## 感受稿\n\n> 她不是来给观众介绍一家店，只是把今天觉得好的一小段，顺手留了下来。\n\n## 先承认镜头是一个东西\n\n自拍时，手机在女主右手，左手可以整理头发。切到后摄后，画面里可以看到她的左手推门，**但不能同时从店内远处看到她全身入场**。\n\n需要第三人视角，就说明有第三人。本案不加。\n\n## 四个镜头\n\n| 时间 | 谁在拍、朝哪拍 | 人物和道具任务 |\n| --- | --- | --- |\n| 0–3 秒 | 右手前摄自拍，手臂距离，走路的轻微起伏 | 女主走到门口，左手拨开挡脸的头发 |\n| 3–6 秒 | 切后摄看门和室内，右手仍拿着手机 | 左手推门。手机不能过了门就突然飞到屋里 |\n| 6–8 秒 | 后摄看桌面，表现\"已经找到座位\"的时间省略 | 桌上是一杯咖啡和小支架，拍摄者还没喝 |\n| 8–12 秒 | 手机已放到桌面支架，前摄，固定略仰的中近景 | 女主坐在桌边，右手取杯，尝一口后看向窗外 |\n\n第三到第四镜之间用明确的切镜省略架机的过程。**手机上架后，不再有手持起伏。**\n\n## 两段执行稿\n\n**后摄推门**：\n```text\n手机后置视角，镜头由人物右手持有，朝向面前的木门。她的左手从画面左下进入，压下门把手，推门后镜头随着她走过门口。室内光线柔和，木门框短暂经过近处。保留小幅走路起伏，画面不跳到店内另一个位置。\n```\n\n**桌面固定自拍**：\n```text\n手机已固定在桌面小支架上，前置镜头略向上，画面是女主胸部以上和杯子上缘。她用右手拿起桌上的咖啡杯尝一口，放回原位，然后看向窗外，像发现了街上的一点动静。镜头固定，人物不持续对镜头介绍或摆出标准微笑。\n```\n\n## 身份和场景怎么引用\n\n人物只用**当前一套**发型、服装和包。不要把不同造型的示例合并进同一个角色。\n\n场景参考必须是同一家店的相容角度。咖啡杯的数量、门的方向、座位靠窗的关系保持一致。\n\n普通场景可以来自自己拍的照片或一致的生成场景。**生活感不是某个手机品牌独占的**，也不以没经过确认的网上照片作为默认可用素材。\n\n## 声音和剪辑\n\n门把、门轴、店内人声、杯子碰桌——这些提供生活线索。配乐可以轻，但别盖住所有近处的动作声。\n\n自拍和后摄切换时，不必每次加夸张的转场声。**相同的声音底可以让空间连起来。**\n\n## 验收清单\n\n- 每个镜头的手机在哪里，能解释吗？\n- 女主有没有多出来的手？\n- 手机固定后，还像有人拿着晃吗？\n- 室内空间有没有偷偷换了店？\n\n## 如果失败了\n\n素材好看，但像一支第三人拍的广告 → 不是加\"iPhone 质感\"四个字。**先重新约束视点和可见范围。**\n\n延伸：[镜头](/craft/04-camera-attention.md)、[动作与手位](/craft/03-action-blocking.md)。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"cases-04-vlog-section-0","title":"任务"},{"id":"cases-04-vlog-section-1","title":"大多数人的第一稿"},{"id":"cases-04-vlog-section-2","title":"感受稿"},{"id":"cases-04-vlog-section-3","title":"先承认镜头是一个东西"},{"id":"cases-04-vlog-section-4","title":"四个镜头"},{"id":"cases-04-vlog-section-5","title":"两段执行稿"},{"id":"cases-04-vlog-section-6","title":"身份和场景怎么引用"},{"id":"cases-04-vlog-section-7","title":"声音和剪辑"},{"id":"cases-04-vlog-section-8","title":"验收清单"},{"id":"cases-04-vlog-section-9","title":"如果失败了"}]},{"id":"cases/05-empty-corridor","path":"cases/05-empty-corridor.md","title":"33｜完整案例：空走廊为什么会让人等下去","description":"不用人脸、不用重型音乐，靠声音、遮挡和延迟组织悬念。同一条走廊换一组声音，就变成等开饭。","type":"CaseStudy","group":"cases","tags":["完整案例","悬疑","声音","空镜"],"html":"<h1>33｜完整案例：空走廊为什么会让人等下去<\/h1>\n<blockquote>\n<p>设计样稿，没有生成。这是悬疑创作设定，不是对真实地点或事件的判断。<\/p>\n<\/blockquote>\n<h2 id=\"cases-05-empty-corridor-section-0\">任务<\/h2>\n<p>约 10 秒的空走廊。观众感到\"有事要发生\"，但此刻还不知道是什么。<\/p>\n<p>不是尽量吓人，而是让注意力逐渐集中到同一扇门。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-1\">大多数人的第一稿<\/h2>\n<blockquote>\n<p>诡异的走廊，阴暗，蓝色调，恐怖氛围，紧张的音乐，镜头缓慢推进。<\/p>\n<\/blockquote>\n<p>问题：这是\"恐怖片\"的模板。所有元素都在同时喊\"害怕\"，观众反而不知道该注意什么。而且\"诡异氛围\"是结论，AI 只能拿最常见的诡异来填——蓝光、雾、闪烁的灯。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-2\">感受稿<\/h2>\n<blockquote>\n<p>走廊不是空的，只是我们还没看见它在等谁。<\/p>\n<\/blockquote>\n<p>这句话留给创作说明。执行稿不能只写\"诡异气氛\"，要选具体的线索。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-3\">画面和声音分工<\/h2>\n<p><strong>画面<\/strong>：正常的住宅走廊，固定平视。一扇半掩的门在远端偏左，门缝里有一块比较亮的室内光。不把全屋变成恐怖片蓝色，也不需要地面大量水迹。<\/p>\n<p><strong>声音<\/strong>：开始有普通的电器底声。远处出现椅脚拖动的一声。接着两下脚步靠近那扇门，然后停住。镜头仍不动，门也没有马上打开。<\/p>\n<p><strong>悬念来自：声音提供行动，画面暂时不提供解释。<\/strong> 声源属于门后的空间，不是旁白，也不在画面里新增人物。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-4\">执行稿<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">固定平视镜头看向住宅走廊深处，保留首帧的门、墙面和光线。远端偏左的门一直半掩，门缝透出稳定的室内光。画面大部分保持不动，不出现走动的人。门后先传来一次椅脚轻拖声，随后是两步接近门口的脚步声，然后安静下来。门没有打开，镜头不推进、不变焦。保持普通生活空间的质感，让等待来自声音发生之后画面没有立刻回应。\n<\/code><\/pre>\n<p>如果工具偏好正向的运动说明，把末尾整理为\"镜头固定，门保持半掩\"。如果它不支持可靠的音效时序，先生成画面，再按时间线设计声音，不假称一次完成。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-5\">为什么不同时加闪灯、风、低频和鬼影<\/h2>\n<p>那会把一个清楚的问题变成多个刺激：该注意门、灯，还是阴影？<\/p>\n<p>本案需要的是<strong>单一的等待<\/strong>，不是信息轰炸。另一个更外放的恐怖方案可以用强刺激，但那要重新定义目标。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-6\">同一个画面，换一组声音<\/h2>\n<p>门后换成熟人的笑声、碗筷碰撞、一句\"马上好\"——同一条走廊变成了等待开饭。<strong>画面不必变暖橙，情境就已经变了。<\/strong><\/p>\n<p>这个对照适合当练习：不要只问\"哪个更电影感\"，而问\"观众在等什么、哪一个声音改变了理解\"。<\/p>\n<h2 id=\"cases-05-empty-corridor-section-7\">验收清单<\/h2>\n<ul>\n<li>不了解说明的观众，注意力放在目标那扇门上，而不是其他背景细节？<\/li>\n<li>脚步声有空间归属吗？（听起来是门后，不是耳边）<\/li>\n<li>画面不动，仍有\"等待\"，而不是单纯乏味？<\/li>\n<li>结尾停在\"尚未回应\"，而不是 AI 自己把门打开了？<\/li>\n<\/ul>\n<h2 id=\"cases-05-empty-corridor-section-8\">如果失败了<\/h2>\n<p>不够清楚 → 先改善声源的距离和发生顺序。\n过于恐怖 → 先收回声压和强烈配乐。\n静音渠道 → 需要另外设计看得见的线索，不宣称声音方案在静音时也成立。<\/p>\n<p>相关方法：<a href=\"#/craft/07-sound-music\">音乐与声音<\/a>、<a href=\"#/craft/04-camera-attention\">镜头<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 33｜完整案例：空走廊为什么会让人等下去\n\n> 设计样稿，没有生成。这是悬疑创作设定，不是对真实地点或事件的判断。\n\n## 任务\n\n约 10 秒的空走廊。观众感到\"有事要发生\"，但此刻还不知道是什么。\n\n不是尽量吓人，而是让注意力逐渐集中到同一扇门。\n\n## 大多数人的第一稿\n\n> 诡异的走廊，阴暗，蓝色调，恐怖氛围，紧张的音乐，镜头缓慢推进。\n\n问题：这是\"恐怖片\"的模板。所有元素都在同时喊\"害怕\"，观众反而不知道该注意什么。而且\"诡异氛围\"是结论，AI 只能拿最常见的诡异来填——蓝光、雾、闪烁的灯。\n\n## 感受稿\n\n> 走廊不是空的，只是我们还没看见它在等谁。\n\n这句话留给创作说明。执行稿不能只写\"诡异气氛\"，要选具体的线索。\n\n## 画面和声音分工\n\n**画面**：正常的住宅走廊，固定平视。一扇半掩的门在远端偏左，门缝里有一块比较亮的室内光。不把全屋变成恐怖片蓝色，也不需要地面大量水迹。\n\n**声音**：开始有普通的电器底声。远处出现椅脚拖动的一声。接着两下脚步靠近那扇门，然后停住。镜头仍不动，门也没有马上打开。\n\n**悬念来自：声音提供行动，画面暂时不提供解释。** 声源属于门后的空间，不是旁白，也不在画面里新增人物。\n\n## 执行稿\n\n```text\n固定平视镜头看向住宅走廊深处，保留首帧的门、墙面和光线。远端偏左的门一直半掩，门缝透出稳定的室内光。画面大部分保持不动，不出现走动的人。门后先传来一次椅脚轻拖声，随后是两步接近门口的脚步声，然后安静下来。门没有打开，镜头不推进、不变焦。保持普通生活空间的质感，让等待来自声音发生之后画面没有立刻回应。\n```\n\n如果工具偏好正向的运动说明，把末尾整理为\"镜头固定，门保持半掩\"。如果它不支持可靠的音效时序，先生成画面，再按时间线设计声音，不假称一次完成。\n\n## 为什么不同时加闪灯、风、低频和鬼影\n\n那会把一个清楚的问题变成多个刺激：该注意门、灯，还是阴影？\n\n本案需要的是**单一的等待**，不是信息轰炸。另一个更外放的恐怖方案可以用强刺激，但那要重新定义目标。\n\n## 同一个画面，换一组声音\n\n门后换成熟人的笑声、碗筷碰撞、一句\"马上好\"——同一条走廊变成了等待开饭。**画面不必变暖橙，情境就已经变了。**\n\n这个对照适合当练习：不要只问\"哪个更电影感\"，而问\"观众在等什么、哪一个声音改变了理解\"。\n\n## 验收清单\n\n- 不了解说明的观众，注意力放在目标那扇门上，而不是其他背景细节？\n- 脚步声有空间归属吗？（听起来是门后，不是耳边）\n- 画面不动，仍有\"等待\"，而不是单纯乏味？\n- 结尾停在\"尚未回应\"，而不是 AI 自己把门打开了？\n\n## 如果失败了\n\n不够清楚 → 先改善声源的距离和发生顺序。\n过于恐怖 → 先收回声压和强烈配乐。\n静音渠道 → 需要另外设计看得见的线索，不宣称声音方案在静音时也成立。\n\n相关方法：[音乐与声音](/craft/07-sound-music.md)、[镜头](/craft/04-camera-attention.md)。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"cases-05-empty-corridor-section-0","title":"任务"},{"id":"cases-05-empty-corridor-section-1","title":"大多数人的第一稿"},{"id":"cases-05-empty-corridor-section-2","title":"感受稿"},{"id":"cases-05-empty-corridor-section-3","title":"画面和声音分工"},{"id":"cases-05-empty-corridor-section-4","title":"执行稿"},{"id":"cases-05-empty-corridor-section-5","title":"为什么不同时加闪灯、风、低频和鬼影"},{"id":"cases-05-empty-corridor-section-6","title":"同一个画面，换一组声音"},{"id":"cases-05-empty-corridor-section-7","title":"验收清单"},{"id":"cases-05-empty-corridor-section-8","title":"如果失败了"}]},{"id":"cases/06-surreal-perfume","path":"cases/06-surreal-perfume.md","title":"34｜完整案例：不追求实拍的香水图与短动效","description":"风格化不是\"不够真实的失败品\"，它有自己的世界规则。只偏离一条规则，其余保持稳定。","type":"CaseStudy","group":"cases","tags":["完整案例","香水","超现实","主视觉"],"html":"<h1>34｜完整案例：不追求实拍的香水图与短动效<\/h1>\n<blockquote>\n<p>设计样稿，没有生成。产品是虚构的，品牌字标在后期加入。<\/p>\n<\/blockquote>\n<h2 id=\"cases-06-surreal-perfume-section-0\">任务<\/h2>\n<p>一张主视觉和约 6 秒的动效。香水的关键词是\"轻盈，但不脆弱\"。<\/p>\n<p>不追求生活实拍，而是平面构成和超现实材质的混合。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-1\">大多数人的第一稿<\/h2>\n<blockquote>\n<p>梦幻的香水广告，飘浮的丝带，柔光，粒子效果，高级感，超现实。<\/p>\n<\/blockquote>\n<p>问题：所有超现实元素同时上。丝带飘、光柔、粒子飞——没有一样是稳定的，观众不知道这个世界的规则是什么。而且\"高级感\"什么都没说。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-2\">感受稿<\/h2>\n<blockquote>\n<p>它像一封没有封口的信，风可以进去，但不会把里面的东西带走。<\/p>\n<\/blockquote>\n<p>不直接画信。提取关系：<strong>开放、轻薄、但有稳定的边界。<\/strong><\/p>\n<h2 id=\"cases-06-surreal-perfume-section-3\">世界规则<\/h2>\n<p>背景是浅暖灰的平面空间。产品有清楚的体积。一条半透明的薄带绕着瓶子形成不闭合的弧，不碰到瓶身。薄带可以悬浮，但不变成烟，不穿过产品。瓶子本身始终稳定。<\/p>\n<p><strong>\"悬浮\"是明确的艺术设定。其余的接触、遮挡、轮廓都保持一致，观众才容易接受这个世界。<\/strong> 不是必须像现实，而是不能每秒换规则。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-4\">静态主视觉提示词<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">一张留白充足的香水主视觉。虚构的透明方形香水瓶位于画面右下，比例清楚，玻璃边缘干净而不刺眼。浅暖灰背景上，一条很薄的半透明丝带围绕瓶子形成不闭合的弧，留出宽松的入口。丝带轻盈悬浮，但保持可辨认的带状结构，不化成烟雾，也不覆盖瓶身正面。整体由安静的平面构成和少量精确的体积组成，轻但不脆弱。左上留出完整的标题区，不生成文字。\n<\/code><\/pre>\n<p>已有批准的瓶型参考时，以参考为准。探索稿里的\"方形\"不能替换客户的真实瓶型。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-5\">动效提示词<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">保留主视觉的产品、构图和背景。半透明薄带的自由端轻轻抬起，沿原有弧线移动一点，再慢慢停稳。整个过程仍是同一条薄带，开口不闭合，不缠住瓶子。产品保持静止，镜头固定。只有薄带的变化和玻璃上的细小反光呼应，节奏轻而有余量。\n<\/code><\/pre>\n<p>声音可以是很轻的短音和一段柔和的延续，不必用真实丝带的摩擦声。<strong>静态海报版也完全成立，不为动而动。<\/strong><\/p>\n<h2 id=\"cases-06-surreal-perfume-section-6\">风格融合的分工<\/h2>\n<p>平面设计提供构图和留白。产品摄影的逻辑提供瓶身结构和反光。超现实只提供\"薄带悬浮\"这一条偏离。<\/p>\n<p><strong>三种来源各管一层<\/strong>，避免\"每一处同时融合三种风格\"。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-7\">最先试什么<\/h2>\n<p>先测试薄带能不能保持形状和开口。如果不能，退回二维曲线动画或分层合成。<\/p>\n<p><strong>图像生成负责主视觉，后期负责可控的运动<\/strong>，这也是一条完整的当代流程，不是创意失败。<\/p>\n<h2 id=\"cases-06-surreal-perfume-section-8\">验收清单<\/h2>\n<ul>\n<li>瓶子仍是唯一的产品中心？<\/li>\n<li>开口被误闭合了吗？<\/li>\n<li>薄带穿进玻璃了吗？<\/li>\n<li>留白能放字吗？<\/li>\n<li>动效比静态多带来了什么感受？<\/li>\n<\/ul>\n<h2 id=\"cases-06-surreal-perfume-section-9\">两个反面提醒<\/h2>\n<p>不要因为它不像手机实拍就判失败。\n也不要因为它\"梦幻\"就接受包装结构错误。<\/p>\n<p><strong>形式开放，任务仍清楚。<\/strong><\/p>\n<p>延伸：<a href=\"#/craft/08-still-graphic-style\">静态图与风格化<\/a>、<a href=\"#/language/01-sensory-translation\">通感<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 34｜完整案例：不追求实拍的香水图与短动效\n\n> 设计样稿，没有生成。产品是虚构的，品牌字标在后期加入。\n\n## 任务\n\n一张主视觉和约 6 秒的动效。香水的关键词是\"轻盈，但不脆弱\"。\n\n不追求生活实拍，而是平面构成和超现实材质的混合。\n\n## 大多数人的第一稿\n\n> 梦幻的香水广告，飘浮的丝带，柔光，粒子效果，高级感，超现实。\n\n问题：所有超现实元素同时上。丝带飘、光柔、粒子飞——没有一样是稳定的，观众不知道这个世界的规则是什么。而且\"高级感\"什么都没说。\n\n## 感受稿\n\n> 它像一封没有封口的信，风可以进去，但不会把里面的东西带走。\n\n不直接画信。提取关系：**开放、轻薄、但有稳定的边界。**\n\n## 世界规则\n\n背景是浅暖灰的平面空间。产品有清楚的体积。一条半透明的薄带绕着瓶子形成不闭合的弧，不碰到瓶身。薄带可以悬浮，但不变成烟，不穿过产品。瓶子本身始终稳定。\n\n**\"悬浮\"是明确的艺术设定。其余的接触、遮挡、轮廓都保持一致，观众才容易接受这个世界。** 不是必须像现实，而是不能每秒换规则。\n\n## 静态主视觉提示词\n\n```text\n一张留白充足的香水主视觉。虚构的透明方形香水瓶位于画面右下，比例清楚，玻璃边缘干净而不刺眼。浅暖灰背景上，一条很薄的半透明丝带围绕瓶子形成不闭合的弧，留出宽松的入口。丝带轻盈悬浮，但保持可辨认的带状结构，不化成烟雾，也不覆盖瓶身正面。整体由安静的平面构成和少量精确的体积组成，轻但不脆弱。左上留出完整的标题区，不生成文字。\n```\n\n已有批准的瓶型参考时，以参考为准。探索稿里的\"方形\"不能替换客户的真实瓶型。\n\n## 动效提示词\n\n```text\n保留主视觉的产品、构图和背景。半透明薄带的自由端轻轻抬起，沿原有弧线移动一点，再慢慢停稳。整个过程仍是同一条薄带，开口不闭合，不缠住瓶子。产品保持静止，镜头固定。只有薄带的变化和玻璃上的细小反光呼应，节奏轻而有余量。\n```\n\n声音可以是很轻的短音和一段柔和的延续，不必用真实丝带的摩擦声。**静态海报版也完全成立，不为动而动。**\n\n## 风格融合的分工\n\n平面设计提供构图和留白。产品摄影的逻辑提供瓶身结构和反光。超现实只提供\"薄带悬浮\"这一条偏离。\n\n**三种来源各管一层**，避免\"每一处同时融合三种风格\"。\n\n## 最先试什么\n\n先测试薄带能不能保持形状和开口。如果不能，退回二维曲线动画或分层合成。\n\n**图像生成负责主视觉，后期负责可控的运动**，这也是一条完整的当代流程，不是创意失败。\n\n## 验收清单\n\n- 瓶子仍是唯一的产品中心？\n- 开口被误闭合了吗？\n- 薄带穿进玻璃了吗？\n- 留白能放字吗？\n- 动效比静态多带来了什么感受？\n\n## 两个反面提醒\n\n不要因为它不像手机实拍就判失败。\n也不要因为它\"梦幻\"就接受包装结构错误。\n\n**形式开放，任务仍清楚。**\n\n延伸：[静态图与风格化](/craft/08-still-graphic-style.md)、[通感](/language/01-sensory-translation.md)。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"cases-06-surreal-perfume-section-0","title":"任务"},{"id":"cases-06-surreal-perfume-section-1","title":"大多数人的第一稿"},{"id":"cases-06-surreal-perfume-section-2","title":"感受稿"},{"id":"cases-06-surreal-perfume-section-3","title":"世界规则"},{"id":"cases-06-surreal-perfume-section-4","title":"静态主视觉提示词"},{"id":"cases-06-surreal-perfume-section-5","title":"动效提示词"},{"id":"cases-06-surreal-perfume-section-6","title":"风格融合的分工"},{"id":"cases-06-surreal-perfume-section-7","title":"最先试什么"},{"id":"cases-06-surreal-perfume-section-8","title":"验收清单"},{"id":"cases-06-surreal-perfume-section-9","title":"两个反面提醒"}]},{"id":"cases/07-comedy","path":"cases/07-comedy.md","title":"35｜完整案例：安静自习室里的零食袋","description":"喜剧来自目标、阻力和反应，不是给角色加夸张表情。一个可以反复用的小结构。","type":"CaseStudy","group":"cases","tags":["完整案例","喜剧","节奏","音效"],"html":"<h1>35｜完整案例：安静自习室里的零食袋<\/h1>\n<blockquote>\n<p>设计样稿，没有生成。场景中人物均为成年人，约 12 秒的剪辑方案。<\/p>\n<\/blockquote>\n<h2 id=\"cases-07-comedy-section-0\">任务<\/h2>\n<p>一个人想很安静地拆零食袋，袋子却比他预想中响。他努力维持体面，而不是做鬼脸给观众看。<\/p>\n<h2 id=\"cases-07-comedy-section-1\">大多数人的第一稿<\/h2>\n<blockquote>\n<p>搞笑场景，男生在图书馆偷吃零食，袋子发出巨响，他做出夸张的尴尬表情，周围人纷纷看他。<\/p>\n<\/blockquote>\n<p>问题：\"夸张的尴尬表情\"是让角色对着观众演。真正的喜剧感来自<strong>他想让这件事过去，但过不去<\/strong>。而且\"周围人纷纷看他\"太满了——一个人看一眼就够。<\/p>\n<h2 id=\"cases-07-comedy-section-2\">感受稿<\/h2>\n<blockquote>\n<p>他想把一件小事做得毫无存在感，那件小事却偏偏清了清嗓子。<\/p>\n<\/blockquote>\n<p>\"清嗓子\"不是真的给袋子配人声。它指：一次突出的包装声打断了安静。<\/p>\n<h2 id=\"cases-07-comedy-section-3\">喜剧的结构<\/h2>\n<p><strong>先让观众知道目标<\/strong>：他在安静的房间里，小心地拿出袋子。\n<strong>再出现偏差<\/strong>：袋子被拉开的一瞬，发出比预想清楚的脆响。\n<strong>最后让反应接住<\/strong>：旁边的人短暂抬眼。他停住，慢慢把袋子放低，假装继续读书。过一会，袋口自己又轻响一下。<\/p>\n<p>最后那一下由材料松弛的细声完成。不必让袋子爆炸、飞走，或者凭空出现新东西。<\/p>\n<h2 id=\"cases-07-comedy-section-4\">三个镜头<\/h2>\n<p><strong>0–4 秒，固定中景<\/strong>：他确认周围安静，拿出袋子。目光不是不断四下扫，只瞥一次邻座。<\/p>\n<p><strong>4–7 秒，手部近景<\/strong>：两手慢慢拉开包装封口，出现清楚的一声。动作确实完成了，别让包装不断闭合重来。<\/p>\n<p><strong>7–12 秒，回到中景<\/strong>：邻座看他一下。他停住，轻轻放低袋子，把目光放回书上。结尾留一点等待，听见袋口的小响声。<\/p>\n<h2 id=\"cases-07-comedy-section-5\">执行稿：反应镜头<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">固定中景，接上一镜包装袋已经打开的状态。A 双手拿着袋子，邻座 B 刚刚被声音吸引，抬眼看向他。A 不是做鬼脸，而是停住一瞬，把袋子慢慢放到桌面下方，认真看回书页。B 随后把注意力收回自己的书。房间仍很安静，动作自然，保留他们试图让这件事过去的尴尬。\n<\/code><\/pre>\n<p>如果袋子放到桌下会造成连续性难题，可以放在桌边，用身体挡住一部分。但下一镜要记住它在那里。<\/p>\n<h2 id=\"cases-07-comedy-section-6\">声音比表情更值得先试<\/h2>\n<p>把包装声调到能辨认但不刺耳。环境底保持一致。<\/p>\n<p>没有背景音乐也能成立。如果加音乐，拆袋前保持稀疏，别在每次眼神变化时加滑稽音阶。<\/p>\n<p>第二次小响是节奏的回声，不一定要更大。<strong>声音越夸张，人物的克制就越没有对照。<\/strong><\/p>\n<h2 id=\"cases-07-comedy-section-7\">验收清单<\/h2>\n<ul>\n<li>不知道提示词的人，能理解他想安静、却被声音出卖了吗？<\/li>\n<li>反应发生在声音<strong>之后<\/strong>吗？<\/li>\n<li>包装状态连续吗？<\/li>\n<li>有没有把 A 演成故意逗观众的人？<\/li>\n<\/ul>\n<h2 id=\"cases-07-comedy-section-8\">如果不好笑<\/h2>\n<p>先看：预期建立了吗？停顿有用吗？反应是不是太早了？<\/p>\n<p><strong>不要第一步就把表情加倍。<\/strong><\/p>\n<h2 id=\"cases-07-comedy-section-9\">可以反复用的结构<\/h2>\n<p><strong>认真完成一件小事 → 环境或材料添一点阻力 → 人物试图恢复原来的体面。<\/strong><\/p>\n<p>不是所有喜剧都需要这个结构，但它很适合少人物、少场景的小片段。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 35｜完整案例：安静自习室里的零食袋\n\n> 设计样稿，没有生成。场景中人物均为成年人，约 12 秒的剪辑方案。\n\n## 任务\n\n一个人想很安静地拆零食袋，袋子却比他预想中响。他努力维持体面，而不是做鬼脸给观众看。\n\n## 大多数人的第一稿\n\n> 搞笑场景，男生在图书馆偷吃零食，袋子发出巨响，他做出夸张的尴尬表情，周围人纷纷看他。\n\n问题：\"夸张的尴尬表情\"是让角色对着观众演。真正的喜剧感来自**他想让这件事过去，但过不去**。而且\"周围人纷纷看他\"太满了——一个人看一眼就够。\n\n## 感受稿\n\n> 他想把一件小事做得毫无存在感，那件小事却偏偏清了清嗓子。\n\n\"清嗓子\"不是真的给袋子配人声。它指：一次突出的包装声打断了安静。\n\n## 喜剧的结构\n\n**先让观众知道目标**：他在安静的房间里，小心地拿出袋子。\n**再出现偏差**：袋子被拉开的一瞬，发出比预想清楚的脆响。\n**最后让反应接住**：旁边的人短暂抬眼。他停住，慢慢把袋子放低，假装继续读书。过一会，袋口自己又轻响一下。\n\n最后那一下由材料松弛的细声完成。不必让袋子爆炸、飞走，或者凭空出现新东西。\n\n## 三个镜头\n\n**0–4 秒，固定中景**：他确认周围安静，拿出袋子。目光不是不断四下扫，只瞥一次邻座。\n\n**4–7 秒，手部近景**：两手慢慢拉开包装封口，出现清楚的一声。动作确实完成了，别让包装不断闭合重来。\n\n**7–12 秒，回到中景**：邻座看他一下。他停住，轻轻放低袋子，把目光放回书上。结尾留一点等待，听见袋口的小响声。\n\n## 执行稿：反应镜头\n\n```text\n固定中景，接上一镜包装袋已经打开的状态。A 双手拿着袋子，邻座 B 刚刚被声音吸引，抬眼看向他。A 不是做鬼脸，而是停住一瞬，把袋子慢慢放到桌面下方，认真看回书页。B 随后把注意力收回自己的书。房间仍很安静，动作自然，保留他们试图让这件事过去的尴尬。\n```\n\n如果袋子放到桌下会造成连续性难题，可以放在桌边，用身体挡住一部分。但下一镜要记住它在那里。\n\n## 声音比表情更值得先试\n\n把包装声调到能辨认但不刺耳。环境底保持一致。\n\n没有背景音乐也能成立。如果加音乐，拆袋前保持稀疏，别在每次眼神变化时加滑稽音阶。\n\n第二次小响是节奏的回声，不一定要更大。**声音越夸张，人物的克制就越没有对照。**\n\n## 验收清单\n\n- 不知道提示词的人，能理解他想安静、却被声音出卖了吗？\n- 反应发生在声音**之后**吗？\n- 包装状态连续吗？\n- 有没有把 A 演成故意逗观众的人？\n\n## 如果不好笑\n\n先看：预期建立了吗？停顿有用吗？反应是不是太早了？\n\n**不要第一步就把表情加倍。**\n\n## 可以反复用的结构\n\n**认真完成一件小事 → 环境或材料添一点阻力 → 人物试图恢复原来的体面。**\n\n不是所有喜剧都需要这个结构，但它很适合少人物、少场景的小片段。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"cases-07-comedy-section-0","title":"任务"},{"id":"cases-07-comedy-section-1","title":"大多数人的第一稿"},{"id":"cases-07-comedy-section-2","title":"感受稿"},{"id":"cases-07-comedy-section-3","title":"喜剧的结构"},{"id":"cases-07-comedy-section-4","title":"三个镜头"},{"id":"cases-07-comedy-section-5","title":"执行稿：反应镜头"},{"id":"cases-07-comedy-section-6","title":"声音比表情更值得先试"},{"id":"cases-07-comedy-section-7","title":"验收清单"},{"id":"cases-07-comedy-section-8","title":"如果不好笑"},{"id":"cases-07-comedy-section-9","title":"可以反复用的结构"}]},{"id":"cases/08-object-exchange","path":"cases/08-object-exchange.md","title":"36｜完整案例：两份文件，谁最后拿着哪一份","description":"用\"状态表\"规划一镜到底，让观众看清交换结果。同时给出更省力的三镜头方案。","type":"CaseStudy","group":"cases","tags":["完整案例","预演","道具","一镜到底"],"html":"<h1>36｜完整案例：两份文件，谁最后拿着哪一份<\/h1>\n<blockquote>\n<p>设计样稿，借鉴了一个教程里的控制问题，不复原它的剧情。没有搭建或生成预演。距离和秒数是方案数值，不是实测。<\/p>\n<\/blockquote>\n<h2 id=\"cases-08-object-exchange-section-0\">任务<\/h2>\n<p>约 24 秒。A 和 B 在大厅桌边交错，各自拿错了对方的文件。观众要看清交换的结果，人物暂时没有发现。<\/p>\n<p>不能让剧情完全依赖文件上不可读的小字。<\/p>\n<h2 id=\"cases-08-object-exchange-section-1\">大多数人的第一稿<\/h2>\n<blockquote>\n<p>一镜到底，镜头从低角度缓缓升起，环绕两人，穿过桌子，最后俯视。两人交换了文件。<\/p>\n<\/blockquote>\n<p>问题：运镜设计得很漂亮，但<strong>观众怎么知道文件换了？<\/strong> 什么时候看到原件？什么时候看到拿错？这些信息在哪个瞬间被看见？一条漂亮的曲线不回答这些。<\/p>\n<h2 id=\"cases-08-object-exchange-section-2\">先让道具能被认出来<\/h2>\n<p>两份文件用<strong>蓝色窄边文件夹 X<\/strong>和<strong>黄色宽边文件夹 Y<\/strong>区分。颜色和形状是观众的识别线索，不是逼 AI 理解\"真\"和\"假\"这种抽象标签。<\/p>\n<h2 id=\"cases-08-object-exchange-section-3\">状态表先于相机路线<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时段<\/th>\n<th>X 在哪<\/th>\n<th>Y 在哪<\/th>\n<th>观众需要看懂什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>开场<\/td>\n<td>A 手中<\/td>\n<td>B 手中<\/td>\n<td>两人原本拿的文件不同<\/td>\n<\/tr>\n<tr>\n<td>桌边<\/td>\n<td>A 放在桌面左侧<\/td>\n<td>B 放在桌面右侧<\/td>\n<td>两个物件都能追踪，不凭空出现<\/td>\n<\/tr>\n<tr>\n<td>离开前<\/td>\n<td>B 拿起 X<\/td>\n<td>A 拿起 Y<\/td>\n<td>拿错的结果清楚<\/td>\n<\/tr>\n<tr>\n<td>结尾<\/td>\n<td>B 带 X 离开<\/td>\n<td>A 拿 Y 走向门口<\/td>\n<td>交换成为下一场的起点<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>不是要求观众理解复杂手法，只是看见一件意外发生。如果要改成故意的调包，需要重新定义：谁故意、谁不知道、观众什么时候知道。别把两个版本混在一起。<\/p>\n<h2 id=\"cases-08-object-exchange-section-4\">空间草案<\/h2>\n<p>长桌在大厅中部，门在桌后偏右。A 从近侧走到桌前，B 从远侧靠近。两人到桌边都只需几步。机位初始在桌侧，能看见两人的手。<\/p>\n<p>可以先假设人物离桌约 2 米、机位离桌约 2 米。<strong>但这两个数字不能证明接触可见<\/strong>，还要看遮挡、取景和物件大小。<\/p>\n<h2 id=\"cases-08-object-exchange-section-5\">一镜到底方案<\/h2>\n<p>前段用双人中景建立两份文件。人物把文件先后放到桌上，相机略向桌侧移动，保持两份文件可见。中段人物因为另一件普通事情短暂转移注意，随后各自拿起错误的文件。末段镜头不再追脸，让两份文件在不同人手中分开离去。<\/p>\n<p><strong>不同时要求相机从腿部贴地升起、穿桌、绕背、再升到俯视。<\/strong> 一次小移动够了，就不加运动。<\/p>\n<h2 id=\"cases-08-object-exchange-section-6\">给预演助手的任务<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">建立简化的大厅、长桌、门、A 和 B，以及两个不同颜色和边框宽度的文件代理物。按状态表安排放下与拿起，保证文件不复制、不消失。相机的主要任务是让观众辨认物件归属，而不是展示大厅。先输出\"放下之前、两份文件同在桌上、拿起之后\"三个机位检查画面。如果手部被身体遮挡，提出最小的站位或机位调整。通过检查后再输出连续预演。\n<\/code><\/pre>\n<p>预演里需要文件代理物和手部位置关系。只有人物方块在动，不足以检验拿取。<\/p>\n<h2 id=\"cases-08-object-exchange-section-7\">更省力的三镜头方案<\/h2>\n<p><strong>镜 1<\/strong>：双人中景，两人放下各自的文件。\n<strong>镜 2<\/strong>：桌面稍高角度，两只手分别拿走错误的文件，颜色和边框可见。\n<strong>镜 3<\/strong>：两人离开，各自拿着错误的文件，给下一场用。<\/p>\n<p>三镜头降低了同时控制相机、人物和接触的压力。但要维护手、袖口、桌面和物件的方位。<strong>不是用了切镜就可以忽略连续性。<\/strong><\/p>\n<h2 id=\"cases-08-object-exchange-section-8\">最先测试什么<\/h2>\n<p>先测试镜 2 的物件区分和拿取，不先生成大厅全景。<\/p>\n<p>播放给不知剧情的人，只问：\"开头各拿什么，结尾各拿什么？\"如果说不清，先改识别特征、机位或停留时间，不直接加旁白解释。<\/p>\n<h2 id=\"cases-08-object-exchange-section-9\">生成之后<\/h2>\n<p>以实际通过的片段更新下一镜的持有状态。<strong>提示词里写着 A 拿 Y，不能代替画面真的如此。<\/strong><\/p>\n<p>相关流程：<a href=\"#/workflows/06-previs\">预演<\/a>、<a href=\"#/workflows/05-assets-multishot\">资产交接<\/a>。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 36｜完整案例：两份文件，谁最后拿着哪一份\n\n> 设计样稿，借鉴了一个教程里的控制问题，不复原它的剧情。没有搭建或生成预演。距离和秒数是方案数值，不是实测。\n\n## 任务\n\n约 24 秒。A 和 B 在大厅桌边交错，各自拿错了对方的文件。观众要看清交换的结果，人物暂时没有发现。\n\n不能让剧情完全依赖文件上不可读的小字。\n\n## 大多数人的第一稿\n\n> 一镜到底，镜头从低角度缓缓升起，环绕两人，穿过桌子，最后俯视。两人交换了文件。\n\n问题：运镜设计得很漂亮，但**观众怎么知道文件换了？** 什么时候看到原件？什么时候看到拿错？这些信息在哪个瞬间被看见？一条漂亮的曲线不回答这些。\n\n## 先让道具能被认出来\n\n两份文件用**蓝色窄边文件夹 X**和**黄色宽边文件夹 Y**区分。颜色和形状是观众的识别线索，不是逼 AI 理解\"真\"和\"假\"这种抽象标签。\n\n## 状态表先于相机路线\n\n| 时段 | X 在哪 | Y 在哪 | 观众需要看懂什么 |\n| --- | --- | --- | --- |\n| 开场 | A 手中 | B 手中 | 两人原本拿的文件不同 |\n| 桌边 | A 放在桌面左侧 | B 放在桌面右侧 | 两个物件都能追踪，不凭空出现 |\n| 离开前 | B 拿起 X | A 拿起 Y | 拿错的结果清楚 |\n| 结尾 | B 带 X 离开 | A 拿 Y 走向门口 | 交换成为下一场的起点 |\n\n不是要求观众理解复杂手法，只是看见一件意外发生。如果要改成故意的调包，需要重新定义：谁故意、谁不知道、观众什么时候知道。别把两个版本混在一起。\n\n## 空间草案\n\n长桌在大厅中部，门在桌后偏右。A 从近侧走到桌前，B 从远侧靠近。两人到桌边都只需几步。机位初始在桌侧，能看见两人的手。\n\n可以先假设人物离桌约 2 米、机位离桌约 2 米。**但这两个数字不能证明接触可见**，还要看遮挡、取景和物件大小。\n\n## 一镜到底方案\n\n前段用双人中景建立两份文件。人物把文件先后放到桌上，相机略向桌侧移动，保持两份文件可见。中段人物因为另一件普通事情短暂转移注意，随后各自拿起错误的文件。末段镜头不再追脸，让两份文件在不同人手中分开离去。\n\n**不同时要求相机从腿部贴地升起、穿桌、绕背、再升到俯视。** 一次小移动够了，就不加运动。\n\n## 给预演助手的任务\n\n```text\n建立简化的大厅、长桌、门、A 和 B，以及两个不同颜色和边框宽度的文件代理物。按状态表安排放下与拿起，保证文件不复制、不消失。相机的主要任务是让观众辨认物件归属，而不是展示大厅。先输出\"放下之前、两份文件同在桌上、拿起之后\"三个机位检查画面。如果手部被身体遮挡，提出最小的站位或机位调整。通过检查后再输出连续预演。\n```\n\n预演里需要文件代理物和手部位置关系。只有人物方块在动，不足以检验拿取。\n\n## 更省力的三镜头方案\n\n**镜 1**：双人中景，两人放下各自的文件。\n**镜 2**：桌面稍高角度，两只手分别拿走错误的文件，颜色和边框可见。\n**镜 3**：两人离开，各自拿着错误的文件，给下一场用。\n\n三镜头降低了同时控制相机、人物和接触的压力。但要维护手、袖口、桌面和物件的方位。**不是用了切镜就可以忽略连续性。**\n\n## 最先测试什么\n\n先测试镜 2 的物件区分和拿取，不先生成大厅全景。\n\n播放给不知剧情的人，只问：\"开头各拿什么，结尾各拿什么？\"如果说不清，先改识别特征、机位或停留时间，不直接加旁白解释。\n\n## 生成之后\n\n以实际通过的片段更新下一镜的持有状态。**提示词里写着 A 拿 Y，不能代替画面真的如此。**\n\n相关流程：[预演](/workflows/06-previs.md)、[资产交接](/workflows/05-assets-multishot.md)。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [1
