以这样写<\/strong>：浅色墙上留一块空白，刚被碰过的水面很快平下来，人物动作轻但不黏。声音可以有短而干净的起音，尾巴留出间隔。<\/p>\n<p><strong>另一条路<\/strong>：暖阳下晒干的衬衫，同样清爽。清爽不必是冰蓝、薄荷、水花三件套。<\/p>\n<p><strong>别这样<\/strong>：画面里塞满\"清爽\"的证据。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-2\">02．轻盈：重量被温柔地处理<\/h2>\n<p><strong>核心<\/strong>：东西有重量，只是不显笨重。<\/p>\n<p><strong>可以这样写<\/strong>：手托住薄玻璃杯时几乎没有晃动，衣角随转身晚一点落下，剪辑不在每一步都落重音。<\/p>\n<p><strong>别这样<\/strong>：\"完全失重的真实生活\"。失重和日常物理要分清；如果要失重，明确说那是风格化规则。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-3\">03．柔软：边缘愿意让步<\/h2>\n<p><strong>核心<\/strong>：接触的地方是圆的。<\/p>\n<p><strong>可以这样写<\/strong>：光从较大的窗面慢慢包到脸侧，布料碰到手臂时留下圆润的褶皱。音乐的开头不是尖锐的敲击，像音已经在空气里，慢慢被听见。<\/p>\n<p><strong>保留一处清楚<\/strong>：眼睛、产品字标或轮廓不能全化掉。柔软不是失焦和没结构。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-4\">04．温暖：不是全画面橙色<\/h2>\n<p><strong>核心<\/strong>：一小块暖，把人留在一起。<\/p>\n<p><strong>可以这样写<\/strong>：门边还有冷一点的走廊光，桌面那一小块暖色把两个人留在一起。杯子的温度通过手掌停留、微弱蒸气或说话的距离表现，不必每个镜头都夕阳泛黄。<\/p>\n<p><strong>声音方向<\/strong>：近、松弛、不过度修饰。真实的室内细声可以代替抒情弦乐。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-5\">05．清冷：有边界，但不必无情<\/h2>\n<p><strong>核心<\/strong>：人和人之间有空隙，没有人急着填。<\/p>\n<p><strong>可以这样写<\/strong>：白天的窗光干净，反射少，人物之间有距离，声音稍远。一个人不急着回应，让空间留下完整的静。<\/p>\n<p><strong>另一种解释<\/strong>：清冷也可以是清醒、自主、干净，不一定等于悲伤。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-6\">06．梦幻：现实有一处规则轻轻偏了<\/h2>\n<p><strong>核心<\/strong>：只偏一处，其余照常。<\/p>\n<p><strong>可以这样写<\/strong>：房间和人物都可信，只让窗上的光慢半拍跟着人动，或者让一片叶影轻得像浮在墙前。<\/p>\n<p><strong>别这样<\/strong>：雾、漂浮粒子、柔光、慢动作、星空同时叠满。梦可以轻薄，也可以锐利、空旷、让人不安。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-7\">07．神秘：给出局部，延迟解释<\/h2>\n<p><strong>核心<\/strong>：信息不对称，不是颜色。<\/p>\n<p><strong>可以这样写<\/strong>：先听见有人把椅子拖开，却不马上看见房间里面。人物停在门边，光从门缝落在鞋上，门后的声音又恢复安静。<\/p>\n<p><strong>别这样<\/strong>：黑、蓝、烟的色卡。如果全部藏住，观众只是不知道该关心什么。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-8\">08．压迫：出口在，但暂时用不上<\/h2>\n<p><strong>核心<\/strong>：可以走，但被什么挡着。<\/p>\n<p><strong>可以这样写<\/strong>：门明明在身后，人却被桌边另一个人的身体挡住，画面留给他转身的空间很窄。环境声持续、间隙很少，好像插不进一句话。<\/p>\n<p><strong>另一条路<\/strong>：巨大空旷、只有一个人的脚步声，也能压迫。不只有广角贴脸和低频轰鸣。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-9\">09．松弛：不急着证明自己在松弛<\/h2>\n<p><strong>核心<\/strong>：没有被催促的感觉。<\/p>\n<p><strong>可以这样写<\/strong>：人把话说到一半去看窗外，朋友等他回来再接。动作有停留，也有目的。镜头不替每个动作强调。<\/p>\n<p><strong>注意<\/strong>：松弛不是驼背、凌乱、困倦。很讲究的茶席也可以松弛，只要没有被催促。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-10\">10．高级：先把这个词拆掉<\/h2>\n<p><strong>核心<\/strong>：它可能指五六种完全不同的东西。<\/p>\n<p>材料可信？比例克制？制作精确？有文化辨识度？想法罕见？还是品牌的价格信号？先问要哪一种。<\/p>\n<p><strong>表现精确<\/strong>：瓶盖和瓶身的接缝清晰，反光位置有节制，字标周围留白干净。<\/p>\n<p><strong>表现文化气质<\/strong>：选有依据的比例、纹样、工艺，而不是黑金背景加大理石。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-11\">11．生命力：东西会互相影响<\/h2>\n<p><strong>核心<\/strong>：不是各自播放的三段循环。<\/p>\n<p><strong>可以这样写<\/strong>：人跑起来，花束轻轻颠簸；看见朋友后步伐变了；朋友让开一点让她通过。<\/p>\n<p><strong>另一条路<\/strong>：生命力也可以很安静——一次真实地听见，一次有分寸地接话。不必跳跃、大笑、加速。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-12\">12．欲望：注意力反复回到某处<\/h2>\n<p><strong>核心<\/strong>：手要离开了，又停一下。<\/p>\n<p><strong>可以这样写<\/strong>：不拍\"迷恋的表情\"，让手快要离开物件时再停一下，视线回到一处材质的反光。声音收近，让触碰的细节比环境更清楚。<\/p>\n<p><strong>用于产品时<\/strong>：保持产品的真实用途，不靠无关的身体特写代替触感设计。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-13\">13．怀旧：过去留下了使用方式<\/h2>\n<p><strong>核心<\/strong>：东西被用过，还在被用。<\/p>\n<p><strong>可以这样写<\/strong>：桌边被长年手臂磨亮，按钮有一点不均匀的回弹，收音机调台时有短暂噪声。人物还在使用这些东西，而不是站在复古陈列室里。<\/p>\n<p><strong>别这样<\/strong>：所有颜色都泛黄。怀旧可以是很明亮的夏天，只在声音、排版和道具年代里留下时间。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-14\">14．荒诞：认真地执行一条不寻常的规则<\/h2>\n<p><strong>核心<\/strong>：规则怪，但稳定。<\/p>\n<p><strong>可以这样写<\/strong>：办公室一切正常，每个人却把云当作文件传递。云有固定体积，放在桌上会压低一点，又慢慢回弹。没有人对着镜头解释笑点。<\/p>\n<p><strong>别这样<\/strong>：堆怪异元素。把世界规则说清楚，比堆怪东西更有效。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-15\">15．仪式感：给一件事留出完整的位置<\/h2>\n<p><strong>核心<\/strong>：准备、发生、结束，三段都有。<\/p>\n<p><strong>可以这样写<\/strong>：手先停稳，盒盖才被抬起。旁边的人等这个动作完成，音乐不抢在前面宣布惊喜。<\/p>\n<p><strong>注意<\/strong>：仪式感不自动属于奢华。一家人认真点亮一根很普通的生日蜡烛，也是仪式。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-16\">16．速度感：世界经过身体，不是画面忙起来<\/h2>\n<p><strong>核心<\/strong>：快需要一个慢的参照。<\/p>\n<p><strong>可以这样写<\/strong>：近处栏杆迅速掠过，远处建筑变化较慢。人物有明确的前进方向，短促的接触声跟得上关键动作。停下来时，衣物和呼吸接住速度的余量。<\/p>\n<p><strong>别这样<\/strong>：每个镜头都快切、拉焦、甩镜。给一次稳定或停顿，快才有地方被感觉到。<\/p>\n<hr/>\n<h2 id=\"language-05-atmosphere-atlas-section-17\">配方：不是把所有\"对应项\"都加上<\/h2>\n<p>选一个<strong>主要落点<\/strong>，一个<strong>配角<\/strong>，再留一点余量。<\/p>\n<p>比如\"清爽\"：让空间当主角，声音当配角，人的表演保持普通。<\/p>\n<p>比如\"压迫\"：让人物关系当主角，构图当配角，颜色反而可以明亮。<\/p>\n<p>完整用法见<a href=\"#/cases/01-brand-film\">品牌片案例<\/a>和<a href=\"#/cases/05-empty-corridor\">空走廊案例<\/a>。<\/p>\n<h2 id=\"language-05-atmosphere-atlas-section-18\">一句话记住<\/h2>\n<p><strong>氛围是关系，不是颜色。找到\"东西之间怎么相处\"，材料随便换。<\/strong><\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/theory\">借用了哪些理论，借到什么程度<\/a>\n[3] <a href=\"#/references/official-voice-light\">配音和灯光的官方说法<\/a><\/p>\n<\/details>","text":"# 10｜氛围图谱：16 种抽象感觉，各自可以落在什么材料上\n\n> 氛围不是撒在所有东西上的一层粉。它来自这些东西怎么靠近、怎么发声、怎么留下时间。\n\n## 怎么用这张图谱\n\n每种氛围给你：**核心是什么**（这种感觉本质上是什么关系）、**可以这样写**（一个例子）、**另一条路**（不同材料的同一种感觉）、**别这样**（最常见的套路）。\n\n**重点是关系，材料随便换。** 这张图谱不提供\"颜色对应情绪\"的字典。\n\n---\n\n## 01．清爽：有空气可以通过\n\n**核心**：不挤。\n\n**可以这样写**：浅色墙上留一块空白，刚被碰过的水面很快平下来，人物动作轻但不黏。声音可以有短而干净的起音，尾巴留出间隔。\n\n**另一条路**：暖阳下晒干的衬衫，同样清爽。清爽不必是冰蓝、薄荷、水花三件套。\n\n**别这样**：画面里塞满\"清爽\"的证据。\n\n## 02．轻盈：重量被温柔地处理\n\n**核心**：东西有重量，只是不显笨重。\n\n**可以这样写**：手托住薄玻璃杯时几乎没有晃动，衣角随转身晚一点落下，剪辑不在每一步都落重音。\n\n**别这样**：\"完全失重的真实生活\"。失重和日常物理要分清；如果要失重，明确说那是风格化规则。\n\n## 03．柔软：边缘愿意让步\n\n**核心**：接触的地方是圆的。\n\n**可以这样写**：光从较大的窗面慢慢包到脸侧，布料碰到手臂时留下圆润的褶皱。音乐的开头不是尖锐的敲击，像音已经在空气里，慢慢被听见。\n\n**保留一处清楚**：眼睛、产品字标或轮廓不能全化掉。柔软不是失焦和没结构。\n\n## 04．温暖：不是全画面橙色\n\n**核心**：一小块暖，把人留在一起。\n\n**可以这样写**：门边还有冷一点的走廊光，桌面那一小块暖色把两个人留在一起。杯子的温度通过手掌停留、微弱蒸气或说话的距离表现，不必每个镜头都夕阳泛黄。\n\n**声音方向**：近、松弛、不过度修饰。真实的室内细声可以代替抒情弦乐。\n\n## 05．清冷：有边界，但不必无情\n\n**核心**：人和人之间有空隙，没有人急着填。\n\n**可以这样写**：白天的窗光干净，反射少，人物之间有距离，声音稍远。一个人不急着回应，让空间留下完整的静。\n\n**另一种解释**：清冷也可以是清醒、自主、干净，不一定等于悲伤。\n\n## 06．梦幻：现实有一处规则轻轻偏了\n\n**核心**：只偏一处，其余照常。\n\n**可以这样写**：房间和人物都可信，只让窗上的光慢半拍跟着人动，或者让一片叶影轻得像浮在墙前。\n\n**别这样**：雾、漂浮粒子、柔光、慢动作、星空同时叠满。梦可以轻薄，也可以锐利、空旷、让人不安。\n\n## 07．神秘：给出局部，延迟解释\n\n**核心**：信息不对称，不是颜色。\n\n**可以这样写**：先听见有人把椅子拖开，却不马上看见房间里面。人物停在门边，光从门缝落在鞋上，门后的声音又恢复安静。\n\n**别这样**：黑、蓝、烟的色卡。如果全部藏住，观众只是不知道该关心什么。\n\n## 08．压迫：出口在，但暂时用不上\n\n**核心**：可以走，但被什么挡着。\n\n**可以这样写**：门明明在身后，人却被桌边另一个人的身体挡住，画面留给他转身的空间很窄。环境声持续、间隙很少，好像插不进一句话。\n\n**另一条路**：巨大空旷、只有一个人的脚步声，也能压迫。不只有广角贴脸和低频轰鸣。\n\n## 09．松弛：不急着证明自己在松弛\n\n**核心**：没有被催促的感觉。\n\n**可以这样写**：人把话说到一半去看窗外，朋友等他回来再接。动作有停留，也有目的。镜头不替每个动作强调。\n\n**注意**：松弛不是驼背、凌乱、困倦。很讲究的茶席也可以松弛，只要没有被催促。\n\n## 10．高级：先把这个词拆掉\n\n**核心**：它可能指五六种完全不同的东西。\n\n材料可信？比例克制？制作精确？有文化辨识度？想法罕见？还是品牌的价格信号？先问要哪一种。\n\n**表现精确**：瓶盖和瓶身的接缝清晰，反光位置有节制，字标周围留白干净。\n\n**表现文化气质**：选有依据的比例、纹样、工艺，而不是黑金背景加大理石。\n\n## 11．生命力：东西会互相影响\n\n**核心**：不是各自播放的三段循环。\n\n**可以这样写**：人跑起来，花束轻轻颠簸；看见朋友后步伐变了；朋友让开一点让她通过。\n\n**另一条路**：生命力也可以很安静——一次真实地听见，一次有分寸地接话。不必跳跃、大笑、加速。\n\n## 12．欲望：注意力反复回到某处\n\n**核心**：手要离开了，又停一下。\n\n**可以这样写**：不拍\"迷恋的表情\"，让手快要离开物件时再停一下，视线回到一处材质的反光。声音收近，让触碰的细节比环境更清楚。\n\n**用于产品时**：保持产品的真实用途，不靠无关的身体特写代替触感设计。\n\n## 13．怀旧：过去留下了使用方式\n\n**核心**：东西被用过，还在被用。\n\n**可以这样写**：桌边被长年手臂磨亮，按钮有一点不均匀的回弹，收音机调台时有短暂噪声。人物还在使用这些东西，而不是站在复古陈列室里。\n\n**别这样**：所有颜色都泛黄。怀旧可以是很明亮的夏天，只在声音、排版和道具年代里留下时间。\n\n## 14．荒诞：认真地执行一条不寻常的规则\n\n**核心**：规则怪，但稳定。\n\n**可以这样写**：办公室一切正常，每个人却把云当作文件传递。云有固定体积，放在桌上会压低一点，又慢慢回弹。没有人对着镜头解释笑点。\n\n**别这样**：堆怪异元素。把世界规则说清楚，比堆怪东西更有效。\n\n## 15．仪式感：给一件事留出完整的位置\n\n**核心**：准备、发生、结束，三段都有。\n\n**可以这样写**：手先停稳，盒盖才被抬起。旁边的人等这个动作完成，音乐不抢在前面宣布惊喜。\n\n**注意**：仪式感不自动属于奢华。一家人认真点亮一根很普通的生日蜡烛，也是仪式。\n\n## 16．速度感：世界经过身体，不是画面忙起来\n\n**核心**：快需要一个慢的参照。\n\n**可以这样写**：近处栏杆迅速掠过，远处建筑变化较慢。人物有明确的前进方向，短促的接触声跟得上关键动作。停下来时，衣物和呼吸接住速度的余量。\n\n**别这样**：每个镜头都快切、拉焦、甩镜。给一次稳定或停顿，快才有地方被感觉到。\n\n---\n\n## 配方：不是把所有\"对应项\"都加上\n\n选一个**主要落点**，一个**配角**，再留一点余量。\n\n比如\"清爽\"：让空间当主角，声音当配角，人的表演保持普通。\n\n比如\"压迫\"：让人物关系当主角，构图当配角，颜色反而可以明亮。\n\n完整用法见[品牌片案例](/cases/01-brand-film.md)和[空走廊案例](/cases/05-empty-corridor.md)。\n\n## 一句话记住\n\n**氛围是关系，不是颜色。找到\"东西之间怎么相处\"，材料随便换。**\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [借用了哪些理论，借到什么程度](/references/theory.md)\n[3] [配音和灯光的官方说法](/references/official-voice-light.md)","toc":[{"id":"language-05-atmosphere-atlas-section-0","title":"怎么用这张图谱"},{"id":"language-05-atmosphere-atlas-section-1","title":"01．清爽：有空气可以通过"},{"id":"language-05-atmosphere-atlas-section-2","title":"02．轻盈：重量被温柔地处理"},{"id":"language-05-atmosphere-atlas-section-3","title":"03．柔软：边缘愿意让步"},{"id":"language-05-atmosphere-atlas-section-4","title":"04．温暖：不是全画面橙色"},{"id":"language-05-atmosphere-atlas-section-5","title":"05．清冷：有边界，但不必无情"},{"id":"language-05-atmosphere-atlas-section-6","title":"06．梦幻：现实有一处规则轻轻偏了"},{"id":"language-05-atmosphere-atlas-section-7","title":"07．神秘：给出局部，延迟解释"},{"id":"language-05-atmosphere-atlas-section-8","title":"08．压迫：出口在，但暂时用不上"},{"id":"language-05-atmosphere-atlas-section-9","title":"09．松弛：不急着证明自己在松弛"},{"id":"language-05-atmosphere-atlas-section-10","title":"10．高级：先把这个词拆掉"},{"id":"language-05-atmosphere-atlas-section-11","title":"11．生命力：东西会互相影响"},{"id":"language-05-atmosphere-atlas-section-12","title":"12．欲望：注意力反复回到某处"},{"id":"language-05-atmosphere-atlas-section-13","title":"13．怀旧：过去留下了使用方式"},{"id":"language-05-atmosphere-atlas-section-14","title":"14．荒诞：认真地执行一条不寻常的规则"},{"id":"language-05-atmosphere-atlas-section-15","title":"15．仪式感：给一件事留出完整的位置"},{"id":"language-05-atmosphere-atlas-section-16","title":"16．速度感：世界经过身体，不是画面忙起来"},{"id":"language-05-atmosphere-atlas-section-17","title":"配方：不是把所有\"对应项\"都加上"},{"id":"language-05-atmosphere-atlas-section-18","title":"一句话记住"}]},{"id":"language/06-rewrite-clinic","path":"language/06-rewrite-clinic.md","title":"11｜改写诊所：12 组\"写成这样 → 改成这样\"","description":"三种常见病：只有标签、写成散文、控制过度。每组对照都告诉你改了什么、为什么。","type":"Technique","group":"language","tags":["改写","例子","自然语言"],"html":"<h1>11｜改写诊所：12 组\"写成这样 → 改成这样\"<\/h1>\n<h2 id=\"language-06-rewrite-clinic-section-0\">三种常见病<\/h2>\n<p><strong>只有标签<\/strong>：<code>女人悲伤地坐着，电影感。<\/code>——只有结论，没有过程。<\/p>\n<p><strong>写成散文<\/strong>：<code>她的心像被雨打湿的纸，慢慢在夜色里溶解……<\/code>——有感觉，但 AI 不知道画什么。<\/p>\n<p><strong>控制过度<\/strong>：<code>眼角、鼻翼、下巴依次颤抖，三秒内落泪。<\/code>——AI 做不到，做到了也像机器人。<\/p>\n<p>下面 12 组，每组先给病例，再给一种可用的改法，最后说改了什么。<strong>\"可用的改法\"不是唯一正确答案<\/strong>，你的项目可能需要完全不同的方向。<\/p>\n<hr/>\n<h2 id=\"language-06-rewrite-clinic-section-1\">1．\"悲伤\"没有错，缺的是这一次的悲伤<\/h2>\n<p><strong>写成这样<\/strong>：<code>女人悲伤地坐着，电影感。<\/code><\/p>\n<p><strong>或者这样（过度）<\/strong>：<code>眼角、鼻翼、下巴依次颤抖，三秒内落泪。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>她坐在已经收拾好的房间里，手还搭在椅背上。有人叫她走，她应了一声，却没有马上站起来。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：悲伤有了时间和阻力，落在\"没有完成的起身\"上。如果项目就是要痛哭，那就直接设计痛哭，不必套这个。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-2\">2．\"快乐\"不应该被修成不敢快乐<\/h2>\n<p><strong>写成这样<\/strong>：<code>女孩开心，自然微笑。<\/code><\/p>\n<p><strong>或者这样（过修）<\/strong>：<code>极其克制，不能大笑，不能有明显动作。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>她认出人群里的朋友，边挥手边快步跑过去，笑声先到了。最后几步明显收住，怕撞到对方，但拥抱的时候还是带着一点冲劲。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：喜悦有强度，也有接触前后的动作逻辑。\"克制\"不是默认更高级。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-3\">3．\"愤怒\"不只是音量<\/h2>\n<p><strong>写成这样<\/strong>：<code>男人愤怒地说：\"你早就知道。\"<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>\"你\"字说得很清楚，像在确认对象。\"早就\"加重，后面的\"知道\"落下来。不是喊给全屋听，而是让面前这个人没法再躲开这句话。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：重音和说话对象明确了。实际的声音效果还需要试听。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-4\">4．\"自然\"不等于必须加瑕疵<\/h2>\n<p><strong>写成这样<\/strong>：<code>真实自然，皮肤细腻，活人感。<\/code><\/p>\n<p><strong>或者这样（过修）<\/strong>：<code>大量毛孔、颗粒、手持乱晃、曝光失误。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>她顺手把滑到手背的袖口挽回去，继续刚才没说完的话。保留原来干净的光，不加额外颗粒。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：自然来自动作的连续性，不是瑕疵的数量。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-5\">5．\"梦幻\"不是平均起雾<\/h2>\n<p><strong>写成这样<\/strong>：<code>梦幻唯美的香水广告。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>瓶身保持清楚。背景的花影像隔着浅水被轻轻推开，只有影子在变，花和台面都安静不动。梦意停在背景，不吞掉产品。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：明确了现实和非现实各落在哪一层。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-6\">6．\"高级\"不是写满设备名<\/h2>\n<p><strong>写成这样<\/strong>：<code>ARRI、电影大师、8K、奢华。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>深色瓶身只保留两条窄而连续的高光，标签正面清晰，瓶盖的金属边不泛成一大片白。背景有距离，但不抢主体。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：审美落到了比例和材料关系，不是品牌词。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-7\">7．\"轻轻\"不是整条慢放<\/h2>\n<p><strong>写成这样<\/strong>：<code>轻轻把盒子放下。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>他把盒子移到桌上，接近桌面时才收慢。指尖多扶了一下，确认它站稳后离开。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：只在关键接触处控制速度。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-8\">8．\"镜头有现场感\"不是永远在抖<\/h2>\n<p><strong>写成这样<\/strong>：<code>手持拍摄，真实电影感。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>镜头在她身后半步跟着走，转角时稍晚一点跟上，让门框短暂经过前景。整体稳定，只有走路带来的轻微起伏。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：抖动有来源、有幅度，也有观看的理由。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-9\">9．\"紧张地等待\"不一定要拍脸<\/h2>\n<p><strong>写成这样<\/strong>：<code>面部紧张，焦虑，不安。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>电梯数字迟迟不变。她手里的钥匙碰了一声，之后被握住，不再响。镜头只拍手和关闭的电梯门。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：手、道具和声音一起承担，脸不必进画面。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-10\">10．\"同一人物\"要先解决参考图冲突<\/h2>\n<p><strong>写成这样<\/strong>：<code>千万别换脸，绝对一致，一模一样。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>人物身份用参考 A。本场服装用参考 B。A 里的旧外套不延续到这一场。其余姿态以当前首帧为起点。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：先说清谁提供什么。这个前提是参考图真的上传了。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-11\">11．\"移过去\"要区分复制和搬动<\/h2>\n<p><strong>写成这样<\/strong>：<code>把标 1 的花瓶移到标 2。<\/code><\/p>\n<p><strong>改成这样<\/strong>：<\/p>\n<blockquote>\n<p>把标 1 指的这只花瓶移到标 2 的桌面区域，原来的位置恢复成空桌面。保持同一个瓶身和花枝，按新位置调整接触阴影，最后去掉辅助标记。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：补齐了移动前后的状态，避免出现两只花瓶。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-12\">12．删掉一半，反而更完整<\/h2>\n<p><strong>原句<\/strong>：<code>极度细腻自然真实的年轻女孩，优雅而灵动，慢慢轻轻转过脸，带着五味杂陈的心情，镜头缓缓平稳推近又轻微环绕……<\/code><\/p>\n<p><strong>针对已经确定的首帧，改成这样<\/strong>：<\/p>\n<blockquote>\n<p>她听见自己的名字，转向声音来的方向，认出对方后笑了。镜头留在原地。<\/p>\n<\/blockquote>\n<p><strong>改了什么<\/strong>：一个刺激、一个反应、一个镜头选择。不是所有项目都要这一版，而是这条任务已经不需要更多。<\/p>\n<hr/>\n<h2 id=\"language-06-rewrite-clinic-section-13\">改完之后，别只比文字<\/h2>\n<p>提示词读起来更像文学、更像教科书、或者更像工程规范，都不能代替<strong>成片有没有表达对<\/strong>。怎么看结果、怎么修，见<a href=\"#/workflows/07-evaluate-repair\">评价与修复<\/a>。<\/p>\n<h2 id=\"language-06-rewrite-clinic-section-14\">一句话记住<\/h2>\n<p><strong>只有标签就补过程，写成散文就找落点，控制过度就删到只剩关键接触。<\/strong><\/p>\n<h2 id=\"language-06-rewrite-clinic-section-15\">动手试试<\/h2>\n<p>从上面 12 组里挑一个\"写成这样\"，不看答案，自己改一版。然后对比。不用和书里一样——重点是你能说出\"我改了什么、为什么\"。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 11｜改写诊所：12 组\"写成这样 → 改成这样\"\n\n## 三种常见病\n\n**只有标签**：`女人悲伤地坐着，电影感。`——只有结论，没有过程。\n\n**写成散文**：`她的心像被雨打湿的纸，慢慢在夜色里溶解……`——有感觉，但 AI 不知道画什么。\n\n**控制过度**：`眼角、鼻翼、下巴依次颤抖，三秒内落泪。`——AI 做不到，做到了也像机器人。\n\n下面 12 组，每组先给病例，再给一种可用的改法，最后说改了什么。**\"可用的改法\"不是唯一正确答案**，你的项目可能需要完全不同的方向。\n\n---\n\n## 1．\"悲伤\"没有错，缺的是这一次的悲伤\n\n**写成这样**：`女人悲伤地坐着，电影感。`\n\n**或者这样（过度）**：`眼角、鼻翼、下巴依次颤抖，三秒内落泪。`\n\n**改成这样**：\n> 她坐在已经收拾好的房间里，手还搭在椅背上。有人叫她走，她应了一声，却没有马上站起来。\n\n**改了什么**：悲伤有了时间和阻力，落在\"没有完成的起身\"上。如果项目就是要痛哭，那就直接设计痛哭，不必套这个。\n\n## 2．\"快乐\"不应该被修成不敢快乐\n\n**写成这样**：`女孩开心，自然微笑。`\n\n**或者这样（过修）**：`极其克制，不能大笑，不能有明显动作。`\n\n**改成这样**：\n> 她认出人群里的朋友，边挥手边快步跑过去，笑声先到了。最后几步明显收住，怕撞到对方，但拥抱的时候还是带着一点冲劲。\n\n**改了什么**：喜悦有强度，也有接触前后的动作逻辑。\"克制\"不是默认更高级。\n\n## 3．\"愤怒\"不只是音量\n\n**写成这样**：`男人愤怒地说：\"你早就知道。\"`\n\n**改成这样**：\n> \"你\"字说得很清楚，像在确认对象。\"早就\"加重，后面的\"知道\"落下来。不是喊给全屋听，而是让面前这个人没法再躲开这句话。\n\n**改了什么**：重音和说话对象明确了。实际的声音效果还需要试听。\n\n## 4．\"自然\"不等于必须加瑕疵\n\n**写成这样**：`真实自然，皮肤细腻，活人感。`\n\n**或者这样（过修）**：`大量毛孔、颗粒、手持乱晃、曝光失误。`\n\n**改成这样**：\n> 她顺手把滑到手背的袖口挽回去，继续刚才没说完的话。保留原来干净的光，不加额外颗粒。\n\n**改了什么**：自然来自动作的连续性，不是瑕疵的数量。\n\n## 5．\"梦幻\"不是平均起雾\n\n**写成这样**：`梦幻唯美的香水广告。`\n\n**改成这样**：\n> 瓶身保持清楚。背景的花影像隔着浅水被轻轻推开，只有影子在变，花和台面都安静不动。梦意停在背景，不吞掉产品。\n\n**改了什么**：明确了现实和非现实各落在哪一层。\n\n## 6．\"高级\"不是写满设备名\n\n**写成这样**：`ARRI、电影大师、8K、奢华。`\n\n**改成这样**：\n> 深色瓶身只保留两条窄而连续的高光，标签正面清晰，瓶盖的金属边不泛成一大片白。背景有距离，但不抢主体。\n\n**改了什么**：审美落到了比例和材料关系，不是品牌词。\n\n## 7．\"轻轻\"不是整条慢放\n\n**写成这样**：`轻轻把盒子放下。`\n\n**改成这样**：\n> 他把盒子移到桌上，接近桌面时才收慢。指尖多扶了一下，确认它站稳后离开。\n\n**改了什么**：只在关键接触处控制速度。\n\n## 8．\"镜头有现场感\"不是永远在抖\n\n**写成这样**：`手持拍摄，真实电影感。`\n\n**改成这样**：\n> 镜头在她身后半步跟着走，转角时稍晚一点跟上，让门框短暂经过前景。整体稳定，只有走路带来的轻微起伏。\n\n**改了什么**：抖动有来源、有幅度，也有观看的理由。\n\n## 9．\"紧张地等待\"不一定要拍脸\n\n**写成这样**：`面部紧张，焦虑，不安。`\n\n**改成这样**：\n> 电梯数字迟迟不变。她手里的钥匙碰了一声，之后被握住，不再响。镜头只拍手和关闭的电梯门。\n\n**改了什么**：手、道具和声音一起承担，脸不必进画面。\n\n## 10．\"同一人物\"要先解决参考图冲突\n\n**写成这样**：`千万别换脸，绝对一致，一模一样。`\n\n**改成这样**：\n> 人物身份用参考 A。本场服装用参考 B。A 里的旧外套不延续到这一场。其余姿态以当前首帧为起点。\n\n**改了什么**：先说清谁提供什么。这个前提是参考图真的上传了。\n\n## 11．\"移过去\"要区分复制和搬动\n\n**写成这样**：`把标 1 的花瓶移到标 2。`\n\n**改成这样**：\n> 把标 1 指的这只花瓶移到标 2 的桌面区域，原来的位置恢复成空桌面。保持同一个瓶身和花枝，按新位置调整接触阴影，最后去掉辅助标记。\n\n**改了什么**：补齐了移动前后的状态，避免出现两只花瓶。\n\n## 12．删掉一半，反而更完整\n\n**原句**：`极度细腻自然真实的年轻女孩，优雅而灵动，慢慢轻轻转过脸，带着五味杂陈的心情，镜头缓缓平稳推近又轻微环绕……`\n\n**针对已经确定的首帧，改成这样**：\n> 她听见自己的名字，转向声音来的方向，认出对方后笑了。镜头留在原地。\n\n**改了什么**：一个刺激、一个反应、一个镜头选择。不是所有项目都要这一版，而是这条任务已经不需要更多。\n\n---\n\n## 改完之后，别只比文字\n\n提示词读起来更像文学、更像教科书、或者更像工程规范，都不能代替**成片有没有表达对**。怎么看结果、怎么修，见[评价与修复](/workflows/07-evaluate-repair.md)。\n\n## 一句话记住\n\n**只有标签就补过程，写成散文就找落点，控制过度就删到只剩关键接触。**\n\n## 动手试试\n\n从上面 12 组里挑一个\"写成这样\"，不看答案，自己改一版。然后对比。不用和书里一样——重点是你能说出\"我改了什么、为什么\"。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"language-06-rewrite-clinic-section-0","title":"三种常见病"},{"id":"language-06-rewrite-clinic-section-1","title":"1．\"悲伤\"没有错，缺的是这一次的悲伤"},{"id":"language-06-rewrite-clinic-section-2","title":"2．\"快乐\"不应该被修成不敢快乐"},{"id":"language-06-rewrite-clinic-section-3","title":"3．\"愤怒\"不只是音量"},{"id":"language-06-rewrite-clinic-section-4","title":"4．\"自然\"不等于必须加瑕疵"},{"id":"language-06-rewrite-clinic-section-5","title":"5．\"梦幻\"不是平均起雾"},{"id":"language-06-rewrite-clinic-section-6","title":"6．\"高级\"不是写满设备名"},{"id":"language-06-rewrite-clinic-section-7","title":"7．\"轻轻\"不是整条慢放"},{"id":"language-06-rewrite-clinic-section-8","title":"8．\"镜头有现场感\"不是永远在抖"},{"id":"language-06-rewrite-clinic-section-9","title":"9．\"紧张地等待\"不一定要拍脸"},{"id":"language-06-rewrite-clinic-section-10","title":"10．\"同一人物\"要先解决参考图冲突"},{"id":"language-06-rewrite-clinic-section-11","title":"11．\"移过去\"要区分复制和搬动"},{"id":"language-06-rewrite-clinic-section-12","title":"12．删掉一半，反而更完整"},{"id":"language-06-rewrite-clinic-section-13","title":"改完之后，别只比文字"},{"id":"language-06-rewrite-clinic-section-14","title":"一句话记住"},{"id":"language-06-rewrite-clinic-section-15","title":"动手试试"}]},{"id":"craft/index","path":"craft/index.md","title":"III · 视听专业","description":"","type":"Index","group":"craft","tags":[],"html":"<h1>III · 视听专业<\/h1>\n<p>分别学习表演、声音、动作、镜头、光线、美术、音乐、平面和剪辑，在提示词里各自该怎么写。按需读，不用全看。<\/p>\n<ul>\n<li><p><a href=\"#/craft/01-acting\">12｜表演：先问\"他想让谁怎么样\"，再写表情<\/a> — 情绪不是表情包。一个刺激、一次反应、一处看得见的变化。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/02-dialogue-voice\">13｜台词与配音：不是换一副嗓子，是换一种说话的关系<\/a> — 声音分四层，分开写。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/03-action-blocking\">14｜动作与调度：东西从哪来、到哪去，手上拿着什么<\/a> — 关键接触写清，走路怎么走交给 AI。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/04-camera-attention\">15｜镜头：先决定观众站在哪里，再决定镜头怎么动<\/a> — 一条镜头只干一件主要的活。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/05-light-material\">16｜光与材质：光从哪来、落在哪、什么东西怎么反应<\/a> — \"高级质感\"什么都没说。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/06-world-art-costume\">17｜美术与妆造：世界不是背景板，身份不只是一张脸<\/a> — 问\"这个人怎么生活\"，别问\"什么风格\"。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/07-sound-music\">18｜音乐与声音：先决定声音在干哪件事<\/a> — 撑空间、给重量、引注意、改理解、连段落。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/08-still-graphic-style\">19｜静态图、平面设计与风格化：一张图不必写成电影<\/a> — 允许没有故事，不允许没有选择。<\/p>\n<\/li>\n<li><p><a href=\"#/craft/09-time-montage\">20｜时间与剪辑：提示词里发生了，不代表观众来得及看懂<\/a> — 算三种时间，先定功能再填秒数。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# III · 视听专业\n\n分别学习表演、声音、动作、镜头、光线、美术、音乐、平面和剪辑，在提示词里各自该怎么写。按需读，不用全看。\n\n- [12｜表演：先问\"他想让谁怎么样\"，再写表情](/craft/01-acting.md) — 情绪不是表情包。一个刺激、一次反应、一处看得见的变化。\n\n- [13｜台词与配音：不是换一副嗓子，是换一种说话的关系](/craft/02-dialogue-voice.md) — 声音分四层，分开写。\n\n- [14｜动作与调度：东西从哪来、到哪去，手上拿着什么](/craft/03-action-blocking.md) — 关键接触写清，走路怎么走交给 AI。\n\n- [15｜镜头：先决定观众站在哪里，再决定镜头怎么动](/craft/04-camera-attention.md) — 一条镜头只干一件主要的活。\n\n- [16｜光与材质：光从哪来、落在哪、什么东西怎么反应](/craft/05-light-material.md) — \"高级质感\"什么都没说。\n\n- [17｜美术与妆造：世界不是背景板，身份不只是一张脸](/craft/06-world-art-costume.md) — 问\"这个人怎么生活\"，别问\"什么风格\"。\n\n- [18｜音乐与声音：先决定声音在干哪件事](/craft/07-sound-music.md) — 撑空间、给重量、引注意、改理解、连段落。\n\n- [19｜静态图、平面设计与风格化：一张图不必写成电影](/craft/08-still-graphic-style.md) — 允许没有故事，不允许没有选择。\n\n- [20｜时间与剪辑：提示词里发生了，不代表观众来得及看懂](/craft/09-time-montage.md) — 算三种时间，先定功能再填秒数。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"craft/01-acting","path":"craft/01-acting.md","title":"12｜表演：先问\"他想让谁怎么样\"，再写表情","description":"情绪不是表情包。从人物正在做的事出发，写一个刺激、一次反应、一处看得见的变化。","type":"Technique","group":"craft","tags":["表演","情绪","角色"],"html":"<h1>12｜表演：先问\"他想让谁怎么样\"，再写表情<\/h1>\n<h2 id=\"craft-01-acting-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>男人愤怒，眉头紧锁，眼神凌厉，嘴角下压，青筋暴起。<\/p>\n<\/blockquote>\n<p>这样写出来的人物，像在对着镜头示范\"愤怒\"。因为你给 AI 的是一张表情清单，不是一个正在发生的事。<\/p>\n<h2 id=\"craft-01-acting-section-1\">先问：他想影响谁<\/h2>\n<p>\"愤怒\"是一种状态。\"让对方承认他知道真相\"是一项任务。同样的愤怒，为了逼问、求助、挽留、或者结束关系，说话的方式和身体的选择完全不同。<\/p>\n<p><strong>给出对象和目标，人物才不会对着观众演。<\/strong><\/p>\n<p>一个够用的表演说明是：<strong>当下在做的事 + 一个刺激 + 反应的变化 + 从哪里看得出来。<\/strong><\/p>\n<p>不一定都是隐藏情绪。\"听到好消息，迫不及待告诉全屋的人\"同样完整。<\/p>\n<h2 id=\"craft-01-acting-section-2\">内外不一致是选项，不是唯一正确<\/h2>\n<p>有一种流行的说法叫\"反向表演\"：人物心里很难受，表面上却在做别的事。这确实好用，比如：<\/p>\n<blockquote>\n<p>她已经听懂了拒绝，却不想让第一次来的朋友难堪。她把菜单递给对方，继续问他想喝什么。只在收回手的时候，视线离开了一下。<\/p>\n<\/blockquote>\n<p>重要的不是\"必须隐忍\"，而是<strong>她仍在完成照顾对方的任务<\/strong>。<\/p>\n<p>但别走到另一个极端：把生气跺脚自动当成\"演过了\"，把\"没有任何表情\"当成\"内心丰富\"。直接、外放的情绪同样有价值。<\/p>\n<h2 id=\"craft-01-acting-section-3\">主动作、跟随动作、细微反应，有主有次<\/h2>\n<p>主动作：伸手接住盒子。\n跟随动作：袖口和盒上的丝带跟着动。\n细微反应：发现盒子里没有重量，再看向对方。<\/p>\n<p>不要写成三条互不相关的循环——\"她接盒子；袖子飘；眼睛闪动\"。要让它们<strong>互相引起<\/strong>：接到 → 感到不对 → 重新判断。<\/p>\n<p>而且只在对应景别能看见时，再写握力、眼神、呼吸的变化。远景里写\"瞳孔微缩\"没有意义。<\/p>\n<h2 id=\"craft-01-acting-section-4\">镜头给了什么，就写什么尺度<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>镜头给了什么<\/th>\n<th>优先写什么<\/th>\n<th>容易白写的要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>远景，人物很小<\/td>\n<td>站位、走停、转身、距离<\/td>\n<td>极细小的眼角变化承载全部剧情<\/td>\n<\/tr>\n<tr>\n<td>中景<\/td>\n<td>手部任务、重心、身体朝向、听者反应<\/td>\n<td>面部和手部同时塞满指令<\/td>\n<\/tr>\n<tr>\n<td>近景<\/td>\n<td>看向谁、反应延迟、嘴角或下颌的变化<\/td>\n<td>没有对象的一连串\"微表情\"<\/td>\n<\/tr>\n<tr>\n<td>手部或道具特写<\/td>\n<td>触碰、迟疑、松开、使用痕迹<\/td>\n<td>无缘无故要求全身表演<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>这张表是创作建议，不是 AI 的规格书。发布的画幅和观众实际看的屏幕大小，也会影响能看清什么。<\/p>\n<h2 id=\"craft-01-acting-section-5\">一次反应，三个节拍<\/h2>\n<p><strong>先维持原来的事<\/strong>：还在整理桌面。\n<strong>刺激真的进来了<\/strong>：听到名字，动作停住。\n<strong>做出新的选择<\/strong>：把杯子放回，转身去开门。<\/p>\n<p>不要为了显得有时间感，写成\"0.2 秒眉毛动、0.4 秒瞳孔放大\"。秒数是给剪辑和预算用的，不能代替动作的因果。<\/p>\n<p>如果只有三秒，就减少反应的层次。别要求角色在同一秒里从震惊到悲伤再到释然。<\/p>\n<h2 id=\"craft-01-acting-section-6\">别忘了听的那个人<\/h2>\n<p>说话的人不是唯一的事件。听的人是否打断、后退、继续手头的事、把东西接过来——这些都会改变关系。<\/p>\n<blockquote>\n<p>她说\"我没事\"，对方没有马上劝她，只把刚要收走的椅子放回原处。<\/p>\n<\/blockquote>\n<p>画面没有解释安慰，但一个\"留座\"的动作让关系变了。听者也不必每句话都点头微笑，生活里有不同步和误解。<\/p>\n<h2 id=\"craft-01-acting-section-7\">表演失败了怎么修<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>症状<\/th>\n<th>先做什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>太满，像表情包<\/td>\n<td>减少同时发生的表情，保留任务和一次关键反应<\/td>\n<\/tr>\n<tr>\n<td>太空，像木头<\/td>\n<td>不要加\"更有演技\"，补上刺激和动作的后果<\/td>\n<\/tr>\n<tr>\n<td>像摆拍<\/td>\n<td>检查人物是不是无缘无故一直看镜头<\/td>\n<\/tr>\n<tr>\n<td>动作奇怪<\/td>\n<td>回到首帧的手、姿势、道具位置，别只改情绪词<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>强烈情绪的完整例子见<a href=\"#/cases/03-big-emotion\">喜悦真的可以冲出来<\/a>，小反应的例子见<a href=\"#/cases/02-relationship\">餐桌关系<\/a>。<\/p>\n<h2 id=\"craft-01-acting-section-8\">一句话记住<\/h2>\n<p><strong>先写他在做什么、想让谁怎么样，再写发生了什么、他怎么变。表情是最后才需要的东西。<\/strong><\/p>\n<h2 id=\"craft-01-acting-section-9\">动手试试<\/h2>\n<p>写一个人\"听到坏消息\"。先写他当时正在做的一件普通事（切菜、系鞋带、翻书），再写坏消息进来时这件事怎么被打断，最后写他做了什么新的选择。全程不许用\"悲伤\"\"震惊\"这类词。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 12｜表演：先问\"他想让谁怎么样\"，再写表情\n\n## 问题在哪里\n\n> 男人愤怒，眉头紧锁，眼神凌厉，嘴角下压，青筋暴起。\n\n这样写出来的人物，像在对着镜头示范\"愤怒\"。因为你给 AI 的是一张表情清单，不是一个正在发生的事。\n\n## 先问：他想影响谁\n\n\"愤怒\"是一种状态。\"让对方承认他知道真相\"是一项任务。同样的愤怒，为了逼问、求助、挽留、或者结束关系，说话的方式和身体的选择完全不同。\n\n**给出对象和目标，人物才不会对着观众演。**\n\n一个够用的表演说明是：**当下在做的事 + 一个刺激 + 反应的变化 + 从哪里看得出来。**\n\n不一定都是隐藏情绪。\"听到好消息，迫不及待告诉全屋的人\"同样完整。\n\n## 内外不一致是选项，不是唯一正确\n\n有一种流行的说法叫\"反向表演\"：人物心里很难受，表面上却在做别的事。这确实好用，比如：\n\n> 她已经听懂了拒绝，却不想让第一次来的朋友难堪。她把菜单递给对方，继续问他想喝什么。只在收回手的时候，视线离开了一下。\n\n重要的不是\"必须隐忍\"，而是**她仍在完成照顾对方的任务**。\n\n但别走到另一个极端：把生气跺脚自动当成\"演过了\"，把\"没有任何表情\"当成\"内心丰富\"。直接、外放的情绪同样有价值。\n\n## 主动作、跟随动作、细微反应，有主有次\n\n主动作：伸手接住盒子。\n跟随动作：袖口和盒上的丝带跟着动。\n细微反应：发现盒子里没有重量，再看向对方。\n\n不要写成三条互不相关的循环——\"她接盒子；袖子飘；眼睛闪动\"。要让它们**互相引起**：接到 → 感到不对 → 重新判断。\n\n而且只在对应景别能看见时，再写握力、眼神、呼吸的变化。远景里写\"瞳孔微缩\"没有意义。\n\n## 镜头给了什么，就写什么尺度\n\n| 镜头给了什么 | 优先写什么 | 容易白写的要求 |\n| --- | --- | --- |\n| 远景，人物很小 | 站位、走停、转身、距离 | 极细小的眼角变化承载全部剧情 |\n| 中景 | 手部任务、重心、身体朝向、听者反应 | 面部和手部同时塞满指令 |\n| 近景 | 看向谁、反应延迟、嘴角或下颌的变化 | 没有对象的一连串\"微表情\" |\n| 手部或道具特写 | 触碰、迟疑、松开、使用痕迹 | 无缘无故要求全身表演 |\n\n这张表是创作建议，不是 AI 的规格书。发布的画幅和观众实际看的屏幕大小，也会影响能看清什么。\n\n## 一次反应，三个节拍\n\n**先维持原来的事**：还在整理桌面。\n**刺激真的进来了**：听到名字，动作停住。\n**做出新的选择**：把杯子放回，转身去开门。\n\n不要为了显得有时间感，写成\"0.2 秒眉毛动、0.4 秒瞳孔放大\"。秒数是给剪辑和预算用的，不能代替动作的因果。\n\n如果只有三秒，就减少反应的层次。别要求角色在同一秒里从震惊到悲伤再到释然。\n\n## 别忘了听的那个人\n\n说话的人不是唯一的事件。听的人是否打断、后退、继续手头的事、把东西接过来——这些都会改变关系。\n\n> 她说\"我没事\"，对方没有马上劝她，只把刚要收走的椅子放回原处。\n\n画面没有解释安慰，但一个\"留座\"的动作让关系变了。听者也不必每句话都点头微笑，生活里有不同步和误解。\n\n## 表演失败了怎么修\n\n| 症状 | 先做什么 |\n| --- | --- |\n| 太满，像表情包 | 减少同时发生的表情，保留任务和一次关键反应 |\n| 太空，像木头 | 不要加\"更有演技\"，补上刺激和动作的后果 |\n| 像摆拍 | 检查人物是不是无缘无故一直看镜头 |\n| 动作奇怪 | 回到首帧的手、姿势、道具位置，别只改情绪词 |\n\n强烈情绪的完整例子见[喜悦真的可以冲出来](/cases/03-big-emotion.md)，小反应的例子见[餐桌关系](/cases/02-relationship.md)。\n\n## 一句话记住\n\n**先写他在做什么、想让谁怎么样，再写发生了什么、他怎么变。表情是最后才需要的东西。**\n\n## 动手试试\n\n写一个人\"听到坏消息\"。先写他当时正在做的一件普通事（切菜、系鞋带、翻书），再写坏消息进来时这件事怎么被打断，最后写他做了什么新的选择。全程不许用\"悲伤\"\"震惊\"这类词。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"craft-01-acting-section-0","title":"问题在哪里"},{"id":"craft-01-acting-section-1","title":"先问：他想影响谁"},{"id":"craft-01-acting-section-2","title":"内外不一致是选项，不是唯一正确"},{"id":"craft-01-acting-section-3","title":"主动作、跟随动作、细微反应，有主有次"},{"id":"craft-01-acting-section-4","title":"镜头给了什么，就写什么尺度"},{"id":"craft-01-acting-section-5","title":"一次反应，三个节拍"},{"id":"craft-01-acting-section-6","title":"别忘了听的那个人"},{"id":"craft-01-acting-section-7","title":"表演失败了怎么修"},{"id":"craft-01-acting-section-8","title":"一句话记住"},{"id":"craft-01-acting-section-9","title":"动手试试"}]},{"id":"craft/02-dialogue-voice","path":"craft/02-dialogue-voice.md","title":"13｜台词与配音：不是换一副嗓子，是换一种说话的关系","description":"声音有四层：这个人一直是什么声音、这次想干什么、句子怎么走、在什么空间里。分开写，AI 才不会念成播音腔。","type":"Technique","group":"craft","tags":["声音","配音","对白","节奏"],"html":"<h1>13｜台词与配音：不是换一副嗓子，是换一种说话的关系<\/h1>\n<blockquote>\n<p>同一句\"你终于来了\"，可以是松一口气，可以是责怪，也可以是一个等了很久、却还想装作无所谓的人，决定先把门打开。<\/p>\n<\/blockquote>\n<h2 id=\"craft-02-dialogue-voice-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>深沉男声，悲伤地说：\"我知道了。\"<\/p>\n<\/blockquote>\n<p>出来的是一个播音员在朗读\"悲伤\"。因为\"深沉\"\"悲伤\"是两个标签，AI 只能拿最常见的深沉和悲伤来套。<\/p>\n<h2 id=\"craft-02-dialogue-voice-section-1\">声音有四层，分开写<\/h2>\n<p><strong>第一层：这个人一直是什么声音。<\/strong> 大概的音区、厚还是薄、有没有气息或沙哑、什么口音。只保留能跨镜头一直用的特点。<\/p>\n<p><strong>第二层：这一次他想干什么。<\/strong> 安抚、催促、试探、掩饰，还是把话说绝？说给谁？距离多近？身体在不在动？<\/p>\n<p><strong>第三层：句子怎么走。<\/strong> 哪个词加重？哪里停？什么时候压低、加快、拖住、突然结束？<\/p>\n<p><strong>第四层：声音在什么空间里。<\/strong> 近处的干声、隔着门、电话里、空房间、街上。<strong>空间不要和情绪混成一个\"电影配音感\"。<\/strong><\/p>\n<h2 id=\"craft-02-dialogue-voice-section-2\">台词先得像这个人会说的话<\/h2>\n<p>\"抓住绳子，我数到三，你就往外爬\"——这句台词不是天然就坏。训练中的教练可能就需要这么清楚地下指令。它是否机械，取决于现场压力和这个人的说话习惯。<\/p>\n<p>紧迫情境下，可能是：<\/p>\n<blockquote>\n<p>\"手给我。别看下面——抓紧。对，跟着我。\"<\/p>\n<\/blockquote>\n<p>镇定指导下，可能是：<\/p>\n<blockquote>\n<p>\"先抓稳。我数三下，你再动。\"<\/p>\n<\/blockquote>\n<p><strong>别把每句台词都改成省略号、口吃和碎句。<\/strong> 它们一旦统一出现，就变成另一种模板腔。<\/p>\n<h2 id=\"craft-02-dialogue-voice-section-3\">同一句话，三种说法<\/h2>\n<p>台词：<strong>\"我知道了。\"<\/strong><\/p>\n<p><strong>接受<\/strong>：句子完整落下，呼吸松开，然后继续手上的动作。<\/p>\n<p><strong>敷衍<\/strong>：说得比平常快，不看对方，手头的事没停。<\/p>\n<p><strong>受伤但收住<\/strong>：先停一下，\"知道\"两个字说清楚，末尾不往上挑（不寻求确认）。放下手里的东西再抬眼。<\/p>\n<p>这三种是表演方向，不是声学参数。<strong>试听时看它真的实现了没有，别被文字的细腻说服。<\/strong><\/p>\n<h2 id=\"craft-02-dialogue-voice-section-4\">台词、导演备注、时间表，分开放<\/h2>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">台词正文：你终于来了。先坐，我给你倒水。\n说话对象：刚从外面进门的老朋友。\n声音方向：成年女性，温和中音，吐字自然，不用播报腔。\n当场状态：原本有点担心，开口时放松下来。\"先坐\"像顺手招呼，不是正式邀请。\n空间：安静的住宅内，距离近，有少量自然的室内反射。\n<\/code><\/pre>\n<p>只有支持\"指令和台词分开输入\"的工具才能直接这样提交。否则要把备注放到专门的指令栏，不然 AI 会把备注也念出来。<\/p>\n<p><strong>省略号不等于固定的 0.3 秒停顿。<\/strong> 不同工具对标点、标签的处理不一样。比如 ElevenLabs 的官方说明就区分了不同模型控制停顿的方式（见<a href=\"#/references/official-voice-light\">配音和灯光的官方说法<\/a>）。<\/p>\n<h2 id=\"craft-02-dialogue-voice-section-5\">先试听，再对口型<\/h2>\n<p>有重要对白的片段，先确定：台词顺不顺？音色像不像同一个人？实际时长装得下吗？<\/p>\n<p>时长不够，先删句子或延长镜头，不要把人压成高速朗读。后期加停顿，要同步调整口型、动作和环境音。<\/p>\n<p>纯配音、原生音画一起生成、后期对口型，是三条不同的路。选哪条看：声音重不重要、工具实际支持什么、要不要分轨修改。<strong>不要一边锁死已经生成的口型，一边随便改台词。<\/strong><\/p>\n<h2 id=\"craft-02-dialogue-voice-section-6\">\"像真人\"不是模仿某个真人的许可<\/h2>\n<p>用自己有的、获得授权的声音素材。记录角色声线的来源和使用范围。声线不稳定时，不靠无限堆描述来救，可以换样本，或者换制作路线。这里只给创作建议，不做法律判断。<\/p>\n<h2 id=\"craft-02-dialogue-voice-section-7\">一句话记住<\/h2>\n<p><strong>声音分四层：一直什么样、这次想干什么、句子怎么走、在哪个空间。别用一个\"深沉悲伤\"糊过去。<\/strong><\/p>\n<h2 id=\"craft-02-dialogue-voice-section-8\">动手试试<\/h2>\n<p>拿一句最普通的台词\"好，我知道了\"，写出四种不同关系下的说法（比如：对上司、对孩子、对前任、对客服）。每种只写三行：想干什么、哪个字加重、说完之后手在做什么。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-voice-light\">配音和灯光的官方说法<\/a><\/p>\n<\/details>","text":"# 13｜台词与配音：不是换一副嗓子，是换一种说话的关系\n\n> 同一句\"你终于来了\"，可以是松一口气，可以是责怪，也可以是一个等了很久、却还想装作无所谓的人，决定先把门打开。\n\n## 问题在哪里\n\n> 深沉男声，悲伤地说：\"我知道了。\"\n\n出来的是一个播音员在朗读\"悲伤\"。因为\"深沉\"\"悲伤\"是两个标签，AI 只能拿最常见的深沉和悲伤来套。\n\n## 声音有四层，分开写\n\n**第一层：这个人一直是什么声音。** 大概的音区、厚还是薄、有没有气息或沙哑、什么口音。只保留能跨镜头一直用的特点。\n\n**第二层：这一次他想干什么。** 安抚、催促、试探、掩饰，还是把话说绝？说给谁？距离多近？身体在不在动？\n\n**第三层：句子怎么走。** 哪个词加重？哪里停？什么时候压低、加快、拖住、突然结束？\n\n**第四层：声音在什么空间里。** 近处的干声、隔着门、电话里、空房间、街上。**空间不要和情绪混成一个\"电影配音感\"。**\n\n## 台词先得像这个人会说的话\n\n\"抓住绳子，我数到三，你就往外爬\"——这句台词不是天然就坏。训练中的教练可能就需要这么清楚地下指令。它是否机械，取决于现场压力和这个人的说话习惯。\n\n紧迫情境下，可能是：\n> \"手给我。别看下面——抓紧。对，跟着我。\"\n\n镇定指导下，可能是：\n> \"先抓稳。我数三下，你再动。\"\n\n**别把每句台词都改成省略号、口吃和碎句。** 它们一旦统一出现，就变成另一种模板腔。\n\n## 同一句话，三种说法\n\n台词：**\"我知道了。\"**\n\n**接受**：句子完整落下，呼吸松开，然后继续手上的动作。\n\n**敷衍**：说得比平常快，不看对方，手头的事没停。\n\n**受伤但收住**：先停一下，\"知道\"两个字说清楚，末尾不往上挑（不寻求确认）。放下手里的东西再抬眼。\n\n这三种是表演方向，不是声学参数。**试听时看它真的实现了没有，别被文字的细腻说服。**\n\n## 台词、导演备注、时间表，分开放\n\n```text\n台词正文：你终于来了。先坐，我给你倒水。\n说话对象：刚从外面进门的老朋友。\n声音方向：成年女性，温和中音，吐字自然，不用播报腔。\n当场状态：原本有点担心，开口时放松下来。\"先坐\"像顺手招呼，不是正式邀请。\n空间：安静的住宅内，距离近，有少量自然的室内反射。\n```\n\n只有支持\"指令和台词分开输入\"的工具才能直接这样提交。否则要把备注放到专门的指令栏，不然 AI 会把备注也念出来。\n\n**省略号不等于固定的 0.3 秒停顿。** 不同工具对标点、标签的处理不一样。比如 ElevenLabs 的官方说明就区分了不同模型控制停顿的方式（见[配音和灯光的官方说法](/references/official-voice-light.md)）。\n\n## 先试听，再对口型\n\n有重要对白的片段，先确定：台词顺不顺？音色像不像同一个人？实际时长装得下吗？\n\n时长不够，先删句子或延长镜头，不要把人压成高速朗读。后期加停顿，要同步调整口型、动作和环境音。\n\n纯配音、原生音画一起生成、后期对口型，是三条不同的路。选哪条看：声音重不重要、工具实际支持什么、要不要分轨修改。**不要一边锁死已经生成的口型，一边随便改台词。**\n\n## \"像真人\"不是模仿某个真人的许可\n\n用自己有的、获得授权的声音素材。记录角色声线的来源和使用范围。声线不稳定时，不靠无限堆描述来救，可以换样本，或者换制作路线。这里只给创作建议，不做法律判断。\n\n## 一句话记住\n\n**声音分四层：一直什么样、这次想干什么、句子怎么走、在哪个空间。别用一个\"深沉悲伤\"糊过去。**\n\n## 动手试试\n\n拿一句最普通的台词\"好，我知道了\"，写出四种不同关系下的说法（比如：对上司、对孩子、对前任、对客服）。每种只写三行：想干什么、哪个字加重、说完之后手在做什么。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [配音和灯光的官方说法](/references/official-voice-light.md)","toc":[{"id":"craft-02-dialogue-voice-section-0","title":"问题在哪里"},{"id":"craft-02-dialogue-voice-section-1","title":"声音有四层，分开写"},{"id":"craft-02-dialogue-voice-section-2","title":"台词先得像这个人会说的话"},{"id":"craft-02-dialogue-voice-section-3","title":"同一句话，三种说法"},{"id":"craft-02-dialogue-voice-section-4","title":"台词、导演备注、时间表，分开放"},{"id":"craft-02-dialogue-voice-section-5","title":"先试听，再对口型"},{"id":"craft-02-dialogue-voice-section-6","title":"\"像真人\"不是模仿某个真人的许可"},{"id":"craft-02-dialogue-voice-section-7","title":"一句话记住"},{"id":"craft-02-dialogue-voice-section-8","title":"动手试试"}]},{"id":"craft/03-action-blocking","path":"craft/03-action-blocking.md","title":"14｜动作与调度：东西从哪来、到哪去，手上拿着什么","description":"动作的丰富不在动词数量，而在状态真的变了。关键的接触要写清，走路的每一步不用管。","type":"Technique","group":"craft","tags":["动作","调度","道具","连续性"],"html":"<h1>14｜动作与调度：东西从哪来、到哪去，手上拿着什么<\/h1>\n<h2 id=\"craft-03-action-blocking-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>她拿起、打开、查看、放下、起身、走开。<\/p>\n<\/blockquote>\n<p>六个动词，看起来很丰富。但一段五秒的镜头也许只需要：<\/p>\n<blockquote>\n<p>她把盒盖抬起，看到里面之后没有再往上打开。<\/p>\n<\/blockquote>\n<p>动作没做完，信息反而更明确。<strong>动作不是动词的数量，而是状态真的改变了。<\/strong><\/p>\n<h2 id=\"craft-03-action-blocking-section-1\">先画最小的变化：起点 → 关键接触 → 终点<\/h2>\n<p>杯子起初在桌上（起点）。手接触杯柄（关键接触）。最后杯子离开桌面，还在同一只手里（终点）。<\/p>\n<p>要表现举杯敬人，再加上目光对象和终点位置。就这么多。<\/p>\n<h2 id=\"craft-03-action-blocking-section-2\">关键接触要写，身体的自然过渡可以放<\/h2>\n<p>走路不必逐只脚安排。但<strong>碰撞、握手、交接、拿取、开盖<\/strong>，通常要交代对象和前后状态。<\/p>\n<p>有个经典的教训：一个换文件的镜头，运镜设计得很漂亮，观众却没看懂文件换了。因为没有人写清楚\"谁把什么交给了谁\"。<\/p>\n<p>可以这样写：<\/p>\n<blockquote>\n<p>A 先伸出右手，B 把钥匙落进她掌心。A 合上手指后，B 才松开。两人的手短暂同框，让钥匙的去向能被看清。<\/p>\n<\/blockquote>\n<p>\"短暂同框\"是信息条件，不一定要超近的手部特写。如果 AI 做不稳这个接触，<strong>拆成\"接近、遮挡、结果\"三个镜头<\/strong>也完全合法——只要观众仍能理解，而且你不假装那是一镜到底。<\/p>\n<h2 id=\"craft-03-action-blocking-section-3\">随身道具要记\"手位账\"<\/h2>\n<p>一个人拿手机自拍、推门、捧咖啡、举相机——可能已经需要四只手了。写一张简短的状态表：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时刻<\/th>\n<th>左手<\/th>\n<th>右手<\/th>\n<th>其他东西<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>门口<\/td>\n<td>推门<\/td>\n<td>拿手机拍摄<\/td>\n<td>相机挂在脖子上，咖啡还没出现<\/td>\n<\/tr>\n<tr>\n<td>桌边<\/td>\n<td>空<\/td>\n<td>手机放稳后松开<\/td>\n<td>咖啡在桌上<\/td>\n<\/tr>\n<tr>\n<td>拍照<\/td>\n<td>托相机<\/td>\n<td>按快门<\/td>\n<td>手机已经固定，不再说是手持自拍<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>不用逐帧记账。目的只是避免东西无故出现、消失、换手。完整的 Vlog 例子见<a href=\"#/cases/04-vlog\">谁在拍谁<\/a>。<\/p>\n<h2 id=\"craft-03-action-blocking-section-4\">调度是关系的变化，不只是走位<\/h2>\n<p>从屏风后走到对方面前，是空间移动。从不敢打扰到主动开口，是关系移动。<strong>两者最好互相解释。<\/strong><\/p>\n<blockquote>\n<p>她先停在他看不到的地方，听完一句话后才走出来。走近的那一步，意味着她不再等别人允许自己开口。<\/p>\n<\/blockquote>\n<p>另一个人有没有让座、后退、转身、或者继续做手上的事，决定了这次走近有没有真的改变场面。<\/p>\n<h2 id=\"craft-03-action-blocking-section-5\">用固定的东西定方向，少用\"左右\"<\/h2>\n<p>简单画面里，\"画面左侧\"\"门旁边\"就够了。多人或者大幅换机位时，先定几个不动的地标——门、窗、桌子。\"从窗边走到桌子靠门的那侧\"比跨镜头反复说\"从左到右\"更不容易自相矛盾。<\/p>\n<p>保持视线方向连续是常见做法，但不是禁止越轴。需要观众看懂方向时保持清楚；故意改变方向时，给一个新的定位线索。先问：观众该不该迷失？再决定要不要制造迷失。<\/p>\n<h2 id=\"craft-03-action-blocking-section-6\">让重量留下后果<\/h2>\n<p>停下来后包碰了一下腿，水洒到桌上留下湿的地方，推开椅子后椅子没有马上回原位。<strong>后果比\"物理真实\"四个字更容易检查。<\/strong> 但别强迫所有材质都以同样的幅度弹跳。<\/p>\n<p>困难的动作可以用参考视频、动作草图或三维预演。新加的参考必须和选定的角色、空间、时长相容——\"参考很多\"不代表一致性更强。<\/p>\n<h2 id=\"craft-03-action-blocking-section-7\">一句话记住<\/h2>\n<p><strong>写清起点、关键接触、终点。手上拿着什么要记账。走路怎么走交给 AI。<\/strong><\/p>\n<h2 id=\"craft-03-action-blocking-section-8\">动手试试<\/h2>\n<p>写一个\"两个人交换东西\"的镜头。要求：读的人能明确说出交换之后，谁手里是哪个。然后想一想，如果 AI 生成的接触不稳，你会怎么拆成两三个镜头。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 14｜动作与调度：东西从哪来、到哪去，手上拿着什么\n\n## 问题在哪里\n\n> 她拿起、打开、查看、放下、起身、走开。\n\n六个动词，看起来很丰富。但一段五秒的镜头也许只需要：\n\n> 她把盒盖抬起，看到里面之后没有再往上打开。\n\n动作没做完，信息反而更明确。**动作不是动词的数量，而是状态真的改变了。**\n\n## 先画最小的变化：起点 → 关键接触 → 终点\n\n杯子起初在桌上（起点）。手接触杯柄（关键接触）。最后杯子离开桌面，还在同一只手里（终点）。\n\n要表现举杯敬人，再加上目光对象和终点位置。就这么多。\n\n## 关键接触要写，身体的自然过渡可以放\n\n走路不必逐只脚安排。但**碰撞、握手、交接、拿取、开盖**，通常要交代对象和前后状态。\n\n有个经典的教训：一个换文件的镜头，运镜设计得很漂亮，观众却没看懂文件换了。因为没有人写清楚\"谁把什么交给了谁\"。\n\n可以这样写：\n> A 先伸出右手，B 把钥匙落进她掌心。A 合上手指后，B 才松开。两人的手短暂同框，让钥匙的去向能被看清。\n\n\"短暂同框\"是信息条件，不一定要超近的手部特写。如果 AI 做不稳这个接触，**拆成\"接近、遮挡、结果\"三个镜头**也完全合法——只要观众仍能理解，而且你不假装那是一镜到底。\n\n## 随身道具要记\"手位账\"\n\n一个人拿手机自拍、推门、捧咖啡、举相机——可能已经需要四只手了。写一张简短的状态表：\n\n| 时刻 | 左手 | 右手 | 其他东西 |\n| --- | --- | --- | --- |\n| 门口 | 推门 | 拿手机拍摄 | 相机挂在脖子上，咖啡还没出现 |\n| 桌边 | 空 | 手机放稳后松开 | 咖啡在桌上 |\n| 拍照 | 托相机 | 按快门 | 手机已经固定，不再说是手持自拍 |\n\n不用逐帧记账。目的只是避免东西无故出现、消失、换手。完整的 Vlog 例子见[谁在拍谁](/cases/04-vlog.md)。\n\n## 调度是关系的变化，不只是走位\n\n从屏风后走到对方面前，是空间移动。从不敢打扰到主动开口，是关系移动。**两者最好互相解释。**\n\n> 她先停在他看不到的地方，听完一句话后才走出来。走近的那一步，意味着她不再等别人允许自己开口。\n\n另一个人有没有让座、后退、转身、或者继续做手上的事，决定了这次走近有没有真的改变场面。\n\n## 用固定的东西定方向，少用\"左右\"\n\n简单画面里，\"画面左侧\"\"门旁边\"就够了。多人或者大幅换机位时，先定几个不动的地标——门、窗、桌子。\"从窗边走到桌子靠门的那侧\"比跨镜头反复说\"从左到右\"更不容易自相矛盾。\n\n保持视线方向连续是常见做法，但不是禁止越轴。需要观众看懂方向时保持清楚；故意改变方向时，给一个新的定位线索。先问：观众该不该迷失？再决定要不要制造迷失。\n\n## 让重量留下后果\n\n停下来后包碰了一下腿，水洒到桌上留下湿的地方，推开椅子后椅子没有马上回原位。**后果比\"物理真实\"四个字更容易检查。** 但别强迫所有材质都以同样的幅度弹跳。\n\n困难的动作可以用参考视频、动作草图或三维预演。新加的参考必须和选定的角色、空间、时长相容——\"参考很多\"不代表一致性更强。\n\n## 一句话记住\n\n**写清起点、关键接触、终点。手上拿着什么要记账。走路怎么走交给 AI。**\n\n## 动手试试\n\n写一个\"两个人交换东西\"的镜头。要求：读的人能明确说出交换之后，谁手里是哪个。然后想一想，如果 AI 生成的接触不稳，你会怎么拆成两三个镜头。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"craft-03-action-blocking-section-0","title":"问题在哪里"},{"id":"craft-03-action-blocking-section-1","title":"先画最小的变化：起点 → 关键接触 → 终点"},{"id":"craft-03-action-blocking-section-2","title":"关键接触要写，身体的自然过渡可以放"},{"id":"craft-03-action-blocking-section-3","title":"随身道具要记\"手位账\""},{"id":"craft-03-action-blocking-section-4","title":"调度是关系的变化，不只是走位"},{"id":"craft-03-action-blocking-section-5","title":"用固定的东西定方向，少用\"左右\""},{"id":"craft-03-action-blocking-section-6","title":"让重量留下后果"},{"id":"craft-03-action-blocking-section-7","title":"一句话记住"},{"id":"craft-03-action-blocking-section-8","title":"动手试试"}]},{"id":"craft/04-camera-attention","path":"craft/04-camera-attention.md","title":"15｜镜头：先决定观众站在哪里，再决定镜头怎么动","description":"一条镜头先选一件主要的活。把\"推、拉、摇、移、环绕、拉焦\"串在一起，往往没说清最重要的观看任务。","type":"Technique","group":"craft","tags":["镜头","机位","注意力","运镜"],"html":"<h1>15｜镜头：先决定观众站在哪里，再决定镜头怎么动<\/h1>\n<blockquote>\n<p>镜头可以靠近一个人，也可以拒绝靠近。后一种选择，有时比推到眼泪上更有力量。<\/p>\n<\/blockquote>\n<h2 id=\"craft-04-camera-attention-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>镜头缓缓推进，环绕人物，升高俯视，拉焦到眼睛，最后甩镜到窗外。<\/p>\n<\/blockquote>\n<p>八秒钟里五种运动。AI 不知道哪个最重要，观众也不知道该看什么。<\/p>\n<h2 id=\"craft-04-camera-attention-section-1\">先说观众站在哪里<\/h2>\n<p>眼平、贴地、俯瞰，不直接等于\"自然\"\"压迫\"\"脆弱\"。它们先改变的是<strong>你能看见什么、东西之间的空间关系<\/strong>。具体感受还取决于人物、光、距离、剪辑和声音。<\/p>\n<p><strong>贴近桌面<\/strong>可能让一只迟迟没有接过来的手变得重要。<strong>隔着人群<\/strong>可能让错过发生在视线里。<strong>正面平视<\/strong>可以让观众像坐在角色对面，直接承受一句话。<\/p>\n<p>选机位时，先问：<strong>这个位置让谁知道了什么？<\/strong><\/p>\n<p>网上有个说法：\"低角度 = 实拍感\"。低角度确实是一种有效的方向，但不是\"平视一定假\"的规律。<\/p>\n<h2 id=\"craft-04-camera-attention-section-2\">六个要素，别混叫\"运镜\"<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>要素<\/th>\n<th>用人话问<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>位置和高度<\/td>\n<td>镜头在哪里？<\/td>\n<td>门内侧、桌沿高度<\/td>\n<\/tr>\n<tr>\n<td>朝向<\/td>\n<td>看向哪里？<\/td>\n<td>看窗边的人，不是房间中心<\/td>\n<\/tr>\n<tr>\n<td>取景范围<\/td>\n<td>让多少东西进画面？<\/td>\n<td>只见手、杯子和对面的空椅子<\/td>\n<\/tr>\n<tr>\n<td>前后关系<\/td>\n<td>近处和远处怎么相处？<\/td>\n<td>近处栏杆占画面，人物在后面<\/td>\n<\/tr>\n<tr>\n<td>运动<\/td>\n<td>镜头本身怎么变？<\/td>\n<td>向右平移，让门框退出前景<\/td>\n<\/tr>\n<tr>\n<td>焦点<\/td>\n<td>哪一层清楚？<\/td>\n<td>焦点在握杯的手，不在窗外<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>\"推近\"有两种意思<\/strong>：一种是镜头往前走，一种是变焦放大。如果你需要看到遮挡物后面的东西，得写清楚是\"镜头前移\"或\"横移\"——单纯放大画面看不到东西后面。同理，\"摇镜\"是改变看的方向，不是镜头绕着主体换位置。<\/p>\n<h2 id=\"craft-04-camera-attention-section-3\">一条镜头，先选一件主要的活<\/h2>\n<p><strong>跟随<\/strong>：和人物保持一段距离，让变化在路上出现。\n<strong>揭示<\/strong>：从局部到关系，比如门框后的人进入可见范围。\n<strong>逼近<\/strong>：减少退路，或放大一个反应的重要性。\n<strong>撤离<\/strong>：把人物留给环境，或者显示事情比原先想的大。\n<strong>等待<\/strong>：不替观众挑反应，给事件自己发生的机会。<\/p>\n<p>它们可以组合，但<strong>不必在八秒内全做<\/strong>。<\/p>\n<h2 id=\"craft-04-camera-attention-section-4\">镜头和人物可以不同步<\/h2>\n<p>跟得太准像展示，略晚一点像发现。但\"略晚\"也可能错过关键动作。<\/p>\n<blockquote>\n<p>她先起身离开画面，镜头晚一点才转向门口。转过去时她已经停在门边，像还有一句话没说。<\/p>\n<\/blockquote>\n<p>这里的延迟本身形成了一种观看关系。但如果剧情要求看清她把钥匙藏进包里，就不能让镜头晚到而错过。<\/p>\n<h2 id=\"craft-04-camera-attention-section-5\">现场感来自\"可以解释的限制\"，不是永远在抖<\/h2>\n<p>轻微的走路起伏、前景擦过、自动对焦调整，可以提供\"有人在拍\"的感觉。但<strong>干净稳定的画面也可以很真实<\/strong>。<\/p>\n<p>手机 Vlog 里，手臂距离和握机方式重要。产品静物里，稳定和反光控制可能更重要。<\/p>\n<p>镜头上的水滴、强眩光、剧烈晃动，都是很强的表达，不是默认的\"真实感修补剂\"。别让它们遮掉脸、产品标签或者情节。<\/p>\n<h2 id=\"craft-04-camera-attention-section-6\">让注意力接力<\/h2>\n<p>一个人说话，另一个人的手开始动，镜头再发现道具——这是自然的信息接力。研究者观察过观众的眼睛在画面里怎么移动，但没有人能保证所有观众都按你设计的顺序看。<\/p>\n<p>一个实用的检验方法：<strong>把片子给一个不知道提示词的人看，只问\"你先看到了什么\"。<\/strong><\/p>\n<p>文字说不清机位时，画一张构图草图，或者做预演，而不是堆更多\"流畅电影感\"。见<a href=\"#/workflows/06-previs\">预演<\/a>。<\/p>\n<h2 id=\"craft-04-camera-attention-section-7\">一句话记住<\/h2>\n<p><strong>先问观众站在哪里、能看见什么。一条镜头只干一件主要的活。<\/strong><\/p>\n<h2 id=\"craft-04-camera-attention-section-8\">动手试试<\/h2>\n<p>选一个场景（比如\"两个人在餐桌上，一个想说什么但没说\"）。分别写三版：镜头贴近桌面、镜头在门外、镜头正面平视其中一人。每版只写一句：这个位置让观众知道了什么？<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-video\">视频工具的官方说法<\/a>\n[3] <a href=\"#/references/theory\">借用了哪些理论，借到什么程度<\/a><\/p>\n<\/details>","text":"# 15｜镜头：先决定观众站在哪里，再决定镜头怎么动\n\n> 镜头可以靠近一个人，也可以拒绝靠近。后一种选择，有时比推到眼泪上更有力量。\n\n## 问题在哪里\n\n> 镜头缓缓推进，环绕人物，升高俯视，拉焦到眼睛，最后甩镜到窗外。\n\n八秒钟里五种运动。AI 不知道哪个最重要，观众也不知道该看什么。\n\n## 先说观众站在哪里\n\n眼平、贴地、俯瞰，不直接等于\"自然\"\"压迫\"\"脆弱\"。它们先改变的是**你能看见什么、东西之间的空间关系**。具体感受还取决于人物、光、距离、剪辑和声音。\n\n**贴近桌面**可能让一只迟迟没有接过来的手变得重要。**隔着人群**可能让错过发生在视线里。**正面平视**可以让观众像坐在角色对面，直接承受一句话。\n\n选机位时，先问：**这个位置让谁知道了什么？**\n\n网上有个说法：\"低角度 = 实拍感\"。低角度确实是一种有效的方向，但不是\"平视一定假\"的规律。\n\n## 六个要素，别混叫\"运镜\"\n\n| 要素 | 用人话问 | 例子 |\n| --- | --- | --- |\n| 位置和高度 | 镜头在哪里？ | 门内侧、桌沿高度 |\n| 朝向 | 看向哪里？ | 看窗边的人，不是房间中心 |\n| 取景范围 | 让多少东西进画面？ | 只见手、杯子和对面的空椅子 |\n| 前后关系 | 近处和远处怎么相处？ | 近处栏杆占画面，人物在后面 |\n| 运动 | 镜头本身怎么变？ | 向右平移，让门框退出前景 |\n| 焦点 | 哪一层清楚？ | 焦点在握杯的手，不在窗外 |\n\n**\"推近\"有两种意思**：一种是镜头往前走，一种是变焦放大。如果你需要看到遮挡物后面的东西，得写清楚是\"镜头前移\"或\"横移\"——单纯放大画面看不到东西后面。同理，\"摇镜\"是改变看的方向，不是镜头绕着主体换位置。\n\n## 一条镜头，先选一件主要的活\n\n**跟随**：和人物保持一段距离，让变化在路上出现。\n**揭示**：从局部到关系，比如门框后的人进入可见范围。\n**逼近**：减少退路，或放大一个反应的重要性。\n**撤离**：把人物留给环境，或者显示事情比原先想的大。\n**等待**：不替观众挑反应，给事件自己发生的机会。\n\n它们可以组合，但**不必在八秒内全做**。\n\n## 镜头和人物可以不同步\n\n跟得太准像展示，略晚一点像发现。但\"略晚\"也可能错过关键动作。\n\n> 她先起身离开画面，镜头晚一点才转向门口。转过去时她已经停在门边，像还有一句话没说。\n\n这里的延迟本身形成了一种观看关系。但如果剧情要求看清她把钥匙藏进包里，就不能让镜头晚到而错过。\n\n## 现场感来自\"可以解释的限制\"，不是永远在抖\n\n轻微的走路起伏、前景擦过、自动对焦调整，可以提供\"有人在拍\"的感觉。但**干净稳定的画面也可以很真实**。\n\n手机 Vlog 里，手臂距离和握机方式重要。产品静物里，稳定和反光控制可能更重要。\n\n镜头上的水滴、强眩光、剧烈晃动，都是很强的表达，不是默认的\"真实感修补剂\"。别让它们遮掉脸、产品标签或者情节。\n\n## 让注意力接力\n\n一个人说话，另一个人的手开始动，镜头再发现道具——这是自然的信息接力。研究者观察过观众的眼睛在画面里怎么移动，但没有人能保证所有观众都按你设计的顺序看。\n\n一个实用的检验方法：**把片子给一个不知道提示词的人看，只问\"你先看到了什么\"。**\n\n文字说不清机位时，画一张构图草图，或者做预演，而不是堆更多\"流畅电影感\"。见[预演](/workflows/06-previs.md)。\n\n## 一句话记住\n\n**先问观众站在哪里、能看见什么。一条镜头只干一件主要的活。**\n\n## 动手试试\n\n选一个场景（比如\"两个人在餐桌上，一个想说什么但没说\"）。分别写三版：镜头贴近桌面、镜头在门外、镜头正面平视其中一人。每版只写一句：这个位置让观众知道了什么？\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [视频工具的官方说法](/references/official-video.md)\n[3] [借用了哪些理论，借到什么程度](/references/theory.md)","toc":[{"id":"craft-04-camera-attention-section-0","title":"问题在哪里"},{"id":"craft-04-camera-attention-section-1","title":"先说观众站在哪里"},{"id":"craft-04-camera-attention-section-2","title":"六个要素，别混叫\"运镜\""},{"id":"craft-04-camera-attention-section-3","title":"一条镜头，先选一件主要的活"},{"id":"craft-04-camera-attention-section-4","title":"镜头和人物可以不同步"},{"id":"craft-04-camera-attention-section-5","title":"现场感来自\"可以解释的限制\"，不是永远在抖"},{"id":"craft-04-camera-attention-section-6","title":"让注意力接力"},{"id":"craft-04-camera-attention-section-7","title":"一句话记住"},{"id":"craft-04-camera-attention-section-8","title":"动手试试"}]},{"id":"craft/05-light-material","path":"craft/05-light-material.md","title":"16｜光与材质：光从哪来、落在哪、什么东西怎么反应","description":"光不是画面亮度的开关。分清方向、软硬、影响区域，把\"质感\"落到具体的表面上。","type":"Technique","group":"craft","tags":["光线","材质","产品","连续性"],"html":"<h1>16｜光与材质：光从哪来、落在哪、什么东西怎么反应<\/h1>\n<h2 id=\"craft-05-light-material-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>电影级打光，柔和自然，高级质感。<\/p>\n<\/blockquote>\n<p>这句话里没有任何关于光的信息。光从哪来？多大？落在什么上面？哪些地方没有被照到？AI 只能猜。<\/p>\n<h2 id=\"craft-05-light-material-section-1\">光不是亮度的总开关<\/h2>\n<p>同一个玻璃瓶，可以被光照得像厚重的实体，也可以像空气里一道薄边。差别不在亮不亮，而在：<strong>光从哪里来、多大一片、落在哪些表面上、哪些部分没被照到。<\/strong><\/p>\n<p>一个够用的说明顺序：<strong>来源 → 方向 → 软硬 → 影响区域 → 明暗关系 → 颜色关系<\/strong>。选当前任务需要的项写，不必每次全写。<\/p>\n<blockquote>\n<p>左后方的窗光在瓶肩留下一道窄亮边。正面标签由较柔的反射光照清。背景稍暗，但不是全黑。玻璃仍能看出厚度，不把瓶身透成空壳。<\/p>\n<\/blockquote>\n<h2 id=\"craft-05-light-material-section-2\">三组常被搞混的词<\/h2>\n<p><strong>方向 vs 效果<\/strong>：\"侧逆光\"说的是光从哪来，\"轮廓光\"说的是主体边缘被强调的效果。它们可以同时出现，不是两个互斥的\"滤镜\"。<\/p>\n<p><strong>亮度 vs 软硬<\/strong>：亮不亮，不决定阴影边缘软不软。<strong>光源相对于主体的大小<\/strong>才是软硬的关键——大窗户的光软，小灯泡的光硬。Blender 的官方手册也把光的强度和光源尺寸分开说明（见<a href=\"#/references/official-voice-light\">配音和灯光的官方说法<\/a>）。<\/p>\n<p><strong>光的颜色 vs 物体的颜色<\/strong>：蓝色的瓶子不等于被蓝灯照着。冷色调的背景也不要求把脸涂蓝。看物体朝向哪边、受光面和环境反射是否合理。<\/p>\n<h2 id=\"craft-05-light-material-section-3\">硬光不需要百叶窗才能存在<\/h2>\n<p>有个常见误解：硬光 = 百叶窗投影。其实百叶窗、树叶、格栅只是<strong>让阴影有图案<\/strong>。没有它们，硬光照样能在瓶子、手指、桌边投下清楚的影子。<\/p>\n<p>产品广告可以这样写：<\/p>\n<blockquote>\n<p>光从画面左上方斜着照进来，瓶子在桌面上投下一道边缘清楚的影子。影子不经过标签，正面文字保持可读。<\/p>\n<\/blockquote>\n<p>不用写\"极致硬光、强光、爆亮\"——写具体的结果。<\/p>\n<h2 id=\"craft-05-light-material-section-4\">材质要有四种线索<\/h2>\n<p><strong>表面<\/strong>：哑光、细纹、颗粒、抛光。\n<strong>透光和反射<\/strong>：透的、半透的、镜面的、散开的。\n<strong>变形<\/strong>：硬挺、柔韧、可以压扁。\n<strong>接触后果<\/strong>：水迹、指痕、压痕、滑动的阻力。<\/p>\n<p>\"高级丝绸\"可以变成：<\/p>\n<blockquote>\n<p>布料很薄，但不是没有重量。折面上的亮光沿着褶皱移动，落到肩上时先滑过一点，再停住。<\/p>\n<\/blockquote>\n<p>\"真实泡沫\"不只是一堆白球：<\/p>\n<blockquote>\n<p>大小不一的薄泡聚在手掌边缘，抹开后中间变薄，边缘留下少量细泡。<\/p>\n<\/blockquote>\n<p>这些是<strong>观众能看到的条件<\/strong>，不保证 AI 真的在做物理模拟。<\/p>\n<h2 id=\"craft-05-light-material-section-5\">别让好看的光破坏连续性<\/h2>\n<p>镜头换到人物另一侧，窗子在房间里的位置没有变。屏幕上的明暗关系可以变，但不能为了每个镜头都\"左边好看\"，把同一扇窗搬来搬去。<\/p>\n<p>材质状态也要延续：袖口刚被水打湿，下一个镜头不能无故变干。瓶盖开了，反光和瓶口形状要对得上。这些问题不是统一套一个色调能修好的。<\/p>\n<h2 id=\"craft-05-light-material-section-6\">什么时候交给后期<\/h2>\n<p>品牌色、字标、精确的局部亮度、统一的颗粒和锐度，通常需要在可控的流程里核对。生成阶段先拿到结构和光照合理的素材。别指望加颗粒能掩盖错误的阴影，也别要求文字的颜色在复杂透光材质上每个像素都一样。<\/p>\n<p>纯风格化作品可以故意让影子不服从光源，但要明确说：这是这个世界的规则。艺术上的偏离不是技术失败，两者要在<a href=\"#/practice/03-review-rubric\">评价表<\/a>里分开。<\/p>\n<h2 id=\"craft-05-light-material-section-7\">一句话记住<\/h2>\n<p><strong>光要说从哪来、多大、落在哪。材质要说表面、透不透、会不会变形、接触后留下什么。\"高级质感\"什么都没说。<\/strong><\/p>\n<h2 id=\"craft-05-light-material-section-8\">动手试试<\/h2>\n<p>拿一个身边的东西（水杯、手机、一块布）。分别用\"大窗户的光\"和\"一个小台灯的光\"照它，观察阴影边缘的软硬、哪些面亮哪些面暗。然后各写一句话描述你看到的，不许用\"柔和\"\"硬朗\"这类词，只写位置和结果。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-voice-light\">配音和灯光的官方说法<\/a><\/p>\n<\/details>","text":"# 16｜光与材质：光从哪来、落在哪、什么东西怎么反应\n\n## 问题在哪里\n\n> 电影级打光，柔和自然，高级质感。\n\n这句话里没有任何关于光的信息。光从哪来？多大？落在什么上面？哪些地方没有被照到？AI 只能猜。\n\n## 光不是亮度的总开关\n\n同一个玻璃瓶，可以被光照得像厚重的实体，也可以像空气里一道薄边。差别不在亮不亮，而在：**光从哪里来、多大一片、落在哪些表面上、哪些部分没被照到。**\n\n一个够用的说明顺序：**来源 → 方向 → 软硬 → 影响区域 → 明暗关系 → 颜色关系**。选当前任务需要的项写，不必每次全写。\n\n> 左后方的窗光在瓶肩留下一道窄亮边。正面标签由较柔的反射光照清。背景稍暗，但不是全黑。玻璃仍能看出厚度，不把瓶身透成空壳。\n\n## 三组常被搞混的词\n\n**方向 vs 效果**：\"侧逆光\"说的是光从哪来，\"轮廓光\"说的是主体边缘被强调的效果。它们可以同时出现，不是两个互斥的\"滤镜\"。\n\n**亮度 vs 软硬**：亮不亮，不决定阴影边缘软不软。**光源相对于主体的大小**才是软硬的关键——大窗户的光软，小灯泡的光硬。Blender 的官方手册也把光的强度和光源尺寸分开说明（见[配音和灯光的官方说法](/references/official-voice-light.md)）。\n\n**光的颜色 vs 物体的颜色**：蓝色的瓶子不等于被蓝灯照着。冷色调的背景也不要求把脸涂蓝。看物体朝向哪边、受光面和环境反射是否合理。\n\n## 硬光不需要百叶窗才能存在\n\n有个常见误解：硬光 = 百叶窗投影。其实百叶窗、树叶、格栅只是**让阴影有图案**。没有它们，硬光照样能在瓶子、手指、桌边投下清楚的影子。\n\n产品广告可以这样写：\n> 光从画面左上方斜着照进来，瓶子在桌面上投下一道边缘清楚的影子。影子不经过标签，正面文字保持可读。\n\n不用写\"极致硬光、强光、爆亮\"——写具体的结果。\n\n## 材质要有四种线索\n\n**表面**：哑光、细纹、颗粒、抛光。\n**透光和反射**：透的、半透的、镜面的、散开的。\n**变形**：硬挺、柔韧、可以压扁。\n**接触后果**：水迹、指痕、压痕、滑动的阻力。\n\n\"高级丝绸\"可以变成：\n> 布料很薄，但不是没有重量。折面上的亮光沿着褶皱移动，落到肩上时先滑过一点，再停住。\n\n\"真实泡沫\"不只是一堆白球：\n> 大小不一的薄泡聚在手掌边缘，抹开后中间变薄，边缘留下少量细泡。\n\n这些是**观众能看到的条件**，不保证 AI 真的在做物理模拟。\n\n## 别让好看的光破坏连续性\n\n镜头换到人物另一侧，窗子在房间里的位置没有变。屏幕上的明暗关系可以变，但不能为了每个镜头都\"左边好看\"，把同一扇窗搬来搬去。\n\n材质状态也要延续：袖口刚被水打湿，下一个镜头不能无故变干。瓶盖开了，反光和瓶口形状要对得上。这些问题不是统一套一个色调能修好的。\n\n## 什么时候交给后期\n\n品牌色、字标、精确的局部亮度、统一的颗粒和锐度，通常需要在可控的流程里核对。生成阶段先拿到结构和光照合理的素材。别指望加颗粒能掩盖错误的阴影，也别要求文字的颜色在复杂透光材质上每个像素都一样。\n\n纯风格化作品可以故意让影子不服从光源，但要明确说：这是这个世界的规则。艺术上的偏离不是技术失败，两者要在[评价表](/practice/03-review-rubric.md)里分开。\n\n## 一句话记住\n\n**光要说从哪来、多大、落在哪。材质要说表面、透不透、会不会变形、接触后留下什么。\"高级质感\"什么都没说。**\n\n## 动手试试\n\n拿一个身边的东西（水杯、手机、一块布）。分别用\"大窗户的光\"和\"一个小台灯的光\"照它，观察阴影边缘的软硬、哪些面亮哪些面暗。然后各写一句话描述你看到的，不许用\"柔和\"\"硬朗\"这类词，只写位置和结果。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [配音和灯光的官方说法](/references/official-voice-light.md)","toc":[{"id":"craft-05-light-material-section-0","title":"问题在哪里"},{"id":"craft-05-light-material-section-1","title":"光不是亮度的总开关"},{"id":"craft-05-light-material-section-2","title":"三组常被搞混的词"},{"id":"craft-05-light-material-section-3","title":"硬光不需要百叶窗才能存在"},{"id":"craft-05-light-material-section-4","title":"材质要有四种线索"},{"id":"craft-05-light-material-section-5","title":"别让好看的光破坏连续性"},{"id":"craft-05-light-material-section-6","title":"什么时候交给后期"},{"id":"craft-05-light-material-section-7","title":"一句话记住"},{"id":"craft-05-light-material-section-8","title":"动手试试"}]},{"id":"craft/06-world-art-costume","path":"craft/06-world-art-costume.md","title":"17｜美术与妆造：世界不是背景板，身份不只是一张脸","description":"用\"这个人怎么生活、这个东西怎么被用过\"来设计世界和人物，别套性别模板和年代标签。","type":"Technique","group":"craft","tags":["美术","妆造","世界观","资产"],"html":"<h1>17｜美术与妆造：世界不是背景板，身份不只是一张脸<\/h1>\n<h2 id=\"craft-06-world-art-costume-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>复古公寓，东方美学，高级感。<\/p>\n<\/blockquote>\n<p>这些是标签。AI 会给你一个\"看起来像复古公寓\"的样板间，但没有人住过的痕迹。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-1\">从\"什么风格\"走到\"什么生活方式\"<\/h2>\n<p>\"复古公寓\"可能是被精心修复的公寓，也可能是仍在使用的旧住宅。前者所有东西成套，后者可能一张新椅子和一台旧风扇共存。<\/p>\n<p><strong>风格不是年代标签的集合，而是选择、使用和维护留下的关系。<\/strong><\/p>\n<blockquote>\n<p>房间不脏，桌面却有长期工作留下的磨亮边。两把椅子不成套，常坐的那把靠近窗，另一把偶尔才被拉出来。<\/p>\n<\/blockquote>\n<p>这段话不需要引出一段复杂身世。它只是让空间像有人用过。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-2\">角色分成三件事<\/h2>\n<p><strong>是谁<\/strong>：脸、身体比例、辨识特点。跨越所有场次不变。<\/p>\n<p><strong>现在什么造型<\/strong>：发型、服装、妆容、配饰。可以变，但每次变要经过批准。<\/p>\n<p><strong>这一刻什么状态<\/strong>：衣服干还是湿、完整还是破损、妆是刚化的还是过了一天、道具怎么拿着。随剧情变。<\/p>\n<p>\"同一张脸\"不等于永远同一个造型。\"刚受打击\"也不等于衣服马上变暗、发饰自动消失。<strong>状态变化必须有时间和行为上的理由。<\/strong><\/p>\n<h2 id=\"craft-06-world-art-costume-section-3\">别把性别当妆造的硬规则<\/h2>\n<p>有的教程用\"将军、公子、贵妃、落魄千金\"举例，说明身份和状态会改变造型。这个思路对，但<strong>不该推广成\"男性只写服装，女性只写妆面\"<\/strong>。舞台上的男性角色可以有浓妆，女性武者可以靠轮廓、材质和装备表达身份。<\/p>\n<p>更可靠的问题是：<strong>这个世界怎么表达阶层、职业、仪式、偏好和当下处境？<\/strong> 然后再决定发型、妆、衣服、配饰各承担多少信息。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-4\">用材质和维护状态，别只用身份名<\/h2>\n<p>\"年轻将军\"太宽泛。可以是：衣肩轮廓挺直，绑带收束明确，金属不是满屏发光而是有维护过的表面，活动处允许自然折痕。有没有战损，看他刚经历了什么。<\/p>\n<p>\"失意贵族\"也不必一身破衣：衣服依然昂贵，但领口不再像从前那样整理妥当。<strong>故事感可以来自维护习惯的改变，而不是叠加伤口和灰尘。<\/strong><\/p>\n<h2 id=\"craft-06-world-art-costume-section-5\">场景有固定结构，氛围有不同版本<\/h2>\n<p>同一个房间：门、窗、桌、通道构成不变的布局。清晨和深夜是光线的版本，宴会和散场是陈设的状态。<\/p>\n<p>九张房间图拼在一起，只有当它们真的是同一个空间时才有用。别把九张好看的房间拼成\"场景资产\"。<\/p>\n<p>简单项目只需一张主视图和必要的反打。复杂调度再补平面图或粗模。<strong>资产要覆盖实际会用到的角度，不追求无穷视图。<\/strong><\/p>\n<h2 id=\"craft-06-world-art-costume-section-6\">道具不必都重要，但重要的必须能用<\/h2>\n<p>承载剧情、被反复拿取、带品牌信息的东西，要有稳定的参考。远处只出现一次的无关小物，不必单独建档。<\/p>\n<p>需要开盖的瓶子，要知道盖和瓶怎么分开。需要翻页的书，要知道打开后是什么结构。<strong>不是只有一张正面美图就够了。<\/strong><\/p>\n<h2 id=\"craft-06-world-art-costume-section-7\">资产的\"本色\"和拍摄时的\"氛围\"分开<\/h2>\n<p>干净、中性的资产参考图，方便看清身份和结构。最终画面可以浓烈、戏剧化、风格化。<\/p>\n<p>不是\"资产不能好看\"，而是<strong>资产不应该把所有下游场景锁进同一种灯光、构图或表情<\/strong>。<\/p>\n<p>工作流程见<a href=\"#/workflows/05-assets-multishot\">资产与多镜头<\/a>，材质怎么写见<a href=\"#/craft/05-light-material\">光与材质<\/a>。<\/p>\n<h2 id=\"craft-06-world-art-costume-section-8\">一句话记住<\/h2>\n<p><strong>问\"这个人怎么生活、这个东西怎么被用过\"，别问\"什么风格\"。身份、造型、状态三件事分开管。<\/strong><\/p>\n<h2 id=\"craft-06-world-art-costume-section-9\">动手试试<\/h2>\n<p>描述一个房间，要求读者能推断出住在里面的人的一个习惯（比如爱看书、经常熬夜、刚搬来）。全程不许用\"温馨\"\"凌乱\"\"复古\"这类词，只写东西的位置和使用痕迹。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 17｜美术与妆造：世界不是背景板，身份不只是一张脸\n\n## 问题在哪里\n\n> 复古公寓，东方美学，高级感。\n\n这些是标签。AI 会给你一个\"看起来像复古公寓\"的样板间，但没有人住过的痕迹。\n\n## 从\"什么风格\"走到\"什么生活方式\"\n\n\"复古公寓\"可能是被精心修复的公寓，也可能是仍在使用的旧住宅。前者所有东西成套，后者可能一张新椅子和一台旧风扇共存。\n\n**风格不是年代标签的集合，而是选择、使用和维护留下的关系。**\n\n> 房间不脏，桌面却有长期工作留下的磨亮边。两把椅子不成套，常坐的那把靠近窗，另一把偶尔才被拉出来。\n\n这段话不需要引出一段复杂身世。它只是让空间像有人用过。\n\n## 角色分成三件事\n\n**是谁**：脸、身体比例、辨识特点。跨越所有场次不变。\n\n**现在什么造型**：发型、服装、妆容、配饰。可以变，但每次变要经过批准。\n\n**这一刻什么状态**：衣服干还是湿、完整还是破损、妆是刚化的还是过了一天、道具怎么拿着。随剧情变。\n\n\"同一张脸\"不等于永远同一个造型。\"刚受打击\"也不等于衣服马上变暗、发饰自动消失。**状态变化必须有时间和行为上的理由。**\n\n## 别把性别当妆造的硬规则\n\n有的教程用\"将军、公子、贵妃、落魄千金\"举例，说明身份和状态会改变造型。这个思路对，但**不该推广成\"男性只写服装，女性只写妆面\"**。舞台上的男性角色可以有浓妆，女性武者可以靠轮廓、材质和装备表达身份。\n\n更可靠的问题是：**这个世界怎么表达阶层、职业、仪式、偏好和当下处境？** 然后再决定发型、妆、衣服、配饰各承担多少信息。\n\n## 用材质和维护状态，别只用身份名\n\n\"年轻将军\"太宽泛。可以是：衣肩轮廓挺直，绑带收束明确，金属不是满屏发光而是有维护过的表面，活动处允许自然折痕。有没有战损，看他刚经历了什么。\n\n\"失意贵族\"也不必一身破衣：衣服依然昂贵，但领口不再像从前那样整理妥当。**故事感可以来自维护习惯的改变，而不是叠加伤口和灰尘。**\n\n## 场景有固定结构，氛围有不同版本\n\n同一个房间：门、窗、桌、通道构成不变的布局。清晨和深夜是光线的版本，宴会和散场是陈设的状态。\n\n九张房间图拼在一起，只有当它们真的是同一个空间时才有用。别把九张好看的房间拼成\"场景资产\"。\n\n简单项目只需一张主视图和必要的反打。复杂调度再补平面图或粗模。**资产要覆盖实际会用到的角度，不追求无穷视图。**\n\n## 道具不必都重要，但重要的必须能用\n\n承载剧情、被反复拿取、带品牌信息的东西，要有稳定的参考。远处只出现一次的无关小物，不必单独建档。\n\n需要开盖的瓶子，要知道盖和瓶怎么分开。需要翻页的书，要知道打开后是什么结构。**不是只有一张正面美图就够了。**\n\n## 资产的\"本色\"和拍摄时的\"氛围\"分开\n\n干净、中性的资产参考图，方便看清身份和结构。最终画面可以浓烈、戏剧化、风格化。\n\n不是\"资产不能好看\"，而是**资产不应该把所有下游场景锁进同一种灯光、构图或表情**。\n\n工作流程见[资产与多镜头](/workflows/05-assets-multishot.md)，材质怎么写见[光与材质](/craft/05-light-material.md)。\n\n## 一句话记住\n\n**问\"这个人怎么生活、这个东西怎么被用过\"，别问\"什么风格\"。身份、造型、状态三件事分开管。**\n\n## 动手试试\n\n描述一个房间，要求读者能推断出住在里面的人的一个习惯（比如爱看书、经常熬夜、刚搬来）。全程不许用\"温馨\"\"凌乱\"\"复古\"这类词，只写东西的位置和使用痕迹。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"craft-06-world-art-costume-section-0","title":"问题在哪里"},{"id":"craft-06-world-art-costume-section-1","title":"从\"什么风格\"走到\"什么生活方式\""},{"id":"craft-06-world-art-costume-section-2","title":"角色分成三件事"},{"id":"craft-06-world-art-costume-section-3","title":"别把性别当妆造的硬规则"},{"id":"craft-06-world-art-costume-section-4","title":"用材质和维护状态，别只用身份名"},{"id":"craft-06-world-art-costume-section-5","title":"场景有固定结构，氛围有不同版本"},{"id":"craft-06-world-art-costume-section-6","title":"道具不必都重要，但重要的必须能用"},{"id":"craft-06-world-art-costume-section-7","title":"资产的\"本色\"和拍摄时的\"氛围\"分开"},{"id":"craft-06-world-art-costume-section-8","title":"一句话记住"},{"id":"craft-06-world-art-costume-section-9","title":"动手试试"}]},{"id":"craft/07-sound-music","path":"craft/07-sound-music.md","title":"18｜音乐与声音：先决定声音在干哪件事","description":"声音可以撑起空间、给动作重量、引导注意、改变理解、连接段落。别只填\"流派 + 情绪 + BPM\"。","type":"Technique","group":"craft","tags":["音乐","音效","声音","通感"],"html":"<h1>18｜音乐与声音：先决定声音在干哪件事<\/h1>\n<blockquote>\n<p>同一扇缓缓关闭的门：配温柔音乐，像告别；只留锁舌落下那一声，像决定；门外还有笑声、门内突然安静，又像被隔在外面。<\/p>\n<\/blockquote>\n<h2 id=\"craft-07-sound-music-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>梦幻、轻快、118BPM、电子、氛围感。<\/p>\n<\/blockquote>\n<p>这是给音乐平台搜歌的标签，不是声音设计。它没说声音在这段片子里<strong>干什么<\/strong>。<\/p>\n<h2 id=\"craft-07-sound-music-section-1\">先决定声音在干哪件事<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>声音的工作<\/th>\n<th>可以怎么做<\/th>\n<th>不必怎么做<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>让空间成立<\/td>\n<td>远处持续的交通声，近处瓷杯轻响<\/td>\n<td>把所有声源混到同一个距离<\/td>\n<\/tr>\n<tr>\n<td>让动作有重量<\/td>\n<td>关门前的摩擦、接触一声、之后的余振<\/td>\n<td>每个小动作都放大成重击<\/td>\n<\/tr>\n<tr>\n<td>引导注意<\/td>\n<td>先听见钥匙，再看到门口的人<\/td>\n<td>永远靠镜头推近提示重点<\/td>\n<\/tr>\n<tr>\n<td>改变理解<\/td>\n<td>音乐继续温和，人物却越来越不安<\/td>\n<td>画面一悲伤就马上悲伤弦乐<\/td>\n<\/tr>\n<tr>\n<td>连接段落<\/td>\n<td>一个声音跨过剪辑点，把两个场景连起来<\/td>\n<td>每次切镜都重新开一段音乐<\/td>\n<\/tr>\n<tr>\n<td>给质感<\/td>\n<td>少量细碎、疏密变化形成触觉联想<\/td>\n<td>靠音量大制造\"电影级\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>不是所有声音都必须承担剧情。有时它只是让人舒服。<\/p>\n<h2 id=\"craft-07-sound-music-section-2\">三层声音，别抢同一件事<\/h2>\n<p><strong>环境底<\/strong>让空间一直存在：风、水、电器、街道。\n<strong>动作声和点声<\/strong>让某个时刻变具体：布料、脚步、杯子、门。\n<strong>音乐或声音设计<\/strong>让时间有方向：持续、脉冲、上升、悬住、松开。<\/p>\n<p><strong>安静不等于所有轨道归零。<\/strong> 可以留很小的室内声，拿掉原先占据注意的声音，观众因为对比而感到静。完全无声也是一种选择，但应该是有意的。<\/p>\n<h2 id=\"craft-07-sound-music-section-3\">音乐说明可以再写五件事<\/h2>\n<p>除了\"梦幻、118BPM\"，还可以写：<strong>开头怎么进入、用什么材料、节奏怎么呼吸、哪里变化、结尾怎么留余味。<\/strong><\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">为一支 30 秒的轻盈品牌短片设计无歌词配乐。整体轻快、清透，带一点像清晨空气刚被打开的愉悦，不做宏大的胜利感。以柔和的拨弦短音和少量清亮的键盘音色为主，低音轻而有弹性，打击乐稀疏，留出水声和近处动作声的位置。\n开头先给两三个彼此有间隔的音，之后才形成稳定律动。中段让旋律往上展开一点，不加厚成满铺弦乐。结尾逐渐减少声部，留下一个清楚但不过分煽情的落点和短尾音。\n目标律动约 118BPM。时长和剪辑点由后期按实际生成的音频确认。\n<\/code><\/pre>\n<p>\"像清晨空气刚被打开\"给感受，拨弦、稀疏、先后、收尾给方向。精确的 BPM、乐段秒数能不能做到，取决于工具。<strong>目标值不是已执行的事实。<\/strong><\/p>\n<h2 id=\"craft-07-sound-music-section-4\">音乐不一定跟着表情走<\/h2>\n<p>画面上人物大笑，音乐却保持平静——可能让快乐显得短暂，也可能让它显得被温柔接住。两种读法都可能成立，看前后文。<\/p>\n<p>所以用反差之前，先说清楚想产生什么：是甜蜜里藏不安，还是用安静承托强烈的喜悦。<strong>别只写\"反差配乐\"，更别把反差本身当高级。<\/strong><\/p>\n<h2 id=\"craft-07-sound-music-section-5\">声音的通感可以具体到起落<\/h2>\n<p>\"锋利\"可以是起音快、尾音短，也可以是高频刺痛。\"温润\"可以是圆一点的起音、持续平滑、不太靠前。\"有颗粒\"可以是离散的短音，不是整轨加噪声。<\/p>\n<p>如果要\"像远处玻璃的反光\"：减少音符数量、拉开间隔、让少数清亮的音色在远处出现。<strong>不必真的录玻璃。<\/strong><\/p>\n<h2 id=\"craft-07-sound-music-section-6\">先听到、声画不同源、主观听觉<\/h2>\n<p><strong>先听到<\/strong>：门后的脚步先到，画面还留在人物的手上，听觉成了事件的入口。\n<strong>声画不同源<\/strong>：画面切到空房间，上一句对白的尾音还在，声音成了记忆或连接。\n<strong>主观听觉<\/strong>：人物听到坏消息后，环境声暂时变弱。这是一种处理手法，不是现场真的没声了。<\/p>\n<p><strong>写清楚哪些声音是场内真实来源，哪些是配乐或主观处理。<\/strong> 否则 AI 可能把本来只给观众听的旁白，变成画面里新增一个说话的人。<\/p>\n<h2 id=\"craft-07-sound-music-section-7\">什么时候留白<\/h2>\n<p>一句话已经足够强，音乐可以退。产品的触感是重点，近处的细声可以代替情绪铺陈。观众需要自己判断表情时，别用每个转折都升调的音乐抢答。<\/p>\n<h2 id=\"craft-07-sound-music-section-8\">最后验三遍<\/h2>\n<ol>\n<li><strong>只听音频<\/strong>：有没有结构？<\/li>\n<li><strong>静音看画面<\/strong>：必须的信息能不能读懂？<\/li>\n<li><strong>合起来<\/strong>：是互相支持，还是重复喊同一句话？<\/li>\n<\/ol>\n<h2 id=\"craft-07-sound-music-section-9\">一句话记住<\/h2>\n<p><strong>先问声音在干哪件事——撑空间、给重量、引注意、改理解、连段落。别只填流派和 BPM。<\/strong><\/p>\n<h2 id=\"craft-07-sound-music-section-10\">动手试试<\/h2>\n<p>选一个安静的画面（比如\"一个人坐在窗边\"）。写三版声音方案，每版让观众产生完全不同的理解：一版是等待，一版是刚吵完架，一版是刚醒来。不许换画面，只换声音。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 18｜音乐与声音：先决定声音在干哪件事\n\n> 同一扇缓缓关闭的门：配温柔音乐，像告别；只留锁舌落下那一声，像决定；门外还有笑声、门内突然安静，又像被隔在外面。\n\n## 问题在哪里\n\n> 梦幻、轻快、118BPM、电子、氛围感。\n\n这是给音乐平台搜歌的标签，不是声音设计。它没说声音在这段片子里**干什么**。\n\n## 先决定声音在干哪件事\n\n| 声音的工作 | 可以怎么做 | 不必怎么做 |\n| --- | --- | --- |\n| 让空间成立 | 远处持续的交通声，近处瓷杯轻响 | 把所有声源混到同一个距离 |\n| 让动作有重量 | 关门前的摩擦、接触一声、之后的余振 | 每个小动作都放大成重击 |\n| 引导注意 | 先听见钥匙，再看到门口的人 | 永远靠镜头推近提示重点 |\n| 改变理解 | 音乐继续温和，人物却越来越不安 | 画面一悲伤就马上悲伤弦乐 |\n| 连接段落 | 一个声音跨过剪辑点，把两个场景连起来 | 每次切镜都重新开一段音乐 |\n| 给质感 | 少量细碎、疏密变化形成触觉联想 | 靠音量大制造\"电影级\" |\n\n不是所有声音都必须承担剧情。有时它只是让人舒服。\n\n## 三层声音，别抢同一件事\n\n**环境底**让空间一直存在：风、水、电器、街道。\n**动作声和点声**让某个时刻变具体：布料、脚步、杯子、门。\n**音乐或声音设计**让时间有方向：持续、脉冲、上升、悬住、松开。\n\n**安静不等于所有轨道归零。** 可以留很小的室内声，拿掉原先占据注意的声音，观众因为对比而感到静。完全无声也是一种选择，但应该是有意的。\n\n## 音乐说明可以再写五件事\n\n除了\"梦幻、118BPM\"，还可以写：**开头怎么进入、用什么材料、节奏怎么呼吸、哪里变化、结尾怎么留余味。**\n\n```text\n为一支 30 秒的轻盈品牌短片设计无歌词配乐。整体轻快、清透，带一点像清晨空气刚被打开的愉悦，不做宏大的胜利感。以柔和的拨弦短音和少量清亮的键盘音色为主，低音轻而有弹性，打击乐稀疏，留出水声和近处动作声的位置。\n开头先给两三个彼此有间隔的音，之后才形成稳定律动。中段让旋律往上展开一点，不加厚成满铺弦乐。结尾逐渐减少声部，留下一个清楚但不过分煽情的落点和短尾音。\n目标律动约 118BPM。时长和剪辑点由后期按实际生成的音频确认。\n```\n\n\"像清晨空气刚被打开\"给感受，拨弦、稀疏、先后、收尾给方向。精确的 BPM、乐段秒数能不能做到，取决于工具。**目标值不是已执行的事实。**\n\n## 音乐不一定跟着表情走\n\n画面上人物大笑，音乐却保持平静——可能让快乐显得短暂，也可能让它显得被温柔接住。两种读法都可能成立，看前后文。\n\n所以用反差之前，先说清楚想产生什么：是甜蜜里藏不安，还是用安静承托强烈的喜悦。**别只写\"反差配乐\"，更别把反差本身当高级。**\n\n## 声音的通感可以具体到起落\n\n\"锋利\"可以是起音快、尾音短，也可以是高频刺痛。\"温润\"可以是圆一点的起音、持续平滑、不太靠前。\"有颗粒\"可以是离散的短音，不是整轨加噪声。\n\n如果要\"像远处玻璃的反光\"：减少音符数量、拉开间隔、让少数清亮的音色在远处出现。**不必真的录玻璃。**\n\n## 先听到、声画不同源、主观听觉\n\n**先听到**：门后的脚步先到，画面还留在人物的手上，听觉成了事件的入口。\n**声画不同源**：画面切到空房间，上一句对白的尾音还在，声音成了记忆或连接。\n**主观听觉**：人物听到坏消息后，环境声暂时变弱。这是一种处理手法，不是现场真的没声了。\n\n**写清楚哪些声音是场内真实来源，哪些是配乐或主观处理。** 否则 AI 可能把本来只给观众听的旁白，变成画面里新增一个说话的人。\n\n## 什么时候留白\n\n一句话已经足够强，音乐可以退。产品的触感是重点，近处的细声可以代替情绪铺陈。观众需要自己判断表情时，别用每个转折都升调的音乐抢答。\n\n## 最后验三遍\n\n1. **只听音频**：有没有结构？\n2. **静音看画面**：必须的信息能不能读懂？\n3. **合起来**：是互相支持，还是重复喊同一句话？\n\n## 一句话记住\n\n**先问声音在干哪件事——撑空间、给重量、引注意、改理解、连段落。别只填流派和 BPM。**\n\n## 动手试试\n\n选一个安静的画面（比如\"一个人坐在窗边\"）。写三版声音方案，每版让观众产生完全不同的理解：一版是等待，一版是刚吵完架，一版是刚醒来。不许换画面，只换声音。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"craft-07-sound-music-section-0","title":"问题在哪里"},{"id":"craft-07-sound-music-section-1","title":"先决定声音在干哪件事"},{"id":"craft-07-sound-music-section-2","title":"三层声音，别抢同一件事"},{"id":"craft-07-sound-music-section-3","title":"音乐说明可以再写五件事"},{"id":"craft-07-sound-music-section-4","title":"音乐不一定跟着表情走"},{"id":"craft-07-sound-music-section-5","title":"声音的通感可以具体到起落"},{"id":"craft-07-sound-music-section-6","title":"先听到、声画不同源、主观听觉"},{"id":"craft-07-sound-music-section-7","title":"什么时候留白"},{"id":"craft-07-sound-music-section-8","title":"最后验三遍"},{"id":"craft-07-sound-music-section-9","title":"一句话记住"},{"id":"craft-07-sound-music-section-10","title":"动手试试"}]},{"id":"craft/08-still-graphic-style","path":"craft/08-still-graphic-style.md","title":"19｜静态图、平面设计与风格化：一张图不必写成电影","description":"没有时间轴的时候，怎么组织主次、关系、材料和阅读顺序。允许一张图没有故事，但不允许没有选择。","type":"Technique","group":"craft","tags":["平面","生图","插画","风格"],"html":"<h1>19｜静态图、平面设计与风格化：一张图不必写成电影<\/h1>\n<h2 id=\"craft-08-still-graphic-style-section-0\">问题在哪里<\/h2>\n<p>前面几章一直在讲\"人物想做什么、发生了什么变化\"。但如果你要做的是一张产品海报、一张插画、一个封面呢？瓶子没有动机，色块没有内心。<\/p>\n<p><strong>一张图可以没有故事，但不能没有选择。<\/strong><\/p>\n<h2 id=\"craft-08-still-graphic-style-section-1\">静态图从四件事入手<\/h2>\n<p><strong>视觉中心<\/strong>：第一眼看哪里？\n<strong>空间关系<\/strong>：东西之间怎么放？谁前谁后？\n<strong>材料语言<\/strong>：是摄影的质感、手绘的质感，还是印刷的质感？\n<strong>阅读路径<\/strong>：第二眼、第三眼去哪？<\/p>\n<p>故事只是组织这四件事的方式之一。产品海报可能只需要材料清透、产品好认、版面有呼吸。插画可能只想组织一种荒诞的关系。别为了套表演方法，给每只瓶子都安排动机。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-2\">同一个主题，三种视觉语言<\/h2>\n<p>任务：表现\"薄，但有保护感\"。<\/p>\n<p><strong>写实静物<\/strong>：产品旁边一层很薄的半透明材质包住一个圆润的物体，接触处有轻微形变，边缘清晰，背景简洁。<\/p>\n<p><strong>平面设计<\/strong>：一条细线绕过主标题，靠近文字时留下均匀的间距。用版式关系表达保护，不画真实的薄膜。<\/p>\n<p><strong>插画<\/strong>：一张几乎透明的纸伞罩住很小的雨云，纸边有轻微的手绘抖动。违反现实尺度，但画里的规则明确。<\/p>\n<p>三者不需要都追求摄影级的皮肤和镜头眩光。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-3\">把\"风格\"拆成可以选的构成<\/h2>\n<p>\"东方美学、复古、高级\"太宽。可以分别说：线条是工整还是松动？色块是平涂还是渗染？形体是准确还是夸张？空间是平面叠置还是透视深入？表面保留哪种手工痕迹？<\/p>\n<blockquote>\n<p>两色丝网印刷感，色面平整，人物轮廓略作夸张。边缘允许轻微套印错位，但眼睛和标题仍清楚。不要为了印刷感把画面做成满地污渍。<\/p>\n<\/blockquote>\n<p>这是媒介效果的方向，不保证真的复现了印刷工艺。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-4\">风格融合，要决定谁提供骨架<\/h2>\n<p>\"水墨 + 科技 + 包豪斯 + 巴洛克\"不必禁止，但要分工。比如：几何版式提供秩序，水墨边缘提供材质，局部金属反光提供产品属性。<strong>不要四种风格同时改造每一处。<\/strong><\/p>\n<p>一句话检查主从：<strong>这张图第一眼属于什么，第二眼发现什么不同？<\/strong> 答不出来，可能只是元素拼盘。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-5\">版式和字标有硬任务<\/h2>\n<p>先确定画幅和最终发布尺寸，再决定主体占比、标题区、辅助信息区、安全边界。<\/p>\n<p>长文案、小字、多语言字标、精确商标和包装，最好保留可编辑的排版或合成步骤，别靠一次生成后盲目放大交付。<\/p>\n<p>提示词可以说：<\/p>\n<blockquote>\n<p>主体位于右下。左上留出连续、低细节的浅色区域，供后期放置标题。这里不生成任何临时占位文字。<\/p>\n<\/blockquote>\n<p>如果工具支持文字生成，可以用来探索。但最终要逐字核对，别把\"看起来像字的形状\"当成正确的文字。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-6\">静态图的\"动作感\"是一个状态，不是多个时刻<\/h2>\n<p>\"正在转身的一瞬\"可以通过衣摆和身体朝向表现。\"先转身然后走出房间\"放进一张图，可能变成拼贴或重复人物。需要连续动作就用分镜或视频。<\/p>\n<p>非叙事的构图也可以借用节奏：重复形体的间距、色块大小的变化、边缘的密度，都是观看的时间。别机械地给静态设计加秒数。<\/p>\n<p>更多生图步骤见<a href=\"#/workflows/02-text-to-image\">文字生图<\/a>。<\/p>\n<h2 id=\"craft-08-still-graphic-style-section-7\">一句话记住<\/h2>\n<p><strong>静态图问四件事：第一眼看哪、东西怎么放、什么材质、第二眼去哪。风格拆成可选的构成，融合时决定谁当骨架。<\/strong><\/p>\n<h2 id=\"craft-08-still-graphic-style-section-8\">动手试试<\/h2>\n<p>选一个抽象词（\"信任\"\"速度\"\"安静\"），分别用写实摄影、平面设计、插画三种语言各写一段静态图提示词。要求：三段用的\"材料\"完全不同，但表达的关系是同一个。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/official-image\">图像工具的官方说法<\/a><\/p>\n<\/details>","text":"# 19｜静态图、平面设计与风格化：一张图不必写成电影\n\n## 问题在哪里\n\n前面几章一直在讲\"人物想做什么、发生了什么变化\"。但如果你要做的是一张产品海报、一张插画、一个封面呢？瓶子没有动机，色块没有内心。\n\n**一张图可以没有故事，但不能没有选择。**\n\n## 静态图从四件事入手\n\n**视觉中心**：第一眼看哪里？\n**空间关系**：东西之间怎么放？谁前谁后？\n**材料语言**：是摄影的质感、手绘的质感，还是印刷的质感？\n**阅读路径**：第二眼、第三眼去哪？\n\n故事只是组织这四件事的方式之一。产品海报可能只需要材料清透、产品好认、版面有呼吸。插画可能只想组织一种荒诞的关系。别为了套表演方法，给每只瓶子都安排动机。\n\n## 同一个主题，三种视觉语言\n\n任务：表现\"薄，但有保护感\"。\n\n**写实静物**：产品旁边一层很薄的半透明材质包住一个圆润的物体，接触处有轻微形变，边缘清晰，背景简洁。\n\n**平面设计**：一条细线绕过主标题，靠近文字时留下均匀的间距。用版式关系表达保护，不画真实的薄膜。\n\n**插画**：一张几乎透明的纸伞罩住很小的雨云，纸边有轻微的手绘抖动。违反现实尺度，但画里的规则明确。\n\n三者不需要都追求摄影级的皮肤和镜头眩光。\n\n## 把\"风格\"拆成可以选的构成\n\n\"东方美学、复古、高级\"太宽。可以分别说：线条是工整还是松动？色块是平涂还是渗染？形体是准确还是夸张？空间是平面叠置还是透视深入？表面保留哪种手工痕迹？\n\n> 两色丝网印刷感，色面平整，人物轮廓略作夸张。边缘允许轻微套印错位，但眼睛和标题仍清楚。不要为了印刷感把画面做成满地污渍。\n\n这是媒介效果的方向，不保证真的复现了印刷工艺。\n\n## 风格融合，要决定谁提供骨架\n\n\"水墨 + 科技 + 包豪斯 + 巴洛克\"不必禁止，但要分工。比如：几何版式提供秩序，水墨边缘提供材质，局部金属反光提供产品属性。**不要四种风格同时改造每一处。**\n\n一句话检查主从：**这张图第一眼属于什么，第二眼发现什么不同？** 答不出来，可能只是元素拼盘。\n\n## 版式和字标有硬任务\n\n先确定画幅和最终发布尺寸，再决定主体占比、标题区、辅助信息区、安全边界。\n\n长文案、小字、多语言字标、精确商标和包装，最好保留可编辑的排版或合成步骤，别靠一次生成后盲目放大交付。\n\n提示词可以说：\n> 主体位于右下。左上留出连续、低细节的浅色区域，供后期放置标题。这里不生成任何临时占位文字。\n\n如果工具支持文字生成，可以用来探索。但最终要逐字核对，别把\"看起来像字的形状\"当成正确的文字。\n\n## 静态图的\"动作感\"是一个状态，不是多个时刻\n\n\"正在转身的一瞬\"可以通过衣摆和身体朝向表现。\"先转身然后走出房间\"放进一张图，可能变成拼贴或重复人物。需要连续动作就用分镜或视频。\n\n非叙事的构图也可以借用节奏：重复形体的间距、色块大小的变化、边缘的密度，都是观看的时间。别机械地给静态设计加秒数。\n\n更多生图步骤见[文字生图](/workflows/02-text-to-image.md)。\n\n## 一句话记住\n\n**静态图问四件事：第一眼看哪、东西怎么放、什么材质、第二眼去哪。风格拆成可选的构成，融合时决定谁当骨架。**\n\n## 动手试试\n\n选一个抽象词（\"信任\"\"速度\"\"安静\"），分别用写实摄影、平面设计、插画三种语言各写一段静态图提示词。要求：三段用的\"材料\"完全不同，但表达的关系是同一个。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [图像工具的官方说法](/references/official-image.md)","toc":[{"id":"craft-08-still-graphic-style-section-0","title":"问题在哪里"},{"id":"craft-08-still-graphic-style-section-1","title":"静态图从四件事入手"},{"id":"craft-08-still-graphic-style-section-2","title":"同一个主题，三种视觉语言"},{"id":"craft-08-still-graphic-style-section-3","title":"把\"风格\"拆成可以选的构成"},{"id":"craft-08-still-graphic-style-section-4","title":"风格融合，要决定谁提供骨架"},{"id":"craft-08-still-graphic-style-section-5","title":"版式和字标有硬任务"},{"id":"craft-08-still-graphic-style-section-6","title":"静态图的\"动作感\"是一个状态，不是多个时刻"},{"id":"craft-08-still-graphic-style-section-7","title":"一句话记住"},{"id":"craft-08-still-graphic-style-section-8","title":"动手试试"}]},{"id":"craft/09-time-montage","path":"craft/09-time-montage.md","title":"20｜时间与剪辑：提示词里发生了，不代表观众来得及看懂","description":"三种时间要一起算：事情做完的时间、观众看懂的时间、感受形成的时间。先给段落功能，再给秒数。","type":"Technique","group":"craft","tags":["剪辑","时间","叙事","节奏"],"html":"<h1>20｜时间与剪辑：提示词里发生了，不代表观众来得及看懂<\/h1>\n<h2 id=\"craft-09-time-montage-section-0\">问题在哪里<\/h2>\n<blockquote>\n<p>她走进房间，看到信，拿起来，读完，落泪，放下信，走到窗边。8 秒。<\/p>\n<\/blockquote>\n<p>八秒里七件事。AI 可能真的全做了，但观众一件都没看清。<\/p>\n<h2 id=\"craft-09-time-montage-section-1\">三种时间要一起算<\/h2>\n<p><strong>事情做完的时间<\/strong>：走到门边、拿起东西、说完一句话。\n<strong>观众看懂的时间<\/strong>：看清是谁、认出关键道具、读完重要文字。\n<strong>感受形成的时间<\/strong>：让一次反应被接住，让一处安静真的留住。<\/p>\n<p>它们有时重叠，有时不能。手部换东西可以在很短时间内完成，不代表观众分得清真假。一句台词读得快，也不代表情绪来得及转折。<\/p>\n<p><strong>没有\"每个动作固定两秒\"这种通用规则。<\/strong><\/p>\n<h2 id=\"craft-09-time-montage-section-2\">先给段落功能，再给秒数<\/h2>\n<p>一条 30 秒的品牌片，可以是\"进入、触感、展开、留味\"四段，而不是强行安排危机和反转。关系戏可以是\"试探、接住、错过、停留\"。喜剧可以是\"建立预期、重复、偏差、反应\"。<\/p>\n<p>这些都是可选的组织方式，不是新的三幕剧模板。<\/p>\n<p><strong>拍摄或生成之前，写下每段结束时观众应该多知道了什么、多感到了什么。<\/strong> 没有新增信息或感受的段落，可以因为节奏或好看而保留，但你要知道自己为什么愿意花这个时间。<\/p>\n<h2 id=\"craft-09-time-montage-section-3\">一镜到底和多镜头解决不同问题<\/h2>\n<p>一镜到底强调空间和过程的连续，适合让观众跟着一件事走。多镜头允许压缩时间、改变视点、比较材料、制造跳跃。<strong>两者没有高低。<\/strong><\/p>\n<p>困难的动作不必全靠一个长镜头完成。反过来，安静的对话也不需要每句话切一次。选形式时先看表达任务和制作代价。<\/p>\n<h2 id=\"craft-09-time-montage-section-4\">切镜的理由不只有\"动作做完了\"<\/h2>\n<p>可以在看见关键物之前切，让声音把人带过去。可以在一个动作还没结束时切到反应。可以保留动作完成之后的余量，让空白成为内容。<\/p>\n<blockquote>\n<p>杯子已经被拿走，镜头还留在那圈水迹上。下一个镜头不解释这圈水，让一个更开阔的空间接住它。<\/p>\n<\/blockquote>\n<p>这是一种感官上的连接，不要求观众把水迹解读成什么象征。<\/p>\n<h2 id=\"craft-09-time-montage-section-5\">声音可以比画面更连续<\/h2>\n<p>音乐的一个长音跨过两个镜头。环境声在切换前先进来。人物的最后半句话留在对方的反应上。这些都能组织时间。<\/p>\n<p><strong>别让每个 AI 生成的片段都带着自己的音乐开头和结尾<\/strong>，拼起来会互相打架。重要的声音要单独规划，见<a href=\"#/craft/07-sound-music\">音乐与声音<\/a>。<\/p>\n<h2 id=\"craft-09-time-montage-section-6\">交接点比漂亮的中段更容易出问题<\/h2>\n<p>上一个镜头右手拿杯，下一个突然左手。上一个在门外，下一个已经坐下，却没有时间跳跃的线索。同一场景光源反了。镜头结尾意外变成慢动作。<\/p>\n<p>这些都要在剪辑里判断<strong>影不影响理解<\/strong>，不是看到任何差异就返工。<\/p>\n<p>记录每条候选片段的：可用区间、开始和结束时的状态、主要缺陷。<strong>\"生成成功\"不等于\"成片通过\"。<\/strong><\/p>\n<h2 id=\"craft-09-time-montage-section-7\">留剪辑余量，但别把空白当统一规定<\/h2>\n<p>重要动作前后留一点可选的空间，有助于剪辑。但准确的余量取决于节奏和工具时长。<\/p>\n<p>需要产品静止收尾，就让末尾真的稳定，别在最后一帧还在运镜。需要突然中断，就别强行加平缓收尾。<\/p>\n<p>时间不够时，<strong>减少必须发生的事件、改变剪辑形式、重新分配时长<\/strong>，通常比要求 AI\"更自然地完成全部动作\"更管用。<\/p>\n<h2 id=\"craft-09-time-montage-section-8\">一句话记住<\/h2>\n<p><strong>算三种时间：做完的、看懂的、感受到的。先定每段的功能，再填秒数。<\/strong><\/p>\n<h2 id=\"craft-09-time-montage-section-9\">动手试试<\/h2>\n<p>把开头那句\"她走进房间，看到信，拿起来，读完，落泪，放下信，走到窗边\"拆一下：如果只有 8 秒，你保留哪两三件事？如果拆成三个镜头，每个镜头的功能是什么？观众在每个镜头结束时多知道了什么？<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a>\n[2] <a href=\"#/references/tutorial-map\">13 组教程进入了哪些章节<\/a><\/p>\n<\/details>","text":"# 20｜时间与剪辑：提示词里发生了，不代表观众来得及看懂\n\n## 问题在哪里\n\n> 她走进房间，看到信，拿起来，读完，落泪，放下信，走到窗边。8 秒。\n\n八秒里七件事。AI 可能真的全做了，但观众一件都没看清。\n\n## 三种时间要一起算\n\n**事情做完的时间**：走到门边、拿起东西、说完一句话。\n**观众看懂的时间**：看清是谁、认出关键道具、读完重要文字。\n**感受形成的时间**：让一次反应被接住，让一处安静真的留住。\n\n它们有时重叠，有时不能。手部换东西可以在很短时间内完成，不代表观众分得清真假。一句台词读得快，也不代表情绪来得及转折。\n\n**没有\"每个动作固定两秒\"这种通用规则。**\n\n## 先给段落功能，再给秒数\n\n一条 30 秒的品牌片，可以是\"进入、触感、展开、留味\"四段，而不是强行安排危机和反转。关系戏可以是\"试探、接住、错过、停留\"。喜剧可以是\"建立预期、重复、偏差、反应\"。\n\n这些都是可选的组织方式，不是新的三幕剧模板。\n\n**拍摄或生成之前，写下每段结束时观众应该多知道了什么、多感到了什么。** 没有新增信息或感受的段落，可以因为节奏或好看而保留，但你要知道自己为什么愿意花这个时间。\n\n## 一镜到底和多镜头解决不同问题\n\n一镜到底强调空间和过程的连续，适合让观众跟着一件事走。多镜头允许压缩时间、改变视点、比较材料、制造跳跃。**两者没有高低。**\n\n困难的动作不必全靠一个长镜头完成。反过来，安静的对话也不需要每句话切一次。选形式时先看表达任务和制作代价。\n\n## 切镜的理由不只有\"动作做完了\"\n\n可以在看见关键物之前切，让声音把人带过去。可以在一个动作还没结束时切到反应。可以保留动作完成之后的余量，让空白成为内容。\n\n> 杯子已经被拿走，镜头还留在那圈水迹上。下一个镜头不解释这圈水，让一个更开阔的空间接住它。\n\n这是一种感官上的连接，不要求观众把水迹解读成什么象征。\n\n## 声音可以比画面更连续\n\n音乐的一个长音跨过两个镜头。环境声在切换前先进来。人物的最后半句话留在对方的反应上。这些都能组织时间。\n\n**别让每个 AI 生成的片段都带着自己的音乐开头和结尾**，拼起来会互相打架。重要的声音要单独规划，见[音乐与声音](/craft/07-sound-music.md)。\n\n## 交接点比漂亮的中段更容易出问题\n\n上一个镜头右手拿杯，下一个突然左手。上一个在门外，下一个已经坐下，却没有时间跳跃的线索。同一场景光源反了。镜头结尾意外变成慢动作。\n\n这些都要在剪辑里判断**影不影响理解**，不是看到任何差异就返工。\n\n记录每条候选片段的：可用区间、开始和结束时的状态、主要缺陷。**\"生成成功\"不等于\"成片通过\"。**\n\n## 留剪辑余量，但别把空白当统一规定\n\n重要动作前后留一点可选的空间，有助于剪辑。但准确的余量取决于节奏和工具时长。\n\n需要产品静止收尾，就让末尾真的稳定，别在最后一帧还在运镜。需要突然中断，就别强行加平缓收尾。\n\n时间不够时，**减少必须发生的事件、改变剪辑形式、重新分配时长**，通常比要求 AI\"更自然地完成全部动作\"更管用。\n\n## 一句话记住\n\n**算三种时间：做完的、看懂的、感受到的。先定每段的功能，再填秒数。**\n\n## 动手试试\n\n把开头那句\"她走进房间，看到信，拿起来，读完，落泪，放下信，走到窗边\"拆一下：如果只有 8 秒，你保留哪两三件事？如果拆成三个镜头，每个镜头的功能是什么？观众在每个镜头结束时多知道了什么？\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)\n[2] [13 组教程进入了哪些章节](/references/tutorial-map.md)","toc":[{"id":"craft-09-time-montage-section-0","title":"问题在哪里"},{"id":"craft-09-time-montage-section-1","title":"三种时间要一起算"},{"id":"craft-09-time-montage-section-2","title":"先给段落功能，再给秒数"},{"id":"craft-09-time-montage-section-3","title":"一镜到底和多镜头解决不同问题"},{"id":"craft-09-time-montage-section-4","title":"切镜的理由不只有\"动作做完了\""},{"id":"craft-09-time-montage-section-5","title":"声音可以比画面更连续"},{"id":"craft-09-time-montage-section-6","title":"交接点比漂亮的中段更容易出问题"},{"id":"craft-09-time-montage-section-7","title":"留剪辑余量，但别把空白当统一规定"},{"id":"craft-09-time-montage-section-8","title":"一句话记住"},{"id":"craft-09-time-montage-section-9","title":"动手试试"}]},{"id":"workflows/index","path":"workflows/index.md","title":"IV · 生成与迭代","description":"","type":"Index","group":"workflows","tags":[],"html":"<h1>IV · 生成与迭代<\/h1>\n<p>从一句需求走到成片的具体流程。生图、改图、图生视频、多镜头、预演、评价、换工具，各有各的做法。<\/p>\n<ul>\n<li><p><a href=\"#/workflows/01-brief-to-options\">21｜从一句需求到几个真正不同的方向<\/a> — 先把形容词翻译成问题，再想三个方向。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/02-text-to-image\">22｜文字生图：先造一个能看懂的画面，再谈细节<\/a> — 结构 → 关系 → 细节。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/03-image-edit\">23｜改图：说清改哪里，也要说清改完之后是什么样<\/a> — 原图、改哪、怎么改、改完什么样、什么不能动。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/04-image-to-video\">24｜图生视频：让已经存在的画面继续发生<\/a> — 只写变化，给一个结尾状态。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/05-assets-multishot\">25｜多镜头与资产：准备时可以丰富，提交时要克制<\/a> — 身份、造型、状态、本镜姿态分开管。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/06-previs\">26｜复杂镜头：什么时候该放下文字，先做预演<\/a> — 空间关系复杂时，先用最便宜的方式演一遍。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/07-evaluate-repair\">27｜评价与修复：别用\"AI 味\"三个字掩盖问题在哪<\/a> — 失败分层，一次改一件事。<\/p>\n<\/li>\n<li><p><a href=\"#/workflows/08-model-adaptation\">28｜工具适配：同一个创意，不必用同一段提示词<\/a> — 创意不变，输入随工具变。<\/p>\n<\/li>\n<\/ul>\n<p><a href=\"#/index\">回到总目录<\/a><\/p>\n","text":"# IV · 生成与迭代\n\n从一句需求走到成片的具体流程。生图、改图、图生视频、多镜头、预演、评价、换工具，各有各的做法。\n\n- [21｜从一句需求到几个真正不同的方向](/workflows/01-brief-to-options.md) — 先把形容词翻译成问题，再想三个方向。\n\n- [22｜文字生图：先造一个能看懂的画面，再谈细节](/workflows/02-text-to-image.md) — 结构 → 关系 → 细节。\n\n- [23｜改图：说清改哪里，也要说清改完之后是什么样](/workflows/03-image-edit.md) — 原图、改哪、怎么改、改完什么样、什么不能动。\n\n- [24｜图生视频：让已经存在的画面继续发生](/workflows/04-image-to-video.md) — 只写变化，给一个结尾状态。\n\n- [25｜多镜头与资产：准备时可以丰富，提交时要克制](/workflows/05-assets-multishot.md) — 身份、造型、状态、本镜姿态分开管。\n\n- [26｜复杂镜头：什么时候该放下文字，先做预演](/workflows/06-previs.md) — 空间关系复杂时，先用最便宜的方式演一遍。\n\n- [27｜评价与修复：别用\"AI 味\"三个字掩盖问题在哪](/workflows/07-evaluate-repair.md) — 失败分层，一次改一件事。\n\n- [28｜工具适配：同一个创意，不必用同一段提示词](/workflows/08-model-adaptation.md) — 创意不变，输入随工具变。\n\n[回到总目录](/index.md)\n","toc":[]},{"id":"workflows/01-brief-to-options","path":"workflows/01-brief-to-options.md","title":"21｜从一句需求到几个真正不同的方向","description":"收到\"做得梦幻一点、高级一点\"之后，先别写提示词。五步：翻译形容词、发展方向、选方向、先试最危险的、冻结。","type":"Playbook","group":"workflows","tags":["需求","创意","流程"],"html":"<h1>21｜从一句需求到几个真正不同的方向<\/h1>\n<h2 id=\"workflows-01-brief-to-options-section-0\">问题在哪里<\/h2>\n<p>客户或者朋友说：\"做得梦幻一点、轻盈一点、高级一点。\"<\/p>\n<p>大多数人的反应是直接把这三个词扩写成一段大提示词。结果出来的东西\"看起来还行\"，但没人满意，也没人说得出为什么。<\/p>\n<p>因为你跳过了最重要的一步：<strong>搞清楚这三个词到底要改善什么。<\/strong><\/p>\n<h2 id=\"workflows-01-brief-to-options-section-1\">第一步：把形容词翻译成问题<\/h2>\n<p>\"梦幻\"——是要世界规则偏一点，还是只是要柔和？\n\"轻盈\"——是产品的触感，还是人物的状态，还是节奏？\n\"高级\"——是材质精确，还是留白，还是文化气质，还是更贵的视觉信号？<\/p>\n<p>能从已有资料确定的，别重复问。暂时不确定但风险小的，标成假设继续做。<strong>品牌名称、必须保留的内容、授权范围、输出规格——这些不能猜。<\/strong><\/p>\n<p>一份够用的起点，六行就行：<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">作品用途：30 秒情绪品牌片，之后另做竖屏版。\n核心体验：从被催促变成可以慢一点。清爽，但不是冷。\n必须让观众读懂：产品是什么、什么时候用。不添加没确认过的功效。\n已有素材：包装主图、一个人物参考、一张室内场景参考。\n形式空间：允许少量非写实转场，人物和产品保持可辨认。\n待选择：音乐主导还是环境声主导？先比较两种。\n<\/code><\/pre>\n<p>这是创作简报，不是要输给视频模型的提示词。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-2\">第二步：用不同的\"机制\"发展方向<\/h2>\n<p>至少比较<strong>表达机制<\/strong>，不只是颜色和场景。<\/p>\n<p>一个方向由身体状态改变推动，一个由空间开合推动，一个由声音密度变化推动。每个方向写：一段感受稿、一段画面解释、一个最大的风险。<\/p>\n<p>比如\"声音密度\"方向的风险是：静音播放时信息变弱。\"身体变化\"方向的风险是：表演容易被夸大。<\/p>\n<p><strong>风险不是否定创意的理由，而是决定先试哪一点。<\/strong><\/p>\n<h2 id=\"workflows-01-brief-to-options-section-3\">第三步：选方向时看四件事<\/h2>\n<ol>\n<li>是否贴近任务？<\/li>\n<li>有没有辨识度？<\/li>\n<li>核心信息容易接收吗？<\/li>\n<li>现有条件能完成吗？<\/li>\n<\/ol>\n<p>别把\"最容易生成\"自动当最好，也别把\"最奇怪\"当最有创意。有时一个审美上的冒险值得做，但要说清它让什么变好、让什么变难。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-4\">第四步：先试最可能推翻方案的那一点<\/h2>\n<p>如果全片靠一处玻璃折射成立，先做它，不要先生成十张漂亮的人物图。如果全片靠一句\"听起来不舍但不煽情\"的台词成立，先试听。如果核心是两人交接道具，先试接触和去向。<\/p>\n<p>可以先用文字读稿、简单草图、已有素材剪出节拍，再决定值不值得生成。<strong>不是所有验证都要付费调用。<\/strong><\/p>\n<h2 id=\"workflows-01-brief-to-options-section-5\">第五步：把创意冻结到恰当的程度<\/h2>\n<p>确定：表达方向、关键人物和物件、每段的结果。\n留开放：自然的小动作、非关键的装饰。<\/p>\n<p>选定的版本写成当前的创作说明，后续任务引用它，不把探索期的三个方案一起带进执行。<\/p>\n<p>\"冻结\"只是停止无理由的变化。真的发现更好的方案还可以改，但要让涉及的镜头、参考图和声音同步更新。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-6\">交给生成环节的是什么<\/h2>\n<p>选定的方向、实际素材清单、当前镜头任务、重要约束、这次要比较的点。<strong>不必附上所有聊天记录和被否决的方案。<\/strong> 模板见<a href=\"#/practice/01-templates\">工具箱<\/a>。<\/p>\n<h2 id=\"workflows-01-brief-to-options-section-7\">一句话记住<\/h2>\n<p><strong>先把形容词翻译成问题，再用不同机制想三个方向，先试最危险的那一点，最后冻结。<\/strong><\/p>\n<h2 id=\"workflows-01-brief-to-options-section-8\">动手试试<\/h2>\n<p>想一句模糊的需求（\"做得温暖一点\"）。用第一步把\"温暖\"翻译成至少三个不同的问题。然后为其中一个问题想两个表达机制不同的方向，各写一个最大风险。<\/p>\n<details class=\"citations\"><summary>来源与依据<\/summary><p>[1] <a href=\"#/references/corpus\">这本书依据什么写成<\/a><\/p>\n<\/details>","text":"# 21｜从一句需求到几个真正不同的方向\n\n## 问题在哪里\n\n客户或者朋友说：\"做得梦幻一点、轻盈一点、高级一点。\"\n\n大多数人的反应是直接把这三个词扩写成一段大提示词。结果出来的东西\"看起来还行\"，但没人满意，也没人说得出为什么。\n\n因为你跳过了最重要的一步：**搞清楚这三个词到底要改善什么。**\n\n## 第一步：把形容词翻译成问题\n\n\"梦幻\"——是要世界规则偏一点，还是只是要柔和？\n\"轻盈\"——是产品的触感，还是人物的状态，还是节奏？\n\"高级\"——是材质精确，还是留白，还是文化气质，还是更贵的视觉信号？\n\n能从已有资料确定的，别重复问。暂时不确定但风险小的，标成假设继续做。**品牌名称、必须保留的内容、授权范围、输出规格——这些不能猜。**\n\n一份够用的起点，六行就行：\n\n```text\n作品用途：30 秒情绪品牌片，之后另做竖屏版。\n核心体验：从被催促变成可以慢一点。清爽，但不是冷。\n必须让观众读懂：产品是什么、什么时候用。不添加没确认过的功效。\n已有素材：包装主图、一个人物参考、一张室内场景参考。\n形式空间：允许少量非写实转场，人物和产品保持可辨认。\n待选择：音乐主导还是环境声主导？先比较两种。\n```\n\n这是创作简报，不是要输给视频模型的提示词。\n\n## 第二步：用不同的\"机制\"发展方向\n\n至少比较**表达机制**，不只是颜色和场景。\n\n一个方向由身体状态改变推动，一个由空间开合推动，一个由声音密度变化推动。每个方向写：一段感受稿、一段画面解释、一个最大的风险。\n\n比如\"声音密度\"方向的风险是：静音播放时信息变弱。\"身体变化\"方向的风险是：表演容易被夸大。\n\n**风险不是否定创意的理由，而是决定先试哪一点。**\n\n## 第三步：选方向时看四件事\n\n1. 是否贴近任务？\n2. 有没有辨识度？\n3. 核心信息容易接收吗？\n4. 现有条件能完成吗？\n\n别把\"最容易生成\"自动当最好，也别把\"最奇怪\"当最有创意。有时一个审美上的冒险值得做，但要说清它让什么变好、让什么变难。\n\n## 第四步：先试最可能推翻方案的那一点\n\n如果全片靠一处玻璃折射成立，先做它，不要先生成十张漂亮的人物图。如果全片靠一句\"听起来不舍但不煽情\"的台词成立，先试听。如果核心是两人交接道具，先试接触和去向。\n\n可以先用文字读稿、简单草图、已有素材剪出节拍，再决定值不值得生成。**不是所有验证都要付费调用。**\n\n## 第五步：把创意冻结到恰当的程度\n\n确定：表达方向、关键人物和物件、每段的结果。\n留开放：自然的小动作、非关键的装饰。\n\n选定的版本写成当前的创作说明，后续任务引用它，不把探索期的三个方案一起带进执行。\n\n\"冻结\"只是停止无理由的变化。真的发现更好的方案还可以改，但要让涉及的镜头、参考图和声音同步更新。\n\n## 交给生成环节的是什么\n\n选定的方向、实际素材清单、当前镜头任务、重要约束、这次要比较的点。**不必附上所有聊天记录和被否决的方案。** 模板见[工具箱](/practice/01-templates.md)。\n\n## 一句话记住\n\n**先把形容词翻译成问题，再用不同机制想三个方向，先试最危险的那一点，最后冻结。**\n\n## 动手试试\n\n想一句模糊的需求（\"做得温暖一点\"）。用第一步把\"温暖\"翻译成至少三个不同的问题。然后为其中一个问题想两个表达机制不同的方向，各写一个最大风险。\n\n# Citations\n\n[1] [这本书依据什么写成](/references/corpus.md)","toc":[{"id":"workflows-01-brief-to-options-section-0","title":"问题在哪里"},{"id":"workflows-01-brief-to-options-section-1","title":"第一步：把形容词翻译成问题"},{"id":"workflows-01-brief-to-options-section-2","title":"第二步：用不同的\"机制\"发展方向"},{"id":"workflows-01-brief-to-options-section-3","title":"第三步：选方向时看四件事"},{"id":"workflows-01-brief-to-options-section-4","title":"第四步：先试最可能推翻方案的那一点"},{"id":"workflows-01-brief-to-options-section-5","title":"第五步：把创意冻结到恰当的程度"},{"id":"workflows-01-brief-to-options-section-6","title":"交给生成环节的是什么"},{"id":"workflows-01-brief-to-options-section-7","title":"一句话记住"},{"id":"workflows-01-brief-to-options-section-8","title":"动手试试"}]},{"id":"workflows/02-text-to-image","path":"workflows/02-text-to-image.md","title":"22｜文字生图：先造一个能看懂的画面，再谈细节","description":"先判断你在做哪一种图，再按\"结构 → 关系 → 细节\"的顺序推进。别用高分辨率把错误的构图做得更精细。","type":"Playbook","group":"workflows","tags":["生图","构图","首帧"],"html":"<h1>22｜文字生图：先造一个能看懂的画面，再谈细节<\/h1>\n<h2 id=\"workflows-02-text-to-image-section-0\">先判断你在做哪一种图<\/h2>\n<p>概念探索、角色资产、场景资产、最终静帧、版式海报——这五种不是同一个任务。<\/p>\n<p>角色资产要身份和结构清楚。成片静帧可能更重气氛和视点。海报还要给信息排布留空间。<\/p>\n<p>如果任务是探索\"午后的松弛\"，可以放开人物和环境。如果任务是同一产品的新角度，那已经不是从零想象，应该用参考图或改图路线。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-1\">一张静帧的起草顺序<\/h2>\n<ol>\n<li>一句话定观看任务<\/li>\n<li>写主要对象和它们的关系<\/li>\n<li>给出构图和环境<\/li>\n<li>最后选少量的光、材料、风格<\/li>\n<\/ol>\n<p>抽象的感觉放在开头或结尾就够了，不必每句话都重复。<\/p>\n<pre tabindex=\"0\"><button aria-label=\"复制这一段\" class=\"copy-btn\" type=\"button\">复制<\/button><code class=\"language-text\">一张明亮、安静的生活方式产品静帧。浅色洗手台右侧放着一只半透明青绿色按压瓶，左侧留出干净空间。镜头与台面略成俯角，能看清瓶身正面和少量顶部结构。午后的柔光从侧窗进入，在墙上留下很淡的窗影。台面只有一小片尚未干透的水迹，没有铺满装饰叶片。画面轻盈、清爽，但保留生活里的温度。\n<\/code><\/pre>\n<p>这是虚构产品的探索稿。<strong>已经有真实包装时，要改成\"使用包装参考\"<\/strong>，别让这段自造的结构代替客户的产品。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-2\">按层比较，别一口气选\"最好看的\"<\/h2>\n<p><strong>第一轮看结构<\/strong>：主体突出吗？空白有用吗？机位能看清目标吗？\n<strong>第二轮看关系<\/strong>：人和产品的比例、环境的距离、道具是不是同一个世界的。\n<strong>第三轮看材料和细节<\/strong>：光、反射、颜色、文字、皮肤、局部形态。<\/p>\n<p>不用机械地生成三次。一张图同时满足就直接前进。<strong>但如果构图错了，别靠高分辨率和细纹把错误做得更精细。<\/strong><\/p>\n<h2 id=\"workflows-02-text-to-image-section-3\">修改时只说需要变的那一层<\/h2>\n<p>\"让左上更空一些，瓶子位置不变\"比重新描述整张图更聚焦。<\/p>\n<p>多轮之后整体漂移了，就回到最后一个可靠的版本，别在越来越差的图上不停叠改。<\/p>\n<p>同时检查：参考图是用来规定主体、风格，还是布局？不同平台对参考的用法不同，见<a href=\"#/workflows/08-model-adaptation\">工具适配<\/a>。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-4\">风格化不必都向摄影靠<\/h2>\n<p>插画可以用轮廓、色面和纹理。黏土动画的静帧可以保留手工压痕。图形海报可以没有实体光源。<\/p>\n<p><strong>给材质和媒介写出它自己的规则<\/strong>，别加一串不相容的摄影关键词。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-5\">输出前的检查<\/h2>\n<p>确认画幅、实际像素、颜色、最终的信息区。检查产品字标和结构。<\/p>\n<p><strong>如果这张图之后要变成视频<\/strong>，还要看起始姿势能不能接着动：双手在哪？头朝哪？主要道具有没有被挡住？<\/p>\n<p>一张图只是漂亮，却让后续的开盖、拿取、走动无从开始——那它是漂亮的静帧，不一定是好的首帧。下一步见<a href=\"#/workflows/04-image-to-video\">图生视频<\/a>。<\/p>\n<h2 id=\"workflows-02-text-to-image-section-6\">一句话记住<\/h2>\n<p><strong>先看结构，再看关系，最后看细节。构图错了，别用高清把错误做得更精致。<\/strong><\/p>\n<h2 id=\"workflows-02-text-to-image-section-7\">动手试试<\/h2>\n<p>写一张静帧的提示词，然后把它拆成三部分：哪些句子在说结构？哪些在说关系？哪些在说细节？
